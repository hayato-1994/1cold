成30年)", "q_num": "問6", "branch": "ハ", "theme": "アンモニア・鉱油の物性と伝熱阻害", "question": "アンモニアと冷凍機油（鉱油）とはほとんど溶け合わない。温度によって異なるが、油の粘度はアンモニア液の粘度よりも三桁ほど大きく、油の熱伝導率はアンモニア液の1/3ほどであり、伝熱面上の油膜は伝熱の障害となる。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "非相溶の鉱油は伝熱管に油膜を作り、粘度が約1000倍、熱伝導率が約1/3と劣るため著しい伝熱阻害要因となる。"}, {"id": 444, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ニ", "theme": "汚れ係数と熱通過率の低下特性", "question": "ローフィンチューブを用いる水冷凝縮器や満液式水冷却器の冷却管の外表面積基準の熱通過率は、汚れ係数の増大とともに減少する。この熱通過率は、汚れ係数の値が小さい範囲ではあまり変化しないが、汚れ係数の値が大きくなると大幅に低下する。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "熱通過率は「汚れ係数が小さい範囲で急激に大幅低下」し、汚れ係数が大きくなると低下の割合は緩やかになる（「小さい範囲ではあまり変化しない」は誤り）。"}, {"id": 445, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "イ", "theme": "ステッピングモータ式電子膨張弁", "question": "電子膨張弁で最も広く普及している方式はステッピング（パルス）モータ駆動方式であり、構成材料を適切に選択することにより、冷媒の種類に関係なく使用することができる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "パルス信号で弁開度を精密制御するステッピングモータ式が主流であり、耐食性等の材料選定によりあらゆる冷媒に適用できる。"}, {"id": 446, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ロ", "theme": "吸着チャージ式膨張弁の動作速度", "question": "温度自動膨張弁の感温筒のチャージ方式が吸着チャージ方式の場合、感温筒の温度が上昇すると吸着剤からガスが放出されて感温筒内のガス圧が上昇し、膨張弁の開度が大きくなる。吸着チャージ方式の膨張弁の動作は他のチャージ方式よりも速く、ハンチングを生じるおそれがある。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "吸着剤の熱移動と脱着を介するため動作速度は他方式より「遅く」、むしろ「ハンチングを防止する」特性を持つ（動作が速くハンチングのおそれは誤り）。"}, {"id": 447, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ハ", "theme": "内部均圧形膨張弁の圧力降下影響", "question": "乾式シェルアンドチューブ蒸発器に用いる内部均圧形の温度自動膨張弁は、蒸発器を流れる冷媒の圧力降下が小さければ、適切に過熱度制御が行える。しかし、蒸発器内の冷媒の圧力降下の大きさは、冷媒流量が増大するほど大きくなり、圧力降下の増大分だけ過熱度の制御偏差を生じる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "内部均圧形は弁出口圧力を基準とするため、蒸発器管内の圧力損失が大きいと出口での実過熱度が設定値より大きくなり制御偏差（オフセット）を生じる。"}, {"id": 448, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ニ", "theme": "オリフィス交換形温度自動膨張弁", "question": "オリフィス交換形の温度自動膨張弁は、配管内に膨張弁を取り付けたままオリフィスとニードルの弁体セットが交換できるような構造になっている。弁本体の配管接続部は交換可能な弁体セットの最大容量に合わせてあり、弁体セットの交換により、広範囲の容量に対応することができる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "配管から弁本体を取り外さずに内部の弁体カートリッジを交換でき、複数番手のオリフィスによりワイドな負荷容量に対応できる。"}, {"id": 449, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "イ", "theme": "蒸発圧力調整弁（EPR）の制御目的", "question": "蒸発圧力調整弁はEPRとも呼ばれる。温度自動膨張弁では、蒸発器内の蒸発圧力を制御することはできないが、蒸発圧力調整弁を使用すれば、蒸発圧力を設定値よりも高くならないように制御することができる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は蒸発圧力が設定値より「低く（下がら）ないように」制御する弁である（「高くならないように」は誤り）。"}, {"id": 450, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ロ", "theme": "凝縮圧力調整弁（CPR）と受液器の要否", "question": "凝縮圧力調整弁（CPR）は、空冷凝縮器の凝縮圧力が設定値以下にならないように制御するものである。凝縮器出口側に取り付けて、凝縮器の圧力が設定値以下に下がると、弁が閉方向に作動し、凝縮器に液を滞留させて凝縮圧力を制御するので、受液器を必要としない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "凝縮器内に冷媒液を溜め込んで圧力を保つ制御方式であるため、滞留分の余剰冷媒を逃がす「受液器が不可欠（必須）」である（「受液器を必要としない」は誤り）。"}, {"id": 451, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ハ", "theme": "温度式冷却水調整弁の特性", "question": "温度式冷却水調整弁は、感温筒と冷却水との間の熱の移動によって動作するために応答の遅れが大きく、緩やかな制御になり、急激な凝縮圧力の変化には、追従することができない。しかし、冷媒側と絶縁されて安全性が高く、調整弁の交換が容易である。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "感温筒による熱伝導作動のため応答は遅く急変には追従できないが、冷媒回路に直結しないため漏洩リスクがなく交換整備が容易である。"}, {"id": 452, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ニ", "theme": "吸入圧力調整弁（SPR）の設置目的", "question": "圧縮機の吸込み圧力が高くなると、圧縮機用電動機が過負荷となり焼損のおそれがある。これを防止するため、吸入圧力調整弁を圧縮機吸込み管に取り付ける。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（SPR）はクランクケース圧力が設定値以上に上がらないよう吸込み蒸気を絞り、モータの過負荷・焼損を確実に防止する。"}, {"id": 453, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "イ", "theme": "フロートスイッチの機能", "question": "フロートスイッチは、液面高さの上昇、下降にともなうフロートの動きを電気信号に変えて、これによって電磁弁が容器内に冷媒を送液したり、停止したりして、液面レベルの一定保持に使用される。また、液面レベルが上限に達したときに、警報を発したりするのにも用いられる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "満液式蒸発器や受液器の液面制御（給液電磁弁開閉）のほか、高液面警報や低液面カット用インターロックとして幅広く使用される。"}, {"id": 454, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ロ", "theme": "電磁弁の許容電圧変動範囲", "question": "電磁弁の作動電源は、直流用では12V, 24V, 100V、交流用では24V, 100V, 200Vが標準であるが、110V, 220Vもある。また、これらの定格電圧からの許容電圧変動は±15%以下である。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "電磁弁の定格電圧からの許容電圧変動は「±10%以内」である（「±15%以下」は誤り）。"}, {"id": 455, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ハ", "theme": "高圧圧力スイッチの復帰方式（安全用と制御用）", "question": "高圧圧力スイッチは、安全装置や圧力制御スイッチとして使用される。安全装置として使用する場合は、冷凍装置の停止した原因を修復してから運転再開する必要があり、原則として手動復帰形を使用しなければならない。圧力制御スイッチとして使用する場合は、自動復帰形を使用する。", "answer": "○", "law": "例示基準8、上級テキスト 制御機器編", "explanation": "安全保護用は原因究明と対策後に再起動させるため手動復帰形が原則。凝縮器ファン制御等の運転制御用には自動復帰形を用いる。"}, {"id": 456, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ニ", "theme": "ガスチャージ式サーモスタットの制限条件", "question": "ガスチャージ方式サーモスタットは、最高使用温度で感温筒に封入した媒体のすべてが気化し終わるように制限チャージしたもので、感温筒の温度に相当する飽和圧力で受圧部が動き、電気接点を開閉する。この方式は応答が速く、主に高温用に使われ、感温筒よりも受圧部の温度が低くないと正常に作動しない。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "ガスチャージ方式は主に「低温用」に使われ、感温筒内で凝縮液を維持して温度を感知させるため、「感温筒よりも受圧部（本体）の温度が高くなければならない」（受圧部が低くないと正常に作動しないは誤り）。"}, {"id": 457, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "イ", "theme": "フルオロカーボンでの油分離器の必要条件", "question": "フルオロカーボン冷凍装置においては、満液式蒸発器を使用する装置、蒸発温度が-40℃以下の低温の冷凍装置、配管距離が非常に長い装置、蒸発器の台数が多い装置などに、油分離器が必要である。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "油戻しが困難な満液式、油の粘度が高まる-40℃以下、油がクランクケースに戻るまで時間がかかる長配管・多台数系統では油分離器が必須。"}, {"id": 458, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ロ", "theme": "バッフル式油分離器の分離機構", "question": "油分離器は、冷凍装置の圧縮機と凝縮器との間に設置し、圧縮機吐出しガスに含まれている油を分離する。バッフル式の油分離器は、たて形円筒内のバッフル板により吐出しガスを旋回運動させ、油滴を遠心力で分離する方式である。フルオロカーボン冷媒用の油分離器は、分離した油をフロート弁により自動的に圧縮機クランクケースに返油する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "バッフル板に衝突させて油滴を分離するのは「衝突（バッフル）式」である。ガスを旋回させて遠心力で分離するのは「遠心力（サイクロン）式」であるため誤り。"}, {"id": 459, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ハ", "theme": "多台数蒸発器と高圧受液器容量", "question": "蒸発器が複数台設置されている冷凍装置では、それぞれの蒸発器の運転状態により蒸発器への冷媒液供給用電磁弁を開閉することがある。このように蒸発器の運転台数が変わったときには、全体の蒸発器内の冷媒量が大きく変化するので、冷媒量の変化を吸収できるような容量の高圧受液器を必要とする。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "冷却器の稼働台数変動に伴って系統内の必要冷媒液量が大きく変動するため、余剰液を安全に蓄えられる容量の高圧受液器が必要となる。"}, {"id": 460, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ニ", "theme": "低圧受液器の液面制御弁", "question": "冷媒液強制循環式冷凍装置に用いる低圧受液器は、蒸発器冷却管に低圧冷媒液を送り込むための液だめであり、運転状態が変化しても、冷媒液ポンプと蒸発器が安定した運転を続けられるように、温度自動膨張弁により送液量を調整し、液だめの液面高さを制御する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器の液面制御は過熱度制御を行う温度膨張弁ではなく、「フロート弁」または「フロートスイッチ＋電磁弁」によって行われる（温度自動膨張弁は誤り）。"}, {"id": 461, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "イ", "theme": "液ガス熱交換器の過冷却・過熱作用", "question": "フルオロカーボン冷凍装置に用いられる液ガス熱交換器は、凝縮器からの冷媒液と蒸発器からの冷媒蒸気との熱交換により、凝縮器からの冷媒液を過冷却して液管内での冷媒蒸気の発生を防止するとともに、蒸発器からの冷媒蒸気を適度に過熱するために用いられる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "液の過冷却によりフラッシュガスを防止し膨張弁能力を確保するとともに、吸込み蒸気を適度に過熱して液戻り・湿り運転を防止する。"}, {"id": 462, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ロ", "theme": "液分離器（アキュムレータ）の作用", "question": "フルオロカーボン冷凍装置に用いられる液分離器は、冷凍装置の蒸発器から圧縮機の間に設けられる。この液分離器を用いると、圧縮機吸込み蒸気に冷媒液または冷媒液滴が混入しないように、冷媒液を分離して蒸気だけを圧縮機に吸い込ませ、液戻りによる圧縮機の事故を防ぐことができる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "蒸発器〜圧縮機間に設置され、密度差と速度低下により気液分離して圧縮機への液戻り（液圧縮破壊）を防止する。"}, {"id": 463, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ハ", "theme": "満液式蒸発器の油回収器の熱源", "question": "フルオロカーボン冷凍装置に用いる油回収器では、満液式蒸発器内の油の濃度が高まらないように蒸発器から取り出した冷媒液と油を過熱し、冷媒蒸気と油に分離する。熱源には電気ヒータのほか、高圧冷媒液や高圧冷媒ガスが用いられる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "油濃度の高い液を抜き出して加熱蒸発させ、冷媒蒸気と油に分離する。加熱源には電気ヒータのほか高圧冷媒液や吐出しガスが利用される。"}, {"id": 464, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ニ", "theme": "冷媒液強制循環式での液分離器設置", "question": "大形冷凍装置などで利用される冷媒液強制循環式蒸発器では、冷媒を液ポンプで強制循環する。この蒸発器では、冷媒充てん量が乾式蒸発器よりも多く、液戻りを防ぐために液分離器を設ける必要がある。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "冷媒液強制循環式では「低圧受液器」そのものが大型の気液分離機能を兼ね備えているため、別途液分離器を設ける必要はない（設ける必要があるは誤り）。"}, {"id": 465, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "イ", "theme": "止め弁のグランド部取付向き", "question": "液配管に取り付けられている付属品の一つである止め弁は、耐圧、気密性能が十分であることが要求される。止め弁は、管と比べて圧力降下が大きく、冷媒漏れの原因となることもあるので、設置する数をできるだけ少なくし、弁のグランド部を下向きに取り付ける。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "弁のグランド部（軸封部）を下向きに取り付けると、油やゴミ、水分が溜まって漏洩やパッキン劣化の原因となるため、「下向きに取り付けてはならない」（下向きに取り付けるは誤り）。水平または上向きに取り付ける。"}, {"id": 466, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ロ", "theme": "銀ろうと黄銅ろうの特性比較", "question": "ろう付けに使用するろう材として銀ろう系のろう材がよく使われるが、黄銅ろう系のろう材も使用されている。ろう付け温度は銀ろう系のほうが黄銅ろう系よりも低い。銀ろう系ろう材は、溶融したろうの流動性がよく、強度も大きい。一方、黄銅ろう系ろう材は若干強度が劣る。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "銀ろう系（625〜700℃）は黄銅ろう系（850〜890℃）より融点が低く流動性・強度に優れる。黄銅ろう系は過熱で亜鉛蒸発による気泡を生じやすい。"}, {"id": 467, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管材料と低温靱性", "question": "冷媒配管に使用する材料は、冷媒の種類に応じた材料を選択して使用し、冷媒と冷凍機油の化学的および物理的な作用によって腐食および劣化しないことが必要である。低温で用いるフルオロカーボン用冷媒配管では、低温でも靱性の大きい材料を使用する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "アンモニアに銅系禁止、フルオロカーボンに高マグネシウムアルミ禁止などの適合性が必要。低温配管には低温脆性を避けるため靱性の高い材料を選定する。"}, {"id": 468, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ニ", "theme": "吸込み蒸気横走り管の勾配方向", "question": "吸込み蒸気配管の横走り管中にトラップがあると、軽負荷運転時に油や冷媒液がたまり、再始動時や軽負荷から全負荷に切り換わったときに液が圧縮機に戻る。冷媒液が圧縮機に戻るのを防ぐために、吸込み蒸気配管の横走り管は冷媒蒸気の流れ方向に上り勾配として、トラップをつくらないようにする。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "油や液の滞留を防いでスムーズに圧縮機に流すため、吸込み横走り管は冷媒の流れ方向に「下り勾配（1/200〜1/100程度）」とする（「上り勾配」は誤り）。"}, {"id": 469, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "イ", "theme": "圧力容器用安全弁の最小口径式", "question": "圧力容器用安全弁では、使用冷媒の種類と圧力容器の外径や全長などにより安全弁最小口径を決定し、圧力容器の圧力が過度に上昇しないようにする。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "必要最小口径 d = C * sqrt(D * L) （D:外径m, L:全長m）により容器の受熱外表面積とガス種に応じた口径を決定する。"}, {"id": 470, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ロ", "theme": "破裂板の口径と破裂圧力範囲", "question": "大形のフルオロカーボン用圧力容器に使用される破裂板は、圧力によって金属の薄板が破れる方式の安全装置であり、その最小口径は圧力容器に取り付けるべき安全弁の必要最小口径と同じとし、破裂圧力は安全弁の作動圧力以上で、耐圧試験圧力以下でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "破裂板の口径は安全弁と同等とし、破裂圧力は安全弁作動圧力以上かつ耐圧試験圧力以下（通常耐圧の0.8〜1.0倍）とする。"}, {"id": 471, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ハ", "theme": "高圧遮断圧力スイッチの接続と設定", "question": "高圧遮断圧力スイッチは、圧縮機吐出し部で吐出し圧力を正確に検出する位置に圧力誘導管を接続する必要があり、配管の下側（下面側）に圧力誘導管を接続することは避ける必要がある。また、設定圧力は、高圧部に取り付けられた内蔵安全弁を除くすべての安全弁の最低吹始め圧力以下で、かつ、高圧部の許容圧力以下の圧力で作動するように設定する。なお、設定圧力の精度は、設定圧力の範囲によって規定されている。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "油やスラッジの流入を防ぐため圧力導入管は配管上面から取り出す。設定圧力は安全弁吹始め以下・許容圧力以下で作動させる。"}, {"id": 472, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ニ", "theme": "アンモニア冷媒への破裂板使用制限", "question": "アンモニア冷媒の冷凍装置において、液封によって著しく圧力上昇のおそれがある部分には、安全弁、破裂板または圧力逃し装置を取り付けるが、安全弁と破裂板には放出管を取り付け、その開口部には放出されたガスを処理する除害装置などを設けなければならない。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "破裂板は一度破裂すると全量大気放出されるため、毒性・可燃性ガスである「アンモニア冷媒設備には破裂板を使用してはならない」（取り付けるとする記述は誤り）。"}, {"id": 473, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "イ", "theme": "圧力容器溶接部の機械試験と非破壊試験", "question": "法定の冷凍能力が20トン以上の冷媒設備の圧力容器の突合せ溶接部の試験には、機械試験と非破壊試験がある。また、溶接部は溶け込みが十分であり、かつ、割れまたはアンダーカット、オーバーラップ、クレータ、スラグの巻き込み、ブローホールなどの欠陥があってはならない。", "answer": "○", "law": "例示基準、上級テキスト 試験検査編", "explanation": "法定能力20トン以上の圧力容器突合せ溶接継手には引張・曲げ等の機械試験と、放射線透過・超音波等の非破壊試験が定められている。"}, {"id": 474, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ロ", "theme": "耐圧試験と気密試験の順序", "question": "気密試験は、空気または窒素ガスなどの不燃性で非毒性のガスを用い、試験する機器の気密性能を確認する。その後、水や油などの液体を使用する耐圧試験を実施して、機器の耐圧性能を確認する。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "機器の耐圧強度を先に確認するため「耐圧試験を最初に行い、その後に気密試験を実施する」のが正しい手順である（気密試験の後に耐圧試験を行うは誤り）。"}, {"id": 475, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ハ", "theme": "真空試験の到達圧力と漏れ特定限界", "question": "真空試験は、真空ポンプを使用し、装置内を周囲大気温度に相当する水蒸気飽和圧力以下とする。装置内に水分が存在すると、真空ポンプを止めた際に圧力が上昇してしまうため、十分に時間をかけて装置内部の水分を排出させる必要がある。また、真空試験は微量な漏れの有無は確認できるが、漏れ箇所の特定はできない。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "装置内水分の蒸発乾燥と微小漏れの全体系確認を行う。真空放置では圧力上昇により漏れの有無は判明するが、具体的にどこから漏れているかの位置特定はできない。"}, {"id": 476, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ニ", "theme": "耐圧試験時の材料許容応力", "question": "圧縮機、圧力容器などの耐圧強度を確認するために行う耐圧試験の圧力は、設計圧力に対して高いほうが信頼性も増すが、機器に変形を生じてはいけないので、加圧時に発生する応力を、その機器材料の引張強さよりも低くなるようにしなければならない。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "耐圧試験時に材料に生じる応力は、永久変形を起こさないよう引張強さではなく「材料の降伏点（耐力）よりも低く」抑えなければならない（引張強さよりも低くは誤り）。"}, {"id": 477, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "イ", "theme": "基礎底面の応力分布と不同沈下", "question": "機器の基礎底面にかかる荷重により地盤の不同沈下が起こらないようにするためには、荷重分布によらずに、機器の荷重をその基礎底面積で除した平均荷重が、地盤の許容応力よりも低くなっていればよい。", "answer": "×", "law": "上級テキスト 据付編", "explanation": "不同沈下を防ぐには、平均値だけでなく「どの部分の接地圧も地盤の許容応力以下」とし、偏荷重がないよう均等に荷重を分布させなければならない（「荷重分布によらずに平均荷重が低ければよい」は誤り）。"}, {"id": 478, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ロ", "theme": "冷媒充填量不足時の吐出し温度挙動", "question": "冷媒充てん量が不足すると、蒸発圧力が低下し、圧縮機の吸込み蒸気の過熱度が大きくなり、吐出し圧力と吐出しガス温度が低下する。さらに、冷凍能力も低下する。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "冷媒充填量不足時は、吸込み過熱度大・比体積増大・圧力比増大により「吐出しガス温度は上昇する」（「吐出しガス温度が低下する」は誤り）。"}, {"id": 479, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ハ", "theme": "フルオロカーボンの熱分解と窒素置換", "question": "フルオロカーボンが裸火や高温の物体に触れると、分解してフッ化水素やホスゲンなどの毒性の強いガスを生成するので、圧力容器や配管の修理を行うときは、内部に残留ガスがないことを十分に確認したのち、窒素に置換してから行うのが一般的である。", "answer": "○", "law": "上級テキスト 保守安全編", "explanation": "熱分解による有毒ガス発生および室内での酸欠・不完全燃焼を防ぐため、修理・溶接作業前には冷媒を全量回収し窒素置換を徹底する。"}, {"id": 480, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ニ", "theme": "フルオロカーボンの限界濃度と二酸化炭素", "question": "冷媒の放出により失神や重大な障害が起きることのないように限界濃度を定めているが、一般に使用されるフルオロカーボンの限界濃度は、二酸化炭素よりも高い。", "answer": "○", "law": "KHK施設基準、上級テキスト 保守安全編", "explanation": "冷媒漏洩時の限界濃度はR134aが0.25 kg/m3、R410Aが0.44 kg/m3であり、毒性・窒息作用の強い二酸化炭素（0.07 kg/m3）よりも高い値に設定されている。"}, {"id": 481, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "イ", "theme": "密閉圧縮機と開放圧縮機", "question": "小・中形の圧縮機では、圧縮機と電動機が同じ軸上に直結されて一つのケーシング内に収められた開放圧縮機が、フルオロカーボン冷凍装置に多く使用されている。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "圧縮機と電動機が同軸直結で同一ケーシング内に収められているのは「密閉圧縮機」である（「開放圧縮機」は電動機が外部にあり軸封装置を持つため誤り）。"}, {"id": 482, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ロ", "theme": "遠心圧縮機の構造と段数", "question": "遠心圧縮機は、羽根車を高速回転させ大量の冷媒蒸気を吸い込み、その蒸気を遠心力によって渦巻室へ送り込み圧縮する方式の圧縮機であり、大容量の空気調和用などに適している。低温用で使用するときは圧力比が大きくなるので、多段圧縮式を採用する必要がある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "高速回転羽根車で流速を与えディフューザ・渦巻室で静圧に変換する。1段当たりの圧力比が小さいため低温用では多段圧縮式が必要となる。"}, {"id": 483, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ハ", "theme": "スクロール圧縮機の圧縮機構", "question": "スクロール圧縮機は、うず巻状の曲線で構成された固定スクロールと旋回スクロールを組み合わせ、両スクロールの間に形成された圧縮空間容積を減少させて、吸込みガスを圧縮する。圧縮空間は、次第に容積を減少させながら中心部に向かって移動する。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "外周部からガスを吸い込み、旋回に伴い容積を縮小させながら中心吐出し口へ向かって連続的に移動圧縮する。"}, {"id": 484, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ニ", "theme": "コンパウンド圧縮機の特性", "question": "コンパウンド圧縮機は、二段圧縮の冷凍サイクルを実現するために、低段側と高段側の圧縮を1台の圧縮機で行えるようにしたものである。低段側と高段側の気筒数比によって、それぞれのピストン押しのけ量の比が決まってしまうので、中間圧力は最適値から若干のずれを生じることがある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "1台の圧縮機内に低段・高段気筒を備える。気筒数比（例：6気筒中低段4・高段2）で押しのけ量比が固定されるため、運転条件により中間圧力が理論最適値から若干外れることがある。"}, {"id": 485, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "イ", "theme": "ホットガスバイパス冷却専用液噴射弁", "question": "ホットガスバイパスによる容量制御では、ホットガスバイパス弁のほかに、ホットガス冷却専用の液噴射弁を取り付け、バイパス配管内でホットガスに冷媒液を混合して、ホットガスを冷却する場合がある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "吸込み管へ直接ホットガスを吹き込むと過熱度が高くなりすぎるため、冷却専用の液噴射弁（リキッドインジェクション弁）で液冷媒を混入・気化させて適正過熱度に冷却する。"}, {"id": 486, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ロ", "theme": "多気筒アンローダの制御段数", "question": "多気筒圧縮機のアンローダ機構は、一般に吸込み弁を開放して、作動気筒数を減らすことにより、容量を25〜100%の範囲で無段階に変えられるようになっている。また、圧縮機の始動時には、冷凍機油の油圧が正常に上がるまではアンロード状態になっており、圧縮機始動時の負荷軽減装置としても使われる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "多気筒往復圧縮機の吸込み弁開放アンローダは「段階的（例：4気筒なら50%・100%、8気筒なら25%・50%・75%・100%）」に容量を変えるものであり、「無段階に変えられる」は誤り。"}, {"id": 487, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ハ", "theme": "インバータ制御の体積効率と油圧", "question": "圧縮機の容量制御をインバータで行う場合、回転速度がある限定された範囲内では、体積効率はあまり変わらず、圧縮機の回転速度と容量はほぼ正比例するが、回転速度を大きく変えると低速回転時と高速回転時のいずれの場合にも体積効率が低下する場合がある。また、往復圧縮機でクランク軸に油ポンプを付けている圧縮機では、あまり低速にすると適正な油圧が得られなくなる。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "低速時は漏れ割合増大、高速時は弁抵抗増大で体積効率が低下する。軸駆動油ポンプ式では低速時に吐出油圧が不足し軸受焼付きの恐れがある。"}, {"id": 488, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ニ", "theme": "複数台圧縮機の発停制御方式", "question": "複数台の圧縮機をもった冷凍装置では、複数台の圧縮機を同時発停させて容量制御を行うことが一般的である。この容量制御方法では、複数台の圧縮機のクランクケース内の冷凍機油量が均一になるように、均油と均圧のための配管を設置する必要がある。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "容量制御は負荷変動に応じて複数台を「順次発停（ステップ制御）」させるのが一般的であり、「同時発停させて行う」は誤り（電源容量の急変や過負荷を招く）。"}, {"id": 489, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "イ", "theme": "低圧低下時の圧力比と吐出し温度", "question": "熱負荷の減少で圧縮機の吸込み蒸気圧力が正常な状態から異常に低下すると、圧縮機での圧力比が減少し、湿り圧縮運転状態となり、圧縮機の吐出しガス温度は低下する。一方、冷却水量が減少すると、圧力比の増大によって吐出しガス温度が上昇し、圧縮機が過熱運転となる場合がある。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "吸込み圧力が異常低下すると圧力比（P_cond/P_evap）は「増大」し、吐出しガス温度が上昇して「過熱運転」となる（「圧力比が減少し吐出し温度が低下」は誤り）。"}, {"id": 490, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ロ", "theme": "アンモニア往復機の油排出", "question": "冷凍機油は圧縮機の軸受、ロータやピストンなどの潤滑面に油膜をつくり、摩耗防止や摩擦によって生じる熱を除去する役割があるが、冷凍機油に鉱油を用いたアンモニアを冷媒とする往復圧縮機では、吐出しガス温度が高く、一般に圧縮機から吐き出された油を冷凍装置外部に排出する。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "アンモニア往復機は吐出し温度が高く非相溶の鉱油が熱劣化しスラッジ化するため、油分離器で捕集した油はクランクケースに戻さず機外へ抜き取る。"}, {"id": 491, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ハ", "theme": "弁漏れによる吐出し温度上昇の差異", "question": "往復圧縮機の吐出し弁からの漏れによる吐出しガス温度の上昇は非常に大きく、体積効率と断熱効率の低下を招く。吸込み弁板の割れや変形による漏れは、圧縮機の吐出しガス量が減少するので体積効率の低下を招くが、吐出しガス温度はあまり大きく上昇することはない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁漏れは高温高圧ガスの逆流再圧縮で吐出し温度が急上昇する。吸込み弁漏れは低圧側への逆流により体積効率は激減するが吐出し温度上昇は小さい。"}, {"id": 492, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ニ", "theme": "過熱運転の発生原因（電気・膨張弁）", "question": "往復圧縮機の過熱運転の原因としては、吐出しガス圧力の上昇や圧縮機の不具合などがある。密閉往復圧縮機では、これ以外に電源の異常な高電圧や低電圧などもある。蒸発器熱負荷が過大となり膨張弁容量が不足する場合も過熱運転となることがある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "密閉機では電圧異常によるモータ発熱や吸込み冷却不足が加わる。熱負荷過大による膨張弁容量不足も過熱度増大を招き過熱運転要因となる。"}, {"id": 493, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "イ", "theme": "水冷横形過充填時の過冷却度", "question": "受液器兼用の水冷横形シェルアンドチューブ凝縮器において、装置内に冷媒を過充てんすると、余分な冷媒液が凝縮器に貯えられ、多数の冷却管が冷媒液中につかり、冷媒蒸気の凝縮に有効な伝熱面積が減少し、凝縮温度が上昇する。一方、凝縮器出口の冷媒液の過冷却度は減少する。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "冷却管が液没すると気体凝縮面積が減り凝縮温度・圧力は上昇するが、冷媒液が冷却管群に接触して冷却されるため出口の過冷却度は「増大（大きく）」する（「減少する」は誤り）。"}, {"id": 494, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ロ", "theme": "冷媒・油の熱分解による不凝縮ガス", "question": "水分が冷媒に混入した状態で運転したり、高い吐出しガス温度で運転すると、冷媒と冷凍機油が分解して不凝縮ガスが生成する場合がある。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "水分の混入（加水分解）や高温運転による油・冷媒の熱分解・スラッジ化により、不凝縮性の気体成分が器内に生成される。"}, {"id": 495, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ハ", "theme": "水冷凝縮器の冷却水量減少の影響", "question": "水冷凝縮器において凝縮負荷と冷却水入口温度が変化しない場合、冷却水量の減少は、圧縮機駆動用電動機の消費電力の増加につながる。したがって、冷却水量の確保が必要である。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "水量が減少すると出入口水温差が拡大して出口水温・凝縮温度・凝縮圧力が上昇し、圧縮比増大により消費電力が増加する。"}, {"id": 496, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮圧力調整弁（CPR）の制御原理", "question": "空冷凝縮器を用いた冷凍装置において、冬季に外気温度低下により凝縮圧力が低下して膨張弁の容量が不足するときの対策として、凝縮圧力調整弁により凝縮器内に冷媒液を滞留させ、凝縮器の伝熱量を増加させて凝縮圧力を上昇させる方法がある。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "凝縮器内に液を滞留させるのは、冷却管を液没させて気相の「有効伝熱面積を減少」させ、放熱能力を抑えて圧力を上昇維持するためである（「伝熱量を増加させて」は誤り）。"}, {"id": 497, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "イ", "theme": "乾式シェルアンドチューブのブライン熱通過率", "question": "乾式シェルアンドチューブ蒸発器では、冷却管外に水を使用する場合に比べて、冷却管外にエチレングリコールなどのブラインを用いる場合のほうが、一般的に熱通過率は大きく、蒸発器を小さくすることができる。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "エチレングリコール等のブラインは水に比べて粘度が高く熱伝導率が低いため、熱通過率は「小さく」なり、同一能力では蒸発器伝熱面積を「大きく」設計する必要がある（誤り）。"}, {"id": 498, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ロ", "theme": "冷蔵用と空調用の圧力比・温度差比較", "question": "冷蔵用の冷凍装置では、空調用に比べて圧縮機の圧力比が小さく、蒸発圧力の変化が圧縮機駆動の軸動力に及ぼす影響は小さい。また、冷凍能力の減少を防止するために、蒸発温度と被冷却物との温度差は空調用に比べて小さく設定されている。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "冷蔵用は蒸発温度が低いため空調用よりも「圧力比が大きく」、蒸発圧力変化が軸動力に及ぼす影響は「大きい」（「圧力比が小さく影響は小さい」は誤り）。温度差を小さく（5〜10K）設定する点は正しい。"}, {"id": 499, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ハ", "theme": "冷媒不足・フラッシュガスと蒸発圧力", "question": "蒸発器には熱負荷に応じて膨張弁から冷媒液が供給されるが、冷媒充てん量が不足したり、液管にフラッシュガスが発生したりすると、蒸発圧力の異常低下などが起こることがある。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "冷媒充填量不足や液管内フラッシュガス発生は膨張弁の流量通過能力を激減させ、蒸発器への供給不足による蒸発圧力異常低下を招く。"}, {"id": 500, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ニ", "theme": "乾式と満液式の管凍結破損リスク比較", "question": "乾式シェルアンドチューブ蒸発器は、満液式シェルアンドチューブ蒸発器に比べて、運転中に蒸発圧力が低下してもブラインや水の凍結による冷却管の破損の危険性は少ない。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "満液式は細い管内を水・ブラインが流れるため凍結時に管を破裂させやすいが、乾式は管外（胴側）を流れるため凍結膨張による管破損リスクが少ない。"}, {"id": 501, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "イ", "theme": "ユニットクーラの並流と向流", "question": "温度自動膨張弁を使用するユニットクーラでは、感温筒取付け部の冷媒蒸気出口管の管内冷媒蒸気は、適度に過熱している。並流式のこの熱交換器では一般的に冷媒と空気との平均温度差が向流式よりも小さく、過熱部の管長が長くなり、向流式に比べて冷却に有利である。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "並流式は平均温度差が小さく過熱部管長が長くなるため伝熱上不利であり、「向流式に比べて冷却に有利である」は誤り（向流式のほうが有利）。"}, {"id": 502, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ロ", "theme": "アンモニアと鉱油の物性比較", "question": "温度によって異なるが、冷凍機油（鉱油）の粘度はアンモニア冷媒液の粘度よりも三桁程度大きく、冷凍機油の熱伝導率はアンモニア冷媒液の1/3程度であり、伝熱面上の油膜は伝熱の大きな障害となるので、伝熱面からできるだけ排除することが望ましい。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "鉱油の粘度はアンモニア液の約1000倍（3桁大）、熱伝導率は約1/3と劣るため、管内面に滞留・付着した油膜は著しい熱抵抗となり排除が必須。"}, {"id": 503, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ハ", "theme": "設計温度差と水あかによる凝縮温度上昇", "question": "ローフィンチューブを使用する水冷横形シェルアンドチューブ凝縮器では、設計時の冷媒と冷却水との算術平均温度差が大きなものほど、冷却管内面の水あかの汚れによる凝縮温度の上昇割合が大きくなる。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "外表面基準の熱流束が大きい（設計平均温度差Δtが大きい）設計ほど、汚れ係数増加に伴う管壁〜水側温度差Δtwの増大分が大きくなり、凝縮温度上昇割合が顕著となる。"}, {"id": 504, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ニ", "theme": "フィンコイル蒸発器の熱通過率と空気側抵抗", "question": "空気冷却用のフィンコイル乾式蒸発器では、冷媒と空気との算術平均温度差が大きくなると伝熱量（冷却能力）が増大する。ここで、伝熱量が増すと熱流束（熱流密度）が大きくなるので、冷媒側熱伝達率が大きくなり、熱通過率の値も同程度に大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "冷媒側熱伝達率は向上するが、全熱抵抗の大半を占める空気側熱伝達率が風速一定で変わらないため、「熱通過率の値も同程度に大きくなる」は誤り（熱通過率はあまり大きくならない）。"}, {"id": 505, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "イ", "theme": "外部均圧管の取付位置", "question": "外部均圧形温度自動膨張弁は蒸発器出口と膨張弁本体の均圧管接続部との間を均圧管で接続している。蒸発器出口側の均圧管取付位置は通常、膨張弁の感温筒取付位置より少し上流側とする。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "均圧管からの微小な冷媒漏洩が感温筒の温度検知に影響を与えないよう、均圧管は感温筒よりも「下流側（圧縮機側）」に接続する（「少し上流側とする」は誤り）。"}, {"id": 506, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ロ", "theme": "電子膨張弁のマイコン制御機能", "question": "電子膨張弁は、調節器によって幅広い制御特性にすることができる利点がある。また装置停止前のポンプダウンや、装置停止時の蒸発器への送液停止など各種の操作をマイクロコンピュータに組み込むことができる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "パルス制御により過熱度を自在にコントロールでき、全閉機能により電磁弁を兼用させてポンプダウンや停止時遮断をマイコン上で統合制御できる。"}, {"id": 507, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ハ", "theme": "定圧自動膨張弁の過熱度制御機能", "question": "定圧自動膨張弁には、弁出口または蒸発器出口のいずれかの圧力を検知して制御の動作をする内部均圧形と外部均圧形とがある。温度自動膨張弁と比べて、過熱度制御が優れており、熱負荷の変動の大きな装置での使用に適している。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "定圧自動膨張弁は圧力を一定に保つ弁であり「過熱度制御はできない」。負荷変動が大きいと液戻りや過熱を招くため「熱負荷変動の大きな装置には適さない」（誤り）。"}, {"id": 508, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ニ", "theme": "キャピラリチューブの自己調整と過熱度", "question": "キャピラリチューブは、熱負荷変動が小さく受液器を持たない小容量の冷凍装置に用いられ、その自己調整機能により凝縮器の圧力と過冷却度を制御する特性を持っている。その反面、蒸発器の圧力の影響は受けにくく、蒸発器出口の過熱度制御には使用できない。", "answer": "○", "law": "上級テキスト 膨張機構編", "explanation": "負荷変動の小さい小形冷蔵庫等に用いられ凝縮圧力と過冷却度を自律平衡させる。蒸発器出口過熱度に応じた開度調整機能はないため過熱度制御には使えない。"}, {"id": 509, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "イ", "theme": "蒸発圧力調整弁（EPR）と感温筒の位置", "question": "蒸発圧力調整弁は蒸発圧力が一定値以下にならないように制御する調整弁である。蒸発圧力調整弁を温度自動膨張弁と組み合わせて使用する場合には、膨張弁の感温筒は蒸発圧力調整弁の上流に取り付けなくてはならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "EPRは蒸発圧力を一定値以上に保つ。感温筒は蒸発器本来の出口過熱度を感知させるため、必ずEPRの「上流側（蒸発器直後）」に取り付ける。"}, {"id": 510, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ロ", "theme": "空冷凝縮圧力調整弁（CPR）と受液器", "question": "凝縮圧力調整弁は空冷凝縮器の冬季運転時における凝縮圧力の異常な低下を防止し、冷凍装置を正常な運転にするための圧力調整弁である。凝縮圧力調整弁による凝縮圧力の制御は、凝縮器への液の滞留による方法であり、その滞留分だけ、装置の冷媒充てん量に多少の余裕を必要とするので、受液器がなければならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "冬季の凝縮器内液滞留制御では余剰液の吸収と液管内フラッシュガス防止のため高圧受液器の設置が不可欠である。"}, {"id": 511, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ハ", "theme": "温度式冷却水調整弁の応答性", "question": "冷却水調整弁には、凝縮圧力または凝縮温度を検知して作動するものがある。温度式冷却水調整弁の特徴は、圧力式に比べて、一般的に弁の応答が速く、冷媒側と絶縁されて安全性が高く、調整弁の交換が容易なことである。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "温度式は感温筒と水との伝熱を介するため「圧力式に比べて弁の応答が遅く（緩やか）」である（「応答が速く」は誤り）。"}, {"id": 512, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ニ", "theme": "吸入圧力調整弁（SPR）による過負荷防止", "question": "ホットガスデフロスト後や長期間停止後に始動する場合などに予期しない圧縮機吸込み圧力の上昇があると、圧縮機用電動機が過負荷になる危険がある。吸入圧力調整弁はこれらの問題に対処するために、圧縮機吸込み圧力を一定値以上に上昇させないように制御する。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "デフロスト後やホットスタート時の高負荷蒸気圧力を絞って圧縮機吸込み圧力を設定値以下に抑え、モータの過負荷トリップや焼損を防止する。"}, {"id": 513, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "イ", "theme": "圧力式断水リレーとフロースイッチ", "question": "圧力式断水リレーは冷却水出入口間の差圧の変化を検出し、その信号で警報を発し、圧縮機を停止させる。圧力降下の少ない流路にはフロースイッチと呼ばれる流量式を用いる。フロースイッチは、圧力降下が不明でも、水圧がどうであっても自由に選択できる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "配管圧力損失が小さい冷却水路では差圧検知が難しいためパドル式等のフロースイッチ（流量式）が選定される。"}, {"id": 514, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ロ", "theme": "油圧保護圧力スイッチの作動時間", "question": "油圧保護圧力スイッチは、圧縮機の軸受などが油の潤滑不良により焼付き事故を起こすことを防止するための保護装置である。圧縮機の運転中に給油圧力が定められた圧力を一定時間以上保持できない場合には、圧力スイッチの電気接点を「開」にして圧縮機を停止させる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "差圧給油圧力が設定値以下に低下した状態が約90秒継続した場合にヒータ作動で接点を開き、圧縮機を停止させて軸受焼付きを防ぐ。"}, {"id": 515, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ハ", "theme": "ガスチャージ式サーモスタットの特性", "question": "ガスチャージ方式の蒸気圧式サーモスタットは、最高使用温度で感温筒に封入した媒体のすべてが気化し終わるように制限チャージしたものであり、感温筒内の液量が少ないために応答が速く、主に低温用に使われている。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "制限チャージにより最高設定温度で液が全気化するため過大圧力を防ぎ応答が速い。感温筒内が受圧部より低温となる低温制御に適する。"}, {"id": 516, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ニ", "theme": "フロート弁の液面変動幅", "question": "フロート弁は液面レベルの上下変動に対する対応が遅く、フロートスイッチに手動膨張弁と電磁弁とを組み合わせた場合よりも、液面レベルの変動が大きくなるが、電気配線が不要で、配管も簡単であり、保守が容易であるという利点がある。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "フロート弁は液面変化に比例して直接連続給液するため、オンオフ動作するフロートスイッチ＋電磁弁よりも「液面レベルの変動を小さく（滑らかに）」できる（変動が大きくなるは誤り）。"}, {"id": 517, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "イ", "theme": "油分離器の必要用途", "question": "油分離器を必要とする冷凍装置は、冷凍機油が装置内の凝縮器や蒸発器に入り込むと伝熱作用を阻害する装置、低温で油の粘度が高くなり蒸発器からの油戻しが難しい装置、油が冷媒系統を循環して圧縮機に戻ってくるまでに時間がかかる装置などである。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "アンモニア装置、蒸発温度-40℃以下の極低温装置、長配管・多台数系統などで油分離器の設置が要求される。"}, {"id": 518, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ロ", "theme": "高圧受液器の容量設計", "question": "高圧受液器には、運転中の大きな負荷変動、冷却器の運転台数の変化、ヒートポンプ装置の運転モードの切換え、空冷凝縮器での寝込みなどによる冷媒量の変化を吸収する容積をもたせ、さらに冷媒充てん量の全量または大部分の量を受液器容量の80%以内で回収できる容量をもたせる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "運転時の系統内液量変動の吸収と、ポンプダウン回収時に受液器内容積の80%以内に全冷媒を安全に収容できる容量が必要。"}, {"id": 519, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ハ", "theme": "アンモニア装置の乾燥器使用", "question": "フルオロカーボン冷凍装置では、シリカゲルやゼオライトの乾燥剤を用いて冷媒系統の水分を吸着除去する。アンモニア冷凍装置でも、一般的に同様の乾燥剤を用いて水分を除去する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニアは水分と極めて強く溶解結合（アンモニア水化）するため吸着乾燥剤が機能せず、アンモニア装置にろ過乾燥器は使用しない（同様の乾燥剤を用いて水分除去は誤り）。"}, {"id": 520, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ニ", "theme": "低圧受液器の気相空間の重要性", "question": "一般的な低圧受液器は、液ポンプにより冷媒液を冷却器に送り出すための液位が確保されていれば、上部の冷媒蒸気の空間の大きさには関係なく、低圧受液器のある冷凍装置は安定して運転できる。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器は液分離器を兼ねており、上部気相空間が狭いと冷媒蒸気流速が上がり液滴を圧縮機に巻き込む（液戻り）ため、「上部気相空間の大きさも極めて重要」である（関係なく安定運転できるは誤り）。"}, {"id": 521, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア冷凍装置の液ガス熱交換器", "question": "フルオロカーボン冷凍装置では、液配管が長い場合や液配管の立ち上がりが高いときの対策として、液ガス熱交換器で高温液と低温蒸気とを熱交換し、高温液に適度な過冷却度をもたせる方法がある。アンモニア冷凍装置でも、液ガス熱交換器は同様の目的で一般的に用いられる。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニア冷凍装置では吸込み過熱による吐出しガス温度上昇が激しく油炭化等を招くため、「液ガス熱交換器は使用しない」（一般的に用いられるは誤り）。"}, {"id": 522, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ロ", "theme": "小形アキュムレータのU字管機構", "question": "小形のフルオロカーボン冷凍装置に用いられるU字管を内蔵した液分離器では、入口から入った液滴を含んだ冷媒蒸気は、流れ方向の変化と速度の低下によって、液と蒸気に分離される。分離された容器底部の油と冷媒液は、U字管底部にあけられた小さな孔から、少量ずつ圧縮機へ吸い込まれる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "重力・遠心分離で気液を分け、U字管底部のメタリングオリフィス（小孔）から油と微量冷媒液を吸気流に乗せて少しずつ圧縮機へ返油する。"}, {"id": 523, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ハ", "theme": "不凝縮ガス分離器の必要圧力条件", "question": "不凝縮ガス分離器は、おもに大形冷凍装置に用いられ、低圧側の運転圧力が大気圧以上の装置より大気圧以下で運転する装置のほうが設置の必要性は高い。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "蒸発圧力が大気圧以下（真空域）となる低温冷凍装置では軸封部や配管継手から空気が機内へ吸い込まれやすいため、不凝縮ガスパージャーの必要性が特に高い。"}, {"id": 524, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ニ", "theme": "強制循環蒸発器の油戻し配管", "question": "冷媒液強制循環式蒸発器では、一般に液ポンプにより蒸発量の3〜5倍の冷媒量を流す。また、冷凍機油の処理を行うために、一般的に、蒸発器本体に油戻し用の配管を設ける。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "強制循環式では油は冷媒液とともに低圧受液器に戻るため、蒸発器本体に油戻し配管を設けるのは「満液式蒸発器」である（誤り）。油処理は低圧受液器まわりで行う。"}, {"id": 525, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "イ", "theme": "圧縮機・凝縮器同高時の吐出し管勾配", "question": "圧縮機と凝縮器が同じ高さに設置されている場合、圧縮機から凝縮器への吐出しガス配管は、圧縮機からいったん立ち上がり管を設けて、凝縮器へ上り勾配で配管する。これは停止中に吐出しガス配管内の油が圧縮機へ戻りやすくするためである。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "停止中に吐出し配管内の油や凝縮液が圧縮機ヘッドに逆流するのを防ぐため、立ち上げた後は凝縮器に向かって「下り勾配」で配管する（「上り勾配」は誤り）。"}, {"id": 526, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ロ", "theme": "異高多台数蒸発器の吸込み配管施工", "question": "2台以上のフィンコイル乾式蒸発器が異なった高さに設置されている場合には、それぞれの蒸発器出口の吸込み蒸気配管はトラップを設けてから蒸発器の上部まで立ち上げる。その後、吸込み蒸気配管の主管への接続は、主管の上部から行う。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "停止中の蒸発器への油や液の逆流流入を防ぐため、出口にトラップを設けて蒸発器上部まで立ち上げ、主管へは上面（上部）から合流接続する。"}, {"id": 527, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ハ", "theme": "銅管ろう付けのはまり込み隙間", "question": "銅管の接続に用いるろう付けは、はまり込み深さと隙間が重要であり、外径25mm未満の銅管であれば、ろうを流し込むためにゆったりとした隙間が必要で、管の外径と継手の内径との隙間は1mm程度である。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "ろう付けは毛細管現象を利用して溶ろうを吸入浸透させるため、隙間は「0.05〜0.35 mm程度（非常に狭い隙間）」とする（「1 mm程度」は広すぎて毛細管現象が働かず不健全となるため誤り）。"}, {"id": 528, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ニ", "theme": "サービスバルブの構造と用途", "question": "サービスバルブは、バックシート（逆座）とサービスポートをもった止め弁であり、圧力計の取付け、気密試験のためのガス充てん、冷媒の補充などに用いられる。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "全開位置で弁棒パッキン部をシールするバックシート構造を持ち、サービスポートを利用して圧力測定や冷媒充填・真空引き作業を行う。"}, {"id": 529, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "イ", "theme": "高圧遮断スイッチの自動復帰許容範囲", "question": "高圧遮断圧力スイッチは原則として手動復帰形とするが、毒性ガス以外の冷媒を用いた自動運転方式の冷凍装置では自動復帰形を用いてもよい。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "自動復帰形が認められるのは「可燃性・毒性以外の冷媒で、冷凍能力10トン未満のユニット式設備等」に限られており、「毒性ガス以外であればすべて自動復帰でよい」わけではない（誤り）。"}, {"id": 530, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ロ", "theme": "圧縮機用と容器用安全弁の最小口径式", "question": "冷凍装置に用いられる安全弁の必要最小口径は、圧縮機用では冷媒ガスの種類と圧縮機のピストン押しのけ量など、圧力容器用では冷媒ガスの種類と圧力容器の外径、全長などによりそれぞれ決定する。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "圧縮機用は d = C1 * sqrt(V1) （押しのけ量基準）、圧力容器用は d = C3 * sqrt(D * L) （容器受熱外表面積基準）により最小口径を決定する。"}, {"id": 531, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ハ", "theme": "溶栓と破裂板の作動原理の差異", "question": "圧力容器に取り付ける溶栓の口径は取り付けるべき安全弁の口径の1/2以上、破裂板の口径は取り付けるべき安全弁の口径と同一であり、どちらも圧力容器の温度により作動する。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "溶栓は所定の「温度」で合金が溶融して作動するが、破裂板は金属薄板が所定の「圧力」で破れる安全装置である（「どちらも温度により作動」は誤り）。"}, {"id": 532, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ニ", "theme": "低圧受液器への溶栓使用制限", "question": "液封事故を起こしやすい二段圧縮冷凍装置の過冷却液管や冷媒液強制循環式冷凍装置の低圧受液器には、安全弁または溶栓を設けなければならない。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "液封は温度上昇に伴う圧力上昇破壊であるため「安全弁、破裂板または圧力逃がし装置」を取り付ける。火災受熱保護用の「溶栓」を液封防止安全弁の代用として低圧受液器等に設けることは認められない（誤り）。"}, {"id": 533, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "イ", "theme": "試験圧力の銘板表示（ゲージ圧力）", "question": "耐圧試験と気密試験を実施した圧力は保安上重要な事項であり、被試験品本体の銘板や刻印に絶対圧力で表示しなければならない。耐圧試験は実際の使用状態での耐圧性能が満足な状態にあることを確認し、気密試験は組み立て品および配管が完了した設備において気密を確認するために行う。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "銘板や刻印に表示すべき試験圧力は「ゲージ圧力（MPaG）」である（「絶対圧力」は誤り）。試験目的の記述自体は正しい。"}, {"id": 534, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ロ", "theme": "液体耐圧試験の手順と8/10降圧検査", "question": "耐圧試験を液体で行う場合には、被試験品に液体を満たし、空気を完全に排除した後、圧力を耐圧試験圧力まで上げて、その試験圧力を1分間以上保っておく。その後、圧力を耐圧試験圧力の8/10まで降下させ、異常がないことを確認する。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "液体耐圧は耐圧圧力で1分間保持後、8/10の圧力まで降圧して溶接部・ガスケット・本体の漏れや変形・破壊の有無を検査する。"}, {"id": 535, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ハ", "theme": "機器組み立て品のガス気密試験", "question": "冷媒設備の配管を除く構成機器の個々の組み立て品について行う気密試験は、耐圧強度が確認された機器について、漏れの確認が容易にできるようにガス圧試験で行う。試験に使用するガスは空気または不燃性、非毒性ガスを用いる。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "耐圧試験合格後の機器に対し、空気や窒素等の不燃性・非毒性ガスによるガス圧試験で微小漏れを検査する（酸素等の支燃性・可燃性ガスは禁止）。"}, {"id": 536, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ニ", "theme": "真空試験の漏れ特定限界", "question": "真空試験において装置内に水分が存在すると、真空ポンプを止めた際に圧力が上昇してしまうため、十分に時間をかけて冷凍装置内部の水分を排出させる必要がある。微少な漏れの漏れ箇所を特定するためには、気密試験より真空放置試験が適している。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "真空放置試験は全体系での漏れの有無判定には極めて有効だが、「漏れ箇所の特定はできない」。漏れ箇所の特定には発泡液や検知器を用いる気密加圧試験が適している（誤り）。"}, {"id": 537, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "イ", "theme": "冷蔵倉庫床下の凍上現象と対策", "question": "凍上は、1階の冷蔵室床下の土壌が氷結して体積が膨張し、床面が盛り上がる現象である。床下の構造や土壌の性質は凍上の発生に大きく影響するが、床の防熱材を十分に厚くしても凍上防止策にならない。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "長期間低温を維持すると防熱層を貫通して地盤温度が0℃以下となり地下水が凍結膨張して床を隆起させる。防熱材の増厚だけでは防げず、高床式（通気空間）やヒータ埋設などの積極的凍上防止策が不可欠。"}, {"id": 538, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ロ", "theme": "蒸発式凝縮器の耐震固定", "question": "屋外に設置する空冷凝縮器と蒸発式凝縮器は重く、重心も比較的高い。このため、地震によって据付け位置がずれることがあるので注意が必要である。したがって、設置する基礎の鉄筋を強固に組み合わせ、床盤の鉄筋に固く結び付け、また凝縮器本体と基礎も十分に固定する必要がある。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "重量が大きく重心が高い屋外機器は、地震時の転倒や位置ズレによる接続冷媒配管破断を防ぐため、スラブ鉄筋直結基礎と十分なアンカーボルト固定を行う。"}, {"id": 539, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ハ", "theme": "試運転開始前の点検項目とデータ採取", "question": "冷凍装置の試運転を行う場合、試運転開始前に電力系統、制御系統、冷却水系統、冷媒系統の冷媒量、冷凍機油量、弁の開閉状態などを点検することが必要である。これらの点検の後、装置の始動試験を行い、異常がなければ数時間運転を継続し、運転データを採取する。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "配線・油量・冷媒量・弁開閉の事前点検を完了した上で始動し、数時間の安定連続運転を行って各部温度・圧力データを記録確認する。"}, {"id": 540, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ニ", "theme": "アンモニアの燃焼性と防爆除外理由", "question": "アンモニアは毒性があり、多量に浴びると死に至る危険がある。一方、燃焼性はなく、アンモニアを冷媒とする冷凍装置において、電気設備に対して防爆性能を必要としない。", "answer": "×", "law": "上級テキスト 冷媒編", "explanation": "アンモニアの爆発限界は15〜28%であり「可燃性ガス」である（「燃焼性はなく」は誤り）。下限界が15%と比較的高いため冷凍保安規則上防爆構造が免除されているにすぎない。"}];

let currentList = [...allQuestions];
let currentIndex = 0;
let correctCount = 0;
let incorrectCount = 0;
let wrongIds = new Set(JSON.parse(localStorage.getItem('1cold_wrong_ids') || '[]'));

function applyFilters() {
  const selectedSub = document.getElementById('subjectFilter').value;
  const selectedYear = document.getElementById('yearFilter').value;
  const selectedOrder = document.getElementById('orderFilter').value;
  
  let list = allQuestions.filter(q => {
    if (selectedSub !== 'ALL' && q.subject !== selectedSub) return false;
    if (selectedYear !== 'ALL' && q.year !== selectedYear) return false;
    return true;
  });
  
  if (selectedOrder === 'wrongOnly') {
    list = list.filter(q => wrongIds.has(q.id));
    if (list.length === 0) {
      alert('現在「要復習（間違えた問題）」はありません。\n通常モードで学習を進めてください。');
      document.getElementById('orderFilter').value = 'sequential';
      return applyFilters();
    }
  } else if (selectedOrder === 'random') {
    list.sort(() => Math.random() - 0.5);
  }
  
  currentList = list;
  currentIndex = 0;
  correctCount = 0;
  incorrectCount = 0;
  renderQuestion();
}

function renderQuestion() {
  if (currentList.length === 0) {
    document.getElementById('questionText').textContent = '該当する問題がありません。';
    return;
  }
  const q = currentList[currentIndex];
  document.getElementById('badgeSub').textContent = q.subject;
  document.getElementById('badgeYear').textContent = q.year;
  document.getElementById('badgeNum').textContent = `${q.q_num} 肢${q.branch}`;
  document.getElementById('badgeTheme').textContent = q.theme;
  document.getElementById('questionText').textContent = q.question;

  document.getElementById('btnMaru').disabled = false;
  document.getElementById('btnBatsu').disabled = false;
  document.getElementById('actionButtons').style.display = 'grid';
  document.getElementById('explanationBox').style.display = 'none';

  updateStats();
}

function checkAnswer(userChoice) {
  const q = currentList[currentIndex];
  const isCorrect = (userChoice === q.answer);
  
  document.getElementById('btnMaru').disabled = true;
  document.getElementById('btnBatsu').disabled = true;

  const expBox = document.getElementById('explanationBox');
  const resultTitle = document.getElementById('resultTitle');
  const lawTag = document.getElementById('lawTag');
  const expText = document.getElementById('expText');

  expBox.className = 'explanation-box ' + (isCorrect ? 'correct' : 'incorrect');
  resultTitle.className = 'result-title ' + (isCorrect ? 'correct' : 'incorrect');

  if (isCorrect) {
    correctCount++;
    resultTitle.innerHTML = `⭕ 正解！（正答：${q.answer}）`;
    if (wrongIds.has(q.id)) {
      wrongIds.delete(q.id);
      localStorage.setItem('1cold_wrong_ids', JSON.stringify([...wrongIds]));
    }
  } else {
    incorrectCount++;
    resultTitle.innerHTML = `❌ 不正解...（正答：${q.answer}）`;
    wrongIds.add(q.id);
    localStorage.setItem('1cold_wrong_ids', JSON.stringify([...wrongIds]));
  }

  lawTag.textContent = q.law;
  expText.textContent = q.explanation;
  expBox.style.display = 'block';

  expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  updateStats();
}

function nextQuestion() {
  if (currentIndex + 1 < currentList.length) {
    currentIndex++;
    renderQuestion();
  } else {
    alert(`全問終了しました！\n正解数: ${correctCount} / ${currentList.length} 問\n正解率: ${Math.round((correctCount / currentList.length) * 100)}%`);
    currentIndex = 0;
    renderQuestion();
  }
}

function updateStats() {
  const total = currentList.length;
  const currentNum = total > 0 ? currentIndex + 1 : 0;
  document.getElementById('currentIdxText').textContent = `${currentNum} / ${total} 問 (要復習: ${wrongIds.size}問)`;

  const answered = correctCount + incorrectCount;
  const rate = answered > 0 ? Math.round((correctCount / answered) * 100) : 0;
  document.getElementById('scoreText').textContent = `正解率: ${rate}% (正: ${correctCount} / 誤: ${incorrectCount})`;

  const progress = total > 0 ? ((currentIndex) / total) * 100 : 0;
  document.getElementById('progressFill').style.width = progress + '%';
}

function resetStats() {
  if (confirm('間違えた問題の履歴と回答カウントをリセットしますか？')) {
    wrongIds.clear();
    localStorage.removeItem('1cold_wrong_ids');
    correctCount = 0;
    incorrectCount = 0;
    currentIndex = 0;
    renderQuestion();
  }
}

applyFilters();
</script>
</body>
</html>
