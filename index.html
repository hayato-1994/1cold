途中のガスバイパス等により吐出しガス温度が高くなることがある。"}, {"id": 909, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "イ", "theme": "往復圧縮機の潤滑方式", "question": "往復圧縮機の潤滑の方法として、はねかけ式、強制給油潤滑式がある。はねかけ式では、クランクケース内の油量が少ないと潤滑が不十分となり、油量が多すぎると圧縮機からの油上がり量が多くなる。強制給油潤滑式では、油圧が低くなりすぎると油圧保護圧力スイッチが作動して、圧縮機が停止する。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "はねかけ式は小形で用いられ油量過不足が潤滑不良や油上がりを招く。強制給油式では油圧低下時に油圧保護圧力スイッチ（OPS）が作動して圧縮機を保護停止する。"}, {"id": 910, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ロ", "theme": "吸込み弁漏れ時の吐出し温度", "question": "往復圧縮機の吐出し弁の弁板の割れや変形による逆流によって、吐出しガス温度は高くなり、体積効率と断熱効率の低下を招く。また、吸込み弁の漏れは、圧縮機の吐出しガス量が減少するので、吐出しガス温度は大きく上昇し、体積効率の低下を招く。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁漏れは高温ガスの再圧縮で吐出し温度が大きく上昇するが、吸込み弁漏れは吸込み側への逆流のため体積効率は低下するものの吐出しガス温度はあまり大きく上昇しない（「大きく上昇し」は誤り）。"}, {"id": 911, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ハ", "theme": "オイルフォーミングの発生機構", "question": "フルオロカーボン冷媒を用いた冷凍装置では、圧縮機停止中の冷凍機油温が低いときに、冷凍機油に冷媒が溶け込む割合が大きくなる。このような状態で往復圧縮機を始動すると、クランクケース内の圧力が急速に低下するので、冷凍機油に溶け込んでいる冷媒が急激に気化し、冷凍機油が沸騰したようなオイルフォーミングが発生する。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "停止中に油に多量溶解した冷媒が、始動時のクランクケース急減圧によって一気に沸騰気化し激しく発泡する現象がオイルフォーミングである。"}, {"id": 912, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ニ", "theme": "手動短時間停止時のポンプダウン", "question": "圧縮機の運転を手動で短時間停止する場合には、冷媒液配管での液封の防止および始動時の冷媒液戻り防止のために、受液器液出口弁を閉じてからしばらく運転し、低圧側の冷媒液を受液器に回収する。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "液出口弁を閉じて低圧側冷媒を高圧受液器に回収（ポンプダウン）してから停止することで、停止中の液封や再始動時の液戻り事故を未然に防止する。"}, {"id": 913, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "イ", "theme": "水冷凝縮器の凝縮圧力上昇原因", "question": "水冷凝縮器における凝縮圧力上昇の原因として、冷却水ポンプの吸込み管でのストレーナの目詰まり、吸込み管内面への水あかの付着、散水ノズルの閉塞、冷却塔の水位の低下、冷却管への水あかや油膜の付着、受液器への凝縮液の落ち込み不良、冷媒や冷凍機油の分解などが挙げられる。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "冷却水量不足（ストレーナ詰まり・水位低下）、冷却管の熱抵抗増大（水あか・油膜）、液滞留による凝縮面積減少、不凝縮ガス発生などはすべて凝縮圧力上昇の原因となる。"}, {"id": 914, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮圧力調整弁（CPR）の取付位置", "question": "空冷凝縮器を用いた冷凍装置では、冬季の外気温度低下によって、凝縮圧力が低下して膨張弁の容量が不足する。この対策として、凝縮器入口側に設置した凝縮圧力調整弁により、凝縮器内に冷媒液を滞留させ、凝縮圧力を上昇させる方法がある。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "凝縮圧力調整弁（CPR）は、凝縮器内に液を滞留させるため「凝縮器出口側」に設置する（「入口側に設置」は誤り）。"}, {"id": 915, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ハ", "theme": "水冷凝縮器の冷媒過充填時の過冷却度", "question": "受液器兼用の水冷横形シェルアンドチューブ凝縮器において、装置内に冷媒を過充てんすると、余分な冷媒液が凝縮器に貯えられ、多数の冷却管が冷媒液中につかり、冷媒蒸気の凝縮に有効な伝熱面積が減少し、凝縮温度が上昇する。一方、凝縮器出口の冷媒液の過冷却度は小さくなる。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "冷却管が液没すると気体凝縮面積が減り凝縮温度は上昇するが、液冷却面積が増えるため出口過冷却度は「大きく」なる（小さくなるは誤り）。"}, {"id": 916, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ニ", "theme": "満液式蒸発器の散水デフロスト前処理", "question": "満液式蒸発器において、散水方式のデフロストを行うときには、散水する前に冷媒液の供給を止めて、あらかじめ、コイル内の冷媒を回収するか、補助受液器に冷媒液を移動させてから、散水を実施する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "満液式蒸発器内に多量の冷媒液が残ったまま散水すると急激な沸騰蒸発で異常高圧が生じるため、事前に冷媒液を回収・退避させてから散水を行う。"}, {"id": 917, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "イ", "theme": "蒸発温度差設定の過大影響", "question": "冷凍装置の使用目的によって、蒸発温度と被冷却物の温度との温度差が設定され、それに従って装置が運転される。一般に、設定温度差の値は空調用で15〜20K程度であり、冷蔵用で5〜10K程度である。この設定温度差が小さ過ぎると、冷蔵品の乾燥や蒸発器への着霜などの問題が起きる。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "冷蔵品の乾燥や過度な着霜が起きるのは、蒸発温度を低くしすぎる「温度差が大き過ぎる」場合である（小さ過ぎるとは誤り。小さ過ぎると蒸発器面積が過大になる）。"}, {"id": 918, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ロ", "theme": "蒸発温度低下時の蒸気密度", "question": "冷凍能力は圧縮機に吸い込まれる冷媒の蒸気量により変化する。蒸発温度が低下すると、湿り蒸気の密度が大きくなり、結果として冷凍能力は減少するので、蒸発温度を必要以上に下げないように努めなければならない。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "蒸発温度が低下すると蒸発圧力が下がり、飽和蒸気の比体積が大きくなる（密度は「小さく」なる）。そのため吸込み質量流量が減少し能力が低下する（密度が大きくなりは誤り）。"}, {"id": 919, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ハ", "theme": "蒸発温度低下の原因要因", "question": "強制通風式冷却器と冷却塔を利用した冷蔵庫用冷凍装置において、蒸発温度が低下する原因としては、蒸発器への冷媒供給量不足、蒸発器熱交換不良、冷却風量の減少、蒸発器の熱負荷の減少、冬季の冷却塔の冷却水温の低下などがある。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "冷媒供給不足、熱交換不良（着霜等）、風量減少、庫内熱負荷減少、冬季の水温低下（膨張弁差圧不足）は、いずれも蒸発温度（低圧）低下の原因となる。"}, {"id": 920, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ニ", "theme": "乾式空気冷却器の着霜と熱通過率", "question": "乾式空気冷却器に霜が付くと、霜の熱伝導抵抗により熱通過率が低下し、蒸発圧力の低下、冷却能力の低下を招く。一般に、霜の厚さが厚くなるほど、熱通過率は低下する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "着霜により通風抵抗増大と熱伝導抵抗増大が生じ、霜が厚くなるほど熱通過率は大きく低下して蒸発圧力・冷却能力が著しく低下する。"}, {"id": 921, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "イ", "theme": "蒸発器の温度差と空気側熱抵抗", "question": "冷媒と空気との算術平均温度差が大きくなれば、蒸発器の伝熱量が増大し、冷媒側熱伝達率が大きくなるが、空気側の熱伝達抵抗が小さいために、熱通過率の値はあまり大きくならない。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "フィンコイル乾式蒸発器では空気側の熱伝達抵抗が「大きく（支配的）」、冷媒側が向上しても熱通過率K全体はあまり大きくならない（「熱伝達抵抗が小さいために」は誤り）。"}, {"id": 922, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ロ", "theme": "不凝縮ガスによる混合気境界層", "question": "水冷横形シェルアンドチューブ凝縮器内（冷媒側）に不凝縮ガスが存在すると、伝熱面近くに混合気境界層が形成されて伝熱作用が阻害される。また、冷凍装置の運転停止中における凝縮器の圧力は、凝縮器内に存在する不凝縮ガスの分圧相当分だけ高くなる。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "不凝縮ガスは凝縮液膜表面に滞留し濃縮されて混合気境界層を形成し伝熱を大きく阻害する。停止時の器内圧力は冷媒飽和圧力＋不凝縮ガス分圧となる。"}, {"id": 923, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ハ", "theme": "汚れ係数と熱通過率低下割合", "question": "ローフィンチューブを用いる水冷凝縮器における汚れ係数の値が小さい範囲では、汚れ係数が増加しても熱通過率はあまり低下しない。しかし、汚れ係数の値が大きい範囲では、汚れ係数が増加すると、熱通過率は大幅に低下する。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "熱通過率の低下割合は、汚れ係数が「小さい範囲で大幅に低下」し、汚れ係数が大きくなると減少割合は鈍化する（記述が逆であり誤り）。"}, {"id": 924, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ニ", "theme": "フルオロカーボンの油溶解と伝熱阻害", "question": "フルオロカーボン冷媒液は、冷凍機油を溶解すると粘度が高くなる。そのため、過度に冷凍機油を溶解すると、熱交換器における伝熱を阻害することになる。一般に、冷凍機油の溶解量が3%以下であれば、伝熱には特に支障がない。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "油溶解により冷媒液粘度は上昇し蒸発伝熱を阻害する。通常3%以下の油濃度であれば伝熱上の支障はほとんど無視できる。"}, {"id": 925, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "イ", "theme": "ガスチャージ方式の越境現象", "question": "液チャージ方式の温度自動膨張弁では、膨張弁本体の温度が感温筒温度よりも低くなると、感温筒内のチャージ媒体の飽和液の全てが弁本体側に集まり、膨張弁は、弁本体の温度に感応してしまい、適切な過熱度制御ができなくなる。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "本体温度が感温筒より低くなると液が本体ベローズ側に移行して誤作動（越境現象）を起こすのは「ガスチャージ方式」である（液チャージ方式とする記述は誤り）。"}, {"id": 926, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ロ", "theme": "内部均圧形の圧力降下と制御過熱度", "question": "ダイアフラム形の温度自動膨張弁は、ばね力と、ダイアフラム上下に加わる感温筒圧力および蒸発圧力の圧力差により、蒸発器出口の過熱度を制御する。内部均圧形温度自動膨張弁では、蒸発器内での冷媒の圧力降下が大きいと、感温筒取付け位置での冷媒圧力を正確に検知できなくなるため、冷凍装置運転中の実際の過熱度は大きくなる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "内部均圧形では蒸発器入口圧力を基準とするため、器内圧力降下Δpがあると出口圧力より高い圧力がダイアフラム下面にかかり、実際の過熱度は設定値より大きくなる。"}, {"id": 927, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ハ", "theme": "電子膨張弁の電磁弁兼用機能", "question": "電子膨張弁は、温度センサの信号をもとに調節器において過熱度を算出し、その値と過熱度設定値との偏差に応じて膨張弁の開閉操作を行うため、幅広い制御特性を得ることができる。しかし、冷凍装置を停止するときに、蒸発器への送液停止をさせるための電磁弁の機能を兼ねることができない。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "電子膨張弁は全閉機能を有しており、装置停止時に蒸発器への送液を遮断する電磁弁の機能を「兼ねることができる」（兼ねることはできないは誤り）。"}, {"id": 928, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ニ", "theme": "キャピラリチューブの臨界流", "question": "キャピラリチューブにおいて、チューブ入口、出口の圧力、チューブの口径、長さなどが、チューブ内を流れる冷媒の流量に影響を及ぼす。ただし、チューブ内で冷媒の流れが臨界状態に到達する場合は、チューブ出口の圧力は流量に影響を及ぼさない。", "answer": "○", "law": "上級テキスト 膨張機構編", "explanation": "チューブ出口で冷媒流速が音速（臨界流）に達すると、それ以上出口圧力を下げても圧力変動が上流に伝播せず、流量は出口圧力に無関係となる。"}, {"id": 929, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "イ", "theme": "圧力式冷却水調整弁の始動時特性", "question": "直動形の圧力式冷却水調整弁は、凝縮圧力の変化に対応して弁開度の制御を行う。このため、凝縮負荷、水温、凝縮器の熱通過率の変化などに応じて、冷却水量を調節することができる。しかし、冷凍装置の始動時には、凝縮圧力が低いため、冷却水量の調節を行うことはできない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "直動圧力式は凝縮圧力で直接開度を制御する。始動時は凝縮圧力が低いため全閉となり冷却水が流れず、圧力が立ち上がるまで調整できないためバイパス弁が必要。"}, {"id": 930, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ロ", "theme": "直動形蒸発圧力調整弁（EPR）の開閉動作", "question": "直動形蒸発圧力調整弁は、バルブプレートに作用する蒸発圧力が、ばねで設定した値以上になると、その差圧で弁が開く。また、一般に、蒸発圧力が変化しない場合でも、バルブプレートに作用する圧縮機の吸込み圧力が低下した場合には、弁前後の差圧が大きくなり弁が開く。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "直動形EPRの開度は「入口側の蒸発圧力」とばね力で決まり、出口側の圧縮機吸込み圧力（差圧）の変化にはほとんど影響されない（吸込み圧力低下で弁が開くは誤り）。"}, {"id": 931, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ハ", "theme": "パイロット形EPRのブリード冷媒排出先", "question": "パイロット形蒸発圧力調整弁では、パイロット弁にダイアフラムと圧力設定用ばねを備える。蒸発圧力が設定した圧力を超えれば、パイロット弁が開き、主弁のピストン上面に蒸発圧力を伝えて弁開度を制御する。ピストン上部に流入した冷媒蒸気は、ピストンに設けたノズルから調整弁の上流側に排出される。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "ピストン上部の冷媒蒸気は、ピストンの均圧ノズルから低圧側である「下流側（吸込み側）」へ排出される（「上流側に排出される」は誤り）。"}, {"id": 932, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ニ", "theme": "パイロット形吸入圧力調整弁（SPR）の動作", "question": "パイロット形吸入圧力調整弁では、パイロット弁に圧縮機吸込み管と接続する均圧用ポートを有する。吸込み圧力が設定よりも低下すれば、パイロット弁が開き、蒸発器側の圧力を主弁のピストン上部に導き主弁を開く。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "吸込み圧力を検知して制御する。吸込み圧力が設定値以下に下がるとパイロット弁が開き、高圧側の蒸発圧力を主弁ピストンに導いて主弁を開弁させる。"}, {"id": 933, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "イ", "theme": "低圧フロート弁の特性", "question": "満液式蒸発器などの液面レベルを一定に保持するためのフロート弁は、低圧フロート弁と呼ばれ、高圧冷媒液を絞り膨張させて低圧機器内に送液する。フロート弁は、一般に、各種冷媒で共用になっているが、冷媒液の密度の違いによる影響は小さい。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "低圧フロート弁は液面を直接検知して高圧液を絞り送液する。冷媒ごとの密度差による浮力影響は比較的小さく共用設計されることが多い。"}, {"id": 934, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ロ", "theme": "電磁弁の作動差圧", "question": "電磁弁は、冷媒用、水用、ブライン用などがあり、用途に応じて使い分ける。直動式の電磁弁は、その作動機構により弁前後の圧力差がゼロでも開閉できるが、パイロット式電磁弁は弁前後の圧力差が十分でないと作動しないことがあるので注意が必要である。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "直動式はソレノイドの力で直接開閉するため差圧ゼロでも作動するが、パイロット式は主弁開閉に冷媒前後の作動差圧（通常7〜30 kPa）が必要となる。"}, {"id": 935, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ハ", "theme": "高圧圧力スイッチの復帰方式", "question": "高圧圧力スイッチを安全装置として使用する冷凍装置では、一般に、冷媒圧力が上昇して設定圧力になった場合、圧縮機電源回路を遮断して圧縮機を停止させる。異常高圧で作動した場合には、冷凍装置の停止した原因を修復してから運転再開する必要がある。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "安全装置としての高圧圧力スイッチは異常高圧時に電源を遮断して停止させる。原因排除後に再起動させるため原則として手動復帰形が用いられる。"}, {"id": 936, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ニ", "theme": "バイメタル式サーモスタットの原理", "question": "バイメタル式サーモスタットは、熱伝導率の異なる2種類の金属を溶着または一緒にロール加工して作られ、温度が変化すると機械的なわん曲を生じる。バイメタル式サーモスタットは、このわん曲による力を利用して電気接点の開閉を行う。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "バイメタルは「熱膨張係数（熱膨張率）」の異なる2種類の金属を貼り合わせたものである（「熱伝導率の異なる」は誤り）。"}, {"id": 937, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "イ", "theme": "バッフル式油分離器", "question": "油分離器は、冷凍装置の圧縮機と凝縮器との間に設置し、圧縮機吐出しガスに含まれている油を分離する附属機器であり、バッフル式、金網式、デミスタ式などの油分離器がある。バッフル式油分離器は、多数の小孔がある複数枚のバッフル板を立型円筒内に斜めに設け、吐出しガスが小孔を通る際に油滴を分離する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "圧縮機〜凝縮器間に設置し、傾斜した多数小孔のバッフル板にガスを衝突・通過させて油滴を慣性分離する。"}, {"id": 938, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ロ", "theme": "高圧受液器の液面計", "question": "高圧受液器は、凝縮器で凝縮した冷媒液を蓄える容器であり、この容器内で凝縮器と蒸発器の冷媒量の変化を吸収し、冷凍装置を円滑に運転できるようにする。一般に、大形の受液器には反射式液面計を取り付け、小容量の受液器にはサイトグラスを設置したりする。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "受液器は負荷変動による冷媒量変化を吸収する。大形には自動閉止弁付き反射式ガラス液面計、小形にはサイトグラスが用いられる。"}, {"id": 939, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ハ", "theme": "低圧受液器の気液分離機能", "question": "低圧受液器は、冷媒液強制循環式冷凍装置の蒸発器冷却管に低圧冷媒液を送り込むための液溜めの役割をもっている。一般に、蒸発器から低圧受液器に戻ってくる冷媒は気液混合状態であり、圧縮機へ液戻りしないように、圧縮機の吸込み配管には液分離器を取り付ける必要がある。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器自体が気液分離器（液分離器）の機能を兼ね備えているため、吸込み配管に別途液分離器を取り付ける必要はない（誤り）。"}, {"id": 940, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ニ", "theme": "ろ過乾燥器とアンモニア冷媒", "question": "フルオロカーボン冷凍装置に取付ける、ろ過乾燥器の乾燥剤には、水分を吸着しても化学変化せず、砕けにくいゼオライト、活性アルミナ、シリカゲルなどが用いられる。アンモニア冷凍装置の冷媒系統内の水分はアンモニアと結合しているため、乾燥剤による吸着分離効果は期待できない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "フルオロカーボンにはドライヤ（ゼオライト等）が必須だが、アンモニアは水と極めて強く結合するため乾燥剤での吸着分離はできず設置しない。"}, {"id": 941, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "イ", "theme": "液ガス熱交換器とアンモニア", "question": "液ガス熱交換器は、凝縮器から出た高温冷媒液と、蒸発器から出た低温冷媒蒸気との間で熱交換させるものであり、アンモニア冷凍装置では、圧縮機の吸込み蒸気過熱度の増大にともなう吐出しガス温度の上昇が著しいので、使用されない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "アンモニアは断熱指数が大きく吸込み過熱による吐出し温度上昇が著しいため、液ガス熱交換器は使用しない。"}, {"id": 942, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ロ", "theme": "油回収器の加熱源", "question": "フルオロカーボン冷凍装置において、満液式蒸発器や低圧受液器に入り込んだ冷凍機油は冷媒液に溶解しているので、油だけを分離して容器外に抜き出すことはできない。そこで、油の濃度が高い冷媒液を抜き出し、冷媒液は加熱して蒸気とし、冷媒と油に分離する機能をもった油回収器を使用する。不燃性冷媒液の加熱には、高圧冷媒液または高圧吐出しガスを利用し、過熱による油の劣化をさけるため、電気ヒータは、加熱源としては使用しない。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "不燃性フルオロカーボンの油回収器の加熱源には一般に「電気ヒータ」が用いられる（可燃性冷媒の場合に電気ヒータを避け高圧液やガスを利用するため、記述は誤り）。"}, {"id": 943, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ハ", "theme": "多孔板式液分離器の流速", "question": "アンモニア用の多孔板式の液分離器は、円筒胴内の流速が1m/s以下の蒸気の流れに乗った液滴が多孔板に衝突して下方に落ち、蒸気は孔を通り抜けて流れることによって、液と蒸気を分離する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "胴内流速を1 m/s以下に減速させ、慣性衝突と多空通過によって効率よく液滴を分離落下させる。"}, {"id": 944, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ニ", "theme": "冷媒液強制循環式と油戻し", "question": "冷媒液強制循環式蒸発器では、一般に、液ポンプにより蒸発量の3倍から5倍の冷媒量を流す。また、冷凍機油を低圧受液器に戻すために、一般に、蒸発器本体に油戻し用の配管を設ける。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "冷媒循環比3〜5倍で送られた油は冷媒液とともに自然に低圧受液器に戻り濃縮されるため、蒸発器本体に油戻し配管を設けるのは「満液式蒸発器」である（誤り）。"}, {"id": 945, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "イ", "theme": "配管用炭素鋼鋼管（SGP）の使用制限", "question": "配管用炭素鋼鋼管（SGP）は、毒性ガスの冷媒には使用できない。また、フルオロカーボン冷媒では設計圧力が1MPaを超える耐圧部分、温度100℃を超える耐圧部分、温度-25℃よりも低温の耐圧部分にSGPは使用できない。", "answer": "○", "law": "例示基準20、上級テキスト 配管編", "explanation": "SGPは毒性ガス禁止、設計圧力1 MPa以下、温度-25℃〜100℃の範囲でのみ使用可能。"}, {"id": 946, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ロ", "theme": "ろう材の温度と特性", "question": "ろう付けに使用するろう材のろう付け温度は、銀ろう系のほうが黄銅ろう系よりも低い。銀ろう系は、溶融したろうの流動性がよく、強度も大きいが、過熱すると亜鉛が蒸発して気泡を発生することが多い。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "過熱によって亜鉛が蒸発し気泡が発生しやすいのは「黄銅ろう（BCuZn系）」である（銀ろう系とする記述は誤り）。"}, {"id": 947, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ハ", "theme": "複数蒸発器の吸込み管接続", "question": "蒸発器が2基以上の装置では、無負荷の蒸発器に主管内の油や冷媒が流れ込むので、蒸発器吸込み管は、主管の下部（下面側）に接続するのがよい。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "停止・無負荷の蒸発器への油や冷媒液の流入を防ぐため、吸込み枝管は主管の「上部（上面側）」に接続する（下面側は誤り）。"}, {"id": 948, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ニ", "theme": "複数凝縮器の液落とし管トラップ", "question": "2基以上の凝縮器から一本の主管にまとめて受液器へ冷媒液を落とす場合には、各液落とし管にトラップを設けて、液の流れの抵抗による圧力差をトラップで吸収する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "凝縮器間の凝縮圧力差によって液が片方の凝縮器に逆流・滞留するのを防ぐため、各液落とし管にトラップを設けて液頭差で吸収する。"}, {"id": 949, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "イ", "theme": "安全装置の作動形態", "question": "安全弁、破裂板、溶栓、高圧遮断装置などの安全装置は、設定の圧力や温度で作動し、外部に冷媒ガスを放出することで冷媒設備の圧力を許容圧力以下にする。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "外部にガスを放出するのは安全弁・破裂板・溶栓である。「高圧遮断装置」は電動機電源を遮断して圧縮機を停止させる装置であり、ガス放出は行わない（誤り）。"}, {"id": 950, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ロ", "theme": "高圧遮断スイッチの設定圧力と精度", "question": "高圧遮断圧力スイッチの設定圧力は、高圧部に取り付けられた内蔵安全弁を除くすべての安全弁の最低吹始め圧力以下で、高圧部の許容圧力以下で作動するように設定する。また、設定圧力の範囲が1MPa未満の場合、圧力スイッチの精度は、設定圧力の-15%以内でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "安全弁の吹始め圧力以下かつ許容圧力以下で作動するよう設定する。1 MPa未満の精度基準は設定圧力の-15%以内である。"}, {"id": 951, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ハ", "theme": "圧縮機用と容器用安全弁の目的", "question": "圧縮機用安全弁は、吹出し圧力において、圧縮機が吐き出すガスの全量を噴出することが求められる。また、圧力容器用安全弁は、冷媒ガスの飽和圧力が設定された圧力に達したときに冷媒ガスを噴出し、過度の圧力上昇を防止する。", "answer": "○", "law": "上級テキスト 安全装置編", "explanation": "圧縮機用はピストン押しのけ量全量の噴出能力が必要。容器用は火災等の受熱による冷媒蒸発圧力の上昇を逃がす能力が求められる。"}, {"id": 952, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ニ", "theme": "破裂板の破裂圧力基準", "question": "破裂板は、圧力によって金属の薄板が破れる方式の安全装置であり、その最小口径は圧力容器に取り付けるべき安全弁の必要最小口径と同じとする。また、破裂板は、経年変化により破裂圧力が低下する傾向があるため、破裂圧力は、耐圧試験圧力より高くする。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "破裂板の破裂圧力は「耐圧試験圧力の0.8〜1.0倍」程度に設定する（耐圧試験圧力より高くすると容器が破壊されるため誤り）。"}, {"id": 953, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "イ", "theme": "溶接部非破壊試験と継手効率", "question": "溶接部を対象に実施される非破壊試験には、放射線透過試験、超音波探傷試験、磁粉探傷試験、浸透探傷試験がある。突合せ溶接継手を対象に、放射線透過試験を実施した場合には、溶接継手の効率の値を高く設定できることがある。", "answer": "○", "law": "例示基準、上級テキスト 試験検査編", "explanation": "放射線透過試験の実施割合（全長1.0で効率1.0、0.2以上で0.95、0.2未満で0.7）に応じて溶接継手効率を高く設定できる。"}, {"id": 954, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ロ", "theme": "耐圧試験の全数試験と組立機器", "question": "耐圧試験は、耐圧強度を確認する構成機器や部品ごとに行う全数試験である。なお、部品ごとに試験したものを組み立てた機器については、耐圧強度が確認できたとみなし、試験を行わなくてもよい。", "answer": "○", "law": "冷規第7条、上級テキスト 試験検査編", "explanation": "構成部品ごとに耐圧試験を実施して合格したものを組み立てた機器は、耐圧強度が確認されたものとみなされ改めての試験は省略できる。"}, {"id": 955, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ハ", "theme": "気密試験に使用するガス", "question": "冷媒配管を完了した設備を対象に行う気密試験では、冷媒の種類によらずに、ボンベに詰められた二酸化炭素、窒素ガス、試験用空気圧縮機で加圧された空気を用いて行う。ただし、圧縮空気を用いる場合は、圧縮機の吐出し空気温度が140℃を超えないようにする。", "answer": "×", "law": "例示基準6、上級テキスト 試験検査編", "explanation": "アンモニア冷媒設備では「二酸化炭素」は固形物を生成するため使用不可。フルオロカーボンでは水分を嫌うため空気は原則避ける（「冷媒の種類によらずに」は誤り）。"}, {"id": 956, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ニ", "theme": "真空放置試験の許容圧力変化", "question": "真空試験は、冷媒設備の気密の最終確認をするために実施する試験である。十分に長い時間にわたって真空のまま放置した後、試験開始前よりも5Kくらいの温度変化の場合には、1.2 kPa程度の圧力変化であればよい。", "answer": "×", "law": "例示基準7、上級テキスト 試験検査編", "explanation": "十分な放置時間後、5K程度の温度変化に対して許容される圧力変化は「0.7 kPa程度以内」である（1.2 kPaは誤り）。"}, {"id": 957, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "イ", "theme": "基礎の固有振動数と質量", "question": "地盤自身の弾力性による基礎の固有振動数は、機械が発生する振動の振動数よりも少なくとも20%以上の差をつけて、機械と基礎とが共振しないようにする。また、多気筒圧縮機の基礎の質量は、基礎の上に据え付ける機械の質量の2倍から3倍にするのが一般的である。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "共振防止のため固有振動数と機械振動数には20%以上の差をつける。多気筒往復圧縮機の基礎質量は機械質量の2〜3倍が標準。"}, {"id": 958, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ロ", "theme": "真空乾燥完了の判定温度・圧力", "question": "フルオロカーボン冷媒設備内の真空乾燥を行う際、冷媒設備内の圧力が、周囲温度が5℃のとき約0.87 kPa、周囲温度が10℃のとき約1.23 kPaに到達した時点で真空乾燥が完了したと判断してよい。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "水分の蒸発圧力（10℃で1.23 kPa）に達しただけでは蒸発が始まった段階であり乾燥完了ではない。その圧力以下を保ち長時間真空引きを継続する必要がある（誤り）。"}, {"id": 959, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ハ", "theme": "冷凍機油の具備条件", "question": "冷凍機油の選定条件として、酸に対する安定性がよいこと、熱安定性がよく、引火点が高いこと、水分や酸類などが含まれていないことなどが挙げられる。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "熱安定性、酸化安定性、高引火点、水分・不純物の不存在、低温流動性（低流動点）などが冷凍機油の重要条件である。"}, {"id": 960, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ニ", "theme": "冷媒充填量不足時の挙動", "question": "冷凍装置に冷媒を充てんする際、冷媒量が不足すると、蒸発圧力が低下し、圧縮機の吸込み蒸気の過熱度と比体積が大きくなり、吐出し圧力が低下し、吐出しガス温度が上昇する。吐出しガス温度の上昇は油の劣化を促進する。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "冷媒不足時は蒸発圧力低下・吸込み過熱度大・比体積増大・循環量減少・吐出し温度上昇を招き、冷凍機油の熱劣化を早める。"}, {"id": 961, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "イ", "theme": "保安管理技術", "question": "一般に，ツインスクリュー圧縮機は，冷凍機油の噴射によってローダ歯間，ローダ歯とケーシングの間の潤滑を行い，動力の伝達をスクリューローダの歯自身で行っている．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 962, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ロ", "theme": "保安管理技術", "question": "一般に，遠心圧縮機は，遠心冷凍機として凝縮器および蒸発器とともに一つのユニットにまとめられている．また，羽根車は高速回転するので，振動や騒音を抑制するために，遠心圧縮機は密閉形のみとなり，開放形はない．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 963, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ハ", "theme": "保安管理技術", "question": "家庭用ルームエアコンデイショナのロータリー圧縮機の電動機は，一般に，密閉容器の高圧ガス内に置かれ，吐出しガスによって冷却される構造になっている．そこで，電動機は吐出しガスよりも高い温度になる．二．開放形の往復圧縮機は，電動機から圧縮機へ動力を伝えるために，クランク軸が圧縮機のケーシングを貫通して外部に突き出ており，そこに冷媒の漏れ止め用のシャフトシール（軸封装置）を必要とする．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 964, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ニ", "theme": "保安管理技術", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 965, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置容量制御", "question": "インバータを用いて圧縮機の回転速度を調整する容量制御方法では，圧縮機の回転速度と容量は常に比例するため，回転速度を変化させた容量制御が可能であるが，クランク軸端に油ポンプ°を付けている往復圧縮機では，回転速度をあまり小さくすると，潤滑不良を起こすので注意が必要である．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 966, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置容量制御", "question": "吸入圧力調整弁は，圧縮機の吸込み圧力が所定圧力以上にならないように吸込み蒸気を絞り，圧縮機の容量制御を行うが，密閉圧縮機では，吸込み圧力があまり低圧になると圧縮機を流れる冷媒が減少し，電動機が1071種・保安管理技術過熱するので注意が必要である．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 967, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置容量制御", "question": "多気筒圧縮機のアンローダ機構は，一般に，吸込み弁を開放して作動気筒数を減らすことにより，容量を無段階で任意に変えられるようになっている．また，圧縮機の始動時には，冷凍機油の油圧が正常に上がるまではアンロード状態になっている．二．ホットガスバイパスによる容量制御では，ホットガスバイパス弁のほかに，ホットガス冷却專用の液噴射弁を取り付け，バイパス配管内でホットガスに冷媒液を混合して，ホットガスを冷却する場合がある．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 968, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置容量制御", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 969, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機運転と保守管理", "question": "スクリュー圧縮機の給油圧力は，強制給油式（給油ポンプ方式）では，吐出し圧力より0.2～0.3 MPa高い値が適正値であり，差圧式（給油ポンプなし）では，吐出し圧力より0.05～0.15 MPa高い値が適正値である．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 970, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機運転と保守管理", "question": "アンモニアを冷媒とする往復圧縮機では，アンモニアと相溶性のある合成油を用いた場合には，フルオロカーボン冷媒と同様に油分離器から直接圧縮機に油を戻す．油分離器を用いない場合は，装置内を循環させて圧縮機に戻す．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 971, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機運転と保守管理", "question": "多気筒圧縮機の適正な給油圧力は，（給油圧力）＝（油圧計指示圧力）－（クランクケース内圧力）で判断する．二．電動機を内蔵した全密閉圧縮機は，一般に蒸発温度条件により高温用（冷房用)，中温用（冷蔵用)，低温用（冷凍用）の仕様に区分されており，例えば，高温用の圧縮機を中温用の冷凍装置の蒸発温度条件で使用することは好ましくない．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 972, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機運転と保守管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 973, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "イ", "theme": "高圧部保守管理など", "question": "空冷凝縮器内に空気などの不凝縮ガスが混入すると，冷却管の冷媒側の熱伝達率が小さくなり，凝縮温度が高くなる．そのため，圧縮機の吐出しガスの圧力と温度が高くなり，圧縮機用電動機の消費電力が増加し，冷凍能力と成績係数が低下する．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 974, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ロ", "theme": "高圧部保守管理など", "question": "空冷凝縮器を用いた冷凍装置でホットガスデフロスト方式の除霜サイクルを採用した場合，高温のホットガスの顕熱のみを利用して除霜を行う．したがって，冬季に外気温度が低下して高圧側圧力が極端に低くなると，温度の低い吐出しガスのために，その顕熱の利用効果が減少し，除霜が適切にできなくなる．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 975, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ハ", "theme": "高圧部保守管理など", "question": "水あかや油膜が水冷横形シェルアンドチューブ凝縮器の冷却管に付着すると，それらの熱伝導抵抗によって熱通過率の値が小さくなる．そのため，圧縮機の消費電力は増加するが，冷凍能力は変わらない．冷却管が裸管の場合よりもローフインチューブの場合のほうが，水あかが厚く付着することによる熱通過率の低下割合が大きい．二．液管内で液封された冷媒液の液温が上昇すると，その比体積が増加することで封鎖された内部は著しく高圧になり，止め弁や配管の弱い部分を破壊する．液温が0℃から30℃に上昇した場合，アンモニアとR410Aの飽和液を比較すると，液温上昇による比体積の増加割合が大きいのはR410Aである．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 976, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ニ", "theme": "高圧部保守管理など", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 977, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "イ", "theme": "低圧部保守管理など", "question": "アンモニアと冷凍機油（鉱油）は，ほとんど溶け合わない．温度によって異なるが，冷凍機汕の粘度はアンモニア液の3倍程度であり，冷凍機油の熱伝導率はアンモニア液のl/3程度である．アンモニアの蒸発および凝縮の際の伝熱面上の油膜は，伝熱の大きな障害となるので，伝熱面からできるだけ排除することが望ましい．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 978, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部保守管理など", "question": "フインコイル乾式蒸発器では，蒸発器の冷媒出口側から入口側に向かって冷却しようとする空気を流す向流方式と，蒸発器の冷媒入口側から出口側に向かって空気を流す並流方式がある．一般に，単一冷媒を用いた場合は，並流方式の冷媒と空気との平均温度差は，向流方式よりも小さくなる．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 979, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部保守管理など", "question": "凝縮器内に不凝縮ガスが存在すると，伝熱作用が阻害されるため，冷凍装置の運転中には，不凝縮ガスの分圧相当分以上に凝縮圧力が高くなる．なお，冷凍装置の運転停止中における凝縮器の圧力は，凝縮器内に存在する不凝縮ガスの分圧相当分だけ高くなる．二．空気冷却用のフィンコイル乾式蒸発器では，空気と冷媒との平均温度差が大きくなると伝熱量が増大して熱流束も大きくなる．このとき，冷媒側熱伝達率は大きくなるが，空気側の熱伝達抵抗が冷媒側熱伝達抵抗に比べて大きく，空気側伝熱面積基準の熱通過率はあまり大きくならない．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 980, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部保守管理など", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 981, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "イ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 982, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ロ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 983, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ハ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 984, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ニ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 985, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "内部均圧形の温度自動膨張弁を使用する場合，蒸発器の冷媒側圧力降下が大きいと，その圧力降下分だけ過熱度が小さくなる．蒸発器入口にデイストリビュータを付けた蒸発器などでは，外部均圧形の温度自動膨張弁を使用することが望ましい．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 986, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "ダイアフラム形の温度自動膨張弁は，高圧力，高温に耐えられるように，外周を弁本体に溶接し，固定されたダイアフラム（薄膜）を使用し，その両面に作用する圧力差によるたわみが，弁に伝えられて開閉する．たわみの動作が小さいので，過熱度調節の動作の制御偏差が，ベローズ形よりも大きい．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 987, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "温度自動膨張弁は，弁本体と感温筒とがキャピラリチューブで接続されているので，その長さによる取付位置の制限がある．また，弁本体の取付姿勢は，ダイアフラムのある頭部を上側にすることや，ガスチャージ方式では，弁本体の温度を感温筒の温度よりも低くしないことが必要である．二．蒸発器の容量変化幅が大きく，膨張弁の容量を決めにくいときは，オリフイス交換形の膨張弁を選定し，弁体セットを2から3種類用意すると実用的である．特に，圧縮機がインバータで容量可変の場合には，蒸発器の容量変化幅が大きくなるので，温度自動膨張弁を複数用いて，切り替えて過熱度を制御することができる．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 988, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 989, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "パイロット形蒸発圧力調整弁は，圧力設定用のパイロット弁と主弁とから構成されており，被冷却対象の温度をセンサで検出し，その温度信号により調節器からの出力を電子パイロット弁に伝送し，被冷却対象の温度によって蒸発温度を制御することができる．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 990, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "大容量の吸入圧力調整弁はパイロット形を用い，その主弁は蒸発圧力調整弁と共用であるが，パイロット弁は圧縮機吸込み管に接続する均圧用ポートを持っている．吸込み圧力が設定値よりも高くなるとパイロット弁を開いて，蒸発器側の圧力で王弁を開く構造となっている．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 991, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "凝縮圧力調整弁は，水冷凝縮器や空冷凝縮器の凝縮圧力を制御する．凝1111種・保安管理技術縮器出口側に取り付けて，凝縮器の圧力が設定値以下に下がると，弁が閉方向に作動し，凝縮器に液を滞留させて凝縮圧力を制御する．受液器の圧力が低下した場合は，バイパス弁を開き，送液に必要な圧力を供給する．二．温度式冷却水調整弁は，冷媒に直接触れることなく動作するので，凝縮器以外のオイルクーラなどの液体温度制御用にも使える．圧力式冷却水調整弁は，冷凍装置が停止して凝縮圧力が低下すると，自動的に弁を絞り冷却水を止める．始動時には，凝縮圧力が高くなるまで弁が開かないので，バイパス弁が必要である．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 992, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 993, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "イ", "theme": "制御機器", "question": "相溶性の冷凍機油を用いるアンモニア冷凍装置では，油分離器は，冷凍装置の圧縮機と凝縮器の間に設置する．分離した冷凍機油は，一般に，自動返油せず，油溜め器に抜き取る．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 994, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器", "question": "冷凍装置の運転状態の変化に起因する凝縮器内と蒸発器内の冷媒量の変化が大きいときには，この冷媒量の変化を吸収できるように高圧受液器の容量を決定する．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 995, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器", "question": "低圧受液器は，冷媒液強制循環式冷凍装置の蒸発器冷却管に低圧冷媒液を送り込むための液溜めであり，また，冷却管から戻った冷媒蒸気と液を分離する役割ももつ．低圧受液器では，運転状態が変化しても，冷媒液ポンプと蒸発器が安定した運転を続けられるように，一般に，温度自動膨張弁で流量制御が行われる．二．ろ過乾燥器は，フルオロカーボン冷凍装置の冷媒系統内の水分を吸着して除去するために，乾燥剤を用いる．その乾燥剤には，水分を吸着しても化学変化を起こさず，砕けにくいものを使用する．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 996, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 997, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "イ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 998, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ロ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 999, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ハ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1000, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ニ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1001, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "イ", "theme": "附属機器", "question": "銅管は，ろう付けによって接合する．ろう付け温度は銀ろう系のほうが黄銅ろう系よりも低い．銀ろう系ろう材は，溶融したろうの流動性がよく，強度も大きい．一方，黄銅ろう系ろう材は若干強度が劣る．そのため，銅管のろう付けに使用するろう材として，銀ろう系のろう材が使われており，黄銅ろう系のろう材は使用しない．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1002, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器", "question": "フルオロカーボン冷凍装置の吸込み蒸気配管では，冷媒蒸気の流れを利用して，冷媒中に溶解している冷凍機油を蒸発器から圧縮機へ返油するので，返油のために必要な最小の蒸気速度を確保しなければならない．必要とする蒸気速度は，横走り管では3.5 m/s以上，立ち上がり管では6 m/s以上とする．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1003, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器", "question": "吸込み蒸気配管の横走り管中にトラップがあると，軽負荷運転時に油や冷媒液がたまり，再始動時や軽負荷から全負荷に切り換わったときに液が圧縮機に戻る．冷媒液が圧縮機に戻るのを防ぐために，吸込み蒸気配管の横走り管は，トラップを設けないで冷媒蒸気の流れ方向に上り勾配の配管にする．二．満液式や冷媒液強制循環式の蒸発器を使用するフルオロカーボン冷凍装置では，蒸発器または低圧受液器内から圧縮機への油戻しが重要であり，絞り弁を通して，油を含んだ冷媒液を蒸発器や低圧受液器から少しずつ抜き出し，液ガス熱交換器で冷媒液を気化した後，油を圧縮機に戻すようにしている．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1004, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1005, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "イ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1006, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ロ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1007, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ハ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1008, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ニ", "theme": "保安管理", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1009, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "二段圧縮冷凍装置の過冷却液管や液ポンプ方式の低圧受液器まわりは，弁の誤操作で液封になりやすいので，液封防止のため圧力逃がし装置を取り付ける．可燃性ガス，毒性ガスの装置の安全装置として，破裂板は使用できない．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1010, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "高圧遮断装置の設定圧力は，高圧部に取り付けられたすべての安全弁の最低吹始め圧力以下であり，高圧部の許容圧力以下の圧力で作動するように設定する．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1011, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "高圧遮断圧力スイッチは，原則として手動復帰形とするが，毒性ガス以外の冷媒を用いた自動運転方式の冷凍装置では，自動復帰形を用いてもよい二・圧力容器に取り付ける溶栓の口径は，取り付けるべき安全弁の口径のl/2以上，破裂板の口径は，取り付けるべき安全弁の口径と同一であり，どちらも圧力容器の温度により作動する．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1012, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1013, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験", "question": "｜耐圧試験は，耐圧強度を確認する構成機器や部品ごとに行う全数試験である．なお，部品ごとに試験したものを組み立てた機器については，耐圧強度が確認できたとみなし，試験を行わなくてもよい．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1014, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験", "question": "配管を除く圧縮機や容器の部分について，その強さを確認するために，耐圧試験の代わりに量産品について適用する強度試験がある．強度試験の試験圧力は，設計圧力の3倍以上の高い圧力である．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1015, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験", "question": "気密試験に使用するガスは，空気または窒素ガスなどの不燃性で非毒性のガスを用い，酸素のような支燃性ガスは使用してはならない．空気圧縮機を使用して圧縮空気を供給する場合は，圧縮により空気が高温になるので，空気圧縮機の吐出し温度が140℃を超えないようにする．二．冷媒設備の気密の最終確認をするための真空試験は，高真空を必要とするため真空ポンプを使用して行い，設備からの漏れの有無の確認とともに，設備内を真空にしながら，水分を蒸発させて設備内を乾燥させる．1種・保安管理技術 115設備内は，周囲の大気温度に相当する飽和水蒸気圧力以下とする．この試験では，真空計を用いて真空度を測定する．ｲ，ロ，ハ （2）イ，ロ，二 （3）イ，ハ，二 （4）ロ，ハ，ニイ，ロ，ハ，二１１１５１１", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1016, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1017, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "イ", "theme": "据付けおよび試運転", "question": "屋外に設置する空冷凝縮器と蒸発式凝縮器は，重く，重心も比較的高い このため，地震によって据付け位置がずれることがある．したがって，設置する基礎の鉄筋を強固に組み合わせ，床盤の鉄筋に固く結び付け，また凝縮器本体と基礎も十分に固定する必要がある．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1018, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ロ", "theme": "据付けおよび試運転", "question": "フルオロカーボン冷媒設備では，設備系統内に水分があると正常な運転を阻害するので，据付け時の真空乾燥で水分を完全に排除するために，必要に応じて，水分が残留しやすい箇所を加熱する．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1019, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ハ", "theme": "据付けおよび試運転", "question": "アンモニアは，毒性があり，多量に浴びると死に至る危険がある．一方，可燃性ガスではないため，アンモニアを冷媒とする冷凍装置では，電気設備に対して防爆性能を必要としない．二．凍上は,1階の冷蔵室床下の土壌が氷結して体積が膨張し，床面が盛り上がる現象である．床下の構造や土壌の性質は，凍上の発生に大きく影響する．そこで，プラットホームをもつ高床式大形冷蔵庫では，床の防熱材を十分に厚くする方法によって，凍上を防止するのが一般的である．", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1020, "subject": "保安管理技術", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ニ", "theme": "据付けおよび試運転", "question": "nan", "answer": "○", "law": "上級テキスト 保安管理編", "explanation": "基準に合致している。"}, {"id": 1021, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "イ", "theme": "多気筒往復機のアンローダと軽負荷始動", "question": "多気筒往復圧縮機の容量制御装置は、いくつかの気筒の吸込み弁を開放して圧縮の動作をさせない構造となっているが、始動時の軽負荷始動には寄与しない。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "油圧が立ち上がるまでの始動時は吸込み弁が開放（アンロード）状態になっており、始動時の負荷を軽減して軽負荷始動に大きく寄与する（「寄与しない」は誤り）。"}, {"id": 1022, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "ロ", "theme": "スクリュー圧縮機のスライド弁と低負荷COP", "question": "スクリュー圧縮機は、スライド弁によってある限定された範囲内で容量を無段階で制御できる。このスライド弁により吸込み蒸気の閉込み量を減らした低容量で長時間運転すると、成績係数が低下する。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "スライド弁で閉込み容積を減らすと吐出し直前圧力が低下して断熱効率が落ちるため、低負荷長時間の運転ではCOPが低下する。"}, {"id": 1023, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "ハ", "theme": "遠心圧縮機のサージングと多段化", "question": "遠心圧縮機において、容量制御をサクションベーンにより行う場合、低流量になると、サージングによって振動や騒音が発生する。また、低温用の冷凍装置で使用するときは、圧力比が大きくなるので、多段圧縮式を採用している。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "低流量域でのサージング発生、および低温用途での圧力比増大に対する多段インペラの採用はいずれも遠心式の基本仕様である。"}, {"id": 1024, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の吸込み弁・吐出し弁の有無", "question": "往復圧縮機、ロータリー圧縮機、スクロール圧縮機、スクリュー圧縮機および遠心圧縮機の中で、吸込み弁を必要とするのは往復圧縮機だけであるが、吐出し弁を必要とするのは往復圧縮機とスクロール圧縮機である。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "吐出し弁を必要とするのは「往復圧縮機」と「ロータリー圧縮機」である（スクロール圧縮機は吐出し弁を必要としないため誤り）。"}, {"id": 1025, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "イ", "theme": "低圧スイッチによる発停制御の接点動作", "question": "圧縮機の容量制御方法として、圧縮機の吸込み蒸気配管に接続された低圧圧力スイッチによって圧縮機の運転を発停させる方法がある。この方法では、冷凍負荷が減少して蒸発圧力が低下すると、低圧圧力スイッチの電気接点が「閉」となり圧縮機電源回路を遮断して圧縮機を停止させ、蒸発圧力が上昇すると、低圧圧力スイッチの電気接点が「開」となり圧縮機を再始動させる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "圧力が低下したときは接点が「開（回路遮断）」となり停止し、圧力が上昇したときは接点が「閉（回路投入）」となって再始動するため、開閉記述が逆で誤り。"}, {"id": 1026, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "ロ", "theme": "ホットガスバイパスの吹込み位置", "question": "ホットガスを温度自動膨張弁と蒸発器入口の間にバイパスする容量制御では、吸込み蒸気の過熱度が大きくなり、長時間の運転ができない。しかし、定圧ホットガスバイパス弁を用いて、圧縮機の吸込み蒸気配管にホットガスを吹き込む方法を用いると、適切な過熱度が得られ、長時間運転ができる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "吸込み管へ直吹きすると過熱度過大で長時間運転不能となり、膨張弁〜蒸発器入口へバイパスすると蒸発器で冷却され適正過熱度が保たれるため、記述が逆で誤り。"}, {"id": 1027, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "ハ", "theme": "蒸発圧力調整弁（EPR）の容量制御作用", "question": "蒸発圧力調整弁は、圧縮機の吸込み蒸気配管に取り付けて、蒸発圧力が所定圧力以下に低下しないように吸込み蒸気を絞り、圧縮機吸込み圧力を低下させることによって冷凍装置の容量制御ができる。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "EPRは吸込み蒸気を絞って蒸発圧力を一定以上に保ち、同時に圧縮機の吸込み圧力を下げて圧縮機能力を低下させる。"}, {"id": 1028, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "ニ", "theme": "吸入圧力調整弁（SPR）の過負荷防止作用", "question": "冷凍装置の始動時などの圧縮機の過負荷を防止するために、吸入圧力調整弁は、圧縮機の吸込み圧力が所定圧力以上にならないように吸込み蒸気を絞り、冷凍装置の容量制御を行う。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（SPR）はクランクケース圧力が設定値以上に上がるのを防ぎ、始動時や除霜後のモータ過負荷・焼損を確実に防止する。"}, {"id": 1029, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "イ", "theme": "弁漏れによる吐出しガス温度の相違", "question": "往復圧縮機の吐出し弁からの漏れによって吐出しガス温度は上昇する。一方、吸込み弁板の割れや変形による漏れは、圧縮機の吐出しガス量が減少するので体積効率の低下を招くが、吐出しガス温度はあまり大きく上昇することはない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁漏れは高温ガスのシリンダ内逆流・再圧縮で吐出し温度が著しく上昇する。吸込み弁漏れは低圧側への逆流により体積効率は激減するが吐出し温度上昇は小さい。"}, {"id": 1030, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "ロ", "theme": "小形圧縮機の始動時差圧バランス", "question": "小形圧縮機では、高圧側と低圧側の圧力が、ほぼバランスした状態で圧縮機を始動する。電動機は起動回転力が小さいので、負荷の小さな状態で圧縮機を始動してから、徐々に負荷を大きくするようにする。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "小形機（キャピラリ機等）は停止中に高低圧が平衡してから始動する。起動トルクが小さいため軽負荷状態で起動させる。"}, {"id": 1031, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "ハ", "theme": "強制給油潤滑の油圧保護スイッチ作動条件", "question": "中形や大形の圧縮機では油ポンプによる強制給油式が採用されており、油圧が高くなりすぎると油圧保護圧力スイッチが作動して、圧縮機を停止する。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "油圧保護圧力スイッチ（OPS）は油圧が「低くなりすぎたとき」に軸受焼付きを防ぐため作動する（「高くなりすぎると作動」は誤り）。"}, {"id": 1032, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "ニ", "theme": "吸込み圧力異常低下時の過熱運転機構", "question": "蒸発圧力の低い低温用冷凍装置では、蒸発器の熱負荷が大きく低下した場合や、サクションストレーナの目詰まりなどによって、圧縮機の吸込み蒸気圧力が正常な状態から異常に低下すると、圧縮機での圧力比が減少し、湿り圧縮運転状態となり、圧縮機の吐出しガス温度が低下して、圧縮機は過熱運転となる。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "吸込み圧力が異常低下すると圧力比は「増大」し、吐出しガス温度が上昇して過熱運転となる（「圧力比が減少し、湿り圧縮となり、吐出し温度が低下」は誤り）。"}, {"id": 1033, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "イ", "theme": "不凝縮ガスの生成要因", "question": "水分が冷媒に混入した状態で運転されていたり、高い吐出しガス温度で運転されていたりすると、冷媒や冷凍機油が分解して不凝縮ガスを生成する場合がある。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "水分混入による加水分解や高温運転による熱分解・スラッジ化により、冷媒系内に不凝縮ガスが生成される。"}, {"id": 1034, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "ロ", "theme": "冷却水量減少による消費電力増加", "question": "水冷シェルアンドチューブ凝縮器において凝縮負荷と冷却水入口温度が変化しない場合、冷却水量の減少は、圧縮機駆動用電動機の消費電力の増加につながる。したがって、適正な冷却水量の確保が必要である。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "冷却水量が減少すると出入口水温差が拡大して凝縮温度・圧力が上昇し、圧縮動力が増加して消費電力が増大する。"}, {"id": 1035, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "ハ", "theme": "コンデンサ・レシーバの過充填と凝縮温度", "question": "コンデンサ・レシーバでは、冷媒液中に浸される冷却管の本数が増加すると、浸された部分の熱通過率が大きくなり、凝縮温度が低下するとともに、凝縮器出口の冷媒液の過冷却度も大きくなる。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "冷却管が液没すると気体凝縮有効伝熱面積が減るため、凝縮温度は「上昇する」（「凝縮温度が低下する」は誤り）。過冷却度が大きくなる点は正しい。"}, {"id": 1036, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "ニ", "theme": "水冷凝縮器の凝縮圧力異常上昇要因", "question": "水冷シェルアンドチューブ凝縮器では、冷却水ポンプの吸込み管のストレーナの目詰まりや冷却塔の水位の低下による冷却水量の減少、冷却管に水あかが付着することによる伝熱管の熱通過率の低下などによって、凝縮圧力が異常に上昇する。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "冷却水流量の不足や伝熱管の水あか付着による熱通過率低下はいずれも放熱不良を招き、凝縮圧力を異常上昇させる。"}, {"id": 1037, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "イ", "theme": "徐々に起きた液戻りへの対処法", "question": "圧縮機への液戻りが徐々に起きてきた場合には、膨張弁の開度を調節し（温度自動膨張弁の設定過熱度を大きくする）、蒸発器への冷媒液の供給量を減らし、運転の状況を見ながら対処する。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "徐々に発生した液戻りには、膨張弁設定過熱度を大きくして開度を絞り、蒸発器への送液量を減らして安定化を図る。"}, {"id": 1038, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "ロ", "theme": "蒸発器内への油滞留と低圧圧力", "question": "空気冷却器の蒸発器内部に冷凍機油が滞留すると、熱通過率が低下し、空気と冷媒との温度差が大きくなるので低圧圧力が高くなる。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "油膜の熱抵抗により熱通過率が落ちると伝熱不足となり、所定熱量を奪うために蒸発温度・低圧圧力は「低くなる」（「高くなる」は誤り）。"}, {"id": 1039, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "ハ", "theme": "満液式蒸発器の負荷急変対策と液分離器", "question": "満液式蒸発器で液面制御装置が追従できないほど熱負荷が急増し、液戻りが発生することが予想される場合の対策として、蒸発器の熱負荷の急激な変動をなくしたり、圧縮機の吸込み側に液分離器を設けたりすることが挙げられる。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "激しい負荷変動による突沸・液戻り事故を防ぐため、熱負荷平準化や吸込みサクショントラップ（液分離器）の設置が有効である。"}, {"id": 1040, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "ニ", "theme": "冷却温度高低と蒸発温度差設定", "question": "蒸発温度と被冷却物との温度差が小さく設定されている場合には、伝熱面積が大きい蒸発器を使用する。一般に、冷却温度が高い場合にはこの設定温度差を大きくし、冷却温度が低い場合には設定温度差を小さくする。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "温度差小では大面積の蒸発器が必要。空調等の高温冷却では温度差15〜20Kと大きくし、冷蔵・低温では着霜・乾燥防止のため温度差5〜10Kと小さく設定する。"}, {"id": 1041, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問6", "branch": "イ", "theme": "空気冷却器の空気側支配熱抵抗", "question": "空気冷却器の伝熱量が増して熱流束（熱流密度）が大きくなると、冷媒側熱伝達率は大きくなるが、冷媒側に比べ空気側の熱伝達抵抗が小さいため空気側伝熱面積基準の熱通過率は大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "全熱抵抗の大半は「空気側の熱伝達抵抗（大きく支配的）」であるため、冷媒側が向上しても熱通過率K全体はあまり大きくならない（「空気側の熱伝達抵抗が小さいため」は誤り）。"}, {"id": 1042, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問6", "branch": "ロ", "theme": "汚れ係数の大範囲における熱通過率減少割合", "question": "ローフィンチューブを用いる水冷凝縮器や満液式水冷却器の冷却管の外表面積基準の熱通過率は、汚れ係数の増大とともに減少するが、汚れ係数の値が大きい範囲ではあまり変わらない。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "熱通過率は汚れ係数が小さい初期段階で大幅に激減し、汚れ係数がさらに大きくなると低下の割合は緩やかになりあまり変わらなくなる。"}, {"id": 1043, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問6", "branch": "ハ", "theme": "冷媒への油溶解と粘度・熱伝達率", "question": "熱交換器の壁面上を流れる流体と壁面との間での熱伝達率は、流体の熱伝導率が大きいほど、また流体の粘度が低いほど大きい。フルオロカーボン冷媒液は、冷凍機油を溶解すると粘度が高くなる。したがって、過度に冷凍機油を溶解すると伝熱を阻害することになる。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "粘度上昇は境界層を厚くし伝熱を悪化させる。冷媒液への過度な油溶解は粘度増大を通じて熱伝達率を低下させる。"}, {"id": 1044, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問6", "branch": "ニ", "theme": "水あか付着時の管壁〜水温度差", "question": "ローフィンチューブを使用した水冷シェルアンドチューブ凝縮器では、冷却管に水あかが付着して汚れ係数が大きくなると、冷媒と冷却水との算術平均温度差は大きくなり、冷却管壁と冷却水の温度差は小さくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "水あかによる熱抵抗が増すと熱流束を維持するために冷却管壁と冷却水との間の温度差Δtwは「大きくなる」（「小さくなる」は誤り）。"}, {"id": 1045, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問7", "branch": "イ", "theme": "感温筒の垂直管取付時のキャピラリ向き", "question": "温度自動膨張弁本体は蒸発器入口近く、また、感温筒は蒸発器出口近くに取り付ける。感温筒は、周囲の温度や湿度の影響を受けないように防湿性のある防熱材で包むようにし、垂直吸込み管に取り付けるときは、感温筒のキャピラリチューブが下側になるようにすると、管内冷媒温度をより適切に検知できる。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "垂直吸込み管に取り付ける場合、感温筒内の液がキャピラリ側に落ちて溜まらないよう「キャピラリチューブを上側」にして取り付ける（「下側になるように」は誤り）。"}, {"id": 1046, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問7", "branch": "ロ", "theme": "定圧自動膨張弁の過熱度制御機能", "question": "定圧自動膨張弁は、高圧冷媒液を絞り膨張して、一定の蒸発器内圧力を保持するための減圧弁の一種である。温度自動膨張弁と比べて、過熱度制御が優れており、熱負荷の変動の大きな装置での使用に適している。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "定圧自動膨張弁は圧力を一定に保つ弁であり「過熱度制御はできない」。負荷変動が大きいと液戻り等を招くため「熱負荷変動の大きな装置には適さない」（誤り）。"}, {"id": 1047, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問7", "branch": "ハ", "theme": "キャピラリチューブ内の気液二相流摩擦抵抗", "question": "キャピラリチューブに過冷却状態で流入した冷媒液が、自己蒸発することで気液二相流の状態になると、キャピラリチューブ入口側の液相流の場合よりも流れの摩擦抵抗がはるかに大きいので、冷媒の圧力と温度が大きく低下し、キャピラリチューブ出口から蒸発器に流出する。", "answer": "○", "law": "上級テキスト 膨張機構編", "explanation": "二相流になると流速上昇とともに摩擦損失が飛躍的に増大し、急激な圧力降下とそれに伴う飽和温度降下を起こして蒸発器へ噴出する。"}, {"id": 1048, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問7", "branch": "ニ", "theme": "内部均圧形膨張弁の圧力降下と過熱度増大", "question": "内部均圧形の温度自動膨張弁を用いると、過熱度に及ぼす蒸発器内冷媒の圧力降下の影響が大きく、過熱度は設定値よりも圧力降下分だけ増大する。この圧力降下の影響を除くには、外部均圧形の温度自動膨張弁を用いる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "内部均圧形は弁出口圧力を基準とするため、器内圧損Δpがあると感温筒位置での実圧力が下がり、実際の過熱度は設定値＋Δp相当分だけ増大する。"}, {"id": 1049, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問8", "branch": "イ", "theme": "凝縮圧力調整弁（CPR）と受液器の必要性", "question": "凝縮圧力調整弁は、空冷凝縮器の冬季運転における凝縮圧力の異常な低下を防止し、冷凍装置を正常に運転するための圧力制御弁である。凝縮圧力調整弁による凝縮圧力の制御は、凝縮器への冷媒液の滞留による方法であり、その滞留分だけ、装置の冷媒充填量に余裕を必要とするので、受液器がなければならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "空冷凝縮器内に液を溜め込んで放熱面積を減らす制御であるため、滞留分の余剰冷媒を逃がす受液器の設置が不可欠である。"}, {"id": 1050, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問8", "branch": "ロ", "theme": "直動形圧力式冷却水調整弁の開閉方向", "question": "直動式の圧力式冷却水調整弁は、下部の凝縮圧力導入用の接続口付きベローズ部分と、作動圧力設定用ばねを収めた調整部分からなり、凝縮圧力が低下すると弁開度が大きくなる。この調整弁は、凝縮負荷、水温変化、凝縮器の熱通過率変化などに応じて、凝縮圧力が適正な状態を保つように冷却水量を調節する。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "凝縮圧力が「高くなると弁開度が大きくなり」、冷却水を増やして設定圧力を保つ（「凝縮圧力が低下すると弁開度が大きくなる」は誤り）。"}, {"id": 1051, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問8", "branch": "ハ", "theme": "直動式吸入圧力調整弁と蒸発圧力調整弁の構造差", "question": "直動式吸入圧力調整弁は、ベローズによってシールされた作動圧力設定用ばねと、ベローズに直結されたバルブプレートからなっている。この弁は直動式蒸発圧力調整弁とよく似た構造であるが、バルブプレートの向きが逆である。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "SPRは下流（吸込み）側圧力制御、EPRは上流（蒸発）側圧力制御のため、基本構造は酷似しているがバルブプレートの弁座に対する向きが逆になっている。"}, {"id": 1052, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問8", "branch": "ニ", "theme": "蒸発圧力調整弁（EPR）と感温筒の相対位置", "question": "蒸発圧力調整弁は、蒸発圧力が一定値以下にならないように制御する調整弁である。蒸発圧力調整弁を温度自動膨張弁と組み合わせて使用する場合には、この蒸発圧力調整弁は、膨張弁の感温筒よりも上流側に取り付けなくてはならない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は、感温筒が蒸発器本来の過熱度を感知できるよう、感温筒よりも「下流側」に取り付けなければならない（「上流側に取り付けなくてはならない」は誤り）。"}, {"id": 1053, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問9", "branch": "イ", "theme": "油圧保護圧力スイッチの復帰方式", "question": "油圧保護圧力スイッチは、圧縮機の軸受などが油の潤滑不良により焼き付き事故を起こすことを防止するための保護装置である。圧縮機を始動してから一定時間、または運転中に一定時間、給油圧力が定められた圧力以上を保持できない場合には、圧縮機を停止させる。この圧縮機を保護する目的で用いる油圧保護圧力スイッチは、自動復帰式である。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "重大事故防止用の油圧保護圧力スイッチは、原因究明と復旧点検後に再起動させるため「手動復帰形」である（「自動復帰式」は誤り）。"}, {"id": 1054, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問9", "branch": "ロ", "theme": "吸着チャージとガスチャージの本体設置温度環境", "question": "吸着チャージ方式サーモスタットは、受圧部の温度が作動に及ぼす影響が小さく、サーモスタット本体が感温筒と異なった温度環境でも使用できる。これに対して、ガスチャージ方式サーモスタットは、感温筒よりも受圧部の温度が高くないと正常に作動しない。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "吸着チャージは本体温度の影響を受けない。ガスチャージは本体側が冷えると液が本体に凝縮移行して誤作動するため本体温度が感温筒より高くなければならない。"}, {"id": 1055, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問9", "branch": "ハ", "theme": "断水リレーの機能", "question": "断水リレーは、水冷凝縮器や水冷却器で、冷却水回路が断水したり循環水量が大幅に減少したときに、電気回路を遮断することによって、圧縮機を停止させたり、警報を出したりして装置を保護するための安全装置である。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "冷却水系統の異常断水・減水を圧力差または流量で検出し、圧縮機停止・警報発令を行う保護装置である。"}, {"id": 1056, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問9", "branch": "ニ", "theme": "低圧フロート弁の容量選定と作動性", "question": "満液式蒸発器、低圧受液器、中間冷却器などの液面レベルを一定に保持するためのフロート弁は、低圧フロート弁と呼ばれ、高圧冷媒液を絞り膨張させて低圧機器内に送液する。フロート弁は、容量の過大なものを選定するとオンーオフの作動になり、小さ過ぎるものを選定すると、全開でも液面レベルが保持できなくなる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "フロート弁の容量選定は重要であり、過大だとハンチング（オンオフ動作）、過小だと供給不足で液面低下を招く。"}, {"id": 1057, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問10", "branch": "イ", "theme": "バッフル式油分離器の分離原理", "question": "油分離器は、冷凍装置の圧縮機と凝縮器との間に設置し、圧縮機吐出しガスに含まれている冷凍機油を分離する。バッフル形の油分離器は、立形円筒内に設けたバッフル板により吐出しガスを旋回運動させ、油滴を遠心力で分離する方式である。フルオロカーボン冷媒用の油分離器は、分離した冷凍機油をフロート弁により自動的に圧縮機クランクケースに返す。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "旋回運動と遠心力で分離するのは「遠心分離形（サイクロン式）」である。バッフル式は小孔付き邪魔板への衝突と流速急減で油滴を分離する（誤り）。"}, {"id": 1058, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問10", "branch": "ロ", "theme": "高圧受液器の安全ガス空間", "question": "高圧受液器には、運転中の大きな負荷変動、蒸発器の運転台数の変化、ヒートポンプ装置の運転モードの切換えなどによる冷媒量の変化を吸収する役割がある。そのため、高圧受液器の容量は、冷媒をすべて回収しても、冷媒液の膨張を考慮して、少なくとも受液器の内容積の20%の冷媒蒸気空間を保持できるように決定する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "全量ポンプダウン時にも液封事故を避けるため、最大回収液量を受液器容積の80%以下に抑え、最低20%の蒸気空間を確保する。"}, {"id": 1059, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問10", "branch": "ハ", "theme": "低圧受液器の役割と液面制御", "question": "低圧受液器は、冷媒液強制循環式冷凍装置の蒸発器冷却管に低圧冷媒液を送り込むための液溜めとして、冷却管から戻った冷媒蒸気と冷媒液を分離する役割をもつ。低圧受液器では、運転状態が変化しても冷媒液ポンプと蒸発器が安定した運転を続けられるように、フロート弁あるいはフロートスイッチと電磁弁の組合せで液面高さの制御が行われる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "気液分離とポンプ吸込み液位確保を行い、フロート弁またはフロートスイッチ＋電磁弁で適正液位を維持する。"}, {"id": 1060, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問10", "branch": "ニ", "theme": "アンモニア冷凍装置のドライヤ不使用", "question": "アンモニア冷凍装置の冷媒系統には、水分除去のためフィルタドライヤが組み込まれている。その理由は、水分が冷媒系統に存在すると、膨張弁での氷結による冷媒循環の停止、金属材料の腐食など装置各部に悪影響を及ぼすためである。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニア系統内の水分はアンモニアと結合してアンモニア水を形成するため乾燥剤による吸着分離ができず、アンモニア装置にはフィルタドライヤを使用しない（組み込まれているは誤り）。"}, {"id": 1061, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問11", "branch": "イ", "theme": "中間冷却器の送液状態差", "question": "フラッシュ式中間冷却器と液冷却式中間冷却器の違いは、前者は中間冷却器で冷媒液が中間圧力の飽和液となり蒸発器側に送られるが、後者は高圧冷媒液が過冷却状態となって蒸発器側に送られることである。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "フラッシュ式は減圧自己蒸発により中間圧飽和液を送り、液冷却式は中間圧冷媒の蒸発潜熱で管内高圧冷媒液を冷却して過冷却高圧液を送る。"}, {"id": 1062, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問11", "branch": "ロ", "theme": "満液式蒸発器の油回収器", "question": "フルオロカーボン冷凍装置の満液式蒸発器や低圧受液器に入り込んだ冷凍機油は、冷媒液に溶解している。そこで、冷凍機油の濃度の高い冷媒液を抜き出し、油回収器で冷凍機油と冷媒蒸気に分離して、それぞれ別系統で吸込み蒸気配管を通して圧縮機に戻す方法がある。満液式蒸発器や低圧受液器に入り込んだ冷凍機油を放置して冷凍装置の運転を続けた場合、装置の冷凍能力が低下したり圧縮機の冷凍機油が不足するようになる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "油回収器で加熱分離して油戻しを行う。放置すると蒸発器伝熱不良による能力低下や、圧縮機クランクケースの油量枯渇事故を招く。"}, {"id": 1063, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問11", "branch": "ハ", "theme": "U字管式アキュムレータの返油流速設計", "question": "小形のフルオロカーボン冷凍装置に用いられるU字管を内蔵した液分離器では、入口から入った液滴を含んだ冷媒蒸気は、流れ方向の変化と速度の低下によって、冷凍機油を含む液と蒸気に分離される。液分離器出口の冷媒蒸気が冷凍機油を同伴しない流速となるように、U字管の曲がり部と立ち上がり部の管径を決める必要がある。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "U字管底部小孔から吸い込んだ油を圧縮機へ確実に返油させるため、冷媒蒸気が「冷凍機油を同伴できる流速」となるように管径を設計する（「同伴しない流速」は誤り）。"}, {"id": 1064, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問11", "branch": "ニ", "theme": "直接膨張式中間冷却器の適用サイクル", "question": "直接膨張式中間冷却器は、温度自動膨張弁を用いて、高段側圧縮機に吸い込まれる冷媒の過熱度を制御できることが特徴であり、二段圧縮二段膨張式のフルオロカーボン冷凍装置に用いられる。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "直接膨張式中間冷却器は「二段圧縮一段膨張式」のフルオロカーボン装置に用いられる（「二段圧縮二段膨張式」はフラッシュ式であり誤り）。"}, {"id": 1065, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問12", "branch": "イ", "theme": "フルオロカーボン液配管の流速・圧損基準", "question": "フルオロカーボン冷凍装置では、液配管内の冷媒液の流速は1.5m/s以下とし、摩擦抵抗による圧力降下が0.02 MPa以下になるように管径を決める。圧力降下が大きくなる場合には、液ガス熱交換器を設けて、フラッシュガスの発生を防止する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "液配管流速は1.5 m/s以下、圧力損失0.02 MPa以下とし、圧損や立上がりによるフラッシュガス防止には液ガス熱交で過冷却度をつける。"}, {"id": 1066, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問12", "branch": "ロ", "theme": "吐出しガス配管の返油最低流速", "question": "フルオロカーボン冷凍装置の吐出しガス配管の管径は、冷凍機油が確実に冷媒ガスに同伴される流速が確保できることを考慮して決める必要があり、適切な流速は、立ち上がり管では、一般に、冷媒蒸気速度が3.5m/s以上6m/s未満とする。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "鉛直立ち上がり管で油を確実に同伴させる最低流速は「6 m/s以上」である（「3.5 m/s以上6 m/s未満」は横走り管基準と混同しており誤り）。"}, {"id": 1067, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問12", "branch": "ハ", "theme": "冬季停止時の逆止め弁設置", "question": "年間を通じて運転する冷凍装置では、冬季の圧縮機の停止中に凝縮器内の冷媒液が蒸発し、蒸発した冷媒蒸気が、温度の低い吐出しガス配管などで凝縮して溜まらない位置に逆止め弁を設ける。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "停止中に凝縮器から低温の吐出配管や圧縮機頭部へ冷媒が移動凝縮するのを防ぐため逆止め弁を設ける。"}, {"id": 1068, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管用銅管の曲げ加工材料", "question": "銅管および銅合金管には継目無管が多く用いられる。冷媒配管用銅管において、ベンダーによる曲げ加工を行う場合には、一般に、1/2H材、OL材、O材を使用する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "曲げ加工用には展延性のある軟質〜半硬質材（O材:なまし、OL材:軽なまし、1/2H材:半硬質）を使用する（硬質のH材は曲げ加工に適さない）。"}, {"id": 1069, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "イ", "theme": "高圧遮断圧力スイッチの設定作動圧", "question": "高圧遮断装置には、一般に高圧圧力スイッチが使用され、安全弁の作動圧力よりも高い圧力で作動するように設定し、安全弁が作動しない場合に圧縮機を停止する。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "高圧遮断装置は安全弁の作動圧力よりも「低い圧力」で作動するように設定し、安全弁が吹く前に圧縮機を止めて冷媒放出を防ぐ（高い圧力で作動は誤り）。"}, {"id": 1070, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "ロ", "theme": "圧縮機用安全弁の吹出し圧力基準", "question": "安全弁は、一般に、ばね式安全弁が使用されており、圧縮機に取り付けるときは、吐出し止め弁の上流側に取り付け、吹出し圧力は許容圧力の1.2倍以下でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "吐出し止め弁手前に設置し、吹出し圧力は吐出しガスの圧力を直接受ける容器の許容圧力の1.2倍以下、かつ吹始め圧力の1.15倍以下とする。"}, {"id": 1071, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "ハ", "theme": "溶栓の取付位置と可燃性・毒性禁止", "question": "溶栓は、プラグの中空部に低い温度で溶融する金属を詰めたもので、圧縮機の高温の吐出しガスの影響を受けない位置に取り付ける。溶栓が溶融すると、内部が大気圧になるまで放出を続けるので、可燃性ガス、毒性ガスには用いてはならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "溶栓は全量大気放出するためアンモニア等の可燃性・毒性ガスには使用禁止。また高温吐出ガスによる誤溶融を防ぐ位置に取り付ける。"}, {"id": 1072, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "ニ", "theme": "破裂板の破裂圧力基準", "question": "圧力によって金属の薄板が破れる方式の安全装置である破裂板は、主として大形の圧力容器に使われ、経年変化により破裂圧力が低下する傾向があるため、破裂圧力を耐圧試験圧力より高くする必要がある。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "容器破壊を防ぐため、破裂板の破裂圧力は「耐圧試験圧力以下（通常耐圧の0.8〜1.0倍）」に設定する（耐圧試験圧力より高くする必要があるは誤り）。"}, {"id": 1073, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "イ", "theme": "液体耐圧試験の手順", "question": "耐圧試験を液体で行う場合には、被試験品に液体を満たし、空気を完全に排除した後、液圧を徐々に加えて耐圧試験圧力まで上げて、その試験圧力を1分間以上保っておく。その後、圧力を耐圧試験圧力の8/10まで降下させ、異常がないことを確かめる。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "液体耐圧は規定圧力で1分間以上保持後、8/10まで降圧して溶接部・継手部等の漏れ・変形・破壊がないことを検査確認する。"}, {"id": 1074, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "ロ", "theme": "量産品強度試験の試験圧力", "question": "圧縮機や容器など、冷媒設備の配管以外の部分について、その強さを確認するのに、耐圧試験の代わりに量産品について適用する強度試験がある。強度試験の試験圧力は、設計圧力の3倍以上の高い圧力であり、液体で行う耐圧試験圧力の2倍以上である。", "answer": "○", "law": "冷規第7条第1項第6号、上級テキスト 試験検査編", "explanation": "量産品に適用される強度試験の圧力は設計圧力の3倍以上（液体耐圧1.5倍の2倍以上）と定められている。"}, {"id": 1075, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "ハ", "theme": "気密試験ガスとアンモニア設備の二酸化炭素禁止", "question": "冷媒設備の配管部分を除く構成機器の個々の組立品について行う気密試験は、耐圧強度が確認された圧縮機、ブースタ、圧力容器などについて、漏れの確認が容易にできるようにガス圧試験で行う。試験に使用するガスは、空気または不燃性で毒性の無いガスを用いる。なお、アンモニア冷媒設備の機器では、二酸化炭素を使用しない。", "answer": "○", "law": "例示基準6、上級テキスト 試験検査編", "explanation": "アンモニア設備に二酸化炭素を用いると残留CO2とアンモニアが反応して炭酸アンモニウムの固形粉末を生成し閉塞を招くため使用禁止。"}, {"id": 1076, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "ニ", "theme": "真空試験の測定計器", "question": "冷媒設備の気密の最終確認をするための真空試験は、高真空を必要とするため、真空ポンプを使用して行い、真空計または連成計を用いて真空度を測定し、設備からの漏れの有無を確認するとともに、設備内を真空にしながら、水分を蒸発させて設備内を乾燥させる。設備内は周囲の大気温度0℃に相当する水蒸気の飽和圧力以下とする。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "一般的な連成計では微小真空度が正確に読み取れないため、必ず「真空計」を用いて測定する（「真空計または連成計を用いて」は誤り）。"}, {"id": 1077, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "イ", "theme": "フルオロカーボンの真空乾燥と開放時残留ガス確認", "question": "フルオロカーボン冷凍設備では、装置内に水分があると、遊離水分として膨張弁で氷結して正常な運転を阻害するので、冷媒チャージ前の真空乾燥が重要である。また、冷媒放出による環境破壊や、高温の物体との接触による強毒性ガスの発生などの問題から、修理などの開放時には、内部に残留ガスがないことを確認することが重要である。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "水分による膨張弁凍結防止のための真空乾燥、および熱分解猛毒ガス（フッ化水素・ホスゲン）発生防止のための修理前残留ガス確認・窒素置換が必須。"}, {"id": 1078, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "ロ", "theme": "蒸発式凝縮器の屋上基礎質量", "question": "蒸発式凝縮器を屋上に設置する場合、地震による据付位置のずれを防止するために、基礎の質量は、その凝縮器の質量と同一にし、その基礎の鉄筋と屋上床盤の鉄筋を固く結びつけ、凝縮器本体と基礎も十分に固定する。また、凝縮器は、水平に設置する。", "answer": "×", "law": "上級テキスト 据付編", "explanation": "地震による転倒・ズレを防ぐため、基礎の質量は据え付ける凝縮器の質量よりも「十分に大きく」する（「質量と同一にし」は誤り）。"}, {"id": 1079, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "ハ", "theme": "アンモニア設備の漏えい検知警報設備義務", "question": "アンモニア冷凍設備において、アンモニアには強い刺激臭があり、機器からの微量な漏えいでも早期に発見できるため、滞留するおそれのある場所でも漏えい検知警報設備は必要ないが、毒性ガスであるため除害設備の設置が義務付けられている。", "answer": "×", "law": "冷規第7条第1項第15号・第16号", "explanation": "アンモニアは毒性・可燃性ガスであり、刺激臭があっても漏洩ガスが滞留するおそれのある場所には「漏えい検知警報設備の設置が必須」である（必要ないは誤り）。"}, {"id": 1080, "subject": "保安管理技術", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "ニ", "theme": "試運転開始前の点検項目と継続運転", "question": "冷凍装置の試運転を行う場合、試運転開始前に冷媒系統、電力系統、制御系統、冷却水系統などを点検する。冷媒系統については、特に弁の開閉状態、冷媒充填量、冷凍機油量について確認する。これらの点検の後、装置の始動試験を行い、異常がなければ数時間運転を継続し、運転データを採取する。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "試運転前には弁開閉・冷媒量・油量・電気系統等を事前点検し、始動試験後に数時間安定連続運転を行って各種運転データを記録採取する。"}, {"id": 1081, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "イ", "theme": "全密閉ロータリー圧縮機の始動時特性", "question": "全密閉ロータリー圧縮機は、構造上、圧縮機の容器内は高圧であり、始動時のオイルフォーミングは発生しないが、圧縮機容器内で冷媒の凝縮が起こることがある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "電動機が容器内の高圧ガス中にあり油も高圧側にあるため始動時オイルフォーミングは起きないが、低温始動時に高圧上昇が遅れると容器内で冷媒凝縮が生じることがある。"}, {"id": 1082, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "ロ", "theme": "スクロール圧縮機の分類", "question": "スクロール圧縮機は、遠心圧縮機の一種で吸込み弁と吐出し弁を必要としないが、停止時に高低圧の差圧で圧縮機の旋回スクロールが逆回転するので、逆止め弁や逆転防止の機構が必要である。また、トルク変動が非常に小さく、特に振動や騒音が小さい。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "スクロール圧縮機は「容積式圧縮機」の一種であり、「遠心圧縮機の一種」とする記述が誤り。"}, {"id": 1083, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "ハ", "theme": "遠心圧縮機のサージングと多段化", "question": "遠心圧縮機において、容量制御を吸込み側にあるベーンにより行う場合、低流量になると運転が不安定となり、振動や騒音が発生する。また、低温用の冷凍装置で使用するときは、圧力比が大きくなるので、多段圧縮式を採用する必要がある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "サクションベーン制御での低流量域サージング発生、および低温用途での圧力比増大に対する多段インペラ採用は遠心圧縮機の基本特性である。"}, {"id": 1084, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の弁の有無", "question": "往復圧縮機を構成する主な部品は、シリンダ、ピストン、吸込み弁、吐出し弁、クランク軸である。吸込み弁を必要とするものは、往復圧縮機のほかにロータリー圧縮機もある。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "ロータリー圧縮機はシリンダ吸込み口の開閉をロータ自身で行うため「吸込み弁は不要」である（「吸込み弁を必要とする」は誤り。吐出し弁は必要）。"}, {"id": 1085, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "イ", "theme": "ホットガスバイパス弁の作動", "question": "容量制御用のホットガスバイパス弁は、蒸発器の熱負荷が減少した場合でも、圧縮機を連続的に運転するために用いられる。ホットガスバイパス弁出口側圧力が設定圧力以下に低下すると、自動的に圧縮機吸込み蒸気配管へホットガスをバイパスさせて、吸込み圧力を所定の圧力に戻す。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "低負荷時に蒸発圧力が設定値以下に下がるとバイパス弁が自動開弁してホットガスを送り込み、吸込み圧力を所定値に維持する。"}, {"id": 1086, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "ロ", "theme": "蒸発圧力調整弁（EPR）の取付位置", "question": "蒸発圧力調整弁を用いて圧縮機の容量制御をするとき、この調整弁は、温度自動膨張弁の感温筒および均圧管の取付け位置よりも上流側の配管に取り付けなければならない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は感温筒・均圧管の正常な過熱度制御を妨げないよう、必ずそれらよりも「下流側の配管」に取り付ける（「上流側」は誤り）。"}, {"id": 1087, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "ハ", "theme": "インバータ容量制御の範囲と特性", "question": "インバータを用いて、電源周波数を変えて圧縮機の回転速度を調節し、容量制御を行う方法は、ロータリー圧縮機、スクロール圧縮機などに多く用いられる。回転速度がある限定された範囲内では、体積効率はあまり変わらず、圧縮機の回転速度と容量はほぼ比例する。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "限定された回転速度範囲内では体積効率はほぼ一定で、容量は回転速度に正比例して変動する。"}, {"id": 1088, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "ニ", "theme": "容量制御なしの消費動力とCOP", "question": "多気筒圧縮機を用いた冷凍装置にかかる熱負荷が大きく減少した場合、圧縮機の容量を調節できるようにした装置が容量制御装置（アンローダ）である。この容量制御装置がないと、負荷減少時に吸込み圧力が低下し、1冷凍トン当たりの消費動力が減少し、成績係数が小さくなる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "容量制御を行わないと吸込み圧力低下により圧力比が増大し、1冷凍トン当たり消費動力は「増加」する（「消費動力が減少し」は誤り）。"}, {"id": 1089, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "イ", "theme": "吸込み圧力低下時の圧力比と吐出し温度", "question": "熱負荷の減少で圧縮機の吸込み蒸気圧力が正常な状態から異常に低下すると、圧縮機での圧力比が減少し、湿り圧縮運転状態となり、圧縮機の吐出しガス温度は低下する。一方、水冷凝縮器の冷却水量が減少すると、圧力比の増大によって吐出しガス温度が上昇し、圧縮機が過熱運転となる場合がある。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "吸込み圧力が異常低下すると圧力比（P_cond/P_evap）は「増大」し、吐出しガス温度が上昇して過熱運転となる（「圧力比が減少し吐出し温度低下」は誤り）。"}, {"id": 1090, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "ロ", "theme": "弁漏れによる吐出し温度上昇の差異", "question": "往復圧縮機の吐出し弁からの漏れは、吐出しガス温度を上昇させ、体積効率の低下を招く。吸込み弁板の割れや変形による漏れは、圧縮機の吐出しガス量が減少するので体積効率の低下を招くが、吐出しガス温度は大きく上昇することはない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁漏れは高温高圧ガスの逆流再圧縮で吐出し温度が著しく上昇する。吸込み弁漏れは低圧側への逆流により体積効率は激減するが吐出し温度上昇は小さい。"}, {"id": 1091, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "ハ", "theme": "モータ焼損時の系統全体洗浄", "question": "密閉圧縮機の電動機が焼損すると、巻線の絶縁物や冷凍機油が焼けて、圧縮機内の全面にカーボンが付着し、装置内の高圧系統の膨張弁までの熱交換器や配管の汚れとなる。圧縮機を交換し、これらの高圧系統の部分を十分に洗浄すれば正常運転が可能である。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "モータ焼損によるスラッジ・酸・カーボンは「冷媒系統全体（低圧側含む）」に循環拡散するため、全系統の完全洗浄が必要（「高圧系統の部分を洗浄すれば」は誤り）。"}, {"id": 1092, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "ニ", "theme": "往復圧縮機の潤滑方式と保護", "question": "冷凍機油は、圧縮機の軸受、ロータ、ピストンなどの摺動面に油膜をつくり、摩擦によって生じる熱の除去や摩耗防止などの役割がある。往復圧縮機の潤滑の方法として、はねかけ式、強制給油式がある。はねかけ式では、クランクケース内の油量が少ないと潤滑が不十分となり、油量が多すぎると圧縮機からの油上がり量が多くなる。強制給油式では、油圧が低くなりすぎると油圧保護圧力スイッチが作動して、圧縮機が停止する。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "はねかけ式での油面管理の重要性、および強制給油式での油圧保護圧力スイッチ（OPS）による軸受焼付き保護停止の動作は正しい。"}, {"id": 1093, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "イ", "theme": "水冷凝縮器の凝縮温度影響因子", "question": "ある凝縮負荷のもとで水冷凝縮器を用いた冷凍装置を運転したとき、凝縮器の伝熱面積は定まっているので、凝縮温度に影響するものは、冷却水の温度、冷却水流量、冷却管の汚れなどである。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "凝縮温度は冷却水入口温度、冷却水量（出入口水温差）、管内外の汚れ係数（熱通過率）により決定される。"}, {"id": 1094, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "ロ", "theme": "不凝縮ガス（空気）の混入原因", "question": "不凝縮ガス（空気）が冷凍装置内に混入する原因としては、冷媒充填前の冷凍装置の冷媒系統内の真空引きが不十分で空気が残ったこと、分解修理のために開放した冷媒系統を復旧したときにその部分のエアパージが不十分で空気が残ったことなどが考えられる。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "充填前の真空引き不足、修理開放後のパージ不足、大気圧以下運転部からの吸い込みなどが空気混入の主な原因である。"}, {"id": 1095, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "ハ", "theme": "冷却管汚れによる消費電力と冷凍能力", "question": "水あかや油膜が冷却管に付くと、その熱伝導抵抗によって熱通過率の値が小さくなり、凝縮の温度と圧力が高くなるので、圧縮機の消費電力が低くなり、冷凍能力も減少する。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "凝縮圧力が高くなると圧縮比が増大するため、圧縮機の消費電力は「増加（高く）」なる（「消費電力が低くなり」は誤り）。"}, {"id": 1096, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "ニ", "theme": "満液式蒸発器の散水デフロスト前処理", "question": "満液式蒸発器において、散水方式のデフロストを行うときには、散水する前に冷媒液の供給を止めて、あらかじめ、コイル内の冷媒を回収するか、補助受液器に冷媒液を移動させてから、散水を実施する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "満液式蒸発器内に液が残ったまま散水すると急激な蒸発で異常高圧となるため、事前に冷媒液を吸引回収または補助受液器へ退避させる。"}, {"id": 1097, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "イ", "theme": "蒸発温度低下の諸要因", "question": "蒸発温度低下の原因としては、蒸発器への冷媒供給量の不足、蒸発器への霜付き、蒸発器への送風量の減少、蒸発器伝熱面積の減少、蒸発器内の冷媒に多量の冷凍機油が溶解することなどが考えられる。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "冷媒不足、着霜、風量減、油滞留による熱伝達悪化はいずれも蒸発温度低下の直接原因となる。"}, {"id": 1098, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "ロ", "theme": "蒸発温度差設定の過大影響", "question": "冷凍装置の使用目的によって、蒸発温度と被冷却流体との温度差が設定される。設定温度差が小さいと、冷蔵品の乾燥や蒸発器が着霜しやすいなどの問題も起こる。また、設定温度差が大きいと、蒸発温度を低くしなければならないので、圧縮機の駆動軸動力は低下するが、冷凍能力の減少と成績係数の低下を招く。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "冷蔵品の乾燥や過度な着霜が起きるのは設定温度差が「大きい」場合である（「設定温度差が小さいと」は誤り）。"}, {"id": 1099, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "ハ", "theme": "着霜時の蒸発圧力変化", "question": "蒸発器に霜が付くと、霜の熱伝導抵抗により熱通過率が低下し、蒸発圧力の上昇、冷却能力の減少を招く。また、フィン付き蒸発器に霜が付着すると、空気が流れるフィンの隙間が狭くなり、通風抵抗が増加し通過風量は減少する。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "熱通過率が低下すると伝熱不足により蒸発圧力は「低下」する（「蒸発圧力の上昇」は誤り）。"}, {"id": 1100, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "ニ", "theme": "乾式シェルアンドチューブの管外凍結破損リスク", "question": "乾式シェルアンドチューブ蒸発器は、冷媒が冷却管の中を流れるので、円筒胴と冷却管との間を流れるブラインや水が凍結しても、管外での凍結なので冷却管を破損させる危険性が満液式に比べると低くなる。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "管内凍結で破裂しやすい満液式に比べ、乾式は管外での凍結のため膨張応力が逃げやすく冷却管破損の危険性が低い。"}, {"id": 1101, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "イ", "theme": "アンモニアと鉱油の粘度比", "question": "アンモニアと冷凍機油（鉱油）とはほとんど溶け合わない。また、常温では、冷凍機油の粘度はアンモニア液と同じ程度であり、冷凍機油の熱伝導率はアンモニア液の1/3程度である。アンモニアの蒸発および凝縮の際の伝熱面上の油膜は、伝熱の大きな障害となるので、伝熱面からできるだけ排除することが望ましい。", "answer": "×", "law": "上級テキスト 潤滑油編", "explanation": "鉱油の粘度はアンモニア液の「約3桁（1000倍程度）大きい」（「アンモニア液と同じ程度」は誤り）。"}, {"id": 1102, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "ロ", "theme": "不凝縮ガスによる混合気境界層と界面飽和温度", "question": "凝縮器内に不凝縮ガスが存在すると、伝熱が阻害される。これは、不凝縮ガスを含む混合気境界層が液膜の外側に存在するため、冷媒の液膜表面温度が冷媒蒸気分圧に対応する飽和温度まで低下することによる。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "液膜表面に不凝縮ガスが濃縮されて冷媒分圧が下がり、気液界面温度がその分圧相当の飽和温度まで低下して凝縮伝熱を阻害する。"}, {"id": 1103, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "ハ", "theme": "水冷凝縮器の設計算術平均温度差", "question": "水冷凝縮器では、冷媒と冷却水との算術平均温度差が大きいほど凝縮作用が活発となるため、凝縮液膜が厚くなる。その結果、冷媒側の熱伝達率が小さくなる。このため、水冷凝縮器の設計で伝熱面積を決定する際には、一般に、冷媒と冷却水との間の算術平均温度差が5〜6K程度になるようにする。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "温度差大で液膜が厚くなり冷媒側熱伝達率が下がる。水冷凝縮器では算術平均温度差5〜6K程度で設計するのが標準である。"}, {"id": 1104, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "ニ", "theme": "過熱部向流方式と並流方式の比較", "question": "冷却器を用いて必要な冷却能力を効果的に得るためには、冷却しようとする空気を、冷却器の冷媒出口から入口側に向って流れるようにし、冷媒と空気とを向流方式にするのが有効である。空気を冷却器の冷媒入口側から流す並流方式にすると、過熱部での冷媒と空気との平均温度差が向流の場合よりも小さくなって、伝熱性能上不利であり、過熱部管長が長くなる。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "並流方式は過熱部での平均温度差が小さく過熱部管長が伸びて不利となるため、向流方式を採用するのが効果的である。"}, {"id": 1105, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "イ", "theme": "温度自動膨張弁の定格容量と最大容量", "question": "温度自動膨張弁の容量（冷凍能力）は、オリフィス口径と弁開度でほぼ決まるが、弁前後の高低圧間の圧力差によっても異なる。カタログなどに記載されている定格容量は、特定の凝縮温度と蒸発温度において、約80%の弁開度のときの値であり、最大容量は定格容量よりも若干大きい。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "定格容量は約80%開度を基準として定められており、全開時の最大容量には若干の余裕がある。"}, {"id": 1106, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "ロ", "theme": "外部均圧管の接続位置", "question": "外部均圧形温度自動膨張弁は、蒸発器出口と膨張弁本体の均圧管接続部との間を均圧管で接続している。蒸発器出口側の均圧管取付位置は、通常、膨張弁の感温筒取付位置より少し上流側とする。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "均圧管からのわずかな漏れ冷媒が感温筒に影響しないよう、均圧管は感温筒よりも「下流側（圧縮機側）」に接続する（「上流側とする」は誤り）。"}, {"id": 1107, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "ハ", "theme": "キャピラリチューブの気液二相流摩擦抵抗", "question": "キャピラリチューブに過冷却状態で流入した冷媒液は、摩擦抵抗により圧力が飽和圧力以下になり、自己蒸発することで気液二相の状態の流れになる。この気液二相流の状態の冷媒は、液相流の状態よりも圧力と温度が大きく低下し、チューブ出口から蒸発器に流出する。", "answer": "○", "law": "上級テキスト 膨張機構編", "explanation": "自己蒸発による二相流化で摩擦抵抗が急増し、出口に向かって急激な圧力降下と飽和温度低下を起こす。"}, {"id": 1108, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "ニ", "theme": "クロスチャージ方式の過熱度特性", "question": "感温筒のクロスチャージ方式は、冷凍装置の冷媒に対して温度と圧力の特性が異なる媒体を、感温筒にチャージしたものである。この方式の特徴は、蒸発温度が高温でも低温でも、ほぼ同じ過熱度設定値が保持できることである。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "異種媒体の特性曲線を交差させることで、広い蒸発温度域にわたって安定した過熱度制御を可能にする。"}, {"id": 1109, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "イ", "theme": "凝縮圧力調整弁（CPR）の適用凝縮器", "question": "凝縮圧力調整弁は最低の必要凝縮圧力に設定し、夏季の外気温度が高いときには全開になるため、冷媒液の流れの抵抗はほとんどない。冬季に凝縮圧力が低下すると、弁は閉じ始め、水冷凝縮器内に冷媒液を滞留させて凝縮圧力を高める。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "凝縮圧力調整弁（CPR）は「空冷凝縮器」の冬季運転用であり、「水冷凝縮器内に冷媒液を滞留させて」とする記述は誤り。"}, {"id": 1110, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "ロ", "theme": "パイロット式吸入圧力調整弁（SPR）の動作", "question": "パイロット式吸入圧力調整弁では、パイロット弁に圧縮機吸込み管と接続する均圧用ポートを有する。吸込み圧力が設定よりも低くなると、パイロット弁が開き、蒸発器側の圧力を主弁のピストン上部に導き、主弁を開くようになっている。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "吸込み圧力が設定値以下に下がるとパイロット弁が開き、主弁を開いて冷媒を通す。高くなると主弁を絞って過負荷を防ぐ。"}, {"id": 1111, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "ハ", "theme": "蒸発圧力調整弁（EPR）の等エンタルピー絞り膨張", "question": "蒸発圧力調整弁を流れる冷媒の状態変化は、温度自動膨張弁と同じ等比エンタルピーの絞り膨張である。圧縮機容量に対して蒸発器容量が小さくなった場合には、蒸発圧力調整弁での圧力降下が大きくなるので、圧縮機吸込み圧力が大きく低下し、冷凍装置の性能が低下する。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "EPRでの状態変化は等エンタルピー絞り膨張。弁で大きく絞られると圧縮機吸込み圧力が低下しCOPは悪化する。"}, {"id": 1112, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "ニ", "theme": "圧力式冷却水調整弁の始動時バイパス弁", "question": "直動式の圧力式冷却水調整弁は、凝縮圧力の変化に対応して弁開度の制御を行う。このため、凝縮負荷、水温変化、凝縮器の熱通過率の変化などに応じて、冷却水量を調節することができる。冷凍装置の始動時には、凝縮圧力が高くなるまで弁が開かないので、バイパス弁を必要とする。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "凝縮圧力で直接開閉するため応答が速い。始動時は凝縮圧力が立ち上がるまで全閉となるためバイパス弁を併設する。"}, {"id": 1113, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "イ", "theme": "圧力式断水リレーとパドル形フロースイッチ", "question": "圧力式断水リレーは冷却水出入口間の差圧を検出し、その信号で警報を発し、圧縮機を停止させる。圧力降下の少ない流路にはフロースイッチと呼ばれる流量式を用いる。パドル形フロースイッチは、配管内にパドルを入れて流れを検知する。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "差圧検出の圧力式断水リレーと、配管内に羽根（パドル）を挿入して流水力を直接検知するフロースイッチの特徴は正しい。"}, {"id": 1114, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "ロ", "theme": "圧力センサの出力および検出素子分類", "question": "圧力センサは、信号出力の違いから、電圧出力タイプと電流出力タイプの2種類があり、圧力の検出素子の違いから、セラミックダイアフラム・静電容量式、金属ダイアフラム・ひずみゲージ式などに分類される。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "インバータや電子膨張弁の精密制御に用いられる圧力センサの構造・出力分類として正しい。"}, {"id": 1115, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "ハ", "theme": "ガスチャージ式サーモスタットの温度範囲", "question": "ガスチャージ方式サーモスタットは、感温筒内の液量が少ないために応答が速く、主に高温用に使われるが、感温筒よりも受圧部の温度が高くないと正しく作動しないので、注意を要する。しかし、感温筒が最高使用温度（最高作動圧力）を多少超えても、サーモスタットを損なう危険は少ない。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "ガスチャージ方式は主に「低温用」に使われる（「主に高温用に使われる」は誤り）。"}, {"id": 1116, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "ニ", "theme": "高圧圧力スイッチの復帰方式原則", "question": "高圧圧力スイッチは、冷凍装置の高圧圧力の異常高圧防止のための安全装置や、空冷凝縮器の送風機の台数制御などの制御装置として用いられている。いずれの用途においても、高圧圧力スイッチには高い信頼性が必要であり、高圧圧力スイッチは手動復帰式でなければならない。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "安全保護用は手動復帰形が原則だが、ファンの台数制御などの「制御装置」として用いる場合は「自動復帰式」を用いる（「いずれの用途も手動復帰式」は誤り）。"}, {"id": 1117, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "イ", "theme": "金網式とバッフル式油分離器の混同", "question": "バッフル形油分離器は、容器内に円筒状の金網が2重、3重に配置され、圧縮機からの吐出しガスがこの金網を通過する際に、金網によって油滴を分離する方式で、フルオロカーボン冷媒用は、フロート弁により冷凍機油を自動的に圧縮機クランクケースに返油する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "金網を通過させて油滴を分離するのは「金網形」である。バッフル形は多数小孔付きの邪魔板に衝突させて分離する（誤り）。"}, {"id": 1118, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "ロ", "theme": "蒸発器多台数運転と高圧受液器容量", "question": "蒸発器が複数台設置されている冷凍装置では、それぞれの蒸発器の運転状態により蒸発器への冷媒液供給用電磁弁を開閉することがある。したがって、蒸発器の運転台数が変わったときには、全体の蒸発器内の冷媒量が大きく変化するので、冷媒量の変化を吸収できるような容量の高圧受液器を必要とする。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "冷却器の稼働台数変動に伴う冷媒循環量の変動・余剰液を安全に吸収するため受液器の容量確保が必要。"}, {"id": 1119, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "ハ", "theme": "低圧受液器の液面制御弁", "question": "冷媒液強制循環式冷凍装置に用いる低圧受液器は、蒸発器冷却管に低圧冷媒液を送り込むための液溜めであり、運転状態が変化しても、冷媒液ポンプと蒸発器が安定した運転を続けられるように、温度自動膨張弁により送液量を調整し、液溜めの液面高さを制御する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器の液面制御は「フロート弁」または「フロートスイッチと電磁弁の組合せ」で行う（「温度自動膨張弁により」は誤り）。"}, {"id": 1120, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "ニ", "theme": "フィルタドライヤ乾燥剤とアンモニア装置除外", "question": "フルオロカーボン冷凍装置の冷媒系統内の水分を吸着して除去するために、ろ過乾燥器の乾燥剤としてシリカゲルやゼオライトなどを使用する。また、アンモニア冷凍装置の場合、冷媒系統内の水分はアンモニアと結合しているため、乾燥剤による吸着分離がむずかしく、通常アンモニア冷凍装置に、ろ過乾燥器を使用しない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "フルオロカーボンでの物理乾燥剤使用、およびアンモニア水結合によるアンモニア装置でのドライヤ不使用は正しい。"}, {"id": 1121, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "イ", "theme": "多孔板式液分離器の流速", "question": "アンモニア用の多孔板式の液分離器は、円筒胴内の蒸気流速が1m/s以下の蒸気の流れに乗った液滴が多孔板に衝突して下方に落ち、蒸気は孔を通り抜けて流れることによって、液と蒸気を分離する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "胴内流速を1 m/s以下に減速し、多孔板への慣性衝突により効率よく液滴を分離落下させる。"}, {"id": 1122, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "ロ", "theme": "中間冷却器の種類と適用冷凍サイクル", "question": "中間冷却器には、その冷却方法により、フラッシュ式、液冷却式、直接膨張式がある。液冷却式および直接膨張式は、二段圧縮一段膨張式冷凍装置に、フラッシュ式は、二段圧縮二段膨張式冷凍装置の中間冷却器に利用される。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "液冷却式・直接膨張式は一段膨張サイクル、フラッシュ式は二段膨張サイクルの中間冷却器として利用される。"}, {"id": 1123, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "ハ", "theme": "液ガス熱交換器のアンモニア使用禁止", "question": "液ガス熱交換器は、凝縮器からの高温冷媒液と蒸発器からの低温冷媒蒸気との熱交換により、凝縮器からの冷媒液の過冷却度と圧縮機吸込み蒸気の過熱度を適度にもたせるものであり、フルオロカーボン冷凍装置およびアンモニア冷凍装置で使用される。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニアは吸込み過熱による吐出し温度上昇が著しいため「液ガス熱交換器を使用しない」（「アンモニア冷凍装置で使用される」は誤り）。"}, {"id": 1124, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "ニ", "theme": "満液式蒸発器の油回収器と返油系統", "question": "フルオロカーボン冷凍装置の満液式蒸発器や低圧受液器に入り込んだ冷凍機油は、冷媒液に溶解している。そこで、冷凍機油の溶解した冷媒液を抜き出し、油回収器で冷凍機油と冷媒蒸気に分離して、それぞれ別系統で吸込み蒸気配管へ戻すのが一般的である。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "油回収器で加熱して油と冷媒蒸気に分離し、蒸気と油をそれぞれ吸込み系統へ導いて圧縮機へ戻す。"}, {"id": 1125, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "イ", "theme": "小口径銅管のフレア管継手", "question": "フルオロカーボン冷凍装置において、管径が19.05mmまでの小口径の銅管で、取り外す可能性のある部位については、フレア管継手を使用することが多い。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "19.05mm以下の小口径銅管で点検・取外しが必要な箇所にはフレア継手が標準的に用いられる。"}, {"id": 1126, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "ロ", "theme": "グランド式止め弁のバックシート構造", "question": "グランド式の止め弁では、弁棒と弁箱との間のシールの方法が、パッキン（グランドパッキン）をパッキン押さえ（グランド）で押圧して弁棒部からの冷媒漏れを防ぐ。また、ふたに逆座（バックシート）を設けて、弁全開時に弁棒側への冷媒漏れを防ぐ構造になっており、弁が全開の状態であれば、冷媒の漏れなしにパッキンの交換が可能である。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "全開時にバックシートが弁棒側開口部をシールするため、運転中・加圧状態でもパッキン交換が可能である。"}, {"id": 1127, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "ハ", "theme": "蒸発器より下側圧縮機の立上げ配管", "question": "圧縮機が蒸発器より下側に配置されている場合には、冷凍装置の停止中に冷媒液が圧縮機に流れ落ちるのを防ぐ必要がある。そのため、冷凍機停止時にポンプダウン操作を行わないのであれば、圧縮機の吸込み蒸気配管は、蒸発器出口に小さなトラップを設け、蒸発器上部まで一度立ち上げてから圧縮機に接続する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "停止中の冷媒液の重力流入事故を防ぐため、出口トラップから蒸発器頂部まで立ち上げてから圧縮機へ下ろす。"}, {"id": 1128, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒液配管の圧力降下と流速の二乗比", "question": "液配管では、管内を流れる冷媒液の流速は1.5m/s以下とし、摩擦抵抗による圧力降下が0.02MPa以下になるように、管径を決める必要がある。これは、冷媒液の圧力降下が、一般に、流速の三乗に比例するため、圧力降下に及ぼす流速の影響が大きいためである。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "流体の摩擦圧力降下は流速の「二乗」に比例する（「三乗に比例するため」は誤り）。"}, {"id": 1129, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "イ", "theme": "高圧遮断装置の作動原理（電源遮断）", "question": "安全弁、破裂板、溶栓、高圧遮断装置などの安全装置は、いずれも設定の圧力や温度で作動し、外部に冷媒ガスを放出することで冷媒設備の圧力を許容圧力以下に戻す。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "高圧遮断装置は電動機入力を遮断して圧縮機を止めるものであり、「外部に冷媒ガスを放出する」わけではない（誤り）。"}, {"id": 1130, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "ロ", "theme": "圧縮機用と容器用安全弁の作動目的", "question": "圧縮機用安全弁は、吹出し圧力において、圧縮機が吐き出すガスの全量を噴出することが求められる。また、圧力容器用安全弁は、冷媒ガスの飽和圧力が設定された圧力に達したときに冷媒ガスを噴出し、過度の圧力上昇を防止する。", "answer": "○", "law": "上級テキスト 安全装置編", "explanation": "圧縮機用安全弁はピストン押しのけ量全量の噴出能力が必要。容器用安全弁は外部加熱等による冷媒飽和圧力上昇を逃がす。"}, {"id": 1131, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "ハ", "theme": "高圧圧力スイッチの自動復帰特例制限", "question": "高圧圧力スイッチは、圧縮機吐出し部で吐出し圧力を正確に検出する位置に圧力誘導管で接続する。圧力誘導管は、配管の上側（上面側）に接続する。また、高圧圧力スイッチは、原則として手動復帰式とするが、毒性ガス以外の冷媒を用いた自動運転方式の冷凍装置では、自動復帰式を用いてもよい。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "自動復帰形が認められるのは「可燃性・毒性以外の冷媒かつ10トン未満のユニット形等」に限定されており、「毒性ガス以外ならよい」は誤り。"}, {"id": 1132, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "ニ", "theme": "二段圧縮・強制循環の液封防止安全装置", "question": "二段圧縮冷凍装置の過冷却された液の液配管や、冷媒液強制循環式冷凍装置の低圧受液器まわりの液配管では、弁の誤操作で液封になりやすいので、液封による事故の防止のため圧力逃がし装置を取り付ける。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "誤操作で液が密閉充満されやすい箇所には、熱膨張破壊を防ぐため圧力逃がし装置（安全弁・逃がし弁）を取り付ける。"}, {"id": 1133, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "イ", "theme": "液体耐圧試験の降圧検査圧力（8/10）", "question": "耐圧試験を液体で行う場合は、圧力容器内の空気を完全に排除した後、液体を徐々に加圧して、耐圧試験圧力まで上げ、その圧力を1分間以上保っておく。その後、圧力を耐圧試験圧力の1/2まで下げて、被試験品の各部、溶接継手などについて、漏れ、異常な変形、破壊などの異常がないことを確認して合格とする。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "1分間以上保持した後に降圧して検査する圧力は「耐圧試験圧力の8/10」である（「1/2まで下げて」は誤り）。"}, {"id": 1134, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "ロ", "theme": "アンモニア設備気密試験での炭酸ガス禁止", "question": "気密試験に用いるガスは、冷媒の種類にかかわらず、空気、窒素ガスまたは炭酸ガスを用いる。空気圧縮機を使用して圧縮空気を供給する場合は、空気圧縮機の吐出し温度が140℃を超えないようにする。", "answer": "×", "law": "例示基準6、上級テキスト 試験検査編", "explanation": "アンモニア設備では残留CO2と反応して固形炭酸アンモニウムを生成するため「炭酸ガスは使用不可」である（「冷媒の種類にかかわらず炭酸ガスを用いる」は誤り）。"}, {"id": 1135, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "ハ", "theme": "真空試験の所要時間と漏れ特定限界", "question": "真空試験は、高真空を必要とするので、真空ポンプを使用しなければならない。また、微量な漏れの有無は確認できるが、漏れ箇所の特定はできない。この試験は、機器、装置の大きさや構造などによって異なるが、1時間から一昼夜近い十分に長い時間を必要とする。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "真空ポンプによる排気乾燥と微小漏れ確認を行う。系全体の漏れの有無は判定できるが漏洩箇所の特定はできない。"}, {"id": 1136, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "ニ", "theme": "突合せ溶接継手の放射線検査と継手効率", "question": "溶接部を対象に実施される非破壊試験には、放射線透過試験、超音波探傷試験、磁粉探傷試験、浸透探傷試験がある。突合せ溶接継手を対象に放射線透過試験を実施した場合には、溶接継手の効率の値を高く設定できることがある。", "answer": "○", "law": "例示基準、上級テキスト 試験検査編", "explanation": "放射線透過試験の実施割合に応じて、溶接継手効率の数値を0.7から最大1.0まで高く設定できる。"}, {"id": 1137, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "イ", "theme": "コンデンシングユニットの据付水平と配管固定", "question": "圧縮機やコンデンシングユニットを据え付けるときは、水平に据え付けることが大切である。また、コンデンシングユニットからの冷媒配管の接続にフレア管継手がある場合、冷媒配管の固定に注意し、フレア管継手に無理な力がかからないようにする。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "油面保持や偏摩耗防止のため水平据付を徹底し、振動によるフレア割れを防ぐため配管支持・固定を行う。"}, {"id": 1138, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "ロ", "theme": "密閉圧縮機の冷媒不足と過充填", "question": "密閉圧縮機を用いたフルオロカーボン冷凍装置の冷媒充填量が不足すると、吐出しガスによる電動機の冷却が不十分になり、電動機を焼損する場合がある。一方、過充填は、蒸発器で蒸発に有効に使われる伝熱面積が減少して、圧縮機の消費電力の増大を招く。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "密閉圧縮機の電動機を冷却するのは「吸込み蒸気」である（「吐出しガスによる冷却」は誤り）。過充填で伝熱面積が減少するのは「凝縮器」である（「蒸発器で」は誤り）。"}, {"id": 1139, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "ハ", "theme": "冷凍機油の具備条件", "question": "冷凍機油の選定条件として、凝固点が低く、ろう分が少ないこと、熱安定性がよく引火点が高いこと、粘度が適当で、油膜が強いこと、冷媒との溶解度が冷凍装置の構造に適合したものであること、酸に対する安定性が良いことなどが挙げられる。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "低凝固点、高引火点、適正粘度、耐酸性、熱安定性など冷凍機油の選定条件としてすべて正しい。"}, {"id": 1140, "subject": "保安管理技術", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "ニ", "theme": "基礎質量と防振支持基礎の軽量化", "question": "一般に、コンクリート基礎の質量は、その上に据え付ける機器の質量よりも大きくする。特に、多気筒圧縮機では、機器の質量の2倍から3倍の質量の基礎が必要である。なお、防振装置を備えた防振支持の基礎は、通常の基礎に比べて軽量にすることができる。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "多気筒圧縮機では機械質量の2〜3倍が必要。防振支持を用いる場合は基礎質量を通常の基礎より軽量にできる。"}, {"id": 1141, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "イ", "theme": "コンパウンド往復圧縮機の配管
