ct": "法令", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "ロ", "theme": "受液器の流出防止措置（1万L基準）（事例1）", "question": "（アンモニア250t）この受液器は、その周囲に冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じるべきものに該当しない。", "answer": "○", "law": "冷規第7条第1項第13号", "explanation": "毒性冷媒の流出防止措置（防液堤等）が必要な受液器は内容積「10,000 L以上」である。本問は6,000 Lのため義務付けられない（該当しないは正）。"}, {"id": 459, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "ハ", "theme": "耐震設計の該当性（受液器と横置凝縮器）（事例1）", "question": "（アンモニア250t）この凝縮器及び受液器のいずれも、所定の耐震に関する性能を有すべきものに該当する。", "answer": "×", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上で該当するが、凝縮器は「縦置円筒形で胴長5m以上」が対象であり、横置円筒形の本凝縮器は対象外（いずれも該当するは誤り）。"}, {"id": 460, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "イ", "theme": "代理者による自主検査監督（事例2）", "question": "（R134a 600t）冷凍保安責任者が病気で不在のため、この製造施設の定期自主検査を冷凍保安責任者の代理者の監督のもとに実施した。", "answer": "○", "law": "法第33条第1項、冷規第44条第4項", "explanation": "責任者が不在時は、あらかじめ選任された代理者が定期自主検査の実施監督を代行できるため正。"}, {"id": 461, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の選任・解任届（事例2）", "question": "（R134a 600t）冷凍保安責任者の代理者を選任又は解任したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第27条の2第5項、法第33条第3項", "explanation": "代理者の選任・解任についても、責任者と同様に遅滞なく知事等へ届け出なければならない。"}, {"id": 462, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者の実務経験年数（事例2）", "question": "（R134a 600t）冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が20トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者のうちから選任しなければならない。", "answer": "×", "law": "冷規第36条第1項", "explanation": "設備A（300トン）の選任基準は、第一種免状＋「100トン以上」の施設での製造経験1年以上が必要（20トン以上では不可のため誤り）。"}, {"id": 463, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "イ", "theme": "圧縮機取替の軽微変更届（事例2）", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更がないものは、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で、切断溶接なし・能力変更なしの設備取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 464, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "ロ", "theme": "製造設備以外の設備取替え（事例2）", "question": "（R134a 600t）製造設備以外の製造施設に係る設備の取替えの工事を行う場合、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等にその旨を届け出ればよい。", "answer": "○", "law": "冷規第17条第1項第3号", "explanation": "「製造設備以外の製造施設に係る設備の取替え工事」は軽微な変更工事に該当するため、完成後遅滞なく届け出ればよい。"}, {"id": 465, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "ハ", "theme": "能力変更所定範囲の完成検査不要（事例2）", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなければならないが、その変更の工事の完成後、その製造施設の完成検査を受けることなくこれを使用することができる。", "answer": "○", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "不活性フルオロカーボン設備で切断溶接なし・能力変更が告示範囲内（20%以内）の取替えは、許可は必要だが完成検査を受けずに使用できる。"}, {"id": 466, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問16", "branch": "イ", "theme": "認定指定設備の保安検査除外（事例2）", "question": "（R134a 600t）この事業者は、認定指定設備である製造設備Bの部分を除く製造施設について、定期に保安検査を受けなければならない。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備は特定施設から除外されるため、保安検査は設備Bを除く設備Aについて受検する。"}, {"id": 467, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問16", "branch": "ロ", "theme": "保安検査の対象（設備基準のみ）（事例2）", "question": "（R134a 600t）保安検査は、特定施設が製造施設の位置、構造及び設備並びに高圧ガスの製造の方法に係る技術上の基準に適合しているかどうかについて行われる。", "answer": "×", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、「製造の方法（ソフト基準）」は対象に含まれない（誤り）。"}, {"id": 468, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問16", "branch": "ハ", "theme": "保安検査の実施主体（行政検査）（事例2）", "question": "（R134a 600t）保安検査を実施することは、冷凍保安責任者の職務の一つとして定められている。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事等又は指定検査機関が行う行政検査であり、自社の冷凍保安責任者の職務ではない（誤り）。"}, {"id": 469, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問17", "branch": "イ", "theme": "指定設備の定期自主検査義務（事例2）", "question": "（R134a 600t）定期自主検査は、認定指定設備である製造設備Bの部分を除く製造施設について実施しなければならない。", "answer": "×", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "認定指定設備（設備B）も定期自主検査の義務対象であり、これを除外してはならない（除くは誤り）。"}, {"id": 470, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問17", "branch": "ロ", "theme": "自主検査の対象（設備基準）（事例2）", "question": "（R134a 600t）定期自主検査は、製造の方法が所定の技術上の基準に適合しているかどうかについて、1年に1回以上行わなければならない。", "answer": "×", "law": "法第35条の2、冷規第44条第3項", "explanation": "定期自主検査は施設の位置・構造・設備について行うものであり、「製造の方法」は対象に含まれない（誤り）。"}, {"id": 471, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査記録の監督者氏名（事例2）", "question": "（R134a 600t）定期自主検査を行ったとき、検査の実施について監督を行った者の氏名は、その検査記録に記載すべき事項の一つである。", "answer": "○", "law": "冷規第44条第5項第4号", "explanation": "定期自主検査記録の法定記載事項として「検査の実施について監督を行った者の氏名」が明定されている。"}, {"id": 472, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問18", "branch": "イ", "theme": "火気隔離基準の適用（不活性ガス）（事例2）", "question": "（R134a 600t）圧縮機及び受液器並びにこれらの間の配管が引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所及び火気（その製造設備内のものを除く。）の付近にあってはならない旨の定めは、この事業所には適用されない。", "answer": "×", "law": "冷規第7条第1項第1号", "explanation": "火気・可燃物からの隔離基準は冷媒種によらず全設備に適用されるため、「適用されない」は誤り。"}, {"id": 473, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問18", "branch": "ロ", "theme": "気体耐圧試験の圧力倍率（1.25倍）（事例2）", "question": "（R134a 600t）冷媒設備の配管以外の部分について行う耐圧試験は、水その他の安全な液体を使用して行うことが困難であると認められる場合、この試験を空気、窒素等の気体を使用して許容圧力の1.25倍以上の圧力で行うことができる。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "液体が困難な場合の気体耐圧試験圧力は「許容圧力の1.25倍以上」で行うことができる。"}, {"id": 474, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問18", "branch": "ハ", "theme": "自動制御バルブの操作措置除外（事例2）", "question": "（R134a 600t）製造設備Aに設けたバルブ又はコック（操作ボタン等により開閉するものにあっては、その操作ボタン等）には、作業員が適切にそのバルブ又はコックを操作することができるような措置を講じるべき定めがあるが、操作ボタン等を使用することなく自動制御で開閉されるバルブ又はコックには、その定めはない。", "answer": "○", "law": "冷規第7条第1項第17号", "explanation": "ボタン等を使わず全自動制御されるバルブ・コックは、作業員の操作措置義務から除外されている。"}, {"id": 475, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問19", "branch": "イ", "theme": "日常点検の対象範囲（施設全体）（事例2）", "question": "（R134a 600t）高圧ガスの製造は、1日に1回以上、その製造設備のうち冷媒設備のみについて異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "×", "law": "冷規第9条第2号", "explanation": "日常点検の対象は冷媒設備のみではなく「製造施設全体」である（冷媒設備のみとする記述は誤り）。"}, {"id": 476, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問19", "branch": "ロ", "theme": "開放修理・清掃時の漏洩防止（事例2）", "question": "（R134a 600t）冷媒設備を開放して修理又は清掃をする場合、その開放する部分に他の部分からガスが漏えいすることを防止するための措置を講じないで行うことができる。", "answer": "×", "law": "冷規第9条第3号ハ", "explanation": "開放修理・清掃時の漏洩防止措置はすべての冷媒ガス設備に義務付けられており、講じないで行うことはできない（誤り）。"}, {"id": 477, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問19", "branch": "ハ", "theme": "修理時の作業計画・責任者（全設備）（事例2）", "question": "（R134a 600t）冷媒設備の修理を行うときは、製造設備A又は製造設備Bのいずれの修理の場合であっても、その作業計画及びその作業の責任者を定めなければならない。", "answer": "○", "law": "冷規第9条第3号イ", "explanation": "認定指定設備（設備B）であっても修理時にはあらかじめ作業計画及び作業責任者を定めて行う義務がある。"}, {"id": 478, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の試運転・一体搬入（事例2）", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つに、「冷媒設備は、その設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されるものであること。」がある。", "answer": "○", "law": "冷規第57条第5号", "explanation": "製造業者の事業所で試運転を行い、現場へ分割されずに一体搬入されることが構造条件である。"}, {"id": 479, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の手動止め弁禁止（事例2）", "question": "（R134a 600t・設備B）この製造設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用することができる。", "answer": "×", "law": "冷規第57条第12号", "explanation": "指定設備の日常運転操作用止め弁には「手動式のものを使用しないこと」と定められている（使用できるは誤り）。"}, {"id": 480, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の同等部品交換（事例2）", "question": "（R134a 600t・設備B）この製造設備に変更の工事を施したとき、その工事が同等の部品への交換のみである場合は、指定設備認定証は無効にならないと定められている。", "answer": "○", "law": "冷規第62条第1項第1号", "explanation": "同等部品への交換のみである変更工事の場合は、指定設備認定証は無効とならない。"}, {"id": 481, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "イ", "theme": "法の目的（自主活動の促進）", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費の規制をすることのみを定めている。", "answer": "×", "law": "法第1条", "explanation": "法第1条では行政規制だけでなく「民間事業者及び高圧ガス保安協会による自主的な活動の促進」も目的に明定されている（「規制することのみ」は誤り）。"}, {"id": 482, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義（圧縮ガス）", "question": "現在の圧力が0.1メガパスカルの圧縮ガス（圧縮アセチレンガスを除く。）であって、温度35度において圧力が0.2メガパスカルとなるものは、高圧ガスである。", "answer": "×", "law": "法第2条第1号", "explanation": "圧縮ガスは常用温度で現に1 MPa以上、または35℃で1 MPa以上が高圧ガスである。35℃で0.2 MPaのものは高圧ガスではない（誤り）。"}, {"id": 483, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ハ", "theme": "適用除外（3t以上5t未満）", "question": "1日の冷凍能力が3トン以上5トン未満の冷凍設備内における高圧ガスであっても、そのガスの種類によっては、高圧ガス保安法の適用を受けないものがある。", "answer": "○", "law": "政令第2条第5項第4号", "explanation": "3トン以上5トン未満の設備内では、第1種ガス（不活性・難燃性フルオロカーボンや二酸化炭素）が高圧ガス保安法の適用除外となるため正。"}, {"id": 484, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "イ", "theme": "認定指定設備の届出（50t以上）", "question": "認定指定設備のみを使用して冷凍のため高圧ガスの製造をしようとする者は、その設備の1日の冷凍能力が50トン以上である場合であっても、その製造について都道府県知事等の許可を受ける必要はないが、製造開始の日の20日前までにその旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第5条第2項第2号、政令第4条、法第35条の2", "explanation": "認定指定設備のみを用いる場合は第一種製造者（許可）から除外され、第二種製造者として製造開始20日前までに知事へ届け出ればよい。"}, {"id": 485, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ロ", "theme": "製造廃止の手続（許可ではなく届出）", "question": "冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造を廃止しようとするとき、都道府県知事等の許可を受けなければならない。", "answer": "×", "law": "法第21条第1項", "explanation": "製造を廃止したときは遅滞なく「届け出」れば足り、「許可」を受ける必要はない（誤り）。"}, {"id": 486, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ハ", "theme": "施設変更の許可原則", "question": "冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造施設の位置、構造又は設備の変更の工事をしようとするときは、その工事が定められた軽微なものである場合を除き、都道府県知事等の許可を受けなければならない。", "answer": "○", "law": "法第14条第1項", "explanation": "第一種製造者が位置・構造・設備の変更工事をしようとするときは、軽微な変更を除き事前に知事等の許可を受けなければならない。"}, {"id": 487, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "イ", "theme": "事業譲渡による承継除外", "question": "冷凍のため高圧ガスの製造をする第一種製造者がその高圧ガスの製造事業の全部を譲り渡したときは、その事業の全部を譲り受けた者はその第一種製造者の地位を承継する。", "answer": "×", "law": "法第10条第1項", "explanation": "事業の譲渡・譲受による承継規定はない。譲受人は新規に製造許可を取得する必要がある（誤り）。"}, {"id": 488, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ロ", "theme": "不活性ガスの廃棄基準除外", "question": "特定不活性ガスを除く不活性ガスは、冷凍保安規則に定められている高圧ガスの廃棄に係る技術上の基準に従って廃棄しなければならない高圧ガスとして定められていない。", "answer": "○", "law": "法第25条、冷規第33条", "explanation": "廃棄基準の対象は可燃性ガス、毒性ガス及び特定不活性ガスであり、特定不活性ガスを除く不活性ガスは対象外である。"}, {"id": 489, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ハ", "theme": "機器製造業者の対象（5t）", "question": "1日の冷凍能力が5トンの専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）は、所定の技術上の基準に従ってその機器の製造をしなければならない。", "answer": "○", "law": "法第57条、冷規第63条", "explanation": "冷媒種を問わず、冷凍能力5トンの機器はすべて機器製造業者の技術基準遵守対象となる（第一種ガスは5t以上、その他は3t以上）。"}, {"id": 490, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の区分（アンモニア10t）", "question": "アンモニアを冷媒ガスとする冷凍設備であって、1日の冷凍能力が10トンのもののみを使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条第2項第2号、政令第4条", "explanation": "アンモニア設備は冷凍能力5トン以上50トン未満が第二種製造者に該当するため、10トンの設備は第二種製造者となる。"}, {"id": 491, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ロ", "theme": "第二種製造者の定期自主検査義務", "question": "第二種製造者のうちには、製造施設について定期自主検査を行わなければならない者がある。", "answer": "○", "law": "法第35条の2、冷規第44条第1項", "explanation": "認定指定設備使用者や、アンモニア・可燃性フルオロカーボンで20トン以上の第二種製造者には定期自主検査義務がある。"}, {"id": 492, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ハ", "theme": "気密試験・試運転のガス条件", "question": "製造設備の変更の工事を完成したときは、酸素以外のガスを使用する試運転又は所定の気密試験を行った後でなければ高圧ガスの製造をしてはならない。", "answer": "○", "law": "法第12条第2項、冷規第14条第1号", "explanation": "工事完成時は、酸素以外のガスによる試運転又は許容圧力以上の気密試験を行わなければ製造してはならない。"}, {"id": 493, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "イ", "theme": "特定不活性ガスの消火設備携行", "question": "特定不活性ガスである液化フルオロカーボン32を移動するときは、消火設備並びに災害発生防止のための応急措置に必要な資材及び工具等を携行しなければならない。", "answer": "○", "law": "一般則第50条第9号", "explanation": "特定不活性ガス（R32等）の容器（48L）積載移動時には、消火設備および応急資材・工具の携行が義務付けられている。"}, {"id": 494, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ロ", "theme": "毒性ガスの保護具携行義務", "question": "液化アンモニアを移動するときは、その高圧ガスの種類に応じた防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等も携行しなければならない。", "answer": "○", "law": "一般則第50条第10号", "explanation": "毒性ガス（アンモニア等）移動時には、防毒マスク・保護手袋・応急資材等の携行が義務付けられている。"}, {"id": 495, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ハ", "theme": "特定不活性ガスの書面交付・携帯（イエローカード）", "question": "特定不活性ガスである液化フルオロカーボン32を移動するときは、その高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。", "answer": "○", "law": "一般則第49条第1項第21号、同第50条第14号", "explanation": "特定不活性ガスの移動時にも、イエローカード（注意事項書面）の交付・携帯・遵守義務が課されている。"}, {"id": 496, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "イ", "theme": "附属品再検査の期間決定要因", "question": "容器に装置されているバルブの附属品再検査の期間は、そのバルブの製造後の経過年数のみに応じて定められている。", "answer": "×", "law": "容規第27条第1項第1号", "explanation": "バルブの再検査期間は、バルブ自体の経過年数のみではなく「装置されている容器の容器再検査の期間」に連動して定められている（「経過年数のみに応じて」は誤り）。"}, {"id": 497, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ロ", "theme": "容器の譲渡・引渡制限", "question": "容器の製造又は輸入をした者は、特に定められた容器を除き、所定の容器検査を受け、これに合格したものとして所定の刻印等がされているものでなければ、容器を譲渡し、又は引き渡してはならない。", "answer": "○", "law": "法第44条第1項", "explanation": "容器製造・輸入者は、容器検査に合格し刻印等がされたものでなければ譲渡・引渡しが禁じられている。"}, {"id": 498, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ハ", "theme": "附属品検査合格時の刻印義務", "question": "容器の附属品が附属品検査に合格したときは、特に定める場合を除き、その附属品に所定の方法で刻印しなければならない。", "answer": "○", "law": "法第49条の3第1項、容規第18条第1項", "explanation": "附属品検査合格時は、附属品の厚肉部の見やすい箇所に所定事項を刻印しなければならない。"}, {"id": 499, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "イ", "theme": "可燃性ガス置場の燈火制限", "question": "液化アンモニアの容器置場には、携帯電燈以外の燈火を携えて立ち入ってはならない。", "answer": "○", "law": "一般則第6条第2項第8号チ", "explanation": "アンモニアは可燃性ガスに指定されているため、容器置場には携帯電燈以外の燈火を携えて立ち入ることは禁止されている。"}, {"id": 500, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ロ", "theme": "貯蔵所における車両積載容器貯蔵", "question": "車両に積載した容器により高圧ガスを貯蔵するときは、都道府県知事等の許可を受けて設置する第一種貯蔵所又は都道府県知事等に届出を行って設置する第二種貯蔵所において貯蔵することができる。", "answer": "○", "law": "一般則第18条第2号ホ", "explanation": "原則禁止される車両積載容器貯蔵も、第一種貯蔵所（許可）又は第二種貯蔵所（届出）においては適法に行うことができる。"}, {"id": 501, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ハ", "theme": "特定不活性ガスの通風貯蔵除外", "question": "アンモニアの充填容器及び残ガス容器を貯蔵する場合は、通風の良い場所で行わなければならないが、特定不活性ガスであるフルオロカーボン32については、その定めはない。", "answer": "○", "law": "一般則第18条第2号イ", "explanation": "通風の良い場所での貯蔵義務は「可燃性ガス又は毒性ガス」に限定されており、特定不活性ガス（R32）は対象から除外されている。"}, {"id": 502, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "イ", "theme": "多段圧縮方式の冷凍能力算定式", "question": "多段圧縮方式による製造設備の1日の冷凍能力の算定に必要な数値の一つに、蒸発器の冷媒ガスに接する側の表面積の数値がある。", "answer": "×", "law": "冷規第5条第4号", "explanation": "多段圧縮方式は高段気筒と低段気筒のピストン押しのけ量（VH + 0.08VL）を用いて算定する。蒸発器表面積は不要（誤り）。"}, {"id": 503, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ロ", "theme": "吸収式冷凍設備の算定定数", "question": "吸収式冷凍設備にあっては、発生器を加熱する1時間の入熱量2万7,800キロジュールをもって1日の冷凍能力1トンとする。", "answer": "○", "law": "冷規第5条第2号", "explanation": "吸収式冷凍設備は、発生器入熱量 27,800 kJ/h をもって1日の冷凍能力1トンとする。"}, {"id": 504, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ハ", "theme": "遠心式圧縮機の算定定数", "question": "遠心式圧縮機を使用する製造設備にあっては、その圧縮機の原動機の定格出力1.2キロワットをもって1日の冷凍能力1トンとする。", "answer": "○", "law": "冷規第5条第1号", "explanation": "遠心式圧縮機を使用する設備は、原動機定格出力 1.2 kW をもって1日の冷凍能力1トンとする。"}, {"id": 505, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "イ", "theme": "指定場所の火気制限（何人も）（事例1）", "question": "（アンモニア250t）この事業者がその事業所内において指定した場所では、その事業所の従業者を除き、何人も火気を取り扱ってはならない。", "answer": "×", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、自社の従業者であっても例外なく禁止される（除きは誤り）。"}, {"id": 506, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ロ", "theme": "危険時の通報義務（発見者）（事例1）", "question": "（アンモニア250t）高圧ガスの製造施設が危険な状態になったときは、直ちに、特に定める災害の発生の防止のための応急の措置を講じなければならない。また、この事業者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。", "answer": "○", "law": "法第36条第1項・第2項", "explanation": "直ちに応急措置を講じる義務とともに、事態を発見した者は事業者であるか否かを問わず直ちに通報届出を行う義務がある。"}, {"id": 507, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ハ", "theme": "危害予防規程の届出義務（事例1）", "question": "（アンモニア250t）この事業者は、危害予防規程を定め、従業者とともに、これを忠実に守らなければならないが、その危害予防規程を都道府県知事等に届け出るべき定めはない。", "answer": "×", "law": "法第26条第1項", "explanation": "危害予防規程は作成して「都道府県知事等に届け出なければならない」（定めがないは誤り）。"}, {"id": 508, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "イ", "theme": "保安教育計画の届出不要（事例1）", "question": "（アンモニア250t）この事業者は、従業者に対する保安教育計画を定め、その計画を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務だが、計画そのものを知事等へ届け出る義務はない（誤り）。"}, {"id": 509, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録帳簿の保存期間（事例1）", "question": "（アンモニア250t）この事業者は、この事業所に所定の帳簿を備え、製造施設に異常があった場合、その年月日及びそれに対してとった措置を帳簿に記載し、記載の日から10年間保存しなければならない。", "answer": "○", "law": "法第60条第1項、冷規第65条", "explanation": "異常時記録帳簿は記載の日から10年間保存しなければならない。"}, {"id": 510, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ハ", "theme": "災害発生時の届出義務（事例1）", "question": "（アンモニア250t）この事業者は、その所有し、又は占有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。", "answer": "○", "law": "法第63条第1項第1号", "explanation": "高圧ガスについて災害が発生したときは、遅滞なく都道府県知事等又は警察官に届け出なければならない。"}, {"id": 511, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア設備の軽微変更除外（事例1）", "question": "（アンモニア250t）この製造施設の製造設備の取替えの工事においては、定められた軽微な変更の工事に該当するものはない。", "answer": "○", "law": "冷規第17条第1項第2号", "explanation": "毒性・可燃性であるアンモニア冷媒設備は軽微な変更工事の対象から除外されているため、該当するものはない。"}, {"id": 512, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ロ", "theme": "施設譲渡と完成検査免除（事例1）", "question": "（アンモニア250t）既に完成検査を受け所定の技術上の基準に適合していると認められているこの製造施設の全部の引渡しがあった場合、その引渡しを受けた者は、都道府県知事等の許可を受け、改めて都道府県知事等が行う完成検査を受けなければこの製造施設を使用することができない。", "answer": "×", "law": "法第20条第2項", "explanation": "既に完成検査済みの施設の引渡しを受けて許可を受けた者は、改めて完成検査を受けることなく使用できる（受けなければ使用できないは誤り）。"}, {"id": 513, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ハ", "theme": "完成検査不要工事の特例除外（事例1）", "question": "（アンモニア250t）製造施設の変更の工事のうちには、都道府県知事等の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事があり、この製造施設のうち冷媒設備の取替えの工事に適用される。", "answer": "×", "law": "法第20条第3項、冷規第23条", "explanation": "アンモニア設備は完成検査不要工事の特例から除外されているため、本事業所の取替え工事には適用されない（誤り）。"}, {"id": 514, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "イ", "theme": "受液器液面計の二重防護措置（事例1）", "question": "（アンモニア250t）この受液器にガラス管液面計を設ける場合には、その液面計の破損を防止するための措置又は受液器とガラス管液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置のいずれか一方の措置を講じなければならない。", "answer": "×", "law": "冷規第7条第1項第10号・第11号", "explanation": "アンモニア受液器では、丸形以外の液面計とし破損防止措置と漏洩防止措置の「両方」を講じなければならない（「いずれか一方」は誤り）。"}, {"id": 515, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ロ", "theme": "受液器の流出防止措置（1万L）（事例1）", "question": "（アンモニア250t）この受液器は、その周囲にその液状の冷媒ガスが漏えいした場合に、その流出を防止するための措置を講じなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第13号", "explanation": "毒性冷媒の流出防止措置（防液堤等）が必要な受液器は内容積「10,000 L以上」である。本問は6,000 Lのため該当しない（誤り）。"}, {"id": 516, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ハ", "theme": "安全弁放出管の開口部位置（事例1）", "question": "（アンモニア250t）この冷媒設備の安全弁（大気に冷媒ガスを放出することのないものを除く。）には、放出管を設けなければならない。また、放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。", "answer": "○", "law": "冷規第7条第1項第9号", "explanation": "大気放出型安全弁には放出管を設け、アンモニアの毒性・可燃性に応じた安全な位置に開口部を配置しなければならない。"}, {"id": 517, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "イ", "theme": "消火設備の設置義務（可燃性）（事例1）", "question": "（アンモニア250t）この製造施設は、その規模に応じて、適切な消火設備を適切な箇所に設けなければならない施設に該当する。", "answer": "○", "law": "冷規第7条第1項第12号", "explanation": "アンモニアは可燃性ガスであるため、規模に応じた消火設備の設置義務が適用される。"}, {"id": 518, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ロ", "theme": "放出管設置による除害措置免除不可（事例1）", "question": "（アンモニア250t）冷媒設備の安全弁に放出管を設けた場合は、製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じる必要はない。", "answer": "×", "law": "冷規第7条第1項第16号", "explanation": "毒性ガスの除害措置義務は、安全弁に放出管を設けても免除されない（必要はないは誤り）。"}, {"id": 519, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ハ", "theme": "耐震設計の該当性（受液器と横置凝縮器）（事例1）", "question": "（アンモニア250t）この凝縮器及び受液器のいずれも、所定の耐震に関する性能を有しなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上で該当するが、横置円筒形凝縮器は対象外であるため「いずれも」は誤り。"}, {"id": 520, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "イ", "theme": "冷凍保安責任者の選任要件（事例2）", "question": "（R134a 600t）この事業所の冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が100トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者を選任しなければならない。", "answer": "○", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "認定指定設備Bを除く設備A（300トン）で判定する。300トン以上の設備は「第一種冷凍機械責任者免状」＋「100トン以上で1年以上の実務経験」が必要。"}, {"id": 521, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の事前選任義務（事例2）", "question": "（R134a 600t）冷凍保安責任者が疾病その他の事故によって、その職務を行うことができないときは、直ちに、その代理者を選任しなければならない。", "answer": "×", "law": "法第33条第1項", "explanation": "代理者は事故発生時に選任するのではなく、「あらかじめ」選任しておかなければならない（直ちに選任は誤り）。"}, {"id": 522, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者の解任届出義務（事例2）", "question": "（R134a 600t）選任している冷凍保安責任者を解任し、新たな者を選任したときは、遅滞なく、選任した者についてその旨を都道府県知事等に届け出なければならないが、解任した者についてはその旨を都道府県知事等に届け出る必要はない。", "answer": "×", "law": "法第27条の2第5項、法第27条の4第2項", "explanation": "冷凍保安責任者を選任したときだけでなく、「解任したとき」も遅滞なく届け出なければならない（必要はないは誤り）。"}, {"id": 523, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "イ", "theme": "凝縮器取替の軽微変更届（事例2）", "question": "（R134a 600t）製造設備Aの凝縮器の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その取替えに係る凝縮器が耐震設計構造物の適用を受けないものである場合、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で切断溶接なし・耐震対象外・能力変更なしの凝縮器取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 524, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ロ", "theme": "製造設備以外の設備取替（軽微変更）（事例2）", "question": "（R134a 600t）製造設備以外の製造施設に係る設備の取替え工事を行う場合、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "冷規第17条第1項第3号", "explanation": "製造設備以外の製造施設に係る設備の取替え工事は、軽微な変更工事に該当する。"}, {"id": 525, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ハ", "theme": "能力変更所定範囲の許可と完成検査（事例2）", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなくてよいが、その変更の工事の完成後、所定の完成検査を受けなければこれを使用することはできない。", "answer": "×", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "能力変更を伴う工事は「事前に許可が必要」であり、完成検査不要工事に該当するため「完成検査は受けなくてよい」（記述が逆であり誤り）。"}, {"id": 526, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問16", "branch": "イ", "theme": "保安検査の実施主体（行政検査）（事例2）", "question": "（R134a 600t）保安検査を実施することは、冷凍保安責任者の職務の一つとして定められている。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事等又は指定検査機関が行う行政検査であり、自社の冷凍保安責任者の職務ではない（誤り）。"}, {"id": 527, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問16", "branch": "ロ", "theme": "保安検査の対象（設備基準のみ）（事例2）", "question": "（R134a 600t）保安検査は、製造設備Bの部分を除き、製造施設の位置、構造及び設備並びに製造の方法が所定の技術上の基準に適合しているかどうかについて行われる。", "answer": "×", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、「製造の方法（ソフト基準）」は含まれない（誤り）。"}, {"id": 528, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問16", "branch": "ハ", "theme": "保安検査の実施機関（事例2）", "question": "（R134a 600t）保安検査は、都道府県知事等、高圧ガス保安協会又は指定保安検査機関のいずれかが行う。", "answer": "○", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事等が行うほか、高圧ガス保安協会又は指定保安検査機関で行うことができる。"}, {"id": 529, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問17", "branch": "イ", "theme": "定期自主検査記録の法定記載事項（事例2）", "question": "（R134a 600t）定期自主検査の検査記録に記載すべき事項の一つに、検査をした製造施設の設備ごとの検査方法及び結果がある。", "answer": "○", "law": "冷規第44条第5項第2号", "explanation": "定期自主検査記録の法定記載事項として「検査をした製造施設の設備ごとの検査方法及び結果」が明定されている。"}, {"id": 530, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問17", "branch": "ロ", "theme": "認定指定設備の定期自主検査義務（事例2）", "question": "（R134a 600t）認定指定設備である製造設備Bについては、定期自主検査を行わなくてよい。", "answer": "×", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "認定指定設備（設備B）も定期自主検査の義務対象であり、点検を行わなくてよいとする記述は誤り。"}, {"id": 531, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査計画の届出不要（事例2）", "question": "（R134a 600t）定期自主検査を行うときは、あらかじめ、その検査計画を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第35条の2", "explanation": "定期自主検査の計画をあらかじめ知事等に届け出る義務は定められていない（誤り）。"}, {"id": 532, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問18", "branch": "イ", "theme": "火気隔離基準の例外措置（事例2）", "question": "（R134a 600t）冷媒設備の圧縮機は、その製造設備外の火気の付近にあってはならない。ただし、その火気に対して安全な措置を講じた場合は、この限りでない。", "answer": "○", "law": "冷規第7条第1項第1号", "explanation": "圧縮機等は火気の付近にあってはならないが、火気に対して安全な防護措置を講じた場合は設置が認められる。"}, {"id": 533, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問18", "branch": "ロ", "theme": "液体耐圧試験の圧力倍率（1.5倍）（事例2）", "question": "（R134a 600t）配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.25倍の圧力で行わなければならない。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "水その他の安全な液体を使用する耐圧試験圧力は「許容圧力の1.5倍以上」である（1.25倍は気体使用時の基準であり誤り）。"}, {"id": 534, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問18", "branch": "ハ", "theme": "ボタン操作バルブの操作措置（事例2）", "question": "（R134a 600t）製造設備に設けたバルブ又はコックを操作ボタン等により開閉する場合には、作業員がその操作ボタン等を適切に操作することができるような措置を講じることと定められている。", "answer": "○", "law": "冷規第7条第1項第17号", "explanation": "操作ボタン等により開閉するバルブ・コックには、作業員がそのボタン等を適切に操作できる措置を講じなければならない。"}, {"id": 535, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問19", "branch": "イ", "theme": "油圧系統以外の圧力計義務（事例2）", "question": "（R134a 600t）冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有するものであれば、その油圧系統を除く冷媒設備に圧力計を設ける必要はない。", "answer": "×", "law": "冷規第7条第1項第7号", "explanation": "油圧保護装置（OPS）がある場合に圧力計が免除されるのは「当該油圧系統」のみであり、油圧系統を除く冷媒設備本体には圧力計の設置が必要である（誤り）。"}, {"id": 536, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問19", "branch": "ロ", "theme": "凝縮器気密試験の圧力基準（事例2）", "question": "（R134a 600t）認定指定設備である製造設備Bの冷媒設備のうち、凝縮器の気密試験は、許容圧力と同じ圧力で行ってよい。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "気密試験は「許容圧力以上の圧力」で行うこととされているため、許容圧力と同じ圧力で行ってよい。"}, {"id": 537, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問19", "branch": "ハ", "theme": "日常点検の対象範囲（施設全体）（事例2）", "question": "（R134a 600t）高圧ガスの製造は、1日に1回以上、その製造設備のうち冷媒設備のみについて異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "×", "law": "冷規第9条第2号", "explanation": "日常点検の対象は冷媒設備のみではなく「製造施設全体」である（誤り）。"}, {"id": 538, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問20", "branch": "イ", "theme": "認定指定設備の変更・移設と認定証返納（事例2）", "question": "（R134a 600t・設備B）この製造設備に変更の工事を施したとき、又はこの製造設備を移設したときは、指定設備認定証を返納しなければならない場合がある。", "answer": "○", "law": "冷規第62条第1項・第2項", "explanation": "同等部品交換を除く改造工事や、基準適合書のない移設を行った場合は認定証が無効となり、返納しなければならない。"}, {"id": 539, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の自動制御装置（事例2）", "question": "（R134a 600t・設備B）この製造設備には、自動制御装置が設けられていなければならない。", "answer": "○", "law": "冷規第57条第13号", "explanation": "認定指定設備の構造基準として「自動制御装置を設けること」が義務付けられている。"}, {"id": 540, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の組立場所（製造業者）（事例2）", "question": "（R134a 600t・設備B）この製造設備の冷媒設備は、使用場所であるこの事業所において、一つの架台上に組み立てられたものである。", "answer": "×", "law": "冷規第57条第3号", "explanation": "指定設備は「製造業者の事業所において」脚上又は一つの架台上に組み立てられたものでなければならない（使用場所において組み立ては誤り）。"}, {"id": 541, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "イ", "theme": "法の目的（自主活動の促進）", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、民間事業者による高圧ガスの保安に関する自主的な活動を促進することも定めている。", "answer": "○", "law": "法第1条", "explanation": "法第1条（目的）に明定されている通り、行政による規制と並んで民間事業者及び協会による自主的な保安活動の促進が目的の柱である。"}, {"id": 542, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義（液化ガス35℃）", "question": "常用の温度において圧力が0.1メガパスカルとなる液化ガスであって、圧力が0.2メガパスカルとなる温度が35度であるものは、高圧ガスである。", "answer": "○", "law": "法第2条第3号", "explanation": "液化ガスは「圧力が0.2 MPaとなる温度が35℃以下」であれば高圧ガスとなる。35℃で0.2 MPaとなるものは要件を満たすため高圧ガスである。"}, {"id": 543, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ハ", "theme": "適用除外（全フルオロカーボンではない）", "question": "1日の冷凍能力が5トン未満の冷凍設備内における冷媒ガスである全てのフルオロカーボンは、高圧ガス保安法の適用を受けない。", "answer": "×", "law": "政令第2条第5項第3号・第4号", "explanation": "3トン以上5トン未満で除外されるのは「難燃性・不活性フルオロカーボン等」に限られ、可燃性フルオロカーボン等は除外されないため「全て」は誤り。"}, {"id": 544, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "イ", "theme": "製造許可の能力最小値比較", "question": "冷凍のための設備を使用して高圧ガスの製造をしようとする者が、その製造について都道府県知事等の許可を受けなければならない場合の1日の冷凍能力の最小の値は、冷媒ガスである高圧ガスの種類に関係なく同じである。", "answer": "×", "law": "法第5条第1項第2号、政令第4条", "explanation": "第一種製造者の許可が必要な最小値は、第一種ガス及びアンモニア等は「50トン以上」、上記以外の冷媒ガス（プロパン等）は「20トン以上」であり、冷媒種により異なるため誤り。"}, {"id": 545, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ロ", "theme": "合併による地位承継", "question": "第一種製造者について合併があり、その合併により新たに法人を設立した場合、その法人は第一種製造者の地位を承継する。", "answer": "○", "law": "法第10条第1項", "explanation": "第一種製造者について合併があった場合、合併後存続する法人又は合併により設立された法人は、第一種製造者の地位を承継する。"}, {"id": 546, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ハ", "theme": "製造ガス種変更の許可", "question": "第一種製造者は、その製造をする高圧ガスの種類を変更したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第14条第1項", "explanation": "製造する高圧ガスの種類を変更しようとするときは、事後届出ではなく事前に都道府県知事等の「許可」を受けなければならない（誤り）。"}, {"id": 547, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "イ", "theme": "販売事業の事前届出（20日前）", "question": "容器に充填された冷媒ガス用の高圧ガスの販売の事業を営もうとする者（特に定められたものを除く。）は、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第20条の4第1項", "explanation": "販売事業を営もうとする者は、販売所ごとに事業開始の日の20日前までに知事等に届け出なければならない。"}, {"id": 548, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ロ", "theme": "製造開始・廃止の届出", "question": "第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第21条第1項", "explanation": "第一種製造者は、製造を開始したとき又は廃止したときは、遅滞なく知事等へ届け出なければならない。"}, {"id": 549, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ハ", "theme": "機器製造業者の対象冷凍能力", "question": "専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が所定の技術上の基準に従って製造しなければならない機器は、可燃性ガス以外のフルオロカーボンを冷媒ガスとする冷凍機のものにあっては、1日の冷凍能力が20トン以上のものに限られている。", "answer": "×", "law": "法第57条、冷規第63条", "explanation": "不活性フルオロカーボン等の冷凍機で技術基準に従うべきものは「5トン以上」である（「20トン以上」は誤り）。"}, {"id": 550, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の区分（アンモニア5t）", "question": "アンモニアを冷媒ガスとする冷凍設備であって、その1日の冷凍能力が5トンである設備のみを使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条第2項第2号、政令第4条", "explanation": "アンモニアは1日の冷凍能力5トン以上50トン未満が第二種製造者となるため、5トンの設備は第二種製造者に該当する。"}, {"id": 551, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ロ", "theme": "工事完成時の気密試験・試運転", "question": "第二種製造者は、製造設備の設置又は変更の工事が完成したとき、酸素以外のガスを使用する試運転又は許容圧力以上の圧力で行う気密試験を行った後でなければ、製造をしてはならない。", "answer": "○", "law": "法第12条第2項、冷規第14条第1号", "explanation": "工事完成時は、酸素以外のガスによる試運転又は許容圧力以上の気密試験を行わなければ製造してはならない。"}, {"id": 552, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ハ", "theme": "第二種製造者の保安検査除外", "question": "アンモニアを冷媒ガスとする1日の冷凍能力が30トンの製造施設は、保安検査を受けなければならない。", "answer": "×", "law": "法第35条第1項", "explanation": "アンモニア30トンの設備は第二種製造者である。保安検査は「第一種製造者の特定施設」に対する検査であり、第二種製造者は受検義務がない（誤り）。"}, {"id": 553, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "イ", "theme": "特定不活性ガスの警戒標掲示", "question": "アンモニアを移動するときは、その車両の見やすい箇所に警戒標を掲げなければならないが、特定不活性ガスであるフルオロカーボン32を移動するときはその定めはない。", "answer": "×", "law": "一般則第50条第1号", "explanation": "警戒標の掲示義務は、特定不活性ガスを含むすべての高圧ガス（一定量以上）に適用される（定めがないは誤り）。"}, {"id": 554, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ロ", "theme": "特定不活性ガスの書面交付・携帯", "question": "アンモニアを移動するときは、そのガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならないが、特定不活性ガスであるフルオロカーボン32を移動するときはその定めはない。", "answer": "×", "law": "一般則第49条第1項第21号、同第50条第14号", "explanation": "イエローカードの交付・携帯・遵守義務は、特定不活性ガス（R32等）の移動時にも適用される（定めがないは誤り）。"}, {"id": 555, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ハ", "theme": "木枠・パッキンの適用（毒性のみ）", "question": "アンモニアを移動するときは、その容器に木枠又はパッキンを施す必要があるが、特定不活性ガスであるフルオロカーボン32を移動するときはその定めはない。", "answer": "○", "law": "一般則第50条第8号", "explanation": "木枠又はパッキンの施工義務は「毒性ガス」に限定されており、特定不活性ガス（R32）には適用されないため正。"}, {"id": 556, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "イ", "theme": "液化ガス充填質量算定式（G=V/C）", "question": "容器に充填することができる液化ガスの質量は、その容器の内容積を容器保安規則で定められた数値で除して得られた質量以下と定められている。", "answer": "○", "law": "法第48条第4項第1号、容規第22条", "explanation": "液化ガスの充填質量は G = V / C （内容積Vを定数Cで除した値）以下と定められている。"}, {"id": 557, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ロ", "theme": "バルブ刻印事項（容器容積記号の有無）", "question": "附属品検査に合格したバルブには、そのバルブが装置されるべき容器の内容積を示す記号の刻印がされている。", "answer": "×", "law": "法第49条の3、容規第18条第1項", "explanation": "バルブに刻印されるのは「装置されるべき容器の“種類”」等であり、「内容積を示す記号」は規定されていない（誤り）。"}, {"id": 558, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ハ", "theme": "不合格容器のくず化処分", "question": "容器の所有者は、容器再検査に合格しなかった容器について所定の期間内に所定の刻印等がされなかったときは、遅滞なく、これをくず化し、その他容器として使用することができないように処分しなければならない。", "answer": "○", "law": "法第56条第3項", "explanation": "容器再検査に不合格となった容器について3月以内に刻印等されないときは、遅滞なくくず化等の処分を行わなければならない。"}, {"id": 559, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "イ", "theme": "充填容器の温度管理（全ガス共通）", "question": "液化アンモニアを充填した容器を貯蔵する場合、その容器は常に温度40度以下に保たなければならないが、液化フルオロカーボンを充填した容器は、常に温度40度以下に保つべき定めはない。", "answer": "×", "law": "一般則第6条第2項第8号ホ", "explanation": "充填容器等を常に温度40℃以下に保つ義務は、すべての高圧ガスに適用される（フルオロカーボンが除外されるわけではないため誤り）。"}, {"id": 560, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ロ", "theme": "可燃性・毒性ガスの通風貯蔵", "question": "可燃性ガス又は毒性ガスの充填容器及び残ガス容器の貯蔵は、通風の良い場所でしなければならない。", "answer": "○", "law": "一般則第18条第2号イ", "explanation": "可燃性ガス又は毒性ガスの充填容器等は、漏えい時の滞留を防ぐため通風の良い場所で貯蔵しなければならない。"}, {"id": 561, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ハ", "theme": "車両積載容器貯蔵の原則禁止", "question": "車両に固定した容器により高圧ガスを貯蔵することは禁じられているが、車両に積載した容器により高圧ガスを貯蔵することはいかなる場合でも禁じられていない。", "answer": "×", "law": "一般則第18条第2号ホ", "explanation": "原則として、車両に「固定し、又は積載した容器」による貯蔵は禁じられている（禁じられていないは誤り）。"}, {"id": 562, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定式（冷水温度差は不要）", "question": "蒸発器を通過する冷水の温度差の数値は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第1号", "explanation": "遠心式圧縮機の算定に必要なのは「原動機定格出力（W）」であり、冷水温度差の数値は不要である（誤り）。"}, {"id": 563, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ロ", "theme": "回転ピストン型の算定式（定数C）", "question": "冷媒ガスの種類に応じて定められた数値（C）は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第4号", "explanation": "回転ピストン型圧縮機の算定式は R = V / C であり、冷媒種に応じた数値Cが必要である。"}, {"id": 564, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ハ", "theme": "回転ピストン型の算定式（気筒内径D）", "question": "圧縮機の気筒の内径の数値は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第4号", "explanation": "押しのけ量Vの算出式 V = 60 * 0.785 * t * n * (D^2 - d^2) において、気筒内径Dの数値が必要である。"}, {"id": 565, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の遵守対象（事例1）", "question": "（アンモニア250t）この事業者は、危害予防規程を定め、これを都道府県知事等に届け出なければならない。また、この危害予防規程を守るべき者は、この事業所の冷凍保安責任者と従業者のみである。", "answer": "×", "law": "法第26条第3項", "explanation": "危害予防規程を守るべき者は「第一種製造者（事業者本人）及びその従業者」である（責任者と従業者のみとし事業者を外す記述は誤り）。"}, {"id": 566, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ロ", "theme": "保安教育計画の届出不要（事例1）", "question": "（アンモニア250t）この事業者は、その従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その計画を都道府県知事等に届け出る必要はない。", "answer": "○", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務だが、計画そのものを知事等へ届け出る義務はないため正。"}, {"id": 567, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ハ", "theme": "容器盗難時の届出義務（事例1）", "question": "（アンモニア250t）この事業者は、その占有する液化アンモニアの充填容器を盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。", "answer": "○", "law": "法第63条第1項第2号", "explanation": "占有する容器を喪失し、又は盗まれたときは遅滞なく知事等又は警察官に届け出なければならない。"}, {"id": 568, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "イ", "theme": "承諾なき発火物携帯立入の禁止（何人も）（事例1）", "question": "（アンモニア250t）この事業者がこの事業所において指定する場所では、何人も、その事業者の承諾を得ないで、発火しやすい物を携帯してその場所に立ち入ってはならない。", "answer": "○", "law": "法第37条第2項", "explanation": "指定場所には、事業者の承諾を得ないで発火しやすい物を携帯して立ち入ることは何人も禁止されている。"}, {"id": 569, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ロ", "theme": "指定場所の火気制限（何人も）（事例1）", "question": "（アンモニア250t）この事業者がこの事業所において指定する場所では、その事業所の従業者を除き、何人も火気を取り扱ってはならない。", "answer": "×", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、自社の従業者であっても例外なく禁止される（除きは誤り）。"}, {"id": 570, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ハ", "theme": "異常時記録の保存起算日（事例1）", "question": "（アンモニア250t）この事業者は、事業所ごとに帳簿を備え、製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載しなければならない。また、その帳簿は製造開始の日から10年間保存しなければならない。", "answer": "×", "law": "法第60条第1項、冷規第65条", "explanation": "帳簿の保存期間10年の起算日は「製造開始の日」ではなく「記載の日」からである（誤り）。"}, {"id": 571, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "イ", "theme": "配管取替の軽微変更除外（事例1）", "question": "（アンモニア250t）この冷媒設備の凝縮器と受液器とをつなぐ配管の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものは、軽微な変更の工事に該当する。", "answer": "×", "law": "冷規第17条第1項第2号", "explanation": "アンモニア設備は軽微な変更工事から除外されているため、切断溶接や能力変更がなくても軽微変更には該当しない（誤り）。"}, {"id": 572, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ロ", "theme": "圧縮機取替の完成検査不要除外（事例1）", "question": "（アンモニア250t）この冷媒設備の圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなければならないが、その変更の工事の完成後、その製造施設の完成検査を受けることなく使用することができる。", "answer": "×", "law": "法第20条第3項、冷規第23条", "explanation": "アンモニア設備は完成検査不要工事の特例から除外されているため、完成検査合格前には使用できない（誤り）。"}, {"id": 573, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ハ", "theme": "特定変更工事としての完成検査義務（事例1）", "question": "（アンモニア250t）この冷媒設備の受液器の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であっても、完成検査を受けなければならない特定変更工事である。", "answer": "○", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "アンモニア設備は軽微変更にも完成検査不要にも該当しないため、切断溶接がなくても特定変更工事として完成検査受検が必須である。"}, {"id": 574, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "イ", "theme": "機械室の滞留防止構造対象（事例1）", "question": "（アンモニア250t）製造設備を設置する室のうち、冷媒ガスであるアンモニアが漏えいしたとき滞留しないような構造としなければならない室は、圧縮機、油分離器、凝縮器を設置する室に限られている。", "answer": "×", "law": "冷規第7条第1項第3号", "explanation": "受液器やこれらの間の配管を設置する室も対象に含まれるため、「限られている」は誤り。"}, {"id": 575, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ロ", "theme": "受液器流出防止措置の容量基準（事例1）", "question": "（アンモニア250t）この受液器は、その周囲に冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならないものに該当しない。", "answer": "○", "law": "冷規第7条第1項第13号", "explanation": "流出防止措置（防液堤等）が必要な受液器は内容積10,000 L以上。本問は6,000 Lのため義務付けられない（該当しないは正）。"}, {"id": 576, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ハ", "theme": "耐震設計の該当性（受液器と横置凝縮器）（事例1）", "question": "（アンモニア250t）この凝縮器は、所定の耐震に関する性能を有するものとしなければならないものに該当しないが、この受液器は、それに該当する。", "answer": "○", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上で該当する。凝縮器は「縦置円筒形で胴長5m以上」が対象であり、横置円筒形の本凝縮器は該当しないため正。"}, {"id": 577, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "イ", "theme": "消火設備の設置義務（可燃性）（事例1）", "question": "（アンモニア250t）この製造施設は、消火設備を設けなければならないものに該当する。", "answer": "○", "law": "冷規第7条第1項第12号", "explanation": "アンモニアは可燃性ガスであるため、規模に応じた消火設備の設置が義務付けられている。"}, {"id": 578, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ロ", "theme": "防爆構造電気設備の除外（事例1）", "question": "（アンモニア250t）この製造施設の冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものでなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第14号", "explanation": "防爆構造義務は「可燃性ガス（アンモニアを除く。）」と規定されており、アンモニア設備は除外されている（誤り）。"}, {"id": 579, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ハ", "theme": "漏えい検知警報設備の設置義務（事例1）", "question": "（アンモニア250t）この製造施設は、その施設から漏えいするガスが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならないものに該当する。", "answer": "○", "law": "冷規第7条第1項第15号", "explanation": "可燃性・毒性のアンモニア製造施設には、漏えい検知警報設備の設置が義務付けられている。"}, {"id": 580, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "イ", "theme": "全設備認定指定設備時の第二種移行（事例2）", "question": "（R134a 600t）認定指定設備でない製造設備Aを認定指定設備に取り替えて、全ての製造設備が認定指定設備となった場合は、この事業者は第二種製造者となる。", "answer": "○", "law": "法第5条第1項第2号、法第35条の2", "explanation": "すべての設備が認定指定設備となった場合、冷凍能力に関わらず第一種製造者（許可）から除外され第二種製造者となる。"}, {"id": 581, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の事前選任義務（事例2）", "question": "（R134a 600t）選任した冷凍保安責任者が旅行、疾病その他の事故によってその職務を行うことができなくなったときは、遅滞なく、高圧ガスの製造に関する所定の経験を有する者のうちから代理者を選任し、その職務を代行させなければならない。", "answer": "×", "law": "法第33条第1項", "explanation": "代理者は事故発生時に遅滞なく選任するのではなく、「あらかじめ」選任しておかなければならない（誤り）。"}, {"id": 582, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者の免状要件（1冷限定）（事例2）", "question": "（R134a 600t）この事業所の冷凍保安責任者に選任することができる者が交付を受けている製造保安責任者免状は、第一種冷凍機械責任者免状に限られている。", "answer": "○", "law": "冷規第36条第1項", "explanation": "設備A（300トン）で判定するため、300トン以上の設備は「第一種冷凍機械責任者免状」の所持者に限られる。"}, {"id": 583, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "イ", "theme": "圧縮機取替の軽微変更届（事例2）", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものは、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で切断溶接なし・能力変更なしの取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 584, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ロ", "theme": "認定指定設備増設の軽微変更届（事例2）", "question": "（R134a 600t）この製造施設に認定指定設備である製造設備Cを増設し、製造設備A及び製造設備Bとブラインを共通にするときは、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "冷規第17条第1項第4号", "explanation": "「認定指定設備の設置の工事」は軽微な変更工事に該当するため、完成後遅滞なく知事等へ届け出ればよい。"}, {"id": 585, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ハ", "theme": "切断溶接伴う工事の完成検査義務（事例2）", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴う場合であって、その取り替える圧縮機の冷凍能力の変更がない場合は、都道府県知事等の許可を受けなければならないが、その変更の工事の完成検査は受けなくてよい。", "answer": "×", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "冷媒設備の切断・溶接を伴う取替え工事は特定変更工事となり、完成検査の受検・合格が必須である（受けなくてよいは誤り）。"}, {"id": 586, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問16", "branch": "イ", "theme": "認定指定設備の保安検査除外（事例2）", "question": "（R134a 600t）保安検査は、製造施設のうち認定指定設備である製造設備Bの部分を除いて行われる。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備は特定施設から除外されているため、保安検査は設備Bを除いて行われる。"}, {"id": 587, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問16", "branch": "ロ", "theme": "保安検査の対象（ハード基準のみ）（事例2）", "question": "（R134a 600t）保安検査は、高圧ガスの製造の方法が所定の技術上の基準に適合しているかどうかについて行われる。", "answer": "×", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、「製造の方法（ソフト基準）」は対象外である（誤り）。"}, {"id": 588, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問16", "branch": "ハ", "theme": "保安検査の実施主体（事例2）", "question": "（R134a 600t）保安検査を受けるときは、選任している冷凍保安責任者にその実施について監督を行わせなければならない。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は知事等又は指定検査機関が行う行政検査であり、自社の冷凍保安責任者が監督を行うものではない（誤り）。"}, {"id": 589, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問17", "branch": "イ", "theme": "定期自主検査の対象基準（設備基準）（事例2）", "question": "（R134a 600t）定期自主検査は、製造の方法が所定の技術上の基準に適合しているかどうかについて、1年に1回以上行わなければならない。", "answer": "×", "law": "法第35条の2、冷規第44条第3項", "explanation": "定期自主検査は施設の位置・構造・設備について行うものであり、「製造の方法」は対象ではない（誤り）。"}, {"id": 590, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問17", "branch": "ロ", "theme": "認定指定設備の定期自主検査義務（事例2）", "question": "（R134a 600t）定期自主検査は、認定指定設備である製造設備Bの部分については行う必要はない。", "answer": "×", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "認定指定設備（設備B）も定期自主検査の義務対象であり、点検を省略することはできない（行う必要はないは誤り）。"}, {"id": 591, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査記録の監督者氏名（事例2）", "question": "（R134a 600t）定期自主検査を行ったとき、その検査記録に記載しなければならない事項の一つに、検査の実施について監督を行った者の氏名がある。", "answer": "○", "law": "冷規第44条第5項第4号", "explanation": "定期自主検査記録の法定記載事項として「検査の実施について監督を行った者の氏名」が定められている。"}, {"id": 592, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問18", "branch": "イ", "theme": "安全装置の基準圧力（許容圧力）（事例2）", "question": "（R134a 600t）この製造施設の冷媒設備には、その設備内の冷媒ガスの圧力が耐圧試験圧力を超えた場合に直ちにその圧力を耐圧試験圧力以下に戻すことができる安全装置を設けなければならない。", "answer": "×", "law": "冷規第7条第1項第8号", "explanation": "安全装置が作動して復帰させるべき基準圧力は「許容圧力」である（「耐圧試験圧力」は誤り）。"}, {"id": 593, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問18", "branch": "ロ", "theme": "配管気密試験の基準定め（事例2）", "question": "（R134a 600t）冷媒設備の配管は、許容圧力以上の圧力で行う気密試験又は経済産業大臣がこれと同等以上のものと認めた高圧ガス保安協会が行う試験に合格するものである旨の定めはない。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "冷媒設備の配管を含む全体について気密試験等に合格すべき旨が明確に規定されている（定めがないは誤り）。"}, {"id": 594, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問18", "branch": "ハ", "theme": "油圧系統以外の圧力計義務（事例2）", "question": "（R134a 600t）冷媒設備の圧縮機が強制潤滑方式であって、潤滑油圧力に対する保護装置を有している場合であっても、その圧縮機の油圧系統を除く冷媒設備には圧力計を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第7号", "explanation": "油圧保護装置（OPS）がある場合に圧力計が免除されるのは「当該油圧系統」のみであり、それ以外の冷媒設備本体には圧力計の設置が必要である。"}, {"id": 595, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問19", "branch": "イ", "theme": "バルブ適切操作措置（完全自動除く）（事例2）", "question": "（R134a 600t）製造設備に設けたバルブであって、操作ボタン等を使用することなく自動制御で開閉されるバルブ以外のものには、作業員が適切にそのバルブを操作することができるような措置を講じなければならない。", "answer": "○", "law": "冷規第7条第1項第17号", "explanation": "完全自動制御以外のバルブ・コックには、作業員が適切に操作できる措置（開閉方向明示・誤操作防止等）を講じなければならない。"}, {"id": 596, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問19", "branch": "ロ", "theme": "指定設備の日常点検義務（事例2）", "question": "（R134a 600t）高圧ガスの製造は、1日に1回以上、認定指定設備である製造設備Bの部分を除く製造設備が属する製造施設の異常の有無を点検して行えばよい。", "answer": "×", "law": "冷規第9条第2号", "explanation": "日常点検は製造施設全般が対象であり、認定指定設備であっても点検対象から除外されない（除くは誤り）。"}, {"id": 597, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問19", "branch": "ハ", "theme": "開放修理時の漏洩防止（不活性ガス含む）（事例2）", "question": "（R134a 600t）冷媒設備を開放して修理するときは、冷媒ガスが不活性ガスであるため、その開放する部分に他の部分からガスが漏えいすることを防止するための措置は講じなくてよい。", "answer": "×", "law": "冷規第9条第3号ハ", "explanation": "開放修理時の漏洩防止措置は冷媒ガスの種類によらず全設備に適用されるため、講じなくてよいとする記述は誤り。"}, {"id": 598, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の手動止め弁禁止（事例2）", "question": "（R134a 600t・設備B）製造設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用しなければならない。", "answer": "×", "law": "冷規第57条第12号", "explanation": "指定設備の日常運転操作用止め弁には「手動式のものを使用しないこと」と定められている（使用しなければならないは誤り）。"}, {"id": 599, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の工場試験（気密・耐圧）（事例2）", "question": "（R134a 600t・設備B）製造設備の冷媒設備は、この設備の製造業者の事業所で行う所定の気密試験及び配管以外の部分について所定の耐圧試験に合格するものでなければならない。", "answer": "○", "law": "冷規第57条第4号", "explanation": "指定設備は、製造業者の事業所において行う所定の気密試験及び耐圧試験に合格するものでなければならない。"}, {"id": 600, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の架台組立場所（事例2）", "question": "（R134a 600t・設備B）製造設備の冷媒設備は、この設備の製造業者の事業所において、脚上又は一つの架台上に組み立てられていなければならない。", "answer": "○", "law": "冷規第57条第3号", "explanation": "指定設備の冷媒設備は、製造業者の事業所において脚上又は一つの架台上に組み立てられていることが構造条件である。"}, {"id": 601, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の構造（ロータリー）", "question": "全密閉形ロータリー圧縮機は、構造上、圧縮機の容器内は高圧であり、始動時のオイルフォーミングは発生しないが、圧縮機容器内で冷媒の凝縮が起こることがある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "全密閉形ロータリー圧縮機は容器内が高圧ガスで油も高圧側にあるため、往復式のような始動時オイルフォーミングは起きない。ただし低温始動時に高圧上昇が遅れると容器内で冷媒凝縮が起こることがある。"}, {"id": 602, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の構造（スクリュー）", "question": "半密閉コンパウンドスクリュー圧縮機では、一般に、中間冷却器からの冷媒ガスと低段側の吐出しガスを直接混合して、高段側に送る構造となっている。低段吐出しガス温度が比較的低いことから、低段吐出しガスは中間冷却器を通さない。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "低段吐出しガスは油を多く含み温度も比較的低いため、中間冷却器を通さず、中間冷却器で蒸発した蒸気と直接混合して高段側に送る。"}, {"id": 603, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の構造（スクロール）", "question": "スクロール圧縮機は、トルク変動が非常に小さいので、振動や騒音が小さく、体積効率と断熱効率が高く、高速回転に適しているが、内部容積比によって圧縮の組込み圧力比が決まる。用途に応じて、組込み圧力比は大きく異なるため、運転条件にあった内部容積比を実現する圧縮機が必要となる。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "スクロールの幾何学的構造で圧縮容積比（内部容積比）が決まり、それにより組込み圧力比が定まるため、運転条件に応じた設計の圧縮機が必要となる。"}, {"id": 604, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の弁構造", "question": "往復圧縮機、ロータリー圧縮機、スクロール圧縮機、スクリュー圧縮機および遠心圧縮機の中で、吸込み弁を必要とするのは往復圧縮機だけであるが、吐出し弁を必要とするのは往復圧縮機とスクロール圧縮機である。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "吐出し弁を必要とするのは「往復圧縮機」と「ロータリー圧縮機」である（スクロール圧縮機は吐出し弁を必要としないため誤り）。"}, {"id": 605, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "イ", "theme": "容量制御（ホットガスバイパス）", "question": "ホットガスバイパス容量制御において、ホットガスバイパス量が多くなると、凝縮器の熱負荷のほとんどが電動機の入力だけとなり、凝縮圧力が低くなりすぎるので、必要量のホットガスが吸込み側にバイパスできなくなる。したがって、凝縮圧力の異常低下を防ぐ必要がある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "バイパス量増大時は蒸発器負荷が入らず凝縮器熱負荷が電動機入力のみとなり凝縮圧力が低下しすぎる。差圧不足でバイパス不能になるのを防ぐため凝縮圧力の異常低下防止が必要。"}, {"id": 606, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ロ", "theme": "容量制御なしの挙動", "question": "圧縮機に容量制御装置がないと、負荷減少時に吸込み圧力が低下し、圧縮機の吸込み蒸気の比体積が大きくなり、冷媒循環量が増加し、1冷凍トン当たりの消費動力が増加するので成績係数が小さくなる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "吸込み圧力低下で比体積が大きくなると、冷媒循環量は「減少」する（「増加」は誤り）。1冷凍トン当たり消費動力が増加しCOPは低下する。"}, {"id": 607, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ハ", "theme": "吸入圧力調整弁", "question": "吸入圧力調整弁は、圧縮機吸込み蒸気配管に取り付け、吸込み蒸気を絞ることによって容量制御をする。一般に、吸入圧力調整弁を備えた冷凍装置では、始動時や蒸発器の除霜終了後の再始動時に、電動機が過負荷になりやすいので注意を要する。", "answer": "×", "law": "上級テキスト 制御弁編", "explanation": "吸入圧力調整弁（CPR）は下流側の吸込み圧力が所定値以上に上昇しないよう絞る弁であり、始動時や除霜後の電動機の過負荷を「防止」する（過負荷になりやすいは誤り）。"}, {"id": 608, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ニ", "theme": "オン・オフ制御", "question": "圧縮機の運転でオン・オフ制御を行う場合には、圧縮機吸込み側の低圧圧力スイッチ、または冷却室内装置のサーモスタットによって圧縮機を発停させる。この方法は、短い時間間隔で圧縮機が発停を繰り返すと、装置の効率低下、圧縮機の油上がり、電動機の過熱や焼損を生じるおそれがある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "オン・オフ制御で発停頻度が高すぎると、効率低下だけでなく油上がりやモータ過熱・焼損を招く恐れがある。"}, {"id": 609, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "イ", "theme": "スクリュー圧縮機の運転保守", "question": "スクリュー圧縮機の給油圧力は、差圧式の場合には吐出しガス圧力よりも0.2 MPaから0.3 MPa高い値が適正値である。また、スクリュー圧縮機の吐出しガス温度は、多気筒圧縮機のそれよりも低く、冷媒の種類にもよるが、通常90℃以下である。吐出しガス温度が高い場合は、油量不足、油温が高い、吸込み蒸気の過熱などが考えられる。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "差圧式の場合の給油圧力は吐出し圧力より「0.05〜0.15 MPa低い」値が適正値である（0.2〜0.3 MPa高い値とするのは「強制給油式」であり誤り）。"}, {"id": 610, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ロ", "theme": "往復圧縮機の潤滑・保護", "question": "中形や大形の往復圧縮機では油ポンプによる強制給油潤滑式が採用されており、油圧調整弁の調整不良で油圧が高くなりすぎると、油圧保護圧力スイッチが作動して、圧縮機を停止させる。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "油圧保護圧力スイッチ（OPS）が作動するのは、油圧が「低すぎるとき（油量不足・フィルタ目詰まり等）」に軸受焼付きを防ぐためである（高くなりすぎると作動は誤り）。"}, {"id": 611, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ハ", "theme": "湿り運転・液圧縮の安全装置", "question": "圧縮機の湿り運転の原因として、冷凍機負荷の急激な変化、往復圧縮機のアンロード運転からフルロード運転への切り替わり時、温度自動膨張弁の感温筒の吸込み管からの外れ、などが挙げられる。また、多気筒圧縮機の液圧縮発生時の安全装置としては、シリンダ頭部の安全ぶたがある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "負荷急変、アンロード切替時、感温筒外れ等は液戻り・湿り運転の原因となる。多気筒往復圧縮機では液圧縮時にスプリングで頭部が浮き上がる「安全ぶた」が保護装置となる。"}, {"id": 612, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ニ", "theme": "過熱運転の原因", "question": "吸込み蒸気の温度が上昇し、吸込み蒸気の過熱度が大きくなると、圧縮機は過熱運転となる。また、蒸発器熱負荷の過大や、冬季の凝縮圧力の大幅な低下などにより、圧縮機は過熱運転となることがある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吸込み過熱度大、熱負荷過大、冬季の凝縮圧力低下（膨張弁前後の差圧減少による冷媒供給不足）は圧縮機の過熱運転（吐出し温度上昇）を引き起こす。"}, {"id": 613, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "イ", "theme": "水冷横形凝縮器の凝縮温度変化", "question": "凝縮負荷一定で水冷横形シェルアンドチューブ凝縮器が運転されているときに、その凝縮温度が変化する場合がある。その原因として考えられるのは、冷却管の汚れなどによる熱通過率の変化、または、冷却水入口温度の変化の2つである。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "原因は「熱通過率の変化（汚れ）」「冷却水入口温度の変化」だけでなく「冷却水流量の変化」もあり、計3つである（2つであるは誤り）。"}, {"id": 614, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ロ", "theme": "ローフィンチューブの伝熱比", "question": "フルオロカーボン冷媒で水冷横形シェルアンドチューブ凝縮器を用いる場合、熱伝達率の小さい冷媒側に高さの低いフィンを設けたローフィンチューブ冷却管をつけて、冷媒側伝熱面積を大きくしている。このときの冷媒側と水側の伝熱面積の割合を有効内外伝熱面積比というが、その値は通常3.5から4.2くらいである。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "フルオロカーボンは凝縮熱伝達率が水側より小さいためローフィンを用い、冷媒側外表面積を内表面積の3.5〜4.2倍程度に設定する。"}, {"id": 615, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ハ", "theme": "空冷凝縮器の冬季制御と受液器", "question": "空冷凝縮器を用いた冷凍装置が、冬季に冷凍能力の低下を起こすことを防止するため、凝縮圧力調整弁を使用して凝縮器内の冷媒液量を調節して凝縮能力を制御することがある。その際に受液器を別途必要とするが、その理由は、液管内におけるフラッシュガスの発生を防止するためである。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "凝縮器内に液を滞留させて伝熱面積を減らし圧力を維持する際、液管内の冷媒が不足してフラッシュガスが生じるのを防ぐため受液器が必要となる。"}, {"id": 616, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ニ", "theme": "液封時の比体積増加割合", "question": "液封は、配管などに液が充満した状態で、出入り口の両端が封鎖された状態をいう。この状態で液温が上昇すると、その比体積が増加することで封鎖された内部は、著しく高圧となる。通常使われる温度において、アンモニアとR410Aを比較した場合、液温上昇による比体積の増加割合が大きいのはアンモニアである。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "温度上昇に伴う液の比体積増加割合は、R410A（9.3%：-30℃→0℃）のほうがアンモニア（6.1%）よりも大きい（「大きいのはアンモニア」は誤り）。"}, {"id": 617, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "イ", "theme": "蒸発器の冷媒循環量不足", "question": "蒸発器には、熱負荷の増減に応じて膨張弁から適切な量の冷媒液が供給される必要がある。その冷媒循環量が不足する原因として、過小な容量の膨張弁を選定したこと、フラッシュガスの発生などが挙げられる。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "膨張弁容量不足、液管内フラッシュガス発生、冷媒充填量不足などは蒸発器への冷媒供給量不足（循環量不足）の原因となる。"}, {"id": 618, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ロ", "theme": "蒸発温度差の設定", "question": "一般的な冷凍装置の蒸発器における蒸発温度と被冷却物との温度差は、利用用途ごとに、ある程度経験的に決まっている。例えば、空気冷却器の温度差は、空調用で15Kから20K、冷蔵用で5Kから10Kとしている。この温度差が大きすぎると、伝熱面積の大きな蒸発器を必要とするうえ、成績係数の低下を招く。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "伝熱面積の大きな蒸発器が必要となるのは「温度差が小さすぎる」場合である（大きすぎると蒸発温度が下がりCOPは低下するが、伝熱面積は小さくて済むため誤り）。"}, {"id": 619, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ハ", "theme": "乾式蒸発器の液戻り対策", "question": "フィンコイル乾式蒸発器を用いた冷凍装置における液戻り対策として、運転停止時に蒸発器内に冷媒液を残留させておくことが挙げられる。これは、再起動時に蒸発器内の液による液戻りを起こすことを防ぐためである。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "液戻り対策としては、停止時に圧縮機で蒸発器内の冷媒を回収（ポンプダウン）し、蒸発器内に冷媒液を「残留させない」ようにする（残留させておくは誤り）。"}, {"id": 620, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ニ", "theme": "感温筒の立ち上がり配管取付", "question": "冷凍装置の負荷は時間とともに変化するため、その変化に応じて、温度自動膨張弁が確実に動作することが必要であり、感温筒の取り付け方が重要である。外部均圧形温度自動膨張弁において、感温筒を吸込み蒸気配管の立ち上がり配管に取り付ける場合、感温筒はキャピラリチューブ側を上にして取り付ける。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "立ち上がり配管に取り付ける際は、感温筒内の液がキャピラリ側へ逃げないようキャピラリチューブ側を上にして取り付ける。"}, {"id": 621, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "イ", "theme": "蒸発器伝熱量と冷凍能力", "question": "フィンコイル乾式蒸発器において、その伝熱量は、熱通過率K、空気側有効伝熱面積Aおよび、空気と冷媒の算術平均温度差Δtmの積 KAΔtmで表される。有効伝熱面積が一定で熱通過率が低下した場合でも、蒸発温度が低下し、空気と冷媒の温度差が大きくなるため冷凍装置の冷凍能力は変化しない。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "熱通過率Kが低下すると蒸発温度が下がり温度差は拡大するが、冷媒循環量減少・圧縮機効率低下により冷凍能力は「低下」する（変化しないは誤り）。"}, {"id": 622, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ロ", "theme": "空冷凝縮器の設計温度差", "question": "空冷凝縮器では、冷媒と空気との算術平均温度差が大きいほど凝縮作用が活発となるため、凝縮液膜が厚くなる。その結果、冷媒側の熱伝達率が小さくなる。このため、空冷凝縮器の設計で伝熱面積を決定するにあたり、一般に、入口空気温度より5Kから6K高い凝縮温度となるようにする。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "空冷凝縮器では通常、入口空気温度より「12K〜20K高い」凝縮温度になるよう伝熱面積を設計する（5〜6Kは「水冷凝縮器」の温度差であり誤り）。"}, {"id": 623, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ハ", "theme": "水冷凝縮器の汚れと温度差増加", "question": "ローフィンチューブを用いる水冷凝縮器において、設計時の冷媒と冷却水の温度差を大きくすると、管内面の汚れに起因する冷媒と冷却水の温度差の増加割合も大きくなる。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "熱流束が大きい（設計温度差Δtが大きい）設計では、汚れ係数増加に伴う水側温度差Δtwの増加分が大きくなるため正。"}, {"id": 624, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ニ", "theme": "凝縮器内不凝縮ガスの影響", "question": "凝縮器内に不凝縮ガスが存在すると、伝熱が阻害される。これは、不凝縮ガスを含む混合気境界層が液膜の外側に存在するため、冷媒の液膜表面温度が冷媒蒸気分圧の圧力に対応する飽和温度まで低下することによる。装置を運転中に不凝縮ガスが凝縮器内に侵入すると、凝縮負荷が一定の条件では、気液界面と伝熱面との温度差が凝縮負荷に見合った温度差になるまで凝縮器内の圧力が高くなって平衡する。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "不凝縮ガスにより界面での冷媒分圧が下がり飽和温度が低下するため熱伝達が阻害され、一定凝縮負荷を処理するために凝縮圧力が上昇して平衡する。"}, {"id": 625, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁・感温筒の取付位置", "question": "温度自動膨張弁本体の取付位置は蒸発器入口に近く、また、感温筒の取付位置は蒸発器出口に近いほうが、過熱度制御の安定性がよい。特に、蒸発器出入り口配管（冷媒液配管と圧縮機吸込み配管）が長い場合には、膨張弁本体と感温筒を蒸発器から大きく離れた位置に取り付けないようにする。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "膨張弁と感温筒が蒸発器から離れすぎると応答遅れによるハンチングが発生しやすいため、蒸発器出入口の近傍に取り付ける。"}, {"id": 626, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ロ", "theme": "定圧自動膨張弁の動作", "question": "定圧自動膨張弁は、高圧冷媒液を絞り膨張して、一定の蒸発器内圧力を保持するための減圧弁の一種である。圧縮機が停止して、低圧圧力が高いときには、定圧自動膨張弁が閉じており、圧縮機が始動すると、低圧圧力が膨張弁の設定圧力に下がってから冷媒の送液を開始する。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "定圧膨張弁は下流側（蒸発圧力）を一定に保つ弁であり、停止時の高圧では全閉し、始動後圧力が下がってから開いて送液を開始する。"}, {"id": 627, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ハ", "theme": "クロスチャージ方式の特徴", "question": "温度自動膨張弁のクロスチャージ方式の特徴は、液チャージ方式などの、使用する蒸発温度域によって過熱度が変わる欠点を除いたことにより、蒸発温度が高温でも低温でも、ほぼ同じ過熱度設定値が保持できることである。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "感温筒内の媒体特性曲線を冷媒と交差（クロス）させることで、広い蒸発温度範囲にわたってほぼ均一な過熱度制御を維持できる。"}, {"id": 628, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ニ", "theme": "キャピラリチューブ内の状態変化", "question": "キャピラリチューブに過冷却状態で流入した冷媒液が、自己蒸発することで気液二相状態になると、蒸気の流速が上昇し、摩擦抵抗が著しく増大するので、冷媒の圧力が大きく低下し、温度を保持したままキャピラリチューブ出口から流出する。", "answer": "×", "law": "上級テキスト 膨張機構編", "explanation": "気液二相状態になると摩擦抵抗増大に伴い圧力低下とともに「温度も大きく低下」して流出する（「温度を保持したまま」は誤り）。"}, {"id": 629, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "イ", "theme": "温度式冷却水調整弁の特徴", "question": "温度式冷却水調整弁は、冷媒に直接触れることなく動作するので、凝縮器以外のオイルクーラなどの液体の温度制御用にも使える。温度式冷却水調整弁の特徴は、一般に、弁の応答の遅れが大きく、緩やかな制御になり、冷媒側と絶縁されて安全性が高く、調整弁の交換が容易なことである。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "感温部と冷却水との伝熱で作動するため応答は遅く緩やかだが、冷媒回路から独立しており安全性・メンテナンス性に優れる。"}, {"id": 630, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ロ", "theme": "直動形凝縮圧力調整弁の動作", "question": "直動形凝縮圧力調整弁は、空冷凝縮器の出口側に取り付け、調整弁の出口圧力が低下すると弁が閉じ、上昇すると弁が開く圧力比例制御弁である。凝縮圧力調整弁は、必要とする凝縮圧力に設定し、夏季の外気温度が高いときには全開となり、冷媒液の流れの抵抗は最小の状態となる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "弁の開閉を制御するのは出口圧力ではなく「入口側圧力（凝縮器側圧力）」である（入口圧力が低下すると閉じ、上昇すると開くため誤り）。"}, {"id": 631, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ハ", "theme": "吸入圧力調整弁の制御目的", "question": "吸入圧力調整弁は、圧縮機の吸込み圧力が低下して圧縮機が過熱しないように、圧縮機吸込み冷媒量を調整して圧縮機の吸込み圧力を維持する圧力調整弁であり、圧縮機吸込み蒸気配管に取り付けられる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（CPR）は吸込み圧力が「上昇しすぎて電動機が過負荷になるのを防ぐ」ために絞る弁である（低下防止・過熱防止とする記述は誤り）。"}, {"id": 632, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ニ", "theme": "蒸発圧力調整弁の特性", "question": "蒸発圧力調整弁を流れるときの冷媒の状態変化は、等エンタルピーの絞り膨張である。圧縮機能力に対して蒸発器の冷却負荷が小さくなった場合は、蒸発圧力調整弁での圧力降下が大きくなるので、圧縮機吸込み圧力が大きく低下し、冷凍装置の成績係数が低下する。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は等エンタルピー絞り膨張を行う。負荷減少時は蒸発圧力を保つため弁が絞られて圧力降下が大きくなり、圧縮機吸込圧力が低下してCOPは悪化する。"}, {"id": 633, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "イ", "theme": "低圧フロート弁", "question": "満液式蒸発器、低圧受液器、中間冷却器などの液面レベルを一定に保持するためのフロート弁は、低圧フロート弁と呼ばれ、高圧冷媒液を絞り膨張させて低圧機器内に送液する。フロート弁は、一般に、各種冷媒で共用になっているが、冷媒液の密度の違いによる影響は小さい。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "低圧フロート弁は液面を直接検知して高圧液を絞り送液する。冷媒ごとの密度差による浮力影響は比較的小さく共用設計されることが多い。"}, {"id": 634, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ロ", "theme": "電磁弁の作動差圧", "question": "電磁弁は、冷媒用、水用、ブライン用などがあり、用途に応じて使い分ける。直動式の電磁弁は、その作動機構により弁前後の圧力差がゼロでも開閉できるが、パイロット式電磁弁は弁前後の圧力差が十分でないと作動しないことがあるので注意が必要である。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "直動式はソレノイドの力で直接開閉するため差圧ゼロでも作動するが、パイロット式は主弁開閉に冷媒前後の作動差圧（通常7〜30 kPa）が必要となる。"}, {"id": 635, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ハ", "theme": "高圧圧力スイッチの復帰方式", "question": "高圧圧力スイッチを安全装置として使用する冷凍装置では、一般に、冷媒圧力が上昇して設定圧力になった場合、圧縮機電源回路を遮断して圧縮機を停止させる。異常高圧で作動した場合には、冷凍装置の停止した原因を修復してから運転再開する必要がある。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "安全装置としての高圧圧力スイッチは異常高圧時に電源を遮断して停止させる。原因排除後に再起動させるため原則として手動復帰形が用いられる。"}, {"id": 636, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ニ", "theme": "バイメタル式サーモスタットの原理", "question": "バイメタル式サーモスタットは、熱伝導率の異なる2種類の金属を溶着または一緒にロール加工して作られ、温度が変化すると機械的なわん曲を生じる。バイメタル式サーモスタットは、このわん曲による力を利用して電気接点の開閉を行う。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "バイメタルは「熱膨張係数（熱膨張率）」の異なる2種類の金属を貼り合わせたものである（「熱伝導率の異なる」は誤り）。"}, {"id": 637, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "イ", "theme": "バッフル式油分離器", "question": "油分離器は、冷凍装置の圧縮機と凝縮器との間に設置し、圧縮機吐出しガスに含まれている油を分離する附属機器であり、バッフル式、金網式、デミスタ式などの油分離器がある。バッフル式油分離器は、多数の小孔がある複数枚のバッフル板を立型円筒内に斜めに設け、吐出しガスが小孔を通る際に油滴を分離する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "圧縮機〜凝縮器間に設置し、傾斜した多数小孔のバッフル板にガスを衝突・通過させて油滴を慣性分離する。"}, {"id": 638, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ロ", "theme": "高圧受液器の液面計", "question": "高圧受液器は、凝縮器で凝縮した冷媒液を蓄える容器であり、この容器内で凝縮器と蒸発器の冷媒量の変化を吸収し、冷凍装置を円滑に運転できるようにする。一般に、大形の受液器には反射式液面計を取り付け、小容量の受液器にはサイトグラスを設置したりする。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "受液器は負荷変動による冷媒量変化を吸収する。大形には自動閉止弁付き反射式ガラス液面計、小形にはサイトグラスが用いられる。"}, {"id": 639, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ハ", "theme": "低圧受液器の気液分離機能", "question": "低圧受液器は、冷媒液強制循環式冷凍装置の蒸発器冷却管に低圧冷媒液を送り込む液溜めの役割をもっている。一般に、蒸発器から低圧受液器に戻ってくる冷媒は気液混合状態であり、圧縮機へ液戻りしないように、圧縮機の吸込み配管には液分離器を取り付ける必要がある。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器自体が気液分離器（液分離器）の機能を兼ね備えているため、吸込み配管に別途液分離器を取り付ける必要はない（誤り）。"}, {"id": 640, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ニ", "theme": "ろ過乾燥器とアンモニア冷媒", "question": "フルオロカーボン冷凍装置に取付ける、ろ過乾燥器の乾燥剤には、水分を吸着しても化学変化せず、砕けにくいゼオライト、活性アルミナ、シリカゲルなどが用いられる。アンモニア冷凍装置の冷媒系統内の水分はアンモニアと結合しているため、乾燥剤による吸着分離効果は期待できない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "フルオロカーボンにはドライヤ（ゼオライト等）が必須だが、アンモニアは水と極めて強く結合するため乾燥剤での吸着分離はできず設置しない。"}, {"id": 641, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "イ", "theme": "液ガス熱交換器とアンモニア", "question": "液ガス熱交換器は、凝縮器から出た高温冷媒液と、蒸発器から出た低温冷媒蒸気との間で熱交換させるものであり、アンモニア冷凍装置では、圧縮機の吸込み蒸気過熱度の増大にともなう吐出しガス温度の上昇が著しいので、使用されない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "アンモニアは断熱指数が大きく吸込み過熱による吐出し温度上昇が著しいため、液ガス熱交換器は使用しない。"}, {"id": 642, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ロ", "theme": "油回収器の加熱源", "question": "フルオロカーボン冷凍装置において、満液式蒸発器や低圧受液器に入り込んだ冷凍機油は冷媒液に溶解しているので、油だけを分離して容器外に抜き出すことはできない。そこで、油の濃度が高い冷媒液を抜き出し、冷媒液は加熱して蒸気とし、冷媒と油に分離する機能をもった油回収器を使用する。不燃性冷媒液の加熱には、高圧冷媒液または高圧吐出しガスを利用し、過熱による油の劣化をさけるため、電気ヒータは、加熱源としては使用しない。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "不燃性フルオロカーボンの油回収器の加熱源には一般に「電気ヒータ」が用いられる（可燃性冷媒の場合に電気ヒータを避け高圧液やガスを利用するため、記述は誤り）。"}, {"id": 643, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ハ", "theme": "多孔板式液分離器の流速", "question": "アンモニア用の多孔板式の液分離器は、円筒胴内の流速が1m/s以下の蒸気の流れに乗った液滴が多孔板に衝突して下方に落ち、蒸気は孔を通り抜けて流れることによって、液と蒸気を分離する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "胴内ガス流速を1 m/s以下に減速させ、慣性衝突と多孔通過によって効率よく液滴を分離落下させる。"}, {"id": 644, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ニ", "theme": "冷媒液強制循環式と油戻し", "question": "冷媒液強制循環式蒸発器では、一般に、液ポンプにより蒸発量の3倍から5倍の冷媒量を流す。また、冷凍機油を低圧受液器に戻すために、一般に、蒸発器本体に油戻し用の配管を設ける。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "冷媒循環比3〜5倍で送られた油は冷媒液とともに自然に低圧受液器に戻り濃縮されるため、蒸発器本体に油戻し配管を設けるのは「満液式蒸発器」である（誤り）。"}, {"id": 645, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "イ", "theme": "配管用炭素鋼鋼管（SGP）の使用制限", "question": "配管用炭素鋼鋼管（SGP）は、毒性ガスの冷媒には使用できない。また、フルオロカーボン冷媒では設計圧力が1MPaを超える耐圧部分、温度100℃を超える耐圧部分、温度-25℃よりも低温の耐圧部分にSGPは使用できない。", "answer": "○", "law": "例示基準20、上級テキスト 配管編", "explanation": "SGPは毒性ガス禁止、設計圧力1 MPa以下、温度-25℃〜100℃の範囲でのみ使用可能。"}, {"id": 646, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ロ", "theme": "ろう材の温度と特性", "question": "ろう付けに使用するろう材のろう付け温度は、銀ろう系のほうが黄銅ろう系よりも低い。銀ろう系は、溶融したろうの流動性がよく、強度も大きいが、過熱すると亜鉛が蒸発して気泡を発生することが多い。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "過熱によって亜鉛が蒸発し気泡が発生しやすいのは「黄銅ろう（BCuZn系）」である（銀ろう系とする記述は誤り）。"}, {"id": 647, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ハ", "theme": "複数蒸発器の吸込み管接続", "question": "蒸発器が2基以上の装置では、無負荷の蒸発器に主管内の油や冷媒が流れ込むので、蒸発器吸込み管は、主管の下部（下面側）に接続するのがよい。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "停止・無負荷の蒸発器への油や冷媒液の流入を防ぐため、吸込み枝管は主管の「上部（上面側）」に接続する（下面側は誤り）。"}, {"id": 648, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ニ", "theme": "複数凝縮器の液落とし管トラップ", "question": "2基以上の凝縮器から一本の主管にまとめて受液器へ冷媒液を落とす場合には、各液落とし管にトラップを設けて、液の流れの抵抗による圧力差をトラップで吸収する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "凝縮器間の凝縮圧力差によって液が片方の凝縮器に逆流・滞留するのを防ぐため、各液落とし管にトラップを設けて液頭差で吸収する。"}, {"id": 649, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "イ", "theme": "安全装置の作動形態", "question": "安全弁、破裂板、溶栓、高圧遮断装置などの安全装置は、設定の圧力や温度で作動し、外部に冷媒ガスを放出することで冷媒設備の圧力を許容圧力以下にする。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "外部にガスを放出するのは安全弁・破裂板・溶栓である。「高圧遮断装置」は電動機電源を遮断して圧縮機を停止させる装置であり、ガス放出は行わない（誤り）。"}, {"id": 650, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ロ", "theme": "高圧遮断スイッチの設定圧力と精度", "question": "高圧遮断圧力スイッチの設定圧力は、高圧部に取り付けられた内蔵安全弁を除くすべての安全弁の最低吹始め圧力以下で、高圧部の許容圧力以下で作動するように設定する。また、設定圧力の範囲が1MPa未満の場合、圧力スイッチの精度は、設定圧力の-15%以内でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "安全弁の吹始め圧力以下かつ許容圧力以下で作動するよう設定する。1 MPa未満の精度基準は設定圧力の-15%以内である。"}, {"id": 651, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ハ", "theme": "圧縮機用と容器用安全弁の目的", "question": "圧縮機用安全弁は、吹出し圧力において、圧縮機が吐き出すガスの全量を噴出することが求められる。また、圧力容器用安全弁は、冷媒ガスの飽和圧力が設定された圧力に達したときに冷媒ガスを噴出し、過度の圧力上昇を防止する。", "answer": "○", "law": "上級テキスト 安全装置編", "explanation": "圧縮機用はピストン押しのけ量全量の噴出能力が必要。容器用は火災等の受熱による冷媒蒸発圧力の上昇を逃がす能力が求められる。"}, {"id": 652, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ニ", "theme": "破裂板の破裂圧力基準", "question": "破裂板は、圧力によって金属の薄板が破れる方式の安全装置であり、その最小口径は圧力容器に取り付けるべき安全弁の必要最小口径と同じとする。また、破裂板は、経年変化により破裂圧力が低下する傾向があるため、破裂圧力は、耐圧試験圧力より高くする。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "破裂板の破裂圧力は「耐圧試験圧力の0.8〜1.0倍」程度に設定する（耐圧試験圧力より高くすると容器が破壊されるため誤り）。"}, {"id": 653, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "イ", "theme": "溶接部非破壊試験と継手効率", "question": "溶接部を対象に実施される非破壊試験には、放射線透過試験、超音波探傷試験、磁粉探傷試験、浸透探傷試験がある。突合せ溶接継手を対象に、放射線透過試験を実施した場合には、溶接継手の効率の値を高く設定できることがある。", "answer": "○", "law": "例示基準、上級テキスト 試験検査編", "explanation": "放射線透過試験の実施割合（全長1.0で効率1.0、0.2以上で0.95、0.2未満で0.7）に応じて溶接継手効率を高く設定できる。"}, {"id": 654, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ロ", "theme": "耐圧試験の全数試験と組立機器", "question": "耐圧試験は、耐圧強度を確認する構成機器や部品ごとに行う全数試験である。なお、部品ごとに試験したものを組み立てた機器については、耐圧強度が確認できたとみなし、試験を行わなくてもよい。", "answer": "○", "law": "冷規第7条、上級テキスト 試験検査編", "explanation": "構成部品ごとに耐圧試験を実施して合格したものを組み立てた機器は、耐圧強度が確認されたものとみなされ改めての試験は省略できる。"}, {"id": 655, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ハ", "theme": "気密試験に使用するガス", "question": "冷媒配管を完了した設備を対象に行う気密試験では、冷媒の種類によらずに、ボンベに詰められた二酸化炭素、窒素ガス、試験用空気圧縮機で加圧された空気を用いて行う。ただし、圧縮空気を用いる場合は、圧縮機の吐出し空気温度が140℃を超えないようにする。", "answer": "×", "law": "例示基準6、上級テキスト 試験検査編", "explanation": "アンモニア冷媒設備では「二酸化炭素」は固形物を生成するため使用不可。フルオロカーボンでは水分を嫌うため空気は原則避ける（「冷媒の種類によらずに」は誤り）。"}, {"id": 656, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ニ", "theme": "真空放置試験の許容圧力変化", "question": "真空試験は、冷媒設備の気密の最終確認をするために実施する試験である。十分に長い時間にわたって真空のまま放置した後、試験開始前よりも5Kくらいの温度変化の場合には、1.2 kPa程度の圧力変化であればよい。", "answer": "×", "law": "例示基準7、上級テキスト 試験検査編", "explanation": "十分な放置時間後、5K程度の温度変化に対して許容される圧力変化は「0.7 kPa程度以内」である（1.2 kPaは誤り）。"}, {"id": 657, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "イ", "theme": "基礎の固有振動数と質量", "question": "地盤自身の弾力性による基礎の固有振動数は、機械が発生する振動の振動数よりも少なくとも20%以上の差をつけて、機械と基礎とが共振しないようにする。また、多気筒圧縮機の基礎の質量は、基礎の上に据え付ける機械の質量の2倍から3倍にするのが一般的である。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "共振防止のため固有振動数と機械振動数には20%以上の差をつける。多気筒往復圧縮機の基礎質量は機械質量の2〜3倍が標準。"}, {"id": 658, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ロ", "theme": "真空乾燥完了の判定温度・圧力", "question": "フルオロカーボン冷媒設備内の真空乾燥を行う際、冷媒設備内の圧力が、周囲温度が5℃のとき約0.87 kPa、周囲温度が10℃のとき約1.23 kPaに到達した時点で真空乾燥が完了したと判断してよい。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "水分の蒸発圧力（10℃で1.23 kPa）に達しただけでは蒸発が始まった段階であり乾燥完了ではない。その圧力以下を保ち長時間真空引きを継続する必要がある（誤り）。"}, {"id": 659, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ハ", "theme": "冷凍機油の具備条件", "question": "冷凍機油の選定条件として、酸に対する安定性がよいこと、熱安定性がよく、引火点が高いこと、水分や酸類などが含まれていないことなどが挙げられる。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "熱安定性、酸化安定性、高引火点、水分・不純物の不存在、低温流動性（低流動点）などが冷凍機油の重要条件である。"}, {"id": 660, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ニ", "theme": "冷媒充填量不足時の挙動", "question": "冷凍装置に冷媒を充てんする際、冷媒量が不足すると、蒸発圧力が低下し、圧縮機の吸込み蒸気の過熱度と比体積が大きくなり、吐出し圧力が低下し、吐出しガス温度が上昇する。吐出しガス温度の上昇は油の劣化を促進する。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "冷媒不足時は蒸発圧力低下・吸込み過熱度大・比体積増大・循環量減少・吐出し温度上昇を招き、冷凍機油の熱劣化を早める。"}, {"id": 661, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の構造（往復式）", "question": "往復圧縮機では、シリンダのすきま容積比および圧力比が大きいほど体積効率が小さい。また、冷凍機油が吸込み側の低圧部分にあるので、始動時や液戻り時にオイルフォーミングを発生しやすい。なお、多気筒圧縮機では、いくつかのシリンダの吸込み弁を開放して、起動時の負荷軽減を行う。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "すきま容積比と圧力比が大きいほど再膨張損失が増え体積効率は低下する。クランクケースが低圧のため始動時の急減圧でオイルフォーミングを起こしやすい。アンローダは吸込み弁を開放して負荷軽減する。"}, {"id": 662, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ロ", "theme": "二段圧縮方式の目的", "question": "低温冷凍装置において、二段圧縮方式を用いる主な目的は、単段圧縮方式を用いた場合に問題となる、圧力比の増大、体積効率低下による冷媒循環量の減少、断熱効率の低下にともなう軸動力の増大と吐出しガス温度の過度な上昇を避けることである。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "蒸発温度約-30℃以下の低温装置で単段圧縮を行うと圧力比過大による効率低下や吐出し温度過度上昇（油劣化）が起きるため、二段圧縮にしてこれらを防止する。"}, {"id": 663, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ハ", "theme": "スクリュー圧縮機の油噴射目的", "question": "スクリュー圧縮機において、多量の冷凍機油を強制的に噴射する目的は、しゅう動部の潤滑、ロータ間などのクリアランスのシールおよび冷媒ガスと圧縮機本体の冷却である。また、この噴射により、吐出しガス温度を断熱圧縮の場合よりも低くすることも可能である。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "多量給油の目的は「潤滑」「すきまのシール」「冷却」の3つ。油が熱を奪うため吐出しガス温度を理論断熱圧縮時よりも低く抑えられる。"}, {"id": 664, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ニ", "theme": "スクロール圧縮機の特徴", "question": "スクロール圧縮機では、吸込み弁や吐出し弁を必要としないが、停止時に高低圧の差圧で旋回スクロールの逆転を防止するために逆止め弁をつけたものが多い。この圧縮機は、断熱効率と機械効率が高いが、高速回転に適していない。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "スクロール圧縮機はトルク変動が極めて小さく、吸込み吐出しが滑らかで体積効率・断熱効率・機械効率が高く、「高速回転に適している」（「適していない」は誤り）。"}, {"id": 665, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "イ", "theme": "ホットガスバイパス容量制御", "question": "定圧ホットガスバイパス弁を用いて、圧縮機の吸込み蒸気配管にホットガスを吹き込む容量制御では、吸込み蒸気の過熱度が大きくなり、長時間の運転は難しい。しかし、ホットガスを温度自動膨張弁と蒸発器入口の間にバイパスする方法を用いると、適切な過熱度が得られ、長時間運転ができる。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "吸込み管への直吹きは過熱度過大で吐出し温度が上がり長時間運転不能。膨張弁後〜蒸発器入口へ吹き込むと蒸発器内で冷却され適正過熱度が保たれ長時間運転が可能となる。"}, {"id": 666, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ロ", "theme": "複数圧縮機の段階発停制御", "question": "作動圧力に差をもたせた圧力スイッチを用いて、吸込み蒸気圧力の上昇、下降にともない複数の多気筒圧縮機を順次発停させる容量制御方法では、圧縮機の同時始動やクランクケース内の冷凍機油量の不均衡に注意しなければならない。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "多台数順次発停制御では、電源容量対策として同時始動を防止し、クランクケース相互の油面不均衡を防ぐ均油管・均圧管の施工が重要となる。"}, {"id": 667, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ハ", "theme": "インバータ容量制御の特性", "question": "熱負荷の増減に合わせて、インバータで圧縮機の回転速度を調節する容量制御方法では、ある限定された範囲内においては、冷凍能力が回転速度にほぼ比例する。クランク軸端に油ポンプを付けている往復圧縮機では、回転速度をあまり低速にすると、潤滑不良を起こす。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "限定範囲内では体積効率はほぼ一定で能力は回転速度に正比例する。軸駆動油ポンプ式は極端な低速運転で給油圧力が低下し潤滑不良を起こす。"}, {"id": 668, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ニ", "theme": "蒸発圧力調整弁（EPR）の作用", "question": "蒸発圧力調整弁は、熱負荷の減少に伴い蒸発圧力が設定値以下へ低下することを防ぐ。この弁は、温度自動膨張弁の感温筒と均圧管の取付け位置よりも下流側の吸込み蒸気配管に取り付けられ、作動時は圧縮機吸込み蒸気の過熱度や圧力を低下させる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は蒸発圧力を維持するために吸込み蒸気を絞り、「圧縮機吸込み圧力を低下」させる弁である。「過熱度を低下させる」わけではない（誤り）。"}, {"id": 669, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "イ", "theme": "過熱運転の要因（低圧低下・水量減少）", "question": "熱負荷の減少によって、圧縮機の吸込み蒸気圧力が正常な状態から極端に低下すると、圧力比の増大による吐出しガス温度の上昇を起こす。また、水冷凝縮器の冷却水量が減少しても、圧力比の増大による吐出しガス温度の上昇を起こし、圧縮機が過熱運転となる場合がある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吸込み圧力の異常低下（低負荷・サクション目詰まり等）や凝縮圧力の上昇（冷却水不足等）は、いずれも圧力比を増大させ吐出しガス温度上昇による過熱運転を招く。"}, {"id": 670, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ロ", "theme": "アンモニア往復圧縮機の油戻し", "question": "冷凍機油は、圧縮機の軸受、ロータ、ピストンなどの潤滑面に油膜をつくり、摩擦によって生じる熱の除去や摩耗防止などの役割がある。鉱油を用いた、アンモニアを冷媒とする往復圧縮機の吐出しガス温度は高く、一般に、圧縮機から吐き出された冷凍機油をクランクケースに戻すことはしない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "アンモニア往復圧縮機は吐出し温度が高く鉱油が熱劣化しやすいため、油分離器で回収した油はクランクケースに戻さず機外へ抜き取る。"}, {"id": 671, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ハ", "theme": "弁漏れの影響（吸込み弁と吐出し弁）", "question": "吸込み弁、吐出し弁やクランク軸のある圧縮機で、吐出し弁に漏れが生じると、圧縮機の吸込み蒸気量が減少し、体積効率や断熱効率の低下を招き、吐出しガス温度が大きく上昇する。一方、吸込み弁の漏れでは、体積効率の低下を招くが、吐出しガス温度が大きく上昇することはない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁漏れは高温高圧ガスがシリンダ内に逆流し再圧縮されるため吐出し温度が著しく上昇する。吸込み弁漏れは吸込み側への逆流で体積効率は激減するが吐出し温度上昇は小さい。"}, {"id": 672, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ニ", "theme": "スクリュー圧縮機の給油圧力と吐出し温度", "question": "スクリュー圧縮機に給油ポンプが付いている場合の給油圧力は、吐出しガス圧力よりも0.2から0.3 MPa程度高い。また、この圧縮機の吐出しガス温度は、フルオロカーボン冷媒では通常90℃以下である。これより高い場合は、油冷却器による冷却不良などを疑う必要がある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "強制給油式の適正給油圧力は吐出し圧力＋0.2〜0.3 MPa。吐出しガス温度は通常80〜90℃以下であり、超過時は油冷却器不良や油量不足等を点検する。"}, {"id": 673, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "イ", "theme": "空冷凝縮器の冬季制御", "question": "空冷凝縮器は、水冷凝縮器に比べて熱通過率が小さく、凝縮温度が高くなる特徴があるが、冬季には凝縮圧力の低下を防ぐために、冷却空気量を制御したり、凝縮圧力調整弁で凝縮圧力を制御する。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "空冷式は冬季に外気温度低下で凝縮圧力が下がりすぎ膨張弁差圧不足を起こすため、ファン風量制御や凝縮圧力調整弁（液滞留）で圧力を維持する。"}, {"id": 674, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ロ", "theme": "水冷横形シェルアンドチューブの過充填", "question": "受液器兼用の水冷横形シェルアンドチューブ凝縮器において、装置内に冷媒を過充てんすると、余分な冷媒液が凝縮器に貯えられ、多数の冷却管が冷媒液中につかり、冷媒蒸気の凝縮に有効な伝熱面積が減少し、凝縮温度が上昇する。一方、凝縮器出口の冷媒液の過冷却度は増大する。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "冷却管が液没すると気体凝縮有効面積が減り凝縮温度・圧力は上昇する。一方で液が管群と接触冷却されるため出口過冷却度は増大する。"}, {"id": 675, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ハ", "theme": "冷却管水あかの熱通過率低下割合", "question": "水あかや油膜が水冷横形シェルアンドチューブ凝縮器の冷却管に付着すると、それらの熱伝導抵抗によって熱通過率の値が小さくなる。そのため、圧縮機の消費電力は増加し、冷凍能力は減少する。冷却管がローフィンチューブの場合よりも裸管のほうが、水あかが厚く付着することによる熱通過率の低下割合が大きい。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "ローフィンチューブは外表面積が内表面積の3.5〜4.2倍あり、内面（水側）の熱抵抗の影響が外表面基準熱通過率に大きく現れるため、水あか付着による熱通過率低下割合が大きいのは「ローフィンチューブ」である（裸管のほうが大きいとする記述は誤り）。"}, {"id": 676, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ニ", "theme": "不凝縮ガス混入時の伝熱阻害側", "question": "空冷凝縮器内に空気などの不凝縮ガスが混入すると、冷却管の空気側の熱伝達率が小さくなり、凝縮温度が高くなる。そのため、圧縮機の吐出しガスの圧力と温度が高くなり、圧縮機用電動機の消費電力が増加し、冷凍能力と成績係数が低下する。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "不凝縮ガスが混入して伝熱を阻害するのは管内の「冷媒側」である（「空気側の熱伝達率が小さくなり」は誤り）。"}, {"id": 677, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "イ", "theme": "乾式蒸発器の着霜影響", "question": "フィンコイル乾式蒸発器に霜が厚く付着すると、空気の流れるフィンの隙間が狭くなり、空気の流れ抵抗が増加する。このため、蒸発器通過風量が減少して、蒸発器の冷却能力は減少する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "着霜により通風抵抗増大・風量減少と、霜層の熱抵抗増大が重なり、蒸発温度が低下して冷却能力は著しく減少する。"}, {"id": 678, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ロ", "theme": "温度自動膨張弁感温筒の外れとガス漏れ", "question": "温度自動膨張弁の感温筒は、蒸発器出口の過熱された冷媒蒸気温度を吸込み蒸気配管の管壁を介して検出し、圧縮機の吸込み蒸気過熱度を制御する。そのため、管壁から感温筒が外れ、感温筒の温度が上がると膨張弁は開く方向に作動し、感温筒内に封入されている冷媒が漏れると膨張弁は閉じる方向に作動する。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "外れて高温を検知すると弁を開き過剰送液（液戻り）となる。封入ガスが漏れると開弁力が失われ弁は全閉する。"}, {"id": 679, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ハ", "theme": "蒸発温度低下と冷媒循環量", "question": "蒸発器の蒸発温度が低下すると、蒸発器内の冷媒圧力が低下し、圧縮機吸込み蒸気の比体積が大きくなり、冷媒循環量と冷凍能力が減少する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "蒸発圧力低下→吸込み蒸気比体積大（密度小）→冷媒循環量減少→冷凍能力減少となる。"}, {"id": 680, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ニ", "theme": "停止時のポンプダウン運転", "question": "乾式蒸発器を使用した冷凍装置の運転停止時には、蒸発器内に冷媒液が残留しないように、運転停止前に圧縮機で冷媒を高圧側へ回収して、再始動時の液戻りを防ぐ。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "液封止弁を閉じて圧縮機を動かし蒸発器内の液を高圧受液器へ回収（ポンプダウン）してから停止させることで、再起動時の液戻り事故を防ぐ。"}, {"id": 681, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "イ", "theme": "冷媒への油溶解と粘度", "question": "フルオロカーボン冷媒液は、冷凍機油を溶解すると粘度が低くなる。また、過度に油を溶解すると伝熱を阻害することになる。一般に、油の溶解量が3%以下であれば特に支障がない。", "answer": "×", "law": "上級テキスト 潤滑油編", "explanation": "フルオロカーボン冷媒液に冷凍機油が溶解すると、液の粘度は「高く」なる（低くなるは誤り）。"}, {"id": 682, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ロ", "theme": "凝縮器の温度差と熱伝達率", "question": "凝縮器では、冷媒温度と冷却媒体との算術平均温度差が大きいほど熱流束（熱流密度）が大きくなって、凝縮作用が活発になり、冷媒側熱伝達率も大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "温度差大で凝縮が活発になると凝縮液膜が厚くなり熱伝導抵抗が増すため、冷媒側熱伝達率は「小さく」なる（大きくなるは誤り）。"}, {"id": 683, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ハ", "theme": "凝縮器内の混合気境界層と停止時圧力", "question": "水冷横形シェルアンドチューブ凝縮器内（冷媒側）に不凝縮ガスが存在すると、伝熱面近くに混合気境界層が形成されて伝熱作用が阻害される。また、冷凍装置の運転停止中における凝縮器の圧力は、凝縮器内に存在する不凝縮ガスの分圧相当分だけ高くなる。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "運転中は液膜表面に不凝縮ガスが濃縮された混合気境界層ができ伝熱阻害を起こす。停止時は冷媒飽和圧力に不凝縮ガス分圧が加算された圧力を示す。"}, {"id": 684, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ニ", "theme": "アンモニアと鉱油の物性比較", "question": "アンモニアと冷凍機油（鉱油）とはほとんど溶け合わない。また、温度によって異なるが、油の粘度はアンモニア液と同じ程度であり、油の熱伝導率はアンモニア液の1/3程度である。アンモニアの蒸発および凝縮の際の伝熱面上の油膜は、伝熱の大きな障害となるので、伝熱面からできるだけ排除することが望ましい。", "answer": "×", "law": "上級テキスト 潤滑油編", "explanation": "油の粘度はアンモニア液よりも「約3桁（1000倍程度）大きい」（「アンモニア液と同じ程度」は誤り）。熱伝導率は約1/3。"}, {"id": 685, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "イ", "theme": "感温筒の垂直管取付と防熱", "question": "温度自動膨張弁本体は蒸発器入口近く、また、感温筒は蒸発器出口近くに取り付ける。感温筒は、周囲の温度や湿度の影響を受けないように防湿性のある防熱材で包むようにし、垂直吸込み管に取り付けるときは、感温筒のキャピラリチューブが上側になるようにする。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "感温筒は風や外気温の影響を遮断するため防熱材を施工し、垂直管では内部液がキャピラリ側へ抜け出さないようキャピラリを上向きにして取り付ける。"}, {"id": 686, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ロ", "theme": "電子膨張弁の駆動と材料", "question": "電子膨張弁は、サーミスタなど温度センサからの電気信号を調節器で過熱度に演算処理し、電気的に弁を駆動して開閉の操作を行い、温度自動膨張弁と比較して幅広い制御特性にすることができる。また、構成材料を適切に選択すれば、電子膨張弁は冷媒の種類に関係なく使用できる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "ステッピングモータ駆動等によりマイコン制御で広範囲の精密制御が可能。材料選定によりあらゆる冷媒に対応できる。"}, {"id": 687, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ハ", "theme": "吸着チャージ方式の応答速度", "question": "吸着チャージ方式の温度自動膨張弁の感温筒内には、活性炭などの吸着剤とともに炭酸ガスのような通常の使用状態で液化しないガスが封入されている。吸着チャージ方式は、封入する吸着剤の量とガスの種類によって、感温筒温度に対する感温筒内ガス圧の応答感度を変えることができ、クロスチャージ方式よりも応答速度が速い。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "吸着チャージ方式は吸着剤の吸脱着を介して圧力が変わるため、液・ガス・クロスチャージ等の他方式に比べて「応答速度が最も遅い」（応答速度が速いは誤り）。この遅さによりハンチング防止に効果がある。"}, {"id": 688, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ニ", "theme": "ディストリビュータによる膨張弁容量低下", "question": "温度自動膨張弁の容量（冷凍能力）は、オリフィス口径と弁開度に加え、弁前後の圧力差などによっても異なる。膨張弁出口側に液分配用ディストリビュータを取り付けると、弁出口圧力が高くなって弁出入口圧力差が小さくなり、膨張弁の容量が減少する。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "ディストリビュータ（分配器）によるノズル圧力降下分だけ膨張弁出口背圧が高くなり、弁前後の有効差圧が減少して膨張弁の通過可能容量は減少する。"}, {"id": 689, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "イ", "theme": "蒸発圧力調整弁（EPR）と成績係数", "question": "蒸発圧力調整弁を用いた冷凍装置において、圧縮機容量に対して蒸発器容量が小さくなった場合は、蒸発圧力調整弁での圧力降下が大きくなり、圧縮機吸込圧力が低下するが、蒸発圧力調整弁では、冷媒は等比エンタルピーの絞り膨張となるので、装置の成績係数は変わらない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "弁で絞り膨張しても、圧縮機の吸込み圧力が大きく下がることで圧縮動力が増大し、装置の成績係数（COP）は「低下する」（「変わらない」は誤り）。"}, {"id": 690, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ロ", "theme": "吸入圧力調整弁と蒸発圧力調整弁の構造比較", "question": "直動形吸入圧力調整弁は、ベローズによってシールされた作動圧力設定用ばねとベローズに直結されたバルブプレートからなっている。この弁は、バルブプレートの向きも含め、直動形蒸発圧力調整弁と同じ構造であるが、冷媒の入口と出口の取り付け方が逆である。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "直動形吸入圧力調整弁（SPR）は出口圧力制御、蒸発圧力調整弁（EPR）は入口圧力制御であるため、「バルブプレートの向きが逆」になっている（同じ構造は誤り）。"}, {"id": 691, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ハ", "theme": "凝縮圧力調整弁（CPR）と受液器", "question": "凝縮圧力調整弁は、空冷凝縮器の冬季運転における凝縮圧力の異常な低下を防止し、冷凍装置を正常に運転するための圧力制御弁である。凝縮圧力調整弁による凝縮圧力の制御は、凝縮器の冷媒液量を利用する方法であり、装置の冷媒充てん量に多少の余裕を必要とするので受液器がなければならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "空冷凝縮器内に液を滞留させて伝熱面積を減らす制御であるため、滞留分を含めた余剰冷媒を蓄え液管へフラッシュガスを流さない受液器が必須。"}, {"id": 692, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ニ", "theme": "直動形圧力式冷却水調整弁の動作", "question": "直動形の圧力式冷却水調整弁は、下部の凝縮圧力導入用の接続口付きベローズ部分と、作動圧力設定用ばねを収めた調整部分から成り、凝縮圧力が高くなると弁開度が大きくなる。また、凝縮負荷、水温変化、凝縮器の熱通過率変化などに応じて、凝縮圧力が
