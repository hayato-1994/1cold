適正な状態を保つように冷却水量を調節する。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "凝縮圧力をベローズに直接導いて制御するため応答が速く、凝縮圧力上昇時に弁を開いて水量を増やし設定圧力を維持する。"}, {"id": 693, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "イ", "theme": "フロートスイッチの種類", "question": "満液式蒸発器を用いた冷凍装置では、フロート弁やフロートスイッチによって、冷媒液だめ器内の液量（液面レベル）の制御を行う。フロートスイッチには、直接作動形と電子式の遠隔作動形の2種類がある。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "永久磁石で接点を直接開閉する直接作動形と、インダクタンス変化を増幅してリレーを動かす電子式遠隔作動形がある。"}, {"id": 694, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ロ", "theme": "電磁弁の許容電圧変動", "question": "電磁弁の作動電源は、直流用では、12V, 24V, 100V、交流用では、24V, 100V, 200Vが標準であるが、110V, 220Vもある。また、これらの定格電圧からの許容電圧変動は±10%以下である。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "電磁弁の定格電圧からの許容変動範囲は±10%以内である。過大電圧はコイル焼損、過小電圧は吸引力不足で作動不良を招く。"}, {"id": 695, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ハ", "theme": "油圧保護圧力スイッチの遅延時間", "question": "多気筒圧縮機などの大形圧縮機では、油ポンプを内蔵または外部に装着している。運転中に定められた油圧が保持できなくなると、圧縮機の軸受などが焼付き事故を起こす危険がある。このような事故を防止するために、圧縮機を始動してから一定時間、または運転中の一定時間（一般に90秒程度）、定められた給油圧力を保持できない場合には、油圧保護圧力スイッチの電気接点を開き、圧縮機の電動機を停止させる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "始動時の油圧立ち上がり待ちや一時的な油圧変動での誤トリップを防ぐため、バイメタルヒータ等で約90秒（60〜120秒）の遅延時間を持たせて接点を開く。"}, {"id": 696, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ニ", "theme": "吸着チャージ式サーモスタットの設置環境", "question": "蒸気圧式サーモスタットは、感温筒内のチャージ方式により、ガスチャージ方式、吸着チャージ方式、液チャージ方式に分類される。これらのうち、吸着チャージ方式は、受圧部の温度が作動に及ぼす影響が大きく、サーモスタット本体が感温筒と異なった温度環境では使用できない。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "吸着チャージ方式は感温筒内の吸着量変化のみで作動するため、受圧部（本体）の温度影響をほとんど受けず、「本体が感温筒と異なる温度環境でも使用できる」（使用できないは誤り）。"}, {"id": 697, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "イ", "theme": "油分離器の設置対象装置", "question": "油分離器は、冷凍機油が凝縮器や蒸発器に入り込むと伝熱作用を阻害する不都合を生じるアンモニア冷凍装置、冷凍機油を蒸発器から圧縮機へ戻すことが難しい満液式蒸発器を用いたフルオロカーボン冷媒装置、低温で冷凍機油の粘度が高くなり蒸発器から油戻しが難しい蒸発温度-40℃以下の冷凍装置などに用いられる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "非相溶のアンモニア装置、油が滞留する満液式、油粘度が高まる-40℃以下の極低温装置、長配管装置などで油分離器が必須となる。"}, {"id": 698, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ロ", "theme": "アンモニア装置でのドライヤ不使用", "question": "フルオロカーボン冷媒装置では、一般にフィルタドライヤを取り付け、シリカゲルやゼオライトなどの乾燥剤を用いて冷媒系統の水分を吸着除去する。アンモニア冷凍装置でも、一般に同様の乾燥剤を用いて水分を除去する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニア系統内の水分はアンモニアと強く結合してアンモニア水を形成するため乾燥剤による吸着分離ができず、アンモニア装置にはフィルタドライヤを使用しない（誤り）。"}, {"id": 699, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ハ", "theme": "高圧受液器の容量設計（80%回収）", "question": "高圧受液器には、運転中の大きな負荷変動、冷却器の運転台数の変化、およびヒートポンプ装置の運転モードの切換えなどによる冷媒量の変化を吸収する容量をもたせる。さらに、冷媒充てん量の全量または大部分の量を受液器内容積の80%以内で回収できる容量をもたせる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "負荷変動吸収に加え、ポンプダウン時に全冷媒の全量又は大部分を受液器容積の80%以内で回収し、上部に最低20%のガス空間を確保できる容量が必要。"}, {"id": 700, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ニ", "theme": "低圧受液器の液面制御機器", "question": "低圧受液器は、冷媒液強制循環式冷凍装置の蒸発器冷却管に低圧冷媒液を送り込むための液だめとして、冷却管から戻った冷媒蒸気と液を分離する役割をもつ。低圧受液器では、運転状態が変化しても、冷媒液ポンプと蒸発器が安定した運転を続けられるように、一般に温度自動膨張弁で流量制御が行われる。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器の液面制御は液ポンプの吸込み揚程を確保するため「フロート弁」または「フロートスイッチと電磁弁の組合せ」で行う（「温度自動膨張弁」は誤り）。"}, {"id": 701, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア装置の液ガス熱交換器不使用", "question": "アンモニア冷凍装置には液ガス熱交換器を取り付け、凝縮器からの高温冷媒液と蒸発器からの低温冷媒蒸気との熱交換によって、凝縮器からの冷媒液を過冷却し、液管内でのフラッシュガスの発生を防止する。さらに、圧縮機吸込み蒸気を適度に加熱することにより、負荷変動などによる液戻りをある程度防止する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニアは断熱指数が大きく吸込み過熱による吐出し温度上昇が激しいため、液ガス熱交換器は「使用しない」（取り付けるとする記述は誤り）。フルオロカーボンの説明である。"}, {"id": 702, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ロ", "theme": "U字管式液分離器（アキュムレータ）", "question": "小形のフルオロカーボン冷凍装置に用いられるU字管を内蔵した液分離器では、一般に、入口から入った液滴を含んだ冷媒蒸気は、流れ方向の変化と速度の低下によって、液と蒸気に分離される。分離された容器底部の油と冷媒液は、U字管底部にあけられた小さな孔から、少量ずつ圧縮機へ吸い込まれる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "速度低下と流向変化で気液分離し、U字管底部のメタリングオリフィス（小孔）からガス流に乗せて油と微量冷媒液を少しずつ圧縮機へ返油する。"}, {"id": 703, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ハ", "theme": "満液式蒸発器の油回収器", "question": "フルオロカーボン冷媒装置の満液式蒸発器などに入り込んだ冷凍機油は、冷媒液に溶解している。そこで、油の溶解した冷媒液を抜き出し、油回収器で冷媒蒸気と油に分離して、冷媒蒸気は吸込み蒸気配管へ、油は油だめ器を介して圧縮機に戻す方法がある。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "満液式蒸発器から油濃度の高い冷媒液を抜き出し、ヒータ等の油回収器で冷媒のみを蒸発させて分離し、油を圧縮機クランクケースへ戻す。"}, {"id": 704, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ニ", "theme": "冷媒液強制循環式と油戻し配管", "question": "冷媒液強制循環式蒸発器では、一般に液ポンプにより蒸発量の3倍から5倍の量の冷媒を流す。また、冷凍機油の処理を行うために、一般に蒸発器本体に油戻し用の配管を設ける。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "強制循環式では油は冷媒液とともに低圧受液器に戻って濃縮されるため、蒸発器本体に油戻し配管を設けるのは「満液式蒸発器」である（誤り）。"}, {"id": 705, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "イ", "theme": "配管用炭素鋼鋼管（SGP）の使用限界圧力", "question": "配管用炭素鋼鋼管（SGP）は、フルオロカーボン冷媒では設計圧力が2MPa以下の耐圧部分、温度100℃以下の耐圧部分、温度-25℃よりも高温の部分には使用できる。しかし、毒性ガスの冷媒に対して使用してはならない。", "answer": "×", "law": "例示基準20、上級テキスト 配管編", "explanation": "SGPが使用できる設計圧力は「1 MPa以下」である（「2 MPa以下」は誤り）。毒性ガス使用禁止、-25℃〜100℃の制限は正しい。"}, {"id": 706, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒ガス配管の油同伴最低流速", "question": "冷媒ガス流速は、過大な圧力降下や騒音を生じない程度に抑制する必要がある。一方、冷媒ガスとともに圧縮機から吐き出された油が、確実に冷媒ガスに同伴される流速が必要であり、一般に横走り管で2m/s程度、立ち上がり管で3m/s程度にする。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "油を確実に同伴させるための最低流速は、一般に「横走り管で3.5 m/s以上」「立ち上がり管で6 m/s以上」である（2 m/s, 3 m/sは過小であり誤り）。最大流速は20〜25 m/s以下。"}, {"id": 707, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ハ", "theme": "液配管の防熱とフラッシュガス防止", "question": "液配管は、冷媒液にフラッシュガスを発生させないようにする必要がある。やむをえず、フラッシュガスの発生が懸念される高温の所に液配管を通す場合には、配管に防熱を施工し、フラッシュガスの発生を防止する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "周囲温度が冷媒液の飽和温度より高い場所を通ると受熱により液の一部が蒸発しフラッシュガスが発生するため、防熱施工を行って防止する。"}, {"id": 708, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ニ", "theme": "満液式蒸発器の油戻し（熱交利用）", "question": "満液式蒸発器を使用するフルオロカーボン冷媒装置では、蒸発器から圧縮機への油戻しが重要である。油戻しには、油を含んだ冷媒液を絞り弁を通して少しずつ抜き出し、液ガス熱交換器で冷媒液を気化させ、油とともに圧縮機に戻す方法などがある。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "油混じりの冷媒液を抜き出して液ガス熱交換器等で液を蒸発させ、油と冷媒蒸気を吸込み管へ導いて圧縮機へ戻す。"}, {"id": 709, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "イ", "theme": "安全装置の作動区分（ガス放出と電源遮断）", "question": "安全弁、破裂板、溶栓、高圧遮断装置などの安全装置は、設定の圧力と温度で作動し、外部に冷媒ガスを放出することで冷媒設備の圧力を許容圧力以下に戻す。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "ガスを放出するのは安全弁・破裂板・溶栓である。「高圧遮断装置」は電動機入力を遮断して圧縮機を止めるものであり、ガス放出は行わない（誤り）。"}, {"id": 710, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ロ", "theme": "高圧遮断圧力スイッチの設定圧力と精度", "question": "高圧遮断圧力スイッチの設定圧力は、高圧部に取り付けられた内蔵安全弁を除くすべての安全弁の最低吹始め圧力以下で、かつ、高圧部の許容圧力以下の圧力で作動するように設定する。なお、高圧遮断圧力スイッチの設定圧力の精度は、1MPa以上2MPa未満の設定圧力の範囲では、-12%以内でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "安全弁の最低吹始め圧力以下かつ許容圧力以下で作動させる。精度基準は1 MPa未満が-15%、1〜2 MPaが-12%、2 MPa以上が-10%以内である。"}, {"id": 711, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ハ", "theme": "圧力容器用安全弁口径の算定式", "question": "圧力容器用安全弁では、冷媒ガスと圧力容器の外径や全長などにより安全弁の必要最小口径サイズを決定し、圧力容器の圧力が過度に上昇しないようにする。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "必要最小口径は d = C * sqrt(D * L) （D:外径m, L:全長m, C:ガス定数）によって算定される。"}, {"id": 712, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ニ", "theme": "破裂板の最小口径", "question": "破裂板の最小口径は、圧力容器に取り付けるべき安全弁の口径の1/2とし、破裂圧力は安全弁の作動圧力以上で、耐圧試験圧力以下でなければならない。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "破裂板の最小口径は、安全弁の必要最小口径と「同一（同じ）」とする（「1/2とし」は誤り）。"}, {"id": 713, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "イ", "theme": "量産品の強度試験圧力", "question": "配管を除く圧縮機や容器の部分について、その強さを確認するために、耐圧試験の代わりに量産品について適用する強度試験がある。強度試験の試験圧力は、設計圧力の3倍以上の高い圧力である。", "answer": "○", "law": "冷規第7条、上級テキスト 試験検査編", "explanation": "量産品に適用される強度試験の圧力は設計圧力の3倍以上（液体耐圧試験圧力1.5倍の2倍以上）と規定されている。"}, {"id": 714, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ロ", "theme": "液体耐圧試験の降圧検査圧力", "question": "耐圧試験を液体で行う場合は、圧力容器内の空気を完全に排除した後、液体を徐々に加圧して、耐圧試験圧力まで上げ、その圧力を1分間以上保っておく。その後、圧力を耐圧試験圧力の1/2まで下げて、被試験品の各部、溶接継手などについて、漏れ、異常な変形、破壊などの異常がないことを確認して合格とする。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "耐圧試験圧力を1分以上保持した後、検査のために圧力を下げる目標値は「耐圧試験圧力の8/10（0.8倍）」までである（「1/2まで下げて」は誤り）。"}, {"id": 715, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ハ", "theme": "気密試験と耐圧試験の実施順序", "question": "気密試験は、空気または不燃性、非毒性ガスを用いたガス圧試験で実施し、試験する機器の気密性能を確認する。その後、空気、窒素などの気体を使用する耐圧試験を実施して、機器の耐圧性能を確認する。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "試験の順序は「耐圧試験を先に行い」、その後に「気密試験を行う」のが原則である（気密試験の後に耐圧試験を行うとする記述は誤り）。"}, {"id": 716, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ニ", "theme": "真空放置試験の到達真空度", "question": "冷媒設備の気密の最終確認をするための真空放置試験では、真空ポンプを使用して、装置内部を真空状態にしながら水分を蒸発させて乾燥させるとともに、設備からの漏れの有無を確認する。冷媒設備内の真空度は周囲大気温度に相当する水蒸気飽和圧力以下にすることが必要である。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "水分を蒸発排出し乾燥させるため、内部圧力を周囲温度に対応する水蒸気飽和圧力以下（常温で数kPa〜1 kPa以下）まで減圧して放置確認する。"}, {"id": 717, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "イ", "theme": "蒸発式凝縮器の屋上設置基礎", "question": "蒸発式凝縮器を屋上に設置する場合、地震による据付位置のずれを防止するために、基礎の質量は、その凝縮器の質量よりも十分に大きくし、その基礎の鉄筋と屋上床盤の鉄筋を固く結びつけ、凝縮器本体と基礎も十分に固定する。また、凝縮器は、水平に設置する。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "蒸発式凝縮器は重心が高く水保有量も多いため、基礎質量を本体より大きくし、屋上床スラブ鉄筋と強固に連結してアンカーボルトで固定し水平に据え付ける。"}, {"id": 718, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ロ", "theme": "地盤の許容応力の決定要因", "question": "機器の基礎底面にかかる荷重により地盤の不同沈下が起こらないようにするために、基礎底面にかかる応力を、基準の応力以下にする。この基準の応力を基礎の許容応力といい、基礎の材質により決まる。", "answer": "×", "law": "上級テキスト 据付編", "explanation": "不同沈下を防ぐための基準応力は「地盤の許容応力（地耐力）」といい、「地盤の種類（岩盤、砂、粘土等）」により決まる（「基礎の材質により決まる」は誤り）。"}, {"id": 719, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ハ", "theme": "冷凍機油の凝固点条件", "question": "冷凍機油の選定条件として、使用条件に対して凝固点が高く、ろう分が少なく、熱安定性と引火点が高いことなどがあげられる。また、低温用の冷凍機油では、流動点が低く、水分により乳化しにくいこと、酸に対する安定性が良いことなども選定条件として大切である。", "answer": "×", "law": "上級テキスト 潤滑油編", "explanation": "低温配管や蒸発器内で油が固化しないよう、凝固点は「低く」なければならない（「凝固点が高く」は誤り）。"}, {"id": 720, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ニ", "theme": "フルオロカーボンの熱分解毒性ガス", "question": "フルオロカーボンは安定した冷媒であり、一般に毒性は低く可燃性もないが、高温の物体に触れると、分解して、フッ化水素やホスゲンなどの毒性の強いガスが発生する。圧力容器や配管の修理の際には、内部に残留ガスがないか十分に確認することが大切である。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "フルオロカーボンは裸火や溶接トーチ等の高温に触れると熱分解して猛毒のフッ化水素やホスゲンを生成するため、修理前には冷媒回収・窒素置換が必須である。"}, {"id": 721, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "イ", "theme": "往復圧縮機のオイルフォーミング", "question": "往復圧縮機は、冷凍機油が吸込み側の低圧部分にあるので、始動時や液戻り時にオイルフォーミングを発生しやすい。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "クランクケースが吸込み低圧側にあるため、停止中に油に多量に溶け込んだ冷媒が始動時の減圧で一気に沸騰気化しオイルフォーミングを起こす。"}, {"id": 722, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ロ", "theme": "スクリュー圧縮機の容量制御範囲", "question": "スクリュー圧縮機の押しのけ量は、ロータの歯の形状、歯数、長さおよび回転数により決まる。また、圧縮機の容量制御はスライド弁を使用して行うが、無段階制御はできない。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "スクリュー圧縮機のスライド弁容量制御は、油圧ピストン等により「無段階制御が可能」である（無段階制御はできないは誤り）。"}, {"id": 723, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ハ", "theme": "スクロール圧縮機の効率と回転数", "question": "スクロール圧縮機は、吸込みと吐出しの動作が滑らかで、トルク変動が非常に小さく、特に振動や騒音が小さい。また、体積効率と機械効率は低いが、高速回転に適している。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "スクロール圧縮機は弁がなく連続圧縮するため「体積効率、断熱効率、機械効率がいずれも高い」（効率は低いとする記述は誤り）。"}, {"id": 724, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ニ", "theme": "遠心圧縮機のサージングと多段化", "question": "遠心圧縮機において、容量制御をサクションベーンにより行う場合、低流量になると、サージングによって振動や騒音が発生する。また、低温用の冷凍装置で使用するときは、圧力比が大きくなるので、多段圧縮式を採用する必要がある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "低流量域では羽根車の流れが剥離してサージングを起こす。また遠心式は1段当たりの圧力比が小さいため、低温用では多段圧縮が必要となる。"}, {"id": 725, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "イ", "theme": "多気筒圧縮機のアンローダとCOP", "question": "多気筒圧縮機の容量制御は、吸込み弁を開放して、圧縮の作動をする気筒数を減らして行うため、圧縮機の気筒数により段階的制御が可能である。また、この容量制御を行わないと負荷減少時に吸込み圧力が低下し、成績係数が小さくなる。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "吸込み弁押し下げ（アンロード）で気筒数に応じた段階制御を行う。容量制御がないと低負荷時に蒸発圧力が低下し圧縮比増大によりCOPが大幅に悪化する。"}, {"id": 726, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ロ", "theme": "スクリューアンローダと吐出し温度", "question": "スクリュー圧縮機のアンローダ機構は、圧縮機始動時の負荷軽減装置などとして使われている。しかし、低負荷で長時間運転すると、吐出しガス温度が高くなることがあるので注意する必要がある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "スライド弁でバイパスすると圧縮途中の加熱ガスが吸込み側に戻り、低負荷（アンロード）連続運転では吐出しガス温度が上昇しやすい。"}, {"id": 727, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ハ", "theme": "蒸発圧力調整弁の取付位置", "question": "蒸発圧力調整弁を用いて圧縮機の容量制御をするとき、この調整弁は、温度自動膨張弁の感温筒および均圧管の取付け位置よりも上流側の配管に取り付けなければならない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は、温度自動膨張弁の感温筒・均圧管取付け位置よりも「下流側」に取り付けなければならない（上流側は誤り）。上流に付けると膨張弁が誤動作する。"}, {"id": 728, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ニ", "theme": "吸入圧力調整弁（SPR）の制御方向", "question": "吸入圧力調整弁は、圧縮機の吸込み管に取り付ける。この調整弁を取り付ける目的は、上流側の圧力が所定の圧力以下にならないように、吸込み蒸気を絞り、容量制御することである。この方法は、装置の運転動力が増大するので、装置の成績係数は低下する。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（SPR/CPR）の目的は、「下流側（圧縮機側）の圧力が所定値以上にならないように」絞ることである（上流側が所定圧力以下にならないように、は誤り）。"}, {"id": 729, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "イ", "theme": "過熱運転の発生原因", "question": "低温用冷凍装置における蒸発器の熱負荷の大幅な低下、サクションフィルタの目詰り、膨張弁手前でのフラッシュガスの発生などによって、吸込み圧力が異常に低下すると、圧力比が大きくなり、吐出しガス温度が上昇して、圧縮機は過熱運転になる。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "低負荷、フィルタ詰まり、冷媒供給不足による蒸発圧力の異常低下は、圧力比を急増させ吐出し温度を過度に上昇させる。"}, {"id": 730, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ロ", "theme": "湿り圧縮・液戻りの原因", "question": "圧縮機の湿り圧縮や液戻りの原因としては、冷凍負荷の急激な変化、圧縮機のアンロード運転からフルロード運転への切り替わり、吸込み管途中に設けた大きなトラップ、温度自動膨張弁の感温筒が吸込み管からはずれることなどがある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "負荷急変、フルロード復帰時の圧力急低下、トラップ内の油・液の引き込み、感温筒外れによる全開動作などはいずれも湿り運転・液戻りの典型原因である。"}, {"id": 731, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ハ", "theme": "弁漏れ時の吐出し温度変化", "question": "往復圧縮機の吸込み弁や吐出し弁に漏れが生じると、圧縮機の吐出しガス温度にほとんど変化はみられないが、圧縮機の体積効率や冷凍装置の冷凍能力の大きな低下を招く。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁に漏れが生じた場合、高温吐出しガスがシリンダ内に逆流・再圧縮されるため「吐出しガス温度が大きく上昇する」（ほとんど変化はみられないは誤り）。"}, {"id": 732, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ニ", "theme": "密閉圧縮機のモータ焼損洗浄範囲", "question": "密閉圧縮機の電動機が焼損すると、巻線の絶縁物や冷凍機油が焼けて、圧縮機内の全面にカーボンが付着し、装置内の高圧系統の膨張弁までの熱交換器や配管に汚れが生じる。圧縮機を交換し、これらの高圧系統の部分を十分に洗浄すれば正常運転が可能である。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "モータ焼損によるスラッジや酸性劣化物、カーボンは高圧側だけでなく低圧側（蒸発器・吸込管）を含む「冷媒系統全体」に広がるため、全系統の完全洗浄が必要（高圧系統のみの洗浄は誤り）。"}, {"id": 733, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "イ", "theme": "不凝縮ガスの確認手順", "question": "水冷凝縮器を用いた冷凍装置内に不凝縮ガスが混入すると、この不凝縮ガスの分圧と冷却管における冷媒側の熱伝達抵抗の増大により、凝縮器内の圧力が高くなる。不凝縮ガス混入の有無は、一般に圧縮機の停止数分後の凝縮器内冷媒圧力と冷却水温度を計測して、冷却水温度に相当する冷媒の飽和圧力から判断する。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "停止直後は器内温度が均一でないため、不凝縮ガスの確認は圧縮機停止後「冷却水を20〜30分間通水し続けた後」に測定して判断する（「停止数分後」は誤り）。"}, {"id": 734, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ロ", "theme": "空冷凝縮器風量制御と温度差", "question": "空冷凝縮器を用いた冷凍装置における、冬季の外気温度の低下による膨張弁容量不足の対策の一つとして、空冷凝縮器の送風機の風量を減少させる方法がある。この方法では、凝縮器の熱通過率は変わらないが、凝縮器の冷媒と空気との間の平均温度差が小さくなり、膨張弁容量の不足を防止できる。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "風量を減らすと空気側熱伝達率が下がり「熱通過率Kが小さくなる」。その結果、放熱のために「平均温度差Δtが大きくなり」、凝縮温度・圧力が上昇して維持される（熱通過率は変わらない・温度差が小さくなるは誤り）。"}, {"id": 735, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ハ", "theme": "油膜と水あかの熱通過率影響", "question": "R22は鉱油をかなりよく溶解するので、伝熱面に油膜を形成しにくいが、アンモニアは鉱油をほとんど溶解せず、伝熱面に油膜を形成し、熱通過率を低下させる。通常の運転状態における水冷凝縮器の冷却管外表面に付着した油膜と、この冷却管内表面に厚く付着した水あかとを比較すると、熱通過率の低下に対する影響は水あかのほうが大きい。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "油膜の厚さは数十μm程度にとどまるが、冷却水側の水あかは掃除を怠ると数mm単位で厚く堆積するため、熱通過率低下への悪影響は水あかのほうが圧倒的に大きい。"}, {"id": 736, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ニ", "theme": "二段圧縮装置の液封箇所", "question": "液ポンプ方式の低温用二段圧縮冷凍装置において、液封を起こしやすい箇所は、高圧受液器から中間冷却器および中間冷却器から低圧受液器にいたる液管、低圧受液器の液ポンプ出口から蒸発器への低圧配管などであり、これらの箇所には圧力逃がし弁などを設ける。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "前後の弁を閉止した際に液が充満密閉されやすい液管部には、受熱による異常高圧破裂事故を防ぐため安全弁や圧力逃がし弁を設置する。"}, {"id": 737, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "イ", "theme": "蒸発温度差の設定影響", "question": "一般的な冷凍装置の蒸発器における蒸発温度と被冷却物との温度差は、利用用途ごとに、ある程度経験的に決まっている。例えば、空気冷却器の温度差は、空調用で15Kから20K、冷蔵用で5Kから10Kとしている。この温度差が小さ過ぎると、伝熱面積の大きな蒸発器を必要とするうえ、成績係数の低下を招く。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "温度差が小さすぎると伝熱面積は大きくなるが、蒸発温度が高くなるため圧縮比が小さくなり「成績係数は向上する」（成績係数の低下を招くは誤り）。"}, {"id": 738, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ロ", "theme": "蒸発器の熱通過率影響因子", "question": "冷凍装置の保守上、蒸発器の熱通過率はできるだけ高く保持することが重要である。水冷却器の冷却管への水あかの付着や、低温の空気冷却器への霜の付着は、蒸発器の熱通過率を低下させる。このほかにも空気冷却器の前面風速や満液式水冷却器の冷却管内の流速などが熱通過率に影響する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "管内外面の汚れ・着霜は熱伝導抵抗を増やし、風速や水流速の低下は熱伝達率を下げて熱通過率を著しく低下させる。"}, {"id": 739, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ハ", "theme": "蒸発温度低下と蒸気密度", "question": "冷凍装置における蒸発温度の低下は、蒸発器内の冷媒圧力の低下や冷媒の湿り飽和蒸気の密度の増大を招く。また、冷凍能力は圧縮機に吸い込まれる蒸気量によって変わるので、蒸発温度の低下は冷凍能力を減少させる。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "蒸発温度が低下すると圧力が下がり、比体積が大きくなるため「蒸気の密度は減少（小さく）する」（密度の増大を招くは誤り）。"}, {"id": 740, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ニ", "theme": "冷媒充填量不足の症状と受液器確認", "question": "冷凍装置への冷媒充てん量不足は、フラッシュガスの発生、冷却不良、蒸発圧力の異常低下などを生じる。日ごろの保守点検では、冷媒充てん量を運転中の高圧受液器の液面高さなどによって確認することが重要である。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "冷媒不足は液管フラッシュガスによる供給不足を引き起こす。運転中の高圧受液器液面（通常1/3〜1/2程度）を目視点検することが重要である。"}, {"id": 741, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "イ", "theme": "乾式蒸発器の温度差と空気側伝熱", "question": "空気冷却用のフィンコイル乾式蒸発器では、空気と冷媒との平均温度差が大きくなると伝熱量が増大して熱流束も大きくなる。このとき、冷媒側熱伝達率はほとんど変わらないが、空気側熱伝達率が大きくなり、熱通過率も大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "平均温度差が大きくなると沸騰が活発になり「冷媒側熱伝達率が大きく」なるが、「空気側熱伝達率は風速で決まるためほとんど変わらない」（記述が逆であり誤り）。"}, {"id": 742, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ロ", "theme": "アンローダ作動時の蒸発温度変化", "question": "アンローダを備えた多気筒圧縮機を用いた冷凍装置では、熱負荷の減少によりアンローダが作動すると、全負荷時より蒸発温度が低くなり、蒸発器の入口空気温度と蒸発温度との温度差が減少し、冷凍能力を低下させる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "アンローダが作動して圧縮機吸込み量が減ると、蒸発圧力・蒸発温度は全負荷時より「高く」なる（「全負荷時より蒸発温度が低くなり」は誤り）。"}, {"id": 743, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ハ", "theme": "アンモニア・鉱油の物性と伝熱阻害", "question": "アンモニアと冷凍機油（鉱油）とはほとんど溶け合わない。温度によって異なるが、油の粘度はアンモニア液の粘度よりも三桁ほど大きく、油の熱伝導率はアンモニア液の1/3ほどであり、伝熱面上の油膜は伝熱の障害となる。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "非相溶の鉱油は伝熱管に油膜を作り、粘度が約1000倍、熱伝導率が約1/3と劣るため著しい伝熱阻害要因となる。"}, {"id": 744, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ニ", "theme": "汚れ係数と熱通過率の低下特性", "question": "ローフィンチューブを用いる水冷凝縮器や満液式水冷却器の冷却管の外表面積基準の熱通過率は、汚れ係数の増大とともに減少する。この熱通過率は、汚れ係数の値が小さい範囲ではあまり変化しないが、汚れ係数の値が大きくなると大幅に低下する。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "熱通過率は「汚れ係数が小さい範囲で急激に大幅低下」し、汚れ係数が大きくなると低下の割合は緩やかになる（「小さい範囲ではあまり変化しない」は誤り）。"}, {"id": 745, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "イ", "theme": "ステッピングモータ式電子膨張弁", "question": "電子膨張弁で最も広く普及している方式はステッピング（パルス）モータ駆動方式であり、構成材料を適切に選択することにより、冷媒の種類に関係なく使用することができる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "パルス信号で弁開度を精密制御するステッピングモータ式が主流であり、耐食性等の材料選定によりあらゆる冷媒に適用できる。"}, {"id": 746, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ロ", "theme": "吸着チャージ式膨張弁の動作速度", "question": "温度自動膨張弁の感温筒のチャージ方式が吸着チャージ方式の場合、感温筒の温度が上昇すると吸着剤からガスが放出されて感温筒内のガス圧が上昇し、膨張弁の開度が大きくなる。吸着チャージ方式の膨張弁の動作は他のチャージ方式よりも速く、ハンチングを生じるおそれがある。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "吸着剤の熱移動と脱着を介するため動作速度は他方式より「遅く」、むしろ「ハンチングを防止する」特性を持つ（動作が速くハンチングのおそれは誤り）。"}, {"id": 747, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ハ", "theme": "内部均圧形膨張弁の圧力降下影響", "question": "乾式シェルアンドチューブ蒸発器に用いる内部均圧形の温度自動膨張弁は、蒸発器を流れる冷媒の圧力降下が小さければ、適切に過熱度制御が行える。しかし、蒸発器内の冷媒の圧力降下の大きさは、冷媒流量が増大するほど大きくなり、圧力降下の増大分だけ過熱度の制御偏差を生じる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "内部均圧形は弁出口圧力を基準とするため、蒸発器管内の圧力損失が大きいと出口での実過熱度が設定値より大きくなり制御偏差（オフセット）を生じる。"}, {"id": 748, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ニ", "theme": "オリフィス交換形温度自動膨張弁", "question": "オリフィス交換形の温度自動膨張弁は、配管内に膨張弁を取り付けたままオリフィスとニードルの弁体セットが交換できるような構造になっている。弁本体の配管接続部は交換可能な弁体セットの最大容量に合わせてあり、弁体セットの交換により、広範囲の容量に対応することができる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "配管から弁本体を取り外さずに内部の弁体カートリッジを交換でき、複数番手のオリフィスによりワイドな負荷容量に対応できる。"}, {"id": 749, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "イ", "theme": "蒸発圧力調整弁（EPR）の制御目的", "question": "蒸発圧力調整弁はEPRとも呼ばれる。温度自動膨張弁では、蒸発器内の蒸発圧力を制御することはできないが、蒸発圧力調整弁を使用すれば、蒸発圧力を設定値よりも高くならないように制御することができる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は蒸発圧力が設定値より「低く（下がら）ないように」制御する弁である（「高くならないように」は誤り）。"}, {"id": 750, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ロ", "theme": "凝縮圧力調整弁（CPR）と受液器の要否", "question": "凝縮圧力調整弁（CPR）は、空冷凝縮器の凝縮圧力が設定値以下にならないように制御するものである。凝縮器出口側に取り付けて、凝縮器の圧力が設定値以下に下がると、弁が閉方向に作動し、凝縮器に液を滞留させて凝縮圧力を制御するので、受液器を必要としない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "凝縮器内に冷媒液を溜め込んで圧力を保つ制御方式であるため、滞留分の余剰冷媒を逃がす「受液器が不可欠（必須）」である（「受液器を必要としない」は誤り）。"}, {"id": 751, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ハ", "theme": "温度式冷却水調整弁の特性", "question": "温度式冷却水調整弁は、感温筒と冷却水との間の熱の移動によって動作するために応答の遅れが大きく、緩やかな制御になり、急激な凝縮圧力の変化には、追従することができない。しかし、冷媒側と絶縁されて安全性が高く、調整弁の交換が容易である。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "感温筒による熱伝導作動のため応答は遅く急変には追従できないが、冷媒回路に直結しないため漏洩リスクがなく交換整備が容易である。"}, {"id": 752, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ニ", "theme": "吸入圧力調整弁（SPR）の設置目的", "question": "圧縮機の吸込み圧力が高くなると、圧縮機用電動機が過負荷となり焼損のおそれがある。これを防止するため、吸入圧力調整弁を圧縮機吸込み管に取り付ける。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（SPR）はクランクケース圧力が設定値以上に上がらないよう吸込み蒸気を絞り、モータの過負荷・焼損を確実に防止する。"}, {"id": 753, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "イ", "theme": "フロートスイッチの機能", "question": "フロートスイッチは、液面高さの上昇、下降にともなうフロートの動きを電気信号に変えて、これによって電磁弁が容器内に冷媒を送液したり、停止したりして、液面レベルの一定保持に使用される。また、液面レベルが上限に達したときに、警報を発したりするのにも用いられる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "満液式蒸発器や受液器の液面制御（給液電磁弁開閉）のほか、高液面警報や低液面カット用インターロックとして幅広く使用される。"}, {"id": 754, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ロ", "theme": "電磁弁の許容電圧変動範囲", "question": "電磁弁の作動電源は、直流用では12V, 24V, 100V、交流用では24V, 100V, 200Vが標準であるが、110V, 220Vもある。また、これらの定格電圧からの許容電圧変動は±15%以下である。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "電磁弁の定格電圧からの許容電圧変動は「±10%以内」である（「±15%以下」は誤り）。"}, {"id": 755, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ハ", "theme": "高圧圧力スイッチの復帰方式（安全用と制御用）", "question": "高圧圧力スイッチは、安全装置や圧力制御スイッチとして使用される。安全装置として使用する場合は、冷凍装置の停止した原因を修復してから運転再開する必要があり、原則として手動復帰形を使用しなければならない。圧力制御スイッチとして使用する場合は、自動復帰形を使用する。", "answer": "○", "law": "例示基準8、上級テキスト 制御機器編", "explanation": "安全保護用は原因究明と対策後に再起動させるため手動復帰形が原則。凝縮器ファン制御等の運転制御用には自動復帰形を用いる。"}, {"id": 756, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ニ", "theme": "ガスチャージ式サーモスタットの制限条件", "question": "ガスチャージ方式サーモスタットは、最高使用温度で感温筒に封入した媒体のすべてが気化し終わるように制限チャージしたもので、感温筒の温度に相当する飽和圧力で受圧部が動き、電気接点を開閉する。この方式は応答が速く、主に高温用に使われ、感温筒よりも受圧部の温度が低くないと正常に作動しない。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "ガスチャージ方式は主に「低温用」に使われ、感温筒内で凝縮液を維持して温度を感知させるため、「感温筒よりも受圧部（本体）の温度が高くなければならない」（受圧部が低くないと正常に作動しないは誤り）。"}, {"id": 757, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "イ", "theme": "フルオロカーボンでの油分離器の必要条件", "question": "フルオロカーボン冷凍装置においては、満液式蒸発器を使用する装置、蒸発温度が-40℃以下の低温の冷凍装置、配管距離が非常に長い装置、蒸発器の台数が多い装置などに、油分離器が必要である。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "油戻しが困難な満液式、油の粘度が高まる-40℃以下、油がクランクケースに戻るまで時間がかかる長配管・多台数系統では油分離器が必須。"}, {"id": 758, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ロ", "theme": "バッフル式油分離器の分離機構", "question": "油分離器は、冷凍装置の圧縮機と凝縮器との間に設置し、圧縮機吐出しガスに含まれている油を分離する。バッフル式の油分離器は、たて形円筒内のバッフル板により吐出しガスを旋回運動させ、油滴を遠心力で分離する方式である。フルオロカーボン冷媒用の油分離器は、分離した油をフロート弁により自動的に圧縮機クランクケースに返油する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "バッフル板に衝突させて油滴を分離するのは「衝突（バッフル）式」である。ガスを旋回させて遠心力で分離するのは「遠心力（サイクロン）式」であるため誤り。"}, {"id": 759, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ハ", "theme": "多台数蒸発器と高圧受液器容量", "question": "蒸発器が複数台設置されている冷凍装置では、それぞれの蒸発器の運転状態により蒸発器への冷媒液供給用電磁弁を開閉することがある。このように蒸発器の運転台数が変わったときには、全体の蒸発器内の冷媒量が大きく変化するので、冷媒量の変化を吸収できるような容量の高圧受液器を必要とする。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "冷却器の稼働台数変動に伴って系統内の必要冷媒液量が大きく変動するため、余剰液を安全に蓄えられる容量の高圧受液器が必要となる。"}, {"id": 760, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ニ", "theme": "低圧受液器の液面制御弁", "question": "冷媒液強制循環式冷凍装置に用いる低圧受液器は、蒸発器冷却管に低圧冷媒液を送り込むための液だめであり、運転状態が変化しても、冷媒液ポンプと蒸発器が安定した運転を続けられるように、温度自動膨張弁により送液量を調整し、液だめの液面高さを制御する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器の液面制御は過熱度制御を行う温度膨張弁ではなく、「フロート弁」または「フロートスイッチ＋電磁弁」によって行われる（温度自動膨張弁は誤り）。"}, {"id": 761, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "イ", "theme": "液ガス熱交換器の過冷却・過熱作用", "question": "フルオロカーボン冷凍装置に用いられる液ガス熱交換器は、凝縮器からの冷媒液と蒸発器からの冷媒蒸気との熱交換により、凝縮器からの冷媒液を過冷却して液管内での冷媒蒸気の発生を防止するとともに、蒸発器からの冷媒蒸気を適度に過熱するために用いられる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "液の過冷却によりフラッシュガスを防止し膨張弁能力を確保するとともに、吸込み蒸気を適度に過熱して液戻り・湿り運転を防止する。"}, {"id": 762, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ロ", "theme": "液分離器（アキュムレータ）の作用", "question": "フルオロカーボン冷凍装置に用いられる液分離器は、冷凍装置の蒸発器から圧縮機の間に設けられる。この液分離器を用いると、圧縮機吸込み蒸気に冷媒液または冷媒液滴が混入しないように、冷媒液を分離して蒸気だけを圧縮機に吸い込ませ、液戻りによる圧縮機の事故を防ぐことができる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "蒸発器〜圧縮機間に設置され、密度差と速度低下により気液分離して圧縮機への液戻り（液圧縮破壊）を防止する。"}, {"id": 763, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ハ", "theme": "満液式蒸発器の油回収器の熱源", "question": "フルオロカーボン冷凍装置に用いる油回収器では、満液式蒸発器内の油の濃度が高まらないように蒸発器から取り出した冷媒液と油を過熱し、冷媒蒸気と油に分離する。熱源には電気ヒータのほか、高圧冷媒液や高圧冷媒ガスが用いられる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "油濃度の高い液を抜き出して加熱蒸発させ、冷媒蒸気と油に分離する。加熱源には電気ヒータのほか高圧冷媒液や吐出しガスが利用される。"}, {"id": 764, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ニ", "theme": "冷媒液強制循環式での液分離器設置", "question": "大形冷凍装置などで利用される冷媒液強制循環式蒸発器では、冷媒を液ポンプで強制循環する。この蒸発器では、冷媒充てん量が乾式蒸発器よりも多く、液戻りを防ぐために液分離器を設ける必要がある。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "冷媒液強制循環式では「低圧受液器」そのものが大型の気液分離機能を兼ね備えているため、別途液分離器を設ける必要はない（設ける必要があるは誤り）。"}, {"id": 765, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "イ", "theme": "止め弁のグランド部取付向き", "question": "液配管に取り付けられている付属品の一つである止め弁は、耐圧、気密性能が十分であることが要求される。止め弁は、管と比べて圧力降下が大きく、冷媒漏れの原因となることもあるので、設置する数をできるだけ少なくし、弁のグランド部を下向きに取り付ける。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "弁のグランド部（軸封部）を下向きに取り付けると、油やゴミ、水分が溜まって漏洩やパッキン劣化の原因となるため、「下向きに取り付けてはならない」（下向きに取り付けるは誤り）。水平または上向きに取り付ける。"}, {"id": 766, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ロ", "theme": "銀ろうと黄銅ろうの特性比較", "question": "ろう付けに使用するろう材として銀ろう系のろう材がよく使われるが、黄銅ろう系のろう材も使用されている。ろう付け温度は銀ろう系のほうが黄銅ろう系よりも低い。銀ろう系ろう材は、溶融したろうの流動性がよく、強度も大きい。一方、黄銅ろう系ろう材は若干強度が劣る。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "銀ろう系（625〜700℃）は黄銅ろう系（850〜890℃）より融点が低く流動性・強度に優れる。黄銅ろう系は過熱で亜鉛蒸発による気泡を生じやすい。"}, {"id": 767, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管材料と低温靱性", "question": "冷媒配管に使用する材料は、冷媒の種類に応じた材料を選択して使用し、冷媒と冷凍機油の化学的および物理的な作用によって腐食および劣化しないことが必要である。低温で用いるフルオロカーボン用冷媒配管では、低温でも靱性の大きい材料を使用する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "アンモニアに銅系禁止、フルオロカーボンに高マグネシウムアルミ禁止などの適合性が必要。低温配管には低温脆性を避けるため靱性の高い材料を選定する。"}, {"id": 768, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ニ", "theme": "吸込み蒸気横走り管の勾配方向", "question": "吸込み蒸気配管の横走り管中にトラップがあると、軽負荷運転時に油や冷媒液がたまり、再始動時や軽負荷から全負荷に切り換わったときに液が圧縮機に戻る。冷媒液が圧縮機に戻るのを防ぐために、吸込み蒸気配管の横走り管は冷媒蒸気の流れ方向に上り勾配として、トラップをつくらないようにする。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "油や液の滞留を防いでスムーズに圧縮機に流すため、吸込み横走り管は冷媒の流れ方向に「下り勾配（1/200〜1/100程度）」とする（「上り勾配」は誤り）。"}, {"id": 769, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "イ", "theme": "圧力容器用安全弁の最小口径式", "question": "圧力容器用安全弁では、使用冷媒の種類と圧力容器の外径や全長などにより安全弁最小口径を決定し、圧力容器の圧力が過度に上昇しないようにする。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "必要最小口径 d = C * sqrt(D * L) （D:外径m, L:全長m）により容器の受熱外表面積とガス種に応じた口径を決定する。"}, {"id": 770, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ロ", "theme": "破裂板の口径と破裂圧力範囲", "question": "大形のフルオロカーボン用圧力容器に使用される破裂板は、圧力によって金属の薄板が破れる方式の安全装置であり、その最小口径は圧力容器に取り付けるべき安全弁の必要最小口径と同じとし、破裂圧力は安全弁の作動圧力以上で、耐圧試験圧力以下でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "破裂板の口径は安全弁と同等とし、破裂圧力は安全弁作動圧力以上かつ耐圧試験圧力以下（通常耐圧の0.8〜1.0倍）とする。"}, {"id": 771, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ハ", "theme": "高圧遮断圧力スイッチの接続と設定", "question": "高圧遮断圧力スイッチは、圧縮機吐出し部で吐出し圧力を正確に検出する位置に圧力誘導管を接続する必要があり、配管の下側（下面側）に圧力誘導管を接続することは避ける必要がある。また、設定圧力は、高圧部に取り付けられた内蔵安全弁を除くすべての安全弁の最低吹始め圧力以下で、かつ、高圧部の許容圧力以下の圧力で作動するように設定する。なお、設定圧力の精度は、設定圧力の範囲によって規定されている。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "油やスラッジの流入を防ぐため圧力導入管は配管上面から取り出す。設定圧力は安全弁吹始め以下・許容圧力以下で作動させる。"}, {"id": 772, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ニ", "theme": "アンモニア冷媒への破裂板使用制限", "question": "アンモニア冷媒の冷凍装置において、液封によって著しく圧力上昇のおそれがある部分には、安全弁、破裂板または圧力逃し装置を取り付けるが、安全弁と破裂板には放出管を取り付け、その開口部には放出されたガスを処理する除害装置などを設けなければならない。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "破裂板は一度破裂すると全量大気放出されるため、毒性・可燃性ガスである「アンモニア冷媒設備には破裂板を使用してはならない」（取り付けるとする記述は誤り）。"}, {"id": 773, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "イ", "theme": "圧力容器溶接部の機械試験と非破壊試験", "question": "法定の冷凍能力が20トン以上の冷媒設備の圧力容器の突合せ溶接部の試験には、機械試験と非破壊試験がある。また、溶接部は溶け込みが十分であり、かつ、割れまたはアンダーカット、オーバーラップ、クレータ、スラグの巻き込み、ブローホールなどの欠陥があってはならない。", "answer": "○", "law": "例示基準、上級テキスト 試験検査編", "explanation": "法定能力20トン以上の圧力容器突合せ溶接継手には引張・曲げ等の機械試験と、放射線透過・超音波等の非破壊試験が定められている。"}, {"id": 774, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ロ", "theme": "耐圧試験と気密試験の順序", "question": "気密試験は、空気または窒素ガスなどの不燃性で非毒性のガスを用い、試験する機器の気密性能を確認する。その後、水や油などの液体を使用する耐圧試験を実施して、機器の耐圧性能を確認する。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "機器の耐圧強度を先に確認するため「耐圧試験を最初に行い、その後に気密試験を実施する」のが正しい手順である（気密試験の後に耐圧試験を行うは誤り）。"}, {"id": 775, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ハ", "theme": "真空試験の到達圧力と漏れ特定限界", "question": "真空試験は、真空ポンプを使用し、装置内を周囲大気温度に相当する水蒸気飽和圧力以下とする。装置内に水分が存在すると、真空ポンプを止めた際に圧力が上昇してしまうため、十分に時間をかけて装置内部の水分を排出させる必要がある。また、真空試験は微量な漏れの有無は確認できるが、漏れ箇所の特定はできない。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "装置内水分の蒸発乾燥と微小漏れの全体系確認を行う。真空放置では圧力上昇により漏れの有無は判明するが、具体的にどこから漏れているかの位置特定はできない。"}, {"id": 776, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ニ", "theme": "耐圧試験時の材料許容応力", "question": "圧縮機、圧力容器などの耐圧強度を確認するために行う耐圧試験の圧力は、設計圧力に対して高いほうが信頼性も増すが、機器に変形を生じてはいけないので、加圧時に発生する応力を、その機器材料の引張強さよりも低くなるようにしなければならない。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "耐圧試験時に材料に生じる応力は、永久変形を起こさないよう引張強さではなく「材料の降伏点（耐力）よりも低く」抑えなければならない（引張強さよりも低くは誤り）。"}, {"id": 777, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "イ", "theme": "基礎底面の応力分布と不同沈下", "question": "機器の基礎底面にかかる荷重により地盤の不同沈下が起こらないようにするためには、荷重分布によらずに、機器の荷重をその基礎底面積で除した平均荷重が、地盤の許容応力よりも低くなっていればよい。", "answer": "×", "law": "上級テキスト 据付編", "explanation": "不同沈下を防ぐには、平均値だけでなく「どの部分の接地圧も地盤の許容応力以下」とし、偏荷重がないよう均等に荷重を分布させなければならない（「荷重分布によらずに平均荷重が低ければよい」は誤り）。"}, {"id": 778, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ロ", "theme": "冷媒充填量不足時の吐出し温度挙動", "question": "冷媒充てん量が不足すると、蒸発圧力が低下し、圧縮機の吸込み蒸気の過熱度が大きくなり、吐出し圧力と吐出しガス温度が低下する。さらに、冷凍能力も低下する。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "冷媒充填量不足時は、吸込み過熱度大・比体積増大・圧力比増大により「吐出しガス温度は上昇する」（「吐出しガス温度が低下する」は誤り）。"}, {"id": 779, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ハ", "theme": "フルオロカーボンの熱分解と窒素置換", "question": "フルオロカーボンが裸火や高温の物体に触れると、分解してフッ化水素やホスゲンなどの毒性の強いガスを生成するので、圧力容器や配管の修理を行うときは、内部に残留ガスがないことを十分に確認したのち、窒素に置換してから行うのが一般的である。", "answer": "○", "law": "上級テキスト 保守安全編", "explanation": "熱分解による有毒ガス発生および室内での酸欠・不完全燃焼を防ぐため、修理・溶接作業前には冷媒を全量回収し窒素置換を徹底する。"}, {"id": 780, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ニ", "theme": "フルオロカーボンの限界濃度と二酸化炭素", "question": "冷媒の放出により失神や重大な障害が起きることのないように限界濃度を定めているが、一般に使用されるフルオロカーボンの限界濃度は、二酸化炭素よりも高い。", "answer": "○", "law": "KHK施設基準、上級テキスト 保守安全編", "explanation": "冷媒漏洩時の限界濃度はR134aが0.25 kg/m3、R410Aが0.44 kg/m3であり、毒性・窒息作用の強い二酸化炭素（0.07 kg/m3）よりも高い値に設定されている。"}, {"id": 781, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "イ", "theme": "密閉圧縮機と開放圧縮機", "question": "小・中形の圧縮機では、圧縮機と電動機が同じ軸上に直結されて一つのケーシング内に収められた開放圧縮機が、フルオロカーボン冷凍装置に多く使用されている。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "圧縮機と電動機が同軸直結で同一ケーシング内に収められているのは「密閉圧縮機」である（「開放圧縮機」は電動機が外部にあり軸封装置を持つため誤り）。"}, {"id": 782, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ロ", "theme": "遠心圧縮機の構造と段数", "question": "遠心圧縮機は、羽根車を高速回転させ大量の冷媒蒸気を吸い込み、その蒸気を遠心力によって渦巻室へ送り込み圧縮する方式の圧縮機であり、大容量の空気調和用などに適している。低温用で使用するときは圧力比が大きくなるので、多段圧縮式を採用する必要がある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "高速回転羽根車で流速を与えディフューザ・渦巻室で静圧に変換する。1段当たりの圧力比が小さいため低温用では多段圧縮式が必要となる。"}, {"id": 783, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ハ", "theme": "スクロール圧縮機の圧縮機構", "question": "スクロール圧縮機は、うず巻状の曲線で構成された固定スクロールと旋回スクロールを組み合わせ、両スクロールの間に形成された圧縮空間容積を減少させて、吸込みガスを圧縮する。圧縮空間は、次第に容積を減少させながら中心部に向かって移動する。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "外周部からガスを吸い込み、旋回に伴い容積を縮小させながら中心吐出し口へ向かって連続的に移動圧縮する。"}, {"id": 784, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ニ", "theme": "コンパウンド圧縮機の特性", "question": "コンパウンド圧縮機は、二段圧縮の冷凍サイクルを実現するために、低段側と高段側の圧縮を1台の圧縮機で行えるようにしたものである。低段側と高段側の気筒数比によって、それぞれのピストン押しのけ量の比が決まってしまうので、中間圧力は最適値から若干のずれを生じることがある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "1台の圧縮機内に低段・高段気筒を備える。気筒数比（例：6気筒中低段4・高段2）で押しのけ量比が固定されるため、運転条件により中間圧力が理論最適値から若干外れることがある。"}, {"id": 785, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "イ", "theme": "ホットガスバイパス冷却専用液噴射弁", "question": "ホットガスバイパスによる容量制御では、ホットガスバイパス弁のほかに、ホットガス冷却専用の液噴射弁を取り付け、バイパス配管内でホットガスに冷媒液を混合して、ホットガスを冷却する場合がある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "吸込み管へ直接ホットガスを吹き込むと過熱度が高くなりすぎるため、冷却専用の液噴射弁（リキッドインジェクション弁）で液冷媒を混入・気化させて適正過熱度に冷却する。"}, {"id": 786, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ロ", "theme": "多気筒アンローダの制御段数", "question": "多気筒圧縮機のアンローダ機構は、一般に吸込み弁を開放して、作動気筒数を減らすことにより、容量を25〜100%の範囲で無段階に変えられるようになっている。また、圧縮機の始動時には、冷凍機油の油圧が正常に上がるまではアンロード状態になっており、圧縮機始動時の負荷軽減装置としても使われる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "多気筒往復圧縮機の吸込み弁開放アンローダは「段階的（例：4気筒なら50%・100%、8気筒なら25%・50%・75%・100%）」に容量を変えるものであり、「無段階に変えられる」は誤り。"}, {"id": 787, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ハ", "theme": "インバータ制御の体積効率と油圧", "question": "圧縮機の容量制御をインバータで行う場合、回転速度がある限定された範囲内では、体積効率はあまり変わらず、圧縮機の回転速度と容量はほぼ正比例するが、回転速度を大きく変えると低速回転時と高速回転時のいずれの場合にも体積効率が低下する場合がある。また、往復圧縮機でクランク軸に油ポンプを付けている圧縮機では、あまり低速にすると適正な油圧が得られなくなる。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "低速時は漏れ割合増大、高速時は弁抵抗増大で体積効率が低下する。軸駆動油ポンプ式では低速時に吐出油圧が不足し軸受焼付きの恐れがある。"}, {"id": 788, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ニ", "theme": "複数台圧縮機の発停制御方式", "question": "複数台の圧縮機をもった冷凍装置では、複数台の圧縮機を同時発停させて容量制御を行うことが一般的である。この容量制御方法では、複数台の圧縮機のクランクケース内の冷凍機油量が均一になるように、均油と均圧のための配管を設置する必要がある。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "容量制御は負荷変動に応じて複数台を「順次発停（ステップ制御）」させるのが一般的であり、「同時発停させて行う」は誤り（電源容量の急変や過負荷を招く）。"}, {"id": 789, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "イ", "theme": "低圧低下時の圧力比と吐出し温度", "question": "熱負荷の減少で圧縮機の吸込み蒸気圧力が正常な状態から異常に低下すると、圧縮機での圧力比が減少し、湿り圧縮運転状態となり、圧縮機の吐出しガス温度は低下する。一方、冷却水量が減少すると、圧力比の増大によって吐出しガス温度が上昇し、圧縮機が過熱運転となる場合がある。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "吸込み圧力が異常低下すると圧力比（P_cond/P_evap）は「増大」し、吐出しガス温度が上昇して「過熱運転」となる（「圧力比が減少し吐出し温度が低下」は誤り）。"}, {"id": 790, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ロ", "theme": "アンモニア往復機の油排出", "question": "冷凍機油は圧縮機の軸受、ロータやピストンなどの潤滑面に油膜をつくり、摩耗防止や摩擦によって生じる熱を除去する役割があるが、冷凍機油に鉱油を用いたアンモニアを冷媒とする往復圧縮機では、吐出しガス温度が高く、一般に圧縮機から吐き出された油を冷凍装置外部に排出する。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "アンモニア往復機は吐出し温度が高く非相溶の鉱油が熱劣化しスラッジ化するため、油分離器で捕集した油はクランクケースに戻さず機外へ抜き取る。"}, {"id": 791, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ハ", "theme": "弁漏れによる吐出し温度上昇の差異", "question": "往復圧縮機の吐出し弁からの漏れによる吐出しガス温度の上昇は非常に大きく、体積効率と断熱効率の低下を招く。吸込み弁板の割れや変形による漏れは、圧縮機の吐出しガス量が減少するので体積効率の低下を招くが、吐出しガス温度はあまり大きく上昇することはない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁漏れは高温高圧ガスの逆流再圧縮で吐出し温度が急上昇する。吸込み弁漏れは低圧側への逆流により体積効率は激減するが吐出し温度上昇は小さい。"}, {"id": 792, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ニ", "theme": "過熱運転の発生原因（電気・膨張弁）", "question": "往復圧縮機の過熱運転の原因としては、吐出しガス圧力の上昇や圧縮機の不具合などがある。密閉往復圧縮機では、これ以外に電源の異常な高電圧や低電圧などもある。蒸発器熱負荷が過大となり膨張弁容量が不足する場合も過熱運転となることがある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "密閉機では電圧異常によるモータ発熱や吸込み冷却不足が加わる。熱負荷過大による膨張弁容量不足も過熱度増大を招き過熱運転要因となる。"}, {"id": 793, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "イ", "theme": "水冷横形過充填時の過冷却度", "question": "受液器兼用の水冷横形シェルアンドチューブ凝縮器において、装置内に冷媒を過充てんすると、余分な冷媒液が凝縮器に貯えられ、多数の冷却管が冷媒液中につかり、冷媒蒸気の凝縮に有効な伝熱面積が減少し、凝縮温度が上昇する。一方、凝縮器出口の冷媒液の過冷却度は減少する。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "冷却管が液没すると気体凝縮面積が減り凝縮温度・圧力は上昇するが、冷媒液が冷却管群に接触して冷却されるため出口の過冷却度は「増大（大きく）」する（「減少する」は誤り）。"}, {"id": 794, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ロ", "theme": "冷媒・油の熱分解による不凝縮ガス", "question": "水分が冷媒に混入した状態で運転したり、高い吐出しガス温度で運転すると、冷媒と冷凍機油が分解して不凝縮ガスが生成する場合がある。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "水分の混入（加水分解）や高温運転による油・冷媒の熱分解・スラッジ化により、不凝縮性の気体成分が器内に生成される。"}, {"id": 795, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ハ", "theme": "水冷凝縮器の冷却水量減少の影響", "question": "水冷凝縮器において凝縮負荷と冷却水入口温度が変化しない場合、冷却水量の減少は、圧縮機駆動用電動機の消費電力の増加につながる。したがって、冷却水量の確保が必要である。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "水量が減少すると出入口水温差が拡大して出口水温・凝縮温度・凝縮圧力が上昇し、圧縮比増大により消費電力が増加する。"}, {"id": 796, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮圧力調整弁（CPR）の制御原理", "question": "空冷凝縮器を用いた冷凍装置において、冬季に外気温度低下により凝縮圧力が低下して膨張弁の容量が不足するときの対策として、凝縮圧力調整弁により凝縮器内に冷媒液を滞留させ、凝縮器の伝熱量を増加させて凝縮圧力を上昇させる方法がある。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "凝縮器内に液を滞留させるのは、冷却管を液没させて気相の「有効伝熱面積を減少」させ、放熱能力を抑えて圧力を上昇維持するためである（「伝熱量を増加させて」は誤り）。"}, {"id": 797, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "イ", "theme": "乾式シェルアンドチューブのブライン熱通過率", "question": "乾式シェルアンドチューブ蒸発器では、冷却管外に水を使用する場合に比べて、冷却管外にエチレングリコールなどのブラインを用いる場合のほうが、一般的に熱通過率は大きく、蒸発器を小さくすることができる。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "エチレングリコール等のブラインは水に比べて粘度が高く熱伝導率が低いため、熱通過率は「小さく」なり、同一能力では蒸発器伝熱面積を「大きく」設計する必要がある（誤り）。"}, {"id": 798, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ロ", "theme": "冷蔵用と空調用の圧力比・温度差比較", "question": "冷蔵用の冷凍装置では、空調用に比べて圧縮機の圧力比が小さく、蒸発圧力の変化が圧縮機駆動の軸動力に及ぼす影響は小さい。また、冷凍能力の減少を防止するために、蒸発温度と被冷却物との温度差は空調用に比べて小さく設定されている。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "冷蔵用は蒸発温度が低いため空調用よりも「圧力比が大きく」、蒸発圧力変化が軸動力に及ぼす影響は「大きい」（「圧力比が小さく影響は小さい」は誤り）。温度差を小さく（5〜10K）設定する点は正しい。"}, {"id": 799, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ハ", "theme": "冷媒不足・フラッシュガスと蒸発圧力", "question": "蒸発器には熱負荷に応じて膨張弁から冷媒液が供給されるが、冷媒充てん量が不足したり、液管にフラッシュガスが発生したりすると、蒸発圧力の異常低下などが起こることがある。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "冷媒充填量不足や液管内フラッシュガス発生は膨張弁の流量通過能力を激減させ、蒸発器への供給不足による蒸発圧力異常低下を招く。"}, {"id": 800, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ニ", "theme": "乾式と満液式の管凍結破損リスク比較", "question": "乾式シェルアンドチューブ蒸発器は、満液式シェルアンドチューブ蒸発器に比べて、運転中に蒸発圧力が低下してもブラインや水の凍結による冷却管の破損の危険性は少ない。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "満液式は細い管内を水・ブラインが流れるため凍結時に管を破裂させやすいが、乾式は管外（胴側）を流れるため凍結膨張による管破損リスクが少ない。"}, {"id": 801, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "イ", "theme": "ユニットクーラの並流と向流", "question": "温度自動膨張弁を使用するユニットクーラでは、感温筒取付け部の冷媒蒸気出口管の管内冷媒蒸気は、適度に過熱している。並流式のこの熱交換器では一般的に冷媒と空気との平均温度差が向流式よりも小さく、過熱部の管長が長くなり、向流式に比べて冷却に有利である。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "並流式は平均温度差が小さく過熱部管長が長くなるため伝熱上不利であり、「向流式に比べて冷却に有利である」は誤り（向流式のほうが有利）。"}, {"id": 802, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ロ", "theme": "アンモニアと鉱油の物性比較", "question": "温度によって異なるが、冷凍機油（鉱油）の粘度はアンモニア冷媒液の粘度よりも三桁程度大きく、冷凍機油の熱伝導率はアンモニア冷媒液の1/3程度であり、伝熱面上の油膜は伝熱の大きな障害となるので、伝熱面からできるだけ排除することが望ましい。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "鉱油の粘度はアンモニア液の約1000倍（3桁大）、熱伝導率は約1/3と劣るため、管内面に滞留・付着した油膜は著しい熱抵抗となり排除が必須。"}, {"id": 803, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ハ", "theme": "設計温度差と水あかによる凝縮温度上昇", "question": "ローフィンチューブを使用する水冷横形シェルアンドチューブ凝縮器では、設計時の冷媒と冷却水との算術平均温度差が大きなものほど、冷却管内面の水あかの汚れによる凝縮温度の上昇割合が大きくなる。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "外表面基準の熱流束が大きい（設計平均温度差Δtが大きい）設計ほど、汚れ係数増加に伴う管壁〜水側温度差Δtwの増大分が大きくなり、凝縮温度上昇割合が顕著となる。"}, {"id": 804, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ニ", "theme": "フィンコイル蒸発器の熱通過率と空気側抵抗", "question": "空気冷却用のフィンコイル乾式蒸発器では、冷媒と空気との算術平均温度差が大きくなると伝熱量（冷却能力）が増大する。ここで、伝熱量が増すと熱流束（熱流密度）が大きくなるので、冷媒側熱伝達率が大きくなり、熱通過率の値も同程度に大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "冷媒側熱伝達率は向上するが、全熱抵抗の大半を占める空気側熱伝達率が風速一定で変わらないため、「熱通過率の値も同程度に大きくなる」は誤り（熱通過率はあまり大きくならない）。"}, {"id": 805, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "イ", "theme": "外部均圧管の取付位置", "question": "外部均圧形温度自動膨張弁は蒸発器出口と膨張弁本体の均圧管接続部との間を均圧管で接続している。蒸発器出口側の均圧管取付位置は通常、膨張弁の感温筒取付位置より少し上流側とする。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "均圧管からの微小な冷媒漏洩が感温筒の温度検知に影響を与えないよう、均圧管は感温筒よりも「下流側（圧縮機側）」に接続する（「少し上流側とする」は誤り）。"}, {"id": 806, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ロ", "theme": "電子膨張弁のマイコン制御機能", "question": "電子膨張弁は、調節器によって幅広い制御特性にすることができる利点がある。また装置停止前のポンプダウンや、装置停止時の蒸発器への送液停止など各種の操作をマイクロコンピュータに組み込むことができる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "パルス制御により過熱度を自在にコントロールでき、全閉機能により電磁弁を兼用させてポンプダウンや停止時遮断をマイコン上で統合制御できる。"}, {"id": 807, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ハ", "theme": "定圧自動膨張弁の過熱度制御機能", "question": "定圧自動膨張弁には、弁出口または蒸発器出口のいずれかの圧力を検知して制御の動作をする内部均圧形と外部均圧形とがある。温度自動膨張弁と比べて、過熱度制御が優れており、熱負荷の変動の大きな装置での使用に適している。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "定圧自動膨張弁は圧力を一定に保つ弁であり「過熱度制御はできない」。負荷変動が大きいと液戻りや過熱を招くため「熱負荷変動の大きな装置には適さない」（誤り）。"}, {"id": 808, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ニ", "theme": "キャピラリチューブの自己調整と過熱度", "question": "キャピラリチューブは、熱負荷変動が小さく受液器を持たない小容量の冷凍装置に用いられ、その自己調整機能により凝縮器の圧力と過冷却度を制御する特性を持っている。その反面、蒸発器の圧力の影響は受けにくく、蒸発器出口の過熱度制御には使用できない。", "answer": "○", "law": "上級テキスト 膨張機構編", "explanation": "負荷変動の小さい小形冷蔵庫等に用いられ凝縮圧力と過冷却度を自律平衡させる。蒸発器出口過熱度に応じた開度調整機能はないため過熱度制御には使えない。"}, {"id": 809, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "イ", "theme": "蒸発圧力調整弁（EPR）と感温筒の位置", "question": "蒸発圧力調整弁は蒸発圧力が一定値以下にならないように制御する調整弁である。蒸発圧力調整弁を温度自動膨張弁と組み合わせて使用する場合には、膨張弁の感温筒は蒸発圧力調整弁の上流に取り付けなくてはならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "EPRは蒸発圧力を一定値以上に保つ。感温筒は蒸発器本来の出口過熱度を感知させるため、必ずEPRの「上流側（蒸発器直後）」に取り付ける。"}, {"id": 810, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ロ", "theme": "空冷凝縮圧力調整弁（CPR）と受液器", "question": "凝縮圧力調整弁は空冷凝縮器の冬季運転時における凝縮圧力の異常な低下を防止し、冷凍装置を正常な運転にするための圧力調整弁である。凝縮圧力調整弁による凝縮圧力の制御は、凝縮器への液の滞留による方法であり、その滞留分だけ、装置の冷媒充てん量に多少の余裕を必要とするので、受液器がなければならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "冬季の凝縮器内液滞留制御では余剰液の吸収と液管内フラッシュガス防止のため高圧受液器の設置が不可欠である。"}, {"id": 811, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ハ", "theme": "温度式冷却水調整弁の応答性", "question": "冷却水調整弁には、凝縮圧力または凝縮温度を検知して作動するものがある。温度式冷却水調整弁の特徴は、圧力式に比べて、一般的に弁の応答が速く、冷媒側と絶縁されて安全性が高く、調整弁の交換が容易なことである。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "温度式は感温筒と水との伝熱を介するため「圧力式に比べて弁の応答が遅く（緩やか）」である（「応答が速く」は誤り）。"}, {"id": 812, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ニ", "theme": "吸入圧力調整弁（SPR）による過負荷防止", "question": "ホットガスデフロスト後や長期間停止後に始動する場合などに予期しない圧縮機吸込み圧力の上昇があると、圧縮機用電動機が過負荷になる危険がある。吸入圧力調整弁はこれらの問題に対処するために、圧縮機吸込み圧力を一定値以上に上昇させないように制御する。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "デフロスト後やホットスタート時の高負荷蒸気圧力を絞って圧縮機吸込み圧力を設定値以下に抑え、モータの過負荷トリップや焼損を防止する。"}, {"id": 813, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "イ", "theme": "圧力式断水リレーとフロースイッチ", "question": "圧力式断水リレーは冷却水出入口間の差圧の変化を検出し、その信号で警報を発し、圧縮機を停止させる。圧力降下の少ない流路にはフロースイッチと呼ばれる流量式を用いる。フロースイッチは、圧力降下が不明でも、水圧がどうであっても自由に選択できる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "配管圧力損失が小さい冷却水路では差圧検知が難しいためパドル式等のフロースイッチ（流量式）が選定される。"}, {"id": 814, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ロ", "theme": "油圧保護圧力スイッチの作動時間", "question": "油圧保護圧力スイッチは、圧縮機の軸受などが油の潤滑不良により焼付き事故を起こすことを防止するための保護装置である。圧縮機の運転中に給油圧力が定められた圧力を一定時間以上保持できない場合には、圧力スイッチの電気接点を「開」にして圧縮機を停止させる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "差圧給油圧力が設定値以下に低下した状態が約90秒継続した場合にヒータ作動で接点を開き、圧縮機を停止させて軸受焼付きを防ぐ。"}, {"id": 815, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ハ", "theme": "ガスチャージ式サーモスタットの特性", "question": "ガスチャージ方式の蒸気圧式サーモスタットは、最高使用温度で感温筒に封入した媒体のすべてが気化し終わるように制限チャージしたものであり、感温筒内の液量が少ないために応答が速く、主に低温用に使われている。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "制限チャージにより最高設定温度で液が全気化するため過大圧力を防ぎ応答が速い。感温筒内が受圧部より低温となる低温制御に適する。"}, {"id": 816, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ニ", "theme": "フロート弁の液面変動幅", "question": "フロート弁は液面レベルの上下変動に対する対応が遅く、フロートスイッチに手動膨張弁と電磁弁とを組み合わせた場合よりも、液面レベルの変動が大きくなるが、電気配線が不要で、配管も簡単であり、保守が容易であるという利点がある。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "フロート弁は液面変化に比例して直接連続給液するため、オンオフ動作するフロートスイッチ＋電磁弁よりも「液面レベルの変動を小さく（滑らかに）」できる（変動が大きくなるは誤り）。"}, {"id": 817, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "イ", "theme": "油分離器の必要用途", "question": "油分離器を必要とする冷凍装置は、冷凍機油が装置内の凝縮器や蒸発器に入り込むと伝熱作用を阻害する装置、低温で油の粘度が高くなり蒸発器からの油戻しが難しい装置、油が冷媒系統を循環して圧縮機に戻ってくるまでに時間がかかる装置などである。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "アンモニア装置、蒸発温度-40℃以下の極低温装置、長配管・多台数系統などで油分離器の設置が要求される。"}, {"id": 818, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ロ", "theme": "高圧受液器の容量設計", "question": "高圧受液器には、運転中の大きな負荷変動、冷却器の運転台数の変化、ヒートポンプ装置の運転モードの切換え、空冷凝縮器での寝込みなどによる冷媒量の変化を吸収する容積をもたせ、さらに冷媒充てん量の全量または大部分の量を受液器容量の80%以内で回収できる容量をもたせる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "運転時の系統内液量変動の吸収と、ポンプダウン回収時に受液器内容積の80%以内に全冷媒を安全に収容できる容量が必要。"}, {"id": 819, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ハ", "theme": "アンモニア装置の乾燥器使用", "question": "フルオロカーボン冷凍装置では、シリカゲルやゼオライトの乾燥剤を用いて冷媒系統の水分を吸着除去する。アンモニア冷凍装置でも、一般的に同様の乾燥剤を用いて水分を除去する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニアは水分と極めて強く溶解結合（アンモニア水化）するため吸着乾燥剤が機能せず、アンモニア装置にろ過乾燥器は使用しない（同様の乾燥剤を用いて水分除去は誤り）。"}, {"id": 820, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ニ", "theme": "低圧受液器の気相空間の重要性", "question": "一般的な低圧受液器は、液ポンプにより冷媒液を冷却器に送り出すための液位が確保されていれば、上部の冷媒蒸気の空間の大きさには関係なく、低圧受液器のある冷凍装置は安定して運転できる。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器は液分離器を兼ねており、上部気相空間が狭いと冷媒蒸気流速が上がり液滴を圧縮機に巻き込む（液戻り）ため、「上部気相空間の大きさも極めて重要」である（関係なく安定運転できるは誤り）。"}, {"id": 821, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア冷凍装置の液ガス熱交換器", "question": "フルオロカーボン冷凍装置では、液配管が長い場合や液配管の立ち上がりが高いときの対策として、液ガス熱交換器で高温液と低温蒸気とを熱交換し、高温液に適度な過冷却度をもたせる方法がある。アンモニア冷凍装置でも、液ガス熱交換器は同様の目的で一般的に用いられる。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニア冷凍装置では吸込み過熱による吐出しガス温度上昇が激しく油炭化等を招くため、「液ガス熱交換器は使用しない」（一般的に用いられるは誤り）。"}, {"id": 822, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ロ", "theme": "小形アキュムレータのU字管機構", "question": "小形のフルオロカーボン冷凍装置に用いられるU字管を内蔵した液分離器では、入口から入った液滴を含んだ冷媒蒸気は、流れ方向の変化と速度の低下によって、液と蒸気に分離される。分離された容器底部の油と冷媒液は、U字管底部にあけられた小さな孔から、少量ずつ圧縮機へ吸い込まれる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "重力・遠心分離で気液を分け、U字管底部のメタリングオリフィス（小孔）から油と微量冷媒液を吸気流に乗せて少しずつ圧縮機へ返油する。"}, {"id": 823, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ハ", "theme": "不凝縮ガス分離器の必要圧力条件", "question": "不凝縮ガス分離器は、おもに大形冷凍装置に用いられ、低圧側の運転圧力が大気圧以上の装置より大気圧以下で運転する装置のほうが設置の必要性は高い。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "蒸発圧力が大気圧以下（真空域）となる低温冷凍装置では軸封部や配管継手から空気が機内へ吸い込まれやすいため、不凝縮ガスパージャーの必要性が特に高い。"}, {"id": 824, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ニ", "theme": "強制循環蒸発器の油戻し配管", "question": "冷媒液強制循環式蒸発器では、一般に液ポンプにより蒸発量の3〜5倍の冷媒量を流す。また、冷凍機油の処理を行うために、一般的に、蒸発器本体に油戻し用の配管を設ける。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "強制循環式では油は冷媒液とともに低圧受液器に戻るため、蒸発器本体に油戻し配管を設けるのは「満液式蒸発器」である（誤り）。油処理は低圧受液器まわりで行う。"}, {"id": 825, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "イ", "theme": "圧縮機・凝縮器同高時の吐出し管勾配", "question": "圧縮機と凝縮器が同じ高さに設置されている場合、圧縮機から凝縮器への吐出しガス配管は、圧縮機からいったん立ち上がり管を設けて、凝縮器へ上り勾配で配管する。これは停止中に吐出しガス配管内の油が圧縮機へ戻りやすくするためである。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "停止中に吐出し配管内の油や凝縮液が圧縮機ヘッドに逆流するのを防ぐため、立ち上げた後は凝縮器に向かって「下り勾配」で配管する（「上り勾配」は誤り）。"}, {"id": 826, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ロ", "theme": "異高多台数蒸発器の吸込み配管施工", "question": "2台以上のフィンコイル乾式蒸発器が異なった高さに設置されている場合には、それぞれの蒸発器出口の吸込み蒸気配管はトラップを設けてから蒸発器の上部まで立ち上げる。その後、吸込み蒸気配管の主管への接続は、主管の上部から行う。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "停止中の蒸発器への油や液の逆流流入を防ぐため、出口にトラップを設けて蒸発器上部まで立ち上げ、主管へは上面（上部）から合流接続する。"}, {"id": 827, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ハ", "theme": "銅管ろう付けのはまり込み隙間", "question": "銅管の接続に用いるろう付けは、はまり込み深さと隙間が重要であり、外径25mm未満の銅管であれば、ろうを流し込むためにゆったりとした隙間が必要で、管の外径と継手の内径との隙間は1mm程度である。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "ろう付けは毛細管現象を利用して溶ろうを吸入浸透させるため、隙間は「0.05〜0.35 mm程度（非常に狭い隙間）」とする（「1 mm程度」は広すぎて毛細管現象が働かず不健全となるため誤り）。"}, {"id": 828, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ニ", "theme": "サービスバルブの構造と用途", "question": "サービスバルブは、バックシート（逆座）とサービスポートをもった止め弁であり、圧力計の取付け、気密試験のためのガス充てん、冷媒の補充などに用いられる。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "全開位置で弁棒パッキン部をシールするバックシート構造を持ち、サービスポートを利用して圧力測定や冷媒充填・真空引き作業を行う。"}, {"id": 829, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "イ", "theme": "高圧遮断スイッチの自動復帰許容範囲", "question": "高圧遮断圧力スイッチは原則として手動復帰形とするが、毒性ガス以外の冷媒を用いた自動運転方式の冷凍装置では自動復帰形を用いてもよい。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "自動復帰形が認められるのは「可燃性・毒性以外の冷媒で、冷凍能力10トン未満のユニット式設備等」に限られており、「毒性ガス以外であればすべて自動復帰でよい」わけではない（誤り）。"}, {"id": 830, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ロ", "theme": "圧縮機用と容器用安全弁の最小口径式", "question": "冷凍装置に用いられる安全弁の必要最小口径は、圧縮機用では冷媒ガスの種類と圧縮機のピストン押しのけ量など、圧力容器用では冷媒ガスの種類と圧力容器の外径、全長などによりそれぞれ決定する。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "圧縮機用は d = C1 * sqrt(V1) （押しのけ量基準）、圧力容器用は d = C3 * sqrt(D * L) （容器受熱外表面積基準）により最小口径を決定する。"}, {"id": 831, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ハ", "theme": "溶栓と破裂板の作動原理の差異", "question": "圧力容器に取り付ける溶栓の口径は取り付けるべき安全弁の口径の1/2以上、破裂板の口径は取り付けるべき安全弁の口径と同一であり、どちらも圧力容器の温度により作動する。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "溶栓は所定の「温度」で合金が溶融して作動するが、破裂板は金属薄板が所定の「圧力」で破れる安全装置である（「どちらも温度により作動」は誤り）。"}, {"id": 832, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ニ", "theme": "低圧受液器への溶栓使用制限", "question": "液封事故を起こしやすい二段圧縮冷凍装置の過冷却液管や冷媒液強制循環式冷凍装置の低圧受液器には、安全弁または溶栓を設けなければならない。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "液封は温度上昇に伴う圧力上昇破壊であるため「安全弁、破裂板または圧力逃がし装置」を取り付ける。火災受熱保護用の「溶栓」を液封防止安全弁の代用として低圧受液器等に設けることは認められない（誤り）。"}, {"id": 833, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "イ", "theme": "試験圧力の銘板表示（ゲージ圧力）", "question": "耐圧試験と気密試験を実施した圧力は保安上重要な事項であり、被試験品本体の銘板や刻印に絶対圧力で表示しなければならない。耐圧試験は実際の使用状態での耐圧性能が満足な状態にあることを確認し、気密試験は組み立て品および配管が完了した設備において気密を確認するために行う。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "銘板や刻印に表示すべき試験圧力は「ゲージ圧力（MPaG）」である（「絶対圧力」は誤り）。試験目的の記述自体は正しい。"}, {"id": 834, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ロ", "theme": "液体耐圧試験の手順と8/10降圧検査", "question": "耐圧試験を液体で行う場合には、被試験品に液体を満たし、空気を完全に排除した後、圧力を耐圧試験圧力まで上げて、その試験圧力を1分間以上保っておく。その後、圧力を耐圧試験圧力の8/10まで降下させ、異常がないことを確認する。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "液体耐圧は耐圧圧力で1分間保持後、8/10の圧力まで降圧して溶接部・ガスケット・本体の漏れや変形・破壊の有無を検査する。"}, {"id": 835, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ハ", "theme": "機器組み立て品のガス気密試験", "question": "冷媒設備の配管を除く構成機器の個々の組み立て品について行う気密試験は、耐圧強度が確認された機器について、漏れの確認が容易にできるようにガス圧試験で行う。試験に使用するガスは空気または不燃性、非毒性ガスを用いる。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "耐圧試験合格後の機器に対し、空気や窒素等の不燃性・非毒性ガスによるガス圧試験で微小漏れを検査する（酸素等の支燃性・可燃性ガスは禁止）。"}, {"id": 836, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ニ", "theme": "真空試験の漏れ特定限界", "question": "真空試験において装置内に水分が存在すると、真空ポンプを止めた際に圧力が上昇してしまうため、十分に時間をかけて冷凍装置内部の水分を排出させる必要がある。微少な漏れの漏れ箇所を特定するためには、気密試験より真空放置試験が適している。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "真空放置試験は全体系での漏れの有無判定には極めて有効だが、「漏れ箇所の特定はできない」。漏れ箇所の特定には発泡液や検知器を用いる気密加圧試験が適している（誤り）。"}, {"id": 837, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "イ", "theme": "冷蔵倉庫床下の凍上現象と対策", "question": "凍上は、1階の冷蔵室床下の土壌が氷結して体積が膨張し、床面が盛り上がる現象である。床下の構造や土壌の性質は凍上の発生に大きく影響するが、床の防熱材を十分に厚くしても凍上防止策にならない。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "長期間低温を維持すると防熱層を貫通して地盤温度が0℃以下となり地下水が凍結膨張して床を隆起させる。防熱材の増厚だけでは防げず、高床式（通気空間）やヒータ埋設などの積極的凍上防止策が不可欠。"}, {"id": 838, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ロ", "theme": "蒸発式凝縮器の耐震固定", "question": "屋外に設置する空冷凝縮器と蒸発式凝縮器は重く、重心も比較的高い。このため、地震によって据付け位置がずれることがあるので注意が必要である。したがって、設置する基礎の鉄筋を強固に組み合わせ、床盤の鉄筋に固く結び付け、また凝縮器本体と基礎も十分に固定する必要がある。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "重量が大きく重心が高い屋外機器は、地震時の転倒や位置ズレによる接続冷媒配管破断を防ぐため、スラブ鉄筋直結基礎と十分なアンカーボルト固定を行う。"}, {"id": 839, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ハ", "theme": "試運転開始前の点検項目とデータ採取", "question": "冷凍装置の試運転を行う場合、試運転開始前に電力系統、制御系統、冷却水系統、冷媒系統の冷媒量、冷凍機油量、弁の開閉状態などを点検することが必要である。これらの点検の後、装置の始動試験を行い、異常がなければ数時間運転を継続し、運転データを採取する。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "配線・油量・冷媒量・弁開閉の事前点検を完了した上で始動し、数時間の安定連続運転を行って各部温度・圧力データを記録確認する。"}, {"id": 840, "subject": "保安管理技術", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ニ", "theme": "アンモニアの燃焼性と防爆除外理由", "question": "アンモニアは毒性があり、多量に浴びると死に至る危険がある。一方、燃焼性はなく、アンモニアを冷媒とする冷凍装置において、電気設備に対して防爆性能を必要としない。", "answer": "×", "law": "上級テキスト 冷媒編", "explanation": "アンモニアの爆発限界は15〜28%であり「可燃性ガス」である（「燃焼性はなく」は誤り）。下限界が15%と比較的高いため冷凍保安規則上防爆構造が免除されているにすぎない。"}, {"id": 841, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の構造（フルオロカーボンとアンモニア）", "question": "フルオロカーボン圧縮機は、電動機巻線に適切な絶縁材料を用いることで電動機を冷媒蒸気の充満したケーシング内に収めることが可能である。アンモニア圧縮機では、冷媒が電動機の銅巻線を侵すので、一般的な銅巻線の電動機を使用する場合は、開放形が使用されている。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "フルオロカーボンは絶縁性が高く密閉形が可能。アンモニアは銅を激しく腐食するため、一般的な銅巻線電動機では開放形が使用される。"}, {"id": 842, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "ロ", "theme": "スクリュー圧縮機の容量制御とCOP", "question": "スクリュー圧縮機は、スライド弁によってある限定された範囲内で容量を無段階で制御できる。このスライド弁により吸込み蒸気の閉込み量を減らした低容量で長時間運転すると、成績係数は低下する。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "スライド弁により無段階制御が可能。閉込み量を減らすと内部圧縮比が低下し断熱効率が落ちるため、低容量での長時間運転は成績係数（COP）が低下する。"}, {"id": 843, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "ハ", "theme": "スクロール圧縮機の分類", "question": "スクロール圧縮機は吸込み弁と吐出し弁を必要としないが、停止時に高低圧の差圧で圧縮機の旋回スクロールが逆回転するので、逆転防止機能が必要である。また、トルク変動が非常に小さいので、振動や騒音が小さく体積効率、断熱効率および機械効率がいずれも高く、高速回転に適している遠心圧縮機の一種である。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "スクロール圧縮機は「容積式圧縮機」の一種であり、「遠心圧縮機の一種」とする記述が誤り。"}, {"id": 844, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "ニ", "theme": "遠心圧縮機のサージングと多段化", "question": "遠心圧縮機の容量制御を吸込み側にあるサクションベーンによって行う場合、低流量になるとサージング現象が発生し、振動や騒音を発生する。また、低温用では圧力比が大きくなるので、羽根車の段数は多段式となる。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "低流量域での流れ剥離によるサージング発生、および低温用途での圧力比増大に伴う多段羽根車の採用はいずれも遠心圧縮機の基本特性である。"}, {"id": 845, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "イ", "theme": "多気筒往復機のアンローダ機構", "question": "多気筒圧縮機には、一般にアンローダと呼ばれる容量制御装置が取り付けてあり、吸込み弁を閉めきって、作動気筒数を減らすことにより、25%から100%の範囲で容量を段階的に変えられるようになっている。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "アンローダ機構は吸込み弁を強制的に「開放（押し下げ）」して圧縮作用を失わせるものであり、「吸込み弁を閉めきって」とする記述は誤り。"}, {"id": 846, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "ロ", "theme": "インバータ制御と体積効率", "question": "インバータを用いて圧縮機の回転速度を調整する容量制御方法では、圧縮機の回転速度と容量はつねに比例する。回転速度の範囲を大きく増減させた場合にも、体積効率は回転速度に依存せずつねに一定である。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "回転速度を大きく変えると、低速域では漏れ割合の増大、高速域では弁通過抵抗の増大によって体積効率が低下し、常に一定・常に比例ではないため誤り。"}, {"id": 847, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "ハ", "theme": "蒸発圧力調整弁（EPR）の取付位置", "question": "圧縮機の吸込み蒸気配管に蒸発圧力調整弁を取り付けることによって、この弁の作動時には圧縮機の吸込み圧力が所定の圧力より低下し、圧縮機の容量制御ができる。この蒸発圧力調整弁は、温度自動膨張弁の感温筒と均圧管取付け位置よりも下流側の圧縮機吸込み蒸気配管に取り付けなければならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "EPRは蒸発圧力を一定値以上に保つために吸気圧力を絞る。感温筒や均圧管の正常作動を妨げないよう、必ずそれらの「下流側」に設置する。"}, {"id": 848, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "ニ", "theme": "ホットガスバイパスによる凝縮圧力過度低下", "question": "ホットガスバイパスによる容量制御を行うときに、ホットガスバイパス量の割合が多くなると、凝縮器の熱負荷がほとんど電動機の入力だけとなり、凝縮圧力が低くなりすぎる。その場合、ホットガス圧力が低くなりすぎて必要量のホットガスが吸込み側にバイパスできなくなる。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "バイパス比率過大時は蒸発器からの熱流入がなく凝縮負荷が電動機入力のみとなり凝縮圧力が異常低下する。差圧不足でバイパス流量が維持できなくなるため凝縮圧力制御が必須となる。"}, {"id": 849, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "イ", "theme": "弁漏れによる影響", "question": "往復圧縮機の吸込み弁に弁板の割れや変形が生じると、ピストンの圧縮行程でシリンダ内の高圧ガスの一部が吸込み側に逆流し、圧縮機の吐出しガス量が減少するので体積効率の低下を招くが、吐出しガス温度はあまり大きく上昇することはない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吸込み弁漏れは吸込み側への逆流により体積効率が激減するが、吐出し弁漏れのように高温吐出しガスが再圧縮されるわけではないため、吐出し温度上昇は小さい。"}, {"id": 850, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "ロ", "theme": "油圧保護圧力スイッチの作動条件", "question": "中形や大形の往復圧縮機では、油ポンプによる強制給油潤滑式が採用されており、油圧が高くなりすぎると油圧保護圧力スイッチが作動して、圧縮機が停止する。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "油圧保護圧力スイッチ（OPS）は油圧が「低くなりすぎたとき（油量不足・フィルタ詰まり等）」に軸受焼付きを防ぐため作動する（高くなりすぎると作動は誤り）。"}, {"id": 851, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "ハ", "theme": "スクリュー圧縮機の通常吐出し温度", "question": "スクリュー圧縮機の給油圧力は、油ポンプが付いている場合には吐出しガス圧力よりも0.2 MPaから0.3 MPa程度高くする。また、スクリュー圧縮機の吐出しガス温度は、多気筒圧縮機のそれよりも低く、冷媒の種類にもよるが通常120℃程度である。吐出しガス温度がこれより高い場合には、油量不足、油温が高い、吸込み蒸気の過熱などが考えられる。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "スクリュー圧縮機の吐出しガス温度は油冷却効果により通常「80〜90℃以下」であり、「通常120℃程度」とする記述は過大で誤り。"}, {"id": 852, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "ニ", "theme": "冷媒過充填とサイトグラス", "question": "冷媒を過充てんして運転すると、膨張弁手前のサイトグラスに気泡が発生し、高圧部圧力が高くなる。そのため、保安の点からも冷媒の過充てんは行ってはならない。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "サイトグラスに気泡（フラッシング）が発生するのは「冷媒充填量不足」の時である（過充てん時とする記述は誤り）。"}, {"id": 853, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "イ", "theme": "水あか付着による熱通過率低下割合", "question": "水あかや油膜が水冷横形シェルアンドチューブ凝縮器の冷却管に付着すると、それらの熱伝導抵抗によって熱通過率の値が小さくなる。そのため圧縮機の消費電力は増加し、冷凍能力は減少する。冷却管が裸管の場合よりもローフィンチューブのほうが、水あかが厚く付着することによる熱通過率の低下割合が大きい。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "ローフィンチューブは外表面積が内表面積の約3.5〜4.2倍あるため、内面水あかの熱抵抗が外表面基準熱通過率に大きく影響し、裸管よりも熱通過率の低下割合が大きい。"}, {"id": 854, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "ロ", "theme": "各種凝縮器の所要伝熱面積", "question": "凝縮器の外表面基準の伝熱面積は一般的に1冷却トン（16330 kJ/h）当たり、蒸発式凝縮器が0.9m2から1.2m2、二重管水冷凝縮器が2.0m2から2.4m2、強制通風式の空冷凝縮器が10m2から15m2である。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "1冷却トン当たりの外表面積は、二重管水冷凝縮器が約0.9〜1.2 m2、蒸発式凝縮器が約2.0〜2.4 m2であり、数値が逆に記述されているため誤り。"}, {"id": 855, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "ハ", "theme": "空冷凝縮器の冬季風量制御", "question": "空冷凝縮器の凝縮圧力は、一般に凝縮器入口空気温度よりも15Kから20K位高い温度に相当する飽和圧力とする。冬季に外気温度が低下して膨張弁容量が不足するときの対策として、空冷凝縮器の送風機の風量を増加させる方法、小容量の冷凍装置では凝縮圧力調整弁により凝縮圧力が高くならないように制御する方法などがある。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "冬季の凝縮圧力低下対策としては、送風機の風量を「減少」させる方法、凝縮圧力が「低くならないように（維持する）」制御する方法をとるため誤り。"}, {"id": 856, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "ニ", "theme": "不凝縮ガス混入時の伝熱悪化", "question": "凝縮器内の冷媒側に空気などの不凝縮ガスが混入すると、冷却管の冷媒側の熱伝達率が小さくなり、凝縮温度が高くなる。そのため、圧縮機の吐出しガスの圧力と温度が高くなり、圧縮機用電動機の消費電力が増加し、冷凍能力と成績係数が低下する。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "不凝縮ガスが伝熱面に混合気境界層を形成して冷媒側熱伝達率を激減させ、凝縮圧力・温度の上昇、消費電力増大、COP低下を招く。"}, {"id": 857, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "イ", "theme": "液圧縮発生時の緊急処置手順", "question": "圧縮機が液圧縮していると判断したときには、急を要するので、吸込み止め弁を絞り、液戻りが激しいときには吸込み止め弁をいったん閉じてもよい。そして、蒸発器への液供給量を減らすために膨張弁や膨張弁の上流側止め弁などの調節または閉止などを行い、液圧縮を回避して、運転状況を見ながら吸込み止め弁を徐々に開き、正常な運転状態に近づけていく。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "液圧縮音等の異常発生時は、直ちに吸込み弁を絞り（全閉可）、膨張弁を閉止・調整して液流入を断ち、安定を確認しながら徐々に開弁復帰させる。"}, {"id": 858, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "ロ", "theme": "乾式と満液式の水・ブライン凍結破損リスク", "question": "乾式シェルアンドチューブ蒸発器と満液式シェルアンドチューブ蒸発器では、蒸発温度が低下して、冷却用の水やブラインが凍結した場合、冷却管の破損の危険性は乾式シェルアンドチューブ蒸発器のほうが大きい。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "管内を水が流れる満液式は凍結時に管を外側へ破裂させやすいが、乾式は管外（胴側）が水のため凍結膨張の逃げ場があり破損リスクは小さい（「乾式のほうが大きい」は誤り）。"}, {"id": 859, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "ハ", "theme": "蒸発器着霜時の能力低下", "question": "フィンコイル乾式蒸発器に霜が厚く成長すると、空気の流れ抵抗の増加や蒸発器熱通過率の低下にともない蒸発器への冷媒供給量が減少し、低圧側圧力が正常値よりも低下する。このため、冷却能力は大きく低下する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "通風抵抗の増大（風量減）と霜層の熱抵抗増大により蒸発温度・圧力が低下し、冷媒循環量と冷却能力が大きく落ち込む。"}, {"id": 860, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "ニ", "theme": "感温筒の取付位置（液溜まり部禁止）", "question": "低温装置における温度自動膨張弁の感温筒は、霜の影響を受けないように吸湿性のないもので感温筒取付け部とともに防熱する。また、正しい冷媒液温度を検出できるように冷却コイルや吸込み蒸発配管のヘッダーなどの液のたまりやすい所に取り付ける。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "感温筒を液の溜まりやすいヘッダーやトラップ近傍に取り付けると、滞留液の温度を拾って過熱度を誤検知しハンチング等の誤作動を起こすため「取り付けてはならない」（誤り）。"}, {"id": 861, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "イ", "theme": "向流と並流の平均温度差比較", "question": "フィンコイル乾式蒸発器では、蒸発器の冷媒出口側から入口側に向かって冷却しようとする空気を流す向流方式と、蒸発器の冷媒入口側から出口側に向かって空気を流す並流方式がある。一般的に並流方式の冷媒と空気との平均温度差は、向流方式よりも大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "並流方式の平均温度差は向流方式よりも「小さく」なり伝熱上有利ではない（「大きくなる」は誤り）。"}, {"id": 862, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "ロ", "theme": "フィンコイル蒸発器の熱流束と熱通過率", "question": "空気冷却用のフィンコイル乾式蒸発器は、冷媒と空気との平均温度差が大きくなれば、蒸発器能力は増大する。蒸発器能力が増して熱流束が大きくなると、冷媒側熱伝達率は大きくなるが、空気側の熱伝達抵抗が大きいために熱通過率の値はあまり大きくならない。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "冷媒側熱伝達率は沸騰活発化で向上するが、全熱抵抗の大半を占める空気側熱抵抗が風速一定で変わらないため、熱通過率K全体はあまり大きくならない。"}, {"id": 863, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "ハ", "theme": "汚れ係数増加時の熱通過率低下特性", "question": "ローフィンチューブを用いる水冷凝縮器や満液式水冷却器では、汚れ係数の増大とともに冷却管の外表面積基準の熱通過率は減少する。また、汚れ係数の増大とともに熱通過率の減少割合は大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "熱通過率は汚れ係数の「小さい範囲で急激に大幅低下」し、汚れ係数が大きくなると減少割合は緩やかになる（「減少割合は大きくなる」は誤り）。"}, {"id": 864, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "ニ", "theme": "フルオロカーボン冷媒液の油溶解影響", "question": "フルオロカーボン冷媒液は油を溶解すると粘度が高くなる。そのため、過度に油を溶解すると伝熱を阻害することになる。一般に、油の溶解量が3%以下であれば特に支障がない。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "油溶解により冷媒液粘度が増加し伝熱が阻害される。一般に油濃度3%以下であれば実用上問題ない。"}, {"id": 865, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "イ", "theme": "クロスチャージ方式の過熱度特性", "question": "感温筒のクロスチャージ方式は、冷凍装置の冷媒に対して温度と圧力の特性が異なる媒体を、感温筒にチャージしたものである。この方式の特徴は、液チャージ方式などの使用する蒸発温度域によって過熱度が変わる欠点を除いたことにより、蒸発温度が高温でも低温でも、ほぼ同じ過熱度設定値が保持できることである。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "異種媒体の特性曲線をクロスさせることで、広い蒸発温度域にわたってほぼ一定の過熱度制御を可能にする。"}, {"id": 866, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "ロ", "theme": "内部均圧形膨張弁の圧力降下と過熱度", "question": "内部均圧形の温度自動膨張弁を用いると、過熱度に及ぼす蒸発器内冷媒の圧力降下の影響が大きく、圧力降下分だけ過熱度が小さくなる。この圧力降下の影響を除くには、外部均圧形の温度自動膨張弁を用いる。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "内部均圧形では蒸発器入口圧力を基準とするため、器内圧力降下分だけ出口での実際の過熱度は設定値より「大きく（増大）」なる（「小さくなる」は誤り）。"}, {"id": 867, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "ハ", "theme": "感温筒の垂直管取付姿勢", "question": "感温筒は、蒸発器出口の配管部に金属バンドで密着させて取り付ける。また、感温筒は、冷却器の風や周囲の温度の影響などを受けないようにする。感温筒を垂直吸込み管に取り付けるときは、感温筒のキャピラリーチューブを上側になるように設置する。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "垂直吸込み管への取付時は、内部の液がキャピラリ側へ抜け出さないようキャピラリチューブを上向きにして設置する。"}, {"id": 868, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁ダイアフラム下面の作用圧力", "question": "温度自動膨張弁のダイヤフラム上面には、感温筒のチャージ媒体の圧力が作用している。また、ダイアフラム下面には、蒸発器の出口（内部均圧形）、または、蒸発器の入口（外部均圧形）の冷媒圧力とばね圧力が作用している。これらのダイアフラム上下面の圧力の釣り合いによって膨張弁の弁開度が決まる。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "ダイアフラム下面に作用するのは「蒸発器入口圧力（内部均圧形）」または「蒸発器出口圧力（外部均圧形）」であり、記述が逆になっているため誤り。"}, {"id": 869, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "イ", "theme": "蒸発圧力調整弁（EPR）の機能", "question": "蒸発圧力調整弁はEPRとも呼ばれ、温度自動膨張弁では、蒸発圧力を一定値以下にならないように制御することはできないが、蒸発圧力調整弁を使用すれば、蒸発圧力を一定値以下にならないように制御できる。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "EPRは蒸発器内の冷媒圧力が設定値以下に下がるのを防ぎ、ブライン凍結防止や除湿過多防止、異温度蒸発器の多重運転等に用いられる。"}, {"id": 870, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "ロ", "theme": "吸入圧力調整弁（SPR）の機能", "question": "吸入圧力調整弁はSPRとも呼ばれ、圧縮機用電動機の過負荷の問題に対処するために、圧縮機吸込み圧力を一定値以上に上昇させないように制御する圧力調整弁であり、圧縮機吸込み蒸気配管に取り付けられる。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "クランクケース圧力が設定値以上に上がらないよう吸込み蒸気を絞り、モータの過負荷トリップ・焼損を防止する。"}, {"id": 871, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "ハ", "theme": "凝縮圧力調整弁（CPR）の制御媒体", "question": "凝縮圧力調整弁による凝縮圧力の制御は、凝縮器内への冷媒液の滞留と冷却水量の調整を同時に行う。したがって、装置の冷媒充てん量に余裕が必要であるので、受液器が必要になる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "凝縮圧力調整弁（CPR）は空冷凝縮器内に冷媒液を滞留させて伝熱面積を減らす弁であり、「冷却水量の調整」を行う弁ではない（誤り）。"}, {"id": 872, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "ニ", "theme": "冷却水調整弁の目的", "question": "冷却水調整弁は、制水弁または節水弁とも呼ばれており、年間を通じて水温の変化、装置の凝縮負荷の変化、冷却管の水あかの付着などに対して、凝縮圧力が適正な状態を保つように冷却水量を調節する。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "水温や負荷変動に応じて水量を加減し、適切な凝縮圧力を保つとともに冷却水使用量を節約する。"}, {"id": 873, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "イ", "theme": "四方切換弁の差圧作動要件", "question": "四方切換弁は、冷媒の流れを切り換えて冷凍サイクルの二つの熱交換器の役割を逆にする働きをもつ。この弁は、切換え時に高圧側から低圧側への冷媒の漏れが短時間で起こるので、差圧式の四方切換弁では高低圧間に圧力差が十分にないと完全な切換えができない。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "ヒートポンプ等に用いられる差圧式四方弁は、弁ピストンを動かすために高低圧間の十分な作動差圧が必要とされる。"}, {"id": 874, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "ロ", "theme": "電子式サーモスタットのPID制御", "question": "電子式サーモスタットは、温度変化を電気信号に変換しているので、電子回路にPIまたはPIDの補償をした制御を行うことができる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "測温抵抗体等のアナログ信号をマイコン・演算回路で処理できるため、高精度なPI/PID補償制御や通信連携が可能。"}, {"id": 875, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "ハ", "theme": "油圧保護圧力スイッチの作動遅延", "question": "多気筒圧縮機などの大形圧縮機では、油ポンプを内蔵または外部に装着している。運転中に定められた油圧が保持できなくなると、圧縮機の軸受などが焼付き事故を起こすことがある。このような事故を防止するために、圧縮機を始動してから、または運転中に給油圧力が定められた圧力以下になった場合には、圧力が低下した瞬間に油圧保護圧力スイッチの電気接点を開にして圧縮機の電動機を停止させる。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "始動時の油圧立ち上がり待ちや一時的油圧変動での誤トリップを防ぐため、「瞬時」ではなく約90秒（60〜120秒）の遅延時間を持たせて作動する（「低下した瞬間に」は誤り）。"}, {"id": 876, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "ニ", "theme": "低圧スイッチのディファレンシャル過小", "question": "低圧圧力スイッチを用い、圧縮機の運転と停止を制御する場合、低圧圧力スイッチの「入り」「切り」差をあまり小さく設定すると、圧縮機が短い間隔で運転と停止を繰り返すことになり、圧縮機用電動機焼損の原因となることがある。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "ディファレンシャル（入切差）が小さすぎると頻繁な発停（インチング）を繰り返し、始動電流によるモータ過熱焼損を招く。"}, {"id": 877, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "イ", "theme": "アンモニア鉱油使用時の油分離器義務", "question": "鉱油を冷凍機油として使用するアンモニア冷凍装置では、冷凍機油が装置内の凝縮器や蒸発器に流入すると伝熱作用を阻害するので、圧縮機の吐出し側に油分離器を設ける必要がある。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "非相溶の鉱油は熱交換器に滞留して著しく伝熱を妨げるため、吐出し配管に油分離器を設けて油を捕集・排出する。"}, {"id": 878, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "ロ", "theme": "高圧受液器のガス空間", "question": "高圧受液器の容量は、修理時に装置内の冷媒充てん量の大部分を回収できる容量とし、回収された冷媒は、一般的に受液器の内容積の95%以内とし、少なくとも5%の冷媒蒸気空間を残さなくてはならない。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "受液器に全冷媒を回収する際、安全のため受液器内容積の「80%以内」とし、少なくとも「20%以上のガス空間」を保持しなければならない（95%/5%は誤り）。"}, {"id": 879, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "ハ", "theme": "バッフル式油分離器の構造", "question": "バッフル式油分離器は、容器内に円筒状の金網が2重、3重に配置され、圧縮機からの吐出しガスがこの金網を通過する際に、金網によって油を分離する方式で、フルオロカーボン冷媒用は、フロート弁により油を自動的に圧縮機クランクケースに返油する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "金網を通過させて油を分離するのは「金網式」である。バッフル式は傾斜した多数小孔のバッフル板に衝突させて油滴を分離する（誤り）。"}, {"id": 880, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "ニ", "theme": "フィルタドライヤ用乾燥剤の特性", "question": "フルオロカーボン冷媒を使用する冷凍装置のフィルタドライヤ用乾燥剤としては、シリカゲル、活性アルミナ、ゼオライトなどがよく用いられる。これらの特徴として、水分を吸着しても化学変化しないこと、砕けにくいことが挙げられる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "シリカゲル、ゼオライト等は水分を物理吸着し、化学変化せず粉化しにくい特性を持つ。"}, {"id": 881, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "イ", "theme": "液ガス熱交換器の過冷却・過熱作用", "question": "フルオロカーボン冷凍装置に用いられる液ガス熱交換器は、凝縮器からの高温冷媒液と蒸発器からの低温冷媒蒸気との熱交換により、凝縮器からの冷媒液を過冷却して、液管内でのフラッシュガスの発生を防止するとともに、圧縮機吸込み蒸気を適度に過熱することにより、負荷変動などによる液戻りをある程度防止する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "液過冷却によりフラッシュガスを防止し、吸込み過熱により液戻り・湿り運転を防止する。"}, {"id": 882, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "ロ", "theme": "アンモニア用ガスパージャの冷媒同伴", "question": "大形のアンモニア冷凍装置で使用される不凝縮ガス分離器（ガスパージャ）では、不凝縮ガスがたまるとフロート弁が自動的に開き、不凝縮ガスが器外に排出される。この不凝縮ガス分離器では、冷凍装置の運転を停止せずに、アンモニアを排出することなく不凝縮ガスだけを排出できる。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "パージ時には微量のアンモニアガスも同伴して排出されるため、水槽等を通す除害設備を介して排出する（「アンモニアを排出することなく不凝縮ガスだけ排出できる」は誤り）。"}, {"id": 883, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "ハ", "theme": "満液式蒸発器の油回収器", "question": "フルオロカーボン冷凍装置の満液式蒸発器や低圧受液器に入り込んだ冷凍機油は冷媒液に溶解している。そこで、油の濃度の高い冷媒液を抜き出し、油回収器で油と冷媒蒸気に分離して、それぞれ別系統で吸込み蒸気配管を通して圧縮機に戻す方法がある。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "油濃度の高い冷媒液を抜き出し、油回収器で加熱して冷媒蒸気と油に分離し、蒸気は吸込み管へ、油は油溜め器等を経て圧縮機に戻す。"}, {"id": 884, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "ニ", "theme": "冷媒液強制循環式と液分離器", "question": "液ポンプで冷媒を強制循環する冷媒液強制循環式蒸発器を使用した大形冷凍装置では、低圧受液器で気液分離を行っているが、一般的に圧縮機における吸込み蒸気の適正な過熱度を確保するために、液分離器を別に設ける必要がある。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器が気液分離器を兼ねているため、別途液分離器を設ける必要はない（設ける必要があるは誤り）。"}, {"id": 885, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "イ", "theme": "配管用炭素鋼鋼管（SGP）の制限事項", "question": "配管用炭素鋼鋼管（SGP）は、毒性ガスの冷媒、フルオロカーボン冷媒の設計圧力が1MPaを超える耐圧部分、温度が100℃を超える耐圧部分および温度が-25℃より低温の部分に使用できない。", "answer": "○", "law": "例示基準20、上級テキスト 配管編", "explanation": "SGPは毒性ガス禁止、1 MPa超禁止、100℃超（吐出管など）禁止、-25℃未満禁止と規定されている。"}, {"id": 886, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "ロ", "theme": "冬季停止時の逆止め弁設置", "question": "年間を通じて運転する冷凍装置では、冬季の圧縮機の停止中に、凝縮器内の冷媒液が再蒸発して温度の低い吐出しガス配管や圧縮機頭部で凝縮し、たまらないように、吐出しガス配管上部に逆止め弁を設けたほうがよい。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "冬季停止中に凝縮器から低温の圧縮機頭部へ冷媒が凝縮移動して液溜まりを作るのを防ぐため、吐出し配管頂部に逆止め弁を設ける。"}, {"id": 887, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "ハ", "theme": "並列圧縮機の吐出し枝管接続位置", "question": "2台以上の圧縮機を並列運転する場合には、それぞれの吐出しガス配管に逆止め弁を取り付け、停止している圧縮機の冷凍機油に冷媒が大量に溶け込まないようにする。また、吐出しガス配管を主管に接続する場合には、主管の下側（下面側）に接続する。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "油や凝縮液の逆流流入を防ぐため、吐出し枝管は主管の「上側（上面側）」に接続する（「下面側に接続する」は誤り）。"}, {"id": 888, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "ニ", "theme": "液封事故の発生温度条件", "question": "装置の運転中に冷媒温度よりも周囲温度のほうが低い液管では、運転停止時に止め弁や電磁弁などにより封鎖される部分を作ってはならない。このような封鎖された液管では、閉じ込められている液の熱膨張で、弁や管が破損するなどの液封事故が発生しやすい。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "液封破壊が起きるのは、冷媒温度よりも周囲温度のほうが「高い」液管において、停止中に周囲熱を吸収して液が熱膨張する場合である（冷媒温度より周囲温度が低い液管とする記述は誤り）。"}, {"id": 889, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "イ", "theme": "高圧遮断圧力スイッチの設定圧力", "question": "高圧遮断装置には、一般に高圧遮断圧力スイッチが使用され、安全弁の作動圧力よりも低い圧力で作動するように設定し、安全弁が作動する前に圧縮機を停止する。これによって冷媒の外部への放出を避ける。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "安全弁吹始め圧力より低い圧力で作動させて圧縮機を止め、冷媒の大気放出事故を防ぐ。"}, {"id": 890, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ロ", "theme": "圧力容器用安全弁の最小口径式", "question": "圧力容器用安全弁は、冷媒ガスの種類などで決まるC3の値および容器の外径と全長により最小口径が決定され、設定圧力で冷媒を放出し、圧力容器の圧力を過度に上昇させないようにする。なお、このC3の値は、定数値または許容圧力と冷媒ガスの物性などから計算される。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "必要最小口径 d = C3 * sqrt(D * L) （D:外径m, L:全長m, C3:ガス定数）により受熱面積に応じた安全弁サイズを算定する。"}, {"id": 891, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ハ", "theme": "可燃性・毒性冷媒への溶栓使用禁止", "question": "溶栓は、すべての冷凍装置に取り付けることができる。温度によって作動するので、水冷横形シェルアンドチューブ凝縮器で圧縮機の高温の吐出しガスの影響を受ける場所や逆に冷却水で冷却される管板などに取り付けてはならない。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "溶栓は大気圧になるまで全量放出し続けるため、アンモニア等の「可燃性ガス・毒性ガス」には使用が禁止されている（「すべての冷凍装置に取り付けることができる」は誤り）。"}, {"id": 892, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ニ", "theme": "アンモニア設備への破裂板使用禁止", "question": "アンモニア冷媒の冷凍装置において、液封によって著しく圧力上昇のおそれがある部分には、安全弁、破裂板または圧力逃し装置を取り付けるが、安全弁と破裂板には放出管を取り付け、その開口部には放出されたガスを処理する除害装置などを取り付けなければならない。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "破裂板も一度破裂すると全量放出し続けるため、アンモニア等の可燃性・毒性ガス設備には使用できない（誤り）。"}, {"id": 893, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "イ", "theme": "部品耐圧試験合格品の組立後耐圧試験", "question": "耐圧試験は、圧縮機、圧力容器などの耐圧強度を確認しなければならない構成機器、またはその部品ごとに行う全数試験である。さらに、部品ごとに試験したときは、それを組み立てた全ての機器も耐圧試験を行わなければならない。", "answer": "×", "law": "冷規第7条、上級テキスト 試験検査編", "explanation": "部品ごとに耐圧試験に合格したものは、それを組み立てた機器も耐圧強度が確認されたとみなされ、組み立てた機器の耐圧試験は省略できる（「全ての機器も行わなければならない」は誤り）。"}, {"id": 894, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ロ", "theme": "耐圧試験と気密試験の実施順序", "question": "気密試験は、冷媒設備の配管の部分を除く構成機器の個々のものについて、耐圧試験を実施する前にあらかじめ気密の確認をするために行う。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "試験順序は「耐圧試験を先に実施」し、その合格後に「気密試験を実施」する（耐圧試験の前に気密確認を行うとする記述は誤り）。"}, {"id": 895, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ハ", "theme": "真空放置試験の合否基準", "question": "真空試験は、冷媒設備の気密の最終確認をするために冷媒設備内を周囲大気温度に相当する水蒸気飽和圧力以下にすることが必要で、十分に長い時間にわたって真空のまま放置した後、試験開始前よりも5Kくらいの温度変化の場合に0.7 kPa程度の圧力変化であればよい。", "answer": "○", "law": "例示基準7、上級テキスト 試験検査編", "explanation": "飽和水蒸気圧力以下で放置後、5K程度の温度変化に対して圧力変化が0.7 kPa以内であれば合格とする。"}, {"id": 896, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ニ", "theme": "法定能力20t以上圧力容器溶接部の機械試験", "question": "法定冷凍能力20トン以上の冷媒設備の圧力容器の突き合わせ溶接部に規定されている機械試験には、継手引張試験、表曲げ試験、側曲げ試験、裏曲げ試験および衝撃試験がある。", "answer": "○", "law": "例示基準、上級テキスト 試験検査編", "explanation": "突合せ溶接継手の機械試験項目として引張、表曲げ、側曲げ、裏曲げ、衝撃試験が明記されている。"}, {"id": 897, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "イ", "theme": "基礎の質量と防振支持基礎", "question": "一般的に、コンクリート基礎の質量は、その上に据え付ける機器の質量よりも大きくする。特に、多気筒圧縮機では、機器の質量の2倍から3倍の質量の基礎が必要である。なお、防振装置を備えた防振支持の基礎は、通常の基礎に比べて軽量にすることができる。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "多気筒圧縮機では機械質量の2〜3倍が必要。防振ゴムやばね等の防振支持を用いる場合は基礎を大幅に軽量化できる。"}, {"id": 898, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ロ", "theme": "冷凍機油の凝固点とろう分析出", "question": "冷凍機油は、常用の蒸発温度で凝固しないものを選ぶ。凝固する現象の一因は、油中のろう分が固化して析出することであるため、凝固点が低く、ろう分の少ないことが、冷凍機油の選定条件の一つである。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "低温下でのろう分析出（フロック現象）や固化を防ぐため、凝固点が低くろう分含有量の少ない油を選定する。"}, {"id": 899, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ハ", "theme": "冷媒不足および過充填時の運転挙動", "question": "冷媒量が不足すると、蒸発圧力が低下し、圧縮機の吸込み蒸気の過熱度が大きくなり、吐出しガス温度が低下し、冷凍能力も低下する。一方、冷媒が過充てんの場合には、凝縮に有効な伝熱面積が増加し、圧縮機の消費電力は増大する。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "冷媒不足時は吸込み過熱度大・圧力比増大により「吐出しガス温度は上昇」する。過充てん時は液没により有効凝縮面積が「減少」する（記述が誤り）。"}, {"id": 900, "subject": "保安管理技術", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ニ", "theme": "フルオロカーボンの熱分解生成ガス", "question": "フルオロカーボン冷媒は安定した冷媒であり、一般に毒性は低く可燃性もないが、高温の物体に触れると、分解して、フッ化水素やホスゲンなどの毒性はないが可燃性のあるガスが発生する。圧力容器や配管の修理の際には、内部に残留ガスがないか十分に確認する。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "熱分解で生成するフッ化水素やホスゲンは「毒性の強いガス（猛毒）」であり、「毒性はないが可燃性のあるガス」とする記述は誤り。"}, {"id": 901, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の構造（ロータリー）", "question": "ロータリー圧縮機は、構造上、圧縮機の容器内は高圧であり、運転時の電動機巻線温度は吐出しガス温度よりも高くなる。また、油ポンプによって底部の油溜りから汲み上げられた冷凍機油は、高圧側にあるため、高低圧の差圧によってロータとシリンダとの隙間を通り、低圧側のシリンダ内へ流れ込む。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "電動機は密閉容器の高圧ガス内に置かれ吐出しガスで冷却されるため、巻線温度は吐出しガスより高温になる。油は高圧側にあるため差圧により隙間を通って低圧側シリンダ内へ流れ込み潤滑する。"}, {"id": 902, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の構造（スクロール）", "question": "スクロール圧縮機は容積式圧縮機の一種で、吸込み弁と吐出し弁を必要としないが、停止時に高低圧の差圧で圧縮機の旋回スクロールが逆回転するので、逆止め弁などの逆転防止機能を付けたものが多い。また、トルク変動が非常に小さいので振動や騒音が小さく、体積効率、断熱効率も高く、高速回転に適している。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "スクロール圧縮機は吸込み弁・吐出し弁が不要。停止時の差圧逆転防止に逆止め弁を備える。トルク変動が非常に小さく振動騒音が少なく、体積効率・断熱効率・機械効率が高く高速回転に適する。"}, {"id": 903, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の構造（コンパウンド）", "question": "コンパウンド圧縮機は、二段圧縮の冷凍サイクルを実現するために、1台の圧縮機に低段側と高段側の気筒を配置し、1台の電動機で駆動するようにした圧縮機である。低段側と高段側の気筒数比によって、それぞれのピストン押しのけ量の比が決まってしまうので、中間圧力は最適値から若干のずれを生じることがある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "1台の圧縮機に低段・高段の気筒を配置し1台のモータで駆動する。気筒数比で押しのけ量比が固定されるため、運転条件によって中間圧力が最適値から若干ずれることがある。"}, {"id": 904, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の構造（遠心式サージング）", "question": "一般に、遠心圧縮機は、遠心冷凍機として凝縮器および蒸発器とともに一つのユニットにまとめられており、羽根車が高速回転するので、材料、強度、動的バランス、防食処理などに配慮して設計されている。また、容量制御を吸込み側にあるベーンによって行う場合、低流量になると、流量の低下とともに振動や騒音が低下し、運転が不安定になることはない。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "遠心圧縮機で吸込みベーンによる容量制御を行う際、低流量域になると流れが剥離して振動や騒音が発生し運転が不安定になる「サージング」が生じる（「振動や騒音が低下し不安定にならない」は誤り）。"}, {"id": 905, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "イ", "theme": "蒸発圧力調整弁（EPR）の取付位置", "question": "圧縮機の吸込み蒸気配管に蒸発圧力調整弁を取り付けることにより、この弁の作動時には圧縮機の吸込み圧力が低下し、圧縮機の容量制御ができる。この蒸発圧力調整弁は、温度自動膨張弁の感温筒取付け位置と均圧管接続位置よりも上流側の圧縮機吸込み蒸気配管に取り付けなければならない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は、温度自動膨張弁の感温筒および均圧管の取付け位置よりも「下流側」の吸込み配管に取り付けなければならない（上流側は誤り）。"}, {"id": 906, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ロ", "theme": "インバータ制御と潤滑不良", "question": "往復圧縮機の容量制御をインバータで行う場合、圧縮機の回転速度をあまり低速にすると、クランク軸端に油ポンプを付けている圧縮機では、適正な油圧が得られず、潤滑が悪くなる。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "クランク軸直結駆動の油ポンプをもつ往復圧縮機では、インバータで極端な低速運転を行うとポンプ吐出圧力が不足し潤滑不良を起こす。"}, {"id": 907, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ハ", "theme": "吸入圧力調整弁（SPR）の制御目的", "question": "吸入圧力調整弁は、圧縮機の吸込み蒸気配管に取り付ける。この調整弁を取り付ける目的は、圧縮機の吸込み圧力が所定の圧力以上にならないように、吸込み蒸気を絞り、容量制御することである。この容量制御は、冷凍装置の始動時や蒸発器の除霜終了後の再始動時に圧縮機の過負荷を防止することもできる。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（SPR/CPR）は、圧縮機の吸込み圧力が設定値以上に上昇しないよう絞る弁であり、始動時やデフロスト復帰時の過負荷（モータ過熱・焼損）を防止する。"}, {"id": 908, "subject": "保安管理技術", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ニ", "theme": "スクリューアンローダと吐出し温度", "question": "アンローダ機構を備えたスクリュー圧縮機は、冷凍装置の冷凍負荷が大きく減少した場合でも、スクリュー圧縮機の容量をある範囲内で無段階に調整できるため、負荷変動に対して追従性がよい。この容量制御は、圧縮機始動時の負荷軽減装置としても使われている。しかし、低負荷で長時間運転すると、吐出しガス温度が高くなることがある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "スライド弁により無段階制御が可能で追従性が良い。始動時の負荷軽減にも用いられるが、低負荷長時間運転では圧縮
