簡略化", "question": "コンパウンド往復圧縮機は、二段圧縮の冷凍サイクルを実現するために、1台の圧縮機に低段側と高段側の気筒を配置し、1台の電動機で駆動するようにした圧縮機で、装置の配管が簡略化できる。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "1台の本体・モータで低段・高段を圧縮するため、2台設置に比べて設置面積が小さく配管構成を大幅に簡略化できる。"}, {"id": 1142, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "ロ", "theme": "半密閉コンパウンドスクリューの中間混合", "question": "半密閉コンパウンドスクリュー圧縮機では、一般に、中間冷却器からの冷媒ガスと低段側の吐出しガスを直接混合して、高段側に送る構造となっている。低段側吐出しガス温度が比較的低いことから、低段側吐出しガスは中間冷却器を通さない。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "低段吐出ガスは油を多く含み温度も比較的低いため、中間冷却器を通さず、中間冷却器蒸発ガスと直接混合して高段へ送る。"}, {"id": 1143, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "ハ", "theme": "ツインスクリューのロータ間動力伝達", "question": "一般に、ツインスクリュー圧縮機は、冷凍機油の噴射によってロータ歯間、ロータ歯とケーシングの間の潤滑を行い、ロータ歯間で動力の伝達を行っている。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "多量給油により油膜で潤滑・シール・冷却を行い、雄ロータと雌ロータの歯の噛み合い自身で動力を伝達する。"}, {"id": 1144, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "ニ", "theme": "開放往復圧縮機の軸封装置（シャフトシール）", "question": "開放往復圧縮機は、電動機から圧縮機へ動力を伝えるために、クランク軸が圧縮機のケーシングを貫通して外部に突き出ており、その貫通部に冷媒の漏れ止め用の軸封装置（シャフトシール）を必要とする。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "外部電動機で駆動するため、クランク軸貫通部に冷媒漏洩防止用のシャフトシールが不可欠である。"}, {"id": 1145, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "イ", "theme": "ホットガスバイパスによる凝縮圧力過度低下", "question": "ホットガスバイパスによる容量制御を行うときに、ホットガスバイパスの割合が多くなると、吸込み側へのホットガス量が多くなるが、凝縮器熱負荷が減少し凝縮圧力が低下してくるので、結果的にホットガス量も低下する。そのため、凝縮圧力が低くなり過ぎることはない。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "バイパス量が多くなると凝縮器熱負荷が電動機入力のみとなり凝縮圧力が「低くなり過ぎる」ため、凝縮圧力制御等による異常低下防止が必要（「低くなり過ぎることはない」は誤り）。"}, {"id": 1146, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "ロ", "theme": "蒸発圧力調整弁（EPR）の制御圧力方向", "question": "蒸発圧力調整弁は、圧縮機の吸込み蒸気配管に取り付けて、蒸発圧力が所定の圧力以上に上昇しないように吸込み蒸気を絞り、圧縮機吸込み圧力を低下させて圧縮機の容量制御を行う。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "EPRは蒸発圧力が所定圧力以下に「低下しないように」吸込み蒸気を絞る弁である（「以上に上昇しないように」は誤り）。"}, {"id": 1147, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "ハ", "theme": "吸入圧力調整弁（SPR）の過負荷防止", "question": "冷凍装置の始動時などの圧縮機の過負荷を防止するために、吸入圧力調整弁は、圧縮機の吸込み圧力が所定の圧力以上にならないように、吸込み蒸気を絞り、圧縮機の容量制御を行う。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（SPR）はクランクケース圧力が設定値以上に上がらないよう絞り、モータ過負荷・焼損を防止する。"}, {"id": 1148, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "ニ", "theme": "スクリュー圧縮機のスライド弁無段階容量制御", "question": "容量制御装置にスライド弁を用いたスクリュー圧縮機は、冷凍装置の冷凍負荷が大きく減少した場合でも、スクリュー圧縮機の容量をある範囲内で無段階に調整できるため、負荷変動に対して追従性がよい。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "スライド弁により無段階に容量を連続調整できるため、負荷変動に対する追従性に優れる。"}, {"id": 1149, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "イ", "theme": "アンモニア非相溶性油の機外排出", "question": "冷凍機油は、圧縮機の軸受、ロータやピストンなどの摺動面に油膜をつくり、摩耗防止や摩擦によって生じる熱を除去するなどの役割があるが、アンモニアを冷媒とする往復圧縮機では、吐出しガス温度が高く、冷凍機油が劣化しやすい。そのため、非相溶性の冷凍機油を用いる冷凍装置では、圧縮機から吐き出された冷凍機油を冷凍装置の外部に排出する場合もある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "高温で劣化した非相溶の鉱油はクランクケースに戻さず油溜め器に抜き取って機外へ排出・廃棄する。"}, {"id": 1150, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "ロ", "theme": "モータ焼損時の洗浄範囲", "question": "密閉圧縮機の電動機が焼損すると、巻線の絶縁物や冷凍機油が焼けて、圧縮機内の全面にカーボンの付着や、冷媒の分解が生じる場合がある。この場合、装置内の高圧系統の膨張弁までの熱交換器や配管に汚れが生じるが、焼損した部分だけを洗浄すれば正常な運転が可能である。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "モータ焼損による汚れ・酸は低圧側を含む冷媒系統全体に及ぶため、「冷媒系統内すべて」を十分に洗浄しなければならない（「焼損した部分だけを洗浄すれば」は誤り）。"}, {"id": 1151, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "ハ", "theme": "過熱運転の発生条件（過熱度大）", "question": "吸込み蒸気圧力の低下と過大な吸込み蒸気過熱度、吐出しガス圧力の上昇などがあると圧縮機は過熱運転状態になる。吸込み蒸気の温度と圧力がともに上昇する場合には、吸込み蒸気過熱度が大きくならなければ過熱運転にはならない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吸込み温度と圧力がともに上昇しても過熱度が適正範囲であれば過熱運転にはならない。"}, {"id": 1152, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "ニ", "theme": "スクリュー差圧式給油圧力の適正値", "question": "スクリュー圧縮機の給油圧力は、強制給油式では、吐出し圧力より0.2〜0.3 MPa高い値が適正値であり、差圧式では、吐出し圧力より0.05〜0.15 MPa高い値が適正値である。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "差圧式の適正給油圧力は、吐出し圧力より「0.05〜0.15 MPa低い」値である（「高い値」は誤り）。"}, {"id": 1153, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "イ", "theme": "空冷凝縮圧力制御とフラッシュガス防止受液器", "question": "空冷凝縮器を用いた冷凍装置が、冬季に冷凍能力の低下を起こすことを防止するため、凝縮圧力調整弁を使用し、凝縮器内の冷媒液量を調節して凝縮能力を制御することがある。この目的のためにも受液器を別途必要とするが、その理由は、液配管でのフラッシュガスの発生を防止するためである。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "凝縮器内に液を滞留させて伝熱面積を減らし圧力を維持する際、液管内の冷媒が不足してフラッシュガスが生じるのを防ぐため受液器が必要となる。"}, {"id": 1154, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "ロ", "theme": "水あか付着による熱通過率低下割合の比較", "question": "水あかや油膜が水冷シェルアンドチューブ凝縮器の冷却管に付着すると、それらの熱伝導抵抗によって熱通過率の値が小さくなる。そのため、圧縮機の消費電力は増加し、冷凍能力は減少する。水あかが厚く付着することによる熱通過率の低下割合は、冷却管がローフィンチューブの場合よりも裸管の場合のほうが大きい。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "ローフィンチューブは外表面積が内表面積の約3.5〜4.2倍あるため、水側熱抵抗の影響が大きく現れ、低下割合は「ローフィンチューブの場合のほうが大きい」（「裸管の場合のほうが大きい」は誤り）。"}, {"id": 1155, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "ハ", "theme": "運転中の不凝縮ガスと凝縮圧力", "question": "凝縮器内に不凝縮ガスが存在すると、伝熱作用が阻害される。このため、冷凍装置の運転中には、器内に存在する不凝縮ガスの分圧相当分以上に凝縮圧力が高くなる。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "運転中は混合気境界層による伝熱阻害で凝縮温度自体が上昇するため、分圧加算分以上に凝縮圧力が高くなる。"}, {"id": 1156, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "ニ", "theme": "コンデンサ・レシーバの過充填と過冷却度", "question": "受液器兼用の水冷シェルアンドチューブ凝縮器において、装置内に冷媒を過充填すると、余分な冷媒液が凝縮器に貯えられ、多数の冷却管が冷媒液中につかり、冷媒蒸気の凝縮に有効な伝熱面積が減少し、凝縮温度が上昇する。一方、凝縮器出口の冷媒液の過冷却度は増大する。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "冷却管が液没すると気相凝縮面積が減り凝縮温度は上昇するが、液冷却面積が増えるため出口過冷却度は増大する。"}, {"id": 1157, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "イ", "theme": "感温筒の外れおよびガス漏れ時の動作", "question": "温度自動膨張弁の感温筒は、蒸発器出口の過熱された冷媒蒸気温度を吸込み蒸気配管の管壁を介して検出し、圧縮機の吸込み蒸気過熱度を制御する。そのため、管壁から感温筒が外れ、感温筒の温度が上がると膨張弁は開く方向に作動し、感温筒内に封入されている冷媒が漏れると膨張弁は閉じる方向に作動する。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "感温筒が外れて高温を検知すると開弁（過剰送液）し、封入ガスが抜けると開弁力が失われて全閉する。"}, {"id": 1158, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "ロ", "theme": "満液式と乾式の水・ブライン凍結破損危険性", "question": "乾式シェルアンドチューブ蒸発器と満液式シェルアンドチューブ蒸発器では、蒸発温度が低下して、被冷却物である水やブラインが凍結した場合、冷却管の破損の危険性は乾式シェルアンドチューブ蒸発器のほうが高い。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "管内を水が流れる満液式は凍結時に管を外側へ破裂させやすいが、乾式は管外での凍結のため破損危険性は「満液式のほうが高い」（「乾式のほうが高い」は誤り）。"}, {"id": 1159, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "ハ", "theme": "停止時のポンプダウン運転", "question": "フィンコイル乾式蒸発器を用いた冷凍装置における液戻り対策として、運転停止時に蒸発器内に冷媒液を残留させておくことが挙げられる。これは、再起動時に蒸発器内の液による液戻りを起こすことを防ぐためである。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "再起動時の液戻り事故を防ぐため、停止前にはポンプダウンを行い蒸発器内に冷媒液を「残留させない（回収しておく）」ようにする（「残留させておく」は誤り）。"}, {"id": 1160, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "ニ", "theme": "フィンコイル着霜時の能力低下", "question": "フィンコイル乾式蒸発器に霜が厚く成長すると、蒸発器の熱通過率の低下にともない蒸発器への冷媒供給量が減少し、低圧側圧力が正常値よりも低下し、冷却能力は減少する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "着霜による熱通過率低下と通風抵抗増大により低圧圧力が低下し、冷凍能力は減少する。"}, {"id": 1161, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "イ", "theme": "フルオロカーボン冷媒液の油溶解と粘度", "question": "フルオロカーボン冷媒液は冷凍機油を溶解すると粘度が高くなる。そのため、過度に冷凍機油を溶解すると伝熱を阻害することになる。一般に、冷凍機油の溶解量が3%以下であれば特に支障がない。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "油溶解により冷媒液粘度が増加して伝熱を悪化させる。通常3%以下であれば伝熱上の支障はない。"}, {"id": 1162, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "ロ", "theme": "フィンコイル蒸発器の熱流束と熱通過率", "question": "空気冷却用のフィンコイル乾式蒸発器は、冷媒と空気との平均温度差が大きくなれば、蒸発器能力は増大する。蒸発器能力が増して熱流束が大きくなると、冷媒側熱伝達率は大きくなるが、熱通過率の値はあまり大きくならない。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "冷媒側熱伝達率は向上するが、全熱抵抗の大半を占める空気側熱抵抗が風速一定で変わらないため、熱通過率K全体はあまり大きくならない。"}, {"id": 1163, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "ハ", "theme": "汚れ係数増加時の熱通過率低下割合", "question": "ローフィンチューブを用いる水冷凝縮器や満液式水冷却器の冷却管の外表面積基準の熱通過率は、汚れ係数の増大とともに低下する。また、汚れ係数の増大とともに熱通過率の低下割合は大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "熱通過率は汚れ係数の「小さい範囲で急激に大幅低下」し、汚れ係数が大きくなると低下の割合は緩やかになりあまり変わらなくなる（「低下割合は大きくなる」は誤り）。"}, {"id": 1164, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "ニ", "theme": "過熱部平均温度差（向流vs並流）", "question": "フィンコイル乾式蒸発器では、蒸発器の冷媒出口側から入口側に向かって冷却しようとする空気を流す向流方式と、蒸発器の冷媒入口側から出口側に向かって空気を流す並流方式がある。一般に、過熱部での冷媒と空気との平均温度差は、向流方式よりも並流方式のほうが大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "過熱部での平均温度差は「向流方式のほうが大きく」なる（「並流方式のほうが大きくなる」は誤り。並流は過熱部管長が長くなり不利）。"}, {"id": 1165, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "イ", "theme": "吸着チャージ方式の動作速度", "question": "吸着チャージ方式の温度自動膨張弁の感温筒内には、活性炭などの吸着剤とともに炭酸ガスのような通常の使用状態で液化しないガスが封入されている。吸着チャージ方式は、封入する吸着剤の量とガスの種類によって、感温筒温度に対する感温筒内ガス圧力の応答感度を変えることができ、クロスチャージ方式よりも膨張弁の動作が速い。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "吸着剤の熱移動と吸脱着を介するため、吸着チャージ方式は他方式よりも「動作が遅い（ハンチング防止）」（「クロスチャージ方式よりも動作が速い」は誤り）。"}, {"id": 1166, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "ロ", "theme": "電子膨張弁の材料適合性", "question": "電子膨張弁は、サーミスタなどの温度センサからの電気的信号を調節器で過熱度に演算処理し、電気的に弁を駆動して開閉の操作を行うので、温度自動膨張弁と比較して幅広い制御特性にすることができる。また、構成材料を適切に選択すれば、電子膨張弁は冷媒の種類に関係なく使用できる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "マイコン制御により広範囲の制御特性が得られ、材料選定によりあらゆる冷媒に適用できる。"}, {"id": 1167, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "ハ", "theme": "ディストリビュータによる膨張弁容量減少", "question": "膨張弁の容量（冷凍能力）は、オリフィス口径と弁開度に加え、弁前後の圧力差によっても異なる。膨張弁出口側に液分配用ディストリビュータを取り付けると、弁出口圧力が高くなって弁出入口圧力差を小さくし、膨張弁の容量を減少させる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "ディストリビュータのノズル圧損分だけ膨張弁出口背圧が高くなり、弁前後の有効差圧が減少して通過可能容量が小さくなる。"}, {"id": 1168, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "ニ", "theme": "内部均圧形の過熱度増大と外部均圧形の選定", "question": "内部均圧形の温度自動膨張弁を用いると、蒸発器の圧力降下の大きさに応じた蒸発器出口冷媒の過熱度の増大をもたらす。したがって、圧力降下の大きな蒸発器に、外部均圧形の温度自動膨張弁を使用した。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "蒸発器内圧損が大きいと内部均圧形では実過熱度が過大となるため、出口圧力を直接均圧室に導く外部均圧形を選定するのが正しい。"}, {"id": 1169, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "イ", "theme": "凝縮圧力調整弁（CPR）と受液器の必要性", "question": "凝縮圧力調整弁は、空冷凝縮器の冬季運転時における凝縮圧力の異常な低下を防止し、冷凍装置を正常な運転にするための圧力制御弁である。凝縮圧力調整弁による凝縮圧力の制御は、凝縮器への液の滞留による方法であり、その滞留分だけ、装置の冷媒充填量に余裕を必要とするので、受液器がなければならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "空冷凝縮器内に液を溜め込んで放熱面積を減らす制御であるため、滞留分の余剰冷媒を逃がす受液器の設置が不可欠である。"}, {"id": 1170, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "ロ", "theme": "蒸発圧力調整弁（EPR）の多重蒸発器運転", "question": "蒸発圧力調整弁は、水またはブライン冷却器に用いて凍結を防止したり、被冷却物の温度を一定に保持することができ、また、この弁により1台の圧縮機で蒸発温度の異なる複数の蒸発器を運転することができる。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "EPRにより蒸発器ごとの最低蒸発圧力を個別に保持できるため、1台の圧縮機で異温度の冷却器を並列運転できる。"}, {"id": 1171, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "ハ", "theme": "直動式吸入圧力調整弁と蒸発圧力調整弁の構造差", "question": "直動式吸入圧力調整弁は、ベローズによってシールされた作動圧力設定用ばねとベローズに直結されたバルブプレートからなっている。この弁は、バルブプレートの向きも含めた構造が、直動式蒸発圧力調整弁と同じであるが、冷媒の入口と出口の取り付け方が逆である。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "直動式SPRとEPRは「バルブプレートの向きが逆」になっている（「向きも含めた構造が同じ」は誤り）。"}, {"id": 1172, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "ニ", "theme": "冷却水調整弁の始動時バイパス弁", "question": "温度式冷却水調整弁は、冷媒に直接触れることなく作動するので、凝縮器以外のオイルクーラなどの液体温度制御用にも使える。圧力式冷却水調整弁は、冷凍装置が停止して凝縮圧力が低下すると自動的に弁を絞り冷却水を止める。また、始動時には、凝縮圧力が高くなるまで弁が開かないのでバイパス弁を必要とする。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "温度式は冷媒非接触で作動。圧力式は停止時自動止水し、始動時の圧力立ち上がり遅れを防ぐためバイパス弁を併設する。"}, {"id": 1173, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "イ", "theme": "低圧フロート弁の機能", "question": "満液式蒸発器、低圧受液器、中間冷却器などの液面レベルを一定に保つためのフロート弁は、低圧フロート弁と呼ばれ、高圧冷媒液を絞り膨張させて、低圧機器内に送液する。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "低圧側の液位をフロートで検出し、高圧液を絞り膨張させて液位を一定に保持する。"}, {"id": 1174, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "ロ", "theme": "交流電磁弁のコイル引抜き焼損事故", "question": "直動式の交流用の電磁弁は、点検時などに、通電させたままプランジャからコイルを抜くと、コイルのインピーダンスが小さくなり、コイルが焼損することがある。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "交流ソレノイドコイルは鉄心（プランジャ）が抜けるとインダクタンスが激減して過大電流が流れ、急速に過熱焼損する。"}, {"id": 1175, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "ハ", "theme": "高圧圧力スイッチの用途別復帰方式", "question": "高圧圧力スイッチは、安全装置として使用する場合には、冷凍装置の停止した原因を修復してから運転再開する必要があるので手動復帰式を使用し、一方、制御用としては、自動復帰式を使用した。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "保安安全用は原因究明後に再起動させるため手動復帰形、凝縮器ファン発停等の制御用は自動復帰形を用いるのが正しい。"}, {"id": 1176, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "ニ", "theme": "低圧スイッチのディファレンシャルと発停頻度", "question": "低圧圧力スイッチは、冷凍装置の圧縮機の吸込み蒸気配管に圧力検出端を接続し、冷凍負荷が減少して蒸発圧力が低下したとき、その圧力低下を検出して圧縮機電源回路を遮断して圧縮機を停止させるのに使用する。自動復帰式の低圧圧力スイッチを用いて、圧縮機の発停を行う場合、スイッチの「入り」「切り」差を小さくするほど圧縮機の運転間隔が長くなり、吸込み圧力の変動幅を小さくできる。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "入切差（ディファレンシャル）を小さくすると圧縮機の発停運転間隔は「短く（頻繁に）」なる（「運転間隔が長くなり」は誤り）。"}, {"id": 1177, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "イ", "theme": "フィルタドライヤ用乾燥剤の選定", "question": "フルオロカーボン冷凍装置のフィルタドライヤに使用する乾燥剤としては、ゼオライト、シリカゲルなどを使用し、水分を吸着して化学変化を起こすものや、砕けやすく流出するような乾燥剤は使用しない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "化学変化せず粉化しにくいモレキュラーシーブ（ゼオライト）やシリカゲル等の物理吸着剤を使用する。"}, {"id": 1178, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "ロ", "theme": "アンモニア鉱油使用時の返油先", "question": "冷凍機油に鉱油を用いたアンモニア冷凍装置では、油分離器は圧縮機と凝縮器との間に設置し、圧縮機吐出しガスに含まれる冷凍機油を冷媒から分離して、その油を直接圧縮機のクランクケースへ戻している。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニアと非相溶の鉱油は熱劣化しているためクランクケースに戻さず「油溜め器に抜き出す」（「直接クランクケースへ戻している」は誤り）。"}, {"id": 1179, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "ハ", "theme": "低圧受液器の気液分離機能", "question": "低圧受液器は、蒸発器から戻ってきた気液混合状態の冷媒を蒸気と液に分離し、圧縮機に液が戻らないようにする液分離器としての機能をもっているので、これがある場合は吸込み蒸気配管に、液分離器を取り付ける必要はない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器自体がサクショントラップ（液分離器）として機能するため、別途吸込み管に液分離器を設ける必要はない。"}, {"id": 1180, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "ニ", "theme": "高圧受液器のガス空間（20%以上）", "question": "高圧受液器の容量は、修理時に装置内の冷媒充填量の大部分を回収できる容量とする。その容積は、回収された冷媒液が高圧受液器の内容積の95%以内の空間に収容できるものとし、少なくとも5%の冷媒蒸気空間を残さなければならない。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "回収冷媒液は受液器内容積の「80%以内」に収容し、少なくとも「20%の蒸気空間」を残さなければならない（「95%/5%」は誤り）。"}, {"id": 1181, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "イ", "theme": "液ガス熱交換器のアンモニア使用禁止", "question": "液ガス熱交換器は、凝縮器から出た高温冷媒液と蒸発器から出た低温冷媒蒸気との間で熱交換させて、冷媒液の過冷却度と圧縮機吸込み蒸気の過熱度を適度に調節するのに使用され、一般的にフルオロカーボン冷凍装置およびアンモニア冷凍装置で使用される。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニア冷凍装置では吸込み過熱による吐出し温度上昇が著しいため「液ガス熱交換器は使用しない」（「アンモニア冷凍装置で使用される」は誤り）。"}, {"id": 1182, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "ロ", "theme": "直接膨張式中間冷却器の構造と制御", "question": "二段圧縮一段膨張式冷凍装置に利用される直接膨張式中間冷却器は、シェルアンドチューブ熱交換器と同様の構造をしており、温度自動膨張弁により高段側圧縮機に吸い込まれる冷媒の過熱度の制御を行う。この冷却器は、フルオロカーボン冷凍装置によく利用される。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "直接膨張式中間冷却器は二段圧縮一段膨張サイクルに用いられ、温度膨張弁で高段吸込み過熱度を制御する。"}, {"id": 1183, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "ハ", "theme": "U字管式アキュムレータの油吸い込み小孔", "question": "小形のフルオロカーボン冷凍装置に用いられるU字管を内蔵した液分離器では、入口から入った液滴を含んだ冷媒蒸気は、流れ方向の変化と流速の低下によって、液と蒸気に分離される。分離された容器底部の冷凍機油と冷媒液は、U字管底部にあけられた小さな孔から、少量ずつ圧縮機へ吸い込まれる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "U字管底部のメタリングオリフィスから油と微量液を霧状にガス流に同伴させて圧縮機へ返油する。"}, {"id": 1184, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "ニ", "theme": "不燃性冷媒の油回収器加熱源（電気ヒータ可）", "question": "フルオロカーボン冷凍装置において、満液式蒸発器や低圧受液器内の冷凍機油は冷媒液に溶解している。そこで、冷凍機油の濃度が高い冷媒液を抜き出し、冷媒液は加熱して蒸気とし、冷媒と冷凍機油に分離する機能をもった油回収器を使用する。不燃性冷媒を使用する装置では、加熱には高圧冷媒液または高圧の吐出しガスを利用し、電気ヒータは加熱源として使用しない。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "不燃性フルオロカーボン冷媒の油回収器では「電気ヒータ」が標準的な加熱源として広く使用される（「電気ヒータは加熱源として使用しない」は誤り）。"}, {"id": 1185, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "イ", "theme": "液配管のフラッシュガス防止防熱", "question": "液配管は、冷媒液にフラッシュガスを発生させないようにする必要がある。やむをえず、フラッシュガスの発生が懸念される温かい所に液配管を通す場合には、配管に防熱を施工し、フラッシュガスの発生を防止する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "周囲からの受熱によるフラッシュガス発生を防ぐため、高温箇所を通る液管には防熱施工を行う。"}, {"id": 1186, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "ロ", "theme": "止め弁のグランド部下向き禁止", "question": "液配管に取り付けられている附属品の1つである止め弁は、耐圧、気密性能が十分であることが要求される。止め弁は、管と比べて圧力降下が大きく、冷媒漏れの原因となることもあるので、設置する数をできるだけ少なくし、弁のグランド部を下向きに取り付けないようにする。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "漏洩リスク低減のため設置数は最小限とし、油や異物滞留・パッキン損傷を防ぐためグランド部を下向きに取り付けてはならない。"}, {"id": 1187, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "ハ", "theme": "複数蒸発器吸込み枝管の主管接続位置", "question": "蒸発器が2基以上の冷凍装置では、無負荷の蒸発器に主管内の冷凍機油や冷媒液が流れ込むのを防止するため、蒸発器吸込み管は、主管の下部（下面側）から接続するのがよい。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "油や冷媒液の逆流流入を防ぐため、吸込み枝管は主管の「上部（上面側）」から接続する（「下面側から接続」は誤り）。"}, {"id": 1188, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "ニ", "theme": "配管用炭素鋼鋼管（SGP）のアンモニア使用禁止", "question": "配管用炭素鋼鋼管（SGP）は、フルオロカーボン冷媒およびアンモニア冷媒の配管に使用できる。ただし、この鋼管は、設計圧力が1MPa（ゲージ圧力）を超える耐圧部分、温度100℃を超える耐圧部分（圧縮機の吐出しガス配管など）には使用できない。", "answer": "×", "law": "例示基準20、上級テキスト 配管編", "explanation": "SGPは「毒性ガス（アンモニア等）」には使用が禁止されている（「アンモニア冷媒の配管に使用できる」は誤り）。"}, {"id": 1189, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "イ", "theme": "二段圧縮過冷却液管の液封防止安全弁", "question": "二段圧縮冷凍装置の過冷却液配管は、液封事故を起こしやすいため、圧力逃がし装置の設置を検討し、水撃作用が発生しないように留意したうえで安全弁を設置した。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "過冷却液管は液封を起こしやすいため圧力逃がし装置（安全弁）を設け、電磁弁急閉止等の水撃作用に留意して設置する。"}, {"id": 1190, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "ロ", "theme": "溶栓の適用容積制限（500L未満）", "question": "フルオロカーボン冷凍装置において、シェルアンドチューブ凝縮器の内容積が600Lであったので、圧縮機吐出しガス温度の影響を受けない位置を定め、安全装置として溶栓を取り付けた。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "安全弁の代わりに溶栓を使用できるのは内容積「500 L未満」の容器に限られる。600 Lの容器には溶栓を代用できない（誤り）。"}, {"id": 1191, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "ハ", "theme": "高圧遮断装置の設定圧力と精度（1〜2MPa）", "question": "高圧遮断装置の設定圧力は、内蔵安全弁を除く、高圧部に取り付けられたすべての安全弁の最低吹始め圧力以下で、かつ、高圧部の許容圧力以下の圧力で作動するように設定する。なお、高圧遮断装置の設定圧力の精度は、1MPa以上2MPa未満の設定圧力の範囲では、-12%以内でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "安全弁吹始め圧力以下かつ許容圧力以下で作動させる。精度基準は1〜2 MPaの範囲では-12%以内である。"}, {"id": 1192, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "ニ", "theme": "可燃性冷媒R290の放出管開口部位置", "question": "R290を用いる冷凍装置の安全弁の放出管開口部の位置を検討する際、近接する建築物や工作物の高さを調べ、それらの高さより低い高さで周囲に着火源などのない位置に決定した。", "answer": "×", "law": "例示基準9、上級テキスト 安全装置編", "explanation": "可燃性冷媒（プロパン R290等）の安全弁放出管開口部は、近接する建築物や工作物の高さ「以上の高さ」としなければならない（「低い高さで」は誤り）。"}, {"id": 1193, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "イ", "theme": "真空試験の到達圧力と測定計器", "question": "冷媒設備の気密の最終確認をするための真空試験は、高真空を必要とするため真空ポンプを使用して行い、設備からの漏れの有無の確認とともに、設備内を真空にしながら、水分を蒸発させて設備内を乾燥させる。設備内は、大気温度0℃に相当する水の飽和蒸気圧力以下とする。この試験では、真空計を用いて真空度を測定する。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "0℃飽和水蒸気圧力（約0.6 kPa）以下まで真空引き乾燥させ、高精度の真空計を用いて測定する。"}, {"id": 1194, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "ロ", "theme": "耐圧試験圧力における材料応力基準（降伏点）", "question": "圧縮機、圧力容器などの耐圧強度を確認するために行う耐圧試験の圧力は、設計圧力に対して高いほうが信頼性も増すが、機器に変形を生じてはいけないので、加圧時に発生する応力を、その機器材料の引張強さよりも低くなるようにしなければならない。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "永久変形を防ぐため、耐圧加圧時の応力は材料の「降伏点」より低く抑えなければならない（「引張強さよりも低く」は誤り）。"}, {"id": 1195, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "ハ", "theme": "気密試験ガスと空気圧縮機吐出し温度", "question": "気密試験（配管を完了した設備）に使用するガスには、空気、窒素などが使用される。空気圧縮機を使用して圧縮空気を供給する場合には、圧縮により空気が高温になるので、徐々に圧力を上げるようにし、空気圧縮機の吐出し温度が140℃を超えないようにする。", "answer": "○", "law": "例示基準6、上級テキスト 試験検査編", "explanation": "空気・窒素等を使用し、圧縮空気供給時は吐出し温度140℃以下を保つ（アンモニア設備ではCO2使用禁止）。"}, {"id": 1196, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "ニ", "theme": "液体耐圧試験の降圧検査圧力（8/10）", "question": "耐圧試験を液体で行う場合の実施要領は、圧力容器内の空気を完全に排除した後、液体を徐々に加圧して耐圧試験圧力まで上げ、その圧力を1分間以上保った後、圧力を耐圧試験圧力の1/2まで下げて、各部、溶接継手などについて漏れ、異常な変形、破壊などの異常のないことを確かめる。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "1分間保持後の検査圧力は耐圧試験圧力の「8/10」まで降下させる（「1/2まで下げて」は誤り）。"}, {"id": 1197, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "イ", "theme": "冷媒不足時の吐出しガス温度", "question": "冷媒充填量が不足すると、蒸発圧力が低下し、圧縮機の吸込み蒸気の過熱度が大きくなり、吐出し圧力が低下し、吐出しガス温度も低下する。また、冷凍能力も低下する。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "冷媒不足時は吸込み過熱度大・圧力比増大により「吐出しガス温度は高く（上昇）」なる（「吐出しガス温度も低下する」は誤り）。"}, {"id": 1198, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "ロ", "theme": "アンモニアの可燃性区分", "question": "アンモニアは毒性があり、多量に浴びると死に至る危険がある。一方、燃焼性はなく、アンモニアを冷媒とする冷凍装置においては、電気設備に対して防爆性能を必要としない。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "アンモニアは爆発限界15〜28%を有する「可燃性ガス」である（「燃焼性はなく」は誤り）。下限値が高いため電気防爆が免除されている。"}, {"id": 1199, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "ハ", "theme": "冷凍機油の選定条件", "question": "冷凍機油の選定条件として、凝固点が低く、ろう分が少ないこと、熱安定性がよく、引火点が高いこと、粘度が適当で、油膜が強いこと、酸に対する安定性がよいこと、水分や酸類などが含まれていないこと、水分により乳化しにくいことなどが挙げられる。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "低凝固点、低ろう分、高熱安定性、高引火点、耐乳化性など冷凍機油の具備条件としてすべて正しい。"}, {"id": 1200, "subject": "保安管理技術", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "ニ", "theme": "基礎質量（機械質量の2〜3倍）と固有振動数", "question": "多気筒圧縮機の基礎の質量は防振支持をしている場合を除き、機械質量の2〜3倍にするのが一般的である。また、機械と基礎とが共振しないように、基礎の固有振動数は、機械が発生する振動の振動数よりも少なくとも20%以上の差をつけるようにする。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "基礎質量は機械質量の2〜3倍、共振防止のため固有振動数と加振振動数は20%以上の差をつける。"}, {"id": 1201, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-01", "branch": "二段圧縮", "theme": "中間圧力の最適値 p_m", "question": "高段の凝縮圧力pkと低段の蒸発圧力poの条件において、二段圧縮冷凍サイクルの成績係数が実用上ほぼ最大となり最も適正な運転となる中間圧力pmの算定式は、pm = √(pk * po) である。", "answer": "○", "law": "2017年 学識 問1", "explanation": "高段と低段の圧力比が等しくなる（等圧力比の原則）とき、理論的・実用的にCOPが最大となるため、pm = √(pk * po) で求められる。"}, {"id": 1202, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-02", "branch": "二段圧縮", "theme": "中間冷却器の熱収支（バイパス量）", "question": "二段圧縮一段膨張サイクルの中間冷却器において、低段側循環量q_mro、バイパス冷媒量q'_mro、比エンタルピーh3, h5, h6, h7の関係式は、q_mro * [(h5 - h7) + (h'_2 - h3)] = q'_mro * (h3 - h6) である。", "answer": "○", "law": "2016・2017年 学識 問1", "explanation": "中間冷却器における持ち込み熱量と冷媒液の自己冷却（フラッシュ）による潜熱吸収量の熱収支からバイパス量q'_mroを算出する。"}, {"id": 1203, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-03", "branch": "二段圧縮", "theme": "実際の総軸動力 P の計算", "question": "二段圧縮冷凍装置における実際の総軸動力P (kW) は、低段側圧縮機の軸動力P_Lと高段側圧縮機の軸動力P_Hの和（P = P_L + P_H）として求められる。", "answer": "○", "law": "2016〜2018年 学識 問1", "explanation": "PL = [q_mro * (h2 - h1)] / (η_c * η_m)、PH = [q_mrk * (h4 - h3)] / (η_c * η_m) の合計で総軸動力となる。"}, {"id": 1204, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-04", "branch": "熱交換器", "theme": "液ガス熱交換器の熱収支（エンタルピー変化）", "question": "液ガス熱交換器において、冷媒液が受けるエンタルピー低下（過冷却）と、冷媒蒸気が受けるエンタルピー上昇（過熱）は等しく、h3 - h4 = h1 - h6 が成り立つ。", "answer": "○", "law": "2016・2020年 学識 問2", "explanation": "熱交換器内での熱の出入りはない（断熱変化）ため、高圧液の失う熱量と低圧ガスの得る熱量は等しい（h3 - h4 = h1 - h6）。"}, {"id": 1205, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-05", "branch": "熱交換器", "theme": "液ガス熱交換器の主な使用目的", "question": "液ガス熱交換器の主な使用目的は、「①液管内でのフラッシュガス発生防止（過冷却度確保）」および「②圧縮機の吸込み蒸気を過熱して湿り圧縮・液圧縮を防止すること」の2つである。", "answer": "○", "law": "2016・2020年 学識 問2", "explanation": "過冷却により配管抵抗や立上がりによる気化（フラッシュガス）を防ぎ、適切な過熱度により圧縮機の液圧縮（メカニカル破損）を確実に防止する。"}, {"id": 1206, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-06", "branch": "熱移動", "theme": "熱通過率 K の逆数合成則", "question": "多層平壁（外皮材1, 芯材2, 内皮材3）および表面熱伝達率α_a, α_r を持つパネルの熱通過率 K [W/(m^2·K)] は、各層の熱抵抗と表面抵抗の逆数の和の逆数で表される。", "answer": "○", "law": "2016〜2020年 学識 問3", "explanation": "K = 1 / [ (1/α_a) + (δ1/λ1) + (δ2/λ2) + (δ3/λ3) + (1/α_r) ]。伝熱計算の基本公式。"}, {"id": 1207, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-07", "branch": "熱移動", "theme": "結露防止のためのパネル外表面温度", "question": "冷蔵庫パネルの外表面での結露を防ぐためには、外表面温度ta3が外気の露点温度ta2よりも高く（ta3 ≥ ta2）、通常は34.5℃以上等の条件を満たすよう芯材厚さδ2を設計する。", "answer": "○", "law": "2020年 学識 問3", "explanation": "外表面温度が露点温度以下になると表面結露（水滴付着）が生じるため、外気側の表面温度を露点以上に保つ断熱設計が必要。"}, {"id": 1208, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-08", "branch": "圧力容器", "theme": "円筒胴の必要最小板厚 t_a", "question": "内圧を受ける円筒胴の必要最小板厚 ta (mm) を求めるJIS公式は、ta = [P * Di] / [2 * σ_a * η - 1.2 * P] + α である。", "answer": "○", "law": "2016〜2020年 学識 問5", "explanation": "P: 設計圧力(MPa), Di: 内径(mm), σ_a: 許容引張応力(N/mm^2), η: 溶接継手効率, α: 腐れしろ(mm)。"}, {"id": 1209, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-09", "branch": "圧力容器", "theme": "半球形鏡板の必要板厚 t_a", "question": "内圧を受ける半球形鏡板（半径R）の必要厚さ ta (mm) を求める公式は、ta = [P * R * W] / [2 * σ_a * η - 0.2 * P] + α であり、半球形ではW=1, η=1となる。", "answer": "○", "law": "2017・2020年 学識 問5", "explanation": "半球形鏡板は応力分散に優れており、形状係数W=1、溶接継手がない場合は継手効率η=1として計算する。"}, {"id": 1210, "subject": "学識（公式・用語集）", "year": "学識（計算・公式）", "q_num": "G-10", "branch": "圧力容器", "theme": "円筒胴板の接線方向引張応力 σ_t と長手方向引張応力 σ_l", "question": "円筒胴に設計圧力Pが作用するとき、円筒胴板に誘起される接線方向（周方向）の引張応力σ_tは [P * Di] / (2 * ta)、長手方向の引張応力σ_lは [P * Di] / (4 * ta) である。", "answer": "○", "law": "2019・2020年 学識 問5", "explanation": "周方向応力（接線方向応力）は長手方向応力の2倍の大きさを持ち、圧力容器の肉厚設計の支配的要因となる。"}, {"id": 1211, "subject": "学識（公式・用語集）", "year": "学識（公式・用語集）", "q_num": "G-11", "branch": "冷媒特性", "theme": "非共沸混合冷媒と共沸混合冷媒の番号台", "question": "新冷媒の分類において、番号が400番台の混合冷媒は非共沸混合冷媒（相変化時に温度勾配を持つ）、500番台の混合冷媒は共沸混合冷媒（単一成分のように振る舞う）である。", "answer": "○", "law": "2017・2019年 学識 問4", "explanation": "400番台は非共沸（R410A, R407C, R404A等）、500番台は共沸（R507A等）。"}, {"id": 1212, "subject": "学識（公式・用語集）", "year": "学識（公式・用語集）", "q_num": "G-12", "branch": "冷媒特性", "theme": "ローレンツサイクル", "question": "非共沸混合冷媒の相変化に伴う温度変化（温度勾配）を利用して、熱源流体との温度差を小さくし不可逆損失を減らして成績係数の向上を図ったサイクルの名称をローレンツサイクルという。", "answer": "○", "law": "2016年 学識 問4", "explanation": "非共沸混合冷媒の蒸発・凝縮時の温度変化を利用するサイクルがローレンツサイクルである。"}, {"id": 1213, "subject": "学識（公式・用語集）", "year": "学識（公式・用語集）", "q_num": "G-13", "branch": "冷凍機油", "theme": "PAG油とPOE油の正式名称", "question": "HFC系冷媒等と組み合わせて用いられる合成油である「PAG油」の正式名称はポリアルキレングリコール油、「POE油」の正式名称はポリオールエステル油である。", "answer": "○", "law": "2018年 学識 問4", "explanation": "PAG（Polyalkylene Glycol）とPOE（Polyol Ester）はHFC冷媒用合成油の代表例。"}, {"id": 1214, "subject": "学識（公式・用語集）", "year": "学識（公式・用語集）", "q_num": "G-14", "branch": "冷媒特性", "theme": "R729の冷媒名と命名規則", "question": "冷媒番号の700番台「R729」の冷媒名は「空気」であり、700番台は無機化合物、下二桁「29」は空気の平均分子量（約29）を表している。", "answer": "○", "law": "2018年 学識 問4", "explanation": "冷媒の命名規則において700番台は無機化合物（R717=アンモニア, R744=CO2, R718=水, R729=空気）であり、下二桁は分子量を示す。"}, {"id": 1215, "subject": "学識（公式・用語集）", "year": "学識（公式・用語集）", "q_num": "G-15", "branch": "冷媒特性", "theme": "ふっ素系冷媒の命名規則（X1〜X4）", "question": "ふっ素系冷媒の記号 R X1 X2 X3 X4 において、X1は二重結合の数（0は省略）、X2は炭素原子数-1（0は省略）、X3は水素原子数+1、X4はふっ素原子数を表す。", "answer": "○", "law": "2020年 学識 問4", "explanation": "例：R134a の場合、X2=1(炭素2), X3=3(水素2), X4=4(ふっ素4) で C2H2F4 となる。aは異性体を表す。"}];

let currentList = [...allQuestions];
let currentIndex = 0;
let correctCount = 0;
let incorrectCount = 0;
let wrongIds = new Set(JSON.parse(localStorage.getItem('1cold_wrong_ids') || '[]'));

function applyFilters() {
  const selectedSub = document.getElementById('subjectFilter').value;
  const selectedYear = document.getElementById('yearFilter').value;
  const selectedOrder = document.getElementById('orderFilter').value;
  
  let list = allQuestions.filter(q => {
    if (selectedSub !== 'ALL' && q.subject !== selectedSub) return false;
    if (selectedYear !== 'ALL' && q.year !== selectedYear) return false;
    return true;
  });
  
  if (selectedOrder === 'wrongOnly') {
    list = list.filter(q => wrongIds.has(q.id));
    if (list.length === 0) {
      alert('現在「要復習（間違えた問題）」はありません。
通常モードで学習を進めてください。');
      document.getElementById('orderFilter').value = 'sequential';
      return applyFilters();
    }
  } else if (selectedOrder === 'random') {
    list.sort(() => Math.random() - 0.5);
  }
  
  currentList = list;
  currentIndex = 0;
  correctCount = 0;
  incorrectCount = 0;
  renderQuestion();
}

function renderQuestion() {
  if (currentList.length === 0) {
    document.getElementById('questionText').textContent = '該当する問題がありません。';
    return;
  }
  const q = currentList[currentIndex];
  document.getElementById('badgeSub').textContent = q.subject;
  document.getElementById('badgeYear').textContent = q.year;
  document.getElementById('badgeNum').textContent = q.q_num + ' 肢' + q.branch;
  document.getElementById('badgeTheme').textContent = q.theme;
  document.getElementById('questionText').textContent = q.question;

  document.getElementById('btnMaru').disabled = false;
  document.getElementById('btnBatsu').disabled = false;
  document.getElementById('actionButtons').style.display = 'grid';
  document.getElementById('explanationBox').style.display = 'none';

  updateStats();
}

function checkAnswer(userChoice) {
  const q = currentList[currentIndex];
  const isCorrect = (userChoice === q.answer);
  
  document.getElementById('btnMaru').disabled = true;
  document.getElementById('btnBatsu').disabled = true;

  const expBox = document.getElementById('explanationBox');
  const resultTitle = document.getElementById('resultTitle');
  const lawTag = document.getElementById('lawTag');
  const expText = document.getElementById('expText');

  expBox.className = 'explanation-box ' + (isCorrect ? 'correct' : 'incorrect');
  resultTitle.className = 'result-title ' + (isCorrect ? 'correct' : 'incorrect');

  if (isCorrect) {
    correctCount++;
    resultTitle.innerHTML = '⭕ 正解！（正答：' + q.answer + '）';
    if (wrongIds.has(q.id)) {
      wrongIds.delete(q.id);
      localStorage.setItem('1cold_wrong_ids', JSON.stringify([...wrongIds]));
    }
  } else {
    incorrectCount++;
    resultTitle.innerHTML = '❌ 不正解...（正答：' + q.answer + '）';
    wrongIds.add(q.id);
    localStorage.setItem('1cold_wrong_ids', JSON.stringify([...wrongIds]));
  }

  lawTag.textContent = q.law;
  expText.textContent = q.explanation;
  expBox.style.display = 'block';

  expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  updateStats();
}

function nextQuestion() {
  if (currentIndex + 1 < currentList.length) {
    currentIndex++;
    renderQuestion();
  } else {
    alert('全問終了しました！
正解数: ' + correctCount + ' / ' + currentList.length + ' 問
正解率: ' + Math.round((correctCount / currentList.length) * 100) + '%');
    currentIndex = 0;
    renderQuestion();
  }
}

function updateStats() {
  const total = currentList.length;
  const currentNum = total > 0 ? currentIndex + 1 : 0;
  document.getElementById('currentIdxText').textContent = currentNum + ' / ' + total + ' 問 (要復習: ' + wrongIds.size + '問)';

  const answered = correctCount + incorrectCount;
  const rate = answered > 0 ? Math.round((correctCount / answered) * 100) : 0;
  document.getElementById('scoreText').textContent = '正解率: ' + rate + '% (正: ' + correctCount + ' / 誤: ' + incorrectCount + ')';

  const progress = total > 0 ? ((currentIndex) / total) * 100 : 0;
  document.getElementById('progressFill').style.width = progress + '%';
}

function resetStats() {
  if (confirm('間違えた問題の履歴と回答カウントをリセットしますか？')) {
    wrongIds.clear();
    localStorage.removeItem('1cold_wrong_ids');
    correctCount = 0;
    incorrectCount = 0;
    currentIndex = 0;
    renderQuestion();
  }
}

applyFilters();
</script>
