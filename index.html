 "answer": "×", "law": "冷規第7条第1項第10号・第11号", "explanation": "アンモニア受液器では、丸形以外の液面計とし「破損防止措置」と「自動閉止弁等の漏えい防止措置」の両方を講じる必要がある（いずれか一方は誤り）。"}, {"id": 217, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "イ", "theme": "防爆構造電気設備の除外（事例1）", "question": "（アンモニア250t）この冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものでなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第14号", "explanation": "電気設備の防爆構造義務は「可燃性ガス（アンモニアを除く。）」と規定されており、アンモニア設備は除外されている（誤り）。"}, {"id": 218, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ロ", "theme": "安全弁放出管の設置（事例1）", "question": "（アンモニア250t）この冷媒設備の安全弁（大気に冷媒ガスを放出することのないものを除く。）には、放出管を設けなければならない。また、放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。", "answer": "○", "law": "冷規第7条第1項第9号", "explanation": "アンモニア設備の安全弁には放出管を設け、開口部はガスの性質に応じた安全な位置としなければならない。"}, {"id": 219, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ハ", "theme": "警報器設置による除害免除（事例1）", "question": "（アンモニア250t）この製造施設から漏えいするガスが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設ければ、この製造設備には、その設備の冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じる必要はない。", "answer": "×", "law": "冷規第7条第1項第15号・第16号", "explanation": "毒性ガスの除害措置義務は、漏えい検知警報設備を設置しても免除されない（両方の設置が必要なため誤り）。"}, {"id": 220, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "イ", "theme": "保安責任者の資格要件（事例2）", "question": "（R134a 600t）この事業所の冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が100トン以上である製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有している者のうちから選任しなければならない。", "answer": "○", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "認定指定設備Bを除く設備A（300t）で判定する。300t以上の設備は「1冷免状」＋「100t以上で1年の製造経験」が必要。"}, {"id": 221, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の解任・選任届（事例2）", "question": "（R134a 600t）この事業所に選任している冷凍保安責任者を解任し、新たな者を選任したときは、遅滞なく、その解任及び選任の旨を都道府県知事に届け出なければならないが、冷凍保安責任者の代理者を解任及び選任したときには、その必要はない。", "answer": "×", "law": "法第33条第3項、法第27条の2第5項", "explanation": "代理者についても、冷凍保安責任者と同様に選任・解任の旨を遅滞なく知事に届け出なければならない（必要はないは誤り）。"}, {"id": 222, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ハ", "theme": "代理者の資格要件（事例2）", "question": "（R134a 600t）この事業所の冷凍保安責任者の代理者には、高圧ガスの製造に関する所定の知識経験を有する者であれば、所定の製造保安責任者免状の交付を受けていない者を選任することができる。", "answer": "×", "law": "法第33条第1項、冷規第36条第1項", "explanation": "代理者にも冷凍保安責任者と同等の免状交付及び実務経験が必須である（免状未取得者を選任できるは誤り）。"}, {"id": 223, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "イ", "theme": "指定設備の保安検査除外（事例2）", "question": "（R134a 600t）認定指定設備である製造設備Bの部分を除く製造施設について、保安検査を定期に受けなければならない。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備の部分は「特定施設」から除外されるため、保安検査はこれを除く設備Aについて定期に受ける。"}, {"id": 224, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ロ", "theme": "保安検査の対象（設備基準）（事例2）", "question": "（R134a 600t）保安検査は、特定施設が製造施設の位置、構造及び設備に係る技術上の基準に適合しているかどうかについて行われる。", "answer": "○", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査は特定施設の位置・構造・設備（ハード基準）が基準に適合しているかどうかについて行われる。"}, {"id": 225, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ハ", "theme": "保安検査の実施主体（事例2）", "question": "（R134a 600t）この事業者は、この製造施設の保安検査を冷凍保安責任者に行わせなければならない。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事（または協会・指定機関）が行う行政検査であり、自社の冷凍保安責任者が行うものではない（誤り）。"}, {"id": 226, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問16", "branch": "イ", "theme": "圧縮機取替の軽微変更（事例2）", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものは、軽微な変更の工事として、その完成後遅滞なく、都道府県知事に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で、切断溶接なし・能力変更なしの設備取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 227, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問16", "branch": "ロ", "theme": "通常設備C増設の許可必要（事例2）", "question": "（R134a 600t）この製造施設に製造設備Aと同じ製造設備Cを増設し、製造設備A及びBとブラインを共通にするときは、軽微な変更の工事として、都道府県知事に届け出ればよい。", "answer": "×", "law": "法第14条第1項、冷規第17条第1項第4号", "explanation": "認定指定設備の増設は軽微工事だが、設備Aと同じ通常設備Cの増設は軽微工事にならず、都道府県知事の変更許可が必要（誤り）。"}, {"id": 228, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問16", "branch": "ハ", "theme": "完成検査不要の変更工事（事例2）", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更が所定の範囲であるものは、都道府県知事の許可を受けなければならないが、その変更の工事の完成後、その製造施設の完成検査を受けることなく使用することができる。", "answer": "○", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "不活性フルオロカーボン設備で切断溶接なし・能力変更が所定範囲内（20%以内）の取替えは、許可は必要だが完成検査なしで使用できる。"}, {"id": 229, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問17", "branch": "イ", "theme": "安全弁止め弁の全開義務（事例2）", "question": "（R134a 600t）冷媒設備の安全弁に付帯して設けた止め弁は、常に全開しておかなければならないが、その安全弁の修理又は清掃のため特に必要な場合に限り閉止してよい。", "answer": "○", "law": "冷規第9条第1号", "explanation": "安全弁に付帯する止め弁は常に全開が原則であり、修理・清掃のため特に必要な場合に限り閉止が認められる。"}, {"id": 230, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問17", "branch": "ロ", "theme": "日常点検の頻度（1日1回）（事例2）", "question": "（R134a 600t）高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日に1回以上その製造設備の属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "○", "law": "冷規第9条第2号", "explanation": "日常の製造保安管理として、1日に1回以上製造施設全体の異常の有無を点検することが義務付けられている。"}, {"id": 231, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問17", "branch": "ハ", "theme": "修理清掃の作業計画（事例2）", "question": "（R134a 600t）冷媒設備の修理又は清掃は、あらかじめ、その作業計画及びその作業の責任者を定めて行わなければならない。", "answer": "○", "law": "冷規第9条第3号イ", "explanation": "冷媒設備の修理又は清掃を行う際は、あらかじめ作業計画及び作業責任者を定めて行わなければならない。"}, {"id": 232, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問18", "branch": "イ", "theme": "警戒標の掲示義務（事例2）", "question": "（R134a 600t）製造施設には、その製造施設の外部から見やすいように警戒標を掲げなければならない。", "answer": "○", "law": "冷規第7条第1項第2号", "explanation": "製造施設の外部から見やすい箇所への警戒標掲示は、第一種製造施設全般に義務付けられている。"}, {"id": 233, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問18", "branch": "ロ", "theme": "油圧系統の圧力計免除（事例2）", "question": "（R134a 600t）この製造施設の冷媒設備には圧力計を設けなければならないが、その冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その圧縮機の油圧系統には圧力計を設けなくてよい。", "answer": "○", "law": "冷規第7条第1項第7号", "explanation": "強制潤滑方式で油圧保護装置（OPS）を有している場合、当該圧縮機の油圧系統への圧力計の取り付けは免除される。"}, {"id": 234, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問18", "branch": "ハ", "theme": "気体耐圧試験の圧力基準（事例2）", "question": "（R134a 600t）この製造施設の配管以外の冷媒設備について行う耐圧試験は、「水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力以上の圧力で行うことができる。」と定められている。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "気体を使用して耐圧試験を行う場合の圧力は「許容圧力の1.25倍以上」である（「許容圧力以上」は誤り）。"}, {"id": 235, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問19", "branch": "イ", "theme": "バルブ適切操作措置（事例2）", "question": "（R134a 600t）この製造設備Aに設けたバルブ又はコックであって、操作ボタン等を使用することなく自動制御で開閉されるバルブ又はコック以外のものには、作業員が適切にそのバルブ又はコックを操作することができるような措置を講じなければならない。", "answer": "○", "law": "冷規第7条第1項第17号", "explanation": "完全自動制御以外のバルブ・コックには、作業員が適切に操作できる措置（識別表示・誤操作防止等）を講じる必要がある。"}, {"id": 236, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問19", "branch": "ロ", "theme": "配管工事の気密試験圧力（事例2）", "question": "（R134a 600t）この製造設備Aの冷媒設備の配管の変更の工事の完成検査において行う気密試験の圧力は、許容圧力以上の圧力としなければならない。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "完成検査における気密試験は「許容圧力以上の圧力」で行わなければならない。"}, {"id": 237, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問19", "branch": "ハ", "theme": "安全装置の設置（事例2）", "question": "（R134a 600t）この冷媒設備には、その設備内の冷媒ガスの圧力が許容圧力を超えた場合に直ちにその圧力を許容圧力以下に戻すことができる安全装置を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第8号", "explanation": "冷媒設備内の圧力が許容圧力を超えた場合に直ちに許容圧力以下に戻す安全装置（安全弁等）の設置が義務付けられている。"}, {"id": 238, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の組立場所（事例2）", "question": "（R134a 600t・設備B）この設備の冷媒設備は、使用場所であるこの事業所において脚上又は1つの架台上に組み立てられたものでなければならない。", "answer": "×", "law": "冷規第57条第3号", "explanation": "指定設備は「製造業者の事業所において」脚上又は一つの架台上に組み立てられたものでなければならない（使用場所において組み立ては誤り）。"}, {"id": 239, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の止め弁（手動禁止）（事例2）", "question": "（R134a 600t・設備B）この設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用することができる。", "answer": "×", "law": "冷規第57条第12号", "explanation": "日常の運転操作に必要となる冷媒ガスの止め弁には「手動式のものを使用しないこと」と定められている（使用できるは誤り）。"}, {"id": 240, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備改造時の失効（事例2）", "question": "（R134a 600t・設備B）この設備に変更の工事を施すと、指定設備認定証が無効になる場合がある。", "answer": "○", "law": "冷規第62条第1項第1号", "explanation": "同等部品交換以外の変更工事を施したときは、指定設備認定証が無効となるため正。"}, {"id": 241, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "イ", "theme": "法の目的（自主活動促進）", "question": "高圧ガス保安法は、公共の安全を確保することを目的としており、高圧ガスによる災害を防止するため、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱を規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することが定められている。", "answer": "○", "law": "法第1条", "explanation": "法第1条に定められた法の目的に完全に合致する。行政による規制と民間・協会の自主的保安活動の促進が2大支柱である。"}, {"id": 242, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガス定義（圧縮ガス）", "question": "現在の圧力が0.1メガパスカルの圧縮ガス（圧縮アセチレンガスを除く。）であって、温度35度において圧力が0.2メガパスカルとなるものは、高圧ガスである。", "answer": "×", "law": "法第2条第1号", "explanation": "圧縮ガスが高圧ガスとなるのは常用温度で現に1 MPa以上、または温度35度において1 MPa以上となるものである。35度で0.2 MPaは要件を満たさない（高圧ガスではない）。"}, {"id": 243, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ハ", "theme": "高圧ガス定義（液化ガス）", "question": "現在の圧力が0.1メガパスカルの液化ガスであって、温度35度において圧力が1メガパスカルとなるものは、高圧ガスである。", "answer": "○", "law": "法第2条第3号", "explanation": "液化ガスは圧力が0.2 MPa以上となる場合の温度が35度以下であれば高圧ガスとなる。35度で1 MPa（0.2 MPa超）となるため高圧ガスに該当する。"}, {"id": 244, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "イ", "theme": "適用除外（フルオロカーボン）", "question": "1日の冷凍能力が5トン未満の冷凍設備内における冷媒ガスである全てのフルオロカーボンは、高圧ガス保安法の適用を受けない。", "answer": "×", "law": "令第2条第3項第3号・第4号", "explanation": "全冷媒一律で適用除外となるのは3トン未満。3トン以上5トン未満で適用除外となるのは「不活性のフルオロカーボン及び二酸化炭素」に限られ、全てのフルオロカーボンではない（誤り）。"}, {"id": 245, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ロ", "theme": "認定指定設備の届出", "question": "1日の冷凍能力が250トンの認定指定設備のみを使用して冷凍のため高圧ガスの製造をしようとする者は、製造開始の日の20日前までに、その旨を都道府県知事に届け出なければならない。", "answer": "○", "law": "法第5条第2項第2号、令第4条、法第56条の7", "explanation": "認定指定設備のみを用いる製造者は第一種（許可）から除外され、第二種製造者として製造開始の20日前までに知事へ届け出ればよい。"}, {"id": 246, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ハ", "theme": "機器製造業者の定義", "question": "「機器製造業者」とは、もっぱら冷凍設備に用いる機器であって、所定の機器の製造の事業を行う者である。", "answer": "○", "law": "法第57条、冷規第63条", "explanation": "専ら冷凍設備に用いる機器（冷凍機等）であって政令・省令で定めるものの製造事業を行う者を「機器製造業者」と定義している。"}, {"id": 247, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "イ", "theme": "製造開始・廃止の届出", "question": "第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事に届け出なければならない。", "answer": "○", "law": "法第21条第1項", "explanation": "第一種製造者は、高圧ガスの製造を開始したとき又は廃止したときは、遅滞なく知事へ届け出なければならない。"}, {"id": 248, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ロ", "theme": "地位の承継（事業譲渡）", "question": "第一種製造者がその高圧ガスの製造事業の全部を譲り渡したときは、その事業の全部を譲り受けた者はその第一種製造者の地位を承継する。", "answer": "×", "law": "法第10条、法第20条第2項", "explanation": "事業譲渡による地位承継の規定はない。譲受人は新規に製造許可を取得する必要がある（誤り）。"}, {"id": 249, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ハ", "theme": "ガス種・製造方法変更の許可", "question": "第一種製造者は、製造をする高圧ガスの種類又は製造の方法を変更しようとするときは、あらかじめ、その旨を都道府県知事に届け出なければならない。", "answer": "×", "law": "法第14条第1項", "explanation": "第一種製造者がガス種や製造方法を変更しようとするときは、届出ではなく事前に都道府県知事の「許可」を受けなければならない（誤り）。"}, {"id": 250, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者区分（アンモニア10t）", "question": "アンモニアを冷媒ガスとする冷凍設備であって、1日の冷凍能力が10トンのもののみを使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条第2項第2号、令第4条", "explanation": "アンモニアは1日の冷凍能力が5トン以上50トン未満が第二種製造者に該当するため、10トンの設備は第二種製造者となる。"}, {"id": 251, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ロ", "theme": "日常点検（1日1回以上）", "question": "高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日1回以上その製造設備の属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "○", "law": "冷規第9条第2号、法第12条第2項", "explanation": "第二種製造者にも準用される製造方法の基準として、1日1回以上の異常点検および補修等の危険防止措置が義務付けられている。"}, {"id": 252, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ハ", "theme": "定期自主検査記録の記載事項", "question": "定期自主検査を実施しなければならない冷凍設備において、定期自主検査の検査記録に記載すべき事項の一つに「検査をした製造施設の設備ごとの検査方法及び結果」がある。", "answer": "○", "law": "法第35条の2、冷規第44条第5項第2号", "explanation": "定期自主検査記録の法定記載事項に「設備ごとの検査方法及び結果」が明記されている。"}, {"id": 253, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "イ", "theme": "車両移動（書面交付・携帯）", "question": "アンモニアを移動する場合は、その高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。", "answer": "○", "law": "一般則第49条第1項第21号、同第50条第13号", "explanation": "毒性・可燃性であるアンモニアの移動時には、イエローカード（注意事項記載書面）の交付・携帯・遵守義務がある。"}, {"id": 254, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ロ", "theme": "車両移動（木枠・パッキン）", "question": "アンモニアを移動する場合は、その充てん容器及び残ガス容器には木枠又はパッキンを施さなければならない。", "answer": "○", "law": "一般則第50条第8号", "explanation": "毒性ガス（アンモニア等）の充填容器等（充填容器及び残ガス容器）には木枠又はパッキンを施さなければならない。"}, {"id": 255, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ハ", "theme": "車両移動（警戒標掲示範囲）", "question": "アンモニアを移動する場合は、その車両の見やすい箇所に警戒標を掲げなければならないが、フルオロカーボン（不活性のものに限る。）を移動する場合は、その車両に警戒標を掲げるべき定めはない。", "answer": "×", "law": "法第23条第2項、一般則第50条第1号", "explanation": "警戒標の掲示義務は、不活性ガスを含むすべての高圧ガス充てん容器等の移動に適用される（定めがないは誤り）。"}, {"id": 256, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "イ", "theme": "容器の刻印事項（充填質量刻印）", "question": "液化ガスを充てんする容器には、その容器に充てんすることができる最大充てん質量の数値の刻印がされている。", "answer": "×", "law": "法第48条第4項第1号、容規第8条第1項第6号", "explanation": "容器に刻印されるのは「内容積（V）」等であり、最大充てん質量の数値自体が刻印されるわけではない（計算式 G=V/C により算出するため誤り）。"}, {"id": 257, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ロ", "theme": "アンモニア容器の性質明示（燃・毒）", "question": "液化アンモニアを充てんする容器の外面には、その高圧ガスの名称並びに性質を示す文字「燃」及び「毒」を明示しなければならない。", "answer": "○", "law": "容規第10条第1項第2号ロ", "explanation": "可燃性かつ毒性ガスであるアンモニア容器の外面には、名称とともに「燃」及び「毒」の文字を明示しなければならない。"}, {"id": 258, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ハ", "theme": "不合格容器のくず化処分", "question": "容器の所有者は、容器再検査に合格しなかった容器について所定の期間内に所定の刻印等がされなかったときは、遅滞なく、これをくず化し、その他容器として使用することができないように処分しなければならない。", "answer": "○", "law": "法第56条第3項", "explanation": "容器再検査に不合格となった容器について3月以内に刻印等されないときは、遅滞なくくず化等の処分を行わなければならない。"}, {"id": 259, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "イ", "theme": "貯蔵基準適用の質量区分", "question": "貯蔵の方法に係る技術上の基準に従って貯蔵しなければならない液化ガスは、毒性ガスにあってはその質量が1.5キログラムを超えるもの、不活性ガスにあってはその質量が5キログラムを超えるものと定められている。", "answer": "×", "law": "法第15条第1項、一般則第19条第1項・第2項", "explanation": "貯蔵技術基準が適用される液化ガスの限度（1.5 kg超）は全ガス種共通であり、不活性ガスを5 kg超とする区分はないため誤り。"}, {"id": 260, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ロ", "theme": "アンモニア容器貯蔵の通風", "question": "液化アンモニアの充てん容器及び残ガス容器は、通風の良い場所で貯蔵しなければならない。", "answer": "○", "law": "一般則第18条第2号イ、同第6条第1項第42号", "explanation": "可燃性ガス又は毒性ガス（アンモニア）の充てん容器等は、通風の良い場所で貯蔵しなければならない。"}, {"id": 261, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ハ", "theme": "可燃性ガス置場の燈火制限", "question": "液化アンモニアの容器置場には携帯電燈以外の燈火を携えて立ち入ってはならない。", "answer": "○", "law": "一般則第6条第2項第8号チ", "explanation": "可燃性ガス（アンモニアを含む）の容器置場には、携帯電燈以外の火気・燈火を携えて立ち入ることは禁止されている。"}, {"id": 262, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定（遠心式吐出し量）", "question": "遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つに、圧縮機の標準回転速度における1時間当たりの吐出し量の数値がある。", "answer": "×", "law": "冷規第5条第1号・第4号", "explanation": "吐出し量（V）を用いるのは容積圧縮式等（第4号設備）。遠心式（第1号設備）は原動機定格出力（W）を用いるため誤り。"}, {"id": 263, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍能力算定（吸収式入熱量）", "question": "吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つに、発生器を加熱する1時間の入熱量の数値がある。", "answer": "○", "law": "冷規第5条第2号", "explanation": "吸収式冷凍設備（第2号設備）の冷凍能力算定には、発生器を加熱する入熱量（Q）が用いられる。"}, {"id": 264, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍能力算定（多段圧縮表面積）", "question": "多段圧縮方式による製造設備の1日の冷凍能力の算定に必要な数値の一つに、蒸発器の冷媒ガスに接する側の表面積の数値がある。", "answer": "×", "law": "冷規第5条第3号・第4号", "explanation": "蒸発器表面積（A）を用いるのは自然循環式・自然還流式（第3号）。多段圧縮方式等の容積圧縮式は気筒寸法や回転速度等による押しのけ量を用いるため誤り。"}, {"id": 265, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の認可不要（事例1）", "question": "（アンモニア250t）危害予防規程を定め、都道府県知事の許可を受けなければならない。また、これを変更したときも同様である。", "answer": "×", "law": "法第26条第1項", "explanation": "危害予防規程は知事等に「届出」を行うものであり、「許可（認可）」を受ける必要はない（誤り）。"}, {"id": 266, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ロ", "theme": "保安教育計画の実行届（事例1）", "question": "（アンモニア250t）従業者に対する保安教育計画を定め、これを忠実に実行しなければならない。また、その実行結果を都道府県知事に届け出なければならない。", "answer": "×", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務だが、実行結果を都道府県知事に届け出る義務は課されていない（誤り）。"}, {"id": 267, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ハ", "theme": "危険時の通報義務（発見者）（事例1）", "question": "（アンモニア250t）高圧ガスの製造施設が危険な状態になったときは、直ちに、応急の措置を講じなければならない。また、この事業者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。", "answer": "○", "law": "法第36条第1項・第2項", "explanation": "危険事態の発生時は直ちに応急措置を講じる義務があり、事態を発見した者は誰であっても直ちに知事・警察・消防等へ通報・届出を行う義務がある。"}, {"id": 268, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "イ", "theme": "指定場所の火気厳禁（何人も）（事例1）", "question": "（アンモニア250t）この事業者が事業所内において指定した場所では、この事業所の従業者といえども、何人も火気を取り扱ってはならない。", "answer": "○", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、自社の従業者であっても例外なく禁止される。"}, {"id": 269, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録の保存期間（事例1）", "question": "（アンモニア250t）事業所ごとに帳簿を備え、その製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載し、記載の日から5年間保存しなければならない。", "answer": "×", "law": "法第60条第1項、冷規第65条", "explanation": "製造施設の異常時記録帳簿の保存期間は記載の日から「10年間」である（5年間は誤り）。"}, {"id": 270, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ハ", "theme": "容器喪失時の届出義務（事例1）", "question": "（アンモニア250t）この事業者が所有し、又は占有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事又は警察官に届け出なければならないが、その所有し、又は占有する容器を喪失したときは届け出る必要はない。", "answer": "×", "law": "法第63条第1項第1号・第2号", "explanation": "高圧ガスの災害発生時だけでなく、所有・占有する容器を喪失又は盗難されたときも遅滞なく届出が必要（必要はないは誤り）。"}, {"id": 271, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "イ", "theme": "軽微な変更工事の事後届出（事例1）", "question": "（アンモニア250t）この製造施設の位置、構造又は設備について定められた軽微な変更の工事をしたときは、その完成後遅滞なく、その旨を都道府県知事に届け出なければならない。", "answer": "○", "law": "法第14条第2項", "explanation": "第一種製造者が定められた軽微な変更工事を行ったときは、工事完成後遅滞なく知事へ届け出なければならない。"}, {"id": 272, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ロ", "theme": "特定変更工事の完成検査機関（事例1）", "question": "（アンモニア250t）この製造施設の特定変更工事を完成したときに受ける完成検査は、都道府県知事又は高圧ガス保安協会若しくは指定完成検査機関のいずれかが行う。", "answer": "○", "law": "法第20条第3項", "explanation": "完成検査は都道府県知事が行うほか、高圧ガス保安協会又は指定完成検査機関で受検することができる。"}, {"id": 273, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ハ", "theme": "完成検査不要工事の適用除外（事例1）", "question": "（アンモニア250t）製造施設の位置、構造又は設備の変更の工事について、都道府県知事の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事があるが、この事業所の製造施設には適用されない。", "answer": "○", "law": "法第20条第3項、冷規第23条", "explanation": "完成検査不要の変更工事規定は可燃性・毒性ガス設備が除外されているため、アンモニア設備である本施設には適用されない。"}, {"id": 274, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "イ", "theme": "機械室のガス滞留防止構造（事例1）", "question": "（アンモニア250t）この製造施設の圧縮機、凝縮器若しくは受液器又はこれらの間の配管を設置する室は、冷媒ガスであるアンモニアが漏えいしたとき滞留しないような構造としなければならない。", "answer": "○", "law": "冷規第7条第1項第3号", "explanation": "毒性・可燃性のアンモニア設備を設置する機械室は、漏えい時にガスが滞留しない換気・開口部構造とする必要がある。"}, {"id": 275, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ロ", "theme": "換気設備による放出管免除（事例1）", "question": "（アンモニア250t）この専用機械室に常時強制換気できる装置を設けた場合は、冷媒設備の安全弁に設けた放出管の開口部の位置に係る定めは適用されない。", "answer": "×", "law": "冷規第7条第1項第9号", "explanation": "強制換気装置を設けていても、安全弁放出管の開口部位置に係る基準は免除されない（適用されないは誤り）。"}, {"id": 276, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ハ", "theme": "流出防止措置の対象容量（事例1）", "question": "（アンモニア250t）この受液器は、その周囲に液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第13号", "explanation": "毒性ガス受液器で流出防止措置（防液堤等）が必要なのは内容積「1万リットル以上」。本受液器は4,000 Lのため対象外（誤り）。"}, {"id": 277, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "イ", "theme": "凝縮器の耐震設計該当性（事例1）", "question": "（アンモニア250t）この凝縮器は、所定の耐震設計の基準により、地震の影響に対して安全な構造としなければならないものに該当する。", "answer": "○", "law": "冷規第7条第1項第5号", "explanation": "凝縮器で耐震設計が必要なのは「縦置円筒形で胴長5m以上」。本問の凝縮器は縦置・胴長6mのため該当する。"}, {"id": 278, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ロ", "theme": "毒性ガスの除害措置義務（事例1）", "question": "（アンモニア250t）この製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。", "answer": "○", "law": "冷規第7条第1項第16号", "explanation": "アンモニアは毒性ガスであるため、漏えい時に安全・速やかに除害する措置（除害設備・散水設備等）を講じる義務がある。"}, {"id": 279, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ハ", "theme": "機械室設置による警報器免除（事例1）", "question": "（アンモニア250t）この製造設備は専用機械室に設置されているので、製造施設から漏えいしたアンモニアが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなくてよい。", "answer": "×", "law": "冷規第7条第1項第15号", "explanation": "漏えい検知警報設備の設置義務は、専用機械室内に設置されていても免除されない（設けなくてよいは誤り）。"}, {"id": 280, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "イ", "theme": "冷凍保安責任者の選任要件（事例2）", "question": "（R134a 850t・設備A/B各300t+指定C250t）冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が100トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者のうちから選任しなければならない。", "answer": "○", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "一体管理される設備群では認定指定設備Cを除き、最大設備（または合算設備）の能力300t以上で判定。「1冷免状」＋「100t以上で1年の実務経験」が必要。"}, {"id": 281, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の事前選任・職務代行（事例2）", "question": "（R134a 850t）この事業所の冷凍保安責任者が旅行などのためその職務を行うことができない場合、あらかじめ選任した冷凍保安責任者の代理者にその職務を代行させなければならない。", "answer": "○", "law": "法第33条第1項", "explanation": "冷凍保安責任者が旅行・疾病等で職務を行えない場合に備え、あらかじめ選任した代理者に職務を代行させなければならない。"}, {"id": 282, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者・代理者の解任届（事例2）", "question": "（R134a 850t）冷凍保安責任者又はその代理者を解任し、新たに選任したときは、遅滞なく、新たに選任した者についてその旨を都道府県知事に届け出なければならないが、解任した者についてはその旨を都道府県知事に届け出る必要はない。", "answer": "×", "law": "法第27条の2第5項、法第27条の4第2項、法第33条第3項", "explanation": "責任者及び代理者を選任したときだけでなく「解任したとき」も遅滞なく知事に届け出なければならない（必要はないは誤り）。"}, {"id": 283, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "イ", "theme": "協会の保安検査受検届（事例2）", "question": "（R134a 850t）特定施設について、高圧ガス保安協会が行う保安検査を受けた場合、高圧ガス保安協会がその検査結果を都道府県知事に報告することとなっているので、その保安検査を受けた旨を都道府県知事に届け出る必要はない。", "answer": "×", "law": "冷規第41条第3項", "explanation": "協会等の保安検査を受けた第一種製造者は、自ら受検届書を知事に提出しなければならない（届出不要は誤り）。"}, {"id": 284, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ロ", "theme": "保安検査の対象（設備基準）（事例2）", "question": "（R134a 850t）保安検査は、製造施設の位置、構造及び設備並びに高圧ガスの製造の方法が所定の技術上の基準に適合しているかどうかについて行われる。", "answer": "×", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、「製造の方法（ソフト基準）」は含まれない（誤り）。"}, {"id": 285, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ハ", "theme": "特定施設からの指定設備除外（事例2）", "question": "（R134a 850t）保安検査を受けなければならない特定施設は、製造施設のうち、認定指定設備である製造設備Cの部分を除いたものである。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備である製造設備Cの部分は特定施設から除外されるため、保安検査の対象外となる。"}, {"id": 286, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問16", "branch": "イ", "theme": "指定設備の定期自主検査義務（事例2）", "question": "（R134a 850t）定期自主検査は、認定指定設備である製造設備Cの部分を含む製造施設について、1年に1回以上行わなければならない。", "answer": "○", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "第一種製造施設の定期自主検査は、認定指定設備（設備C）の部分も含めて1年に1回以上実施しなければならない。"}, {"id": 287, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問16", "branch": "ロ", "theme": "自主検査の監督（代理者代行）（事例2）", "question": "（R134a 850t）この事業者は、選任している冷凍保安責任者が疾病などのために定期自主検査の実施について監督を行わせることができない場合、選任している冷凍保安責任者の代理者に、その実施について監督を行わせなければならない。", "answer": "○", "law": "法第33条第1項、冷規第44条第4項", "explanation": "責任者が職務を行えないときは、あらかじめ選任された代理者が自主検査の実施監督を代行しなければならない。"}, {"id": 288, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問16", "branch": "ハ", "theme": "自主検査記録の法定記載事項（事例2）", "question": "（R134a 850t）定期自主検査の検査記録は、その記載すべき事項の定めはなく、事業者自らが製造施設の態様に応じ、検査記録の記載事項を定めればよい。", "answer": "×", "law": "冷規第44条第5項", "explanation": "定期自主検査記録には「設備ごとの検査方法及び結果」など法定記載事項が定められており、事業者が任意に定めればよいわけではない（誤り）。"}, {"id": 289, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問17", "branch": "イ", "theme": "指定設備の架台組立場所（事例2）", "question": "（R134a 850t・設備C）この製造設備の冷媒設備は、この設備の製造業者の事業所において脚上又は1つの架台上に組み立てられたものである。", "answer": "○", "law": "冷規第57条第3号", "explanation": "指定設備は、製造業者の事業所において脚上又は一つの架台上に組み立てられていることが構造条件である。"}, {"id": 290, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問17", "branch": "ロ", "theme": "指定設備の試運転・一体搬入（事例2）", "question": "（R134a 850t・設備C）この製造設備の冷媒設備は、この設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されたものである。", "answer": "○", "law": "冷規第57条第5号", "explanation": "製造業者の事業所で試運転を行い、現場に使用場所に分割されずに搬入されることが構造条件である。"}, {"id": 291, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問17", "branch": "ハ", "theme": "指定設備の手動止め弁禁止（事例2）", "question": "（R134a 850t・設備C）この製造設備が認定指定設備である条件の一つに、「日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用しないこと。」がある。", "answer": "○", "law": "冷規第57条第12号", "explanation": "日常の運転操作に必要となる冷媒ガスの止め弁に手動式のものを使用しないことが構造基準として定められている。"}, {"id": 292, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問18", "branch": "イ", "theme": "安全弁止め弁の全開義務（事例2）", "question": "（R134a 850t）冷媒設備の安全弁の修理又は清掃のため特に必要な場合を除き、その安全弁に付帯して設けた止め弁は、常に全開しておかなければならない。", "answer": "○", "law": "冷規第9条第1号", "explanation": "安全弁に付帯する止め弁は、修理・清掃時を除き「常に全開」にしておくことが義務付けられている。"}, {"id": 293, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問18", "branch": "ロ", "theme": "指定設備の日常点検除外（事例2）", "question": "（R134a 850t）高圧ガスの製造は、認定指定設備である製造設備Cの部分を除き、1日に1回以上製造施設の異常の有無を点検して行えばよい。", "answer": "×", "law": "冷規第9条第2号", "explanation": "日常点検（1日1回以上）は製造施設全般が対象であり、認定指定設備であっても点検対象から除外されない（誤り）。"}, {"id": 294, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問18", "branch": "ハ", "theme": "冷媒設備開放修理時の漏洩防止（事例2）", "question": "（R134a 850t）この製造設備の冷媒設備を開放して修理を行うときは、その開放する部分に他の部分からガスが漏えいすることを防止するための措置を講じて行わなければならない。", "answer": "○", "law": "冷規第9条第3号ハ", "explanation": "冷媒設備を開放して修理等を行うときは、開放部分に他の部分からガスが流入・漏えいすることを防止する措置を講じなければならない。"}, {"id": 295, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問19", "branch": "イ", "theme": "火気隔離基準（凝縮器）（事例2）", "question": "（R134a 850t）凝縮器は、火気（その製造設備内のものを除く。）の付近に設置してはならないが、その火気に対して安全な措置を講じた場合はこの限りでない。", "answer": "○", "law": "冷規第7条第1項第1号", "explanation": "凝縮器等の主要設備は火気の付近にあってはならないが、火気に対して安全な措置を講じた場合は設置が認められる。"}, {"id": 296, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問19", "branch": "ロ", "theme": "警戒標の掲示免除（機械室）（事例2）", "question": "（R134a 850t）この製造施設の製造設備は専用機械室に設置されているので、製造施設に警戒標を掲げる必要はない。", "answer": "×", "law": "冷規第7条第1項第2号", "explanation": "警戒標の掲示義務は専用機械室内に設置されている場合であっても免除されない（必要はないは誤り）。"}, {"id": 297, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問19", "branch": "ハ", "theme": "配管気密試験の基準定め（事例2）", "question": "（R134a 850t）冷媒設備の配管は、許容圧力以上の圧力で行う気密試験又は経済産業大臣がこれと同等以上のものと認めた高圧ガス保安協会が行う試験に合格するものである旨の定めはない。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "冷媒設備（配管を含む全体）は許容圧力以上の気密試験または同等試験に合格することが明確に規定されている（定めがないは誤り）。"}, {"id": 298, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問20", "branch": "イ", "theme": "安全装置の作動圧力基準（事例2）", "question": "（R134a 850t）冷媒設備には、その設備内の冷媒ガスの圧力が許容圧力の1.5倍を超えた場合に直ちに許容圧力以下に戻すことができる安全装置を設けなければならない。", "answer": "×", "law": "冷規第7条第1項第8号", "explanation": "安全装置が作動すべき圧力基準は「許容圧力を超えた場合」であり、「許容圧力の1.5倍」ではない（誤り）。"}, {"id": 299, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問20", "branch": "ロ", "theme": "油圧系統圧力計の免除（事例2）", "question": "（R134a 850t）冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その圧縮機の油圧系統には圧力計を設けなくてもよいが、その油圧系統を除く冷媒設備には圧力計を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第7号", "explanation": "油圧保護装置（OPS）がある場合に圧力計が免除されるのは「当該油圧系統」のみであり、それ以外の冷媒設備には圧力計の設置が必要である。"}, {"id": 300, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問20", "branch": "ハ", "theme": "バルブ適切操作措置（常時閉止）（事例2）", "question": "（R134a 850t）製造設備に設けたバルブ又はコック（自動制御で開閉されるものを除く。）のうち、通常は常に閉止しているものについては、作業員が当該バルブ又はコックを適切に操作することができるような措置を講じる必要はない。", "answer": "×", "law": "冷規第7条第1項第17号", "explanation": "通常常時閉止しているバルブ・コックであっても、適切に操作できる措置（開閉方向明示、誤操作防止等）を講じる義務は免除されない（必要はないは誤り）。"}, {"id": 301, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の構造（ロータリー）", "question": "全密閉形ロータリー圧縮機は、構造上、圧縮機の容器内は高圧であり、始動時のオイルフォーミングは発生しないが、圧縮機容器内で冷媒の凝縮が起こることがある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "全密閉形ロータリー圧縮機は容器内が高圧ガスで油も高圧側にあるため、往復式のような始動時オイルフォーミングは起きない。ただし低温始動時に高圧上昇が遅れると容器内で冷媒凝縮が起こることがある。"}, {"id": 302, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の構造（スクリュー）", "question": "半密閉コンパウンドスクリュー圧縮機では、一般に、中間冷却器からの冷媒ガスと低段側の吐出しガスを直接混合して、高段側に送る構造となっている。低段吐出しガス温度が比較的低いことから、低段吐出しガスは中間冷却器を通さない。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "低段吐出しガスは油を多く含み温度も比較的低いため、中間冷却器を通さず、中間冷却器で蒸発した蒸気と直接混合して高段側に送る。"}, {"id": 303, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の構造（スクロール）", "question": "スクロール圧縮機は、トルク変動が非常に小さいので、振動や騒音が小さく、体積効率と断熱効率が高く、高速回転に適しているが、内部容積比によって圧縮の組込み圧力比が決まる。用途に応じて、組込み圧力比は大きく異なるため、運転条件にあった内部容積比を実現する圧縮機が必要となる。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "スクロールの幾何学的構造で圧縮容積比（内部容積比）が決まり、それにより組込み圧力比が定まるため、運転条件に応じた設計の圧縮機が必要となる。"}, {"id": 304, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の弁構造", "question": "往復圧縮機、ロータリー圧縮機、スクロール圧縮機、スクリュー圧縮機および遠心圧縮機の中で、吸込み弁を必要とするのは往復圧縮機だけであるが、吐出し弁を必要とするのは往復圧縮機とスクロール圧縮機である。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "吐出し弁を必要とするのは「往復圧縮機」と「ロータリー圧縮機」である（スクロール圧縮機は吐出し弁を必要としないため誤り）。"}, {"id": 305, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "イ", "theme": "容量制御（ホットガスバイパス）", "question": "ホットガスバイパス容量制御において、ホットガスバイパス量が多くなると、凝縮器の熱負荷のほとんどが電動機の入力だけとなり、凝縮圧力が低くなりすぎるので、必要量のホットガスが吸込み側にバイパスできなくなる。したがって、凝縮圧力の異常低下を防ぐ必要がある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "バイパス量増大時は蒸発器負荷が入らず凝縮器熱負荷が電動機入力のみとなり凝縮圧力が低下しすぎる。差圧不足でバイパス不能になるのを防ぐため凝縮圧力の異常低下防止が必要。"}, {"id": 306, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ロ", "theme": "容量制御なしの挙動", "question": "圧縮機に容量制御装置がないと、負荷減少時に吸込み圧力が低下し、圧縮機の吸込み蒸気の比体積が大きくなり、冷媒循環量が増加し、1冷凍トン当たりの消費動力が増加するので成績係数が小さくなる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "吸込み圧力低下で比体積が大きくなると、冷媒循環量は「減少」する（「増加」は誤り）。1冷凍トン当たり消費動力が増加しCOPは低下する。"}, {"id": 307, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ハ", "theme": "吸入圧力調整弁", "question": "吸入圧力調整弁は、圧縮機吸込み蒸気配管に取り付け、吸込み蒸気を絞ることによって容量制御をする。一般に、吸入圧力調整弁を備えた冷凍装置では、始動時や蒸発器の除霜終了後の再始動時に、電動機が過負荷になりやすいので注意を要する。", "answer": "×", "law": "上級テキスト 制御弁編", "explanation": "吸入圧力調整弁（CPR）は下流側の吸込み圧力が所定値以上に上昇しないよう絞る弁であり、始動時や除霜後の電動機の過負荷を「防止」する（過負荷になりやすいは誤り）。"}, {"id": 308, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ニ", "theme": "オン・オフ制御", "question": "圧縮機の運転でオン・オフ制御を行う場合には、圧縮機吸込み側の低圧圧力スイッチ、または冷却室内装置のサーモスタットによって圧縮機を発停させる。この方法は、短い時間間隔で圧縮機が発停を繰り返すと、装置の効率低下、圧縮機の油上がり、電動機の過熱や焼損を生じるおそれがある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "オン・オフ制御で発停頻度が高すぎると、効率低下だけでなく油上がりやモータ過熱・焼損を招く恐れがある。"}, {"id": 309, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "イ", "theme": "スクリュー圧縮機の運転保守", "question": "スクリュー圧縮機の給油圧力は、差圧式の場合には吐出しガス圧力よりも0.2 MPaから0.3 MPa高い値が適正値である。また、スクリュー圧縮機の吐出しガス温度は、多気筒圧縮機のそれよりも低く、冷媒の種類にもよるが、通常90℃以下である。吐出しガス温度が高い場合は、油量不足、油温が高い、吸込み蒸気の過熱などが考えられる。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "差圧式の場合の給油圧力は吐出し圧力より「0.05〜0.15 MPa低い」値が適正値である（0.2〜0.3 MPa高い値とするのは「強制給油式」であり誤り）。"}, {"id": 310, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ロ", "theme": "往復圧縮機の潤滑・保護", "question": "中形や大形の往復圧縮機では油ポンプによる強制給油潤滑式が採用されており、油圧調整弁の調整不良で油圧が高くなりすぎると、油圧保護圧力スイッチが作動して、圧縮機を停止させる。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "油圧保護圧力スイッチ（OPS）が作動するのは、油圧が「低すぎるとき（油量不足・フィルタ目詰まり等）」に軸受焼付きを防ぐためである（高くなりすぎると作動は誤り）。"}, {"id": 311, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ハ", "theme": "湿り運転・液圧縮の安全装置", "question": "圧縮機の湿り運転の原因として、冷凍機負荷の急激な変化、往復圧縮機のアンロード運転からフルロード運転への切り替わり時、温度自動膨張弁の感温筒の吸込み管からの外れ、などが挙げられる。また、多気筒圧縮機の液圧縮発生時の安全装置としては、シリンダ頭部の安全ぶたがある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "負荷急変、アンロード切替時、感温筒外れ等は液戻り・湿り運転の原因となる。多気筒往復圧縮機では液圧縮時にスプリングで頭部が浮き上がる「安全ぶた」が保護装置となる。"}, {"id": 312, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ニ", "theme": "過熱運転の原因", "question": "吸込み蒸気の温度が上昇し、吸込み蒸気の過熱度が大きくなると、圧縮機は過熱運転となる。また、蒸発器熱負荷の過大や、冬季の凝縮圧力の大幅な低下などにより、圧縮機は過熱運転となることがある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吸込み過熱度大、熱負荷過大、冬季の凝縮圧力低下（膨張弁前後の差圧減少による冷媒供給不足）は圧縮機の過熱運転（吐出し温度上昇）を引き起こす。"}, {"id": 313, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "イ", "theme": "水冷横形凝縮器の凝縮温度変化", "question": "凝縮負荷一定で水冷横形シェルアンドチューブ凝縮器が運転されているときに、その凝縮温度が変化する場合がある。その原因として考えられるのは、冷却管の汚れなどによる熱通過率の変化、または、冷却水入口温度の変化の2つである。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "原因は「熱通過率の変化（汚れ）」「冷却水入口温度の変化」だけでなく「冷却水流量の変化」もあり、計3つである（2つであるは誤り）。"}, {"id": 314, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ロ", "theme": "ローフィンチューブの伝熱比", "question": "フルオロカーボン冷媒で水冷横形シェルアンドチューブ凝縮器を用いる場合、熱伝達率の小さい冷媒側に高さの低いフィンを設けたローフィンチューブ冷却管をつけて、冷媒側伝熱面積を大きくしている。このときの冷媒側と水側の伝熱面積の割合を有効内外伝熱面積比というが、その値は通常3.5から4.2くらいである。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "フルオロカーボンは凝縮熱伝達率が水側より小さいためローフィンを用い、冷媒側外表面積を内表面積の3.5〜4.2倍程度に設定する。"}, {"id": 315, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ハ", "theme": "空冷凝縮器の冬季制御と受液器", "question": "空冷凝縮器を用いた冷凍装置が、冬季に冷凍能力の低下を起こすことを防止するため、凝縮圧力調整弁を使用して凝縮器内の冷媒液量を調節して凝縮能力を制御することがある。その際に受液器を別途必要とするが、その理由は、液管内におけるフラッシュガスの発生を防止するためである。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "凝縮器内に液を滞留させて伝熱面積を減らし圧力を維持する際、液管内の冷媒が不足してフラッシュガスが生じるのを防ぐため受液器が必要となる。"}, {"id": 316, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ニ", "theme": "液封時の比体積増加割合", "question": "液封は、配管などに液が充満した状態で、出入り口の両端が封鎖された状態をいう。この状態で液温が上昇すると、その比体積が増加することで封鎖された内部は、著しく高圧となる。通常使われる温度において、アンモニアとR410Aを比較した場合、液温上昇による比体積の増加割合が大きいのはアンモニアである。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "温度上昇に伴う液の比体積増加割合は、R410A（9.3%：-30℃→0℃）のほうがアンモニア（6.1%）よりも大きい（「大きいのはアンモニア」は誤り）。"}, {"id": 317, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "イ", "theme": "蒸発器の冷媒循環量不足", "question": "蒸発器には、熱負荷の増減に応じて膨張弁から適切な量の冷媒液が供給される必要がある。その冷媒循環量が不足する原因として、過小な容量の膨張弁を選定したこと、フラッシュガスの発生などが挙げられる。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "膨張弁容量不足、液管内フラッシュガス発生、冷媒充填量不足などは蒸発器への冷媒供給量不足（循環量不足）の原因となる。"}, {"id": 318, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ロ", "theme": "蒸発温度差の設定", "question": "一般的な冷凍装置の蒸発器における蒸発温度と被冷却物との温度差は、利用用途ごとに、ある程度経験的に決まっている。例えば、空気冷却器の温度差は、空調用で15Kから20K、冷蔵用で5Kから10Kとしている。この温度差が大きすぎると、伝熱面積の大きな蒸発器を必要とするうえ、成績係数の低下を招く。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "伝熱面積の大きな蒸発器が必要となるのは「温度差が小さすぎる」場合である（大きすぎると蒸発温度が下がりCOPは低下するが、伝熱面積は小さくて済むため誤り）。"}, {"id": 319, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ハ", "theme": "乾式蒸発器の液戻り対策", "question": "フィンコイル乾式蒸発器を用いた冷凍装置における液戻り対策として、運転停止時に蒸発器内に冷媒液を残留させておくことが挙げられる。これは、再起動時に蒸発器内の液による液戻りを起こすことを防ぐためである。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "液戻り対策としては、停止時に圧縮機で蒸発器内の冷媒を回収（ポンプダウン）し、蒸発器内に冷媒液を「残留させない」ようにする（残留させておくは誤り）。"}, {"id": 320, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ニ", "theme": "感温筒の立ち上がり配管取付", "question": "冷凍装置の負荷は時間とともに変化するため、その変化に応じて、温度自動膨張弁が確実に動作することが必要であり、感温筒の取り付け方が重要である。外部均圧形温度自動膨張弁において、感温筒を吸込み蒸気配管の立ち上がり配管に取り付ける場合、感温筒はキャピラリチューブ側を上にして取り付ける。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "立ち上がり配管に取り付ける際は、感温筒内の液がキャピラリ側へ逃げないようキャピラリチューブ側を上にして取り付ける。"}, {"id": 321, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "イ", "theme": "蒸発器伝熱量と冷凍能力", "question": "フィンコイル乾式蒸発器において、その伝熱量は、熱通過率K、空気側有効伝熱面積Aおよび、空気と冷媒の算術平均温度差Δtmの積 KAΔtmで表される。有効伝熱面積が一定で熱通過率が低下した場合でも、蒸発温度が低下し、空気と冷媒の温度差が大きくなるため冷凍装置の冷凍能力は変化しない。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "熱通過率Kが低下すると蒸発温度が下がり温度差は拡大するが、冷媒循環量減少・圧縮機効率低下により冷凍能力は「低下」する（変化しないは誤り）。"}, {"id": 322, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ロ", "theme": "空冷凝縮器の設計温度差", "question": "空冷凝縮器では、冷媒と空気との算術平均温度差が大きいほど凝縮作用が活発となるため、凝縮液膜が厚くなる。その結果、冷媒側の熱伝達率が小さくなる。このため、空冷凝縮器の設計で伝熱面積を決定するにあたり、一般に、入口空気温度より5Kから6K高い凝縮温度となるようにする。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "空冷凝縮器では通常、入口空気温度より「12K〜20K高い」凝縮温度になるよう伝熱面積を設計する（5〜6Kは「水冷凝縮器」の温度差であり誤り）。"}, {"id": 323, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ハ", "theme": "水冷凝縮器の汚れと温度差増加", "question": "ローフィンチューブを用いる水冷凝縮器において、設計時の冷媒と冷却水の温度差を大きくすると、管内面の汚れに起因する冷媒と冷却水の温度差の増加割合も大きくなる。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "熱流束が大きい（設計温度差Δtが大きい）設計では、汚れ係数増加に伴う水側温度差Δtwの増加分が大きくなるため正。"}, {"id": 324, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ニ", "theme": "凝縮器内不凝縮ガスの影響", "question": "凝縮器内に不凝縮ガスが存在すると、伝熱が阻害される。これは、不凝縮ガスを含む混合気境界層が液膜の外側に存在するため、冷媒の液膜表面温度が冷媒蒸気分圧の圧力に対応する飽和温度まで低下することによる。装置を運転中に不凝縮ガスが凝縮器内に侵入すると、凝縮負荷が一定の条件では、気液界面と伝熱面との温度差が凝縮負荷に見合った温度差になるまで凝縮器内の圧力が高くなって平衡する。", "answer": "○", "law": "上級テキスト 熱交換器編", "explanation": "不凝縮ガスにより界面での冷媒分圧が下がり飽和温度が低下するため熱伝達が阻害され、一定凝縮負荷を処理するために凝縮圧力が上昇して平衡する。"}, {"id": 325, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁・感温筒の取付位置", "question": "温度自動膨張弁本体の取付位置は蒸発器入口に近く、また、感温筒の取付位置は蒸発器出口に近いほうが、過熱度制御の安定性がよい。特に、蒸発器出入り口配管（冷媒液配管と圧縮機吸込み配管）が長い場合には、膨張弁本体と感温筒を蒸発器から大きく離れた位置に取り付けないようにする。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "膨張弁と感温筒が蒸発器から離れすぎると応答遅れによるハンチングが発生しやすいため、蒸発器出入口の近傍に取り付ける。"}, {"id": 326, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ロ", "theme": "定圧自動膨張弁の動作", "question": "定圧自動膨張弁は、高圧冷媒液を絞り膨張して、一定の蒸発器内圧力を保持するための減圧弁の一種である。圧縮機が停止して、低圧圧力が高いときには、定圧自動膨張弁が閉じており、圧縮機が始動すると、低圧圧力が膨張弁の設定圧力に下がってから冷媒の送液を開始する。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "定圧膨張弁は下流側（蒸発圧力）を一定に保つ弁であり、停止時の高圧では全閉し、始動後圧力が下がってから開いて送液を開始する。"}, {"id": 327, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ハ", "theme": "クロスチャージ方式の特徴", "question": "温度自動膨張弁のクロスチャージ方式の特徴は、液チャージ方式などの、使用する蒸発温度域によって過熱度が変わる欠点を除いたことにより、蒸発温度が高温でも低温でも、ほぼ同じ過熱度設定値が保持できることである。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "感温筒内の媒体特性曲線を冷媒と交差（クロス）させることで、広い蒸発温度範囲にわたってほぼ均一な過熱度制御を維持できる。"}, {"id": 328, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ニ", "theme": "キャピラリチューブ内の状態変化", "question": "キャピラリチューブに過冷却状態で流入した冷媒液が、自己蒸発することで気液二相状態になると、蒸気の流速が上昇し、摩擦抵抗が著しく増大するので、冷媒の圧力が大きく低下し、温度を保持したままキャピラリチューブ出口から流出する。", "answer": "×", "law": "上級テキスト 膨張機構編", "explanation": "気液二相状態になると摩擦抵抗増大に伴い圧力低下とともに「温度も大きく低下」して流出する（「温度を保持したまま」は誤り）。"}, {"id": 329, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "イ", "theme": "温度式冷却水調整弁の特徴", "question": "温度式冷却水調整弁は、冷媒に直接触れることなく動作するので、凝縮器以外のオイルクーラなどの液体の温度制御用にも使える。温度式冷却水調整弁の特徴は、一般に、弁の応答の遅れが大きく、緩やかな制御になり、冷媒側と絶縁されて安全性が高く、調整弁の交換が容易なことである。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "感温部と冷却水との伝熱で作動するため応答は遅く緩やかだが、冷媒回路から独立しており安全性・メンテナンス性に優れる。"}, {"id": 330, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ロ", "theme": "直動形凝縮圧力調整弁の動作", "question": "直動形凝縮圧力調整弁は、空冷凝縮器の出口側に取り付け、調整弁の出口圧力が低下すると弁が閉じ、上昇すると弁が開く圧力比例制御弁である。凝縮圧力調整弁は、必要とする凝縮圧力に設定し、夏季の外気温度が高いときには全開となり、冷媒液の流れの抵抗は最小の状態となる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "弁の開閉を制御するのは出口圧力ではなく「入口側圧力（凝縮器側圧力）」である（入口圧力が低下すると閉じ、上昇すると開くため誤り）。"}, {"id": 331, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ハ", "theme": "吸入圧力調整弁の制御目的", "question": "吸入圧力調整弁は、圧縮機の吸込み圧力が低下して圧縮機が過熱しないように、圧縮機吸込み冷媒量を調整して圧縮機の吸込み圧力を維持する圧力調整弁であり、圧縮機吸込み蒸気配管に取り付けられる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（CPR）は吸込み圧力が「上昇しすぎて電動機が過負荷になるのを防ぐ」ために絞る弁である（低下防止・過熱防止とする記述は誤り）。"}, {"id": 332, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ニ", "theme": "蒸発圧力調整弁の特性", "question": "蒸発圧力調整弁を流れるときの冷媒の状態変化は、等エンタルピーの絞り膨張である。圧縮機能力に対して蒸発器の冷却負荷が小さくなった場合は、蒸発圧力調整弁での圧力降下が大きくなるので、圧縮機吸込み圧力が大きく低下し、冷凍装置の成績係数が低下する。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は等エンタルピー絞り膨張を行う。負荷減少時は蒸発圧力を保つため弁が絞られて圧力降下が大きくなり、圧縮機吸込圧力が低下してCOPは悪化する。"}, {"id": 333, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "イ", "theme": "低圧フロート弁", "question": "満液式蒸発器、低圧受液器、中間冷却器などの液面レベルを一定に保持するためのフロート弁は、低圧フロート弁と呼ばれ、高圧冷媒液を絞り膨張させて低圧機器内に送液する。フロート弁は、一般に、各種冷媒で共用になっているが、冷媒液の密度の違いによる影響は小さい。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "低圧フロート弁は液面を直接検知して高圧液を絞り送液する。冷媒ごとの密度差による浮力影響は比較的小さく共用設計されることが多い。"}, {"id": 334, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ロ", "theme": "電磁弁の作動差圧", "question": "電磁弁は、冷媒用、水用、ブライン用などがあり、用途に応じて使い分ける。直動式の電磁弁は、その作動機構により弁前後の圧力差がゼロでも開閉できるが、パイロット式電磁弁は弁前後の圧力差が十分でないと作動しないことがあるので注意が必要である。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "直動式はソレノイドの力で直接開閉するため差圧ゼロでも作動するが、パイロット式は主弁開閉に冷媒前後の作動差圧（通常7〜30 kPa）が必要となる。"}, {"id": 335, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ハ", "theme": "高圧圧力スイッチの復帰方式", "question": "高圧圧力スイッチを安全装置として使用する冷凍装置では、一般に、冷媒圧力が上昇して設定圧力になった場合、圧縮機電源回路を遮断して圧縮機を停止させる。異常高圧で作動した場合には、冷凍装置の停止した原因を修復してから運転再開する必要がある。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "安全装置としての高圧圧力スイッチは異常高圧時に電源を遮断して停止させる。原因排除後に再起動させるため原則として手動復帰形が用いられる。"}, {"id": 336, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ニ", "theme": "バイメタル式サーモスタットの原理", "question": "バイメタル式サーモスタットは、熱伝導率の異なる2種類の金属を溶着または一緒にロール加工して作られ、温度が変化すると機械的なわん曲を生じる。バイメタル式サーモスタットは、このわん曲による力を利用して電気接点の開閉を行う。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "バイメタルは「熱膨張係数（熱膨張率）」の異なる2種類の金属を貼り合わせたものである（「熱伝導率の異なる」は誤り）。"}, {"id": 337, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "イ", "theme": "バッフル式油分離器", "question": "油分離器は、冷凍装置の圧縮機と凝縮器との間に設置し、圧縮機吐出しガスに含まれている油を分離する附属機器であり、バッフル式、金網式、デミスタ式などの油分離器がある。バッフル式油分離器は、多数の小孔がある複数枚のバッフル板を立型円筒内に斜めに設け、吐出しガスが小孔を通る際に油滴を分離する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "圧縮機〜凝縮器間に設置し、傾斜した多数小孔のバッフル板にガスを衝突・通過させて油滴を慣性分離する。"}, {"id": 338, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ロ", "theme": "高圧受液器の液面計", "question": "高圧受液器は、凝縮器で凝縮した冷媒液を蓄える容器であり、この容器内で凝縮器と蒸発器の冷媒量の変化を吸収し、冷凍装置を円滑に運転できるようにする。一般に、大形の受液器には反射式液面計を取り付け、小容量の受液器にはサイトグラスを設置したりする。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "受液器は負荷変動による冷媒量変化を吸収する。大形には自動閉止弁付き反射式ガラス液面計、小形にはサイトグラスが用いられる。"}, {"id": 339, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ハ", "theme": "低圧受液器の気液分離機能", "question": "低圧受液器は、冷媒液強制循環式冷凍装置の蒸発器冷却管に低圧冷媒液を送り込む液溜めの役割をもっている。一般に、蒸発器から低圧受液器に戻ってくる冷媒は気液混合状態であり、圧縮機へ液戻りしないように、圧縮機の吸込み配管には液分離器を取り付ける必要がある。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器自体が気液分離器（液分離器）の機能を兼ね備えているため、吸込み配管に別途液分離器を取り付ける必要はない（誤り）。"}, {"id": 340, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ニ", "theme": "ろ過乾燥器とアンモニア冷媒", "question": "フルオロカーボン冷凍装置に取付ける、ろ過乾燥器の乾燥剤には、水分を吸着しても化学変化せず、砕けにくいゼオライト、活性アルミナ、シリカゲルなどが用いられる。アンモニア冷凍装置の冷媒系統内の水分はアンモニアと結合しているため、乾燥剤による吸着分離効果は期待できない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "フルオロカーボンにはドライヤ（ゼオライト等）が必須だが、アンモニアは水と極めて強く結合するため乾燥剤での吸着分離はできず設置しない。"}, {"id": 341, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "イ", "theme": "液ガス熱交換器とアンモニア", "question": "液ガス熱交換器は、凝縮器から出た高温冷媒液と、蒸発器から出た低温冷媒蒸気との間で熱交換させるものであり、アンモニア冷凍装置では、圧縮機の吸込み蒸気過熱度の増大にともなう吐出しガス温度の上昇が著しいので、使用されない。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "アンモニアは断熱指数が大きく吸込み過熱による吐出し温度上昇が著しいため、液ガス熱交換器は使用しない。"}, {"id": 342, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ロ", "theme": "油回収器の加熱源", "question": "フルオロカーボン冷凍装置において、満液式蒸発器や低圧受液器に入り込んだ冷凍機油は冷媒液に溶解しているので、油だけを分離して容器外に抜き出すことはできない。そこで、油の濃度が高い冷媒液を抜き出し、冷媒液は加熱して蒸気とし、冷媒と油に分離する機能をもった油回収器を使用する。不燃性冷媒液の加熱には、高圧冷媒液または高圧吐出しガスを利用し、過熱による油の劣化をさけるため、電気ヒータは、加熱源としては使用しない。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "不燃性フルオロカーボンの油回収器の加熱源には一般に「電気ヒータ」が用いられる（可燃性冷媒の場合に電気ヒータを避け高圧液やガスを利用するため、記述は誤り）。"}, {"id": 343, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ハ", "theme": "多孔板式液分離器の流速", "question": "アンモニア用の多孔板式の液分離器は、円筒胴内の流速が1m/s以下の蒸気の流れに乗った液滴が多孔板に衝突して下方に落ち、蒸気は孔を通り抜けて流れることによって、液と蒸気を分離する。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "胴内ガス流速を1 m/s以下に減速させ、慣性衝突と多孔通過によって効率よく液滴を分離落下させる。"}, {"id": 344, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ニ", "theme": "冷媒液強制循環式と油戻し", "question": "冷媒液強制循環式蒸発器では、一般に、液ポンプにより蒸発量の3倍から5倍の冷媒量を流す。また、冷凍機油を低圧受液器に戻すために、一般に、蒸発器本体に油戻し用の配管を設ける。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "冷媒循環比3〜5倍で送られた油は冷媒液とともに自然に低圧受液器に戻り濃縮されるため、蒸発器本体に油戻し配管を設けるのは「満液式蒸発器」である（誤り）。"}, {"id": 345, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "イ", "theme": "配管用炭素鋼鋼管（SGP）の使用制限", "question": "配管用炭素鋼鋼管（SGP）は、毒性ガスの冷媒には使用できない。また、フルオロカーボン冷媒では設計圧力が1MPaを超える耐圧部分、温度100℃を超える耐圧部分、温度-25℃よりも低温の耐圧部分にSGPは使用できない。", "answer": "○", "law": "例示基準20、上級テキスト 配管編", "explanation": "SGPは毒性ガス禁止、設計圧力1 MPa以下、温度-25℃〜100℃の範囲でのみ使用可能。"}, {"id": 346, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ロ", "theme": "ろう材の温度と特性", "question": "ろう付けに使用するろう材のろう付け温度は、銀ろう系のほうが黄銅ろう系よりも低い。銀ろう系は、溶融したろうの流動性がよく、強度も大きいが、過熱すると亜鉛が蒸発して気泡を発生することが多い。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "過熱によって亜鉛が蒸発し気泡が発生しやすいのは「黄銅ろう（BCuZn系）」である（銀ろう系とする記述は誤り）。"}, {"id": 347, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ハ", "theme": "複数蒸発器の吸込み管接続", "question": "蒸発器が2基以上の装置では、無負荷の蒸発器に主管内の油や冷媒が流れ込むので、蒸発器吸込み管は、主管の下部（下面側）に接続するのがよい。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "停止・無負荷の蒸発器への油や冷媒液の流入を防ぐため、吸込み枝管は主管の「上部（上面側）」に接続する（下面側は誤り）。"}, {"id": 348, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ニ", "theme": "複数凝縮器の液落とし管トラップ", "question": "2基以上の凝縮器から一本の主管にまとめて受液器へ冷媒液を落とす場合には、各液落とし管にトラップを設けて、液の流れの抵抗による圧力差をトラップで吸収する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "凝縮器間の凝縮圧力差によって液が片方の凝縮器に逆流・滞留するのを防ぐため、各液落とし管にトラップを設けて液頭差で吸収する。"}, {"id": 349, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "イ", "theme": "安全装置の作動形態", "question": "安全弁、破裂板、溶栓、高圧遮断装置などの安全装置は、設定の圧力や温度で作動し、外部に冷媒ガスを放出することで冷媒設備の圧力を許容圧力以下にする。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "外部にガスを放出するのは安全弁・破裂板・溶栓である。「高圧遮断装置」は電動機電源を遮断して圧縮機を停止させる装置であり、ガス放出は行わない（誤り）。"}, {"id": 350, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ロ", "theme": "高圧遮断スイッチの設定圧力と精度", "question": "高圧遮断圧力スイッチの設定圧力は、高圧部に取り付けられた内蔵安全弁を除くすべての安全弁の最低吹始め圧力以下で、高圧部の許容圧力以下で作動するように設定する。また、設定圧力の範囲が1MPa未満の場合、圧力スイッチの精度は、設定圧力の-15%以内でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "安全弁の吹始め圧力以下かつ許容圧力以下で作動するよう設定する。1 MPa未満の精度基準は設定圧力の-15%以内である。"}, {"id": 351, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ハ", "theme": "圧縮機用と容器用安全弁の目的", "question": "圧縮機用安全弁は、吹出し圧力において、圧縮機が吐き出すガスの全量を噴出することが求められる。また、圧力容器用安全弁は、冷媒ガスの飽和圧力が設定された圧力に達したときに冷媒ガスを噴出し、過度の圧力上昇を防止する。", "answer": "○", "law": "上級テキスト 安全装置編", "explanation": "圧縮機用はピストン押しのけ量全量の噴出能力が必要。容器用は火災等の受熱による冷媒蒸発圧力の上昇を逃がす能力が求められる。"}, {"id": 352, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ニ", "theme": "破裂板の破裂圧力基準", "question": "破裂板は、圧力によって金属の薄板が破れる方式の安全装置であり、その最小口径は圧力容器に取り付けるべき安全弁の必要最小口径と同じとする。また、破裂板は、経年変化により破裂圧力が低下する傾向があるため、破裂圧力は、耐圧試験圧力より高くする。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "破裂板の破裂圧力は「耐圧試験圧力の0.8〜1.0倍」程度に設定する（耐圧試験圧力より高くすると容器が破壊されるため誤り）。"}, {"id": 353, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "イ", "theme": "溶接部非破壊試験と継手効率", "question": "溶接部を対象に実施される非破壊試験には、放射線透過試験、超音波探傷試験、磁粉探傷試験、浸透探傷試験がある。突合せ溶接継手を対象に、放射線透過試験を実施した場合には、溶接継手の効率の値を高く設定できることがある。", "answer": "○", "law": "例示基準、上級テキスト 試験検査編", "explanation": "放射線透過試験の実施割合（全長1.0で効率1.0、0.2以上で0.95、0.2未満で0.7）に応じて溶接継手効率を高く設定できる。"}, {"id": 354, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ロ", "theme": "耐圧試験の全数試験と組立機器", "question": "耐圧試験は、耐圧強度を確認する構成機器や部品ごとに行う全数試験である。なお、部品ごとに試験したものを組み立てた機器については、耐圧強度が確認できたとみなし、試験を行わなくてもよい。", "answer": "○", "law": "冷規第7条、上級テキスト 試験検査編", "explanation": "構成部品ごとに耐圧試験を実施して合格したものを組み立てた機器は、耐圧強度が確認されたものとみなされ改めての試験は省略できる。"}, {"id": 355, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ハ", "theme": "気密試験に使用するガス", "question": "冷媒配管を完了した設備を対象に行う気密試験では、冷媒の種類によらずに、ボンベに詰められた二酸化炭素、窒素ガス、試験用空気圧縮機で加圧された空気を用いて行う。ただし、圧縮空気を用いる場合は、圧縮機の吐出し空気温度が140℃を超えないようにする。", "answer": "×", "law": "例示基準6、上級テキスト 試験検査編", "explanation": "アンモニア冷媒設備では「二酸化炭素」は固形物を生成するため使用不可。フルオロカーボンでは水分を嫌うため空気は原則避ける（「冷媒の種類によらずに」は誤り）。"}, {"id": 356, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ニ", "theme": "真空放置試験の許容圧力変化", "question": "真空試験は、冷媒設備の気密の最終確認をするために実施する試験である。十分に長い時間にわたって真空のまま放置した後、試験開始前よりも5Kくらいの温度変化の場合には、1.2 kPa程度の圧力変化であればよい。", "answer": "×", "law": "例示基準7、上級テキスト 試験検査編", "explanation": "十分な放置時間後、5K程度の温度変化に対して許容される圧力変化は「0.7 kPa程度以内」である（1.2 kPaは誤り）。"}, {"id": 357, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "イ", "theme": "基礎の固有振動数と質量", "question": "地盤自身の弾力性による基礎の固有振動数は、機械が発生する振動の振動数よりも少なくとも20%以上の差をつけて、機械と基礎とが共振しないようにする。また、多気筒圧縮機の基礎の質量は、基礎の上に据え付ける機械の質量の2倍から3倍にするのが一般的である。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "共振防止のため固有振動数と機械振動数には20%以上の差をつける。多気筒往復圧縮機の基礎質量は機械質量の2〜3倍が標準。"}, {"id": 358, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ロ", "theme": "真空乾燥完了の判定温度・圧力", "question": "フルオロカーボン冷媒設備内の真空乾燥を行う際、冷媒設備内の圧力が、周囲温度が5℃のとき約0.87 kPa、周囲温度が10℃のとき約1.23 kPaに到達した時点で真空乾燥が完了したと判断してよい。", "answer": "×", "law": "上級テキスト 試運転編", "explanation": "水分の蒸発圧力（10℃で1.23 kPa）に達しただけでは蒸発が始まった段階であり乾燥完了ではない。その圧力以下を保ち長時間真空引きを継続する必要がある（誤り）。"}, {"id": 359, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ハ", "theme": "冷凍機油の具備条件", "question": "冷凍機油の選定条件として、酸に対する安定性がよいこと、熱安定性がよく、引火点が高いこと、水分や酸類などが含まれていないことなどが挙げられる。", "answer": "○", "law": "上級テキスト 潤滑油編", "explanation": "熱安定性、酸化安定性、高引火点、水分・不純物の不存在、低温流動性（低流動点）などが冷凍機油の重要条件である。"}, {"id": 360, "subject": "保安管理技術", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ニ", "theme": "冷媒充填量不足時の挙動", "question": "冷凍装置に冷媒を充てんする際、冷媒量が不足すると、蒸発圧力が低下し、圧縮機の吸込み蒸気の過熱度と比体積が大きくなり、吐出し圧力が低下し、吐出しガス温度が上昇する。吐出しガス温度の上昇は油の劣化を促進する。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "冷媒不足時は蒸発圧力低下・吸込み過熱度大・比体積増大・循環量減少・吐出し温度上昇を招き、冷凍機油の熱劣化を早める。"}, {"id": 361, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の構造（往復式）", "question": "往復圧縮機では、シリンダのすきま容積比および圧力比が大きいほど体積効率が小さい。また、冷凍機油が吸込み側の低圧部分にあるので、始動時や液戻り時にオイルフォーミングを発生しやすい。なお、多気筒圧縮機では、いくつかのシリンダの吸込み弁を開放して、起動時の負荷軽減を行う。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "すきま容積比と圧力比が大きいほど再膨張損失が増え体積効率は低下する。クランクケースが低圧のため始動時の急減圧でオイルフォーミングを起こしやすい。アンローダは吸込み弁を開放して負荷軽減する。"}, {"id": 362, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ロ", "theme": "二段圧縮方式の目的", "question": "低温冷凍装置において、二段圧縮方式を用いる主な目的は、単段圧縮方式を用いた場合に問題となる、圧力比の増大、体積効率低下による冷媒循環量の減少、断熱効率の低下にともなう軸動力の増大と吐出しガス温度の過度な上昇を避けることである。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "蒸発温度約-30℃以下の低温装置で単段圧縮を行うと圧力比過大による効率低下や吐出し温度過度上昇（油劣化）が起きるため、二段圧縮にしてこれらを防止する。"}, {"id": 363, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ハ", "theme": "スクリュー圧縮機の油噴射目的", "question": "スクリュー圧縮機において、多量の冷凍機油を強制的に噴射する目的は、しゅう動部の潤滑、ロータ間などのクリアランスのシールおよび冷媒ガスと圧縮機本体の冷却である。また、この噴射により、吐出しガス温度を断熱圧縮の場合よりも低くすることも可能である。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "多量給油の目的は「潤滑」「すきまのシール」「冷却」の3つ。油が熱を奪うため吐出しガス温度を理論断熱圧縮時よりも低く抑えられる。"}, {"id": 364, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ニ", "theme": "スクロール圧縮機の特徴", "question": "スクロール圧縮機では、吸込み弁や吐出し弁を必要としないが、停止時に高低圧の差圧で旋回スクロールの逆転を防止するために逆止め弁をつけたものが多い。この圧縮機は、断熱効率と機械効率が高いが、高速回転に適していない。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "スクロール圧縮機はトルク変動が極めて小さく、吸込み吐出しが滑らかで体積効率・断熱効率・機械効率が高く、「高速回転に適している」（「適していない」は誤り）。"}, {"id": 365, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "イ", "theme": "ホットガスバイパス容量制御", "question": "定圧ホットガスバイパス弁を用いて、圧縮機の吸込み蒸気配管にホットガスを吹き込む容量制御では、吸込み蒸気の過熱度が大きくなり、長時間の運転は難しい。しかし、ホットガスを温度自動膨張弁と蒸発器入口の間にバイパスする方法を用いると、適切な過熱度が得られ、長時間運転ができる。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "吸込み管への直吹きは過熱度過大で吐出し温度が上がり長時間運転不能。膨張弁後〜蒸発器入口へ吹き込むと蒸発器内で冷却され適正過熱度が保たれ長時間運転が可能となる。"}, {"id": 366, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ロ", "theme": "複数圧縮機の段階発停制御", "question": "作動圧力に差をもたせた圧力スイッチを用いて、吸込み蒸気圧力の上昇、下降にともない複数の多気筒圧縮機を順次発停させる容量制御方法では、圧縮機の同時始動やクランクケース内の冷凍機油量の不均衡に注意しなければならない。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "多台数順次発停制御では、電源容量対策として同時始動を防止し、クランクケース相互の油面不均衡を防ぐ均油管・均圧管の施工が重要となる。"}, {"id": 367, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ハ", "theme": "インバータ容量制御の特性", "question": "熱負荷の増減に合わせて、インバータで圧縮機の回転速度を調節する容量制御方法では、ある限定された範囲内においては、冷凍能力が回転速度にほぼ比例する。クランク軸端に油ポンプを付けている往復圧縮機では、回転速度をあまり低速にすると、潤滑不良を起こす。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "限定範囲内では体積効率はほぼ一定で能力は回転速度に正比例する。軸駆動油ポンプ式は極端な低速運転で給油圧力が低下し潤滑不良を起こす。"}, {"id": 368, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ニ", "theme": "蒸発圧力調整弁（EPR）の作用", "question": "蒸発圧力調整弁は、熱負荷の減少に伴い蒸発圧力が設定値以下へ低下することを防ぐ。この弁は、温度自動膨張弁の感温筒と均圧管の取付け位置よりも下流側の吸込み蒸気配管に取り付けられ、作動時は圧縮機吸込み蒸気の過熱度や圧力を低下させる。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は蒸発圧力を維持するために吸込み蒸気を絞り、「圧縮機吸込み圧力を低下」させる弁である。「過熱度を低下させる」わけではない（誤り）。"}, {"id": 369, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "イ", "theme": "過熱運転の要因（低圧低下・水量減少）", "question": "熱負荷の減少によって、圧縮機の吸込み蒸気圧力が正常な状態から極端に低下すると、圧力比の増大による吐出しガス温度の上昇を起こす。また、水冷凝縮器の冷却水量が減少しても、圧力比の増大による吐出しガス温度の上昇を起こし、圧縮機が過熱運転となる場合がある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吸込み圧力の異常低下（低負荷・サクション目詰まり等）や凝縮圧力の上昇（冷却水不足等）は、いずれも圧力比を増大させ吐出しガス温度上昇による過熱運転を招く。"}, {"id": 370, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ロ", "theme": "アンモニア往復圧縮機の油戻し", "question": "冷凍機油は、圧縮機の軸受、ロータ、ピストンなどの潤滑面に油膜をつくり、摩擦によって生じる熱の除去や摩耗防止などの役割がある。鉱油を用いた、アンモニアを冷媒とする往復圧縮機の吐出しガス温度は高く、一般に、圧縮機から吐き出された冷凍機油をクランクケースに戻すことはしない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "アンモニア往復圧縮機は吐出し温度が高く鉱油が熱劣化しやすいため、油分離器で回収した油はクランクケースに戻さず機外へ抜き取る。"}, {"id": 371, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ハ", "theme": "弁漏れの影響（吸込み弁と吐出し弁）", "question": "吸込み弁、吐出し弁やクランク軸のある圧縮機で、吐出し弁に漏れが生じると、圧縮機の吸込み蒸気量が減少し、体積効率や断熱効率の低下を招き、吐出しガス温度が大きく上昇する。一方、吸込み弁の漏れでは、体積効率の低下を招くが、吐出しガス温度が大きく上昇することはない。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁漏れは高温高圧ガスがシリンダ内に逆流し再圧縮されるため吐出し温度が著しく上昇する。吸込み弁漏れは吸込み側への逆流で体積効率は激減するが吐出し温度上昇は小さい。"}, {"id": 372, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ニ", "theme": "スクリュー圧縮機の給油圧力と吐出し温度", "question": "スクリュー圧縮機に給油ポンプが付いている場合の給油圧力は、吐出しガス圧力よりも0.2から0.3 MPa程度高い。また、この圧縮機の吐出しガス温度は、フルオロカーボン冷媒では通常90℃以下である。これより高い場合は、油冷却器による冷却不良などを疑う必要がある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "強制給油式の適正給油圧力は吐出し圧力＋0.2〜0.3 MPa。吐出しガス温度は通常80〜90℃以下であり、超過時は油冷却器不良や油量不足等を点検する。"}, {"id": 373, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "イ", "theme": "空冷凝縮器の冬季制御", "question": "空冷凝縮器は、水冷凝縮器に比べて熱通過率が小さく、凝縮温度が高くなる特徴があるが、冬季には凝縮圧力の低下を防ぐために、冷却空気量を制御したり、凝縮圧力調整弁で凝縮圧力を制御する。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "空冷式は冬季に外気温度低下で凝縮圧力が下がりすぎ膨張弁差圧不足を起こすため、ファン風量制御や凝縮圧力調整弁（液滞留）で圧力を維持する。"}, {"id": 374, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ロ", "theme": "水冷横形シェルアンドチューブの過充填", "question": "受液器兼用の水冷横形シェルアンドチューブ凝縮器において、装置内に冷媒を過充てんすると、余分な冷媒液が凝縮器に貯えられ、多数の冷却管が冷媒液中につかり、冷媒蒸気の凝縮に有効な伝熱面積が減少し、凝縮温度が上昇する。一方、凝縮器出口の冷媒液の過冷却度は増大する。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "冷却管が液没すると気体凝縮有効面積が減り凝縮温度・圧力は上昇する。一方で液が管群と接触冷却されるため出口過冷却度は増大する。"}, {"id": 375, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ハ", "theme": "冷却管水あかの熱通過率低下割合", "question": "水あかや油膜が水冷横形シェルアンドチューブ凝縮器の冷却管に付着すると、それらの熱伝導抵抗によって熱通過率の値が小さくなる。そのため、圧縮機の消費電力は増加し、冷凍能力は減少する。冷却管がローフィンチューブの場合よりも裸管のほうが、水あかが厚く付着することによる熱通過率の低下割合が大きい。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "ローフィンチューブは外表面積が内表面積の3.5〜4.2倍あり、内面（水側）の熱抵抗の影響が外表面基準熱通過率に大きく現れるため、水あか付着による熱通過率低下割合が大きいのは「ローフィンチューブ」である（裸管のほうが大きいとする記述は誤り）。"}, {"id": 376, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ニ", "theme": "不凝縮ガス混入時の伝熱阻害側", "question": "空冷凝縮器内に空気などの不凝縮ガスが混入すると、冷却管の空気側の熱伝達率が小さくなり、凝縮温度が高くなる。そのため、圧縮機の吐出しガスの圧力と温度が高くなり、圧縮機用電動機の消費電力が増加し、冷凍能力と成績係数が低下する。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "不凝縮ガスが混入して伝熱を阻害するのは管内の「冷媒側」である（「空気側の熱伝達率が小さくなり」は誤り）。"}, {"id": 377, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "イ", "theme": "乾式蒸発器の着霜影響", "question": "フィンコイル乾式蒸発器に霜が厚く付着すると、空気の流れるフィンの隙間が狭くなり、空気の流れ抵抗が増加する。このため、蒸発器通過風量が減少して、蒸発器の冷却能力は減少する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "着霜により通風抵抗増大・風量減少と、霜層の熱抵抗増大が重なり、蒸発温度が低下して冷却能力は著しく減少する。"}, {"id": 378, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ロ", "theme": "温度自動膨張弁感温筒の外れとガス漏れ", "question": "温度自動膨張弁の感温筒は、蒸発器出口の過熱された冷媒蒸気温度を吸込み蒸気配管の管壁を介して検出し、圧縮機の吸込み蒸気過熱度を制御する。そのため、管壁から感温筒が外れ、感温筒の温度が上がると膨張弁は開く方向に作動し、感温筒内に封入されている冷媒が漏れると膨張弁は閉じる方向に作動する。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "外れて高温を検知すると弁を開き過剰送液（液戻り）となる。封入ガスが漏れると開弁力が失われ弁は全閉する。"}, {"id": 379, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ハ", "theme": "蒸発温度低下と冷媒循環量", "question": "蒸発器の蒸発温度が低下すると、蒸発器内の冷媒圧力が低下し、圧縮機吸込み蒸気の比体積が大きくなり、冷媒循環量と冷凍能力が減少する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "蒸発圧力低下→吸込み蒸気比体積大（密度小）→冷媒循環量減少→冷凍能力減少となる。"}, {"id": 380, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ニ", "theme": "停止時のポンプダウン運転", "question": "乾式蒸発器を使用した冷凍装置の運転停止時には、蒸発器内に冷媒液が残留しないように、運転停止前に圧縮機で冷媒を高圧側へ回収して、再始動時の液戻りを防ぐ。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "液封止弁を閉じて圧縮機を動かし蒸発器内の液を高圧受液器へ回収（ポンプダウン）してから停止させることで、再起動時の液戻り事故を防ぐ。"}, {"id": 381, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "イ", "theme": "冷媒への油溶解と粘度", "question": "フルオロカーボン冷媒液は、冷凍機油を溶解すると粘度が低くなる。また、過度に油を溶解すると伝熱を阻害することになる。一般に、油の溶解量が3%以下であれば特に支障がない。", "answer": "×", "law": "上級テキスト 潤滑油編", "explanation": "フルオロカーボン冷媒液に冷凍機油が溶解すると、液の粘度は「高く」なる（低くなるは誤り）。"}, {"id": 382, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ロ", "theme": "凝縮器の温度差と熱伝達率", "question": "凝縮器では、冷媒温度と冷却媒体との算術平均温度差が大きいほど熱流束（熱流密度）が大きくなって、凝縮作用が活発になり、冷媒側熱伝達率も大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "温度差大で凝縮が活発になると凝縮液膜が厚くなり熱伝導抵抗が増すため、冷媒側熱伝達率は「小さく」なる（大きくなるは誤り）。"}, {"id": 383, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ハ", "theme": "凝縮器内の混合気境界層と停止時圧力", "question": "水冷横形シェルアンドチューブ凝縮器内（冷媒側）に不凝縮ガスが存在すると、伝熱面近くに混合気境界層が形成されて伝熱作用が阻害される。また、冷凍装置の運転停止中における凝縮器の圧力は、凝縮器内に存在する不凝縮ガスの分圧相当分だけ高くなる。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "運転中は液膜表面に不凝縮ガスが濃縮された混合気境界層ができ伝熱阻害を起こす。停止時は冷媒飽和圧力に不凝縮ガス分圧が加算された圧力を示す。"}, {"id": 384, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ニ", "theme": "アンモニアと鉱油の物性比較", "question": "アンモニアと冷凍機油（鉱油）とはほとんど溶け合わない。また、温度によって異なるが、油の粘度はアンモニア液と同じ程度であり、油の熱伝導率はアンモニア液の1/3程度である。アンモニアの蒸発および凝縮の際の伝熱面上の油膜は、伝熱の大きな障害となるので、伝熱面からできるだけ排除することが望ましい。", "answer": "×", "law": "上級テキスト 潤滑油編", "explanation": "油の粘度はアンモニア液よりも「約3桁（1000倍程度）大きい」（「アンモニア液と同じ程度」は誤り）。熱伝導率は約1/3。"}, {"id": 385, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "イ", "theme": "感温筒の垂直管取付と防熱", "question": "温度自動膨張弁本体は蒸発器入口近く、また、感温筒は蒸発器出口近くに取り付ける。感温筒は、周囲の温度や湿度の影響を受けないように防湿性のある防熱材で包むようにし、垂直吸込み管に取り付けるときは、感温筒のキャピラリチューブが上側になるようにする。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "感温筒は風や外気温の影響を遮断するため防熱材を施工し、垂直管では内部液がキャピラリ側へ抜け出さないようキャピラリを上向きにして取り付ける。"}, {"id": 386, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ロ", "theme": "電子膨張弁の駆動と材料", "question": "電子膨張弁は、サーミスタなど温度センサからの電気信号を調節器で過熱度に演算処理し、電気的に弁を駆動して開閉の操作を行い、温度自動膨張弁と比較して幅広い制御特性にすることができる。また、構成材料を適切に選択すれば、電子膨張弁は冷媒の種類に関係なく使用できる。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "ステッピングモータ駆動等によりマイコン制御で広範囲の精密制御が可能。材料選定によりあらゆる冷媒に対応できる。"}, {"id": 387, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ハ", "theme": "吸着チャージ方式の応答速度", "question": "吸着チャージ方式の温度自動膨張弁の感温筒内には、活性炭などの吸着剤とともに炭酸ガスのような通常の使用状態で液化しないガスが封入されている。吸着チャージ方式は、封入する吸着剤の量とガスの種類によって、感温筒温度に対する感温筒内ガス圧の応答感度を変えることができ、クロスチャージ方式よりも応答速度が速い。", "answer": "×", "law": "上級テキスト 膨張弁編", "explanation": "吸着チャージ方式は吸着剤の吸脱着を介して圧力が変わるため、液・ガス・クロスチャージ等の他方式に比べて「応答速度が最も遅い」（応答速度が速いは誤り）。この遅さによりハンチング防止に効果がある。"}, {"id": 388, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ニ", "theme": "ディストリビュータによる膨張弁容量低下", "question": "温度自動膨張弁の容量（冷凍能力）は、オリフィス口径と弁開度に加え、弁前後の圧力差などによっても異なる。膨張弁出口側に液分配用ディストリビュータを取り付けると、弁出口圧力が高くなって弁出入口圧力差が小さくなり、膨張弁の容量が減少する。", "answer": "○", "law": "上級テキスト 膨張弁編", "explanation": "ディストリビュータ（分配器）によるノズル圧力降下分だけ膨張弁出口背圧が高くなり、弁前後の有効差圧が減少して膨張弁の通過可能容量は減少する。"}, {"id": 389, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "イ", "theme": "蒸発圧力調整弁（EPR）と成績係数", "question": "蒸発圧力調整弁を用いた冷凍装置において、圧縮機容量に対して蒸発器容量が小さくなった場合は、蒸発圧力調整弁での圧力降下が大きくなり、圧縮機吸込圧力が低下するが、蒸発圧力調整弁では、冷媒は等比エンタルピーの絞り膨張となるので、装置の成績係数は変わらない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "弁で絞り膨張しても、圧縮機の吸込み圧力が大きく下がることで圧縮動力が増大し、装置の成績係数（COP）は「低下する」（「変わらない」は誤り）。"}, {"id": 390, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ロ", "theme": "吸入圧力調整弁と蒸発圧力調整弁の構造比較", "question": "直動形吸入圧力調整弁は、ベローズによってシールされた作動圧力設定用ばねとベローズに直結されたバルブプレートからなっている。この弁は、バルブプレートの向きも含め、直動形蒸発圧力調整弁と同じ構造であるが、冷媒の入口と出口の取り付け方が逆である。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "直動形吸入圧力調整弁（SPR）は出口圧力制御、蒸発圧力調整弁（EPR）は入口圧力制御であるため、「バルブプレートの向きが逆」になっている（同じ構造は誤り）。"}, {"id": 391, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ハ", "theme": "凝縮圧力調整弁（CPR）と受液器", "question": "凝縮圧力調整弁は、空冷凝縮器の冬季運転における凝縮圧力の異常な低下を防止し、冷凍装置を正常に運転するための圧力制御弁である。凝縮圧力調整弁による凝縮圧力の制御は、凝縮器の冷媒液量を利用する方法であり、装置の冷媒充てん量に多少の余裕を必要とするので受液器がなければならない。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "空冷凝縮器内に液を滞留させて伝熱面積を減らす制御であるため、滞留分を含めた余剰冷媒を蓄え液管へフラッシュガスを流さない受液器が必須。"}, {"id": 392, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ニ", "theme": "直動形圧力式冷却水調整弁の動作", "question": "直動形の圧力式冷却水調整弁は、下部の凝縮圧力導入用の接続口付きベローズ部分と、作動圧力設定用ばねを収めた調整部分から成り、凝縮圧力が高くなると弁開度が大きくなる。また、凝縮負荷、水温変化、凝縮器の熱通過率変化などに応じて、凝縮圧力が適正な状態を保つように冷却水量を調節する。", "answer": "○", "law": "上級テキスト 調整弁編", "explanation": "凝縮圧力をベローズに直接導いて制御するため応答が速く、凝縮圧力上昇時に弁を開いて水量を増やし設定圧力を維持する。"}, {"id": 393, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "イ", "theme": "フロートスイッチの種類", "question": "満液式蒸発器を用いた冷凍装置では、フロート弁やフロートスイッチによって、冷媒液だめ器内の液量（液面レベル）の制御を行う。フロートスイッチには、直接作動形と電子式の遠隔作動形の2種類がある。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "永久磁石で接点を直接開閉する直接作動形と、インダクタンス変化を増幅してリレーを動かす電子式遠隔作動形がある。"}, {"id": 394, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ロ", "theme": "電磁弁の許容電圧変動", "question": "電磁弁の作動電源は、直流用では、12V, 24V, 100V、交流用では、24V, 100V, 200Vが標準であるが、110V, 220Vもある。また、これらの定格電圧からの許容電圧変動は±10%以下である。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "電磁弁の定格電圧からの許容変動範囲は±10%以内である。過大電圧はコイル焼損、過小電圧は吸引力不足で作動不良を招く。"}, {"id": 395, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ハ", "theme": "油圧保護圧力スイッチの遅延時間", "question": "多気筒圧縮機などの大形圧縮機では、油ポンプを内蔵または外部に装着している。運転中に定められた油圧が保持できなくなると、圧縮機の軸受などが焼付き事故を起こす危険がある。このような事故を防止するために、圧縮機を始動してから一定時間、または運転中の一定時間（一般に90秒程度）、定められた給油圧力を保持できない場合には、油圧保護圧力スイッチの電気接点を開き、圧縮機の電動機を停止させる。", "answer": "○", "law": "上級テキスト 制御機器編", "explanation": "始動時の油圧立ち上がり待ちや一時的な油圧変動での誤トリップを防ぐため、バイメタルヒータ等で約90秒（60〜120秒）の遅延時間を持たせて接点を開く。"}, {"id": 396, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ニ", "theme": "吸着チャージ式サーモスタットの設置環境", "question": "蒸気圧式サーモスタットは、感温筒内のチャージ方式により、ガスチャージ方式、吸着チャージ方式、液チャージ方式に分類される。これらのうち、吸着チャージ方式は、受圧部の温度が作動に及ぼす影響が大きく、サーモスタット本体が感温筒と異なった温度環境では使用できない。", "answer": "×", "law": "上級テキスト 制御機器編", "explanation": "吸着チャージ方式は感温筒内の吸着量変化のみで作動するため、受圧部（本体）の温度影響をほとんど受けず、「本体が感温筒と異なる温度環境でも使用できる」（使用できないは誤り）。"}, {"id": 397, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "イ", "theme": "油分離器の設置対象装置", "question": "油分離器は、冷凍機油が凝縮器や蒸発器に入り込むと伝熱作用を阻害する不都合を生じるアンモニア冷凍装置、冷凍機油を蒸発器から圧縮機へ戻すことが難しい満液式蒸発器を用いたフルオロカーボン冷媒装置、低温で冷凍機油の粘度が高くなり蒸発器から油戻しが難しい蒸発温度-40℃以下の冷凍装置などに用いられる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "非相溶のアンモニア装置、油が滞留する満液式、油粘度が高まる-40℃以下の極低温装置、長配管装置などで油分離器が必須となる。"}, {"id": 398, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ロ", "theme": "アンモニア装置でのドライヤ不使用", "question": "フルオロカーボン冷媒装置では、一般にフィルタドライヤを取り付け、シリカゲルやゼオライトなどの乾燥剤を用いて冷媒系統の水分を吸着除去する。アンモニア冷凍装置でも、一般に同様の乾燥剤を用いて水分を除去する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニア系統内の水分はアンモニアと強く結合してアンモニア水を形成するため乾燥剤による吸着分離ができず、アンモニア装置にはフィルタドライヤを使用しない（誤り）。"}, {"id": 399, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ハ", "theme": "高圧受液器の容量設計（80%回収）", "question": "高圧受液器には、運転中の大きな負荷変動、冷却器の運転台数の変化、およびヒートポンプ装置の運転モードの切換えなどによる冷媒量の変化を吸収する容量をもたせる。さらに、冷媒充てん量の全量または大部分の量を受液器内容積の80%以内で回収できる容量をもたせる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "負荷変動吸収に加え、ポンプダウン時に全冷媒の全量又は大部分を受液器容積の80%以内で回収し、上部に最低20%のガス空間を確保できる容量が必要。"}, {"id": 400, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ニ", "theme": "低圧受液器の液面制御機器", "question": "低圧受液器は、冷媒液強制循環式冷凍装置の蒸発器冷却管に低圧冷媒液を送り込むための液だめとして、冷却管から戻った冷媒蒸気と液を分離する役割をもつ。低圧受液器では、運転状態が変化しても、冷媒液ポンプと蒸発器が安定した運転を続けられるように、一般に温度自動膨張弁で流量制御が行われる。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "低圧受液器の液面制御は液ポンプの吸込み揚程を確保するため「フロート弁」または「フロートスイッチと電磁弁の組合せ」で行う（「温度自動膨張弁」は誤り）。"}, {"id": 401, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア装置の液ガス熱交換器不使用", "question": "アンモニア冷凍装置には液ガス熱交換器を取り付け、凝縮器からの高温冷媒液と蒸発器からの低温冷媒蒸気との熱交換によって、凝縮器からの冷媒液を過冷却し、液管内でのフラッシュガスの発生を防止する。さらに、圧縮機吸込み蒸気を適度に加熱することにより、負荷変動などによる液戻りをある程度防止する。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "アンモニアは断熱指数が大きく吸込み過熱による吐出し温度上昇が激しいため、液ガス熱交換器は「使用しない」（取り付けるとする記述は誤り）。フルオロカーボンの説明である。"}, {"id": 402, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ロ", "theme": "U字管式液分離器（アキュムレータ）", "question": "小形のフルオロカーボン冷凍装置に用いられるU字管を内蔵した液分離器では、一般に、入口から入った液滴を含んだ冷媒蒸気は、流れ方向の変化と速度の低下によって、液と蒸気に分離される。分離された容器底部の油と冷媒液は、U字管底部にあけられた小さな孔から、少量ずつ圧縮機へ吸い込まれる。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "速度低下と流向変化で気液分離し、U字管底部のメタリングオリフィス（小孔）からガス流に乗せて油と微量冷媒液を少しずつ圧縮機へ返油する。"}, {"id": 403, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ハ", "theme": "満液式蒸発器の油回収器", "question": "フルオロカーボン冷媒装置の満液式蒸発器などに入り込んだ冷凍機油は、冷媒液に溶解している。そこで、油の溶解した冷媒液を抜き出し、油回収器で冷媒蒸気と油に分離して、冷媒蒸気は吸込み蒸気配管へ、油は油だめ器を介して圧縮機に戻す方法がある。", "answer": "○", "law": "上級テキスト 附属機器編", "explanation": "満液式蒸発器から油濃度の高い冷媒液を抜き出し、ヒータ等の油回収器で冷媒のみを蒸発させて分離し、油を圧縮機クランクケースへ戻す。"}, {"id": 404, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ニ", "theme": "冷媒液強制循環式と油戻し配管", "question": "冷媒液強制循環式蒸発器では、一般に液ポンプにより蒸発量の3倍から5倍の量の冷媒を流す。また、冷凍機油の処理を行うために、一般に蒸発器本体に油戻し用の配管を設ける。", "answer": "×", "law": "上級テキスト 附属機器編", "explanation": "強制循環式では油は冷媒液とともに低圧受液器に戻って濃縮されるため、蒸発器本体に油戻し配管を設けるのは「満液式蒸発器」である（誤り）。"}, {"id": 405, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "イ", "theme": "配管用炭素鋼鋼管（SGP）の使用限界圧力", "question": "配管用炭素鋼鋼管（SGP）は、フルオロカーボン冷媒では設計圧力が2MPa以下の耐圧部分、温度100℃以下の耐圧部分、温度-25℃よりも高温の部分には使用できる。しかし、毒性ガスの冷媒に対して使用してはならない。", "answer": "×", "law": "例示基準20、上級テキスト 配管編", "explanation": "SGPが使用できる設計圧力は「1 MPa以下」である（「2 MPa以下」は誤り）。毒性ガス使用禁止、-25℃〜100℃の制限は正しい。"}, {"id": 406, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒ガス配管の油同伴最低流速", "question": "冷媒ガス流速は、過大な圧力降下や騒音を生じない程度に抑制する必要がある。一方、冷媒ガスとともに圧縮機から吐き出された油が、確実に冷媒ガスに同伴される流速が必要であり、一般に横走り管で2m/s程度、立ち上がり管で3m/s程度にする。", "answer": "×", "law": "上級テキスト 配管編", "explanation": "油を確実に同伴させるための最低流速は、一般に「横走り管で3.5 m/s以上」「立ち上がり管で6 m/s以上」である（2 m/s, 3 m/sは過小であり誤り）。最大流速は20〜25 m/s以下。"}, {"id": 407, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ハ", "theme": "液配管の防熱とフラッシュガス防止", "question": "液配管は、冷媒液にフラッシュガスを発生させないようにする必要がある。やむをえず、フラッシュガスの発生が懸念される高温の所に液配管を通す場合には、配管に防熱を施工し、フラッシュガスの発生を防止する。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "周囲温度が冷媒液の飽和温度より高い場所を通ると受熱により液の一部が蒸発しフラッシュガスが発生するため、防熱施工を行って防止する。"}, {"id": 408, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ニ", "theme": "満液式蒸発器の油戻し（熱交利用）", "question": "満液式蒸発器を使用するフルオロカーボン冷媒装置では、蒸発器から圧縮機への油戻しが重要である。油戻しには、油を含んだ冷媒液を絞り弁を通して少しずつ抜き出し、液ガス熱交換器で冷媒液を気化させ、油とともに圧縮機に戻す方法などがある。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "油混じりの冷媒液を抜き出して液ガス熱交換器等で液を蒸発させ、油と冷媒蒸気を吸込み管へ導いて圧縮機へ戻す。"}, {"id": 409, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "イ", "theme": "安全装置の作動区分（ガス放出と電源遮断）", "question": "安全弁、破裂板、溶栓、高圧遮断装置などの安全装置は、設定の圧力と温度で作動し、外部に冷媒ガスを放出することで冷媒設備の圧力を許容圧力以下に戻す。", "answer": "×", "law": "上級テキスト 安全装置編", "explanation": "ガスを放出するのは安全弁・破裂板・溶栓である。「高圧遮断装置」は電動機入力を遮断して圧縮機を止めるものであり、ガス放出は行わない（誤り）。"}, {"id": 410, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ロ", "theme": "高圧遮断圧力スイッチの設定圧力と精度", "question": "高圧遮断圧力スイッチの設定圧力は、高圧部に取り付けられた内蔵安全弁を除くすべての安全弁の最低吹始め圧力以下で、かつ、高圧部の許容圧力以下の圧力で作動するように設定する。なお、高圧遮断圧力スイッチの設定圧力の精度は、1MPa以上2MPa未満の設定圧力の範囲では、-12%以内でなければならない。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "安全弁の最低吹始め圧力以下かつ許容圧力以下で作動させる。精度基準は1 MPa未満が-15%、1〜2 MPaが-12%、2 MPa以上が-10%以内である。"}, {"id": 411, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ハ", "theme": "圧力容器用安全弁口径の算定式", "question": "圧力容器用安全弁では、冷媒ガスと圧力容器の外径や全長などにより安全弁の必要最小口径サイズを決定し、圧力容器の圧力が過度に上昇しないようにする。", "answer": "○", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "必要最小口径は d = C * sqrt(D * L) （D:外径m, L:全長m, C:ガス定数）によって算定される。"}, {"id": 412, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ニ", "theme": "破裂板の最小口径", "question": "破裂板の最小口径は、圧力容器に取り付けるべき安全弁の口径の1/2とし、破裂圧力は安全弁の作動圧力以上で、耐圧試験圧力以下でなければならない。", "answer": "×", "law": "例示基準8、上級テキスト 安全装置編", "explanation": "破裂板の最小口径は、安全弁の必要最小口径と「同一（同じ）」とする（「1/2とし」は誤り）。"}, {"id": 413, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "イ", "theme": "量産品の強度試験圧力", "question": "配管を除く圧縮機や容器の部分について、その強さを確認するために、耐圧試験の代わりに量産品について適用する強度試験がある。強度試験の試験圧力は、設計圧力の3倍以上の高い圧力である。", "answer": "○", "law": "冷規第7条、上級テキスト 試験検査編", "explanation": "量産品に適用される強度試験の圧力は設計圧力の3倍以上（液体耐圧試験圧力1.5倍の2倍以上）と規定されている。"}, {"id": 414, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ロ", "theme": "液体耐圧試験の降圧検査圧力", "question": "耐圧試験を液体で行う場合は、圧力容器内の空気を完全に排除した後、液体を徐々に加圧して、耐圧試験圧力まで上げ、その圧力を1分間以上保っておく。その後、圧力を耐圧試験圧力の1/2まで下げて、被試験品の各部、溶接継手などについて、漏れ、異常な変形、破壊などの異常がないことを確認して合格とする。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "耐圧試験圧力を1分以上保持した後、検査のために圧力を下げる目標値は「耐圧試験圧力の8/10（0.8倍）」までである（「1/2まで下げて」は誤り）。"}, {"id": 415, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ハ", "theme": "気密試験と耐圧試験の実施順序", "question": "気密試験は、空気または不燃性、非毒性ガスを用いたガス圧試験で実施し、試験する機器の気密性能を確認する。その後、空気、窒素などの気体を使用する耐圧試験を実施して、機器の耐圧性能を確認する。", "answer": "×", "law": "上級テキスト 試験検査編", "explanation": "試験の順序は「耐圧試験を先に行い」、その後に「気密試験を行う」のが原則である（気密試験の後に耐圧試験を行うとする記述は誤り）。"}, {"id": 416, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ニ", "theme": "真空放置試験の到達真空度", "question": "冷媒設備の気密の最終確認をするための真空放置試験では、真空ポンプを使用して、装置内部を真空状態にしながら水分を蒸発させて乾燥させるとともに、設備からの漏れの有無を確認する。冷媒設備内の真空度は周囲大気温度に相当する水蒸気飽和圧力以下にすることが必要である。", "answer": "○", "law": "上級テキスト 試験検査編", "explanation": "水分を蒸発排出し乾燥させるため、内部圧力を周囲温度に対応する水蒸気飽和圧力以下（常温で数kPa〜1 kPa以下）まで減圧して放置確認する。"}, {"id": 417, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "イ", "theme": "蒸発式凝縮器の屋上設置基礎", "question": "蒸発式凝縮器を屋上に設置する場合、地震による据付位置のずれを防止するために、基礎の質量は、その凝縮器の質量よりも十分に大きくし、その基礎の鉄筋と屋上床盤の鉄筋を固く結びつけ、凝縮器本体と基礎も十分に固定する。また、凝縮器は、水平に設置する。", "answer": "○", "law": "上級テキスト 据付編", "explanation": "蒸発式凝縮器は重心が高く水保有量も多いため、基礎質量を本体より大きくし、屋上床スラブ鉄筋と強固に連結してアンカーボルトで固定し水平に据え付ける。"}, {"id": 418, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ロ", "theme": "地盤の許容応力の決定要因", "question": "機器の基礎底面にかかる荷重により地盤の不同沈下が起こらないようにするために、基礎底面にかかる応力を、基準の応力以下にする。この基準の応力を基礎の許容応力といい、基礎の材質により決まる。", "answer": "×", "law": "上級テキスト 据付編", "explanation": "不同沈下を防ぐための基準応力は「地盤の許容応力（地耐力）」といい、「地盤の種類（岩盤、砂、粘土等）」により決まる（「基礎の材質により決まる」は誤り）。"}, {"id": 419, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ハ", "theme": "冷凍機油の凝固点条件", "question": "冷凍機油の選定条件として、使用条件に対して凝固点が高く、ろう分が少なく、熱安定性と引火点が高いことなどがあげられる。また、低温用の冷凍機油では、流動点が低く、水分により乳化しにくいこと、酸に対する安定性が良いことなども選定条件として大切である。", "answer": "×", "law": "上級テキスト 潤滑油編", "explanation": "低温配管や蒸発器内で油が固化しないよう、凝固点は「低く」なければならない（「凝固点が高く」は誤り）。"}, {"id": 420, "subject": "保安管理技術", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ニ", "theme": "フルオロカーボンの熱分解毒性ガス", "question": "フルオロカーボンは安定した冷媒であり、一般に毒性は低く可燃性もないが、高温の物体に触れると、分解して、フッ化水素やホスゲンなどの毒性の強いガスが発生する。圧力容器や配管の修理の際には、内部に残留ガスがないか十分に確認することが大切である。", "answer": "○", "law": "上級テキスト 試運転編", "explanation": "フルオロカーボンは裸火や溶接トーチ等の高温に触れると熱分解して猛毒のフッ化水素やホスゲンを生成するため、修理前には冷媒回収・窒素置換が必須である。"}, {"id": 421, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "イ", "theme": "往復圧縮機のオイルフォーミング", "question": "往復圧縮機は、冷凍機油が吸込み側の低圧部分にあるので、始動時や液戻り時にオイルフォーミングを発生しやすい。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "クランクケースが吸込み低圧側にあるため、停止中に油に多量に溶け込んだ冷媒が始動時の減圧で一気に沸騰気化しオイルフォーミングを起こす。"}, {"id": 422, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ロ", "theme": "スクリュー圧縮機の容量制御範囲", "question": "スクリュー圧縮機の押しのけ量は、ロータの歯の形状、歯数、長さおよび回転数により決まる。また、圧縮機の容量制御はスライド弁を使用して行うが、無段階制御はできない。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "スクリュー圧縮機のスライド弁容量制御は、油圧ピストン等により「無段階制御が可能」である（無段階制御はできないは誤り）。"}, {"id": 423, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ハ", "theme": "スクロール圧縮機の効率と回転数", "question": "スクロール圧縮機は、吸込みと吐出しの動作が滑らかで、トルク変動が非常に小さく、特に振動や騒音が小さい。また、体積効率と機械効率は低いが、高速回転に適している。", "answer": "×", "law": "上級テキスト 圧縮機編", "explanation": "スクロール圧縮機は弁がなく連続圧縮するため「体積効率、断熱効率、機械効率がいずれも高い」（効率は低いとする記述は誤り）。"}, {"id": 424, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ニ", "theme": "遠心圧縮機のサージングと多段化", "question": "遠心圧縮機において、容量制御をサクションベーンにより行う場合、低流量になると、サージングによって振動や騒音が発生する。また、低温用の冷凍装置で使用するときは、圧力比が大きくなるので、多段圧縮式を採用する必要がある。", "answer": "○", "law": "上級テキスト 圧縮機編", "explanation": "低流量域では羽根車の流れが剥離してサージングを起こす。また遠心式は1段当たりの圧力比が小さいため、低温用では多段圧縮が必要となる。"}, {"id": 425, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "イ", "theme": "多気筒圧縮機のアンローダとCOP", "question": "多気筒圧縮機の容量制御は、吸込み弁を開放して、圧縮の作動をする気筒数を減らして行うため、圧縮機の気筒数により段階的制御が可能である。また、この容量制御を行わないと負荷減少時に吸込み圧力が低下し、成績係数が小さくなる。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "吸込み弁押し下げ（アンロード）で気筒数に応じた段階制御を行う。容量制御がないと低負荷時に蒸発圧力が低下し圧縮比増大によりCOPが大幅に悪化する。"}, {"id": 426, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ロ", "theme": "スクリューアンローダと吐出し温度", "question": "スクリュー圧縮機のアンローダ機構は、圧縮機始動時の負荷軽減装置などとして使われている。しかし、低負荷で長時間運転すると、吐出しガス温度が高くなることがあるので注意する必要がある。", "answer": "○", "law": "上級テキスト 容量制御編", "explanation": "スライド弁でバイパスすると圧縮途中の加熱ガスが吸込み側に戻り、低負荷（アンロード）連続運転では吐出しガス温度が上昇しやすい。"}, {"id": 427, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ハ", "theme": "蒸発圧力調整弁の取付位置", "question": "蒸発圧力調整弁を用いて圧縮機の容量制御をするとき、この調整弁は、温度自動膨張弁の感温筒および均圧管の取付け位置よりも上流側の配管に取り付けなければならない。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "蒸発圧力調整弁（EPR）は、温度自動膨張弁の感温筒・均圧管取付け位置よりも「下流側」に取り付けなければならない（上流側は誤り）。上流に付けると膨張弁が誤動作する。"}, {"id": 428, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ニ", "theme": "吸入圧力調整弁（SPR）の制御方向", "question": "吸入圧力調整弁は、圧縮機の吸込み管に取り付ける。この調整弁を取り付ける目的は、上流側の圧力が所定の圧力以下にならないように、吸込み蒸気を絞り、容量制御することである。この方法は、装置の運転動力が増大するので、装置の成績係数は低下する。", "answer": "×", "law": "上級テキスト 調整弁編", "explanation": "吸入圧力調整弁（SPR/CPR）の目的は、「下流側（圧縮機側）の圧力が所定値以上にならないように」絞ることである（上流側が所定圧力以下にならないように、は誤り）。"}, {"id": 429, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "イ", "theme": "過熱運転の発生原因", "question": "低温用冷凍装置における蒸発器の熱負荷の大幅な低下、サクションフィルタの目詰り、膨張弁手前でのフラッシュガスの発生などによって、吸込み圧力が異常に低下すると、圧力比が大きくなり、吐出しガス温度が上昇して、圧縮機は過熱運転になる。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "低負荷、フィルタ詰まり、冷媒供給不足による蒸発圧力の異常低下は、圧力比を急増させ吐出し温度を過度に上昇させる。"}, {"id": 430, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ロ", "theme": "湿り圧縮・液戻りの原因", "question": "圧縮機の湿り圧縮や液戻りの原因としては、冷凍負荷の急激な変化、圧縮機のアンロード運転からフルロード運転への切り替わり、吸込み管途中に設けた大きなトラップ、温度自動膨張弁の感温筒が吸込み管からはずれることなどがある。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "負荷急変、フルロード復帰時の圧力急低下、トラップ内の油・液の引き込み、感温筒外れによる全開動作などはいずれも湿り運転・液戻りの典型原因である。"}, {"id": 431, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ハ", "theme": "弁漏れ時の吐出し温度変化", "question": "往復圧縮機の吸込み弁や吐出し弁に漏れが生じると、圧縮機の吐出しガス温度にほとんど変化はみられないが、圧縮機の体積効率や冷凍装置の冷凍能力の大きな低下を招く。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "吐出し弁に漏れが生じた場合、高温吐出しガスがシリンダ内に逆流・再圧縮されるため「吐出しガス温度が大きく上昇する」（ほとんど変化はみられないは誤り）。"}, {"id": 432, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ニ", "theme": "密閉圧縮機のモータ焼損洗浄範囲", "question": "密閉圧縮機の電動機が焼損すると、巻線の絶縁物や冷凍機油が焼けて、圧縮機内の全面にカーボンが付着し、装置内の高圧系統の膨張弁までの熱交換器や配管に汚れが生じる。圧縮機を交換し、これらの高圧系統の部分を十分に洗浄すれば正常運転が可能である。", "answer": "×", "law": "上級テキスト 運転保守編", "explanation": "モータ焼損によるスラッジや酸性劣化物、カーボンは高圧側だけでなく低圧側（蒸発器・吸込管）を含む「冷媒系統全体」に広がるため、全系統の完全洗浄が必要（高圧系統のみの洗浄は誤り）。"}, {"id": 433, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "イ", "theme": "不凝縮ガスの確認手順", "question": "水冷凝縮器を用いた冷凍装置内に不凝縮ガスが混入すると、この不凝縮ガスの分圧と冷却管における冷媒側の熱伝達抵抗の増大により、凝縮器内の圧力が高くなる。不凝縮ガス混入の有無は、一般に圧縮機の停止数分後の凝縮器内冷媒圧力と冷却水温度を計測して、冷却水温度に相当する冷媒の飽和圧力から判断する。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "停止直後は器内温度が均一でないため、不凝縮ガスの確認は圧縮機停止後「冷却水を20〜30分間通水し続けた後」に測定して判断する（「停止数分後」は誤り）。"}, {"id": 434, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ロ", "theme": "空冷凝縮器風量制御と温度差", "question": "空冷凝縮器を用いた冷凍装置における、冬季の外気温度の低下による膨張弁容量不足の対策の一つとして、空冷凝縮器の送風機の風量を減少させる方法がある。この方法では、凝縮器の熱通過率は変わらないが、凝縮器の冷媒と空気との間の平均温度差が小さくなり、膨張弁容量の不足を防止できる。", "answer": "×", "law": "上級テキスト 凝縮器編", "explanation": "風量を減らすと空気側熱伝達率が下がり「熱通過率Kが小さくなる」。その結果、放熱のために「平均温度差Δtが大きくなり」、凝縮温度・圧力が上昇して維持される（熱通過率は変わらない・温度差が小さくなるは誤り）。"}, {"id": 435, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ハ", "theme": "油膜と水あかの熱通過率影響", "question": "R22は鉱油をかなりよく溶解するので、伝熱面に油膜を形成しにくいが、アンモニアは鉱油をほとんど溶解せず、伝熱面に油膜を形成し、熱通過率を低下させる。通常の運転状態における水冷凝縮器の冷却管外表面に付着した油膜と、この冷却管内表面に厚く付着した水あかとを比較すると、熱通過率の低下に対する影響は水あかのほうが大きい。", "answer": "○", "law": "上級テキスト 凝縮器編", "explanation": "油膜の厚さは数十μm程度にとどまるが、冷却水側の水あかは掃除を怠ると数mm単位で厚く堆積するため、熱通過率低下への悪影響は水あかのほうが圧倒的に大きい。"}, {"id": 436, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ニ", "theme": "二段圧縮装置の液封箇所", "question": "液ポンプ方式の低温用二段圧縮冷凍装置において、液封を起こしやすい箇所は、高圧受液器から中間冷却器および中間冷却器から低圧受液器にいたる液管、低圧受液器の液ポンプ出口から蒸発器への低圧配管などであり、これらの箇所には圧力逃がし弁などを設ける。", "answer": "○", "law": "上級テキスト 配管編", "explanation": "前後の弁を閉止した際に液が充満密閉されやすい液管部には、受熱による異常高圧破裂事故を防ぐため安全弁や圧力逃がし弁を設置する。"}, {"id": 437, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "イ", "theme": "蒸発温度差の設定影響", "question": "一般的な冷凍装置の蒸発器における蒸発温度と被冷却物との温度差は、利用用途ごとに、ある程度経験的に決まっている。例えば、空気冷却器の温度差は、空調用で15Kから20K、冷蔵用で5Kから10Kとしている。この温度差が小さ過ぎると、伝熱面積の大きな蒸発器を必要とするうえ、成績係数の低下を招く。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "温度差が小さすぎると伝熱面積は大きくなるが、蒸発温度が高くなるため圧縮比が小さくなり「成績係数は向上する」（成績係数の低下を招くは誤り）。"}, {"id": 438, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ロ", "theme": "蒸発器の熱通過率影響因子", "question": "冷凍装置の保守上、蒸発器の熱通過率はできるだけ高く保持することが重要である。水冷却器の冷却管への水あかの付着や、低温の空気冷却器への霜の付着は、蒸発器の熱通過率を低下させる。このほかにも空気冷却器の前面風速や満液式水冷却器の冷却管内の流速などが熱通過率に影響する。", "answer": "○", "law": "上級テキスト 蒸発器編", "explanation": "管内外面の汚れ・着霜は熱伝導抵抗を増やし、風速や水流速の低下は熱伝達率を下げて熱通過率を著しく低下させる。"}, {"id": 439, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ハ", "theme": "蒸発温度低下と蒸気密度", "question": "冷凍装置における蒸発温度の低下は、蒸発器内の冷媒圧力の低下や冷媒の湿り飽和蒸気の密度の増大を招く。また、冷凍能力は圧縮機に吸い込まれる蒸気量によって変わるので、蒸発温度の低下は冷凍能力を減少させる。", "answer": "×", "law": "上級テキスト 蒸発器編", "explanation": "蒸発温度が低下すると圧力が下がり、比体積が大きくなるため「蒸気の密度は減少（小さく）する」（密度の増大を招くは誤り）。"}, {"id": 440, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ニ", "theme": "冷媒充填量不足の症状と受液器確認", "question": "冷凍装置への冷媒充てん量不足は、フラッシュガスの発生、冷却不良、蒸発圧力の異常低下などを生じる。日ごろの保守点検では、冷媒充てん量を運転中の高圧受液器の液面高さなどによって確認することが重要である。", "answer": "○", "law": "上級テキスト 運転保守編", "explanation": "冷媒不足は液管フラッシュガスによる供給不足を引き起こす。運転中の高圧受液器液面（通常1/3〜1/2程度）を目視点検することが重要である。"}, {"id": 441, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "イ", "theme": "乾式蒸発器の温度差と空気側伝熱", "question": "空気冷却用のフィンコイル乾式蒸発器では、空気と冷媒との平均温度差が大きくなると伝熱量が増大して熱流束も大きくなる。このとき、冷媒側熱伝達率はほとんど変わらないが、空気側熱伝達率が大きくなり、熱通過率も大きくなる。", "answer": "×", "law": "上級テキスト 熱交換器編", "explanation": "平均温度差が大きくなると沸騰が活発になり「冷媒側熱伝達率が大きく」なるが、「空気側熱伝達率は風速で決まるためほとんど変わらない」（記述が逆であり誤り）。"}, {"id": 442, "subject": "保安管理技術", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ロ", "theme": "アンローダ作動時の蒸発温度変化", "question": "アンローダを備えた多気筒圧縮機を用いた冷凍装置では、熱負荷の減少によりアンローダが作動すると、全負荷時より蒸発温度が低くなり、蒸発器の入口空気温度と蒸発温度との温度差が減少し、冷凍能力を低下させる。", "answer": "×", "law": "上級テキスト 容量制御編", "explanation": "アンローダが作動して圧縮機吸込み量が減ると、蒸発圧力・蒸発温度は全負荷時より「高く」なる（「全負荷時より蒸発温度が低くなり」は誤り）。"}, {"id": 443, "subject": "保安管理技術", "year": "2018年度(平
