90秒）継続したときに回路を開いて圧縮機を停止させる。", "answer": "○", "law": "OPSは実質的な潤滑駆動圧である「油ポンプ吐出圧−クランクケース圧」の差圧を監視し、起動時の一時的油圧遅れを考慮したタイマ遅延を経て停止動作を行う。よって記述は正しい。", "explanation": "OPSは実質的な潤滑駆動圧である「油ポンプ吐出圧−クランクケース圧」の差圧を監視し、起動時の一時的油圧遅れを考慮したタイマ遅延を経て停止動作を行う。よって記述は正しい。"}, {"id": 2156, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器・保護装置", "question": "冷却水系統に設けられるフロースイッチは、冷却水管内の温度変化を検知して作動するものであり、冷却水の流水停止時に圧縮機を緊急停止させる機能はない。", "answer": "×", "law": "フロースイッチは管内の水流（パドル受圧や差圧）を検知する流量スイッチであり、冷却水ポンプ停止や断水時に即座に圧縮機をインターロック停止させる。記述は誤り。", "explanation": "フロースイッチは管内の水流（パドル受圧や差圧）を検知する流量スイッチであり、冷却水ポンプ停止や断水時に即座に圧縮機をインターロック停止させる。記述は誤り。"}, {"id": 2157, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "油分離器は、圧縮機吐出しガス中に混入した冷凍機油を分離してクランクケースへ戻す機器であり、特にアンモニアのように油と冷媒が非相溶である装置や、配管が長く油戻りが困難な冷凍装置に設置される。", "answer": "○", "law": "吐出しガスから油滴を衝突・遠心力等で分離して回収する油分離器は、蒸発器への油付着による伝熱低下や圧縮機の油枯渇を防ぐために極めて有効である。よって記述は正しい。", "explanation": "吐出しガスから油滴を衝突・遠心力等で分離して回収する油分離器は、蒸発器への油付着による伝熱低下や圧縮機の油枯渇を防ぐために極めて有効である。よって記述は正しい。"}, {"id": 2158, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器（レシーバ）は、凝縮器で凝縮液化した冷媒を一時的に貯留し、負荷変動に応じた液冷媒を膨張弁へ安定供給するとともに、点検・修理時に装置内の冷媒を回収（ポンプダウン）する容積を有する。", "answer": "○", "law": "高圧受液器は液封防止のため20%以上の気相空間を残す設計（充填回収率80%以下）とし、負荷に応じた液供給の緩衝と冷媒回収容器の役割を果たす。よって記述は正しい。", "explanation": "高圧受液器は液封防止のため20%以上の気相空間を残す設計（充填回収率80%以下）とし、負荷に応じた液供給の緩衝と冷媒回収容器の役割を果たす。よって記述は正しい。"}, {"id": 2159, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "フィルタドライヤは、冷媒系統内の固形異物を除去するフィルタ機能と、水分を物理吸着する乾燥剤（モレキュラーシーブ等）を一体化したものであり、主にフルオロカーボン冷媒系統の液管に設置される。", "answer": "○", "law": "フルオロカーボン冷媒装置では水分混入による加水分解や膨張弁でのアイスプラグを防ぐため、合成ゼオライト等の乾燥剤とフィルタを内蔵したフィルタドライヤが液管に設置される。よって記述は正しい。", "explanation": "フルオロカーボン冷媒装置では水分混入による加水分解や膨張弁でのアイスプラグを防ぐため、合成ゼオライト等の乾燥剤とフィルタを内蔵したフィルタドライヤが液管に設置される。よって記述は正しい。"}, {"id": 2160, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "吸込み液分離器（アキュムレータ）は、蒸発器から圧縮機へ戻る未蒸発の液冷媒を気液分離して液バック（液圧縮）を防止する機器であり、回収した油を冷媒とともに微量ずつ圧縮機へ戻すためのオリフィス孔がU字管底部に設けられている。", "answer": "○", "law": "アキュムレータは低圧蒸気配管に設置され、液冷媒を重力分離して気体のみを圧縮機へ送り、底部オイルはU字管の小孔から少量ずつ吸入させてクランクケースへ戻す。よって記述は正しい。", "explanation": "アキュムレータは低圧蒸気配管に設置され、液冷媒を重力分離して気体のみを圧縮機へ送り、底部オイルはU字管の小孔から少量ずつ吸入させてクランクケースへ戻す。よって記述は正しい。"}, {"id": 2161, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "イ", "theme": "附属機器", "question": "フルオロカーボン冷凍装置に用いられる液ガス熱交換器は、高圧の高温冷媒液と低圧の低温吸込み蒸気の間で熱交換を行わせ、冷媒液の過冷却度を増大させてフラッシュガス発生を防止するとともに、吸込み蒸気を過熱して湿り運転を防止する。", "answer": "○", "law": "液ガス熱交換器は凝縮液の過冷却度を高めて配管立上り等での発泡を防ぎ、吸込み蒸気の過熱度を確保して圧縮機への液戻り（湿り圧縮）を防止する。よって記述は正しい。", "explanation": "液ガス熱交換器は凝縮液の過冷却度を高めて配管立上り等での発泡を防ぎ、吸込み蒸気の過熱度を確保して圧縮機への液戻り（湿り圧縮）を防止する。よって記述は正しい。"}, {"id": 2162, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器", "question": "アンモニア冷凍装置においても、圧縮機の吸込み過熱度を大きくして冷凍能力を高めるため、液ガス熱交換器を設置するのが一般的である。", "answer": "×", "law": "アンモニアは断熱圧縮時の比熱比が大きいため、吸込み過熱度が増大すると吐出しガス温度が危険な高温に達して油の炭化や弁破損を起こす。そのためアンモニア装置に液ガス熱交換器は使用しない。誤り。", "explanation": "アンモニアは断熱圧縮時の比熱比が大きいため、吸込み過熱度が増大すると吐出しガス温度が危険な高温に達して油の炭化や弁破損を起こす。そのためアンモニア装置に液ガス熱交換器は使用しない。誤り。"}, {"id": 2163, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器", "question": "不凝縮ガス分離器（ガスパージャ）は、装置内の不凝縮ガス（空気等）を冷媒蒸気とともに冷却し、冷媒を凝縮液化して系統内へ戻し、不凝縮ガスのみを安全に器外へ排出する機器である。", "answer": "○", "law": "冷媒と不凝縮ガスの混合気体を冷却して冷媒蒸気のみを液化凝縮させて回収し、残った空気などの不凝縮ガスを自動または手動で大気中（毒性冷媒は除害設備経由）へ放出する。よって記述は正しい。", "explanation": "冷媒と不凝縮ガスの混合気体を冷却して冷媒蒸気のみを液化凝縮させて回収し、残った空気などの不凝縮ガスを自動または手動で大気中（毒性冷媒は除害設備経由）へ放出する。よって記述は正しい。"}, {"id": 2164, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器", "question": "冷媒液強制循環式冷凍装置では、低圧受液器から液ポンプ（キャンドモータポンプ等）を用いて蒸発器へ循環倍数（蒸発量の数倍）の冷媒液を強制供給するため、蒸発器伝熱管全域を濡れ壁状態にして熱伝達率を高く維持できる。", "answer": "○", "law": "液循環ポンプで蒸発量の3〜5倍の過剰な冷媒液を蒸発器に送り込むことで、管内全体が常に液膜で覆われて熱伝達率が向上し、多数の冷却器へも均等配分できる。よって記述は正しい。", "explanation": "液循環ポンプで蒸発量の3〜5倍の過剰な冷媒液を蒸発器に送り込むことで、管内全体が常に液膜で覆われて熱伝達率が向上し、多数の冷却器へも均等配分できる。よって記述は正しい。"}, {"id": 2165, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管", "question": "圧縮機から凝縮器へ至る吐出しガス配管は、圧縮機の停止中に配管内で凝縮した液や同伴した油が圧縮機シリンダヘッドへ逆流しないよう、立ち上がり管を設けた後、凝縮器へ向かって下がり勾配で配管する。", "answer": "○", "law": "吐出し配管は停止時の液冷媒や油の圧縮機逆流による始動時液圧縮を防ぐため、立上がりループを設けた上で凝縮器側へ下がり勾配（1/100〜1/200程度）で施工する。よって記述は正しい。", "explanation": "吐出し配管は停止時の液冷媒や油の圧縮機逆流による始動時液圧縮を防ぐため、立上がりループを設けた上で凝縮器側へ下がり勾配（1/100〜1/200程度）で施工する。よって記述は正しい。"}, {"id": 2166, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管", "question": "蒸発器から圧縮機へ至る吸込みガス配管において、立上がり管内を流れるガス流速が遅すぎると、油がガスに同伴されずに立上がり管底部に滞留して油戻り不良となるため、最小ガス流速を確保するかオイルトラップを設ける。", "answer": "○", "law": "立上がり吸込み管では冷媒ガスが油を上方へ運ぶ同伴速度（通常5m/s以上）が必要であり、低負荷時の油滞留を防ぐため底部トラップやダブルライザー等の工夫が施される。よって記述は正しい。", "explanation": "立上がり吸込み管では冷媒ガスが油を上方へ運ぶ同伴速度（通常5m/s以上）が必要であり、低負荷時の油滞留を防ぐため底部トラップやダブルライザー等の工夫が施される。よって記述は正しい。"}, {"id": 2167, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管", "question": "銅管のろう付け接合において、管と継手の隙間が広すぎると毛細管現象が働かずろうが均一に行き渡らないため、隙間は0.05〜0.45mm程度に適切に管理する。", "answer": "○", "law": "銅管のろう付け（銀ろう・りん銅ろう）は毛細管現象により隙間に溶融ろうを浸透させて強固な接合面を得るため、管径に応じた0.05〜0.45mm程度の適正クリアランスが必要である。よって記述は正しい。", "explanation": "銅管のろう付け（銀ろう・りん銅ろう）は毛細管現象により隙間に溶融ろうを浸透させて強固な接合面を得るため、管径に応じた0.05〜0.45mm程度の適正クリアランスが必要である。よって記述は正しい。"}, {"id": 2168, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管", "question": "止め弁等で密閉封鎖される可能性のある液管回路において、冷媒液が満液封入された状態で外部から加熱されると、液の熱膨張により内圧が異常上昇して弁や管が破壊する液封事故が発生するおそれがある。", "answer": "○", "law": "液体冷媒は非圧縮性で熱膨張率が大きいため、電磁弁と手動弁の間などに液が閉じ込められると温度上昇で数倍以上の異常高圧が発生し、管破裂や弁破損に至る。安全弁等の逃がし装置が必要である。よって記述は正しい。", "explanation": "液体冷媒は非圧縮性で熱膨張率が大きいため、電磁弁と手動弁の間などに液が閉じ込められると温度上昇で数倍以上の異常高圧が発生し、管破裂や弁破損に至る。安全弁等の逃がし装置が必要である。よって記述は正しい。"}, {"id": 2169, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "冷媒設備に設置する安全弁は、設備の許容圧力（設計圧力）以下の吹出し圧力で作動するように設定し、作動時に圧力を許容圧力以下に確実に復帰させる能力を有するものでなければならない。", "answer": "○", "law": "スプリング式安全弁の吹出し圧力（セット圧）は設備の許容圧力以下とし、異常圧力を速やかに逃がして設備破壊を防止する。よって記述は正しい。", "explanation": "スプリング式安全弁の吹出し圧力（セット圧）は設備の許容圧力以下とし、異常圧力を速やかに逃がして設備破壊を防止する。よって記述は正しい。"}, {"id": 2170, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "圧力容器用安全弁の最小口径は、冷媒ガスの種類に応じた定数、圧力容器の外径および全長から算出される。", "answer": "○", "law": "圧力容器用安全弁の必要最小口径式 d3 = C3 * sqrt(D * L) において、冷媒物性定数C3、容器外径D、容器全長Lから外部火災時の必要吹出し面積が決定される。よって記述は正しい。", "explanation": "圧力容器用安全弁の必要最小口径式 d3 = C3 * sqrt(D * L) において、冷媒物性定数C3、容器外径D、容器全長Lから外部火災時の必要吹出し面積が決定される。よって記述は正しい。"}, {"id": 2171, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "可燃性ガスまたは毒性ガス（アンモニア等）を冷媒とする装置では、安全弁が作動した際に冷媒が大気中へ無制限に放出されるのを防ぐため、放出管の末端を除害設備や水槽等の安全な処理設備へ接続する。", "answer": "○", "law": "毒性・可燃性冷媒の安全弁放出管は、吹き出したガスによる中毒・引火事故を防ぐため、水槽散水やスクラバー等の除害処理設備へ導いて安全処理する。よって記述は正しい。", "explanation": "毒性・可燃性冷媒の安全弁放出管は、吹き出したガスによる中毒・引火事故を防ぐため、水槽散水やスクラバー等の除害処理設備へ導いて安全処理する。よって記述は正しい。"}, {"id": 2172, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "破裂板は、薄板の金属板が所定の圧力差で破断する非復帰型の安全装置であり、アンモニアや可燃性フルオロカーボン冷媒設備の大気放出配管に単独で設けることが推奨される。", "answer": "×", "law": "破裂板は一度作動すると全量大気放出となり復帰しないため、毒性・可燃性冷媒設備の大気放出管に単独で用いることは禁じられている。安全弁一次側の腐食防止・気密保持併用等に限定される。誤り。", "explanation": "破裂板は一度作動すると全量大気放出となり復帰しないため、毒性・可燃性冷媒設備の大気放出管に単独で用いることは禁じられている。安全弁一次側の腐食防止・気密保持併用等に限定される。誤り。"}, {"id": 2173, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験および溶接部試験", "question": "冷媒設備の完成検査において実施する耐圧試験は、配管以外の冷媒設備について、水等の安全な液体を用いる場合は許容圧力の1.5倍以上、空気や窒素等の気体を用いる場合は許容圧力の1.25倍以上の圧力で行う。", "answer": "○", "law": "耐圧試験圧力の基準は、液体耐圧試験が許容圧力の1.5倍以上、気体耐圧試験（液体使用困難時）が許容圧力の1.25倍以上と法定されている。よって記述は正しい。", "explanation": "耐圧試験圧力の基準は、液体耐圧試験が許容圧力の1.5倍以上、気体耐圧試験（液体使用困難時）が許容圧力の1.25倍以上と法定されている。よって記述は正しい。"}, {"id": 2174, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験および溶接部試験", "question": "冷媒設備の気密試験は、耐圧強度が確認された設備について、許容圧力以上の圧力で空気や窒素等の乾燥気体を用いて行い、漏れのないことを確認する。", "answer": "○", "law": "気密試験は配管・機器全体の漏れを検査するため、許容圧力以上の試験圧力で不活性ガス等を用いて加圧し、発泡液や検知器で漏洩のないことを確認する。よって記述は正しい。", "explanation": "気密試験は配管・機器全体の漏れを検査するため、許容圧力以上の試験圧力で不活性ガス等を用いて加圧し、発泡液や検知器で漏洩のないことを確認する。よって記述は正しい。"}, {"id": 2175, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験および溶接部試験", "question": "気密試験に純酸素を使用すると、配管内の冷凍機油等と急激に酸化反応を起こして爆発する危険があるため、絶対に使用してはならない。", "answer": "○", "law": "酸素は支燃性が極めて強く、圧縮下の油や可燃性残存物と接触すると自己発火・ディーゼル爆発を起こすため、気密試験ガスとしての使用は厳禁である。よって記述は正しい。", "explanation": "酸素は支燃性が極めて強く、圧縮下の油や可燃性残存物と接触すると自己発火・ディーゼル爆発を起こすため、気密試験ガスとしての使用は厳禁である。よって記述は正しい。"}, {"id": 2176, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験および溶接部試験", "question": "真空放置試験において、真空引き後に放置した際に圧力が水蒸気の飽和圧力（常温で2〜3kPa程度）付近で一定時間を維持した後に徐々に上昇する場合は、配管接合部からの空気漏れ（漏えい）ではなく系内の残留水分の蒸発が主な原因であると判断できる。", "answer": "○", "law": "真空放置試験で常温の水蒸気飽和圧付近で圧力上昇が一旦止まる（プラトーを示す）現象は管内の水分蒸発（気化）特有の挙動であり、配管漏れ（外気侵入）の場合は直線的に大気圧まで上昇する。よって記述は正しい。", "explanation": "真空放置試験で常温の水蒸気飽和圧付近で圧力上昇が一旦止まる（プラトーを示す）現象は管内の水分蒸発（気化）特有の挙動であり、配管漏れ（外気侵入）の場合は直線的に大気圧まで上昇する。よって記述は正しい。"}, {"id": 2177, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "イ", "theme": "据付け・試運転", "question": "往復圧縮機などの振動を伴う機器のコンクリート基礎は、十分な剛性と重量をもたせ、通常は機器本体質量の1〜3倍程度の基礎質量を確保する。", "answer": "○", "law": "往復動機械は往復ピストンの不平衡慣性力による起振力をもつため、十分な質量（機器の1〜3倍以上）の基礎コンクリートに強固に締結して振動伝播を抑える。よって記述は正しい。", "explanation": "往復動機械は往復ピストンの不平衡慣性力による起振力をもつため、十分な質量（機器の1〜3倍以上）の基礎コンクリートに強固に締結して振動伝播を抑える。よって記述は正しい。"}, {"id": 2178, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ロ", "theme": "据付け・試運転", "question": "冷凍機油（潤滑油）は、冷媒に対する相溶性、潤滑性、熱・化学的安定性に優れ、低温下でワックス成分が析出して流動性を失わないよう流動点（凝固点）が使用蒸発温度より十分に低いものを選定する。", "answer": "○", "law": "冷凍機油は蒸発器内の極低温環境でも固化・析出せず、膨張弁の絞り部や伝熱管壁にワックススラッジを作らないよう低い流動点とフロック点をもつ必要がある。よって記述は正しい。", "explanation": "冷凍機油は蒸発器内の極低温環境でも固化・析出せず、膨張弁の絞り部や伝熱管壁にワックススラッジを作らないよう低い流動点とフロック点をもつ必要がある。よって記述は正しい。"}, {"id": 2179, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ハ", "theme": "据付け・試運転", "question": "冷媒充てん作業において、液管側（受液器や凝縮器出口）から液冷媒を充てんする場合は圧縮機を停止した状態で行い、運転中に補充する場合は吸込み弁手前など低圧側からガス状で徐々に吸引させる。", "answer": "○", "law": "初期チャージは停止状態で高圧側から液で急速充てんし、運転中の微調整補充は圧縮機への液バック破損を防ぐため低圧側から気体（ガス状）で慎重に行う。よって記述は正しい。", "explanation": "初期チャージは停止状態で高圧側から液で急速充てんし、運転中の微調整補充は圧縮機への液バック破損を防ぐため低圧側から気体（ガス状）で慎重に行う。よって記述は正しい。"}, {"id": 2180, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ニ", "theme": "据付け・試運転", "question": "アンモニア冷媒は、空気との混合体積濃度が15〜28%の範囲で爆発・燃焼する可燃性を有し、かつ人体に対して強い刺激臭と毒性を有するため、機械室には漏えい検知警報器および除害・換気設備を設ける。", "answer": "○", "law": "アンモニアは高圧ガス保安法上で「毒性ガス」かつ「可燃性ガス」に指定されており、万一の漏洩事故時の人体危害と火災爆発を防ぐため検知警報設備や強制排気・除害装置の設置が義務付けられる。よって記述は正しい。", "explanation": "アンモニアは高圧ガス保安法上で「毒性ガス」かつ「可燃性ガス」に指定されており、万一の漏洩事故時の人体危害と火災爆発を防ぐため検知警報設備や強制排気・除害装置の設置が義務付けられる。よって記述は正しい。"}, {"id": 2181, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "多気筒往復圧縮機は、シリンダをV形、W形または放射状に配置することで小形軽量化を図っており、気筒ごとにアンローダ機構を設けて作動気筒数を変化させることで容量制御を行うことができる。", "answer": "○", "law": "多気筒往復圧縮機は気筒配置の工夫により小形化され、油圧作動のアンローダピストンで吸込み弁を強制開放して気筒ごとに仕事を停止させ、段階的な容量制御が可能である。よって記述は正しい。", "explanation": "多気筒往復圧縮機は気筒配置の工夫により小形化され、油圧作動のアンローダピストンで吸込み弁を強制開放して気筒ごとに仕事を停止させ、段階的な容量制御が可能である。よって記述は正しい。"}, {"id": 2182, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "ツインスクリュー圧縮機は、ケーシング内で噛み合って回転する雌雄一対のスクリューロータの歯溝容積が吐出し側へ移動するにつれて縮小することで冷媒を圧縮する容積圧縮機である。", "answer": "○", "law": "ツインスクリュー圧縮機は、互いに噛み合う雌雄ロータとケーシングとの間に形成される空間が回転に伴って吸込み側から吐出し側へ移動しながら連続的に縮小して圧縮を行う。よって記述は正しい。", "explanation": "ツインスクリュー圧縮機は、互いに噛み合う雌雄ロータとケーシングとの間に形成される空間が回転に伴って吸込み側から吐出し側へ移動しながら連続的に縮小して圧縮を行う。よって記述は正しい。"}, {"id": 2183, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "半密閉形圧縮機は、圧縮機本体と駆動用電動機が別々のフレームに配置され、軸封装置（メカニカルシール）を介してベルト駆動またはカップリング駆動される構造である。", "answer": "×", "law": "圧縮機と電動機が同一ケーシング内に収められ、分解点検可能なボルト締め構造となっているものが「半密閉形」である。軸封装置を介して外部電動機で駆動するものは「開放形」であるため誤り。", "explanation": "圧縮機と電動機が同一ケーシング内に収められ、分解点検可能なボルト締め構造となっているものが「半密閉形」である。軸封装置を介して外部電動機で駆動するものは「開放形」であるため誤り。"}, {"id": 2184, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、高速回転する羽根車（インペラ）によって冷媒蒸気に与えられた遠心力と速度エネルギーを、固定流路であるディフューザ等で圧力エネルギーに変換する流体機械である。", "answer": "○", "law": "遠心（ターボ）圧縮機は、インペラによりガスを加速して運動エネルギーを与え、ディフューザや渦巻室（ボリュート）で減速させることによって静圧へ変換・圧縮する。よって記述は正しい。", "explanation": "遠心（ターボ）圧縮機は、インペラによりガスを加速して運動エネルギーを与え、ディフューザや渦巻室（ボリュート）で減速させることによって静圧へ変換・圧縮する。よって記述は正しい。"}, {"id": 2185, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "インバータを用いて圧縮機駆動電動機の電源周波数を変化させる容量制御では、回転速度の増減によって冷媒循環量を連続的に制御できるため、オンオフ制御に比べて省エネルギー効果が高い。", "answer": "○", "law": "インバータ制御は熱負荷の変動に追従して圧縮機の回転速度（周波数）を滑らかに加減速できるため、部分負荷時における無駄な電力消費や起動損失を抑え、高い省エネ性を発揮する。よって記述は正しい。", "explanation": "インバータ制御は熱負荷の変動に追従して圧縮機の回転速度（周波数）を滑らかに加減速できるため、部分負荷時における無駄な電力消費や起動損失を抑え、高い省エネ性を発揮する。よって記述は正しい。"}, {"id": 2186, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "多気筒往復圧縮機の吸込み弁アンローダ機構は、吸込み弁板を弁座に強く押し付けて密閉することにより、その気筒への冷媒ガスの吸込みを完全に遮断してアンロード状態にする。", "answer": "×", "law": "アンローダ機構はアンローダピン等によって吸込み弁板を「押し上げて開放状態に保持」し、ピストンが動いてもガスを圧縮させずに吸込み側へ素通りさせる。「弁座に強く押し付けて密閉する」は誤り。", "explanation": "アンローダ機構はアンローダピン等によって吸込み弁板を「押し上げて開放状態に保持」し、ピストンが動いてもガスを圧縮させずに吸込み側へ素通りさせる。「弁座に強く押し付けて密閉する」は誤り。"}, {"id": 2187, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパスによる容量制御において、高圧の吐出しガスを圧縮機の吸込み管に直接戻す場合は、吸込み過熱度が過大となって吐出しガス温度が異常上昇するのを防ぐため、液噴射弁を併用して吸込みガスを冷却することがある。", "answer": "○", "law": "高温のホットガスが直接吸込み管に戻ると吸込み温度が過昇し圧縮機が過熱運転となるため、液配管から冷媒液をバイパス管内へ噴射して気化熱で減温・冷却するデスーパーヒータを併用する。よって記述は正しい。", "explanation": "高温のホットガスが直接吸込み管に戻ると吸込み温度が過昇し圧縮機が過熱運転となるため、液配管から冷媒液をバイパス管内へ噴射して気化熱で減温・冷却するデスーパーヒータを併用する。よって記述は正しい。"}, {"id": 2188, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "並列運転される複数台の圧縮機をもつ冷凍装置では、負荷の増減に応じて運転台数を増減させる台数制御を行うことで、装置全体として効率的な部分負荷運転を行うことができる。", "answer": "○", "law": "複数台の圧縮機をステップ状に順次発停（またはインバータ機と組み合わせ）させる台数制御は、各圧縮機を高効率な定格付近で運転できるため、広い負荷変動に対して高い効率を保てる。よって記述は正しい。", "explanation": "複数台の圧縮機をステップ状に順次発停（またはインバータ機と組み合わせ）させる台数制御は、各圧縮機を高効率な定格付近で運転できるため、広い負荷変動に対して高い効率を保てる。よって記述は正しい。"}, {"id": 2189, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吸込み蒸気過熱度が適正値よりも小さすぎると、蒸発器から未蒸発の液冷媒が圧縮機に吸い込まれる液戻り（湿り圧縮）が発生し、液圧縮による吐出し弁の破損や油の希釈による潤滑不良を招く。", "answer": "○", "law": "吸込み過熱度が不足すると湿り蒸気や液滴がシリンダに達し、非圧縮性の液を叩く液圧縮（ウォータハンマ）を起こして弁やピストンを破壊するほか、クランクケース油を希釈して油膜切れを招く。よって記述は正しい。", "explanation": "吸込み過熱度が不足すると湿り蒸気や液滴がシリンダに達し、非圧縮性の液を叩く液圧縮（ウォータハンマ）を起こして弁やピストンを破壊するほか、クランクケース油を希釈して油膜切れを招く。よって記述は正しい。"}, {"id": 2190, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吸込み圧力が所定値より著しく低下すると、圧縮機の圧力比が増大し、体積効率が低下するとともに吐出しガス温度が上昇して過熱運転となる。", "answer": "○", "law": "吸込み圧力の低下は圧力比（凝縮圧力／吸込み圧力）を著しく増大させ、隙間容積からの再膨張ガス量増加による体積効率低下と、圧縮熱増大による吐出しガス温度の過昇（過熱運転）を引き起こす。よって記述は正しい。", "explanation": "吸込み圧力の低下は圧力比（凝縮圧力／吸込み圧力）を著しく増大させ、隙間容積からの再膨張ガス量増加による体積効率低下と、圧縮熱増大による吐出しガス温度の過昇（過熱運転）を引き起こす。よって記述は正しい。"}, {"id": 2191, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "冷凍装置の長期停止中にクランクケースヒータを通電しておくのは、周囲温度低下時にクランクケース内の冷凍機油の粘度が高くなりすぎて始動トルクが過大になるのを防ぐことだけが目的である。", "answer": "×", "law": "クランクケースヒータの最大の目的は、停止中に油温を周囲温度より高く保ち、冷媒が油中に過剰に溶解（寝込み）して起動時に激しいオイルフォーミングや液圧縮を起こすのを防ぐことである。誤り。", "explanation": "クランクケースヒータの最大の目的は、停止中に油温を周囲温度より高く保ち、冷媒が油中に過剰に溶解（寝込み）して起動時に激しいオイルフォーミングや液圧縮を起こすのを防ぐことである。誤り。"}, {"id": 2192, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の運転中にシリンダヘッドから異常な金属打撃音が発生した場合、原因として吐出し弁のボルト緩みや破損、弁ばねの折損、または液圧縮の発生などが疑われる。", "answer": "○", "law": "シリンダ部からの異常打撃音（ノッキング）は、弁板や弁ばねの折損脱落、ボルト等の機械的緩み、あるいは多量の液冷媒流入による液圧縮などが主な原因である。直ちに停止点検を要する。よって記述は正しい。", "explanation": "シリンダ部からの異常打撃音（ノッキング）は、弁板や弁ばねの折損脱落、ボルト等の機械的緩み、あるいは多量の液冷媒流入による液圧縮などが主な原因である。直ちに停止点検を要する。よって記述は正しい。"}, {"id": 2193, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "水冷横形シェルアンドチューブ凝縮器において、冷却水量が正常であっても管内面にスケール（炭酸カルシウム等）が付着すると、熱伝達が阻害されて凝縮温度が上昇し、高圧圧力が異常上昇する。", "answer": "○", "law": "冷却水中の硬度成分が析出したスケール層は熱伝導率が極めて低いため大きな熱抵抗となり、水と冷媒間の熱通過率を低下させて凝縮温度・圧力の上昇を招く。よって記述は正しい。", "explanation": "冷却水中の硬度成分が析出したスケール層は熱伝導率が極めて低いため大きな熱抵抗となり、水と冷媒間の熱通過率を低下させて凝縮温度・圧力の上昇を招く。よって記述は正しい。"}, {"id": 2194, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "水冷凝縮器の冷却管腐食を防止するため、定期的に水質分析を行い、pH、電気伝導率、酸消費量、塩化物イオン濃度などを冷却水水質基準値内に維持管理する必要がある。", "answer": "○", "law": "冷却塔で濃縮される冷却水の水質悪化（pH低下や塩化物イオン・硫酸イオン増加）は銅管の孔食や腐食割れの原因となるため、水質管理や薬品注入、ブローダウン管理が必須である。よって記述は正しい。", "explanation": "冷却塔で濃縮される冷却水の水質悪化（pH低下や塩化物イオン・硫酸イオン増加）は銅管の孔食や腐食割れの原因となるため、水質管理や薬品注入、ブローダウン管理が必須である。よって記述は正しい。"}, {"id": 2195, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "凝縮器内に空気などの不凝縮ガスが滞留している場合、運転停止後十分に時間を置いて冷媒設備全体が周囲温度まで冷却された状態において、凝縮圧力計の指示値は周囲温度における飽和圧力と完全に一致する。", "answer": "×", "law": "不凝縮ガスが存在する場合、ドルトンの分圧の法則により「全圧＝冷媒の飽和蒸気圧＋不凝縮ガスの分圧」となるため、冷却静止後であっても周囲温度相当の飽和圧力より必ず高い指示値を示す。誤り。", "explanation": "不凝縮ガスが存在する場合、ドルトンの分圧の法則により「全圧＝冷媒の飽和蒸気圧＋不凝縮ガスの分圧」となるため、冷却静止後であっても周囲温度相当の飽和圧力より必ず高い指示値を示す。誤り。"}, {"id": 2196, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器では、送風機ファンの逆回転、Vベルトの緩みや破断、吸込み口の障害物によるショートサーキットなどがあると、風量不足により凝縮圧力が異常上昇する。", "answer": "○", "law": "ファンモータの結線逆相による逆回転、ベルトスリップ、吹出し空気の再吸い込み（ショートサーキット）等は空気流量の著しい低下を招き、高圧カットアウト作動の原因となる。よって記述は正しい。", "explanation": "ファンモータの結線逆相による逆回転、ベルトスリップ、吹出し空気の再吸い込み（ショートサーキット）等は空気流量の著しい低下を招き、高圧カットアウト作動の原因となる。よって記述は正しい。"}, {"id": 2197, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "乾式蒸発器において、液冷媒配管のストレーナが目詰まりすると、膨張弁への液冷媒供給量が不足し、蒸発圧力が低下するとともに吸込み過熱度が過大となる。", "answer": "○", "law": "ストレーナ詰まりによる流動抵抗増大は膨張弁前圧力を下げて冷媒供給量を制限するため、蒸発器内の液濡れ面積が減少して蒸発圧力が低下し、過熱度が大きくなる。よって記述は正しい。", "explanation": "ストレーナ詰まりによる流動抵抗増大は膨張弁前圧力を下げて冷媒供給量を制限するため、蒸発器内の液濡れ面積が減少して蒸発圧力が低下し、過熱度が大きくなる。よって記述は正しい。"}, {"id": 2198, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "満液式シェルアンドチューブ水冷却器では、伝熱管外面に冷媒液が満たされ、管内を水が流れる構造であるため、凍結防止用温度開閉器（アンチフリーズサーモ）を設けて水温が設定温度以下に低下した際に圧縮機を停止させる。", "answer": "○", "law": "満液式冷却器では管内の水が凍結すると管破壊・水浸入の大事故につながるため、出口水温等を監視する凍結防止サーモスタットを設け、氷点に近づく前に圧縮機を停止保護する。よって記述は正しい。", "explanation": "満液式冷却器では管内の水が凍結すると管破壊・水浸入の大事故につながるため、出口水温等を監視する凍結防止サーモスタットを設け、氷点に近づく前に圧縮機を停止保護する。よって記述は正しい。"}, {"id": 2199, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "空気冷却用フィンコイル蒸発器において、着霜が過度に進むとフィン間の通風が遮断されるが、冷媒と霜層との熱伝達率が極めて高いため、蒸発圧力や冷凍能力への影響はほとんどない。", "answer": "×", "law": "霜層は熱伝導率が小さく（断熱材のように作用し）、さらに通風抵抗を増大させて風量を激減させるため、熱交換が著しく妨げられて蒸発圧力と冷却能力が大きく低下する。誤り。", "explanation": "霜層は熱伝導率が小さく（断熱材のように作用し）、さらに通風抵抗を増大させて風量を激減させるため、熱交換が著しく妨げられて蒸発圧力と冷却能力が大きく低下する。誤り。"}, {"id": 2200, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "ブライン冷却用蒸発器では、ブラインの濃度が低下すると凍結温度が上昇して蒸発器内でブラインが凍結する危険が高まるため、定期的にボーメ度計や屈折計等で比重・濃度を測定管理する。", "answer": "○", "law": "大気中の水分吸収や補給水の混入でブライン（エチレングリコールや塩化カルシウム水溶液）の濃度が低下すると凍結温度が上昇し伝熱管破損を招くため、適正比重の維持管理が重要である。よって記述は正しい。", "explanation": "大気中の水分吸収や補給水の混入でブライン（エチレングリコールや塩化カルシウム水溶液）の濃度が低下すると凍結温度が上昇し伝熱管破損を招くため、適正比重の維持管理が重要である。よって記述は正しい。"}, {"id": 2201, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器の伝熱特性", "question": "熱交換器において、流体の熱伝達率は層流状態よりも乱流状態のほうが大きく、流速を増大させると熱伝達率は向上するが、流動に伴う圧力損失（流動抵抗）も増大する。", "answer": "○", "law": "流体が乱流になると流体粒子の混合が活発になり温度境界層が薄くなるため熱伝達率は高くなる。流速を上げると伝熱は促進されるが、管内圧力損失は流速の約2乗に比例して増加する。よって記述は正しい。", "explanation": "流体が乱流になると流体粒子の混合が活発になり温度境界層が薄くなるため熱伝達率は高くなる。流速を上げると伝熱は促進されるが、管内圧力損失は流速の約2乗に比例して増加する。よって記述は正しい。"}, {"id": 2202, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器の伝熱特性", "question": "凝縮器において、冷媒蒸気が冷却管表面で凝縮する際、膜状凝縮よりも滴状凝縮のほうが液膜による熱抵抗が小さいため、熱伝達率ははるかに大きくなる。", "answer": "○", "law": "冷媒液が管表面全体を膜状に覆う膜状凝縮に比べ、液滴となって滴り落ち常に伝熱面が蒸気に露出する滴状凝縮のほうが熱伝達率は数倍〜十倍以上大きくなる。よって記述は正しい。", "explanation": "冷媒液が管表面全体を膜状に覆う膜状凝縮に比べ、液滴となって滴り落ち常に伝熱面が蒸気に露出する滴状凝縮のほうが熱伝達率は数倍〜十倍以上大きくなる。よって記述は正しい。"}, {"id": 2203, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器の伝熱特性", "question": "伝熱管の内外面の熱伝達率に大きな差がある熱交換器では、熱伝達率の大きい側にフィンを取り付けることによって、装置全体を効率的に小形化することができる。", "answer": "×", "law": "フィン（拡大伝熱面）は熱抵抗の大きい側（熱伝達率の「小さい」側、例えば空気側）に取り付けなければ伝熱改善効果が得られない。「熱伝達率の大きい側に取り付ける」は誤り。", "explanation": "フィン（拡大伝熱面）は熱抵抗の大きい側（熱伝達率の「小さい」側、例えば空気側）に取り付けなければ伝熱改善効果が得られない。「熱伝達率の大きい側に取り付ける」は誤り。"}, {"id": 2204, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器の伝熱特性", "question": "対数平均温度差（LMTD）は、熱交換器の入口および出口における高温流体と低温流体の温度差から算出され、算術平均温度差よりも熱交換器の伝熱計算に適している。", "answer": "○", "law": "流体温度は熱交換に伴って指数関数的に変化するため、伝熱面積全域の真の有効温度差を正確に表す尺度として対数平均温度差（LMTD）が用いられる。よって記述は正しい。", "explanation": "流体温度は熱交換に伴って指数関数的に変化するため、伝熱面積全域の真の有効温度差を正確に表す尺度として対数平均温度差（LMTD）が用いられる。よって記述は正しい。"}, {"id": 2205, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "温度自動膨張弁の感温筒内に冷媒系統と同じ冷媒を満液充てんした液チャージ（蒸気圧チャージ）方式は、広い蒸発温度範囲で使用できるが、感温筒温度が上昇した際に内圧が過大になりやすい特徴がある。", "answer": "○", "law": "液チャージ方式は常に感温筒内に液が存在するため全温度域で飽和蒸気圧特性を示し追従性が安定する反面、高温時に極めて高圧となりダイヤフラム破損リスクや高負荷時の過負荷を招きやすい。よって記述は正しい。", "explanation": "液チャージ方式は常に感温筒内に液が存在するため全温度域で飽和蒸気圧特性を示し追従性が安定する反面、高温時に極めて高圧となりダイヤフラム破損リスクや高負荷時の過負荷を招きやすい。よって記述は正しい。"}, {"id": 2206, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "温度自動膨張弁のガスチャージ（制限チャージ・MOPチャージ）方式は、所定の温度以上になると感温筒内の液が完全に蒸発気化するため、それ以上の温度になっても圧力が急上昇せず、圧縮機電動機の過負荷を防止する。", "answer": "○", "law": "ガスチャージ方式は封入量を制限してあるため、設定上限温度（MOP点）を超えると過熱蒸気状態となり圧力上昇が緩慢になる。これにより始動時等の過大な蒸発圧力・吸込み過負荷を抑制する。よって記述は正しい。", "explanation": "ガスチャージ方式は封入量を制限してあるため、設定上限温度（MOP点）を超えると過熱蒸気状態となり圧力上昇が緩慢になる。これにより始動時等の過大な蒸発圧力・吸込み過負荷を抑制する。よって記述は正しい。"}, {"id": 2207, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "外部均圧形温度自動膨張弁の均圧管は、蒸発器の入口と膨張弁のダイヤフラム下面との間を接続し、蒸発器入口の圧力を直接ダイヤフラムに導入して動作させる。", "answer": "×", "law": "外部均圧管は蒸発器の「出口」配管に接続し、蒸発器を通過した後の出口圧力をダイヤフラム下面に導いて蒸発器内の圧力損失を補正する。「蒸発器入口と接続する」は誤り。", "explanation": "外部均圧管は蒸発器の「出口」配管に接続し、蒸発器を通過した後の出口圧力をダイヤフラム下面に導いて蒸発器内の圧力損失を補正する。「蒸発器入口と接続する」は誤り。"}, {"id": 2208, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "電子膨張弁は、パルスモータでニードル弁開度を直接駆動する機構をもち、過熱度制御だけでなく、急速冷房時の全開動作や停止時の全閉遮断（電磁弁レス化）など高度な制御に対応できる。", "answer": "○", "law": "電子膨張弁はマイコンからのパルス信号により数百〜数千ステップで精密に開度調節でき、温度センサ・圧力センサ値から最適制御を行うとともに電磁弁機能も兼備できる。よって記述は正しい。", "explanation": "電子膨張弁はマイコンからのパルス信号により数百〜数千ステップで精密に開度調節でき、温度センサ・圧力センサ値から最適制御を行うとともに電磁弁機能も兼備できる。よって記述は正しい。"}, {"id": 2209, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "蒸発圧力調整弁（EPR）は入口側（蒸発器側）の圧力を感知して動作する自力式調整弁であり、蒸発器圧力が設定値以下に低下しようとすると弁開度を絞って圧力を保持する。", "answer": "○", "law": "EPRは弁入口圧力（蒸発器圧力）を作動信号とし、蒸発器圧力が設定圧力より低くなると弁を閉じる方向へ動作して冷媒の蒸発圧力下限を維持する。よって記述は正しい。", "explanation": "EPRは弁入口圧力（蒸発器圧力）を作動信号とし、蒸発器圧力が設定圧力より低くなると弁を閉じる方向へ動作して冷媒の蒸発圧力下限を維持する。よって記述は正しい。"}, {"id": 2210, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "吸入圧力調整弁（SPR）は出口側（圧縮機吸込み側）の圧力を感知して動作する調整弁であり、圧縮機吸込み圧力が設定値を超えて上昇しようとすると弁開度を絞って過大圧力を遮断する。", "answer": "○", "law": "SPR（クランクケース圧力調整弁）は弁出口圧力（圧縮機側）を検知し、出口圧力が設定許容値を超えると弁を絞ることで、圧縮機吸込み圧力の上限を確実に制限する。よって記述は正しい。", "explanation": "SPR（クランクケース圧力調整弁）は弁出口圧力（圧縮機側）を検知し、出口圧力が設定許容値を超えると弁を絞ることで、圧縮機吸込み圧力の上限を確実に制限する。よって記述は正しい。"}, {"id": 2211, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "凝縮圧力調整弁は、冬期などの低外気温時に空冷凝縮器からの液流出を制限して凝縮器内に液冷媒を溜め込み、有効凝縮面積を縮小させることで凝縮圧力を安定保持する。", "answer": "○", "law": "外気温低下に伴う過冷過小圧力を防ぐため、凝縮器出口に設置した調整弁が弁を絞って液を滞留（フラッディング）させ、凝縮伝熱面を狭めて凝縮圧力を適正範囲に保持する。よって記述は正しい。", "explanation": "外気温低下に伴う過冷過小圧力を防ぐため、凝縮器出口に設置した調整弁が弁を絞って液を滞留（フラッディング）させ、凝縮伝熱面を狭めて凝縮圧力を適正範囲に保持する。よって記述は正しい。"}, {"id": 2212, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "水冷凝縮器に用いられる直動式冷却水調整弁は、蒸発器の冷媒圧力を感知してベローズが作動し、蒸発温度が上がると水量を増加させるように配管接続される。", "answer": "×", "law": "冷却水調整弁（制水弁）は「凝縮圧力（高圧側）」を感知して動作し、凝縮圧力が上昇した際に弁を開いて水量を増やす。「蒸発器の冷媒圧力を感知して」は誤り。", "explanation": "冷却水調整弁（制水弁）は「凝縮圧力（高圧側）」を感知して動作し、凝縮圧力が上昇した際に弁を開いて水量を増やす。「蒸発器の冷媒圧力を感知して」は誤り。"}, {"id": 2213, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "イ", "theme": "制御機器・保護装置", "question": "高圧遮断圧力スイッチ（HPS）の作動圧力設定値は、安全弁の作動圧力（吹始め圧力）よりも高く設定し、安全弁が作動しても圧力が下がらない場合の非常停止用として使用する。", "answer": "×", "law": "高圧遮断スイッチは安全弁作動による冷媒大気放出を未然に防ぐための保護装置であるため、作動設定圧力は必ず安全弁の吹始め圧力よりも「低く」設定しなければならない。誤り。", "explanation": "高圧遮断スイッチは安全弁作動による冷媒大気放出を未然に防ぐための保護装置であるため、作動設定圧力は必ず安全弁の吹始め圧力よりも「低く」設定しなければならない。誤り。"}, {"id": 2214, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器・保護装置", "question": "油圧保護圧力スイッチ（OPS）に内蔵されるタイムディレイ機構（遅延タイマ）は、圧縮機の始動時に油圧が規定圧力まで立ち上がるまでの時間、および運転中の瞬間的な油圧変動による誤動作を防止するために設けられている。", "answer": "○", "law": "起動直後の過渡的な低油圧状態や、旋回スクロール・ピストンの瞬間的負荷変動による一過性の油圧低下で不必要にトリップしないよう、約60〜90秒の時限回路が組み込まれている。よって記述は正しい。", "explanation": "起動直後の過渡的な低油圧状態や、旋回スクロール・ピストンの瞬間的負荷変動による一過性の油圧低下で不必要にトリップしないよう、約60〜90秒の時限回路が組み込まれている。よって記述は正しい。"}, {"id": 2215, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器・保護装置", "question": "電磁弁（ソレノイドバルブ）は、通電・非通電により弁の開閉を電気的に制御する弁であり、液管の開閉、ポンプダウン回路、ホットガスデフロスト回路などに広く用いられる。", "answer": "○", "law": "電磁弁は電磁コイルの吸引力によって弁体を遠隔開閉する自動弁であり、直動式やパイロット作動式があり、停止時の液封入遮断やデフロスト切換え等に不可欠である。よって記述は正しい。", "explanation": "電磁弁は電磁コイルの吸引力によって弁体を遠隔開閉する自動弁であり、直動式やパイロット作動式があり、停止時の液封入遮断やデフロスト切換え等に不可欠である。よって記述は正しい。"}, {"id": 2216, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器・保護装置", "question": "差圧式オイルプロテクションスイッチにおいて、クランクケース内圧力が0.3MPa、油ポンプ吐出し圧力が0.5MPaの場合、有効給油圧力は0.8MPaとして検出される。", "answer": "×", "law": "有効給油圧力（差圧）は「油ポンプ吐出圧力−クランクケース内圧力」で計算されるため、0.5 MPa - 0.3 MPa = 0.2 MPa である。「0.8MPaとして検出される」は加算しており誤り。", "explanation": "有効給油圧力（差圧）は「油ポンプ吐出圧力−クランクケース内圧力」で計算されるため、0.5 MPa - 0.3 MPa = 0.2 MPa である。「0.8MPaとして検出される」は加算しており誤り。"}, {"id": 2217, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "衝突式や遠心力式の油分離器は、吐出しガス配管の途中に設置され、ガスの流速急減、方向転換、遠心力等を利用してガス中に浮遊する微小な油滴を分離捕集する。", "answer": "○", "law": "油分離器内部では流路拡大による流速低下、邪魔板（バッフル）への衝突、旋回流による遠心力等により、ガス中に霧状に含まれる潤滑油を効率よく分離沈降させる。よって記述は正しい。", "explanation": "油分離器内部では流路拡大による流速低下、邪魔板（バッフル）への衝突、旋回流による遠心力等により、ガス中に霧状に含まれる潤滑油を効率よく分離沈降させる。よって記述は正しい。"}, {"id": 2218, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器に設けられる安全弁は、受液器の上部気相部（冷媒蒸気部）に接続し、異常高圧時に確実に冷媒ガスを外部へ放出して降圧できるように設置する。", "answer": "○", "law": "安全弁を液相部に設置すると作動時に高密度の冷媒液が噴出して降圧速度が遅く大量の液喪失となるため、必ず容器頂部の気相部に接続する。よって記述は正しい。", "explanation": "安全弁を液相部に設置すると作動時に高密度の冷媒液が噴出して降圧速度が遅く大量の液喪失となるため、必ず容器頂部の気相部に接続する。よって記述は正しい。"}, {"id": 2219, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "吸込み管に設置されるサクションラインフィルタは、圧縮機へのスラッジや金属粉などの異物混入を防ぐためのものであり、モータ焼損事故後の修復作業時には酸性物質を吸着除去するバーンアウト用コアが用いられる。", "answer": "○", "law": "電動機バーンアウト（焼損）後は強酸性のフッ化水素酸やスラッジが系統に充満するため、強力な酸吸着能とろ過性能をもつバーンアウト用吸入フィルタドライヤを設置して浄化する。よって記述は正しい。", "explanation": "電動機バーンアウト（焼損）後は強酸性のフッ化水素酸やスラッジが系統に充満するため、強力な酸吸着能とろ過性能をもつバーンアウト用吸入フィルタドライヤを設置して浄化する。よって記述は正しい。"}, {"id": 2220, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "受液器の液面計として丸形ガラス管液面計を用いる場合、高圧ガス保安法令上、いかなる保護カバーや自動閉止弁を取り付けても毒性・可燃性冷媒設備への使用は認められない。", "answer": "○", "law": "毒性ガス（アンモニア等）や可燃性ガスの受液器には、衝撃や熱に弱く破損破裂しやすい「丸形ガラス管液面計」の使用は一切禁止されており、反射式平形ガラス液面計等が義務付けられる。よって記述は正しい。", "explanation": "毒性ガス（アンモニア等）や可燃性ガスの受液器には、衝撃や熱に弱く破損破裂しやすい「丸形ガラス管液面計」の使用は一切禁止されており、反射式平形ガラス液面計等が義務付けられる。よって記述は正しい。"}, {"id": 2221, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "イ", "theme": "附属機器・冷凍サイクル", "question": "二段圧縮冷凍サイクルに用いられる中間冷却器（インタークーラ）は、低段圧縮機から吐き出された過熱ガスを中間圧力の飽和温度付近まで冷却し、高段圧縮機の吐出しガス温度の上昇を抑制する。", "answer": "○", "law": "中間冷却器により低段吐出ガスを高段吸込み前に減温冷却することで、高段圧縮機の吐出過熱を防止し、圧縮動力を低減してサイクル全体の成績係数（COP）を向上させる。よって記述は正しい。", "explanation": "中間冷却器により低段吐出ガスを高段吸込み前に減温冷却することで、高段圧縮機の吐出過熱を防止し、圧縮動力を低減してサイクル全体の成績係数（COP）を向上させる。よって記述は正しい。"}, {"id": 2222, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器・冷凍サイクル", "question": "中間冷却器には、中間圧力で液冷媒をフラッシュさせて気化冷却する直膨式（フラッシュタンク形）や、中間液中に過冷却コイルを浸漬させて高圧液冷媒を過冷却するコイル内蔵形がある。", "answer": "○", "law": "中間冷却器の構造方式には、冷媒液を直接混合気化させる開面直膨形と、蒸発器へ向かう高圧液を管内過冷却させる閉鎖コイル併用形があり、用途や冷媒種に応じて選定される。よって記述は正しい。", "explanation": "中間冷却器の構造方式には、冷媒液を直接混合気化させる開面直膨形と、蒸発器へ向かう高圧液を管内過冷却させる閉鎖コイル併用形があり、用途や冷媒種に応じて選定される。よって記述は正しい。"}, {"id": 2223, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器・冷凍サイクル", "question": "二元冷凍サイクルは、超低温を得るために沸点の異なる2種類の冷媒を用い、高温側サイクルの蒸発器と低温側サイクルの凝縮器をカスケードコンデンサ（凝縮蒸発器）で熱結合させた方式である。", "answer": "○", "law": "-60℃〜-100℃等の超低温域では単一冷媒での圧力比が過大となり凝固や超高圧化を起こすため、高温側（R404A等）と低温側（R23等）の2独立回路を熱交換器で結ぶ二元サイクルが採用される。よって記述は正しい。", "explanation": "-60℃〜-100℃等の超低温域では単一冷媒での圧力比が過大となり凝固や超高圧化を起こすため、高温側（R404A等）と低温側（R23等）の2独立回路を熱交換器で結ぶ二元サイクルが採用される。よって記述は正しい。"}, {"id": 2224, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器・冷凍サイクル", "question": "不凝縮ガスパージャの運転において、排気弁から放出される気体に強いアンモニア臭が全く混入していない場合は、不凝縮ガス分離器が正常かつ極めて高効率に作動している証拠である。", "answer": "×", "law": "冷却分離下でも分圧平衡により排気ガス中には微量のアンモニア蒸気が必ず同伴される。全くアンモニア臭がしない場合は冷媒系統とパージャが遮断されている等の作動不良が疑われる。誤り。", "explanation": "冷却分離下でも分圧平衡により排気ガス中には微量のアンモニア蒸気が必ず同伴される。全くアンモニア臭がしない場合は冷媒系統とパージャが遮断されている等の作動不良が疑われる。誤り。"}, {"id": 2225, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管の施工と保守", "question": "冷媒配管の支持間隔は、配管自体の重量、管内冷媒・油の重量、および断熱材の重量を考慮して決定し、運転時の熱伸縮や圧縮機からの機械的振動によって過大な応力集中が生じないように施工する。", "answer": "○", "law": "配管サポートは自重によるたわみ防止だけでなく、サーマルエキスパンション（温度伸縮）を逃がすUループや防振フレキシブルチューブを配置し、配管接合部の疲労破壊を防ぐ。よって記述は正しい。", "explanation": "配管サポートは自重によるたわみ防止だけでなく、サーマルエキスパンション（温度伸縮）を逃がすUループや防振フレキシブルチューブを配置し、配管接合部の疲労破壊を防ぐ。よって記述は正しい。"}, {"id": 2226, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管の施工と保守", "question": "銅管のろう付け作業時には、管内に窒素ガスを微量に通気（窒素ブロー）させながら加熱することにより、管内面の高温酸化による酸化スケール（黒皮）の発生を防止する。", "answer": "○", "law": "無酸素雰囲気を作る窒素置換ブロー（0.02MPa程度の微圧通気）を行わないと管内面に酸化銅スケールが生成し、運転後に剥離して膨張弁や電磁弁の詰まり、機器故障を引き起こす。よって記述は正しい。", "explanation": "無酸素雰囲気を作る窒素置換ブロー（0.02MPa程度の微圧通気）を行わないと管内面に酸化銅スケールが生成し、運転後に剥離して膨張弁や電磁弁の詰まり、機器故障を引き起こす。よって記述は正しい。"}, {"id": 2227, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管の施工と保守", "question": "吸込み管の水平配管部は、配管内の油が自然に蒸発器側へ流れて戻るように、圧縮機から蒸発器に向かって下がり勾配で施工しなければならない。", "answer": "×", "law": "吸込み配管内の油は圧縮機方向へスムーズに流下回収させる必要があるため、蒸発器から圧縮機に向かって「下がり勾配（1/100〜1/200程度）」で配管する。記述は逆であり誤り。", "explanation": "吸込み配管内の油は圧縮機方向へスムーズに流下回収させる必要があるため、蒸発器から圧縮機に向かって「下がり勾配（1/100〜1/200程度）」で配管する。記述は逆であり誤り。"}, {"id": 2228, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管の施工と保守", "question": "低温配管の防熱（保冷）施工において、防熱材の継手部の隙間や防湿層の破損があると、空気中の水蒸気が侵入して結露・氷結し、防熱性能が著しく低下するとともに配管外面の腐食を促進する。", "answer": "○", "law": "低温配管は水蒸気圧差により外気側から常に水分が浸入しようとするため、アスファルトフェルトや防湿テープ等による完全な防湿シールを施さないと内部で氷結膨張し断熱材が破壊される。よって記述は正しい。", "explanation": "低温配管は水蒸気圧差により外気側から常に水分が浸入しようとするため、アスファルトフェルトや防湿テープ等による完全な防湿シールを施さないと内部で氷結膨張し断熱材が破壊される。よって記述は正しい。"}, {"id": 2229, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "安全弁の吹出し圧力の調整は、設備の水圧試験または気密試験と同時に行い、試験圧力が安全弁の設定圧力に達した時点で弁が吹き出すことを確認して完了とする。", "answer": "×", "law": "安全弁の作動試験・吹出し圧力調整は、設備本体から取り外して専用の安全弁試験器（窒素ガスボンベ等）を用いて単体で行う。耐圧・気密試験中に作動させてはならない。誤り。", "explanation": "安全弁の作動試験・吹出し圧力調整は、設備本体から取り外して専用の安全弁試験器（窒素ガスボンベ等）を用いて単体で行う。耐圧・気密試験中に作動させてはならない。誤り。"}, {"id": 2230, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "安全弁の前後に止め弁（元弁）を設けることは原則として禁止されているが、点検整備用の三方切換弁（インターロック切換弁）を用いて常にいずれか一方の安全弁が系統に通じている構造であれば設置が認められる。", "answer": "○", "law": "常時一方を全開にした複式安全弁（二連安全弁切換弁）構造であれば、設備の運転を停止することなく安全弁の定期点検や校正取替えが可能となるため法規上認められている。よって記述は正しい。", "explanation": "常時一方を全開にした複式安全弁（二連安全弁切換弁）構造であれば、設備の運転を停止することなく安全弁の定期点検や校正取替えが可能となるため法規上認められている。よって記述は正しい。"}, {"id": 2231, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "可溶栓（溶栓）は、火災等による外部加熱時に容器内の温度上昇に伴って特殊低融点合金（ビスマス系等）が溶融し、内部の冷媒ガスを放出して圧力容器の破裂を防止する安全装置である。", "answer": "○", "law": "溶栓は所定の温度（通常65〜75℃程度）で可融合金が溶けて全開口し圧力を逃がす温度作動型安全装置であり、小形の凝縮器やフロン受液器等に用いられる。よって記述は正しい。", "explanation": "溶栓は所定の温度（通常65〜75℃程度）で可融合金が溶けて全開口し圧力を逃がす温度作動型安全装置であり、小形の凝縮器やフロン受液器等に用いられる。よって記述は正しい。"}, {"id": 2232, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "安全弁の放出管の口径は、安全弁の吹出し口径よりも細い配管を使用することにより、吹出し時の排気流速を高めて遠方へ拡散させることが保安上義務付けられている。", "answer": "×", "law": "放出管の口径を安全弁出口径より細くすると背圧（抵抗）が増大して所定の吹出し能力を発揮できなくなるため、放出管径は安全弁吹出し口径「以上」としなければならない。誤り。", "explanation": "放出管の口径を安全弁出口径より細くすると背圧（抵抗）が増大して所定の吹出し能力を発揮できなくなるため、放出管径は安全弁吹出し口径「以上」としなければならない。誤り。"}, {"id": 2233, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験・材料試験", "question": "気体を用いて耐圧試験を行う場合は、液体の耐圧試験に比べて破壊時に気体の膨張エネルギーが極めて大きく危険であるため、試験圧力を段階的に昇圧し、安全な距離を保って遠隔監視する等の厳格な防護措置を講じる。", "answer": "○", "law": "圧縮気体の膨張エネルギーによる破裂破壊は爆風・破片飛散を伴い極めて危険なため、漏れ試験圧から規定試験圧まで徐々に加圧し、防護壁や遠隔計測等の安全対策が厳重に義務付けられる。よって記述は正しい。", "explanation": "圧縮気体の膨張エネルギーによる破裂破壊は爆風・破片飛散を伴い極めて危険なため、漏れ試験圧から規定試験圧まで徐々に加圧し、防護壁や遠隔計測等の安全対策が厳重に義務付けられる。よって記述は正しい。"}, {"id": 2234, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験・材料試験", "question": "配管接合部の気密試験において、発泡液（石けん水等）を塗布して漏れ検査を行う場合、塗布直後だけでなく数分間放置して微小な泡の成長や泡の発生がないか慎重に目視確認する。", "answer": "○", "law": "微小漏洩（微小リーク）は泡の発生・成長が非常に遅いため、塗布後すぐに拭き取らず十分な観察時間を確保して発泡の有無を点検する。よって記述は正しい。", "explanation": "微小漏洩（微小リーク）は泡の発生・成長が非常に遅いため、塗布後すぐに拭き取らず十分な観察時間を確保して発泡の有無を点検する。よって記述は正しい。"}, {"id": 2235, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験・材料試験", "question": "冷媒配管の真空引き作業において、冷凍装置内の圧力が水蒸気の飽和圧力（常温で2〜3kPa）以下まで十分に排気されない段階で真空ポンプを停止すると、管内の水分が残留したままとなる。", "answer": "○", "law": "水分を蒸発・気化させて真空ポンプで排出するためには、周囲温度における水蒸気の飽和蒸気圧以下（望ましくは0.13kPa以下）まで減圧して真空乾燥を徹底する必要がある。よって記述は正しい。", "explanation": "水分を蒸発・気化させて真空ポンプで排出するためには、周囲温度における水蒸気の飽和蒸気圧以下（望ましくは0.13kPa以下）まで減圧して真空乾燥を徹底する必要がある。よって記述は正しい。"}, {"id": 2236, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験・材料試験", "question": "放射線透過試験（RT）や超音波探傷試験（UT）は、配管や圧力容器の溶接継手部を破壊することなく内部のブローホール、スラグ巻き込み、溶込み不良、割れ等の内部欠陥を検出する非破壊試験である。", "answer": "○", "law": "RT（X線・ガンマ線透過）やUT（超音波反射）は製品を損傷させずに溶接部内部の溶込み深さや内部欠陥の有無・形状を精密に評価できる代表的な非破壊検査法である。よって記述は正しい。", "explanation": "RT（X線・ガンマ線透過）やUT（超音波反射）は製品を損傷させずに溶接部内部の溶込み深さや内部欠陥の有無・形状を精密に評価できる代表的な非破壊検査法である。よって記述は正しい。"}, {"id": 2237, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "イ", "theme": "据付け・試運転・冷媒性状", "question": "防振ゴムを用いて圧縮機を防振支持する場合、防振ゴムの固有振動数が圧縮機の運転回転数による起振周波数に近接すると共振現象を起こして振動が増幅されるため、固有振動数が起振周波数の1/√2以下となるように設計する。", "answer": "○", "law": "防振支持系において振動伝達率を1未満にして有効な防振効果を得るには、強制加振周波数と支持系の固有振動数の比（振動数比）を√2（約1.414）倍以上離す必要がある。よって記述は正しい。", "explanation": "防振支持系において振動伝達率を1未満にして有効な防振効果を得るには、強制加振周波数と支持系の固有振動数の比（振動数比）を√2（約1.414）倍以上離す必要がある。よって記述は正しい。"}, {"id": 2238, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ロ", "theme": "据付け・試運転・冷媒性状", "question": "HFC系冷媒とともに用いられるポリオールエステル油（POE）は吸湿性が極めて高く、大気中に放置すると水分を吸収し、加水分解によりカルボン酸を生じて絶縁低下や腐食を起こすため、開缶後は速やかに使用する。", "answer": "○", "law": "POE油のエステル結合は水分により加水分解して有機酸を生成し、スラッジ発生、キャピラリ閉塞、モータ絶縁劣化を招くため、油缶の密閉保管と作業時の大気接触最小化が鉄則である。よって記述は正しい。", "explanation": "POE油のエステル結合は水分により加水分解して有機酸を生成し、スラッジ発生、キャピラリ閉塞、モータ絶縁劣化を招くため、油缶の密閉保管と作業時の大気接触最小化が鉄則である。よって記述は正しい。"}, {"id": 2239, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ハ", "theme": "据付け・試運転・冷媒性状", "question": "冷媒充てん作業時に、非共沸混合冷媒（R410AやR407Cなど）をボンベから気体（ガス状）のまま充てんすると、各成分冷媒の蒸気圧の違いにより組成変化（組成シフト）を起こして設計通りの性能が得られなくなるため、必ず液状で充てんする。", "answer": "○", "law": "非共沸または疑似共沸混合冷媒をガス状で抜き出すと沸点の低い低沸点成分が優先的に気化してボンベ内および装置内の冷媒組成比率が崩れるため、容器を倒すかサイフォン管を用いて液相から取り出す。よって記述は正しい。", "explanation": "非共沸または疑似共沸混合冷媒をガス状で抜き出すと沸点の低い低沸点成分が優先的に気化してボンベ内および装置内の冷媒組成比率が崩れるため、容器を倒すかサイフォン管を用いて液相から取り出す。よって記述は正しい。"}, {"id": 2240, "subject": "保安管理", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ニ", "theme": "据付け・試運転・冷媒性状", "question": "アンモニア冷媒は、オゾン層破壊係数（ODP）がゼロで地球温暖化係数（GWP）もほぼゼロの優れた自然冷媒であるが、銅や黄銅、青銅などの銅合金を激しく腐食するため、配管材料には炭素鋼鋼管やステンレス鋼鋼管を使用する。", "answer": "○", "law": "アンモニアは環境負荷のない優れた熱力学特性をもつ反面、水分存在下で銅や亜鉛と錯体を形成して激しく浸食するため、銅系金属の使用は厳禁であり鉄鋼材料が用いられる。よって記述は正しい。", "explanation": "アンモニアは環境負荷のない優れた熱力学特性をもつ反面、水分存在下で銅や亜鉛と錯体を形成して激しく浸食するため、銅系金属の使用は厳禁であり鉄鋼材料が用いられる。よって記述は正しい。"}, {"id": 2241, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "往復圧縮機において、ピストン頂部とシリンダヘッドとの間などに存在する隙間容積（すきま容積）は、吸込み行程の初期に残留高圧ガスが再膨張するため、ピストン押しのけ量あたりの吸込みガス量を減少させ、体積効率を低下させる要因となる。", "answer": "○", "law": "隙間容積内に残った高圧冷媒ガスはピストンの後退に伴って吸込み圧力まで再膨張し、その間は吸込み弁が開かないため有効吸込み行程が減少し体積効率が低下する。よって記述は正しい。", "explanation": "隙間容積内に残った高圧冷媒ガスはピストンの後退に伴って吸込み圧力まで再膨張し、その間は吸込み弁が開かないため有効吸込み行程が減少し体積効率が低下する。よって記述は正しい。"}, {"id": 2242, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "ツインスクリュー圧縮機は、雄ロータと雌ロータの歯溝とケーシング壁面で囲まれた密閉空間が軸方向に移動しながら容積を縮小する構造であり、内部容積比が固定されているため、運転条件に応じた適正な内部容積比をもつ圧縮機を選定することが重要である。", "answer": "○", "law": "スクリュー圧縮機は吐出しポートの配置によって設計内部容積比（Vi）が固定されるため、装置の運転圧力比とViが合致していないと過圧縮または過小圧縮の動力損失が生じる。よって記述は正しい。", "explanation": "スクリュー圧縮機は吐出しポートの配置によって設計内部容積比（Vi）が固定されるため、装置の運転圧力比とViが合致していないと過圧縮または過小圧縮の動力損失が生じる。よって記述は正しい。"}, {"id": 2243, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は、同一形状の固定スクロールと旋回スクロールを180度向きを合わせて組み合わせ、旋回運動によって外周から吸入した冷媒を中心部に向けて圧縮・吐出する機構であり、吸込み弁および吐出し弁の双方が不要である。", "answer": "×", "law": "スクロール圧縮機は外周吸込みのため吸込み弁は不要であるが、吐出し側には停止時の逆流防止や過圧縮防止のために吐出し弁（リード弁等）や逆止め機構が一般に設けられる。「吐出し弁の双方が不要」は誤り。", "explanation": "スクロール圧縮機は外周吸込みのため吸込み弁は不要であるが、吐出し側には停止時の逆流防止や過圧縮防止のために吐出し弁（リード弁等）や逆止め機構が一般に設けられる。「吐出し弁の双方が不要」は誤り。"}, {"id": 2244, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、吸込み蒸気量が減少して限界流量以下になると、ディフューザ内での流れの剥離や渦の発生により圧力上昇が不安定となり、周期的なガス脈動と激しい振動を伴うサージング現象が発生する。", "answer": "○", "law": "遠心圧縮機の部分負荷運転時、吸込み風量が過小になるとディフューザ流路で剥離が生じ、吐出圧力が凝縮圧力を下回って逆流と順流を繰り返すサージングを起こす。よって記述は正しい。", "explanation": "遠心圧縮機の部分負荷運転時、吸込み風量が過小になるとディフューザ流路で剥離が生じ、吐出圧力が凝縮圧力を下回って逆流と順流を繰り返すサージングを起こす。よって記述は正しい。"}, {"id": 2245, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "多気筒往復圧縮機の油圧作動式アンローダ機構は、吸込み圧力を検知する制御弁により油圧ピストンへ送る油圧を制御し、アンローダピンを介して吸込み弁板を押し上げて開放することで容量制御を行う。", "answer": "○", "law": "油圧式アンローダは、吸込み圧力の変化に応じて油圧をアンローダシリンダに断続供給し、ばね力に抗してアンローダピンを上下させて吸込み弁を開放・着座させる。よって記述は正しい。", "explanation": "油圧式アンローダは、吸込み圧力の変化に応じて油圧をアンローダシリンダに断続供給し、ばね力に抗してアンローダピンを上下させて吸込み弁を開放・着座させる。よって記述は正しい。"}, {"id": 2246, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "インバータによる圧縮機の回転速度制御において、運転周波数を定格周波数より高くして増速運転する場合、圧縮機の軸動力が増加するため、電動機の過負荷や潤滑油の過度な持ち出し（油上がり）に留意する必要がある。", "answer": "○", "law": "周波数上昇による高速運転時は圧縮機吐出し量と所要動力が増大するため電動機の過電流保護が重要となり、また冷媒流速増大によるクランクケース油の飛沫同伴増加に注意を要する。よって記述は正しい。", "explanation": "周波数上昇による高速運転時は圧縮機吐出し量と所要動力が増大するため電動機の過電流保護が重要となり、また冷媒流速増大によるクランクケース油の飛沫同伴増加に注意を要する。よって記述は正しい。"}, {"id": 2247, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "遠心圧縮機の容量制御に用いられる入口案内翼（インレットガイドベーン：IGV）は、羽根車入口の冷媒蒸気に旋回流（予旋回）を与えることで、羽根車での圧力上昇比と冷媒流量を広範囲に変化させる。", "answer": "○", "law": "インペラ直前に設置された案内翼の角度を変えて予旋回流（回転同方向または逆方向）を与えることで、オイラーの頭首変化により効率よく流量と揚程を制御できる。よって記述は正しい。", "explanation": "インペラ直前に設置された案内翼の角度を変えて予旋回流（回転同方向または逆方向）を与えることで、オイラーの頭首変化により効率よく流量と揚程を制御できる。よって記述は正しい。"}, {"id": 2248, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパス方式による容量制御は、圧縮機吐出しガスを凝縮器出口の受液器に直接導入することにより、凝縮圧力を急速に低下させて圧縮機の動力を大幅に低減させる省エネ手法である。", "answer": "×", "law": "ホットガスバイパスは高圧吐出しガスを蒸発器入口または圧縮機吸込み側へバイパスさせて低圧側圧力を保持する手法であり、受液器へ導入するものではなく省エネ効果も乏しい。誤り。", "explanation": "ホットガスバイパスは高圧吐出しガスを蒸発器入口または圧縮機吸込み側へバイパスさせて低圧側圧力を保持する手法であり、受液器へ導入するものではなく省エネ効果も乏しい。誤り。"}, {"id": 2249, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吐出し弁板が破損してシート部からガス漏れを生じると、シリンダ内で一度圧縮された高温高圧ガスが吸込み行程で再流入して繰り返し圧縮されるため、吐出しガス温度が異常に上昇する。", "answer": "○", "law": "吐出し弁からのリークは高温ガスのシリンダ内逆流を招き、吸入ガスと混合して吸気温度を跳ね上げるため、吐出しガス温度の著しい過熱と体積効率低下を引き起こす。よって記述は正しい。", "explanation": "吐出し弁からのリークは高温ガスのシリンダ内逆流を招き、吸入ガスと混合して吸気温度を跳ね上げるため、吐出しガス温度の著しい過熱と体積効率低下を引き起こす。よって記述は正しい。"}, {"id": 2250, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の過熱運転の原因としては、冷媒充てん量の不足、膨張弁の絞りすぎによる吸込み過熱度の過大、吸込みストレーナの詰まりによる吸込み圧力の過小、凝縮圧力の異常上昇などが挙げられる。", "answer": "○", "law": "冷媒循環量不足や過大過熱度、高圧力比運転はすべて圧縮熱の逃げ場を減らし吐出しガス温度を限界値（通常120〜130℃）以上に押し上げる要因となる。よって記述は正しい。", "explanation": "冷媒循環量不足や過大過熱度、高圧力比運転はすべて圧縮熱の逃げ場を減らし吐出しガス温度を限界値（通常120〜130℃）以上に押し上げる要因となる。よって記述は正しい。"}, {"id": 2251, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機のクランクケース内の冷凍機油が激しく泡立つオイルフォーミングは、油中に多量に溶解していた冷媒が急激な圧力降下によって突沸するために発生し、油圧低下や液圧縮の原因となる。", "answer": "○", "law": "停止中に寝込んだ冷媒液は起動時のクランクケース圧低下で一気に気化発泡し、油ポンプのキャビテーションによる油圧喪失やシリンダへの油・液吸い込みによる弁破損を招く。よって記述は正しい。", "explanation": "停止中に寝込んだ冷媒液は起動時のクランクケース圧低下で一気に気化発泡し、油ポンプのキャビテーションによる油圧喪失やシリンダへの油・液吸い込みによる弁破損を招く。よって記述は正しい。"}, {"id": 2252, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の強制潤滑系統において、油フィルタ（オイルストレーナ）にスラッジや摩耗粉が堆積して差圧が増大しても、油ポンプの吐出し圧力計の指示値が正常であれば、軸受部への実質給油圧力は変化しない。", "answer": "×", "law": "フィルタが詰まるとその前後で圧力損失が生じるため、ポンプ吐出圧が正常に見えてもフィルタ下流の軸受摺動部へ供給される実効油圧は著しく低下し焼付きを起こす。誤り。", "explanation": "フィルタが詰まるとその前後で圧力損失が生じるため、ポンプ吐出圧が正常に見えてもフィルタ下流の軸受摺動部へ供給される実効油圧は著しく低下し焼付きを起こす。誤り。"}, {"id": 2253, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "シェルアンドチューブ水冷凝縮器において、冷却水入口温度と凝縮負荷が一定の場合、冷却水量を減少させると冷却水出入口温度差は拡大し、凝縮温度および凝縮圧力は上昇する。", "answer": "○", "law": "水量が減ると水が持ち去る単位質量あたりの受熱量が増えて出口水温が上昇し、算術平均水温が上がるため、それに伴い凝縮温度および凝縮圧力が上昇する。よって記述は正しい。", "explanation": "水量が減ると水が持ち去る単位質量あたりの受熱量が増えて出口水温が上昇し、算術平均水温が上がるため、それに伴い凝縮温度および凝縮圧力が上昇する。よって記述は正しい。"}, {"id": 2254, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "開放式冷却塔を用いる冷却水系統では、水分の蒸発濃縮により溶存硬度成分が濃縮されるため、定期的な自動ブローダウンや薬品注入を行って冷却管への水あか付着を防止する。", "answer": "○", "law": "冷却塔では純粋なH2Oのみが蒸発するためカルシウムやシリカ等のスケール成分が濃縮され、濃縮倍数管理（ブロー）やスケール防止剤の添加が不可欠である。よって記述は正しい。", "explanation": "冷却塔では純粋なH2Oのみが蒸発するためカルシウムやシリカ等のスケール成分が濃縮され、濃縮倍数管理（ブロー）やスケール防止剤の添加が不可欠である。よって記述は正しい。"}, {"id": 2255, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器において、夏季の直射日光による吸込み空気温度の上昇や、凝縮器周囲の風通し不良による排気のショートサーキットが発生すると、凝縮能力が低下して凝縮圧力が異常上昇する。", "answer": "○", "law": "吸込み空気温度の上昇や熱排気の再吸込み（ショートサーキット）は空気側温度差を狭めて伝熱量を減少させ、凝縮圧力・温度の過度な上昇と圧縮機過負荷を招く。よって記述は正しい。", "explanation": "吸込み空気温度の上昇や熱排気の再吸込み（ショートサーキット）は空気側温度差を狭めて伝熱量を減少させ、凝縮圧力・温度の過度な上昇と圧縮機過負荷を招く。よって記述は正しい。"}, {"id": 2256, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "凝縮器内の冷媒側に混入した空気などの不凝縮ガスは、凝縮器の最も温度が高く冷媒蒸気が流入する入口配管付近に集中して滞留するため、この位置から抽気するのが最も効果的である。", "answer": "×", "law": "不凝縮ガスは冷媒蒸気の流れに乗って凝縮器の末端や液面付近、受液器の上部など「流速が遅く温度の最も低い気相部分」に押し流されて滞留する。入口付近ではないため誤り。", "explanation": "不凝縮ガスは冷媒蒸気の流れに乗って凝縮器の末端や液面付近、受液器の上部など「流速が遅く温度の最も低い気相部分」に押し流されて滞留する。入口付近ではないため誤り。"}, {"id": 2257, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "乾式直膨式蒸発器において、冷媒分配器（ディストリビュータ）のノズルや細管が一部閉塞すると、各冷却コイル回路への冷媒供給が不均等になり、蒸発器の冷却能力低下や圧縮機への液戻り（偏流による湿り）の原因となる。", "answer": "○", "law": "分配管の不均一が生じると、一部の流路では冷媒不足で過熱し、別の流路では過剰供給となって未蒸発液が吸込み管へ流出して液バックを引き起こす。よって記述は正しい。", "explanation": "分配管の不均一が生じると、一部の流路では冷媒不足で過熱し、別の流路では過剰供給となって未蒸発液が吸込み管へ流出して液バックを引き起こす。よって記述は正しい。"}, {"id": 2258, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "冷却管内を水が流れるシェルアンドチューブ水冷却器において、水循環ポンプが停止しても圧縮機がインターロックされずに運転を継続した場合、管内の水が急速に氷結して伝熱管が破裂破損する危険がある。", "answer": "○", "law": "水流が停止すると熱供給が途絶えて蒸発器内水温が氷点下に急降下し、管内凍結膨張により銅管破裂と冷媒・水相互混入の壊滅的事故に至る。水流インターロックが必須である。よって記述は正しい。", "explanation": "水流が停止すると熱供給が途絶えて蒸発器内水温が氷点下に急降下し、管内凍結膨張により銅管破裂と冷媒・水相互混入の壊滅的事故に至る。水流インターロックが必須である。よって記述は正しい。"}, {"id": 2259, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "冷蔵庫用ユニットクーラ（空気冷却器）において、着霜によりフィンの目詰まりが生じると、送風機モータの軸動力（消費電力）は空気抵抗の増大に伴って無限大に増加して直ちに焼損する。", "answer": "×", "law": "シロッコファンやプロペラファンでは、風路が閉塞して風量が減少すると一般に空気動力（風量×圧力）が低下するためモータ負荷はむしろ減少または頭打ちとなる。「無限大に増加し焼損する」は誤り。", "explanation": "シロッコファンやプロペラファンでは、風路が閉塞して風量が減少すると一般に空気動力（風量×圧力）が低下するためモータ負荷はむしろ減少または頭打ちとなる。「無限大に増加し焼損する」は誤り。"}, {"id": 2260, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "ホットガスデフロスト回路において、除霜時に高温高圧の吐出しガスを蒸発器に導入する際、蒸発器内に滞留していた多量の冷媒液が凝縮ガスとともに吸込み側へ急激に押し出されるのを防ぐため、再蒸発器やアキュムレータを設置する。", "answer": "○", "law": "ホットガス除霜時は冷媒が管内で凝縮して多量の液塊となり、デフロスト終了・復帰時に圧縮機へ一気に液バックして液圧縮を起こしやすいため、液分離・再蒸発装置が必要となる。よって記述は正しい。", "explanation": "ホットガス除霜時は冷媒が管内で凝縮して多量の液塊となり、デフロスト終了・復帰時に圧縮機へ一気に液バックして液圧縮を起こしやすいため、液分離・再蒸発装置が必要となる。よって記述は正しい。"}, {"id": 2261, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器の伝熱特性", "question": "伝熱面を挟んで高温流体と低温流体が熱交換するとき、管壁の汚れ係数が大きくなると、汚れ層の熱伝導抵抗によって総括熱伝達率（熱通過率）は低下し、伝熱量が減少する。", "answer": "○", "law": "汚れ係数（ファウリングファクター）は伝熱面に生じるスケールやスラッジの熱伝導抵抗を表し、汚れの増大は熱通過率Kを直接押し下げて熱交換効率を著しく悪化させる。よって記述は正しい。", "explanation": "汚れ係数（ファウリングファクター）は伝熱面に生じるスケールやスラッジの熱伝導抵抗を表し、汚れの増大は熱通過率Kを直接押し下げて熱交換効率を著しく悪化させる。よって記述は正しい。"}, {"id": 2262, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器の伝熱特性", "question": "プレート式熱交換器は、波形プレス加工された伝熱プレートをガスケットを介して積層した構造であり、流路が狭く高い乱流が促進されるため、シェルアンドチューブ式に比べて熱通過率が非常に大きく、保有冷媒量も少ない。", "answer": "○", "law": "プレートの波形パターンにより低レイノルズ数でも乱流が形成され熱伝達率が極めて高く、薄層流路のため機器内容積（冷媒保持量）を大幅に削減できる利点をもつ。よって記述は正しい。", "explanation": "プレートの波形パターンにより低レイノルズ数でも乱流が形成され熱伝達率が極めて高く、薄層流路のため機器内容積（冷媒保持量）を大幅に削減できる利点をもつ。よって記述は正しい。"}, {"id": 2263, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器の伝熱特性", "question": "伝熱管の熱通過率を向上させるため、熱伝達抵抗の最も小さい側にコルゲート加工やフィン加工などの伝熱促進加工を施すことが、熱交換器の伝熱改善において最も有効である。", "answer": "×", "law": "熱通過抵抗（1/K）は直列抵抗の和であるため、全体の伝熱を改善するには抵抗の最も「大きい（熱伝達率が低い）」側にフィン等を設けるのが鉄則である。「最も小さい側に施す」は誤り。", "explanation": "熱通過抵抗（1/K）は直列抵抗の和であるため、全体の伝熱を改善するには抵抗の最も「大きい（熱伝達率が低い）」側にフィン等を設けるのが鉄則である。「最も小さい側に施す」は誤り。"}, {"id": 2264, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器の伝熱特性", "question": "水冷凝縮器において、冷却管内を流れる冷却水の流速を適正範囲内で速くすると、境界層が薄くなって水側熱伝達率が向上し凝縮温度を低下させることができるが、管内摩擦損失の増大により冷却水ポンプの所要動力は増加する。", "answer": "○", "law": "水速増加は熱伝達率を約0.8乗で向上させる反面、圧力損失は流速の約2乗で増加するため、伝熱性能向上とポンプ動力費用の経済的バランス（通常1.5〜2.5m/s）で設計される。よって記述は正しい。", "explanation": "水速増加は熱伝達率を約0.8乗で向上させる反面、圧力損失は流速の約2乗で増加するため、伝熱性能向上とポンプ動力費用の経済的バランス（通常1.5〜2.5m/s）で設計される。よって記述は正しい。"}, {"id": 2265, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "外部均圧形温度自動膨張弁は、ダイヤフラムの上面に感温筒の圧力が開き力として作用し、下面に蒸発器出口圧力と調整ばねの復帰力が閉じ力として作用する。", "answer": "○", "law": "ダイヤフラム上面にかかる感温筒チャージ圧力（開弁方向）と、下面にかかる蒸発器出口均圧圧力＋アジャストスプリング力（閉弁方向）の平衡により、適正過熱度が維持される。よって記述は正しい。", "explanation": "ダイヤフラム上面にかかる感温筒チャージ圧力（開弁方向）と、下面にかかる蒸発器出口均圧圧力＋アジャストスプリング力（閉弁方向）の平衡により、適正過熱度が維持される。よって記述は正しい。"}, {"id": 2266, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "温度自動膨張弁のハンチング現象とは、弁開度の過大と過小を周期的に繰り返して冷媒流量が激しく変動する現象であり、感温筒の熱容量過小、弁口径の過大選定、感温筒の接触不良などが原因で生じる。", "answer": "○", "law": "負荷に対して膨張弁容量が大きすぎたり感温筒の追従遅れがあると、過熱度の検出と弁作動が発散して弁が全開・全閉を繰り返し、吸込み圧力脈動や液戻りを招く。よって記述は正しい。", "explanation": "負荷に対して膨張弁容量が大きすぎたり感温筒の追従遅れがあると、過熱度の検出と弁作動が発散して弁が全開・全閉を繰り返し、吸込み圧力脈動や液戻りを招く。よって記述は正しい。"}, {"id": 2267, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "キャピラリーチューブを用いた冷凍装置では、冷媒充てん量の許容範囲が温度自動膨張弁を用いた装置に比べて非常に広いため、冷媒の多少の過充てんや不足は運転状態にほとんど影響を与えない。", "answer": "×", "law": "キャピラリ装置は受液器をもたず絞り抵抗が固定されているため、冷媒量の過不足が凝縮圧力・過冷却度・蒸発圧力に直結し、充てん量の許容誤差は極めて狭くシビアである。誤り。", "explanation": "キャピラリ装置は受液器をもたず絞り抵抗が固定されているため、冷媒量の過不足が凝縮圧力・過冷却度・蒸発圧力に直結し、充てん量の許容誤差は極めて狭くシビアである。誤り。"}, {"id": 2268, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "クロスチャージ方式の感温筒は、冷凍装置の主冷媒とは異なる物性をもつ混合気体や媒体が封入されており、低温域から高温域までの広い蒸発温度範囲において過熱度の変化を小さく抑えることができる。", "answer": "○", "law": "クロスチャージは主冷媒の飽和蒸気圧曲線と交差する異なる圧力勾配をもたせることで、広範囲の蒸発温度域にわたって安定した設定過熱度特性を保つよう設計されている。よって記述は正しい。", "explanation": "クロスチャージは主冷媒の飽和蒸気圧曲線と交差する異なる圧力勾配をもたせることで、広範囲の蒸発温度域にわたって安定した設定過熱度特性を保つよう設計されている。よって記述は正しい。"}, {"id": 2269, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "蒸発圧力調整弁（EPR）は、蒸発器内の冷媒蒸発圧力が設定圧力よりも低下しようとすると弁が閉じる方向に動作し、蒸発器の氷結や被冷却物の過冷却を防止する。", "answer": "○", "law": "EPRは入口圧力応動弁であり、蒸発器内圧力が設定値まで下がると弁開度を絞って下流への流れを制限し、蒸発器側の圧力を設定下限値以上に保持する。よって記述は正しい。", "explanation": "EPRは入口圧力応動弁であり、蒸発器内圧力が設定値まで下がると弁開度を絞って下流への流れを制限し、蒸発器側の圧力を設定下限値以上に保持する。よって記述は正しい。"}, {"id": 2270, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "吸入圧力調整弁（SPR）は、蒸発器熱負荷の急増時やホットガスデフロスト復帰時において、圧縮機吸込み圧力が設定上限値を超えて上昇するのを抑え、電動機の過負荷トリップを防止する。", "answer": "○", "law": "クランクケース圧力調整弁（SPR）は出口圧力応動弁であり、下流の圧縮機吸込み圧力が設定値を超えると弁を絞り、モータの許容電流超過（過負荷遮断）を確実に防ぐ。よって記述は正しい。", "explanation": "クランクケース圧力調整弁（SPR）は出口圧力応動弁であり、下流の圧縮機吸込み圧力が設定値を超えると弁を絞り、モータの許容電流超過（過負荷遮断）を確実に防ぐ。よって記述は正しい。"}, {"id": 2271, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "空冷凝縮器に用いられる凝縮圧力調整弁は、冬期に外気温が著しく低下した際、凝縮器出口の液冷媒配管を絞って凝縮器内に液を滞留させ、有効伝熱面積を減少させることで凝縮圧力を維持する。", "answer": "○", "law": "冬期の低圧化による膨張弁前後の差圧不足（冷媒流量不足）を防ぐため、凝縮器内に液を意図的に滞留（液バックアップ）させて凝縮圧力を適正範囲に保つ。よって記述は正しい。", "explanation": "冬期の低圧化による膨張弁前後の差圧不足（冷媒流量不足）を防ぐため、凝縮器内に液を意図的に滞留（液バックアップ）させて凝縮圧力を適正範囲に保つ。よって記述は正しい。"}, {"id": 2272, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "水冷凝縮器の冷却水調整弁（制水弁）は、凝縮器の負荷が増加して凝縮圧力が上昇した際、ベローズまたはダイヤフラムが感知して弁開度を狭め、冷却水量を減少させて水温を上げるように動作する。", "answer": "×", "law": "制水弁は凝縮圧力が上昇したときに弁を「開いて」冷却水量を増加させ、凝縮熱の放出を促して凝縮圧力を正常値まで引き下げる。「弁開度を狭め水量を減少させる」は逆であり誤り。", "explanation": "制水弁は凝縮圧力が上昇したときに弁を「開いて」冷却水量を増加させ、凝縮熱の放出を促して凝縮圧力を正常値まで引き下げる。「弁開度を狭め水量を減少させる」は逆であり誤り。"}, {"id": 2273, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "イ", "theme": "制御機器・保護装置", "question": "高圧遮断圧力スイッチ（高圧カットアウト）は、凝縮圧力の異常上昇時に安全弁の吹出し作動よりも先に圧縮機を停止させる保護装置であり、誤作動防止のため自動復帰形を用いるのが法令上の大原則である。", "answer": "×", "law": "高圧遮断スイッチは異常原因を確認・解消しないまま再始動して事故に至るのを防ぐため、原則として「手動復帰形（マニュアルリセット）」とすることが義務付けられる。誤り。", "explanation": "高圧遮断スイッチは異常原因を確認・解消しないまま再始動して事故に至るのを防ぐため、原則として「手動復帰形（マニュアルリセット）」とすることが義務付けられる。誤り。"}, {"id": 2274, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器・保護装置", "question": "低圧遮断圧力スイッチ（低圧カットアウト）は、配管破損による冷媒漏洩や膨張弁閉塞などで吸込み圧力が異常低下した際に圧縮機を停止させ、大気吸込みや真空運転によるモータ絶縁破壊を防止する。", "answer": "○", "law": "低圧圧力が過度に低下した状態での運転継続は、低圧側からの外気・水分吸引や、密閉モータのコロナ放電・絶縁破壊を招くため、低圧カットアウトにより安全停止させる。よって記述は正しい。", "explanation": "低圧圧力が過度に低下した状態での運転継続は、低圧側からの外気・水分吸引や、密閉モータのコロナ放電・絶縁破壊を招くため、低圧カットアウトにより安全停止させる。よって記述は正しい。"}, {"id": 2275, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器・保護装置", "question": "油圧保護圧力スイッチ（OPS）は、給油ポンプ吐出し圧力とクランクケース内圧力との差圧を監視し、設定時間以上この差圧が不足した場合に電気接点を開いて圧縮機を停止させる。", "answer": "○", "law": "実効油圧（油ポンプ圧−吸込み側背圧）が基準値以下に落ち込んだ状態が内蔵タイマ時限（約60〜90秒）を超えて継続した場合に、軸受焼付き保護のため回路を遮断する。よって記述は正しい。", "explanation": "実効油圧（油ポンプ圧−吸込み側背圧）が基準値以下に落ち込んだ状態が内蔵タイマ時限（約60〜90秒）を超えて継続した場合に、軸受焼付き保護のため回路を遮断する。よって記述は正しい。"}, {"id": 2276, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器・保護装置", "question": "電子式温度調節器（デジタルサーモスタット）は、白金測温抵抗体やサーミスタを温度センサとし、PID制御アルゴリズム等を用いて電磁弁やインバータを精密に制御することができる。", "answer": "○", "law": "電子回路を用いたサーモスタットは感温性に優れ、温度変化を電圧・抵抗信号として受けてPID演算によるきめ細かなアクチュエータ制御や遠隔監視盤へのデータ伝送が可能である。よって記述は正しい。", "explanation": "電子回路を用いたサーモスタットは感温性に優れ、温度変化を電圧・抵抗信号として受けてPID演算によるきめ細かなアクチュエータ制御や遠隔監視盤へのデータ伝送が可能である。よって記述は正しい。"}, {"id": 2277, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "油分離器は、圧縮機吐出しガス配管に設置され、ガス中に同伴する冷凍機油を分離捕集して圧縮機クランクケースへ自動返油することで、凝縮器や蒸発器の油膜付着による伝熱阻害を軽減する。", "answer": "○", "law": "油分離器は吐出しガスから油を分離してクランクケースへ戻し、熱交換器内への油滞留・伝熱劣化を防ぐとともに、圧縮機内部の潤滑油量枯渇を未然に防止する。よって記述は正しい。", "explanation": "油分離器は吐出しガスから油を分離してクランクケースへ戻し、熱交換器内への油滞留・伝熱劣化を防ぐとともに、圧縮機内部の潤滑油量枯渇を未然に防止する。よって記述は正しい。"}, {"id": 2278, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器は、運転中の負荷変動に伴う冷媒循環量の変動を吸収するとともに、冷媒全量を回収（ポンプダウン）する際に液封事故を起こさないよう、内容積の80%以下の容量で冷媒を保持できる設計とする。", "answer": "○", "law": "液封破壊を防ぐため常時20%以上の気相蒸気空間を確保する基準（充填率80%以下）とし、機器修理点検時の冷媒退避スペースとしても機能する。よって記述は正しい。", "explanation": "液封破壊を防ぐため常時20%以上の気相蒸気空間を確保する基準（充填率80%以下）とし、機器修理点検時の冷媒退避スペースとしても機能する。よって記述は正しい。"}, {"id": 2279, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "フルオロカーボン冷媒装置に設置されるフィルタドライヤの乾燥剤（モレキュラーシーブ等）は、水分を飽和吸着した後であっても加熱再生することなく半永久的に水分吸着能力を維持し続ける。", "answer": "×", "law": "乾燥剤の水分吸着能力には限度があり、飽和すると水分を除去できなくなるため、定期的なコア交換またはドライヤ本体の取替えが必要である。「半永久的に維持する」は誤り。", "explanation": "乾燥剤の水分吸着能力には限度があり、飽和すると水分を除去できなくなるため、定期的なコア交換またはドライヤ本体の取替えが必要である。「半永久的に維持する」は誤り。"}, {"id": 2280, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "吸込み液分離器（アキュムレータ）は、低圧吸込み配管に設けられ、蒸発器から戻る未蒸発液冷媒を重力沈降により分離して圧縮機への液バックを防止し、気体冷媒のみを吸込ませる。", "answer": "○", "law": "アキュムレータは急激な負荷変動時やデフロスト復帰時に発生する液戻りを一時受け止めて気液分離し、圧縮機の液圧縮破損を確実に防止する。よって記述は正しい。", "explanation": "アキュムレータは急激な負荷変動時やデフロスト復帰時に発生する液戻りを一時受け止めて気液分離し、圧縮機の液圧縮破損を確実に防止する。よって記述は正しい。"}, {"id": 2281, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "イ", "theme": "附属機器・冷凍サイクル", "question": "フルオロカーボン冷凍装置において、液配管が長く立ち上がり高さが大きい場合、配管摩擦損失やヘッド圧低下により液管内でフラッシュガスが発生しやすいため、液ガス熱交換器を設けて冷媒液を過冷却することが有効である。", "answer": "○", "law": "立上がり管での静圧低下や配管抵抗で圧力が飽和圧力を下回ると液管内で気泡（フラッシュガス）が生じ膨張弁能力が激減するため、液ガス熱交による十分な過冷却が極めて有効である。よって記述は正しい。", "explanation": "立上がり管での静圧低下や配管抵抗で圧力が飽和圧力を下回ると液管内で気泡（フラッシュガス）が生じ膨張弁能力が激減するため、液ガス熱交による十分な過冷却が極めて有効である。よって記述は正しい。"}, {"id": 2282, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器・冷凍サイクル", "question": "アンモニア二段圧縮冷凍装置に用いられる中間冷却器（インタークーラ）は、低段圧縮機の吐出しガスを中間温度まで減温冷却するとともに、蒸発器に向かう高圧液冷媒を中間温度付近まで過冷却する。", "answer": "○", "law": "中間冷却器は低段吐出ガスの過熱を中間液冷媒で冷却して高段吸込み過熱を防ぎ、同時に過冷却コイル等で蒸発器行きの液冷媒を深く過冷却して冷凍効果を大幅に高める。よって記述は正しい。", "explanation": "中間冷却器は低段吐出ガスの過熱を中間液冷媒で冷却して高段吸込み過熱を防ぎ、同時に過冷却コイル等で蒸発器行きの液冷媒を深く過冷却して冷凍効果を大幅に高める。よって記述は正しい。"}, {"id": 2283, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器・冷凍サイクル", "question": "二元冷凍装置のカスケードコンデンサ（凝縮蒸発器）では、高温側サイクルの蒸発器が低温側サイクルの凝縮器を冷却する構成となっており、双方のサイクルで異なる冷媒がそれぞれの独立した流路内で熱交換する。", "answer": "○", "law": "カスケードコンデンサは、高温側冷媒の蒸発熱を利用して低温側冷媒の凝縮熱を奪う熱交換器であり、2系統の冷媒回路は完全に分離独立している。よって記述は正しい。", "explanation": "カスケードコンデンサは、高温側冷媒の蒸発熱を利用して低温側冷媒の凝縮熱を奪う熱交換器であり、2系統の冷媒回路は完全に分離独立している。よって記述は正しい。"}, {"id": 2284, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器・冷凍サイクル", "question": "自動不凝縮ガスパージャは、系内の不凝縮ガスを水槽に直接導いて常時連続的に大気中へ放出する装置であり、ガスパージャ本体内に冷却器や凝縮機構を設ける必要はない。", "answer": "×", "law": "不凝縮ガス分離器は本体内で冷媒蒸気を冷却液化させて系統へ戻し、凝縮しない空気等のガスのみを溜めて間欠排気する構造をもつ。「冷却機構を設ける必要はない」は誤り。", "explanation": "不凝縮ガス分離器は本体内で冷媒蒸気を冷却液化させて系統へ戻し、凝縮しない空気等のガスのみを溜めて間欠排気する構造をもつ。「冷却機構を設ける必要はない」は誤り。"}, {"id": 2285, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管の施工と保守", "question": "圧縮機の吐出しガス配管において、凝縮器が圧縮機より高い位置にある場合、停止中に管壁で凝縮した液冷媒や油が重力でシリンダヘッドへ流下するのを防ぐため、圧縮機出口直後に立ち上がり配管と下部トラップを施工する。", "answer": "○", "law": "吐出し立上がり管の基部にオイルトラップを設け、上方へ向かう配管ループを形成することで、停止時に凝縮した液や油が圧縮機ヘッドへ逆流して再起動時に液圧縮を起こすのを防ぐ。よって記述は正しい。", "explanation": "吐出し立上がり管の基部にオイルトラップを設け、上方へ向かう配管ループを形成することで、停止時に凝縮した液や油が圧縮機ヘッドへ逆流して再起動時に液圧縮を起こすのを防ぐ。よって記述は正しい。"}, {"id": 2286, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管の施工と保守", "question": "吸込み立上がり管（サクションライザー）では、最小負荷運転時においても油を冷媒蒸気の上昇流によって上方へ同伴できるだけの最小ガス流速（通常5m/s程度以上）を確保するように管径を選定する。", "answer": "○", "law": "ガス流速が遅すぎると冷媒中の油膜が管壁を流下・滞留して蒸発器やライザー底部に油が溜まり圧縮機が油枯渇を起こすため、必要最小流速の維持やダブルライザー等の対策を行う。よって記述は正しい。", "explanation": "ガス流速が遅すぎると冷媒中の油膜が管壁を流下・滞留して蒸発器やライザー底部に油が溜まり圧縮機が油枯渇を起こすため、必要最小流速の維持やダブルライザー等の対策を行う。よって記述は正しい。"}, {"id": 2287, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管の施工と保守", "question": "銅管配管のろう付け作業において、管内に空気を充満させた状態でバーナー加熱を行うと、管内面に強固な黒色酸化被膜が形成されて耐食性が著しく向上するため、あえて窒素置換を行わない。", "answer": "×", "law": "管内の酸化被膜（酸化銅スケール）は運転開始後に冷媒や油に洗い流されて剥離し、膨張弁の詰まりや圧縮機の摺動部損傷を招く有害な異物となるため、必ず窒素置換ブロー下で加熱する。誤り。", "explanation": "管内の酸化被膜（酸化銅スケール）は運転開始後に冷媒や油に洗い流されて剥離し、膨張弁の詰まりや圧縮機の摺動部損傷を招く有害な異物となるため、必ず窒素置換ブロー下で加熱する。誤り。"}, {"id": 2288, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管の施工と保守", "question": "電磁弁と手動止め弁の間などに液冷媒が閉じ込められる可能性がある配管部には、液封入による温度上昇時の異常昇圧事故を防止するため、安全弁、破裂板、またはキャピラリ等を備えた圧力逃がし回路を設ける。", "answer": "○", "law": "液封入区間が外部熱で加熱されると液の熱膨張圧により数百気圧に達し配管や弁が容易に破裂するため、所定の圧力逃がし安全装置を設置することが保安上必須である。よって記述は正しい。", "explanation": "液封入区間が外部熱で加熱されると液の熱膨張圧により数百気圧に達し配管や弁が容易に破裂するため、所定の圧力逃がし安全装置を設置することが保安上必須である。よって記述は正しい。"}, {"id": 2289, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "安全弁の吹出し口に接続する放出管の開口部は、万一の吹出し時に周囲の作業者や建物開口部へ直接冷媒ガスが吹き付けないよう、安全な高さと向きに配置し、雨水や異物の侵入を防ぐ防雨構造とする。", "answer": "○", "law": "放出管の末端は地上から安全な高さに立ち上げ、風向きや換気取入れ口を考慮するとともに、管内に雨水が溜まって腐食や凍結閉塞を起こさないよう防雨フードや水抜き孔を設ける。よって記述は正しい。", "explanation": "放出管の末端は地上から安全な高さに立ち上げ、風向きや換気取入れ口を考慮するとともに、管内に雨水が溜まって腐食や凍結閉塞を起こさないよう防雨フードや水抜き孔を設ける。よって記述は正しい。"}, {"id": 2290, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "圧縮機用の安全弁は、圧縮機の吐出し弁から吐出し止め弁までの間の吐出し配管またはシリンダヘッド部に接続し、吐出し止め弁を閉止したまま圧縮機を誤始動した場合にも確実に圧力を逃がせる位置に設ける。", "answer": "○", "law": "圧縮機安全弁は吐出し止め弁よりも「一次側（圧縮機側）」に設置しなければ、弁閉止誤操作時の異常高圧爆発を防ぐことができない。よって記述は正しい。", "explanation": "圧縮機安全弁は吐出し止め弁よりも「一次側（圧縮機側）」に設置しなければ、弁閉止誤操作時の異常高圧爆発を防ぐことができない。よって記述は正しい。"}, {"id": 2291, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "溶栓（可溶栓）は、圧力上昇を検知して瞬時に弁が開閉を繰り返す復帰型の安全装置であり、高圧ガス保安法上、アンモニア冷凍装置の受液器に主安全弁として広く用いられている。", "answer": "×", "law": "溶栓は合金が溶融して全量吹き抜ける「非復帰型」の温度作動安全装置であり、毒性・可燃性であるアンモニア設備への使用は固く禁じられている。誤り。", "explanation": "溶栓は合金が溶融して全量吹き抜ける「非復帰型」の温度作動安全装置であり、毒性・可燃性であるアンモニア設備への使用は固く禁じられている。誤り。"}, {"id": 2292, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "アンモニアを冷媒とする高圧冷媒設備の安全弁から排出されるガスは、強烈な毒性と引火性をもつため、大気開放とせず水槽散水装置やスクラバー等の除害処理装置へ導いて無害化処理する。", "answer": "○", "law": "アンモニアは水への溶解度が極めて高いため、放出管下流に水槽や水散水式の除害吸収塔を設置してアンモニアガスを水に吸収・中和させ、大気拡散による災害を防止する。よって記述は正しい。", "explanation": "アンモニアは水への溶解度が極めて高いため、放出管下流に水槽や水散水式の除害吸収塔を設置してアンモニアガスを水に吸収・中和させ、大気拡散による災害を防止する。よって記述は正しい。"}, {"id": 2293, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験および材料・非破壊試験", "question": "冷媒設備の耐圧試験において、配管以外の冷媒設備本体に水圧試験を実施する際は、内部の空気を完全に抜いて液体で満たし、所定の試験圧力まで昇圧して所定時間保持した後、漏れ、異常変形、破壊のないことを確認する。", "answer": "○", "law": "水圧試験は液体の非圧縮性を利用して安全に行うため、エアポケット（残留空気）を完全排気した後に耐圧試験圧力（許容圧力の1.5倍以上）まで加圧し、変形や漏れの有無を検査する。よって記述は正しい。", "explanation": "水圧試験は液体の非圧縮性を利用して安全に行うため、エアポケット（残留空気）を完全排気した後に耐圧試験圧力（許容圧力の1.5倍以上）まで加圧し、変形や漏れの有無を検査する。よって記述は正しい。"}, {"id": 2294, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験および材料・非破壊試験", "question": "気密試験において、設備の試験圧力を許容圧力まで昇圧する際、安全のため許容圧力の約50%程度まで加圧して初期漏れのないことを確認した後、段階的に所定試験圧力まで昇圧する。", "answer": "○", "law": "高圧気体による気密試験では初期昇圧時の配管抜け等の大事故を防ぐため、低圧段階で中間点検を行い、異常がないことを確認しながら段階的に許容圧力以上まで昇圧する。よって記述は正しい。", "explanation": "高圧気体による気密試験では初期昇圧時の配管抜け等の大事故を防ぐため、低圧段階で中間点検を行い、異常がないことを確認しながら段階的に許容圧力以上まで昇圧する。よって記述は正しい。"}, {"id": 2295, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験および材料・非破壊試験", "question": "配管施工後の気密試験において、試験用ガスとしてプロパンや都市ガスなどの可燃性ガスを使用することは、ガス漏れ警報器で容易に漏洩を検知できるため保安上推奨される。", "answer": "×", "law": "気密試験に可燃性ガスや酸素を使用することは引火・爆発の危険が極めて高いため法令上固く禁じられており、不活性ガス（窒素等）または可燃性ガスを排除した乾燥空気を用いる。誤り。", "explanation": "気密試験に可燃性ガスや酸素を使用することは引火・爆発の危険が極めて高いため法令上固く禁じられており、不活性ガス（窒素等）または可燃性ガスを排除した乾燥空気を用いる。誤り。"}, {"id": 2296, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験および材料・非破壊試験", "question": "真空乾燥（真空引き）作業において、真空ポンプ停止後に真空放置試験を行い、圧力計の指示値が周囲温度の低下に伴って若干降下した場合は、装置内に外部から空気が漏入している証拠である。", "answer": "×", "law": "外部から空気が漏入（リーク）している場合は圧力は「上昇」する。温度低下に伴いボイル・シャルルの法則に従って圧力が「降下」しているのは系内が気密に保たれている証拠である。誤り。", "explanation": "外部から空気が漏入（リーク）している場合は圧力は「上昇」する。温度低下に伴いボイル・シャルルの法則に従って圧力が「降下」しているのは系内が気密に保たれている証拠である。誤り。"}, {"id": 2297, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "イ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "圧縮機を据え付ける基礎コンクリートにおいて、基礎ボルトの埋込み深さや強度が不足していると、運転中の振動によってボルトが緩み、配管の折損や冷媒漏洩などの重大事故を誘発する。", "answer": "○", "law": "アンカーボルトの締結不良や基礎の剛性不足は、圧縮機の振動振幅を増大させて接続冷媒配管の疲労割れ・冷媒噴出事故に直結するため、適切な埋込み長さとトルク管理が必要である。よって記述は正しい。", "explanation": "アンカーボルトの締結不良や基礎の剛性不足は、圧縮機の振動振幅を増大させて接続冷媒配管の疲労割れ・冷媒噴出事故に直結するため、適切な埋込み長さとトルク管理が必要である。よって記述は正しい。"}, {"id": 2298, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ロ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "試運転前の確認項目として、電源電圧の不平衡、電動機の回転方向（三相結線の相順）、各止め弁の開閉状態、クランクケースの油面レベル、および保護継電器の作動設定値などを点検する。", "answer": "○", "law": "逆回転による圧縮機破損防止のための相順確認、閉塞運転防止のための弁開閉確認、過電流・油圧保護設定値の確認等は試運転前の極めて重要な保安点検項目である。よって記述は正しい。", "explanation": "逆回転による圧縮機破損防止のための相順確認、閉塞運転防止のための弁開閉確認、過電流・油圧保護設定値の確認等は試運転前の極めて重要な保安点検項目である。よって記述は正しい。"}, {"id": 2299, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ハ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "HFC系冷媒であるR410Aは、ジフルオロメタン（R32）とペンタフルオロエタン（R125）の等質量混合冷媒であり、疑似共沸混合冷媒であるため温度勾配（温度グライド）は実質的にほとんど無視できる。", "answer": "○", "law": "R410Aは擬似共沸（疑似共沸）混合冷媒であり、気液平衡時の温度グライドが約0.1K程度と極めて小さいため、ほぼ単一冷媒と同様の挙動を示す。よって記述は正しい。", "explanation": "R410Aは擬似共沸（疑似共沸）混合冷媒であり、気液平衡時の温度グライドが約0.1K程度と極めて小さいため、ほぼ単一冷媒と同様の挙動を示す。よって記述は正しい。"}, {"id": 2300, "subject": "保安管理", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ニ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "アンモニア冷凍装置の運転において、冷媒系統内に混入した冷凍機油はアンモニア冷媒液よりも密度が小さいため、低圧受液器や油溜め器の液面上部に浮上し、上部液面から油抜き弁を介して回収される。", "answer": "×", "law": "鉱油系冷凍機油の密度（比重約0.9）は液化アンモニアの密度（比重約0.6〜0.68）よりも「重い（大きい）」ため、容器の「底部」に沈降する。底部から油抜きを行うため「上部に浮上し上部から回収」は誤り。", "explanation": "鉱油系冷凍機油の密度（比重約0.9）は液化アンモニアの密度（比重約0.6〜0.68）よりも「重い（大きい）」ため、容器の「底部」に沈降する。底部から油抜きを行うため「上部に浮上し上部から回収」は誤り。"}, {"id": 2301, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "多気筒往復圧縮機において、ピストン押しのけ量は、気筒の内径、ピストンストローク、気筒数および回転速度によって決まり、吸込み弁や吐出し弁の流動抵抗による影響を受けない。", "answer": "○", "law": "ピストン押しのけ量（幾何学的理論吐出し量）は気筒断面積、行程長さ、気筒数、回転速度のみで幾何学的に決定され、弁抵抗や圧力損失などの影響を受けない。よって記述は正しい。", "explanation": "ピストン押しのけ量（幾何学的理論吐出し量）は気筒断面積、行程長さ、気筒数、回転速度のみで幾何学的に決定され、弁抵抗や圧力損失などの影響を受けない。よって記述は正しい。"}, {"id": 2302, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "スクリュー圧縮機は、ケーシング内に多量の潤滑油を噴射してロータ間やケーシングとの隙間を密封するとともに、圧縮熱を吸収して吐出しガス温度の上昇を抑制する油冷式が一般的である。", "answer": "○", "law": "給油式（油冷式）スクリュー圧縮機では、多量に噴射される油がシール作用、潤滑作用とともに冷却作用を果たし、高い圧力比でも吐出し温度を低く抑えることができる。よって記述は正しい。", "explanation": "給油式（油冷式）スクリュー圧縮機では、多量に噴射される油がシール作用、潤滑作用とともに冷却作用を果たし、高い圧力比でも吐出し温度を低く抑えることができる。よって記述は正しい。"}, {"id": 2303, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は、旋回スクロールが自転しながら公転運動を行うことにより、外周の吸込み口から吸入した冷媒を中心の吐出し口へ向かって容積圧縮する機構である。", "answer": "×", "law": "スクロール圧縮機の旋回スクロールは自転防止機構（オルダム継手等）によって「自転せずに公転運動のみ」を行う。自転させると吸込み室が形成されないため誤り。", "explanation": "スクロール圧縮機の旋回スクロールは自転防止機構（オルダム継手等）によって「自転せずに公転運動のみ」を行う。自転させると吸込み室が形成されないため誤り。"}, {"id": 2304, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、多量の冷媒蒸気を扱う大容量空調や低温用冷凍設備に適しており、低温用など圧力比が大きい場合には多段インペラ（多段圧縮式）が採用される。", "answer": "○", "law": "遠心圧縮機は流体速度を利用するため大風量用途に適し、低温運転等で所要圧力比が大きい場合はインペラを2段以上に直列配置する多段式が用いられる。よって記述は正しい。", "explanation": "遠心圧縮機は流体速度を利用するため大風量用途に適し、低温運転等で所要圧力比が大きい場合はインペラを2段以上に直列配置する多段式が用いられる。よって記述は正しい。"}, {"id": 2305, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "多気筒往復圧縮機のアンローダ機構は、吸込み圧力の変化に応じて作動気筒数を変化させることで、負荷の変動に応じた段階的な容量制御を可能にしている。", "answer": "○", "law": "多気筒機では油圧機構等により吸込み弁を開放して無負荷気筒を作ることで、4気筒機なら50%・100%、8気筒機なら25%刻み等の段階的な容量制御を行う。よって記述は正しい。", "explanation": "多気筒機では油圧機構等により吸込み弁を開放して無負荷気筒を作ることで、4気筒機なら50%・100%、8気筒機なら25%刻み等の段階的な容量制御を行う。よって記述は正しい。"}, {"id": 2306, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "ツインスクリュー圧縮機では、スライド弁を移動させることによって、圧縮開始時期（吸込みポートの閉塞位置）を変化させ、広範囲で滑らかな連続容量制御を行うことができる。", "answer": "○", "law": "スライド弁を軸方向に移動させると、吸入された冷媒の一部が圧縮されずに吸込み側へ戻るため、10%〜100%の範囲で無段階（連続的）に容量を調節できる。よって記述は正しい。", "explanation": "スライド弁を軸方向に移動させると、吸入された冷媒の一部が圧縮されずに吸込み側へ戻るため、10%〜100%の範囲で無段階（連続的）に容量を調節できる。よって記述は正しい。"}, {"id": 2307, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "インバータによる回転速度制御では、圧縮機の回転速度を低下させるほど機械効率および体積効率が著しく向上するため、極低速域での連続運転が推奨される。", "answer": "×", "law": "極低速域では弁の追従不良や隙間からのガス漏れ割合の増大、潤滑油ポンプの油圧不足による軸受潤滑不良などが生じるため、下限回転速度が設けられる。誤り。", "explanation": "極低速域では弁の追従不良や隙間からのガス漏れ割合の増大、潤滑油ポンプの油圧不足による軸受潤滑不良などが生じるため、下限回転速度が設けられる。誤り。"}, {"id": 2308, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパス弁を用いた容量制御は、蒸発器熱負荷が減少した際に低圧側の圧力低下を防ぐことができるが、圧縮機の消費動力を低減させる効果は小さい。", "answer": "○", "law": "ホットガスバイパスは蒸発圧力の維持や凍結防止には有効であるが、圧縮機自体はガスを圧縮循環し続けるため動力低減効果は極めて小さく、省エネ手法ではない。よって記述は正しい。", "explanation": "ホットガスバイパスは蒸発圧力の維持や凍結防止には有効であるが、圧縮機自体はガスを圧縮循環し続けるため動力低減効果は極めて小さく、省エネ手法ではない。よって記述は正しい。"}, {"id": 2309, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吸込み過熱度が過大になると、吸込み蒸気の比体積が増加して冷媒循環質量流量が減少し、冷凍能力の低下を招くとともに、吐出しガス温度が異常上昇する。", "answer": "○", "law": "吸込み過熱度が高すぎると密度が低下して質量流量が落ち能力が低下し、さらに断熱圧縮後の吐出し温度が過昇して油の炭化や弁破損を招く。よって記述は正しい。", "explanation": "吸込み過熱度が高すぎると密度が低下して質量流量が落ち能力が低下し、さらに断熱圧縮後の吐出し温度が過昇して油の炭化や弁破損を招く。よって記述は正しい。"}, {"id": 2310, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の吸込み弁板に亀裂や破損が生じると、ピストンの圧縮行程中にシリンダ内の冷媒ガスが吸込み側へ逆流するため、体積効率が大幅に低下する。", "answer": "○", "law": "吸込み弁の密閉不良は圧縮途中の高圧ガスが吸込みキャビティへ吹き抜ける現象を引き起こし、実際の吐出しガス量が激減して体積効率が大きく低下する。よって記述は正しい。", "explanation": "吸込み弁の密閉不良は圧縮途中の高圧ガスが吸込みキャビティへ吹き抜ける現象を引き起こし、実際の吐出しガス量が激減して体積効率が大きく低下する。よって記述は正しい。"}, {"id": 2311, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "停止中にクランクケース内の冷凍機油に冷媒が多量に溶解する現象を寝込みといい、再始動時に急激な圧力降下が起こると油が激しく発泡するオイルフォーミングが発生する。", "answer": "○", "law": "寝込み状態で圧縮機が起動すると減圧により油中の冷媒が一気に突沸して泡立ち、油ポンプの油圧低下やシリンダへの油吸い込みによる液圧縮を引き起こす。よって記述は正しい。", "explanation": "寝込み状態で圧縮機が起動すると減圧により油中の冷媒が一気に突沸して泡立ち、油ポンプの油圧低下やシリンダへの油吸い込みによる液圧縮を引き起こす。よって記述は正しい。"}, {"id": 2312, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "密閉形圧縮機において、吸込み蒸気の過熱度が多少大きくなっても、電動機巻線は冷媒ガスによって十分に冷却されるため、吐出しガス温度や巻線温度が上昇することはない。", "answer": "×", "law": "密閉形圧縮機の電動機は吸込み冷媒ガスで冷却されているため、吸込みガス温度（過熱度）が高くなるとモータ巻線の冷却が不十分になり、巻線焼損や過熱運転を招く。誤り。", "explanation": "密閉形圧縮機の電動機は吸込み冷媒ガスで冷却されているため、吸込みガス温度（過熱度）が高くなるとモータ巻線の冷却が不十分になり、巻線焼損や過熱運転を招く。誤り。"}, {"id": 2313, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "水冷横形シェルアンドチューブ凝縮器において、伝熱管内にスケールが付着すると水側の熱伝達抵抗が増大し、一定の凝縮負荷に対して凝縮温度と凝縮圧力が上昇する。", "answer": "○", "law": "スケール層の熱伝導率は金属管に比べて極めて小さいため熱通過率が低下し、所定の放熱を行うために水と冷媒の温度差が広がり凝縮圧力・温度が上昇する。よって記述は正しい。", "explanation": "スケール層の熱伝導率は金属管に比べて極めて小さいため熱通過率が低下し、所定の放熱を行うために水と冷媒の温度差が広がり凝縮圧力・温度が上昇する。よって記述は正しい。"}, {"id": 2314, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "冷却水系統の汚れ係数（ファウリングファクター）は、水あかやスライムなどの付着度合いを表す指標であり、定期的な化学洗浄やチューブブラシ洗浄により適正値に維持する。", "answer": "○", "law": "汚れ係数は熱抵抗の増加分を示し、水冷凝縮器の性能維持のためには定期的な開放点検、ナイロンブラシや酸・アルカリ洗浄液によるスケール除去が不可欠である。よって記述は正しい。", "explanation": "汚れ係数は熱抵抗の増加分を示し、水冷凝縮器の性能維持のためには定期的な開放点検、ナイロンブラシや酸・アルカリ洗浄液によるスケール除去が不可欠である。よって記述は正しい。"}, {"id": 2315, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器において、冬期に外気温が著しく低下して凝縮圧力が低下しすぎると、温度自動膨張弁前後の圧力差が不足し、蒸発器への冷媒供給不足を引き起こす。", "answer": "○", "law": "膨張弁は高低圧の圧力差によって冷媒を流すため、冬場の過冷却・低凝縮圧力は差圧不足となって流量低下、蒸発圧力異常低下、冷却能力不足を招く。よって記述は正しい。", "explanation": "膨張弁は高低圧の圧力差によって冷媒を流すため、冬場の過冷却・低凝縮圧力は差圧不足となって流量低下、蒸発圧力異常低下、冷却能力不足を招く。よって記述は正しい。"}, {"id": 2316, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "冷媒系統内に混入した空気などの不凝縮ガスは、凝縮温度を低下させる効果があるため、高圧部の圧力計指示値を下げる働きをする。", "answer": "×", "law": "不凝縮ガスは冷媒蒸気の凝縮熱伝達を妨げて凝縮温度を上昇させ、さらに自身の分圧が加わるため、凝縮圧力（全圧）は著しく上昇する。「指示値を下げる」は誤り。", "explanation": "不凝縮ガスは冷媒蒸気の凝縮熱伝達を妨げて凝縮温度を上昇させ、さらに自身の分圧が加わるため、凝縮圧力（全圧）は著しく上昇する。「指示値を下げる」は誤り。"}, {"id": 2317, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "乾式蒸発器において、冷媒充てん量が不足すると、伝熱管内の冷媒液が早期に蒸発完了して管内の乾き領域（過熱蒸気域）が拡大し、蒸発圧力が低下して能力不足となる。", "answer": "○", "law": "冷媒不足時は伝熱管後半の気体接触部が広がり、気体の低い熱伝達率により熱通過率が低下し、蒸発温度・圧力が低下して吸込み過熱度が異常に大きくなる。よって記述は正しい。", "explanation": "冷媒不足時は伝熱管後半の気体接触部が広がり、気体の低い熱伝達率により熱通過率が低下し、蒸発温度・圧力が低下して吸込み過熱度が異常に大きくなる。よって記述は正しい。"}, {"id": 2318, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "満液式シェルアンドチューブ水冷却器において、管内の水流速が過度に遅い場合、層流化して熱伝達率が低下するだけでなく、水の一部が氷結して伝熱管を破損する危険が増大する。", "answer": "○", "law": "満液式では水流が滞留・層流化すると管壁近傍で局所的な氷結が起きやすく、管内凍結破裂に至るため、所定の流速維持と断水・低流量検知器（フロースイッチ）が必須である。よって記述は正しい。", "explanation": "満液式では水流が滞留・層流化すると管壁近傍で局所的な氷結が起きやすく、管内凍結破裂に至るため、所定の流速維持と断水・低流量検知器（フロースイッチ）が必須である。よって記述は正しい。"}, {"id": 2319, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "空気冷却用フィンコイル蒸発器において、霜が厚く付着すると熱伝導抵抗が増大するが、フィン間の空気流動抵抗は変化しないため、送風機の風量は一定に保たれる。", "answer": "×", "law": "着霜が進行するとフィン間の流路断面積が狭まって空気抵抗が著しく増大し、送風機の送風量は大きく減少する。「空気流動抵抗は変化しない」は誤り。", "explanation": "着霜が進行するとフィン間の流路断面積が狭まって空気抵抗が著しく増大し、送風機の送風量は大きく減少する。「空気流動抵抗は変化しない」は誤り。"}, {"id": 2320, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "冷媒液強制循環式冷凍装置では、低圧受液器（液セパレータ）からポンプで過剰な液冷媒を蒸発器に循環させるため、蒸発器内の全伝熱面が常に冷媒液で濡れた状態となり熱伝達率が高い。", "answer": "○", "law": "蒸発量の3〜5倍の液を循環させる液強制循環式は、伝熱管全域を濡れ壁蒸発（環状流・波状流）に保つことができ、乾き領域が生じないため極めて高い熱伝達率が得られる。よって記述は正しい。", "explanation": "蒸発量の3〜5倍の液を循環させる液強制循環式は、伝熱管全域を濡れ壁蒸発（環状流・波状流）に保つことができ、乾き領域が生じないため極めて高い熱伝達率が得られる。よって記述は正しい。"}, {"id": 2321, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器の伝熱特性", "question": "シェルアンドチューブ熱交換器において、邪魔板（バッフルプレート）を胴側に配置することにより、胴側流体の流速を高めるとともに直交流（クロスフロー）を形成して熱伝達率を向上させる。", "answer": "○", "law": "セグメントバッフル等を設けることで胴側流体の流路をジグザグにし、流速増加と管群に対する直角交差流によって乱流を促進し、熱伝達性能を飛躍的に高める。よって記述は正しい。", "explanation": "セグメントバッフル等を設けることで胴側流体の流路をジグザグにし、流速増加と管群に対する直角交差流によって乱流を促進し、熱伝達性能を飛躍的に高める。よって記述は正しい。"}, {"id": 2322, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器の伝熱特性", "question": "流体の乱流熱伝達率は、流体の熱伝導率、比熱、密度、粘度および流速によって定まり、一般にプラントル数（Pr）やレイノルズ数（Re）が大きいほど熱伝達率は高くなる。", "answer": "○", "law": "無次元数であるヌセルト数（Nu）はRe数とPr数の関数として表され、流速や密度が高く熱伝導率が大きいほど熱伝達率は高くなる。よって記述は正しい。", "explanation": "無次元数であるヌセルト数（Nu）はRe数とPr数の関数として表され、流速や密度が高く熱伝導率が大きいほど熱伝達率は高くなる。よって記述は正しい。"}, {"id": 2323, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器の伝熱特性", "question": "二重管熱交換器において、同一の伝熱面積および流体条件であれば、高温流体と低温流体が同じ向きに流れる並流のほうが、対向して流れる向流よりも熱通過率が大きくなる。", "answer": "×", "law": "対向流（向流）のほうが熱交換器全域にわたって温度差を大きく保てるため、対数平均温度差が大きくなり、並流よりも効率よく伝熱できる。「並流のほうが大きくなる」は誤り。", "explanation": "対向流（向流）のほうが熱交換器全域にわたって温度差を大きく保てるため、対数平均温度差が大きくなり、並流よりも効率よく伝熱できる。「並流のほうが大きくなる」は誤り。"}, {"id": 2324, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器の伝熱特性", "question": "空気冷却用フィン付き熱交換器では、空気側の熱伝達率が冷媒の沸騰熱伝達率に比べて著しく小さいため、伝熱面積を拡大したフィンを取り付けることで空気側の熱抵抗を低減させている。", "answer": "○", "law": "熱通過率向上の基本原則として、熱抵抗の支配的要因である気体（空気）側にプレートフィンやコルゲートフィンを設けて伝熱面積を稼ぎ、全体の熱通過性能を改善する。よって記述は正しい。", "explanation": "熱通過率向上の基本原則として、熱抵抗の支配的要因である気体（空気）側にプレートフィンやコルゲートフィンを設けて伝熱面積を稼ぎ、全体の熱通過性能を改善する。よって記述は正しい。"}, {"id": 2325, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "温度自動膨張弁の機能は、高圧の冷媒液を減圧膨張させて低温低圧の気液混合冷媒にするとともに、蒸発器出口の過熱度に応じて蒸発器への冷媒供給量を自動調節することである。", "answer": "○", "law": "膨張弁は絞り作用による圧力・温度降下と、蒸発負荷の変動に対応して適正な過熱度を維持しながら液冷媒を給液する二大機能を果たす。よって記述は正しい。", "explanation": "膨張弁は絞り作用による圧力・温度降下と、蒸発負荷の変動に対応して適正な過熱度を維持しながら液冷媒を給液する二大機能を果たす。よって記述は正しい。"}, {"id": 2326, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "蒸発器内の圧力損失が無視できるほど小さい小型冷凍装置では内部均圧形温度自動膨張弁が用いられるが、圧力損失が大きい装置では外部均圧形温度自動膨張弁を使用しなければならない。", "answer": "○", "law": "蒸発器の圧力降下が大きいと内部均圧形では弁が閉じ気味になり過熱度が過大となるため、蒸発器出口圧力を検出する外部均圧形を用いて適正過熱度制御を行う。よって記述は正しい。", "explanation": "蒸発器の圧力降下が大きいと内部均圧形では弁が閉じ気味になり過熱度が過大となるため、蒸発器出口圧力を検出する外部均圧形を用いて適正過熱度制御を行う。よって記述は正しい。"}, {"id": 2327, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "温度自動膨張弁の感温筒は、周囲空気温度や風の影響を受けないよう配管外面に密着させて固定し、防湿防熱材で確実に断熱施工する。", "answer": "○", "law": "感温筒が庫内空気や周囲ドラフトにさらされると正確な冷媒蒸気過熱度を検知できず誤動作するため、金属バンドで配管に密着固定し外部からの入熱を断熱材で遮断する。よって記述は正しい。", "explanation": "感温筒が庫内空気や周囲ドラフトにさらされると正確な冷媒蒸気過熱度を検知できず誤動作するため、金属バンドで配管に密着固定し外部からの入熱を断熱材で遮断する。よって記述は正しい。"}, {"id": 2328, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "定圧自動膨張弁は、蒸発器出口の過熱度を一定に保つように作動する調整弁であり、熱負荷の変動が激しい大容量冷凍装置に広く用いられる。", "answer": "×", "law": "定圧自動膨張弁は蒸発圧力（弁出口圧力）を一定に保つ弁であり過熱度制御は行えない。負荷変動時に液戻りや過熱を起こしやすいため負荷変動の激しい大容量装置には適さない。誤り。", "explanation": "定圧自動膨張弁は蒸発圧力（弁出口圧力）を一定に保つ弁であり過熱度制御は行えない。負荷変動時に液戻りや過熱を起こしやすいため負荷変動の激しい大容量装置には適さない。誤り。"}, {"id": 2329, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "蒸発圧力調整弁（EPR）は、蒸発器出口と圧縮機吸込み側の間に設置され、入口側の蒸発圧力が設定圧力以下に低下しないように絞り動作を行う自力式調整弁である。", "answer": "○", "law": "EPRは入口側圧力を感知し、設定圧力以下への低下を防止して水クーラの凍結や野菜・果物の過冷却（乾燥・凍結障害）を防止する。よって記述は正しい。", "explanation": "EPRは入口側圧力を感知し、設定圧力以下への低下を防止して水クーラの凍結や野菜・果物の過冷却（乾燥・凍結障害）を防止する。よって記述は正しい。"}, {"id": 2330, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "吸入圧力調整弁（SPR）は、デフロスト終了直後などに圧縮機吸込み圧力が急激に上昇して電動機が過負荷になるのを防ぐため、圧縮機吸込み圧力を設定値以下に制限する。", "answer": "○", "law": "SPR（クランクケース圧力調整弁）は出口側圧力を検知し、設定値以上の高圧ガスが圧縮機シリンダへ流入するのを遮断・制限してモータの過電流トリップを防止する。よって記述は正しい。", "explanation": "SPR（クランクケース圧力調整弁）は出口側圧力を検知し、設定値以上の高圧ガスが圧縮機シリンダへ流入するのを遮断・制限してモータの過電流トリップを防止する。よって記述は正しい。"}, {"id": 2331, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "凝縮圧力調整弁は、冬期の外気温度低下時に空冷凝縮器内に冷媒液を滞留させて伝熱面積を減少させることで、凝縮圧力を安定化させて膨張弁の作動差圧を確保する。", "answer": "○", "law": "冬場の過冷防止のため凝縮器出口を絞って液を溜め込み、有効気相凝縮面積を狭めることで高圧圧力を一定値以上に保持する。よって記述は正しい。", "explanation": "冬場の過冷防止のため凝縮器出口を絞って液を溜め込み、有効気相凝縮面積を狭めることで高圧圧力を一定値以上に保持する。よって記述は正しい。"}, {"id": 2332, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "水冷凝縮器の制水弁（冷却水調整弁）は、凝縮器の負荷が減少して凝縮圧力が低下した際、弁を全開にして大量の冷却水を流すことで凝縮器の過熱を防止する。", "answer": "×", "law": "制水弁は凝縮圧力が低下したときには弁開度を「絞って（減少させて）」冷却水量を減らし、凝縮圧力の下がりすぎを防止するとともに節水を図る。記述は逆であり誤り。", "explanation": "制水弁は凝縮圧力が低下したときには弁開度を「絞って（減少させて）」冷却水量を減らし、凝縮圧力の下がりすぎを防止するとともに節水を図る。記述は逆であり誤り。"}, {"id": 2333, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "イ", "theme": "制御機器・保護装置", "question": "高圧遮断圧力スイッチ（HPS）は、凝縮器の冷却水断水や送風機停止などの異常高圧時に圧縮機を緊急停止させる保安装置であり、安全弁が作動する前に確実に作動する設定値とする。", "answer": "○", "law": "高圧遮断装置の設定圧力は、高圧部安全弁の吹始め圧力より低く設定し、冷媒の外部大気放出に至る前に圧縮機を自動停止させなければならない。よって記述は正しい。", "explanation": "高圧遮断装置の設定圧力は、高圧部安全弁の吹始め圧力より低く設定し、冷媒の外部大気放出に至る前に圧縮機を自動停止させなければならない。よって記述は正しい。"}, {"id": 2334, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器・保護装置", "question": "差圧式油圧保護圧力スイッチ（OPS）は、給油ポンプ吐出し圧力からクランクケース内圧力を差し引いた有効油圧を検出し、油圧低下時に遅延タイマを経て接点を開放する。", "answer": "○", "law": "実質給油圧力（差圧）を感知し、始動時の油圧立ち上がり待ちや運転中の瞬間的油圧変動による誤トリップを防ぐため、約60〜90秒の時限遅延後に停止動作を行う。よって記述は正しい。", "explanation": "実質給油圧力（差圧）を感知し、始動時の油圧立ち上がり待ちや運転中の瞬間的油圧変動による誤トリップを防ぐため、約60〜90秒の時限遅延後に停止動作を行う。よって記述は正しい。"}, {"id": 2335, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器・保護装置", "question": "水冷式冷凍装置に設けられる断水リレー（フロースイッチ）は、冷却水管内の水流が停止した際に電気接点を開き、圧縮機をインターロック停止させて過圧事故を未然に防ぐ。", "answer": "○", "law": "水流低下や断水時に即座に圧縮機回路を遮断して凝縮器の異常高圧や水冷却器の管内凍結を防止する保護装置である。よって記述は正しい。", "explanation": "水流低下や断水時に即座に圧縮機回路を遮断して凝縮器の異常高圧や水冷却器の管内凍結を防止する保護装置である。よって記述は正しい。"}, {"id": 2336, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器・保護装置", "question": "低圧遮断圧力スイッチ（LPS）は、異常な吸込み圧力低下時に圧縮機を停止させる保護装置であるが、庫内温度調節器（サーモスタット）と連動したポンプダウン運転の停止用スイッチとしても機能する。", "answer": "○", "law": "サーモOFFで電磁弁が閉じた後、蒸発器内の冷媒を受液器へ回収し、吸込み圧力が設定停止圧力まで低下した時点でLPSが圧縮機を自動停止させるポンプダウン回路に汎用される。よって記述は正しい。", "explanation": "サーモOFFで電磁弁が閉じた後、蒸発器内の冷媒を受液器へ回収し、吸込み圧力が設定停止圧力まで低下した時点でLPSが圧縮機を自動停止させるポンプダウン回路に汎用される。よって記述は正しい。"}, {"id": 2337, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "油分離器は、圧縮機から吐き出された冷媒ガスから潤滑油を分離する機器であり、回収された油は油戻し管およびフロート弁等を介して自動的に圧縮機クランクケースに戻される。", "answer": "○", "law": "油分離器底部に溜まった油は液面フロート弁が開くことでクランクケースへ自動返油され、圧縮機の油枯渇と熱交換器への油持ち出しを同時に防止する。よって記述は正しい。", "explanation": "油分離器底部に溜まった油は液面フロート弁が開くことでクランクケースへ自動返油され、圧縮機の油枯渇と熱交換器への油持ち出しを同時に防止する。よって記述は正しい。"}, {"id": 2338, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器（液レシーバ）は、凝縮器と膨張弁の間の液配管に設置され、液封入による破壊事故を防ぐため、受液器容量の80%以内で全冷媒を回収できる容積設計とする。", "answer": "○", "law": "高圧受液器は液封防止のため常時20%以上の気相蒸気空間を残す基準（最大回収量80%以下）とされ、冷媒循環量の変動吸収と保守時の冷媒退避容器を兼ねる。よって記述は正しい。", "explanation": "高圧受液器は液封防止のため常時20%以上の気相蒸気空間を残す基準（最大回収量80%以下）とされ、冷媒循環量の変動吸収と保守時の冷媒退避容器を兼ねる。よって記述は正しい。"}, {"id": 2339, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "フィルタドライヤは、冷媒配管内の溶接かすや金属摩耗粉を除去するストレーナ機能と、冷媒中の遊離水分を物理吸着する乾燥剤コア（モレキュラーシーブ等）を一体化した機器である。", "answer": "○", "law": "フィルタドライヤは冷媒中の固形異物の捕捉と水分の吸着を同時に行い、膨張弁オリフィスでのアイスプラグや加水分解による酸・スラッジの発生を防止する。よって記述は正しい。", "explanation": "フィルタドライヤは冷媒中の固形異物の捕捉と水分の吸着を同時に行い、膨張弁オリフィスでのアイスプラグや加水分解による酸・スラッジの発生を防止する。よって記述は正しい。"}, {"id": 2340, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "低圧吸込み管に設けられるアキュムレータ（液分離器）は、内部のU字管頂部に大きな油戻し孔が設けられており、底部に溜まった大量の冷媒液を一気に圧縮機へ吸込ませる構造である。", "answer": "×", "law": "アキュムレータのU字管底部に設けられるのは「微小なオリフィス孔（メータリングホール）」であり、冷媒液を一気に吸い込ませると液圧縮を起こすため誤り。少量の油と液を霧状に徐々に吸入させる。", "explanation": "アキュムレータのU字管底部に設けられるのは「微小なオリフィス孔（メータリングホール）」であり、冷媒液を一気に吸い込ませると液圧縮を起こすため誤り。少量の油と液を霧状に徐々に吸入させる。"}, {"id": 2341, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "イ", "theme": "附属機器・冷凍サイクル", "question": "液ガス熱交換器は、凝縮器からの高温冷媒液と蒸発器からの低温冷媒蒸気の間で熱交換を行わせ、冷媒液を過冷却してフラッシュガスを防ぎ、吸込み蒸気を過熱して湿り圧縮を防止する。", "answer": "○", "law": "フルオロカーボン装置において、液ガス熱交は液管内での気泡発生防止と圧縮機への液戻り防止を同時に達成する有効な附属機器である。よって記述は正しい。", "explanation": "フルオロカーボン装置において、液ガス熱交は液管内での気泡発生防止と圧縮機への液戻り防止を同時に達成する有効な附属機器である。よって記述は正しい。"}, {"id": 2342, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器・冷凍サイクル", "question": "二段圧縮冷凍サイクルにおいて、中間冷却器（インタークーラ）で低段吐出しガスを冷却することにより、高段圧縮機の吐出しガス温度が低下し、圧縮機駆動動力の合計を低減できる。", "answer": "○", "law": "中間冷却により高段吸込み蒸気の比体積が縮小して高段圧縮動力が減り、吐出しガス温度も大幅に抑えられて圧縮機油の劣化を防ぐことができる。よって記述は正しい。", "explanation": "中間冷却により高段吸込み蒸気の比
