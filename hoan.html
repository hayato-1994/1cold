<title>第1種冷凍：保安管理 一問一答 (全600問) - 第1種冷凍機械責任者</title>
<style>
  :root {
    --primary: #1e3a8a; --primary-light: #2563eb; --bg: #f8fafc; --card-bg: #ffffff;
    --text: #0f172a; --text-muted: #64748b; --correct: #059669; --correct-bg: #ecfdf5;
    --correct-border: #6ee7b7; --incorrect: #dc2626; --incorrect-bg: #fef2f2;
    --incorrect-border: #fca5a5; --border: #e2e8f0; --maru-color: #1d4ed8; --batsu-color: #dc2626;
    --bookmark: #d97706; --bookmark-bg: #fef3c7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px) 12px; min-height: 100vh; display: flex; flex-direction: column; touch-action: manipulation; }
  .container { max-width: 620px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; flex: 1; }
  header { background: var(--card-bg); padding: 12px 14px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 10px; }
  .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  h1 { font-size: 1.02rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; }
  .badge-count { font-size: 0.68rem; background: #dbeafe; color: #1e40af; padding: 2px 6px; border-radius: 999px; font-weight: 700; }
  .btn-group { display: flex; gap: 5px; }
  .btn-action-sm { font-size: 0.72rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; border: none; }
  .btn-reset { color: #dc2626; border: 1px solid #fecaca; background: #fff; }
  .btn-stats { color: var(--primary); border: 1px solid #bfdbfe; background: #eff6ff; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .filters-full { grid-column: span 2; display: flex; gap: 6px; }
  select, input.search-box { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.8rem; background: #fff; font-weight: 600; color: var(--text); }
  input.search-box { font-weight: normal; }
  .progress-bar { width: 100%; height: 5px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin: 6px 0 4px 0; }
  .progress-fill { height: 100%; background: var(--primary-light); width: 0%; transition: width 0.2s ease; }
  .stats-row { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--text-muted); font-weight: 500; }
  .card { background: var(--card-bg); border-radius: 16px; padding: 16px 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.05); flex: 1; display: flex; flex-direction: column; position: relative; }
  .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
  .badge-left { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 0.7rem; padding: 2px 7px; border-radius: 5px; font-weight: 700; }
  .badge-sub { background: #e0e7ff; color: #3730a3; }
  .badge-year { background: #dbeafe; color: #1d4ed8; }
  .badge-num { background: #f1f5f9; color: #475569; }
  .badge-theme { background: #fef3c7; color: #92400e; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-bookmark { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 0.72rem; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 3px; color: var(--text-muted); }
  .btn-bookmark.active { background: var(--bookmark-bg); border-color: #fcd34d; color: var(--bookmark); font-weight: 700; }
  .question-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 12px; }
  .question-text { font-size: 0.98rem; line-height: 1.68; color: #1e293b; font-weight: 500; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; padding-bottom: 2px; }
  .btn-answer { min-height: 60px; font-size: 1.25rem; font-weight: 800; border-radius: 12px; border: 2px solid var(--border); background: #ffffff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .btn-answer small { font-size: 0.7rem; font-weight: 500; opacity: 0.75; }
  .btn-answer.maru { color: var(--maru-color); border-color: #bfdbfe; }
  .btn-answer.batsu { color: var(--batsu-color); border-color: #fecaca; }
  .btn-answer:disabled { opacity: 0.4; cursor: default; }
  .nav-sub-row { display: flex; justify-content: space-between; margin-top: 6px; padding: 0 4px; }
  .btn-nav-link { background: none; border: none; font-size: 0.74rem; color: var(--text-muted); cursor: pointer; text-decoration: underline; }
  .explanation-box { margin-top: 10px; padding: 12px; border-radius: 12px; display: none; }
  .explanation-box.correct { background: var(--correct-bg); border: 1.5px solid var(--correct-border); }
  .explanation-box.incorrect { background: var(--incorrect-bg); border: 1.5px solid var(--incorrect-border); }
  .result-title { font-size: 1rem; font-weight: 800; margin-bottom: 5px; }
  .result-title.correct { color: var(--correct); }
  .result-title.incorrect { color: var(--incorrect); }
  .law-tag { display: inline-block; font-size: 0.72rem; font-weight: 700; background: #ffffff; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); margin-bottom: 6px; color: #334155; }
  .exp-text { font-size: 0.88rem; line-height: 1.58; color: #1e293b; margin-bottom: 10px; }
  .exp-actions { display: flex; gap: 8px; }
  .btn-next { flex: 1; min-height: 44px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 0.94rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-prev-sm { padding: 0 12px; min-height: 44px; background: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--text); }
  
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
  .modal-content { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 82vh; display: flex; flex-direction: column; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .modal-header h2 { font-size: 0.98rem; color: var(--primary); font-weight: 700; }
  .btn-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }
  .modal-body { overflow-y: auto; flex: 1; }
  .stat-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.82rem; }
  .stat-theme-name { font-weight: 600; color: #1e293b; flex: 1; padding-right: 8px; }
  .stat-rate { font-weight: 700; color: var(--primary); min-width: 50px; text-align: right; }
  .stat-detail { font-size: 0.72rem; color: var(--text-muted); min-width: 60px; text-align: right; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="title-row">
      <h1>第1種冷凍：保安管理 <span class="badge-count">全600問</span></h1>
      <div class="btn-group">
        <button class="btn-action-sm btn-stats" onclick="openStatsModal()">📊 成績一覧</button>
        <button class="btn-action-sm btn-reset" onclick="resetStats()">リセット</button>
      </div>
    </div>
    <div class="filters">
      <select id="yearFilter" onchange="applyFilters()">
        <option value="ALL">全年度 (2016〜2025年)</option>
      </select>
      <select id="orderFilter" onchange="applyFilters()">
        <option value="sequential">出題順</option>
        <option value="random">シャッフル</option>
        <option value="wrongOnly">要復習 (誤答) のみ</option>
        <option value="bookmarkOnly">★ ブックマークのみ</option>
      </select>
      <div class="filters-full">
        <select id="themeFilter" onchange="applyFilters()" style="flex: 1.2;">
          <option value="ALL">すべての分類テーマ</option>
        </select>
        <input type="text" id="searchBox" class="search-box" placeholder="キーワード検索..." oninput="applyFilters()" style="flex: 0.8;">
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats-row">
      <span id="currentIdxText">0 / 0 問</span>
      <span id="scoreText">正解率: 0%</span>
    </div>
  </header>
  <div class="card" id="quizCard">
    <div class="badge-row">
      <div class="badge-left">
        <span class="badge badge-sub" id="badgeSub">保安管理</span>
        <span class="badge badge-year" id="badgeYear">年度</span>
        <span class="badge badge-num" id="badgeNum">問題番号</span>
        <span class="badge badge-theme" id="badgeTheme">出題テーマ</span>
      </div>
      <button class="btn-bookmark" id="btnBookmark" onclick="toggleBookmark()">★ 保存</button>
    </div>
    <div class="question-scroll">
      <div class="question-text" id="questionText">読み込み中...</div>
    </div>
    <div class="actions" id="actionButtons">
      <button class="btn-answer maru" id="btnMaru" onclick="checkAnswer('○')">○ 正しい<small>[キー: 1 または O]</small></button>
      <button class="btn-answer batsu" id="btnBatsu" onclick="checkAnswer('×')">× 誤り<small>[キー: 2 または X]</small></button>
    </div>
    <div class="nav-sub-row">
      <button class="btn-nav-link" onclick="prevQuestion()">◀ 前の問題へ</button>
      <button class="btn-nav-link" onclick="skipQuestion()">この問題をスキップ ▶</button>
    </div>
    <div class="explanation-box" id="explanationBox">
      <div class="result-title" id="resultTitle"></div>
      <div class="law-tag" id="lawTag"></div>
      <div class="exp-text" id="expText"></div>
      <div class="exp-actions">
        <button class="btn-prev-sm" onclick="prevQuestion()">◀ 前へ</button>
        <button class="btn-next" id="btnNext" onclick="nextQuestion()">次の問題へ ▶ [Space / Enter]</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="statsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📊 保安管理：分野別正答率一覧 (全600問)</h2>
      <button class="btn-close" onclick="closeStatsModal()">✕</button>
    </div>
    <div class="modal-body" id="statsModalBody"></div>
  </div>
</div>

<script>
const allQuestions = [{"id": 2001, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "小・中形の圧縮機では、圧縮機と電動機が同じ軸上に直結されて一つのケーシング内に収められた開放圧縮機が、フルオロカーボン冷凍装置に多く使用されている。", "answer": "×", "law": "小・中形の圧縮機では、圧縮機と電動機が同じ軸上に直結されて一つのケーシング内に収められ、一体構造とした密閉圧縮機がフルオロカーボン冷凍装置に多く使用されている。よって、「開放圧縮機」との記述は誤り。", "explanation": "小・中形の圧縮機では、圧縮機と電動機が同じ軸上に直結されて一つのケーシング内に収められ、一体構造とした密閉圧縮機がフルオロカーボン冷凍装置に多く使用されている。よって、「開放圧縮機」との記述は誤り。"}, {"id": 2002, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、羽根車を高速回転させ大量の冷媒蒸気を吸い込み、蒸気を遠心力によって渦巻室へ送り込み圧縮する方式の圧縮機であり、大容量の空気調和用などに適している。低温用で使用するときは圧力比が大きくなるので、多段圧縮式を採用する必要がある。", "answer": "○", "law": "遠心圧縮機は、羽根車を高速回転させ大量の冷媒蒸気を吸い込み、その蒸気を遠心力によって渦巻室へ送り込み圧縮する方式の圧縮機であり、大容量の空気調和用などに適している。低温用で使用するときは圧力比が大きくなるため、多段圧縮式を採用する必要がある。よって、記述は正しい。", "explanation": "遠心圧縮機は、羽根車を高速回転させ大量の冷媒蒸気を吸い込み、その蒸気を遠心力によって渦巻室へ送り込み圧縮する方式の圧縮機であり、大容量の空気調和用などに適している。低温用で使用するときは圧力比が大きくなるため、多段圧縮式を採用する必要がある。よって、記述は正しい。"}, {"id": 2003, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は、うず巻状の曲線で構成された固定スクロールと旋回スクロールを組み合わせ、両スクロールの間に形成された圧縮空間容積を減少させて、吸込みガスを圧縮する。圧縮空間は、次第に容積を減少させながら中心部に向かって移動する。", "answer": "○", "law": "スクロール圧縮機は、固定スクロールと旋回スクロールを組み合わせ、両スクロールの間に形成された圧縮空間容積を旋回にともない減少させて吸込みガスを圧縮する。圧縮空間は中心部に向かって移動し、中心部の吐出し口から吐き出される。よって、記述は正しい。", "explanation": "スクロール圧縮機は、固定スクロールと旋回スクロールを組み合わせ、両スクロールの間に形成された圧縮空間容積を旋回にともない減少させて吸込みガスを圧縮する。圧縮空間は中心部に向かって移動し、中心部の吐出し口から吐き出される。よって、記述は正しい。"}, {"id": 2004, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "コンパウンド圧縮機は、二段圧縮の冷凍サイクルを実現するために、低段側と高段側の圧縮を1台の圧縮機で行えるようにしたものである。低段側と高段側の気筒数比によって、それぞれのピストン押しのけ量の比が決まってしまうので、中間圧力は最適値から若干のずれを生じることがある。", "answer": "○", "law": "二段圧縮サイクルを1台の圧縮機（低段側・高段側の気筒を1台に配置）で駆動するものをコンパウンド圧縮機という。低段側と高段側のピストン押しのけ量比が固定されるため、中間圧力が最適値から若干ずれることがある。よって、記述は正しい。", "explanation": "二段圧縮サイクルを1台の圧縮機（低段側・高段側の気筒を1台に配置）で駆動するものをコンパウンド圧縮機という。低段側と高段側のピストン押しのけ量比が固定されるため、中間圧力が最適値から若干ずれることがある。よって、記述は正しい。"}, {"id": 2005, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパスによる容量制御では、ホットガスバイパス弁のほかに、ホットガス冷却専用の液噴射弁を取り付け、バイパス配管内でホットガスに冷媒液を混合して、ホットガスを冷却する場合がある。", "answer": "○", "law": "ホットガスバイパスによる容量制御では、バイパス弁のほかに液噴射弁を取り付け、バイパス配管内でホットガスと冷媒液を混合してホットガスを冷却する場合があるため、記述は正しい。", "explanation": "ホットガスバイパスによる容量制御では、バイパス弁のほかに液噴射弁を取り付け、バイパス配管内でホットガスと冷媒液を混合してホットガスを冷却する場合があるため、記述は正しい。"}, {"id": 2006, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "多気筒圧縮機のアンローダ機構は、一般に吸込み弁を開放して、作動気筒数を減らすことにより、容量を25〜100%の範囲で無段階に変えられるようになっている。また、圧縮機の始動時には、冷凍機油の油圧が正常に上がるまではアンロード状態になっており、圧縮機始動時の負荷軽減装置としても使われる。", "answer": "×", "law": "多気筒圧縮機のアンローダ機構は、一般に吸込み弁を開放して作動気筒数を減らすことにより、4気筒では100%・50%、8気筒では100%・75%・50%・25%と「段階的」に変えられる。「無段階に変えられる」との記述は誤り。", "explanation": "多気筒圧縮機のアンローダ機構は、一般に吸込み弁を開放して作動気筒数を減らすことにより、4気筒では100%・50%、8気筒では100%・75%・50%・25%と「段階的」に変えられる。「無段階に変えられる」との記述は誤り。"}, {"id": 2007, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "圧縮機の容量制御をインバータで行う場合、回転速度がある限定された範囲内では、体積効率はあまり変わらず、圧縮機の回転速度と容量はほぼ正比例するが、回転速度を大きく変えると低速回転時と高速回転時のいずれの場合にも体積効率が低下する場合がある。また、往復圧縮機でクランク軸に油ポンプを付けている圧縮機では、あまり低速にすると適正な油圧が得られなくなる。", "answer": "○", "law": "インバータによる回転速度制御では、限定された範囲内では体積効率はほぼ一定で容量と正比例するが、大きく変えると低速・高速ともに体積効率が低下する。また油ポンプ付き往復圧縮機では極端な低速で適正油圧が得られなくなる。よって、記述は正しい。", "explanation": "インバータによる回転速度制御では、限定された範囲内では体積効率はほぼ一定で容量と正比例するが、大きく変えると低速・高速ともに体積効率が低下する。また油ポンプ付き往復圧縮機では極端な低速で適正油圧が得られなくなる。よって、記述は正しい。"}, {"id": 2008, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "複数台の圧縮機をもった冷凍装置では、複数台の圧縮機を同時発停させて容量制御を行うことが一般的である。この容量制御方法では、複数台の圧縮機のクランクケース内の冷凍機油量が均一になるように、均油と均圧のための配管を設置する必要がある。", "answer": "×", "law": "複数台の圧縮機をもつ冷凍装置では、作動圧力に差をもたせた低圧圧力スイッチ等により「順次発停」させて段階的に容量制御を行うのが一般的である。「同時発停させて」との記述は誤り。", "explanation": "複数台の圧縮機をもつ冷凍装置では、作動圧力に差をもたせた低圧圧力スイッチ等により「順次発停」させて段階的に容量制御を行うのが一般的である。「同時発停させて」との記述は誤り。"}, {"id": 2009, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "熱負荷の減少で圧縮機の吸込み蒸気圧力が正常な状態から異常に低下すると、圧縮機での圧力比が減少し、湿り圧縮運転状態となり、圧縮機の吐出しガス温度は低下する。一方、冷却水量が減少すると、圧力比の増大によって吐出しガス温度が上昇し、圧縮機が過熱運転となる場合がある。", "answer": "×", "law": "熱負荷の減少で吸込み圧力が異常低下すると、圧縮機の圧力比は「増大」し、吐出しガス温度が上昇して「過熱運転」になる。「圧力比が減少し、湿り圧縮運転状態となり、吐出しガス温度は低下する」との記述は誤り。", "explanation": "熱負荷の減少で吸込み圧力が異常低下すると、圧縮機の圧力比は「増大」し、吐出しガス温度が上昇して「過熱運転」になる。「圧力比が減少し、湿り圧縮運転状態となり、吐出しガス温度は低下する」との記述は誤り。"}, {"id": 2010, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "冷凍機油は圧縮機の軸受、ロータやピストンなどの潤滑面に油膜をつくり、摩耗防止や摩擦によって生じる熱を除去する役割があるが、冷凍機油に鉱油を用いたアンモニアを冷媒とする往復圧縮機では、吐出しガス温度が高く、一般に圧縮機から吐き出された油を冷凍装置外部に排出する。", "answer": "○", "law": "アンモニアを冷媒とする往復圧縮機では吐出しガス温度が高く鉱油が劣化しやすいため、吐き出された油は圧縮機に戻さず冷凍装置の外部に排出（油抜き）する。よって記述は正しい。", "explanation": "アンモニアを冷媒とする往復圧縮機では吐出しガス温度が高く鉱油が劣化しやすいため、吐き出された油は圧縮機に戻さず冷凍装置の外部に排出（油抜き）する。よって記述は正しい。"}, {"id": 2011, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の吐出し弁からの漏れによる吐出しガス温度の上昇は非常に大きく、体積効率と断熱効率の低下を招く。吸込み弁板の割れや変形による漏れは、圧縮機の吐出しガス量が減少するので体積効率の低下を招くが、吐出しガス温度はあまり大きく上昇することはない。", "answer": "○", "law": "吐出し弁からの漏れは高温高圧ガスの逆流により体積効率低下と吐出しガス温度の著しい上昇を招く。吸込み弁の漏れは体積効率を大きく低下させるが、吐出しガス温度はあまり大きく上昇しない。よって記述は正しい。", "explanation": "吐出し弁からの漏れは高温高圧ガスの逆流により体積効率低下と吐出しガス温度の著しい上昇を招く。吸込み弁の漏れは体積効率を大きく低下させるが、吐出しガス温度はあまり大きく上昇しない。よって記述は正しい。"}, {"id": 2012, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の過熱運転の原因としては、吐出しガス圧力の上昇や圧縮機の不具合などがある。密閉往復圧縮機では、これ以外に電源の異常な高電圧や低電圧などもある。蒸発器熱負荷が過大となり膨張弁容量が不足する場合も過熱運転となることがある。", "answer": "○", "law": "過熱運転の原因には、吸込みガス圧力低下、過大な吸込み過熱度、吐出し圧力上昇、圧縮機の機械的不具合、密閉機での異常電圧、過大熱負荷による膨張弁容量不足などがある。よって記述は正しい。", "explanation": "過熱運転の原因には、吸込みガス圧力低下、過大な吸込み過熱度、吐出し圧力上昇、圧縮機の機械的不具合、密閉機での異常電圧、過大熱負荷による膨張弁容量不足などがある。よって記述は正しい。"}, {"id": 2013, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "イ", "theme": "高圧部の保守管理", "question": "受液器兼用の水冷横形シェルアンドチューブ凝縮器において、装置内に冷媒を過充てんすると、余分な冷媒液が凝縮器に貯えられ、多数の冷却管が冷媒液中につかり、冷媒蒸気の凝縮に有効な伝熱面積が減少し、凝縮温度が上昇する。一方、凝縮器出口の冷媒液の過冷却度は減少する。", "answer": "×", "law": "過充てんにより冷却管が液中につかると凝縮用伝熱面積が減少し凝縮温度は上昇するが、液がつかることで凝縮器出口冷媒液の「過冷却度は増大」する。「過冷却度は減少する」との記述は誤り。", "explanation": "過充てんにより冷却管が液中につかると凝縮用伝熱面積が減少し凝縮温度は上昇するが、液がつかることで凝縮器出口冷媒液の「過冷却度は増大」する。「過冷却度は減少する」との記述は誤り。"}, {"id": 2014, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ロ", "theme": "高圧部の保守管理", "question": "水分が冷媒に混入した状態で運転したり、高い吐出しガス温度で運転すると、冷媒と冷凍機油が分解して不凝縮ガスが生成する場合がある。", "answer": "○", "law": "水分混入や高い吐出しガス温度により、冷媒と油が加水分解・熱分解を起こしてスラッジや不凝縮ガスが生成される。よって記述は正しい。", "explanation": "水分混入や高い吐出しガス温度により、冷媒と油が加水分解・熱分解を起こしてスラッジや不凝縮ガスが生成される。よって記述は正しい。"}, {"id": 2015, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ハ", "theme": "高圧部の保守管理", "question": "水冷凝縮器において凝縮負荷と冷却水入口温度が変化しない場合、冷却水量の減少は、圧縮機駆動用電動機の消費電力の増加につながる。したがって、冷却水量の確保が必要である。", "answer": "○", "law": "冷却水量が減少すると出入口水温差が増大して出口水温・凝縮温度・凝縮圧力が上昇し、圧縮機駆動動力・消費電力が増加する。よって記述は正しい。", "explanation": "冷却水量が減少すると出入口水温差が増大して出口水温・凝縮温度・凝縮圧力が上昇し、圧縮機駆動動力・消費電力が増加する。よって記述は正しい。"}, {"id": 2016, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ニ", "theme": "高圧部の保守管理", "question": "空冷凝縮器を用いた冷凍装置において、冬季に外気温度低下により凝縮圧力が低下して膨張弁の容量が不足するときの対策として、凝縮圧力調整弁により凝縮器内に冷媒液を滞留させ、凝縮器の伝熱量を増加させて凝縮圧力を上昇させる方法がある。", "answer": "×", "law": "凝縮圧力調整弁は凝縮器内に液を滞留させて「凝縮に有効な伝熱面積を減少」させ、凝縮圧力を上昇・維持させる。「伝熱量を増加させて」との記述は誤り。", "explanation": "凝縮圧力調整弁は凝縮器内に液を滞留させて「凝縮に有効な伝熱面積を減少」させ、凝縮圧力を上昇・維持させる。「伝熱量を増加させて」との記述は誤り。"}, {"id": 2017, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "乾式シェルアンドチューブ蒸発器では、冷却管外に水を使用する場合に比べて、冷却管外にエチレングリコールなどのブラインを用いる場合のほうが、一般的に熱通過率は大きく、蒸発器を小さくすることができる。", "answer": "×", "law": "ブラインは水に比べて粘度が高く熱伝導率が低いため熱通過率は「小さく」、同じ能力を得るためには蒸発器を「大きく」しなければならない。「熱通過率は大きく、蒸発器を小さくできる」は誤り。", "explanation": "ブラインは水に比べて粘度が高く熱伝導率が低いため熱通過率は「小さく」、同じ能力を得るためには蒸発器を「大きく」しなければならない。「熱通過率は大きく、蒸発器を小さくできる」は誤り。"}, {"id": 2018, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "冷蔵用の冷凍装置では、空調用に比べて圧縮機の圧力比が小さく、蒸発圧力の変化が圧縮機駆動の軸動力に及ぼす影響は小さい。また、冷凍能力の減少を防止するために、蒸発温度と被冷却物との温度差は空調用に比べて小さく設定されている。", "answer": "×", "law": "冷蔵用冷凍装置は空調用に比べて蒸発温度が低いため「圧力比が大きく」、蒸発圧力変化が軸動力に及ぼす影響は「大きい」。「圧力比が小さく影響は小さい」との記述は誤り。", "explanation": "冷蔵用冷凍装置は空調用に比べて蒸発温度が低いため「圧力比が大きく」、蒸発圧力変化が軸動力に及ぼす影響は「大きい」。「圧力比が小さく影響は小さい」との記述は誤り。"}, {"id": 2019, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "蒸発器には熱負荷に応じて膨張弁から冷媒液が供給されるが、冷媒充てん量が不足したり、液管にフラッシュガスが発生したりすると、蒸発圧力の異常低下などが起こることがある。", "answer": "○", "law": "冷媒充てん量不足や液管内フラッシュガス発生があると、膨張弁への液供給が不足して蒸発器への冷媒流量が減少し、蒸発圧力の異常低下や冷却不良を招く。よって記述は正しい。", "explanation": "冷媒充てん量不足や液管内フラッシュガス発生があると、膨張弁への液供給が不足して蒸発器への冷媒流量が減少し、蒸発圧力の異常低下や冷却不良を招く。よって記述は正しい。"}, {"id": 2020, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "乾式シェルアンドチューブ蒸発器は、満液式シェルアンドチューブ蒸発器に比べて、運転中に蒸発圧力が低下してもブラインや水の凍結による冷却管の破損の危険性は少ない。", "answer": "○", "law": "満液式では管内を流れる水・ブラインが凍結すると管を密閉破壊しやすいのに対し、乾式は管外（胴側）が水・ブラインであるため凍結時の逃げがあり管破損の危険性が少ない。よって記述は正しい。", "explanation": "満液式では管内を流れる水・ブラインが凍結すると管を密閉破壊しやすいのに対し、乾式は管外（胴側）が水・ブラインであるため凍結時の逃げがあり管破損の危険性が少ない。よって記述は正しい。"}, {"id": 2021, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器", "question": "温度自動膨張弁を使用するユニットクーラでは、感温筒取付け部の冷媒蒸気出口管の管内冷媒蒸気は、適度に過熱している。並流式のこの熱交換器では一般的に冷媒と空気との平均温度差が向流式よりも小さく、過熱部の管長が長くなり、向流式に比べて冷却に有利である。", "answer": "×", "law": "並流式は向流式に比べて平均温度差が小さく伝熱性能上不利であり、過熱部管長が長くなるため「向流式に比べて冷却に有利」との記述は誤り。", "explanation": "並流式は向流式に比べて平均温度差が小さく伝熱性能上不利であり、過熱部管長が長くなるため「向流式に比べて冷却に有利」との記述は誤り。"}, {"id": 2022, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器", "question": "温度によって異なるが、冷凍機油(鉱油)の粘度はアンモニア冷媒液の粘度よりも三桁程度大きく、冷凍機油の熱伝導率はアンモニア冷媒液の1/3程度であり、伝熱面上の油膜は伝熱の大きな障害となるので、伝熱面からできるだけ排除することが望ましい。", "answer": "○", "law": "鉱油はアンモニア冷媒液に比べて粘度が約1000倍大きく、熱伝導率は約1/3と小さいため、伝熱面に油膜が付着すると著しい熱抵抗となる。伝熱面からできるだけ排除することが望ましい。よって記述は正しい。", "explanation": "鉱油はアンモニア冷媒液に比べて粘度が約1000倍大きく、熱伝導率は約1/3と小さいため、伝熱面に油膜が付着すると著しい熱抵抗となる。伝熱面からできるだけ排除することが望ましい。よって記述は正しい。"}, {"id": 2023, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器", "question": "ローフィンチューブを使用する水冷横形シェルアンドチューブ凝縮器では、設計時の冷媒と冷却水との算術平均温度差が大きなものほど、冷却管内面の水あかの汚れによる凝縮温度の上昇割合が大きくなる。", "answer": "○", "law": "設計平均温度差が大きい（熱流束が大きい）凝縮器ほど、同じ汚れ係数（水あか付着）に対して管壁温度差の上昇幅が大きくなり、結果として凝縮温度の上昇割合が大きくなる。よって記述は正しい。", "explanation": "設計平均温度差が大きい（熱流束が大きい）凝縮器ほど、同じ汚れ係数（水あか付着）に対して管壁温度差の上昇幅が大きくなり、結果として凝縮温度の上昇割合が大きくなる。よって記述は正しい。"}, {"id": 2024, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器", "question": "空気冷却用のフィンコイル乾式蒸発器では、冷媒と空気との算術平均温度差が大きくなると伝熱量(冷却能力)が増大する。ここで、伝熱量が増すと熱流束(熱流密度)が大きくなるので、冷媒側熱伝達率が大きくなり、熱通過率の値も同程度に大きくなる。", "answer": "×", "law": "熱流束増大により冷媒側熱伝達率は向上するが、フィンコイル蒸発器では空気側の熱伝達抵抗が支配的（全体の大部分）であるため、熱通過率全体の値はあまり大きくならない。「同程度に大きくなる」は誤り。", "explanation": "熱流束増大により冷媒側熱伝達率は向上するが、フィンコイル蒸発器では空気側の熱伝達抵抗が支配的（全体の大部分）であるため、熱通過率全体の値はあまり大きくならない。「同程度に大きくなる」は誤り。"}, {"id": 2025, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "外部均圧形温度自動膨張弁は蒸発器出口と膨張弁本体の均圧管接続部との間を均圧管で接続している。蒸発器出口側の均圧管取付位置は通常、膨張弁の感温筒取付位置より少し上流側とする。", "answer": "×", "law": "均圧管の蒸発器出口側取付位置は、感温筒取付け位置よりも「下流側（圧縮機側）」に接続する。「少し上流側とする」との記述は誤り。", "explanation": "均圧管の蒸発器出口側取付位置は、感温筒取付け位置よりも「下流側（圧縮機側）」に接続する。「少し上流側とする」との記述は誤り。"}, {"id": 2026, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "電子膨張弁は、調節器によって幅広い制御特性にすることができる利点がある。また装置停止前のポンプダウンや、装置停止時の蒸発器への送液停止など各種の操作をマイクロコンピュータに組み込むことができる。", "answer": "○", "law": "電子膨張弁はステッピングモータ等により精密かつ広範囲な弁開度制御が可能で、停止時の全閉（電磁弁機能の代用）やポンプダウン動作もマイコン制御できる。よって記述は正しい。", "explanation": "電子膨張弁はステッピングモータ等により精密かつ広範囲な弁開度制御が可能で、停止時の全閉（電磁弁機能の代用）やポンプダウン動作もマイコン制御できる。よって記述は正しい。"}, {"id": 2027, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "定圧自動膨張弁には、弁出口または蒸発器出口のいずれかの圧力を検知して制御の動作をする内部均圧形と外部均圧形とがある。温度自動膨張弁と比べて、過熱度制御が優れており、熱負荷の変動の大きな装置での使用に適している。", "answer": "×", "law": "定圧自動膨張弁は圧力を一定に保つ弁であり「過熱度制御はできない」。負荷変動が大きいと液戻りや過熱を起こすため負荷変動の大きい装置には適さない。「過熱度制御が優れている」は誤り。", "explanation": "定圧自動膨張弁は圧力を一定に保つ弁であり「過熱度制御はできない」。負荷変動が大きいと液戻りや過熱を起こすため負荷変動の大きい装置には適さない。「過熱度制御が優れている」は誤り。"}, {"id": 2028, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "キャピラリチューブは、熱負荷変動が小さく受液器を持たない小容量の冷凍装置に用いられ、その自己調整機能により凝縮器の圧力と過冷却度を制御する特性を持っている。その反面、蒸発器の圧力の影響は受けにくく、蒸発器出口の過熱度制御には使用できない。", "answer": "○", "law": "キャピラリチューブは単なる固定絞り管であり、凝縮圧力や過冷却度に応じた自己調整機能をもつが、蒸発器出口の過熱度制御は行えない。よって記述は正しい。", "explanation": "キャピラリチューブは単なる固定絞り管であり、凝縮圧力や過冷却度に応じた自己調整機能をもつが、蒸発器出口の過熱度制御は行えない。よって記述は正しい。"}, {"id": 2029, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "蒸発圧力調整弁は蒸発圧力が一定値以下にならないように制御する調整弁である。蒸発圧力調整弁を温度自動膨張弁と組み合わせて使用する場合には、膨張弁の感温筒は蒸発圧力調整弁の上流に取り付けなくてはならない。", "answer": "○", "law": "蒸発圧力調整弁（EPR）は蒸発圧力の下限を保持する。膨張弁の感温筒は蒸発器出口（EPRの上流側）に取り付けなければ正常な過熱度検出ができない。よって記述は正しい。", "explanation": "蒸発圧力調整弁（EPR）は蒸発圧力の下限を保持する。膨張弁の感温筒は蒸発器出口（EPRの上流側）に取り付けなければ正常な過熱度検出ができない。よって記述は正しい。"}, {"id": 2030, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "凝縮圧力調整弁は空冷凝縮器の冬季運転時における凝縮圧力の異常な低下を防止し、冷凍装置を正常な運転にするための圧力調整弁である。凝縮圧力調整弁による凝縮圧力の制御は、凝縮器への液の滞留による方法であり、その滞留分だけ、装置の冷媒充てん量に多少の余裕を必要とするので、受液器がなければならない。", "answer": "○", "law": "空冷凝縮器の冬季圧力低下を防ぐ凝縮圧力調整弁は、液を滞留させて伝熱面積を狭める制御を行うため、滞留冷媒量を吸収する受液器が不可欠である。よって記述は正しい。", "explanation": "空冷凝縮器の冬季圧力低下を防ぐ凝縮圧力調整弁は、液を滞留させて伝熱面積を狭める制御を行うため、滞留冷媒量を吸収する受液器が不可欠である。よって記述は正しい。"}, {"id": 2031, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "冷却水調整弁には、凝縮圧力または凝縮温度を検知して作動するものがある。温度式冷却水調整弁の特徴は、圧力式に比べて、一般的に弁の応答が速く、冷媒側と絶縁されて安全性が高く、調整弁の交換が容易なことである。", "answer": "×", "law": "温度式冷却水調整弁は感温筒と冷却水との間の熱移動を介するため「応答の遅れが大きく緩やかな制御」となる。「圧力式に比べて弁の応答が速い」との記述は誤り。", "explanation": "温度式冷却水調整弁は感温筒と冷却水との間の熱移動を介するため「応答の遅れが大きく緩やかな制御」となる。「圧力式に比べて弁の応答が速い」との記述は誤り。"}, {"id": 2032, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "ホットガスデフロスト後や長期間停止後に始動する場合などに予期しない圧縮機吸込み圧力の上昇があると、圧縮機用電動機が過負荷になる危険がある。吸入圧力調整弁はこれらの問題に対処するために、圧縮機吸込み圧力を一定値以上に上昇させないように制御する。", "answer": "○", "law": "吸入圧力調整弁（SPR）は、デフロスト後や再始動時の過大な吸込み圧力上昇を抑え、圧縮機電動機の過負荷（オーバーロード）を防止する弁である。よって記述は正しい。", "explanation": "吸入圧力調整弁（SPR）は、デフロスト後や再始動時の過大な吸込み圧力上昇を抑え、圧縮機電動機の過負荷（オーバーロード）を防止する弁である。よって記述は正しい。"}, {"id": 2033, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "イ", "theme": "制御機器", "question": "圧力式断水リレーは冷却水出入口間の差圧の変化を検出し、その信号で警報を発し、圧縮機を停止させる。圧力降下の少ない流路にはフロースイッチと呼ばれる流量式を用いる。フロースイッチは、圧力降下が不明でも、水圧がどうであっても自由に選択できる。", "answer": "○", "law": "流水状態と断水状態の差圧を検出するのが圧力式断水リレーであり、圧力差が小さい系統にはフロースイッチ（パドル式等）が用いられる。よって記述は正しい。", "explanation": "流水状態と断水状態の差圧を検出するのが圧力式断水リレーであり、圧力差が小さい系統にはフロースイッチ（パドル式等）が用いられる。よって記述は正しい。"}, {"id": 2034, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器", "question": "油圧保護圧力スイッチは、圧縮機の軸受などが油の潤滑不良により焼付き事故を起こすことを防止するための保護装置である。圧縮機の運転中に給油圧力が定められた圧力を一定時間以上保持できない場合には、圧力スイッチの電気接点を「開」にして圧縮機を停止させる。", "answer": "○", "law": "油圧保護スイッチ（OPS）は実質給油圧力（油圧−クランクケース圧）が設定値以下で一定時間（約90秒のディレイ）継続した場合に接点を開いて圧縮機を保護停止する。よって記述は正しい。", "explanation": "油圧保護スイッチ（OPS）は実質給油圧力（油圧−クランクケース圧）が設定値以下で一定時間（約90秒のディレイ）継続した場合に接点を開いて圧縮機を保護停止する。よって記述は正しい。"}, {"id": 2035, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器", "question": "ガスチャージ方式の蒸気圧式サーモスタットは、最高使用温度で感温筒に封入した媒体のすべてが気化し終わるように制限チャージしたものであり、感温筒内の液量が少ないために応答が速く、主に低温用に使われている。", "answer": "○", "law": "ガスチャージ方式（制限チャージ）は感温筒内液量がごく少量のため熱容量が小さく応答が速い。最高使用温度以上では気化完了して圧力上昇が抑えられる利点があり低温用に適する。よって記述は正しい。", "explanation": "ガスチャージ方式（制限チャージ）は感温筒内液量がごく少量のため熱容量が小さく応答が速い。最高使用温度以上では気化完了して圧力上昇が抑えられる利点があり低温用に適する。よって記述は正しい。"}, {"id": 2036, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器", "question": "フロート弁は液面レベルの上下変動に対する対応が遅く、フロートスイッチに手動膨張弁と電磁弁とを組み合わせた場合よりも、液面レベルの変動が大きくなるが、電気配線が不要で、配管も簡単であり、保守が容易であるという利点がある。", "answer": "×", "law": "フロート弁は機械的に液面変動に応じて連続的に直接給液するため、オンオフ動作の電磁弁制御よりも「液面レベルの変動を小さくできる」。「変動が大きくなる」との記述は誤り。", "explanation": "フロート弁は機械的に液面変動に応じて連続的に直接給液するため、オンオフ動作の電磁弁制御よりも「液面レベルの変動を小さくできる」。「変動が大きくなる」との記述は誤り。"}, {"id": 2037, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "油分離器を必要とする冷凍装置は、冷凍機油が装置内の凝縮器や蒸発器に入り込むと伝熱作用を阻害する装置、低温で油の粘度が高くなり蒸発器からの油戻しが難しい装置、油が冷媒系統を循環して圧縮機に戻ってくるまでに時間がかかる装置などである。", "answer": "○", "law": "油分離器は、非相溶性冷媒（アンモニア等）による伝熱阻害防止、低温時の油粘度上昇による油戻り不良防止、配管延長が長い装置での油枯渇防止などに必須である。よって記述は正しい。", "explanation": "油分離器は、非相溶性冷媒（アンモニア等）による伝熱阻害防止、低温時の油粘度上昇による油戻り不良防止、配管延長が長い装置での油枯渇防止などに必須である。よって記述は正しい。"}, {"id": 2038, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器には、運転中の大きな負荷変動、冷却器の運転台数の変化、ヒートポンプ装置の運転モードの切換え、空冷凝縮器での寝込みなどによる冷媒量の変化を吸収する容積をもたせ、さらに冷媒充てん量の全量または大部分の量を受液器容量の80%以内で回収できる容量をもたせる。", "answer": "○", "law": "高圧受液器は運転中の冷媒量変動を吸収し、修理点検時には装置内冷媒の大部分を受液器容量の80%以内（液封防止のため気相20%以上確保）に回収できる容量を確保する。よって記述は正しい。", "explanation": "高圧受液器は運転中の冷媒量変動を吸収し、修理点検時には装置内冷媒の大部分を受液器容量の80%以内（液封防止のため気相20%以上確保）に回収できる容量を確保する。よって記述は正しい。"}, {"id": 2039, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "フルオロカーボン冷凍装置では、シリカゲルやゼオライトの乾燥剤を用いて冷媒系統の水分を吸着除去する。アンモニア冷凍装置でも、一般的に同様の乾燥剤を用いて水分を除去する。", "answer": "×", "law": "アンモニアは水と強固に水素結合するため乾燥剤による吸着分離が極めて難しく、通常アンモニア冷凍装置にドライヤ（乾燥器）は使用しない。「アンモニアでも同様の乾燥剤を用いる」は誤り。", "explanation": "アンモニアは水と強固に水素結合するため乾燥剤による吸着分離が極めて難しく、通常アンモニア冷凍装置にドライヤ（乾燥器）は使用しない。「アンモニアでも同様の乾燥剤を用いる」は誤り。"}, {"id": 2040, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "一般的な低圧受液器は、液ポンプにより冷媒液を冷却器に送り出すための液位が確保されていれば、上部の冷媒蒸気の空間の大きさには関係なく、低圧受液器のある冷凍装置は安定して運転できる。", "answer": "×", "law": "低圧受液器は気液分離器（液分離器）の機能を兼ねており、圧縮機への液戻り（液圧縮）を防止するために「上部の冷媒蒸気空間の十分な容積と高さ」が不可欠である。「空間の大きさに関係なく」は誤り。", "explanation": "低圧受液器は気液分離器（液分離器）の機能を兼ねており、圧縮機への液戻り（液圧縮）を防止するために「上部の冷媒蒸気空間の十分な容積と高さ」が不可欠である。「空間の大きさに関係なく」は誤り。"}, {"id": 2041, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "イ", "theme": "附属機器", "question": "フルオロカーボン冷凍装置では、液配管が長い場合や液配管の立ち上がりが高いときの対策として、液ガス熱交換器で高温液と低温蒸気とを熱交換し、高温液に適度な過冷却度をもたせる方法がある。アンモニア冷凍装置でも、液ガス熱交換器は同様の目的で一般的に用いられる。", "answer": "×", "law": "アンモニア冷凍装置では吸込み蒸気の過熱度が増大すると吐出しガス温度が危険なほど著しく上昇するため、液ガス熱交換器は使用しない。「アンモニアでも一般的に用いられる」は誤り。", "explanation": "アンモニア冷凍装置では吸込み蒸気の過熱度が増大すると吐出しガス温度が危険なほど著しく上昇するため、液ガス熱交換器は使用しない。「アンモニアでも一般的に用いられる」は誤り。"}, {"id": 2042, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器", "question": "小形のフルオロカーボン冷凍装置に用いられるU字管を内蔵した液分離器では、入口から入った液滴を含んだ冷媒蒸気は、流れ方向の変化と速度の低下によって、液と蒸気に分離される。分離された容器底部の油と冷媒液は、U字管底部にあけられた小さな孔から、少量ずつ圧縮機へ吸い込まれる。", "answer": "○", "law": "アキュムレータ（液分離器）内のU字管底部にあけられた小孔（メータリングオリフィス）から、底部に溜まった油と冷媒液が少しずつ吸入蒸気に混入されて圧縮機に戻される。よって記述は正しい。", "explanation": "アキュムレータ（液分離器）内のU字管底部にあけられた小孔（メータリングオリフィス）から、底部に溜まった油と冷媒液が少しずつ吸入蒸気に混入されて圧縮機に戻される。よって記述は正しい。"}, {"id": 2043, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器", "question": "不凝縮ガス分離器は、おもに大形冷凍装置に用いられ、低圧側の運転圧力が大気圧以上の装置より大気圧以下で運転する装置のほうが設置の必要性は高い。", "answer": "○", "law": "低圧側が大気圧以下（負圧）となる低温冷凍装置では配管隙間等から空気が侵入しやすいため、不凝縮ガスパージャの設置必要性が特に高くなる。よって記述は正しい。", "explanation": "低圧側が大気圧以下（負圧）となる低温冷凍装置では配管隙間等から空気が侵入しやすいため、不凝縮ガスパージャの設置必要性が特に高くなる。よって記述は正しい。"}, {"id": 2044, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器", "question": "冷媒液強制循環式蒸発器では、一般に液ポンプにより蒸発量の3〜5倍の冷媒量を流す。また、冷凍機油の処理を行うために、一般的に、蒸発器本体に油戻し用の配管を設ける。", "answer": "×", "law": "冷媒液強制循環式において冷凍機油の濃縮・分離処理は「低圧受液器まわり」で行う。「蒸発器本体に油戻し配管を設ける」との記述は誤り。", "explanation": "冷媒液強制循環式において冷凍機油の濃縮・分離処理は「低圧受液器まわり」で行う。「蒸発器本体に油戻し配管を設ける」との記述は誤り。"}, {"id": 2045, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管や弁", "question": "圧縮機と凝縮器が同じ高さに設置されている場合、圧縮機から凝縮器への吐出しガス配管は、圧縮機からいったん立ち上がり管を設けて、凝縮器へ上り勾配で配管する。これは停止中に吐出しガス配管内の油が圧縮機へ戻りやすくするためである。", "answer": "×", "law": "吐出しガス配管は停止中の油や凝縮液が圧縮機に逆流するのを防ぐため、立ち上げ後に凝縮器側へ「下がり勾配」で配管する。「上り勾配で配管し戻りやすくする」は誤り。", "explanation": "吐出しガス配管は停止中の油や凝縮液が圧縮機に逆流するのを防ぐため、立ち上げ後に凝縮器側へ「下がり勾配」で配管する。「上り勾配で配管し戻りやすくする」は誤り。"}, {"id": 2046, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管や弁", "question": "2台以上のフィンコイル乾式蒸発器が異なった高さに設置されている場合には、それぞれの蒸発器出口の吸込み蒸気配管はトラップを設けてから蒸発器の上部まで立ち上げる。その後、吸込み蒸気配管の主管への接続は、主管の上部から行う。", "answer": "○", "law": "高さの異なる蒸発器では他系統からの油や液の流入を防ぐためトラップを設けて蒸発器頂部まで立ち上げ、主管の上部から合流接続する。よって記述は正しい。", "explanation": "高さの異なる蒸発器では他系統からの油や液の流入を防ぐためトラップを設けて蒸発器頂部まで立ち上げ、主管の上部から合流接続する。よって記述は正しい。"}, {"id": 2047, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管や弁", "question": "銅管の接続に用いるろう付けは、はまり込み深さと隙間が重要であり、外径25mm未満の銅管であれば、ろうを流し込むためにゆったりとした隙間が必要で、管の外径と継手の内径との隙間は1mm程度である。", "answer": "×", "law": "銅管ろう付けの隙間は毛細管現象によりろうを行き渡らせるため0.05〜0.45mm程度が適正である。「1mm程度」は広すぎてろうが保持できず強度不足となるため誤り。", "explanation": "銅管ろう付けの隙間は毛細管現象によりろうを行き渡らせるため0.05〜0.45mm程度が適正である。「1mm程度」は広すぎてろうが保持できず強度不足となるため誤り。"}, {"id": 2048, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管や弁", "question": "サービスバルブは、バックシート (逆座) とサービスポートをもった止め弁であり、圧力計の取付け、気密試験のためのガス充てん、冷媒の補充などに用いられる。", "answer": "○", "law": "サービスバルブは全開時にバックシートが効いてサービスポートへの流路を遮断できる構造をもち、圧力測定や充填・回収作業に用いられる。よって記述は正しい。", "explanation": "サービスバルブは全開時にバックシートが効いてサービスポートへの流路を遮断できる構造をもち、圧力測定や充填・回収作業に用いられる。よって記述は正しい。"}, {"id": 2049, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "高圧遮断圧力スイッチは原則として手動復帰形とするが、毒性ガス以外の冷媒を用いた自動運転方式の冷凍装置では自動復帰形を用いてもよい。", "answer": "×", "law": "高圧遮断スイッチは原則手動復帰形である。自動復帰形が認められるのは「可燃性・毒性以外の冷媒で、法定冷凍能力10トン未満のユニット型かつ自動運転方式」等の厳しい限定条件がある。「毒性ガス以外ならよい」は誤り。", "explanation": "高圧遮断スイッチは原則手動復帰形である。自動復帰形が認められるのは「可燃性・毒性以外の冷媒で、法定冷凍能力10トン未満のユニット型かつ自動運転方式」等の厳しい限定条件がある。「毒性ガス以外ならよい」は誤り。"}, {"id": 2050, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "冷凍装置に用いられる安全弁の必要最小口径は、圧縮機用では冷媒ガスの種類と圧縮機のピストン押しのけ量など、圧力容器用では冷媒ガスの種類と圧力容器の外径、全長などによりそれぞれ決定する。", "answer": "○", "law": "安全弁の最小口径計算式において、圧縮機用はピストン押しのけ量V1、圧力容器用は容器外径Dと全長L、および各冷媒定数により決定される。よって記述は正しい。", "explanation": "安全弁の最小口径計算式において、圧縮機用はピストン押しのけ量V1、圧力容器用は容器外径Dと全長L、および各冷媒定数により決定される。よって記述は正しい。"}, {"id": 2051, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "圧力容器に取り付ける溶栓の口径は取り付けるべき安全弁の口径の1/2以上、破裂板の口径は取り付けるべき安全弁の口径と同一であり、どちらも圧力容器の温度により作動する。", "answer": "×", "law": "溶栓は可融合金が溶ける「温度」で作動するが、破裂板は薄板が破れる「圧力」で作動する。「どちらも温度により作動する」との記述は誤り。", "explanation": "溶栓は可融合金が溶ける「温度」で作動するが、破裂板は薄板が破れる「圧力」で作動する。「どちらも温度により作動する」との記述は誤り。"}, {"id": 2052, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "液封事故を起こしやすい二段圧縮冷凍装置の過冷却液管や冷媒液強制循環式冷凍装置の低圧受液器には、安全弁または溶栓を設けなければならない。", "answer": "×", "law": "液封事故防止のための逃がし装置には安全弁、破裂板、または圧力逃がし装置を設置する。温度作動である「溶栓」は液封圧力対策には適さず用いられない（誤り）。", "explanation": "液封事故防止のための逃がし装置には安全弁、破裂板、または圧力逃がし装置を設置する。温度作動である「溶栓」は液封圧力対策には適さず用いられない（誤り）。"}, {"id": 2053, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験", "question": "耐圧試験と気密試験を実施した圧力は保安上重要な事項であり、被試験品本体の銘板や刻印に絶対圧力で表示しなければならない。耐圧試験は実際の使用状態での耐圧性能が満足な状態にあることを確認し、気密試験は組み立て品および配管が完了した設備において気密を確認するために行う。", "answer": "×", "law": "耐圧試験および気密試験の圧力表示は「ゲージ圧力」で行う。「絶対圧力で表示しなければならない」との記述は誤り。", "explanation": "耐圧試験および気密試験の圧力表示は「ゲージ圧力」で行う。「絶対圧力で表示しなければならない」との記述は誤り。"}, {"id": 2054, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験", "question": "耐圧試験を液体で行う場合には、被試験品に液体を満たし、空気を完全に排除した後、圧力を耐圧試験圧力まで上げて、その試験圧力を1分間以上保っておく。その後、圧力を耐圧試験圧力の8/10まで降下させ、異常がないことを確認する。", "answer": "○", "law": "水圧試験手順として、空気を排除して耐圧試験圧力まで加圧し1分間以上保持後、耐圧試験圧力の0.8倍まで減圧して溶接部等の漏れや変形を検査する。よって記述は正しい。", "explanation": "水圧試験手順として、空気を排除して耐圧試験圧力まで加圧し1分間以上保持後、耐圧試験圧力の0.8倍まで減圧して溶接部等の漏れや変形を検査する。よって記述は正しい。"}, {"id": 2055, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験", "question": "冷媒設備の配管を除く構成機器の個々の組み立て品について行う気密試験は、耐圧強度が確認された機器について、漏れの確認が容易にできるようにガス圧試験で行う。試験に使用するガスは空気または不燃性、非毒性ガスを用いる。", "answer": "○", "law": "機器単体の気密試験は耐圧試験合格後に気体（空気、窒素等の不燃性・非毒性ガス）を用いて実施する。酸素等の危険ガスは厳禁である。よって記述は正しい。", "explanation": "機器単体の気密試験は耐圧試験合格後に気体（空気、窒素等の不燃性・非毒性ガス）を用いて実施する。酸素等の危険ガスは厳禁である。よって記述は正しい。"}, {"id": 2056, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験", "question": "真空試験において装置内に水分が存在すると、真空ポンプを止めた際に圧力が上昇してしまうため、十分に時間をかけて冷凍装置内部の水分を排出させる必要がある。微少な漏れの漏れ箇所を特定するためには、気密試験より真空放置試験が適している。", "answer": "×", "law": "真空放置試験は系全体の微小漏れの有無を判定できるが「漏れ箇所の特定はできない」。漏れ箇所の特定には発泡液や検知器を用いる気密加圧試験が適している（誤り）。", "explanation": "真空放置試験は系全体の微小漏れの有無を判定できるが「漏れ箇所の特定はできない」。漏れ箇所の特定には発泡液や検知器を用いる気密加圧試験が適している（誤り）。"}, {"id": 2057, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "イ", "theme": "据付けおよび試運転", "question": "凍上は、1階の冷蔵室床下の土壌が氷結して体積が膨張し、床面が盛り上がる現象である。床下の構造や土壌の性質は凍上の発生に大きく影響するが、床の防熱材を十分に厚くしても凍上防止策にならない。", "answer": "○", "law": "防熱材を厚くしても長期連続運転により地中温度はやがて氷点下に達するため凍上防止策にはならず、床下通気管や床下ヒータ等の積極的対策が必要である。よって記述は正しい。", "explanation": "防熱材を厚くしても長期連続運転により地中温度はやがて氷点下に達するため凍上防止策にはならず、床下通気管や床下ヒータ等の積極的対策が必要である。よって記述は正しい。"}, {"id": 2058, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ロ", "theme": "据付けおよび試運転", "question": "屋外に設置する空冷凝縮器と蒸発式凝縮器は重く、重心も比較的高い。このため、地震によって据付け位置がずれることがあるので注意が必要である。したがって、設置する基礎の鉄筋を強固に組み合わせ、床盤の鉄筋に固く結び付け、また凝縮器本体と基礎も十分に固定する必要がある。", "answer": "○", "law": "空冷・蒸発式凝縮器は高所に設置され重量・重心も高いため、地震時に基礎ずれや配管断裂を起こさないよう建物躯体・基礎と強固に緊結固定する必要がある。よって記述は正しい。", "explanation": "空冷・蒸発式凝縮器は高所に設置され重量・重心も高いため、地震時に基礎ずれや配管断裂を起こさないよう建物躯体・基礎と強固に緊結固定する必要がある。よって記述は正しい。"}, {"id": 2059, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ハ", "theme": "据付けおよび試運転", "question": "冷凍装置の試運転を行う場合、試運転開始前に電力系統、制御系統、冷却水系統、冷媒系統の冷媒量、冷凍機油量、弁の開閉状態などを点検することが必要である。これらの点検の後、装置の始動試験を行い、異常がなければ数時間運転を継続し、運転データを採取する。", "answer": "○", "law": "試運転前には各ユーティリティ、電気制御、冷媒・油量、弁開閉を点検し、始動試験後に数時間の慣らし運転を行いながら運転パラメータを計測・採取する。よって記述は正しい。", "explanation": "試運転前には各ユーティリティ、電気制御、冷媒・油量、弁開閉を点検し、始動試験後に数時間の慣らし運転を行いながら運転パラメータを計測・採取する。よって記述は正しい。"}, {"id": 2060, "subject": "保安管理", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ニ", "theme": "据付けおよび試運転", "question": "アンモニアは毒性があり、多量に浴びると死に至る危険がある。一方、燃焼性はなく、アンモニアを冷媒とする冷凍装置において、電気設備に対して防爆性能を必要としない。", "answer": "×", "law": "アンモニアは爆燃範囲15〜28%を有する「可燃性ガス」である（冷凍則上、電気設備の防爆構造が義務除外されているだけで燃焼性がないわけではない）。「燃焼性はなく」との記述は誤り。", "explanation": "アンモニアは爆燃範囲15〜28%を有する「可燃性ガス」である（冷凍則上、電気設備の防爆構造が義務除外されているだけで燃焼性がないわけではない）。「燃焼性はなく」との記述は誤り。"}, {"id": 2061, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "フルオロカーボン圧縮機は、電動機巻線に適切な絶縁材料を用いることで電動機を冷媒蒸気の充満したケーシング内に収めることが可能である。アンモニア圧縮機では、冷媒が電動機の銅巻線を侵すので、一般的な銅巻線の電動機を使用する場合は、開放形が使用されている。", "answer": "○", "law": "フルオロカーボンは絶縁性が高いため密閉形が可能だが、アンモニアは銅および銅合金を腐食するため、一般的な銅巻線電動機を冷媒中に配置できず開放形が用いられる。よって記述は正しい。", "explanation": "フルオロカーボンは絶縁性が高いため密閉形が可能だが、アンモニアは銅および銅合金を腐食するため、一般的な銅巻線電動機を冷媒中に配置できず開放形が用いられる。よって記述は正しい。"}, {"id": 2062, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "スクリュー圧縮機は、スライド弁によってある限定された範囲内で容量を無段階で制御できる。このスライド弁により吸込み蒸気の閉込み量を減らした低容量で長時間運転すると、成績係数は低下する。", "answer": "○", "law": "ツインスクリュー圧縮機はスライド弁により容量を無段階制御できるが、低容量域では実効圧縮比が低下し断熱効率・成績係数（COP）が低下する。よって記述は正しい。", "explanation": "ツインスクリュー圧縮機はスライド弁により容量を無段階制御できるが、低容量域では実効圧縮比が低下し断熱効率・成績係数（COP）が低下する。よって記述は正しい。"}, {"id": 2063, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は吸込み弁と吐出し弁を必要としないが、停止時に高低圧の差圧で圧縮機の旋回スクロールが逆回転するので、逆転防止機能が必要である。また、トルク変動が非常に小さいので、振動や騒音が小さく体積効率、断熱効率および機械効率がいずれも高く、高速回転に適している遠心圧縮機の一種である。", "answer": "×", "law": "スクロール圧縮機は容積空間を変化させて圧縮する「容積式圧縮機」の一種である。「遠心圧縮機の一種である」との記述は誤り。", "explanation": "スクロール圧縮機は容積空間を変化させて圧縮する「容積式圧縮機」の一種である。「遠心圧縮機の一種である」との記述は誤り。"}, {"id": 2064, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機の容量制御を吸込み側にあるサクションベーンによって行う場合、低流量になるとサージング現象が発生し、振動や騒音を発生する。また、低温用では圧力比が大きくなるので、羽根車の段数は多段式となる。", "answer": "○", "law": "ターボ（遠心）圧縮機は低流量域でサージングを起こして激しい振動・騒音を発生する。また低温用で大きな圧力比を要する場合は多段羽根車を採用する。よって記述は正しい。", "explanation": "ターボ（遠心）圧縮機は低流量域でサージングを起こして激しい振動・騒音を発生する。また低温用で大きな圧力比を要する場合は多段羽根車を採用する。よって記述は正しい。"}, {"id": 2065, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "多気筒圧縮機には、一般にアンローダと呼ばれる容量制御装置が取り付けてあり、吸込み弁を閉めきって、作動気筒数を減らすことにより、25%から100%の範囲で容量を段階的に変えられるようになっている。", "answer": "×", "law": "アンローダ機構は吸込み弁を「開放（押し上げ）」して圧縮仕事をさせなくする機構である。「吸込み弁を閉めきって」との記述は誤り。", "explanation": "アンローダ機構は吸込み弁を「開放（押し上げ）」して圧縮仕事をさせなくする機構である。「吸込み弁を閉めきって」との記述は誤り。"}, {"id": 2066, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "インバータを用いて圧縮機の回転速度を調整する容量制御方法では、圧縮機の回転速度と容量はつねに比例する。回転速度の範囲を大きく増減させた場合にも、体積効率は回転速度に依存せずつねに一定である。", "answer": "×", "law": "回転速度を大きく変えると、弁の追従遅れやガス漏洩、潤滑状態の変化等により「体積効率は低下」し、一定ではない。「つねに一定である」との記述は誤り。", "explanation": "回転速度を大きく変えると、弁の追従遅れやガス漏洩、潤滑状態の変化等により「体積効率は低下」し、一定ではない。「つねに一定である」との記述は誤り。"}, {"id": 2067, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "圧縮機の吸込み蒸気配管に蒸発圧力調整弁を取り付けることによって、この弁の作動時には圧縮機の吸込み圧力が所定の圧力より低下し、圧縮機の容量制御ができる。この蒸発圧力調整弁は、温度自動膨張弁の感温筒と均圧管取付け位置よりも下流側の圧縮機吸込み蒸気配管に取り付けなければならない。", "answer": "○", "law": "蒸発圧力調整弁（EPR）は蒸発圧力を一定以上に保ちつつ下流の圧縮機吸込み圧力を下げる。感温筒や均圧管よりも下流側（圧縮機側）に取り付ける必要がある。よって記述は正しい。", "explanation": "蒸発圧力調整弁（EPR）は蒸発圧力を一定以上に保ちつつ下流の圧縮機吸込み圧力を下げる。感温筒や均圧管よりも下流側（圧縮機側）に取り付ける必要がある。よって記述は正しい。"}, {"id": 2068, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパスによる容量制御を行うときに、ホットガスバイパス量の割合が多くなると、凝縮器の熱負荷がほとんど電動機の入力だけとなり、凝縮圧力が低くなりすぎる。その場合、ホットガス圧力が低くなりすぎて必要量のホットガスが吸込み側にバイパスできなくなる。", "answer": "○", "law": "過大なホットガスバイパス時は蒸発器での吸熱がなくなり凝縮器熱負荷が電動機入力のみとなって凝縮圧力が異常低下し、バイパス差圧不足に陥る。よって記述は正しい。", "explanation": "過大なホットガスバイパス時は蒸発器での吸熱がなくなり凝縮器熱負荷が電動機入力のみとなって凝縮圧力が異常低下し、バイパス差圧不足に陥る。よって記述は正しい。"}, {"id": 2069, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の吸込み弁に弁板の割れや変形が生じると、ピストンの圧縮行程でシリンダ内の高圧ガスの一部が吸込み側に逆流し、圧縮機の吐出しガス量が減少するので体積効率の低下を招くが、吐出しガス温度はあまり大きく上昇することはない。", "answer": "○", "law": "吸込み弁の漏れはガスの再膨張・逆流により体積効率を著しく低下させるが、吐出し弁漏れのように高温吐出ガスが繰り返しシリンダ内に戻るわけではないため、吐出しガス温度はあまり大きく上昇しない。よって記述は正しい。", "explanation": "吸込み弁の漏れはガスの再膨張・逆流により体積効率を著しく低下させるが、吐出し弁漏れのように高温吐出ガスが繰り返しシリンダ内に戻るわけではないため、吐出しガス温度はあまり大きく上昇しない。よって記述は正しい。"}, {"id": 2070, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "中形や大形の往復圧縮機では、油ポンプによる強制給油潤滑式が採用されており、油圧が高くなりすぎると油圧保護圧力スイッチが作動して、圧縮機が停止する。", "answer": "×", "law": "油圧保護圧力スイッチ（OPS）は、給油圧力が「低くなりすぎる（油圧不足）」と軸受焼付きを防ぐために作動・停止する。「油圧が高くなりすぎると作動する」は誤り。", "explanation": "油圧保護圧力スイッチ（OPS）は、給油圧力が「低くなりすぎる（油圧不足）」と軸受焼付きを防ぐために作動・停止する。「油圧が高くなりすぎると作動する」は誤り。"}, {"id": 2071, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "スクリュー圧縮機の給油圧力は、油ポンプが付いている場合には吐出しガス圧力よりも0.2 MPa から 0.3MPa 程度高くする。また、スクリュー圧縮機の吐出しガス温度は、多気筒圧縮機のそれよりも低く、冷媒の種類にもよるが通常120℃程度である。吐出しガス温度がこれより高い場合には、油量不足、油温が高い、吸込み蒸気の過熱などが考えられる。", "answer": "×", "law": "スクリュー圧縮機は多量の潤滑油が噴射されて冷却されるため、吐出しガス温度は通常「90℃以下」と低い。「通常120℃程度」との記述は誤り。", "explanation": "スクリュー圧縮機は多量の潤滑油が噴射されて冷却されるため、吐出しガス温度は通常「90℃以下」と低い。「通常120℃程度」との記述は誤り。"}, {"id": 2072, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "冷媒を過充てんして運転すると、膨張弁手前のサイトグラスに気泡が発生し、高圧部圧力が高くなる。そのため、保安の点からも冷媒の過充てんは行ってはならない。", "answer": "×", "law": "サイトグラスに気泡が発生するのは「冷媒不足（フラッシュガス発生）」のときである。過充てん時は満液状態となり気泡は発生しない。「過充てんすると気泡が発生」は誤り。", "explanation": "サイトグラスに気泡が発生するのは「冷媒不足（フラッシュガス発生）」のときである。過充てん時は満液状態となり気泡は発生しない。「過充てんすると気泡が発生」は誤り。"}, {"id": 2073, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "水あかや油膜が水冷横形シェルアンドチューブ凝縮器の冷却管に付着すると、それらの熱伝導抵抗によって熱通過率の値が小さくなる。そのため圧縮機の消費電力は増加し、冷凍能力は減少する。冷却管が裸管の場合よりもローフィンチューブのほうが、水あかが厚く付着することによる熱通過率の低下割合が大きい。", "answer": "○", "law": "ローフィンチューブは管外の伝熱面積を拡大している分、管内熱抵抗（水あか）が熱通過率全体に及ぼす影響が裸管よりも敏感で低下割合が大きい。よって記述は正しい。", "explanation": "ローフィンチューブは管外の伝熱面積を拡大している分、管内熱抵抗（水あか）が熱通過率全体に及ぼす影響が裸管よりも敏感で低下割合が大きい。よって記述は正しい。"}, {"id": 2074, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "凝縮器の外表面基準の伝熱面積は一般的に1冷却トン (16330 kJ/h)当たり、蒸発式凝縮器が0.9m² から 1.2 m²、二重管水冷凝縮器が2.0m²から2.4 m²、強制通風式の空冷凝縮器が10m²から15m²である。", "answer": "×", "law": "1RT当たりの伝熱面積は、二重管水冷式が0.9〜1.2 m²、蒸発式凝縮器が2.0〜2.4 m²であり、数値の対応が逆であるため誤り。", "explanation": "1RT当たりの伝熱面積は、二重管水冷式が0.9〜1.2 m²、蒸発式凝縮器が2.0〜2.4 m²であり、数値の対応が逆であるため誤り。"}, {"id": 2075, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器の凝縮圧力は、一般に凝縮器入口空気温度よりも15Kから20K位高い温度に相当する飽和圧力とする。冬季に外気温度が低下して膨張弁容量が不足するときの対策として、空冷凝縮器の送風機の風量を増加させる方法、小容量の冷凍装置では凝縮圧力調整弁により凝縮圧力が高くならないように制御する方法などがある。", "answer": "×", "law": "冬季の凝縮圧力過低下を防ぐためには、送風機を「停止・風量減少」させるか、凝縮圧力調整弁により「凝縮圧力が低くならないように」制御する。「風量を増加させる」「高くならないように制御」は誤り。", "explanation": "冬季の凝縮圧力過低下を防ぐためには、送風機を「停止・風量減少」させるか、凝縮圧力調整弁により「凝縮圧力が低くならないように」制御する。「風量を増加させる」「高くならないように制御」は誤り。"}, {"id": 2076, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "凝縮器内の冷媒側に空気などの不凝縮ガスが混入すると、冷却管の冷媒側の熱伝達率が小さくなり、凝縮温度が高くなる。そのため、圧縮機の吐出しガスの圧力と温度が高くなり、圧縮機用電動機の消費電力が増加し、冷凍能力と成績係数が低下する。", "answer": "○", "law": "不凝縮ガスが伝熱面近傍に滞留層を作ると冷媒の凝縮を妨げて熱伝達率が激減し、全圧上昇と相まって吐出圧力・温度上昇、動力増大、成績係数低下を招く。よって記述は正しい。", "explanation": "不凝縮ガスが伝熱面近傍に滞留層を作ると冷媒の凝縮を妨げて熱伝達率が激減し、全圧上昇と相まって吐出圧力・温度上昇、動力増大、成績係数低下を招く。よって記述は正しい。"}, {"id": 2077, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "圧縮機が液圧縮していると判断したときには、急を要するので、吸込み止め弁を絞り、液戻りが激しいときには吸込み止め弁をいったん閉じてもよい。そして、蒸発器への液供給量を減らすために膨張弁や膨張弁の上流側止め弁などの調節または閉止などを行い、液圧縮を回避して、運転状況を見ながら吸込み止め弁を徐々に開き、正常な運転状態に近づけていく。", "answer": "○", "law": "液圧縮発生時の緊急処置として、吸込み弁の絞り・一時閉止、膨張弁系統の閉止・調節で液流入を絶ち、乾き状態を確認しながら徐々に弁を開放していく。よって記述は正しい。", "explanation": "液圧縮発生時の緊急処置として、吸込み弁の絞り・一時閉止、膨張弁系統の閉止・調節で液流入を絶ち、乾き状態を確認しながら徐々に弁を開放していく。よって記述は正しい。"}, {"id": 2078, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "乾式シェルアンドチューブ蒸発器と満液式シェルアンドチューブ蒸発器では、蒸発温度が低下して、冷却用の水やブラインが凍結した場合、冷却管の破損の危険性は乾式シェルアンドチューブ蒸発器のほうが大きい。", "answer": "×", "law": "冷却管内に水が流れる満液式のほうが管内凍結による破裂破壊リスクが極めて高い。乾式は管外（胴内）に水があるため膨張の逃げがあり危険性は小さい。「乾式のほうが大きい」は誤り。", "explanation": "冷却管内に水が流れる満液式のほうが管内凍結による破裂破壊リスクが極めて高い。乾式は管外（胴内）に水があるため膨張の逃げがあり危険性は小さい。「乾式のほうが大きい」は誤り。"}, {"id": 2079, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "フィンコイル乾式蒸発器に霜が厚く成長すると、空気の流れ抵抗の増加や蒸発器熱通過率の低下にともない蒸発器への冷媒供給量が減少し、低圧側圧力が正常値よりも低下する。このため、冷却能力は大きく低下する。", "answer": "○", "law": "着霜が厚くなると通風抵抗増大と熱抵抗増大により熱交換が行われなくなり、蒸発圧力の低下、冷媒循環量の減少、冷却能力の大幅な低下を招く。よって記述は正しい。", "explanation": "着霜が厚くなると通風抵抗増大と熱抵抗増大により熱交換が行われなくなり、蒸発圧力の低下、冷媒循環量の減少、冷却能力の大幅な低下を招く。よって記述は正しい。"}, {"id": 2080, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "低温装置における温度自動膨張弁の感温筒は、霜の影響を受けないように吸湿性のないもので感温筒取付け部とともに防熱する。また、正しい冷媒液温度を検出できるように冷却コイルや吸込み蒸発配管のヘッダーなどの液のたまりやすい所に取り付ける。", "answer": "×", "law": "感温筒は冷媒「蒸気」の過熱度を検出するものであるため、液だまり部に設置すると液温（飽和温度）を感知して弁が過大に閉止してしまう。「液のたまりやすい所に取り付ける」は誤り。", "explanation": "感温筒は冷媒「蒸気」の過熱度を検出するものであるため、液だまり部に設置すると液温（飽和温度）を感知して弁が過大に閉止してしまう。「液のたまりやすい所に取り付ける」は誤り。"}, {"id": 2081, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器など", "question": "フィンコイル乾式蒸発器では、蒸発器の冷媒出口側から入口側に向かって冷却しようとする空気を流す向流方式と、蒸発器の冷媒入口側から出口側に向かって空気を流す並流方式がある。一般的に並流方式の冷媒と空気との平均温度差は、向流方式よりも大きくなる。", "answer": "×", "law": "並流方式（平行流）の平均温度差は向流方式（対向流）よりも「小さく」なるため伝熱性能上不利である。「並流方式のほうが大きくなる」との記述は誤り。", "explanation": "並流方式（平行流）の平均温度差は向流方式（対向流）よりも「小さく」なるため伝熱性能上不利である。「並流方式のほうが大きくなる」との記述は誤り。"}, {"id": 2082, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器など", "question": "空気冷却用のフィンコイル乾式蒸発器は、冷媒と空気との平均温度差が大きくなれば、蒸発器能力は増大する。蒸発器能力が増して熱流束が大きくなると、冷媒側熱伝達率は大きくなるが、空気側の熱伝達抵抗が大きいために熱通過率の値はあまり大きくならない。", "answer": "○", "law": "フィンコイル熱交換器では空気側の熱抵抗が全体の大部分を占めるため、冷媒側の熱伝達率が向上しても熱通過率全体の値はそれほど大きく向上しない。よって記述は正しい。", "explanation": "フィンコイル熱交換器では空気側の熱抵抗が全体の大部分を占めるため、冷媒側の熱伝達率が向上しても熱通過率全体の値はそれほど大きく向上しない。よって記述は正しい。"}, {"id": 2083, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器など", "question": "ローフィンチューブを用いる水冷凝縮器や満液式水冷却器では、汚れ係数の増大とともに冷却管の外表面積基準の熱通過率は減少する。また、汚れ係数の増大とともに熱通過率の減少割合は大きくなる。", "answer": "×", "law": "汚れ係数が小さい初期の段階で熱通過率は急激に低下し、汚れ係数がさらに大きくなると熱通過率の減少割合は「小さく（緩やかに）なる」。「減少割合は大きくなる」は誤り。", "explanation": "汚れ係数が小さい初期の段階で熱通過率は急激に低下し、汚れ係数がさらに大きくなると熱通過率の減少割合は「小さく（緩やかに）なる」。「減少割合は大きくなる」は誤り。"}, {"id": 2084, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器など", "question": "フルオロカーボン冷媒液は油を溶解すると粘度が高くなる。そのため、過度に油を溶解すると伝熱を阻害することになる。一般に、油の溶解量が3%以下であれば特に支障がない。", "answer": "○", "law": "冷媒中に冷凍機油が溶け込むと粘度が上昇し蒸発熱伝達を悪化させるが、一般的な相溶性冷媒において油濃度3%程度以下であれば伝熱・流動への実害はほとんどない。よって記述は正しい。", "explanation": "冷媒中に冷凍機油が溶け込むと粘度が上昇し蒸発熱伝達を悪化させるが、一般的な相溶性冷媒において油濃度3%程度以下であれば伝熱・流動への実害はほとんどない。よって記述は正しい。"}, {"id": 2085, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "イ", "theme": "自動膨張弁", "question": "感温筒のクロスチャージ方式は、冷凍装置の冷媒に対して温度と圧力の特性が異なる媒体を、感温筒にチャージしたものである。この方式の特徴は、液チャージ方式などの使用する蒸発温度域によって過熱度が変わる欠点を除いたことにより、蒸発温度が高温でも低温でも、ほぼ同じ過熱度設定値が保持できることである。", "answer": "○", "law": "クロスチャージ（異種媒体チャージ）は蒸発温度による圧力変化勾配を補正し、広い蒸発温度範囲にわたって過熱度設定値がほぼ一定に保たれる特徴がある。よって記述は正しい。", "explanation": "クロスチャージ（異種媒体チャージ）は蒸発温度による圧力変化勾配を補正し、広い蒸発温度範囲にわたって過熱度設定値がほぼ一定に保たれる特徴がある。よって記述は正しい。"}, {"id": 2086, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "ロ", "theme": "自動膨張弁", "question": "内部均圧形の温度自動膨張弁を用いると、過熱度に及ぼす蒸発器内冷媒の圧力降下の影響が大きく、圧力降下分だけ過熱度が小さくなる。この圧力降下の影響を除くには、外部均圧形の温度自動膨張弁を用いる。", "answer": "×", "law": "蒸発器内の圧力降下があると、弁出口圧力（内部均圧部）が蒸発器出口圧力より高くなるため、弁を閉じる力として作用し「見かけの過熱度が大きく」なってしまう。「過熱度が小さくなる」は誤り。", "explanation": "蒸発器内の圧力降下があると、弁出口圧力（内部均圧部）が蒸発器出口圧力より高くなるため、弁を閉じる力として作用し「見かけの過熱度が大きく」なってしまう。「過熱度が小さくなる」は誤り。"}, {"id": 2087, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "ハ", "theme": "自動膨張弁", "question": "感温筒は、蒸発器出口の配管部に金属バンドで密着させて取り付ける。また、感温筒は、冷却器の風や周囲の温度の影響などを受けないようにする。感温筒を垂直吸込み管に取り付けるときは、感温筒のキャピラリーチューブを上側になるように設置する。", "answer": "○", "law": "感温筒を垂直吸込み管に取り付ける際は、感温筒内の液媒体がキャピラリーチューブ側に流出するのを防ぐためキャピラリーチューブを上側に向ける。よって記述は正しい。", "explanation": "感温筒を垂直吸込み管に取り付ける際は、感温筒内の液媒体がキャピラリーチューブ側に流出するのを防ぐためキャピラリーチューブを上側に向ける。よって記述は正しい。"}, {"id": 2088, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "ニ", "theme": "自動膨張弁", "question": "温度自動膨張弁のダイヤフラム上面には、感温筒のチャージ媒体の圧力が作用している。また、ダイアフラム下面には、蒸発器の出口(内部均圧形)、または、蒸発器の入口(外部均圧形)の冷媒圧力とばね圧力が作用している。これらのダイアフラム上下面の圧力の釣り合いによって膨張弁の弁開度が決まる。", "answer": "×", "law": "ダイアフラム下面に作用するのは、内部均圧形が「蒸発器の入口（弁出口）」、外部均圧形が「蒸発器の出口」の圧力である。記述が逆になっているため誤り。", "explanation": "ダイアフラム下面に作用するのは、内部均圧形が「蒸発器の入口（弁出口）」、外部均圧形が「蒸発器の出口」の圧力である。記述が逆になっているため誤り。"}, {"id": 2089, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "イ", "theme": "冷凍装置の調整弁", "question": "蒸発圧力調整弁はEPRとも呼ばれ、温度自動膨張弁では、蒸発圧力を一定値以下にならないように制御することはできないが、蒸発圧力調整弁を使用すれば、蒸発圧力を一定値以下にならないように制御できる。", "answer": "○", "law": "蒸発圧力調整弁（EPR）は蒸発器出口の圧力を検出し、設定圧力以下に低下しないよう絞り制御を行って被冷却物の過冷却や凍結を防ぐ。よって記述は正しい。", "explanation": "蒸発圧力調整弁（EPR）は蒸発器出口の圧力を検出し、設定圧力以下に低下しないよう絞り制御を行って被冷却物の過冷却や凍結を防ぐ。よって記述は正しい。"}, {"id": 2090, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍装置の調整弁", "question": "吸入圧力調整弁はSPRとも呼ばれ、圧縮機用電動機の過負荷の問題に対処するために、圧縮機吸込み圧力を一定値以上に上昇させないように制御する圧力調整弁であり、圧縮機吸込み蒸気配管に取り付けられる。", "answer": "○", "law": "吸入圧力調整弁（SPR）は圧縮機吸込み側に設置され、起動時やデフロスト復帰時の過大な吸込み圧力上昇を抑えて電動機の過負荷トリップを防止する。よって記述は正しい。", "explanation": "吸入圧力調整弁（SPR）は圧縮機吸込み側に設置され、起動時やデフロスト復帰時の過大な吸込み圧力上昇を抑えて電動機の過負荷トリップを防止する。よって記述は正しい。"}, {"id": 2091, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍装置の調整弁", "question": "凝縮圧力調整弁による凝縮圧力の制御は、凝縮器内への冷媒液の滞留と冷却水量の調整を同時に行う。したがって、装置の冷媒充てん量に余裕が必要であるので、受液器が必要になる。", "answer": "×", "law": "凝縮圧力調整弁は空冷凝縮器出口に液を滞留させて伝熱面積を狭める弁であり、「冷却水量の調整」を行うものではない（水量は冷却水調整弁の役割）。誤り。", "explanation": "凝縮圧力調整弁は空冷凝縮器出口に液を滞留させて伝熱面積を狭める弁であり、「冷却水量の調整」を行うものではない（水量は冷却水調整弁の役割）。誤り。"}, {"id": 2092, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "ニ", "theme": "冷凍装置の調整弁", "question": "冷却水調整弁は、制水弁または節水弁とも呼ばれており、年間を通じて水温の変化、装置の凝縮負荷の変化、冷却管の水あかの付着などに対して、凝縮圧力が適正な状態を保つように冷却水量を調節する。", "answer": "○", "law": "制水弁（冷却水調整弁）は凝縮圧力（または温度）に応じて給水弁開度を自動調節し、凝縮圧力を安定化させるとともに冷却水の使用量を節減する。よって記述は正しい。", "explanation": "制水弁（冷却水調整弁）は凝縮圧力（または温度）に応じて給水弁開度を自動調節し、凝縮圧力を安定化させるとともに冷却水の使用量を節減する。よって記述は正しい。"}, {"id": 2093, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "イ", "theme": "制御機器", "question": "四方切換弁は、冷媒の流れを切り換えて冷凍サイクルの二つの熱交換器の役割を逆にする働きをもつ。この弁は、切換え時に高圧側から低圧側への冷媒の漏れが短時間で起こるので、差圧式の四方切換弁では高低圧間に圧力差が十分にないと完全な切換えができない。", "answer": "○", "law": "ヒートポンプ用四方弁は主弁のピストンを高低圧差圧で駆動するため、差圧が不十分な運転条件では中途半端に止まり完全な切換えができない。よって記述は正しい。", "explanation": "ヒートポンプ用四方弁は主弁のピストンを高低圧差圧で駆動するため、差圧が不十分な運転条件では中途半端に止まり完全な切換えができない。よって記述は正しい。"}, {"id": 2094, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器", "question": "電子式サーモスタットは、温度変化を電気信号に変換しているので、電子回路にPI またはPIDの補償をした制御を行うことができる。", "answer": "○", "law": "サーミスタや白金測温抵抗体等の信号をデジタル処理する電子式サーモスタットは、比例・積分・微分（PID）制御により高精度な温度制御が可能である。よって記述は正しい。", "explanation": "サーミスタや白金測温抵抗体等の信号をデジタル処理する電子式サーモスタットは、比例・積分・微分（PID）制御により高精度な温度制御が可能である。よって記述は正しい。"}, {"id": 2095, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器", "question": "多気筒圧縮機などの大形圧縮機では、油ポンプを内蔵または外部に装着している。運転中に定められた油圧が保持できなくなると、圧縮機の軸受などが焼付き事故を起こすことがある。このような事故を防止するために、圧縮機を始動してから、または運転中に給油圧力が定められた圧力以下になった場合には、圧力が低下した瞬間に油圧保護圧力スイッチの電気接点を開にして圧縮機の電動機を停止させる。", "answer": "×", "law": "起動時の一時的油圧立ち上がり待ちや運転中の瞬間的油圧変動での不要トリップを防ぐため、約90秒程度の「遅延タイマ（ディレイ）」が内蔵されている。「低下した瞬間に開にする」は誤り。", "explanation": "起動時の一時的油圧立ち上がり待ちや運転中の瞬間的油圧変動での不要トリップを防ぐため、約90秒程度の「遅延タイマ（ディレイ）」が内蔵されている。「低下した瞬間に開にする」は誤り。"}, {"id": 2096, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器", "question": "低圧圧力スイッチを用い、圧縮機の運転と停止を制御する場合、低圧圧力スイッチの「入り」「切り」差をあまり小さく設定すると、圧縮機が短い間隔で運転と停止を繰り返すことになり、圧縮機用電動機焼損の原因となることがある。", "answer": "○", "law": "ディファレンシャル（入・切差圧）が狭すぎると短時間での頻繁なインチング起動・停止を繰り返し、始動大電流により電動機巻線焼損を招く恐れがある。よって記述は正しい。", "explanation": "ディファレンシャル（入・切差圧）が狭すぎると短時間での頻繁なインチング起動・停止を繰り返し、始動大電流により電動機巻線焼損を招く恐れがある。よって記述は正しい。"}, {"id": 2097, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "鉱油を冷凍機油として使用するアンモニア冷凍装置では、冷凍機油が装置内の凝縮器や蒸発器に流入すると伝熱作用を阻害するので、圧縮機の吐出し側に油分離器を設ける必要がある。", "answer": "○", "law": "アンモニアと鉱油は不溶（非相溶）であり、凝縮器や蒸発器に持ち出されると管壁に油膜を作って伝熱を大きく阻害するため、吐出し側に油分離器を設ける。よって記述は正しい。", "explanation": "アンモニアと鉱油は不溶（非相溶）であり、凝縮器や蒸発器に持ち出されると管壁に油膜を作って伝熱を大きく阻害するため、吐出し側に油分離器を設ける。よって記述は正しい。"}, {"id": 2098, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器の容量は、修理時に装置内の冷媒充てん量の大部分を回収できる容量とし、回収された冷媒は、一般的に受液器の内容積の95%以内とし、少なくとも5%の冷媒蒸気空間を残さなくてはならない。", "answer": "×", "law": "受液器の冷媒回収限度は内容積の「80%以内」とし、温度上昇による液封破壊を防ぐため少なくとも「20%の気相空間」を残す必要がある。「95%以内、5%」は誤り。", "explanation": "受液器の冷媒回収限度は内容積の「80%以内」とし、温度上昇による液封破壊を防ぐため少なくとも「20%の気相空間」を残す必要がある。「95%以内、5%」は誤り。"}, {"id": 2099, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "バッフル式油分離器は、容器内に円筒状の金網が2重 3重に配置され、圧縮機からの吐出しガスがこの金網を通過する際に、金網によって油を分離する方式で、フルオロカーボン冷媒用は、フロート弁により油を自動的に圧縮機クランクケースに返油する。", "answer": "×", "law": "円筒状の金網を多重配置する方式は「金網式油分離器」である。バッフル式は衝突邪魔板（バッフル板）を用いる方式であるため誤り。", "explanation": "円筒状の金網を多重配置する方式は「金網式油分離器」である。バッフル式は衝突邪魔板（バッフル板）を用いる方式であるため誤り。"}, {"id": 2100, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "フルオロカーボン冷媒を使用する冷凍装置のフィルタドライヤ用乾燥剤としては、シリカゲル、活性アルミナ、ゼオライトなどがよく用いられる。これらの特徴として、水分を吸着しても化学変化しないこと、砕けにくいことが挙げられる。", "answer": "○", "law": "物理吸着剤であるモレキュラーシーブ（合成ゼオライト）、シリカゲル、活性アルミナは、水分を吸着しても潮解や化学反応を起こさず粉化しにくい優れた特性をもつ。よって記述は正しい。", "explanation": "物理吸着剤であるモレキュラーシーブ（合成ゼオライト）、シリカゲル、活性アルミナは、水分を吸着しても潮解や化学反応を起こさず粉化しにくい優れた特性をもつ。よって記述は正しい。"}, {"id": 2101, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "イ", "theme": "附属機器", "question": "フルオロカーボン冷凍装置に用いられる液ガス熱交換器は、凝縮器からの高温冷媒液と蒸発器からの低温冷媒蒸気との熱交換により、凝縮器からの冷媒液を過冷却して、液管内でのフラッシュガスの発生を防止するとともに、圧縮機吸込み蒸気を適度に過熱することにより、負荷変動などによる液戻りをある程度防止する。", "answer": "○", "law": "液ガス熱交換器は液冷媒の過冷却度を確保して配管立上がり等でのフラッシュガスを防ぎ、同時に吸込み蒸気を適度に過熱して液戻り（湿り運転）を防止する。よって記述は正しい。", "explanation": "液ガス熱交換器は液冷媒の過冷却度を確保して配管立上がり等でのフラッシュガスを防ぎ、同時に吸込み蒸気を適度に過熱して液戻り（湿り運転）を防止する。よって記述は正しい。"}, {"id": 2102, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器", "question": "大形のアンモニア冷凍装置で使用される不凝縮ガス分離器(ガスパージャ)では、不凝縮ガスがたまるとフロート弁が自動的に開き、不凝縮ガスが器外に排出される。この不凝縮ガス分離器では、冷凍装置の運転を停止せずに、アンモニアを排出することなく不凝縮ガスだけを排出できる。", "answer": "×", "law": "ガスパージャからの排出ガス中には飽和温度・圧力に応じたアンモニア蒸気が不可避的に同伴されるため、水槽等の除害設備を通して処理する必要がある。「アンモニアを排出することなく不凝縮ガスだけ排出できる」は誤り。", "explanation": "ガスパージャからの排出ガス中には飽和温度・圧力に応じたアンモニア蒸気が不可避的に同伴されるため、水槽等の除害設備を通して処理する必要がある。「アンモニアを排出することなく不凝縮ガスだけ排出できる」は誤り。"}, {"id": 2103, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器", "question": "フルオロカーボン冷凍装置の満液式蒸発器や低圧受液器に入り込んだ冷凍機油は冷媒液に溶解している。そこで、油の濃度の高い冷媒液を抜き出し、油回収器で油と冷媒蒸気に分離して、それぞれ別系統で吸込み蒸気配管を通して圧縮機に戻す方法がある。", "answer": "○", "law": "満液式蒸発器や低圧受液器に濃縮された油冷媒混合液を抜き出し、油回収器（オイルリクレーマ）で加熱気化させて冷媒蒸気と油に分離回収する手法が用いられる。よって記述は正しい。", "explanation": "満液式蒸発器や低圧受液器に濃縮された油冷媒混合液を抜き出し、油回収器（オイルリクレーマ）で加熱気化させて冷媒蒸気と油に分離回収する手法が用いられる。よって記述は正しい。"}, {"id": 2104, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器", "question": "液ポンプで冷媒を強制循環する冷媒液強制循環式蒸発器を使用した大形冷凍装置では、低圧受液器で気液分離を行っているが、一般的に圧縮機における吸込み蒸気の適正な過熱度を確保するために、液分離器を別に設ける必要がある。", "answer": "×", "law": "低圧受液器自体が大型の気液分離器（サクションアキュムレータ）としての機能を十分に備えているため、通常は別に液分離器を設ける必要はない。「別に設ける必要がある」は誤り。", "explanation": "低圧受液器自体が大型の気液分離器（サクションアキュムレータ）としての機能を十分に備えているため、通常は別に液分離器を設ける必要はない。「別に設ける必要がある」は誤り。"}, {"id": 2105, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管", "question": "配管用炭素鋼鋼管(SGP)は、毒性ガスの冷媒、フルオロカーボン冷媒の設計圧力が1MPaを超える耐圧部分、温度が100℃を超える耐圧部分および温度が-25℃より低温の部分に使用できない。", "answer": "○", "law": "SGP（白管・黒管）は耐圧・耐熱・低温衝撃性に限界があるため、毒性ガス、設計圧力1 MPa超、温度100℃超（吐出管等）、または-25℃未満の低温配管には使用が禁止されている。よって記述は正しい。", "explanation": "SGP（白管・黒管）は耐圧・耐熱・低温衝撃性に限界があるため、毒性ガス、設計圧力1 MPa超、温度100℃超（吐出管等）、または-25℃未満の低温配管には使用が禁止されている。よって記述は正しい。"}, {"id": 2106, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管", "question": "年間を通じて運転する冷凍装置では、冬季の圧縮機の停止中に、凝縮器内の冷媒液が再蒸発して温度の低い吐出しガス配管や圧縮機頭部で凝縮し、たまらないように、吐出しガス配管上部に逆止め弁を設けたほうがよい。", "answer": "○", "law": "冬季停止中に屋外凝縮器から低温の室内圧縮機ヘッド・吐出管へ冷媒が凝縮移動（寝込み）するのを防ぐため、吐出配管上部に逆止め弁を設置する。よって記述は正しい。", "explanation": "冬季停止中に屋外凝縮器から低温の室内圧縮機ヘッド・吐出管へ冷媒が凝縮移動（寝込み）するのを防ぐため、吐出配管上部に逆止め弁を設置する。よって記述は正しい。"}, {"id": 2107, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管", "question": "2台以上の圧縮機を並列運転する場合には、それぞれの吐出しガス配管に逆止め弁を取り付け、停止している圧縮機の冷凍機油に冷媒が大量に溶け込まないようにする。また、吐出しガス配管を主管に接続する場合には、主管の下側 (下面側)に接続する。", "answer": "×", "law": "吐出し枝管を主管に接続する際は、停止中の圧縮機への油や液冷媒の流下逆流を防ぐため「主管の上側（上面）」から合流接続する。「下側に接続する」は誤り。", "explanation": "吐出し枝管を主管に接続する際は、停止中の圧縮機への油や液冷媒の流下逆流を防ぐため「主管の上側（上面）」から合流接続する。「下側に接続する」は誤り。"}, {"id": 2108, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管", "question": "装置の運転中に冷媒温度よりも周囲温度のほうが低い液管では、運転停止時に止め弁や電磁弁などにより封鎖される部分を作ってはならない。このような封鎖された液管では、閉じ込められている液の熱膨張で、弁や管が破損するなどの液封事故が発生しやすい。", "answer": "×", "law": "液封事故の危険が高いのは「周囲温度よりも冷媒温度のほうが低い（低温の冷媒液が流れる）」液管である（停止後に外気温で温められて著しく昇圧する）。記述の条件設定（冷媒より周囲のほうが低い）が逆であるため誤り。", "explanation": "液封事故の危険が高いのは「周囲温度よりも冷媒温度のほうが低い（低温の冷媒液が流れる）」液管である（停止後に外気温で温められて著しく昇圧する）。記述の条件設定（冷媒より周囲のほうが低い）が逆であるため誤り。"}, {"id": 2109, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "高圧遮断装置には、一般に高圧遮断圧力スイッチが使用され、安全弁の作動圧力よりも低い圧力で作動するように設定し、安全弁が作動する前に圧縮機を停止する。これによって冷媒の外部への放出を避ける。", "answer": "○", "law": "高圧遮断装置は異常圧力上昇時に安全弁の吹始め圧力より低い設定値で作動して圧縮機を自動停止させ、冷媒の外部大気放出を未然に防止する。よって記述は正しい。", "explanation": "高圧遮断装置は異常圧力上昇時に安全弁の吹始め圧力より低い設定値で作動して圧縮機を自動停止させ、冷媒の外部大気放出を未然に防止する。よって記述は正しい。"}, {"id": 2110, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "圧力容器用安全弁は、冷媒ガスの種類などで決まる C₃の値および容器の外径と全長により最小口径が決定され、設定圧力で冷媒を放出し、圧力容器の圧力を過度に上昇させないようにする。なお、このC₃の値は、定数値または許容圧力と冷媒ガスの物性などから計算される。", "answer": "○", "law": "圧力容器用安全弁の最小口径 d3 = C3 * sqrt(D * L) で決定され、受熱面積（外径D×全長L）と冷媒特性定数C3から必要な逃がし流量が確保される。よって記述は正しい。", "explanation": "圧力容器用安全弁の最小口径 d3 = C3 * sqrt(D * L) で決定され、受熱面積（外径D×全長L）と冷媒特性定数C3から必要な逃がし流量が確保される。よって記述は正しい。"}, {"id": 2111, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "溶栓は、すべての冷凍装置に取り付けることができる。温度によって作動するので、水冷横形シェルアンドチューブ凝縮器で圧縮機の高温の吐出しガスの影響を受ける場所や逆に冷却水で冷却される管板などに取り付けてはならない。", "answer": "×", "law": "溶栓は作動すると全量大気放出に至るため、毒性ガスや可燃性ガス（アンモニア等）の冷凍装置には「使用が禁止」されている。「すべての冷凍装置に取り付けることができる」は誤り。", "explanation": "溶栓は作動すると全量大気放出に至るため、毒性ガスや可燃性ガス（アンモニア等）の冷凍装置には「使用が禁止」されている。「すべての冷凍装置に取り付けることができる」は誤り。"}, {"id": 2112, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "アンモニア冷媒の冷凍装置において、液封によって著しく圧力上昇のおそれがある部分には、安全弁、破裂板または圧力逃し装置を取り付けるが、安全弁と破裂板には放出管を取り付け、その開口部には放出されたガスを処理する除害装置などを取り付けなければならない。", "answer": "×", "law": "破裂板は可燃性・毒性ガスには原則使用できず、アンモニアの液封逃がしには「安全弁または圧力逃がし装置」を用いる（破裂板は不可）。誤り。", "explanation": "破裂板は可燃性・毒性ガスには原則使用できず、アンモニアの液封逃がしには「安全弁または圧力逃がし装置」を用いる（破裂板は不可）。誤り。"}, {"id": 2113, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験、溶接部の試験など", "question": "耐圧試験は、圧縮機、圧力容器などの耐圧強度を確認しなければならない構成機器、またはその部品ごとに行う全数試験である。さらに、部品ごとに試験したときは、それを組み立てた全ての機器も耐圧試験を行わなければならない。", "answer": "×", "law": "構成部品ごとに所定の耐圧試験に合格している場合は、それらを組み立てた完成機器について改めて全体耐圧試験を行うことは要しない（耐圧強度が確認されたとみなされる）。誤り。", "explanation": "構成部品ごとに所定の耐圧試験に合格している場合は、それらを組み立てた完成機器について改めて全体耐圧試験を行うことは要しない（耐圧強度が確認されたとみなされる）。誤り。"}, {"id": 2114, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験、溶接部の試験など", "question": "気密試験は、冷媒設備の配管の部分を除く構成機器の個々のものについて、耐圧試験を実施する前にあらかじめ気密の確認をするために行う。", "answer": "×", "law": "気密試験は機器の耐圧強度が確保されていることを確認した上で、一般に「耐圧試験を実施した後に」引き続いて漏れ検査を行うものである。「耐圧試験の前に」は誤り。", "explanation": "気密試験は機器の耐圧強度が確保されていることを確認した上で、一般に「耐圧試験を実施した後に」引き続いて漏れ検査を行うものである。「耐圧試験の前に」は誤り。"}, {"id": 2115, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験、溶接部の試験など", "question": "真空試験は、冷媒設備の気密の最終確認をするために冷媒設備内を周囲大気温度に相当する水蒸気飽和圧力以下にすることが必要で、十分に長い時間にわたって真空のまま放置した後、試験開始前よりも5Kくらいの温度変化の場合に0.7 kPa 程度の圧力変化であればよい。", "answer": "○", "law": "真空放置試験は系内水分を蒸発排気するため飽和圧力以下まで排気後、一昼夜程度放置し、温度変化5K以内で圧力変動0.7 kPa以内であれば合格と判定される。よって記述は正しい。", "explanation": "真空放置試験は系内水分を蒸発排気するため飽和圧力以下まで排気後、一昼夜程度放置し、温度変化5K以内で圧力変動0.7 kPa以内であれば合格と判定される。よって記述は正しい。"}, {"id": 2116, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験、溶接部の試験など", "question": "法定冷凍能力 20トン以上の冷媒設備の圧力容器の突き合わせ溶接部に規定されている機械試験には、継手引張試験、表曲げ試験、側曲げ試験、裏曲げ試験および衝撃試験がある。", "answer": "○", "law": "例示基準により法定能力20トン以上の圧力容器突合せ溶接継手の機械試験として、引張試験、各種曲げ試験（表曲げ・側曲げ・裏曲げ）、衝撃試験（シャルピー）が規定されている。よって記述は正しい。", "explanation": "例示基準により法定能力20トン以上の圧力容器突合せ溶接継手の機械試験として、引張試験、各種曲げ試験（表曲げ・側曲げ・裏曲げ）、衝撃試験（シャルピー）が規定されている。よって記述は正しい。"}, {"id": 2117, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "イ", "theme": "冷凍装置の据付けおよび試運転", "question": "一般的に、コンクリート基礎の質量は、その上に据え付ける機器の質量よりも大きくする。特に、多気筒圧縮機では、機器の質量の2倍から3倍の質量の基礎が必要である。なお、防振装置を備えた防振支持の基礎は、通常の基礎に比べて軽量にすることができる。", "answer": "○", "law": "コンクリート基礎は機器質量の1〜3倍以上を確保して振動を吸収衰減させる。防振ゴム等の防振支持を採用した基礎は慣性ブロックを適正化して通常の剛固定基礎より軽量化できる。よって記述は正しい。", "explanation": "コンクリート基礎は機器質量の1〜3倍以上を確保して振動を吸収衰減させる。防振ゴム等の防振支持を採用した基礎は慣性ブロックを適正化して通常の剛固定基礎より軽量化できる。よって記述は正しい。"}, {"id": 2118, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ロ", "theme": "冷凍装置の据付けおよび試運転", "question": "冷凍機油は、常用の蒸発温度で凝固しないものを選ぶ。凝固する現象の一因は、油中のろう分が固化して析出することであるため、凝固点が低く、ろう分の少ないことが、冷凍機油の選定条件の一つである。", "answer": "○", "law": "低温下での冷凍機油のろう分（ワックス）析出や凝固は膨張弁の流路閉塞や伝熱阻害を起こすため、凝固点（流動点）が低くワックス分の少ない油を選定する。よって記述は正しい。", "explanation": "低温下での冷凍機油のろう分（ワックス）析出や凝固は膨張弁の流路閉塞や伝熱阻害を起こすため、凝固点（流動点）が低くワックス分の少ない油を選定する。よって記述は正しい。"}, {"id": 2119, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ハ", "theme": "冷凍装置の据付けおよび試運転", "question": "冷媒量が不足すると、蒸発圧力が低下し、圧縮機の吸込み蒸気の過熱度が大きくなり、吐出しガス温度が低下し、冷凍能力も低下する。一方、冷媒が過充てんの場合には、凝縮に有効な伝熱面積が増加し、圧縮機の消費電力は増大する。", "answer": "×", "law": "冷媒不足時は吸込み過熱度増大により吐出しガス温度は「上昇」する。過充てん時は冷却管が液没して凝縮有効伝熱面積が「減少」する。記述が誤り。", "explanation": "冷媒不足時は吸込み過熱度増大により吐出しガス温度は「上昇」する。過充てん時は冷却管が液没して凝縮有効伝熱面積が「減少」する。記述が誤り。"}, {"id": 2120, "subject": "保安管理", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ニ", "theme": "冷凍装置の据付けおよび試運転", "question": "フルオロカーボン冷媒は安定した冷媒であり、一般に毒性は低く可燃性もないが、高温の物体に触れると、分解して、フッ化水素やホスゲンなどの毒性はないが可燃性のあるガスが発生する。圧力容器や配管の修理の際には、内部に残留ガスがないか十分に確認する。", "answer": "×", "law": "フルオロカーボンが高温熱源や裸火に触れると熱分解してフッ化水素やホスゲン等の「極めて毒性の強いガス」が発生する。「毒性はないが可燃性のあるガス」との記述は誤り。", "explanation": "フルオロカーボンが高温熱源や裸火に触れると熱分解してフッ化水素やホスゲン等の「極めて毒性の強いガス」が発生する。「毒性はないが可燃性のあるガス」との記述は誤り。"}, {"id": 2121, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "往復圧縮機では、吸込み弁や吐出し弁の作動遅れ、シリンダ壁との熱交換、隙間容積内のガスの再膨張などによって、実際の吸込み蒸気量はピストン押しのけ量よりも少なくなり、体積効率は1より小さくなる。", "answer": "○", "law": "往復圧縮機の体積効率は、隙間容積内の高圧ガスの再膨張、吸込み・吐出し弁の流動抵抗や作動遅れ、シリンダ壁からの加熱による吸込みガスの比体積増大などにより、常に1より小さくなる。よって記述は正しい。", "explanation": "往復圧縮機の体積効率は、隙間容積内の高圧ガスの再膨張、吸込み・吐出し弁の流動抵抗や作動遅れ、シリンダ壁からの加熱による吸込みガスの比体積増大などにより、常に1より小さくなる。よって記述は正しい。"}, {"id": 2122, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "スクリュー圧縮機は、雄ロータと雌ロータの噛み合いによって冷媒蒸気を吸込み、軸方向に圧縮して吐き出す容積圧縮機である。往復圧縮機のような吸込み弁や吐出し弁がないため、高速回転が可能で、振動や脈動が少ない。", "answer": "○", "law": "スクリュー圧縮機はロータ間の溝容積を縮小して連続的に圧縮する容積式であり、弁機構をもたないため高速回転が可能でトルク変動や吐出脈動が極めて小さい。よって記述は正しい。", "explanation": "スクリュー圧縮機はロータ間の溝容積を縮小して連続的に圧縮する容積式であり、弁機構をもたないため高速回転が可能でトルク変動や吐出脈動が極めて小さい。よって記述は正しい。"}, {"id": 2123, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は、固定スクロールと旋回スクロールの間に複数の三日月形の圧縮室を形成し、外周から中心部に向かって容積を縮小しながら圧縮する。容積比（圧縮比）が固定されているため、運転圧力比が設計容積比による圧力比と異なると、過圧縮または過小圧縮損失が生じる。", "answer": "○", "law": "スクロール圧縮機は吸込み・吐出しポート位置によって内部容積比が幾何学的に固定されているため、実際の運転圧力比が設計圧力比から外れると過圧縮または過小圧縮損失が発生する。よって記述は正しい。", "explanation": "スクロール圧縮機は吸込み・吐出しポート位置によって内部容積比が幾何学的に固定されているため、実際の運転圧力比が設計圧力比から外れると過圧縮または過小圧縮損失が発生する。よって記述は正しい。"}, {"id": 2124, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、インペラの回転による遠心力で冷媒蒸気に速度エネルギーを与え、ディフューザや渦巻室で静圧に変換するターボ型圧縮機である。低沸点冷媒（高圧冷媒）に適しており、小容量の空調用冷凍装置に広く用いられる。", "answer": "×", "law": "遠心圧縮機は多量の蒸気を取り扱う大容量用途に適しており、吸込み比体積の大きい中・低圧冷媒が用いられる。小容量の冷凍装置には適さない。「低沸点冷媒に適し小容量に広く用いられる」は誤り。", "explanation": "遠心圧縮機は多量の蒸気を取り扱う大容量用途に適しており、吸込み比体積の大きい中・低圧冷媒が用いられる。小容量の冷凍装置には適さない。「低沸点冷媒に適し小容量に広く用いられる」は誤り。"}, {"id": 2125, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "往復圧縮機のアンローダ機構は、電磁弁等を作動させて吸込み弁を開放状態に保持し、シリンダ内の冷媒ガスを圧縮せずに吸込み側へ押し戻すことによって、段階的に容量を減少させる。", "answer": "○", "law": "アンローダ機構は油圧ピストン等で吸込み弁板を強制開放（アンロード）し、ピストンが往復してもガスを圧縮させずに吸込み側へ戻すことで気筒数に応じた段階的容量制御を行う。よって記述は正しい。", "explanation": "アンローダ機構は油圧ピストン等で吸込み弁板を強制開放（アンロード）し、ピストンが往復してもガスを圧縮させずに吸込み側へ戻すことで気筒数に応じた段階的容量制御を行う。よって記述は正しい。"}, {"id": 2126, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "インバータによる回転速度制御では、圧縮機を定格速度より低速で運転する場合、潤滑油ポンプの吐出し圧力が低下して軸受の潤滑不良を起こすおそれがあるため、下限回転速度が設定されている。", "answer": "○", "law": "軸直結の給油ポンプをもつ圧縮機では、回転速度を極端に下げると油圧が不足して軸受等の焼付き事故を招く危険があるため、制御上安全な下限回転速度が設定される。よって記述は正しい。", "explanation": "軸直結の給油ポンプをもつ圧縮機では、回転速度を極端に下げると油圧が不足して軸受等の焼付き事故を招く危険があるため、制御上安全な下限回転速度が設定される。よって記述は正しい。"}, {"id": 2127, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパス弁を用いた容量制御は、蒸発器負荷が減少したときに高圧の吐出しガスを蒸発器入口または圧縮機吸込み管にバイパスさせる方法であり、装置全体の消費電力を負荷減少に比例して大きく低減できる。", "answer": "×", "law": "ホットガスバイパスは蒸発器の凍結防止や吸込み圧力の維持には有効だが、圧縮機自体はガスを圧縮し続けるため消費電力の低減効果はほとんど得られない。「消費電力を負荷減少に比例して大きく低減できる」は誤り。", "explanation": "ホットガスバイパスは蒸発器の凍結防止や吸込み圧力の維持には有効だが、圧縮機自体はガスを圧縮し続けるため消費電力の低減効果はほとんど得られない。「消費電力を負荷減少に比例して大きく低減できる」は誤り。"}, {"id": 2128, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "スクリュー圧縮機では、スライド弁を軸方向に移動させて吸込み閉込み開始位置を遅らせることで、10〜100%の範囲で連続的に無段容量制御を行うことができる。", "answer": "○", "law": "ツインスクリュー圧縮機は油圧駆動のスライド弁を軸方向にスライドさせて吸込み閉込み開始時期を変えることにより、広範囲で滑らかな無段容量制御が可能である。よって記述は正しい。", "explanation": "ツインスクリュー圧縮機は油圧駆動のスライド弁を軸方向にスライドさせて吸込み閉込み開始時期を変えることにより、広範囲で滑らかな無段容量制御が可能である。よって記述は正しい。"}, {"id": 2129, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吸込み過熱度が過大になると、吸込み蒸気の比体積が増大して冷媒循環量が減少し、冷凍能力が低下するとともに、圧縮機の吐出しガス温度が異常に上昇して油の劣化を招く。", "answer": "○", "law": "吸込み過熱度が大きすぎるとガスの密度が低下して循環質量流量が減り能力が低下する。さらに圧縮開始温度が高くなるため吐出しガス温度が異常上昇し油の炭化や弁の損傷を招く。よって記述は正しい。", "explanation": "吸込み過熱度が大きすぎるとガスの密度が低下して循環質量流量が減り能力が低下する。さらに圧縮開始温度が高くなるため吐出しガス温度が異常上昇し油の炭化や弁の損傷を招く。よって記述は正しい。"}, {"id": 2130, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "クランクケース内に過剰な液冷媒が寝込んでいる状態で圧縮機を急激に始動すると、クランクケース内の圧力が急低下し、油中の冷媒が激しく沸騰して油が泡立つオイルフォーミング（フォーミング現象）が発生する。", "answer": "○", "law": "停止中に油に溶け込んだ冷媒は、起動時の急激な圧力降下によって突沸し激しく発泡する。これにより油がシリンダへ多量に吸い上げられて液圧縮を起こしたり油圧低下を招く。よって記述は正しい。", "explanation": "停止中に油に溶け込んだ冷媒は、起動時の急激な圧力降下によって突沸し激しく発泡する。これにより油がシリンダへ多量に吸い上げられて液圧縮を起こしたり油圧低下を招く。よって記述は正しい。"}, {"id": 2131, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機のクランクケース内の油面が低下した場合、油の補給は圧縮機を停止して行う必要があり、運転中に低圧側から油を吸入させることは絶対に禁止されている。", "answer": "×", "law": "往復圧縮機の給油は、専用の手動給油ポンプ等を用いるか、クランクケースを低圧側圧力にして適切な手順を踏めば運転中であっても補給可能である。「絶対に禁止されている」は誤り。", "explanation": "往復圧縮機の給油は、専用の手動給油ポンプ等を用いるか、クランクケースを低圧側圧力にして適切な手順を踏めば運転中であっても補給可能である。「絶対に禁止されている」は誤り。"}, {"id": 2132, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吐出し弁板が破損または漏れを生じた場合、吐出しガス温度は正常時よりも著しく上昇し、シリンダヘッドが異常加熱される。", "answer": "○", "law": "吐出し弁から高温高圧の吐出しガスがシリンダ内へ逆流すると、そのガスが再び吸込み行程で混入して繰り返し圧縮されるため、吐出しガス温度が著しく上昇する。よって記述は正しい。", "explanation": "吐出し弁から高温高圧の吐出しガスがシリンダ内へ逆流すると、そのガスが再び吸込み行程で混入して繰り返し圧縮されるため、吐出しガス温度が著しく上昇する。よって記述は正しい。"}, {"id": 2133, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "水冷凝縮器の冷却管内に水あか（スケール）やスライムが付着すると、熱抵抗が増大して熱通過率が低下し、凝縮温度・凝縮圧力が上昇するため、圧縮機の軸動力が増加する。", "answer": "○", "law": "水あかや泥・藻などの付着は管内の熱伝達抵抗を増大させ、凝縮温度・凝縮圧力を上昇させる。これにより圧縮機の圧力比が大きくなり消費電力（軸動力）が増加する。よって記述は正しい。", "explanation": "水あかや泥・藻などの付着は管内の熱伝達抵抗を増大させ、凝縮温度・凝縮圧力を上昇させる。これにより圧縮機の圧力比が大きくなり消費電力（軸動力）が増加する。よって記述は正しい。"}, {"id": 2134, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器のフィンに塵埃が付着して風量が減少した場合、冷媒と空気の有効伝熱面積および熱伝達率が低下し、凝縮圧力が異常上昇して高圧遮断スイッチが作動することがある。", "answer": "○", "law": "フィンの目詰まりによる風量低下は空気側熱伝達を悪化させて凝縮圧力を異常上昇させ、高圧遮断圧力スイッチ（HPS）のトリップや能力低下を引き起こす。よって記述は正しい。", "explanation": "フィンの目詰まりによる風量低下は空気側熱伝達を悪化させて凝縮圧力を異常上昇させ、高圧遮断圧力スイッチ（HPS）のトリップや能力低下を引き起こす。よって記述は正しい。"}, {"id": 2135, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "凝縮器に不凝縮ガスが混入すると、不凝縮ガスの分圧によって全圧が上昇するだけでなく、伝熱面上にガス境膜を形成して凝縮熱伝達を妨げるため、凝縮温度が上昇する。", "answer": "○", "law": "不凝縮ガス（空気等）が冷媒系統内に存在すると、分圧加算による圧力上昇に加え、伝熱管表面に滞留膜を作って冷媒蒸気の接触凝縮を強く阻害し、凝縮温度を上昇させる。よって記述は正しい。", "explanation": "不凝縮ガス（空気等）が冷媒系統内に存在すると、分圧加算による圧力上昇に加え、伝熱管表面に滞留膜を作って冷媒蒸気の接触凝縮を強く阻害し、凝縮温度を上昇させる。よって記述は正しい。"}, {"id": 2136, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "蒸発式凝縮器では、散水ポンプによる水噴霧と送風機による空気流の蒸発潜熱を利用して凝縮させるため、空冷凝縮器に比べて夏季の外気温が高い日でも凝縮圧力を著しく高く維持できる。", "answer": "×", "law": "蒸発式凝縮器は水の蒸発潜熱を利用し外気の「湿球温度」を基準に冷却するため、空冷凝縮器（乾球温度基準）よりも凝縮温度・圧力を「低く」抑えることができる。「著しく高く維持できる」は誤り。", "explanation": "蒸発式凝縮器は水の蒸発潜熱を利用し外気の「湿球温度」を基準に冷却するため、空冷凝縮器（乾球温度基準）よりも凝縮温度・圧力を「低く」抑えることができる。「著しく高く維持できる」は誤り。"}, {"id": 2137, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "乾式蒸発器において、冷媒充てん量が不足すると、蒸発器内の濡れ面積が減少して蒸発圧力が低下し、過熱度が過大となって冷凍能力が著しく低下する。", "answer": "○", "law": "冷媒充てん量不足により膨張弁への液供給が減ると、蒸発器管内の液冷媒濡れ面が後退して有効伝熱面積が減少し、蒸発圧力の低下と過熱度の異常増大を招く。よって記述は正しい。", "explanation": "冷媒充てん量不足により膨張弁への液供給が減ると、蒸発器管内の液冷媒濡れ面が後退して有効伝熱面積が減少し、蒸発圧力の低下と過熱度の異常増大を招く。よって記述は正しい。"}, {"id": 2138, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "フィンコイル形空気冷却用蒸発器に着霜が進行すると、空気側流路の通風抵抗が増大して風量が減少するとともに、霜層の熱伝導抵抗によって熱通過率が低下し、蒸発圧力が低下する。", "answer": "○", "law": "霜が厚くなるとフィン間流路が塞がれて風量が減少し、さらに霜自体の熱伝導抵抗が加わって熱通過率が著しく悪化し、蒸発温度・圧力が低下する。よって記述は正しい。", "explanation": "霜が厚くなるとフィン間流路が塞がれて風量が減少し、さらに霜自体の熱伝導抵抗が加わって熱通過率が著しく悪化し、蒸発温度・圧力が低下する。よって記述は正しい。"}, {"id": 2139, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "満液式シェルアンドチューブ蒸発器は、管内を流れる水やブラインを冷却する構造であり、負荷変動や制御弁の誤動作で蒸発温度が水の氷点以下に低下しても、管内の水が凍結して伝熱管が破損するおそれはない。", "answer": "×", "law": "満液式では伝熱管の内側を水やブラインが流れるため、管内液が凍結すると体積膨張の逃げ場がなく伝熱管が容易に破裂破損して冷媒系統へ水が浸入する重大事故となる。誤り。", "explanation": "満液式では伝熱管の内側を水やブラインが流れるため、管内液が凍結すると体積膨張の逃げ場がなく伝熱管が容易に破裂破損して冷媒系統へ水が浸入する重大事故となる。誤り。"}, {"id": 2140, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "低温用蒸発器の除霜（デフロスト）方式には、散水デフロスト、ホットガスデフロスト、電気ヒータデフロストなどがあり、デフロスト後は速やかに冷却運転を再開して庫内温度の上昇を最小限に抑える。", "answer": "○", "law": "除霜方式には温水散水、高温吐出ガスバイパス、電熱ヒータ等があり、タイマや温度センサ等により適切な間隔と時間で実施し、庫内温度の過度な上昇を防ぐ。よって記述は正しい。", "explanation": "除霜方式には温水散水、高温吐出ガスバイパス、電熱ヒータ等があり、タイマや温度センサ等により適切な間隔と時間で実施し、庫内温度の過度な上昇を防ぐ。よって記述は正しい。"}, {"id": 2141, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器の伝熱特性", "question": "熱交換器における熱通過率（K値）は、管内熱伝達率、管外熱伝達率、管壁の熱伝導抵抗、および汚れ係数（水あか等の熱抵抗）によって定まり、いずれかの熱抵抗が著しく大きいとその部分が支配的となる。", "answer": "○", "law": "熱通過抵抗は各熱伝達抵抗、管壁抵抗、汚れ抵抗の和であり、直列熱抵抗のうち最も値が大きい部分が全体の熱通過率を大きく左右（支配）する。よって記述は正しい。", "explanation": "熱通過抵抗は各熱伝達抵抗、管壁抵抗、汚れ抵抗の和であり、直列熱抵抗のうち最も値が大きい部分が全体の熱通過率を大きく左右（支配）する。よって記述は正しい。"}, {"id": 2142, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器の伝熱特性", "question": "空気冷却用フィンチューブ熱交換器では、空気側の熱伝達率が冷媒側に比べて極めて小さいため、伝熱管の空気側にフィンを設けて伝熱面積を拡大することで伝熱性能を向上させている。", "answer": "○", "law": "気体である空気側の熱伝達率は沸騰・凝縮する冷媒側に比べて桁違いに小さいため、空気側に多数のフィンを取り付けて伝熱面積を数倍〜十数倍に広げて熱抵抗を補っている。よって記述は正しい。", "explanation": "気体である空気側の熱伝達率は沸騰・凝縮する冷媒側に比べて桁違いに小さいため、空気側に多数のフィンを取り付けて伝熱面積を数倍〜十数倍に広げて熱抵抗を補っている。よって記述は正しい。"}, {"id": 2143, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器の伝熱特性", "question": "二重管式熱交換器において、冷媒と被冷却流体の流れ方向を対向流（向流）にするよりも並行流（並流）にするほうが、対数平均温度差を大きく取ることができ、伝熱上有利である。", "answer": "×", "law": "出入口温度条件が同一であれば、向流のほうが並流よりも対数平均温度差を大きく取ることができ、必要な伝熱面積を小さくできるため伝熱上有利である。「並流のほうが有利」は誤り。", "explanation": "出入口温度条件が同一であれば、向流のほうが並流よりも対数平均温度差を大きく取ることができ、必要な伝熱面積を小さくできるため伝熱上有利である。「並流のほうが有利」は誤り。"}, {"id": 2144, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器の伝熱特性", "question": "伝熱管外面にローフィン（低フィン）加工を施した管は、裸管（平滑管）に比べて外表面積が約2.5〜3倍に拡大され、水冷凝縮器や満液式蒸発器の小形・高性能化に適している。", "answer": "○", "law": "管外面に一体成型されたローフィンチューブは外表面積を拡大し、冷媒の凝縮熱伝達や沸騰熱伝達を促進してシェルアンドチューブ熱交換器の小形軽量化に寄与する。よって記述は正しい。", "explanation": "管外面に一体成型されたローフィンチューブは外表面積を拡大し、冷媒の凝縮熱伝達や沸騰熱伝達を促進してシェルアンドチューブ熱交換器の小形軽量化に寄与する。よって記述は正しい。"}, {"id": 2145, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "温度自動膨張弁は、蒸発器出口の冷媒蒸気の過熱度を感温筒で検知し、ダイヤフラムにかかる圧力の平衡によって弁開度を自動調節して、蒸発器への冷媒流量を制御する。", "answer": "○", "law": "温度自動膨張弁は感温筒圧力（開く力）と蒸発圧力＋ばね力（閉じる力）の釣り合いで弁開度を決め、設定過熱度を維持するように冷媒液流量を自動調節する。よって記述は正しい。", "explanation": "温度自動膨張弁は感温筒圧力（開く力）と蒸発圧力＋ばね力（閉じる力）の釣り合いで弁開度を決め、設定過熱度を維持するように冷媒液流量を自動調節する。よって記述は正しい。"}, {"id": 2146, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "蒸発器内の冷媒圧力降下（圧力損失）が大きい場合、内部均圧形温度自動膨張弁を使用すると、圧力降下分だけ過熱度が設定値より大きくなって蒸発器の有効伝熱面積が減少するため、外部均圧形温度自動膨張弁を使用する必要がある。", "answer": "○", "law": "内部均圧形では弁出口の高い圧力がダイヤフラム下面にかかるため弁が閉じ気味になり、過熱度が大きくなって冷却不良となる。蒸発器圧力損失が大きい場合は外部均圧形が必須である。よって記述は正しい。", "explanation": "内部均圧形では弁出口の高い圧力がダイヤフラム下面にかかるため弁が閉じ気味になり、過熱度が大きくなって冷却不良となる。蒸発器圧力損失が大きい場合は外部均圧形が必須である。よって記述は正しい。"}, {"id": 2147, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "感温筒の取付け位置は、蒸発器出口付近の水平配管の上部（12時方向）が最も適しており、配管底部の油や液だまりの影響を受けないように設置する。", "answer": "×", "law": "水平吸込み管に感温筒を取り付ける際は、管径に応じて時計の1時〜4時（または8時〜11時）の位置に密着させ、真上（12時：ガス過熱を拾いやすい）や真下（6時：油や液が溜まる）は避ける。誤り。", "explanation": "水平吸込み管に感温筒を取り付ける際は、管径に応じて時計の1時〜4時（または8時〜11時）の位置に密着させ、真上（12時：ガス過熱を拾いやすい）や真下（6時：油や液が溜まる）は避ける。誤り。"}, {"id": 2148, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "キャピラリーチューブは、内径が細く長い銅管の流動抵抗を利用して減圧膨張させる固定絞り装置であり、熱負荷や圧力変動に対する自己調整機能が狭いため、家庭用冷蔵庫や小形エアコンなどの負荷変動が比較的小さい装置に用いられる。", "answer": "○", "law": "キャピラリーチューブは可動部がなく安価で信頼性が高いが、絞り抵抗が固定されているため負荷変動幅の小さい小容量パッケージ機器等に限定して用いられる。よって記述は正しい。", "explanation": "キャピラリーチューブは可動部がなく安価で信頼性が高いが、絞り抵抗が固定されているため負荷変動幅の小さい小容量パッケージ機器等に限定して用いられる。よって記述は正しい。"}, {"id": 2149, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "蒸発圧力調整弁（EPR）は、蒸発器の出口配管に設置され、蒸発器内の圧力が設定圧力以下に低下するのを防ぎ、水冷却器の凍結防止や冷蔵室の過冷却防止に用いられる。", "answer": "○", "law": "EPRは蒸発器圧力を検知して設定値以下になると絞るため、蒸発圧力を一定以上に保持し、水クーラの凍結破損やチルド品の凍結を防ぐ。よって記述は正しい。", "explanation": "EPRは蒸発器圧力を検知して設定値以下になると絞るため、蒸発圧力を一定以上に保持し、水クーラの凍結破損やチルド品の凍結を防ぐ。よって記述は正しい。"}, {"id": 2150, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "吸入圧力調整弁（SPR）は、圧縮機の吸込み配管に設置され、始動時や除霜後の急激な負荷増大時に吸込み圧力が設定圧力以上に上昇するのを抑え、電動機の過負荷（過電流）を防止する。", "answer": "○", "law": "クランクケース圧力調整弁（SPR）は、吸入圧力が設定値を超えないよう絞り、再起動時や高負荷時における圧縮機電動機の過負荷トリップを防止する。よって記述は正しい。", "explanation": "クランクケース圧力調整弁（SPR）は、吸入圧力が設定値を超えないよう絞り、再起動時や高負荷時における圧縮機電動機の過負荷トリップを防止する。よって記述は正しい。"}, {"id": 2151, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "凝縮圧力調整弁は、冬期に外気温が低下して空冷凝縮器の凝縮圧力が過度に低下し、膨張弁前後の差圧不足が生じるのを防ぐため、凝縮器内に液を滞留させて凝縮圧力を維持する。", "answer": "○", "law": "冬季の過冷却・低凝縮圧力による膨張弁流量不足を防ぐため、凝縮圧力調整弁で液冷媒を凝縮器下部に滞留させ、有効伝熱面積を狭めて凝縮圧力を下限値以上に保つ。よって記述は正しい。", "explanation": "冬季の過冷却・低凝縮圧力による膨張弁流量不足を防ぐため、凝縮圧力調整弁で液冷媒を凝縮器下部に滞留させ、有効伝熱面積を狭めて凝縮圧力を下限値以上に保つ。よって記述は正しい。"}, {"id": 2152, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "冷却水調整弁（制水弁）は、凝縮圧力の上昇に伴って弁開度を狭め、冷却水量を減少させることで凝縮温度を一定に保つように動作する。", "answer": "×", "law": "冷却水調整弁（制水弁）は、凝縮圧力が上昇したときに弁を「開いて」冷却水量を増加させ、圧力を低下させて適正値に保つ。「弁開度を狭め冷却水量を減少させる」は動作が逆であり誤り。", "explanation": "冷却水調整弁（制水弁）は、凝縮圧力が上昇したときに弁を「開いて」冷却水量を増加させ、圧力を低下させて適正値に保つ。「弁開度を狭め冷却水量を減少させる」は動作が逆であり誤り。"}, {"id": 2153, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "イ", "theme": "制御機器・保護装置", "question": "低圧遮断圧力スイッチ（LPS）は、吸込み圧力（蒸発圧力）の異常低下を検知して圧縮機を停止させる保護装置であり、また冷凍装置の発停制御（温度連動やポンプダウン運転）にも用いられる。", "answer": "○", "law": "低圧圧力スイッチは配管破損や冷媒漏洩による低圧異常低下から装置を守るとともに、サーモスタット連動のポンプダウン自動運転制御スイッチとしても広く使われる。よって記述は正しい。", "explanation": "低圧圧力スイッチは配管破損や冷媒漏洩による低圧異常低下から装置を守るとともに、サーモスタット連動のポンプダウン自動運転制御スイッチとしても広く使われる。よって記述は正しい。"}, {"id": 2154, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器・保護装置", "question": "高圧遮断圧力スイッチ（HPS）は、凝縮圧力（吐出し圧力）が許容圧力以上に異常上昇した際に圧縮機を停止させる安全保護装置であり、原則として手動復帰形（手動リセット）が用いられる。", "answer": "○", "law": "高圧遮断装置は安全弁作動前に圧縮機を強制停止させる重要保安装置であり、異常原因を点検確認せずに再起動することを防ぐため、原則として手動復帰形が義務付けられる。よって記述は正しい。", "explanation": "高圧遮断装置は安全弁作動前に圧縮機を強制停止させる重要保安装置であり、異常原因を点検確認せずに再起動することを防ぐため、原則として手動復帰形が義務付けられる。よって記述は正しい。"}, {"id": 2155, "subject": "保安管理", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器・保護装置", "question": "油圧保護圧力スイッチ（OPS）は、圧縮機の給油ポンプ吐出し圧力とクランクケース内圧力（吸込み圧力）との差圧（有効油圧）を検出し、差圧が設定値以下に低下した状態が一定時間（遅延時間：約60〜
