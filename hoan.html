, "explanation": "試運転前点検と始動後の連続運転データ採取は必須のプロセスである。よって正しい。"}, {"id": 2480, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "ニ", "theme": "据付け・試運転", "question": "アンモニアは毒性があるが燃焼性はないため、アンモニア冷凍装置の電気設備に対して防爆性能は一切必要としない。", "answer": "×", "law": "アンモニアは「可燃性ガス」にも指定されている（防爆基準の特例はあるが燃焼性がないわけではない）。誤り。", "explanation": "アンモニアは「可燃性ガス」にも指定されている（防爆基準の特例はあるが燃焼性がないわけではない）。誤り。"}, {"id": 2481, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "多気筒往復圧縮機では、吸込み行程中にシリンダ内の圧力が吸込み配管圧力よりも低くなり、その差圧によって吸込み弁が開き、圧縮行程ではシリンダ内圧力が吐出し配管圧力よりも高くなると吐出し弁が開く。", "answer": "○", "law": "往復動圧縮機の弁は差圧応動の自動弁であり、ピストンの往復運動によるシリンダ内外の圧力差によって開閉動作を行う。よって記述は正しい。", "explanation": "往復動圧縮機の弁は差圧応動の自動弁であり、ピストンの往復運動によるシリンダ内外の圧力差によって開閉動作を行う。よって記述は正しい。"}, {"id": 2482, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "スクリュー圧縮機は、ケーシング内で噛み合う雌雄ロータの回転により連続的に容積を縮小して圧縮するため、往復圧縮機のようなピストンの不平衡慣性力がなく、振動や騒音が比較的小さい。", "answer": "○", "law": "スクリュー圧縮機は回転運動のみで圧縮を行うため往復質量による慣性加振力が存在せず、吐出脈動も小さいため振動や騒音の抑制に優れる。よって記述は正しい。", "explanation": "スクリュー圧縮機は回転運動のみで圧縮を行うため往復質量による慣性加振力が存在せず、吐出脈動も小さいため振動や騒音の抑制に優れる。よって記述は正しい。"}, {"id": 2483, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は、固定スクロールと旋回スクロールの渦巻の間に形成された圧縮空間が、外周部から中心部へ向かって次第に容積を縮小させながら移動してガスを圧縮する機構である。", "answer": "○", "law": "スクロール圧縮機は旋回スクロールの公転運動により、外周の吸込み空間が三日月形に閉じ込められ、中心に向かって容積を狭めながら高圧吐出口へガスを押し出す。よって記述は正しい。", "explanation": "スクロール圧縮機は旋回スクロールの公転運動により、外周の吸込み空間が三日月形に閉じ込められ、中心に向かって容積を狭めながら高圧吐出口へガスを押し出す。よって記述は正しい。"}, {"id": 2484, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、羽根車から高速で吐き出された冷媒蒸気の動圧をディフューザで静圧に変換するターボ型流体機械であり、吸込み蒸気量が減少してもサージングを起こすことなく安定した運転を継続できる。", "answer": "×", "law": "遠心圧縮機は部分負荷等で吸込み流量が臨界流量以下に減少すると、ディフューザ部で流れの剥離が生じ激しいサージング現象を起こして運転不能となる。「サージングを起こすことなく安定運転できる」は誤り。", "explanation": "遠心圧縮機は部分負荷等で吸込み流量が臨界流量以下に減少すると、ディフューザ部で流れの剥離が生じ激しいサージング現象を起こして運転不能となる。「サージングを起こすことなく安定運転できる」は誤り。"}, {"id": 2485, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "インバータによる圧縮機の回転速度制御は、熱負荷の変動に応じて電源周波数を変化させることで冷媒循環量を連続的に増減させるため、ステップ制御やオンオフ制御に比べて省エネルギー性に優れる。", "answer": "○", "law": "インバータ制御は必要負荷に見合った回転数で運転できるため、発停ロスや過剰冷却を抑え、部分負荷時において極めて高いCOP（成績係数）を維持できる。よって記述は正しい。", "explanation": "インバータ制御は必要負荷に見合った回転数で運転できるため、発停ロスや過剰冷却を抑え、部分負荷時において極めて高いCOP（成績係数）を維持できる。よって記述は正しい。"}, {"id": 2486, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "多気筒往復圧縮機のアンローダ機構は、吸込み弁板を弁座から強制的に押し上げて開放状態に保つことにより、ピストンが往復運動してもガスを圧縮させず吸込み側へ戻すことで気筒ごとの容量制御を行う。", "answer": "○", "law": "油圧または電磁弁で作動するアンローダピンにより吸込み弁を開放保持（アンロード）し、作動気筒数を減らすことで25%〜100%などの段階的容量制御を行う。よって記述は正しい。", "explanation": "油圧または電磁弁で作動するアンローダピンにより吸込み弁を開放保持（アンロード）し、作動気筒数を減らすことで25%〜100%などの段階的容量制御を行う。よって記述は正しい。"}, {"id": 2487, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "ツインスクリュー圧縮機では、油圧ピストンによってスライド弁を軸方向に移動させ、吸込みポートの閉塞位置を変えることによって、10〜100%の広範囲で滑らかな無段容量制御を行うことができる。", "answer": "○", "law": "スライド弁をスライドさせてロータ溝へのガス閉込み開始時期を変化させることで、無段階に実効圧縮容積を調節して連続的な容量制御ができる。よって記述は正しい。", "explanation": "スライド弁をスライドさせてロータ溝へのガス閉込み開始時期を変化させることで、無段階に実効圧縮容積を調節して連続的な容量制御ができる。よって記述は正しい。"}, {"id": 2488, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパス弁を用いた容量制御は、蒸発器熱負荷が低下した際に高圧吐出しガスを低圧側に流すことで吸込み圧力を維持する手法であり、圧縮機の消費動力を負荷減少に応じて大幅に低減できる省エネ技術である。", "answer": "×", "law": "ホットガスバイパスは蒸発圧力の低下防止や凍結防止を目的とするが、圧縮機自体はガスを圧縮し続けるため動力低減効果はほとんどなく、省エネ技術ではない。誤り。", "explanation": "ホットガスバイパスは蒸発圧力の低下防止や凍結防止を目的とするが、圧縮機自体はガスを圧縮し続けるため動力低減効果はほとんどなく、省エネ技術ではない。誤り。"}, {"id": 2489, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の吐出し弁板が破損またはシート不良を生じると、シリンダ内で圧縮された高温高圧ガスが吸込み行程で再流入して繰り返し圧縮されるため、吐出しガス温度が異常に上昇する。", "answer": "○", "law": "吐出し弁からの漏れは高温ガスのシリンダ内逆流を招き、再圧縮熱の蓄積によって吐出しガス温度が著しく上昇し、油の炭化や弁の焼付きを引き起こす。よって記述は正しい。", "explanation": "吐出し弁からの漏れは高温ガスのシリンダ内逆流を招き、再圧縮熱の蓄積によって吐出しガス温度が著しく上昇し、油の炭化や弁の焼付きを引き起こす。よって記述は正しい。"}, {"id": 2490, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吸込み過熱度が適正値よりも過大になると、吸込み蒸気の比体積が増大して冷媒循環質量流量が減少し、冷凍能力が低下するとともに吐出しガス温度が上昇して過熱運転となる。", "answer": "○", "law": "吸込み過熱度が高すぎるとガス密度が低下して質量流量が落ち能力不足となり、圧縮開始温度の上昇により吐出しガス温度が異常過熱する。よって記述は正しい。", "explanation": "吸込み過熱度が高すぎるとガス密度が低下して質量流量が落ち能力不足となり、圧縮開始温度の上昇により吐出しガス温度が異常過熱する。よって記述は正しい。"}, {"id": 2491, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "停止中にクランクケース内の冷凍機油に多量の液冷媒が溶解する現象を寝込みといい、再起動時にクランクケース圧力が急低下すると油が激しく沸騰・発泡するオイルフォーミングが発生する。", "answer": "○", "law": "寝込み状態で起動すると急減圧により油中の冷媒が一気に突沸して発泡し、油ポンプのキャビテーションによる油圧喪失やシリンダへの油・液吸い込みによる液圧縮を招く。よって記述は正しい。", "explanation": "寝込み状態で起動すると急減圧により油中の冷媒が一気に突沸して発泡し、油ポンプのキャビテーションによる油圧喪失やシリンダへの油・液吸い込みによる液圧縮を招く。よって記述は正しい。"}, {"id": 2492, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "密閉形圧縮機において、吸込み蒸気の過熱度が大きくなっても電動機巻線は吸込み冷媒ガスによって十分に冷却されるため、巻線温度や吐出しガス温度が上昇することはない。", "answer": "×", "law": "密閉形圧縮機の電動機は吸込み冷媒蒸気の顕熱で冷却されているため、吸込みガス過熱度が大きくなるとモータ冷却能が低下し、巻線温度および吐出し温度が過昇してモータ焼損を招く。誤り。", "explanation": "密閉形圧縮機の電動機は吸込み冷媒蒸気の顕熱で冷却されているため、吸込みガス過熱度が大きくなるとモータ冷却能が低下し、巻線温度および吐出し温度が過昇してモータ焼損を招く。誤り。"}, {"id": 2493, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "水冷横形シェルアンドチューブ凝縮器において、冷却管内面にスケール（水あか）やスライムが付着すると、水側の熱抵抗が増大して熱通過率が低下し、同一凝縮負荷に対して凝縮温度と凝縮圧力が上昇する。", "answer": "○", "law": "スケール層は熱伝導率が極めて低いため伝熱抵抗となり、熱通過率を低下させて凝縮温度・凝縮圧力を上昇させ、圧縮機駆動動力を増大させる。よって記述は正しい。", "explanation": "スケール層は熱伝導率が極めて低いため伝熱抵抗となり、熱通過率を低下させて凝縮温度・凝縮圧力を上昇させ、圧縮機駆動動力を増大させる。よって記述は正しい。"}, {"id": 2494, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器の伝熱管やフィンに埃や油煙が付着して目詰まりを起こすと、通風抵抗の増大による風量減少と空気側熱伝達率の低下により、凝縮圧力が異常上昇して高圧カットアウトが作動することがある。", "answer": "○", "law": "フィンの目詰まりは空気流量を激減させ放熱を阻害するため、凝縮圧力が跳ね上がり、高圧遮断スイッチによる緊急停止や消費電力増加の原因となる。よって記述は正しい。", "explanation": "フィンの目詰まりは空気流量を激減させ放熱を阻害するため、凝縮圧力が跳ね上がり、高圧遮断スイッチによる緊急停止や消費電力増加の原因となる。よって記述は正しい。"}, {"id": 2495, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "凝縮器内に空気などの不凝縮ガスが混入すると、不凝縮ガスの分圧が全圧に加算されるとともに伝熱面への冷媒接触が妨げられ、凝縮温度・圧力が上昇して圧縮機動力を増加させる。", "answer": "○", "law": "不凝縮ガスは全圧（分圧の和）を押し上げるとともに、伝熱管表面に気体境膜を作って冷媒蒸気の凝縮熱伝達を激減させ、著しい圧力上昇と動力増大を招く。よって記述は正しい。", "explanation": "不凝縮ガスは全圧（分圧の和）を押し上げるとともに、伝熱管表面に気体境膜を作って冷媒蒸気の凝縮熱伝達を激減させ、著しい圧力上昇と動力増大を招く。よって記述は正しい。"}, {"id": 2496, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "受液器兼用の水冷シェルアンドチューブ凝縮器に冷媒を過充てんすると、凝縮器下部に過剰な液冷媒が滞留して冷却管が液没し、冷媒蒸気の凝縮に有効な伝熱面積が減少して凝縮圧力が上昇する。", "answer": "○", "law": "液面が上昇して冷却管が液中につかると気相凝縮のための有効伝熱面積が減少し、凝縮能力が低下して凝縮圧力・温度が異常上昇する。よって記述は正しい。", "explanation": "液面が上昇して冷却管が液中につかると気相凝縮のための有効伝熱面積が減少し、凝縮能力が低下して凝縮圧力・温度が異常上昇する。よって記述は正しい。"}, {"id": 2497, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "乾式蒸発器において、冷媒充てん量が不足すると蒸発器管内の液冷媒濡れ面積が減少して乾き領域が広がり、蒸発圧力が低下するとともに吸込み過熱度が異常に大きくなる。", "answer": "○", "law": "給液不足により蒸発器前半で冷媒が完全に気化してしまい、後半の気体接触部で過熱度のみが上昇するため、蒸発圧力の低下と冷却能力不足を招く。よって記述は正しい。", "explanation": "給液不足により蒸発器前半で冷媒が完全に気化してしまい、後半の気体接触部で過熱度のみが上昇するため、蒸発圧力の低下と冷却能力不足を招く。よって記述は正しい。"}, {"id": 2498, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "満液式シェルアンドチューブ水冷却器は管内を水が流れるため、運転中に蒸発温度が氷点下以下になって水が凍結した場合、乾式蒸発器に比べて冷却管が破裂破損する危険性が極めて高い。", "answer": "○", "law": "満液式は伝熱管の内側を水が流れるため、凍結時の体積膨張が管壁を直接加圧して管を破裂させる。管外（胴内）に水がある乾式に比べて破損事故の危険性が高い。よって記述は正しい。", "explanation": "満液式は伝熱管の内側を水が流れるため、凍結時の体積膨張が管壁を直接加圧して管を破裂させる。管外（胴内）に水がある乾式に比べて破損事故の危険性が高い。よって記述は正しい。"}, {"id": 2499, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "空気冷却用フィンコイル蒸発器において着霜が過度に進むと、空気流路が閉塞して風量が減少するとともに霜の断熱効果により熱通過率が低下し、蒸発圧力が低下して冷却不良となる。", "answer": "○", "law": "霜層の熱伝導率は小さく熱抵抗となり、さらにフィン間の通風を遮断して空気流量を減らすため、蒸発温度・圧力が低下して能力が激減する。よって記述は正しい。", "explanation": "霜層の熱伝導率は小さく熱抵抗となり、さらにフィン間の通風を遮断して空気流量を減らすため、蒸発温度・圧力が低下して能力が激減する。よって記述は正しい。"}, {"id": 2500, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "低温用蒸発器における温度自動膨張弁の感温筒は、冷媒液の温度を最も確実に検出できるよう、吸込み蒸発管ヘッダーなどの液冷媒が滞留しやすい箇所に取り付けるのが望ましい。", "answer": "×", "law": "感温筒は冷媒「蒸気」の過熱度を検出する装置であるため、液だまり部に取り付けると液温（飽和温度）を感知して弁が不当に閉じてしまう。液だまりを避けて設置する。誤り。", "explanation": "感温筒は冷媒「蒸気」の過熱度を検出する装置であるため、液だまり部に取り付けると液温（飽和温度）を感知して弁が不当に閉じてしまう。液だまりを避けて設置する。誤り。"}, {"id": 2501, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器の伝熱特性", "question": "熱交換器において、同一の伝熱面積および流体温度条件であれば、対向流（向流）のほうが並行流（並流）よりも対数平均温度差を大きく取ることができるため、伝熱上有利である。", "answer": "○", "law": "向流配置は高温流体と低温流体の局所温度差を熱交換器全域にわたって大きく均一に保てるため、対数平均温度差（LMTD）が大きくなり伝熱上有利である。よって記述は正しい。", "explanation": "向流配置は高温流体と低温流体の局所温度差を熱交換器全域にわたって大きく均一に保てるため、対数平均温度差（LMTD）が大きくなり伝熱上有利である。よって記述は正しい。"}, {"id": 2502, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器の伝熱特性", "question": "空気冷却用フィンチューブ熱交換器では、空気側の熱伝達率が冷媒側に比べて著しく小さいため、空気側にフィンを設けて伝熱面積を拡大することで全体の熱通過抵抗を低減させている。", "answer": "○", "law": "熱抵抗の大部分を占める空気側に多数のフィンを取り付けて伝熱面積を数倍〜十数倍に広げることで、空気側の熱伝達抵抗を効果的に下げている。よって記述は正しい。", "explanation": "熱抵抗の大部分を占める空気側に多数のフィンを取り付けて伝熱面積を数倍〜十数倍に広げることで、空気側の熱伝達抵抗を効果的に下げている。よって記述は正しい。"}, {"id": 2503, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器の伝熱特性", "question": "熱交換器の総括熱伝達率（熱通過率）を向上させるためには、直列に存在する熱伝達抵抗の中で最も抵抗値が小さい流体側の熱伝達率をさらに高めることが最も効果的である。", "answer": "×", "law": "熱通過抵抗は各抵抗の総和であるため、全体の伝熱を向上させるには直列抵抗の中で最も「大きい（ボトルネックとなっている）」側の抵抗を低減させる必要がある。誤り。", "explanation": "熱通過抵抗は各抵抗の総和であるため、全体の伝熱を向上させるには直列抵抗の中で最も「大きい（ボトルネックとなっている）」側の抵抗を低減させる必要がある。誤り。"}, {"id": 2504, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器の伝熱特性", "question": "水冷凝縮器などの伝熱管に用いられるローフィンチューブは、平滑管（裸管）に比べて管外表面積が拡大されており、冷媒蒸気の凝縮熱伝達を効率よく促進する。", "answer": "○", "law": "ローフィンチューブは管外面に一体成形された多数の低いフィンにより外表面積を約2.5〜3倍に広げ、管外での冷媒凝縮や沸騰の熱伝達率を向上させる。よって記述は正しい。", "explanation": "ローフィンチューブは管外面に一体成形された多数の低いフィンにより外表面積を約2.5〜3倍に広げ、管外での冷媒凝縮や沸騰の熱伝達率を向上させる。よって記述は正しい。"}, {"id": 2505, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "温度自動膨張弁は、蒸発器出口の冷媒蒸気の過熱度を感温筒で検知し、ダイヤフラムにかかる感温筒圧力と蒸発圧力およびばね力の釣り合いによって弁開度を自動調節する。", "answer": "○", "law": "感温筒圧力（開く力）と蒸発器圧力＋ばね力（閉じる力）の平衡によって弁開度を決め、設定過熱度を一定に保つように冷媒液を蒸発器へ供給する。よって記述は正しい。", "explanation": "感温筒圧力（開く力）と蒸発器圧力＋ばね力（閉じる力）の平衡によって弁開度を決め、設定過熱度を一定に保つように冷媒液を蒸発器へ供給する。よって記述は正しい。"}, {"id": 2506, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "蒸発器内の冷媒圧力損失が大きい設備に内部均圧形温度自動膨張弁を使用すると、圧力損失分だけ見かけの過熱度が大きくなり、蒸発器への冷媒供給不足や能力低下を招くため、外部均圧形を使用する。", "answer": "○", "law": "内部均圧形では弁出口の高い圧力がダイヤフラム下面にかかって弁を閉じる力として働くため過熱度が過大となる。蒸発器出口圧力を検出する外部均圧形が必要である。よって記述は正しい。", "explanation": "内部均圧形では弁出口の高い圧力がダイヤフラム下面にかかって弁を閉じる力として働くため過熱度が過大となる。蒸発器出口圧力を検出する外部均圧形が必要である。よって記述は正しい。"}, {"id": 2507, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "温度自動膨張弁の感温筒を垂直吸込み管に取り付ける場合は、感温筒内の液状チャージ媒体がキャピラリーチューブ側に流出して誤作動するのを防ぐため、キャピラリーチューブを上側にして取り付ける。", "answer": "○", "law": "感温筒を垂直管に設置する際は、感温筒内の液媒体が常に感温筒本体側にとどまるよう、接続キャピラリを上方に向けて設置する。よって記述は正しい。", "explanation": "感温筒を垂直管に設置する際は、感温筒内の液媒体が常に感温筒本体側にとどまるよう、接続キャピラリを上方に向けて設置する。よって記述は正しい。"}, {"id": 2508, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "キャピラリーチューブは、内径が細く長い金属管の流動摩擦抵抗を利用して減圧膨張させる固定絞り装置であり、熱負荷変動に対する自己調整範囲が広いため大容量冷凍装置に広く用いられる。", "answer": "×", "law": "キャピラリーチューブは絞り抵抗が固定されており自己調整機能が狭いため、家庭用冷蔵庫や小形ルームエアコンなど負荷変動が比較的小さい小容量装置に限定して用いられる。誤り。", "explanation": "キャピラリーチューブは絞り抵抗が固定されており自己調整機能が狭いため、家庭用冷蔵庫や小形ルームエアコンなど負荷変動が比較的小さい小容量装置に限定して用いられる。誤り。"}, {"id": 2509, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "蒸発圧力調整弁（EPR）は蒸発器出口配管に設置され、蒸発器内の圧力が設定値以下に低下しないように制御することで、水冷却器の凍結や被冷却物の過冷却を防止する。", "answer": "○", "law": "EPRは入口側圧力を検知し、蒸発器圧力が設定値以下に下がると弁を絞って蒸発圧力の下限を保持する。よって記述は正しい。", "explanation": "EPRは入口側圧力を検知し、蒸発器圧力が設定値以下に下がると弁を絞って蒸発圧力の下限を保持する。よって記述は正しい。"}, {"id": 2510, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "吸入圧力調整弁（SPR）は圧縮機吸込み配管に設置され、圧縮機起動時やデフロスト復帰時などの高負荷時に吸込み圧力が設定値を超えて過大になるのを防ぎ、電動機の過負荷トリップを防止する。", "answer": "○", "law": "SPR（クランクケース圧力調整弁）は出口側圧力を感知して絞り動作を行い、過大な吸込み圧力が圧縮機に作用してモータが過電流遮断されるのを防ぐ。よって記述は正しい。", "explanation": "SPR（クランクケース圧力調整弁）は出口側圧力を感知して絞り動作を行い、過大な吸込み圧力が圧縮機に作用してモータが過電流遮断されるのを防ぐ。よって記述は正しい。"}, {"id": 2511, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "空冷凝縮器用などの凝縮圧力調整弁は、冬期の低外気温時に凝縮器内に液冷媒を滞留させて有効伝熱面積を縮小させ、凝縮圧力が下がりすぎるのを防止する。", "answer": "○", "law": "冬季の凝縮圧力過低下による膨張弁前後の差圧不足を防ぐため、凝縮器出口を絞って液を滞留させ、有効伝熱面積を狭めて凝縮圧力を維持する。よって記述は正しい。", "explanation": "冬季の凝縮圧力過低下による膨張弁前後の差圧不足を防ぐため、凝縮器出口を絞って液を滞留させ、有効伝熱面積を狭めて凝縮圧力を維持する。よって記述は正しい。"}, {"id": 2512, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "水冷凝縮器の冷却水調整弁（制水弁）は、凝縮圧力が上昇した際に弁開度を狭めて冷却水量を減少させ、凝縮温度を上げるように動作する。", "answer": "×", "law": "制水弁は凝縮圧力が上がると弁を「開いて」冷却水量を増加させ、放熱を促して凝縮圧力を正常値まで引き下げる。「弁開度を狭め水量を減少させる」は動作が逆であり誤り。", "explanation": "制水弁は凝縮圧力が上がると弁を「開いて」冷却水量を増加させ、放熱を促して凝縮圧力を正常値まで引き下げる。「弁開度を狭め水量を減少させる」は動作が逆であり誤り。"}, {"id": 2513, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "イ", "theme": "制御機器・保護装置", "question": "高圧遮断圧力スイッチ（高圧カットアウト）は、冷却水断水や送風機停止などの異常高圧時に安全弁作動前に圧縮機を停止させる重要保安装置であり、原則として手動復帰形とする。", "answer": "○", "law": "高圧カットアウトは安全弁吹始め圧力より低い設定値で作動して圧縮機を緊急停止させ、原因確認前の自動再始動を防ぐため手動復帰形（マニュアルリセット）が義務付けられる。よって記述は正しい。", "explanation": "高圧カットアウトは安全弁吹始め圧力より低い設定値で作動して圧縮機を緊急停止させ、原因確認前の自動再始動を防ぐため手動復帰形（マニュアルリセット）が義務付けられる。よって記述は正しい。"}, {"id": 2514, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器・保護装置", "question": "低圧遮断圧力スイッチ（低圧カットアウト）は、冷媒漏洩や配管閉塞による吸込み圧力の異常低下時に圧縮機を停止させる保護装置であり、またサーモスタット連動のポンプダウン制御にも利用される。", "answer": "○", "law": "低圧カットアウトは異常低下時の空気吸込みや真空運転によるモータ絶縁破壊を防ぐとともに、自動発停のポンプダウン運転回路の主スイッチとしても機能する。よって記述は正しい。", "explanation": "低圧カットアウトは異常低下時の空気吸込みや真空運転によるモータ絶縁破壊を防ぐとともに、自動発停のポンプダウン運転回路の主スイッチとしても機能する。よって記述は正しい。"}, {"id": 2515, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器・保護装置", "question": "油圧保護圧力スイッチ（OPS）に内蔵されるタイムディレイ（遅延タイマ）は、圧縮機始動時の油圧立ち上がり待ちや、運転中の瞬間的な油圧変動による不必要な停止（誤トリップ）を防ぐために設けられている。", "answer": "○", "law": "起動直後や一時的な油圧低下で直ちに停止しないよう約60〜90秒の時限回路が組み込まれており、安定した運転と軸受焼付き保護を両立させている。よって記述は正しい。", "explanation": "起動直後や一時的な油圧低下で直ちに停止しないよう約60〜90秒の時限回路が組み込まれており、安定した運転と軸受焼付き保護を両立させている。よって記述は正しい。"}, {"id": 2516, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器・保護装置", "question": "水冷式冷凍装置に設置されるフロースイッチは、冷却水管内の温度変化を検知して作動するものであり、冷却水の流水停止（断水）を検知する機能はない。", "answer": "×", "law": "フロースイッチは管内の水流（パドル受圧や差圧）を直接検知する流量スイッチであり、断水時に即座に圧縮機をインターロック停止させる。誤り。", "explanation": "フロースイッチは管内の水流（パドル受圧や差圧）を直接検知する流量スイッチであり、断水時に即座に圧縮機をインターロック停止させる。誤り。"}, {"id": 2517, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "油分離器は、圧縮機吐出しガス中に混入した冷凍機油を分離捕集してクランクケースへ戻す機器であり、特にアンモニアのように油と冷媒が非相溶である装置や配管が長い装置に設置される。", "answer": "○", "law": "油分離器は吐出しガスから油を衝突・遠心力等で分離して回収し、熱交換器への油膜付着による伝熱阻害や圧縮機の油枯渇を未然に防止する。よって記述は正しい。", "explanation": "油分離器は吐出しガスから油を衝突・遠心力等で分離して回収し、熱交換器への油膜付着による伝熱阻害や圧縮機の油枯渇を未然に防止する。よって記述は正しい。"}, {"id": 2518, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器（液レシーバ）は、凝縮器と膨張弁の間の液配管に設置され、液封破壊事故を防ぐため、受液器容量の80%以内で全冷媒を回収できる容積設計とする。", "answer": "○", "law": "受液器は回収時にも20%以上の気相空間（安全余裕スペース）を残すため、最大充填回収量は内容積の80%以下に設計・制限される。よって記述は正しい。", "explanation": "受液器は回収時にも20%以上の気相空間（安全余裕スペース）を残すため、最大充填回収量は内容積の80%以下に設計・制限される。よって記述は正しい。"}, {"id": 2519, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "フィルタドライヤは、冷媒配管内の固形異物を除くストレーナ機能と、水分を吸着除去する乾燥剤コア（モレキュラーシーブ等）を一体化したものであり、フルオロカーボン冷媒装置の液管に設置される。", "answer": "○", "law": "フルオロカーボン装置では水分混入によるアイスプラグや加水分解による酸生成を防ぐため、合成ゼオライト等の乾燥剤とゴミ濾過フィルタを内蔵したドライヤを設置する。よって記述は正しい。", "explanation": "フルオロカーボン装置では水分混入によるアイスプラグや加水分解による酸生成を防ぐため、合成ゼオライト等の乾燥剤とゴミ濾過フィルタを内蔵したドライヤを設置する。よって記述は正しい。"}, {"id": 2520, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "吸込み液分離器（アキュムレータ）は、低圧吸込み配管に設けられ、蒸発器から戻る未蒸発液冷媒を重力沈降により分離して圧縮機への液バックを防止し、底部に溜まった大量の冷媒液を一気に圧縮機へ吸込ませる構造である。", "answer": "×", "law": "アキュムレータのU字管底部にあるのは微小なオリフィス孔であり、少量の油と液を霧状に徐々に吸入させる。大量の冷媒液を一気に送り込むと液圧縮を起こすため誤り。", "explanation": "アキュムレータのU字管底部にあるのは微小なオリフィス孔であり、少量の油と液を霧状に徐々に吸入させる。大量の冷媒液を一気に送り込むと液圧縮を起こすため誤り。"}, {"id": 2521, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "イ", "theme": "附属機器・冷凍サイクル", "question": "フルオロカーボン冷凍装置に用いられる液ガス熱交換器は、凝縮器からの高圧冷媒液を過冷却して液管内でのフラッシュガス発生を防ぎ、同時に吸込み蒸気を過熱して湿り圧縮を防止する。", "answer": "○", "law": "液ガス熱交により液側は過冷却されて気泡発生を防ぎ、ガス側は過熱度を得てコンプレッサの液圧縮を防止するという二大メリットを持つ。よって記述は正しい。", "explanation": "液ガス熱交により液側は過冷却されて気泡発生を防ぎ、ガス側は過熱度を得てコンプレッサの液圧縮を防止するという二大メリットを持つ。よって記述は正しい。"}, {"id": 2522, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器・冷凍サイクル", "question": "二段圧縮冷凍サイクルにおいて、中間冷却器（インタークーラ）で低段吐出しガスを中間温度まで減温冷却することにより、高段圧縮機の吐出しガス温度の上昇を抑制し、圧縮動力を低減できる。", "answer": "○", "law": "中間冷却により高段吸込み蒸気の比体積が縮小して高段圧縮動力が減り、吐出しガス温度も大幅に抑えられて圧縮機油の炭化・劣化を防ぐことができる。よって記述は正しい。", "explanation": "中間冷却により高段吸込み蒸気の比体積が縮小して高段圧縮動力が減り、吐出しガス温度も大幅に抑えられて圧縮機油の炭化・劣化を防ぐことができる。よって記述は正しい。"}, {"id": 2523, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器・冷凍サイクル", "question": "二元冷凍サイクルは、超低温を得るために沸点の異なる2種類の冷媒を用い、高温側サイクルの蒸発器と低温側サイクルの凝縮器をカスケードコンデンサ（凝縮蒸発器）で熱結合させた方式である。", "answer": "○", "law": "単一冷媒では圧力比が過大となり凝固や超高圧化を起こす超低温域において、高温側と低温側の2独立回路を熱交換器で結ぶ二元サイクルが採用される。よって記述は正しい。", "explanation": "単一冷媒では圧力比が過大となり凝固や超高圧化を起こす超低温域において、高温側と低温側の2独立回路を熱交換器で結ぶ二元サイクルが採用される。よって記述は正しい。"}, {"id": 2524, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器・冷凍サイクル", "question": "自動不凝縮ガスパージャは、系内の不凝縮ガスを一切冷却することなく、高圧受液器からそのまま全量大気中へ直放出して処理する機器である。", "answer": "×", "law": "不凝縮ガス分離器は本体内で冷媒蒸気を冷却液化させて系統へ戻し、凝縮しない空気等のガスのみを分離排気する。冷却せずに直放出するわけではないため誤り。", "explanation": "不凝縮ガス分離器は本体内で冷媒蒸気を冷却液化させて系統へ戻し、凝縮しない空気等のガスのみを分離排気する。冷却せずに直放出するわけではないため誤り。"}, {"id": 2525, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管の施工と保守", "question": "圧縮機から凝縮器へ至る吐出しガス配管は、圧縮機停止中に配管内で凝縮した液冷媒や同伴した油が圧縮機シリンダヘッドへ逆流しないよう、立ち上がり管を設けた後、凝縮器へ向かって下がり勾配で配管する。", "answer": "○", "law": "吐出し配管は停止時の液冷媒や油の圧縮機逆流による始動時液圧縮を防ぐため、立上がりループを設けた上で凝縮器側へ下がり勾配（1/100〜1/200程度）で施工する。よって記述は正しい。", "explanation": "吐出し配管は停止時の液冷媒や油の圧縮機逆流による始動時液圧縮を防ぐため、立上がりループを設けた上で凝縮器側へ下がり勾配（1/100〜1/200程度）で施工する。よって記述は正しい。"}, {"id": 2526, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管の施工と保守", "question": "立上がり吸込み配管（サクションライザー）では、最小負荷運転時においても油を冷媒蒸気の上昇流によって上方へ同伴できるよう、最小ガス流速を確保するかオイルトラップを設ける。", "answer": "○", "law": "ガス流速が遅すぎると油が管壁を流下・滞留して油戻り不良となるため、最小負荷時でも適正な流速を保てるよう管径選定やダブルライザー等の工夫を施す。よって記述は正しい。", "explanation": "ガス流速が遅すぎると油が管壁を流下・滞留して油戻り不良となるため、最小負荷時でも適正な流速を保てるよう管径選定やダブルライザー等の工夫を施す。よって記述は正しい。"}, {"id": 2527, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管の施工と保守", "question": "銅管配管のろう付け接合において、管内に微量な乾燥窒素ガスを通気しながら加熱接合する窒素置換工法を行うことにより、管内面の黒色酸化スケールの発生を防止する。", "answer": "○", "law": "無酸素雰囲気を作る窒素ブローを行わずにろう付けすると管内に酸化銅スケールが生成し、運転後に剥離して膨張弁や電磁弁を閉塞させるため必須の工法である。よって記述は正しい。", "explanation": "無酸素雰囲気を作る窒素ブローを行わずにろう付けすると管内に酸化銅スケールが生成し、運転後に剥離して膨張弁や電磁弁を閉塞させるため必須の工法である。よって記述は正しい。"}, {"id": 2528, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管の施工と保守", "question": "電磁弁や逆止め弁などで両端が密閉封鎖される可能性のある液冷媒配管区間では、外気等からの受熱による液の熱膨張によって内圧が異常上昇し配管や弁が破損する液封事故に注意する。", "answer": "○", "law": "非圧縮性である液冷媒が閉じ込められた状態で加熱されると膨張圧により数百気圧に達し弁や管が破裂するため、所定の圧力逃がし装置を設ける。よって記述は正しい。", "explanation": "非圧縮性である液冷媒が閉じ込められた状態で加熱されると膨張圧により数百気圧に達し弁や管が破裂するため、所定の圧力逃がし装置を設ける。よって記述は正しい。"}, {"id": 2529, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "冷媒設備に設置するスプリング式安全弁は、設備の許容圧力以下の吹出し圧力で作動するように設定し、作動時に圧力を許容圧力以下に確実に復帰させる能力を有するものでなければならない。", "answer": "○", "law": "安全弁のセット圧力は設備の許容圧力（設計圧力）以下とし、異常圧力を速やかに逃がして設備破壊を防止し、降圧後は自動的に再着座復帰する。よって記述は正しい。", "explanation": "安全弁のセット圧力は設備の許容圧力（設計圧力）以下とし、異常圧力を速やかに逃がして設備破壊を防止し、降圧後は自動的に再着座復帰する。よって記述は正しい。"}, {"id": 2530, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "圧力容器用安全弁の最小口径は、冷媒ガスの種類に応じた定数、圧力容器の外径および全長に基づいて算出される計算式により決定される。", "answer": "○", "law": "圧力容器用安全弁の最小口径式 d3 = C3 * sqrt(D * L) において、受熱面積（外径D×全長L）と冷媒定数C3から必要な逃がし流量が確保される。よって記述は正しい。", "explanation": "圧力容器用安全弁の最小口径式 d3 = C3 * sqrt(D * L) において、受熱面積（外径D×全長L）と冷媒定数C3から必要な逃がし流量が確保される。よって記述は正しい。"}, {"id": 2531, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "可溶栓（溶栓）は所定の温度で低融点合金が溶融して圧力を逃がす安全装置であり、作動すると全開状態を維持するため、アンモニア冷凍装置の主安全弁として最も推奨される。", "answer": "×", "law": "溶栓は非復帰型であり全量大気放出に至るため、毒性ガスや可燃性ガスであるアンモニア設備への使用は法令上禁止されている。誤り。", "explanation": "溶栓は非復帰型であり全量大気放出に至るため、毒性ガスや可燃性ガスであるアンモニア設備への使用は法令上禁止されている。誤り。"}, {"id": 2532, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "アンモニアを冷媒とする高圧冷媒設備の安全弁から排出されるガスは、強烈な毒性と引火性をもつため、大気開放とせず水散水式除害設備や吸収水槽へ導いて無害化処理する。", "answer": "○", "law": "アンモニアは水への溶解度が極めて高いため、放出管下流に水槽や除害洗浄塔を設置してアンモニアガスを水に吸収・中和させ、大気拡散による災害を防止する。よって記述は正しい。", "explanation": "アンモニアは水への溶解度が極めて高いため、放出管下流に水槽や除害洗浄塔を設置してアンモニアガスを水に吸収・中和させ、大気拡散による災害を防止する。よって記述は正しい。"}, {"id": 2533, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験・溶接部試験", "question": "配管以外の冷媒設備本体に行う耐圧試験圧力は、水等の安全な液体を使用する場合は許容圧力の1.5倍以上、空気や窒素等の気体を使用する場合は許容圧力の1.25倍以上である。", "answer": "○", "law": "高圧ガス保安法および冷凍保安規則により、液体耐圧試験は許容圧力の1.5倍以上、気体耐圧試験（液体使用困難時）は許容圧力の1.25倍以上と規定されている。よって記述は正しい。", "explanation": "高圧ガス保安法および冷凍保安規則により、液体耐圧試験は許容圧力の1.5倍以上、気体耐圧試験（液体使用困難時）は許容圧力の1.25倍以上と規定されている。よって記述は正しい。"}, {"id": 2534, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験・溶接部試験", "question": "気密試験は、耐圧強度が確認された冷媒設備全体について、許容圧力以上の試験圧力で窒素ガス等の乾燥気体を用いて加圧し、接合部からの漏れがないことを確認する。", "answer": "○", "law": "気密試験は耐圧試験合格後の設備に対し、許容圧力以上の不活性ガス圧を加えて発泡液塗布や検知器等により漏洩のないことを確かめる。よって記述は正しい。", "explanation": "気密試験は耐圧試験合格後の設備に対し、許容圧力以上の不活性ガス圧を加えて発泡液塗布や検知器等により漏洩のないことを確かめる。よって記述は正しい。"}, {"id": 2535, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験・溶接部試験", "question": "気密試験用ガスとして純酸素を使用することは、配管内の微量な潤滑油と高圧下で急激に反応して自然発火・ディーゼル爆発を引き起こすため、固く禁止されている。", "answer": "○", "law": "酸素は強い支燃性をもち、油分と接触加圧されると自己発火・爆発事故を誘発するため、試験ガスには必ず高純度乾燥窒素等の不活性ガスを使用する。よって記述は正しい。", "explanation": "酸素は強い支燃性をもち、油分と接触加圧されると自己発火・爆発事故を誘発するため、試験ガスには必ず高純度乾燥窒素等の不活性ガスを使用する。よって記述は正しい。"}, {"id": 2536, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験・溶接部試験", "question": "真空乾燥（真空引き）作業において、真空ポンプ停止後に真空放置試験を行い、圧力計の指示値が周囲温度の上昇に伴って著しく低下した場合は、系内に外気が漏入している証拠である。", "answer": "×", "law": "外気が漏入（リーク）している場合は圧力計の指示値は「上昇」する。温度上昇で圧力が低下するという記述自体が物理法則にも矛盾しており誤り。", "explanation": "外気が漏入（リーク）している場合は圧力計の指示値は「上昇」する。温度上昇で圧力が低下するという記述自体が物理法則にも矛盾しており誤り。"}, {"id": 2537, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "イ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "圧縮機を据え付けるコンクリート基礎は、十分な強度と質量をもたせ、通常は機器本体質量の1〜3倍程度の質量を確保して運転時の振動や共振を抑制する。", "answer": "○", "law": "往復動機械等の不平衡慣性力による加振力を減衰させるため、十分な質量と剛性をもつ慣性ブロック基礎にアンカーボルトで強固に固定する。よって記述は正しい。", "explanation": "往復動機械等の不平衡慣性力による加振力を減衰させるため、十分な質量と剛性をもつ慣性ブロック基礎にアンカーボルトで強固に固定する。よって記述は正しい。"}, {"id": 2538, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "ロ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "試運転前の確認項目として、電源電圧の不平衡、電動機の回転方向（三相結線の相順）、各止め弁の開閉状態、クランクケースの油面レベル、および保護継電器の作動設定値などを点検する。", "answer": "○", "law": "逆回転による圧縮機破損防止のための相順確認、閉塞運転防止のための弁開閉確認、過電流・油圧保護設定値の確認等は試運転前の極めて重要な保安点検項目である。よって記述は正しい。", "explanation": "逆回転による圧縮機破損防止のための相順確認、閉塞運転防止のための弁開閉確認、過電流・油圧保護設定値の確認等は試運転前の極めて重要な保安点検項目である。よって記述は正しい。"}, {"id": 2539, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "ハ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "HFC系冷媒であるR410Aは、ジフルオロメタン（R32）とペンタフルオロエタン（R125）の等質量混合冷媒であり、疑似共沸混合冷媒であるため温度勾配（温度グライド）は実質的にほとんど無視できる。", "answer": "○", "law": "R410Aは擬似共沸（疑似共沸）混合冷媒であり、気液平衡時の温度グライドが約0.1K程度と極めて小さいため、ほぼ単一冷媒と同様の挙動を示す。よって記述は正しい。", "explanation": "R410Aは擬似共沸（疑似共沸）混合冷媒であり、気液平衡時の温度グライドが約0.1K程度と極めて小さいため、ほぼ単一冷媒と同様の挙動を示す。よって記述は正しい。"}, {"id": 2540, "subject": "保安管理", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "ニ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "アンモニア冷凍装置の運転において、冷媒系統内に混入した冷凍機油はアンモニア冷媒液よりも密度が小さいため、低圧受液器や油溜め器の液面上部に浮上し、上部液面から油抜き弁を介して回収される。", "answer": "×", "law": "鉱油系冷凍機油の密度（比重約0.9）は液化アンモニアの密度（比重約0.6〜0.68）よりも「重い（大きい）」ため、容器の「底部」に沈降する。底部から油抜きを行うため「上部に浮上し上部から回収」は誤り。", "explanation": "鉱油系冷凍機油の密度（比重約0.9）は液化アンモニアの密度（比重約0.6〜0.68）よりも「重い（大きい）」ため、容器の「底部」に沈降する。底部から油抜きを行うため「上部に浮上し上部から回収」は誤り。"}, {"id": 2541, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "多気筒往復圧縮機において、ピストン押しのけ量は、気筒の内径、ピストンストローク、気筒数および回転速度によって幾何学的に定まり、吸込み弁や吐出し弁の流動抵抗による圧力損失の影響を受けない。", "answer": "○", "law": "ピストン押しのけ量（幾何学的理論吐出し量）は気筒寸法、行程、気筒数、回転速度のみで幾何学的に決定され、弁抵抗や圧力損失の影響を受けない。よって記述は正しい。", "explanation": "ピストン押しのけ量（幾何学的理論吐出し量）は気筒寸法、行程、気筒数、回転速度のみで幾何学的に決定され、弁抵抗や圧力損失の影響を受けない。よって記述は正しい。"}, {"id": 2542, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "ツインスクリュー圧縮機は、ケーシング内に多量の潤滑油を噴射してロータ間やケーシングとの微小な隙間を密閉するとともに、圧縮熱を冷却して吐出しガス温度の上昇を抑制する油冷式が一般的である。", "answer": "○", "law": "給油式（油冷式）スクリュー圧縮機では、多量に噴射される冷凍機油がシール作用、潤滑作用とともに冷却作用を果たし、高い圧力比でも吐出し温度を低く抑えることができる。よって記述は正しい。", "explanation": "給油式（油冷式）スクリュー圧縮機では、多量に噴射される冷凍機油がシール作用、潤滑作用とともに冷却作用を果たし、高い圧力比でも吐出し温度を低く抑えることができる。よって記述は正しい。"}, {"id": 2543, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は、旋回スクロールが自転しながら公転運動を行うことにより、外周の吸込み口から吸入した冷媒を中心の吐出し口へ向かって容積圧縮する機構である。", "answer": "×", "law": "スクロール圧縮機の旋回スクロールはオルダム継手等の自転防止機構により「自転せずに公転運動のみ」を行う。自転させると吸込み室が形成されないため誤り。", "explanation": "スクロール圧縮機の旋回スクロールはオルダム継手等の自転防止機構により「自転せずに公転運動のみ」を行う。自転させると吸込み室が形成されないため誤り。"}, {"id": 2544, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、羽根車（インペラ）の高速回転により冷媒蒸気に速度エネルギーを与え、ディフューザ等で静圧に変換する流体機械であり、大容量の空気調和用や大規模冷凍設備に適している。", "answer": "○", "law": "遠心（ターボ）圧縮機は多量の冷媒蒸気を連続的に扱う大容量用途に適しており、ビル空調や地域冷暖房、大規模化学プラント等に広く用いられる。よって記述は正しい。", "explanation": "遠心（ターボ）圧縮機は多量の冷媒蒸気を連続的に扱う大容量用途に適しており、ビル空調や地域冷暖房、大規模化学プラント等に広く用いられる。よって記述は正しい。"}, {"id": 2545, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "インバータを用いて圧縮機駆動電動機の電源周波数を変化させる容量制御では、熱負荷の変動に応じて回転速度を変化させることで冷媒循環量を連続的に制御できる。", "answer": "○", "law": "インバータ制御は電源周波数を連続的に変えて回転速度を制御し、部分負荷時における無駄な電力消費や発停損失を抑え、高い省エネ性を発揮する。よって記述は正しい。", "explanation": "インバータ制御は電源周波数を連続的に変えて回転速度を制御し、部分負荷時における無駄な電力消費や発停損失を抑え、高い省エネ性を発揮する。よって記述は正しい。"}, {"id": 2546, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "多気筒往復圧縮機のアンローダ機構は、吸込み弁板を弁座に強く押し付けて密閉することにより、その気筒への冷媒ガスの吸込みを完全に遮断してアンロード状態にする。", "answer": "×", "law": "アンローダ機構はアンローダピン等によって吸込み弁板を「押し上げて開放状態に保持」し、ピストンが動いてもガスを圧縮させずに吸込み側へ素通りさせる。「弁座に強く押し付けて密閉する」は誤り。", "explanation": "アンローダ機構はアンローダピン等によって吸込み弁板を「押し上げて開放状態に保持」し、ピストンが動いてもガスを圧縮させずに吸込み側へ素通りさせる。「弁座に強く押し付けて密閉する」は誤り。"}, {"id": 2547, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "ツインスクリュー圧縮機では、スライド弁を軸方向に移動させて吸込み閉込み開始位置を変化させることにより、広範囲で滑らかな連続容量制御を行うことができる。", "answer": "○", "law": "スライド弁を軸方向にスライドさせると吸入ガスの一部が圧縮されずに吸込み側へバイパスされ、実効圧縮行程が変わるため無段階に容量を調節できる。よって記述は正しい。", "explanation": "スライド弁を軸方向にスライドさせると吸入ガスの一部が圧縮されずに吸込み側へバイパスされ、実効圧縮行程が変わるため無段階に容量を調節できる。よって記述は正しい。"}, {"id": 2548, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパスによる容量制御は、蒸発器熱負荷が減少した際に低圧側の圧力低下を防ぐことができるが、圧縮機の消費動力を負荷減少に応じて大幅に低減させる省エネ効果は小さい。", "answer": "○", "law": "ホットガスバイパスは蒸発圧力の維持や凍結防止には有効であるが、圧縮機自体はガスを圧縮循環し続けるため動力低減効果は極めて小さく、省エネ手法ではない。よって記述は正しい。", "explanation": "ホットガスバイパスは蒸発圧力の維持や凍結防止には有効であるが、圧縮機自体はガスを圧縮循環し続けるため動力低減効果は極めて小さく、省エネ手法ではない。よって記述は正しい。"}, {"id": 2549, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の吸込み弁板に亀裂や破損が生じると、ピストンの圧縮行程中にシリンダ内の冷媒ガスが吸込み側へ逆流するため、体積効率が大幅に低下する。", "answer": "○", "law": "吸込み弁の密閉不良は圧縮途中の高圧ガスが吸込みキャビティへ吹き抜ける現象を引き起こし、実際の吐出しガス量が激減して体積効率が大きく低下する。よって記述は正しい。", "explanation": "吸込み弁の密閉不良は圧縮途中の高圧ガスが吸込みキャビティへ吹き抜ける現象を引き起こし、実際の吐出しガス量が激減して体積効率が大きく低下する。よって記述は正しい。"}, {"id": 2550, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吸込み過熱度が適正値よりも過大になると、吸込み蒸気の比体積が増大して冷媒循環質量流量が減少し、冷凍能力の低下を招くとともに吐出しガス温度が異常上昇する。", "answer": "○", "law": "吸込み過熱度が高すぎると密度が低下して質量流量が落ち能力が低下し、さらに断熱圧縮後の吐出し温度が過昇して油の炭化や弁破損を招く。よって記述は正しい。", "explanation": "吸込み過熱度が高すぎると密度が低下して質量流量が落ち能力が低下し、さらに断熱圧縮後の吐出し温度が過昇して油の炭化や弁破損を招く。よって記述は正しい。"}, {"id": 2551, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "停止中にクランクケース内の冷凍機油に冷媒が多量に溶解する現象を寝込みといい、再始動時に急激な圧力降下が起こると油が激しく発泡するオイルフォーミングが発生する。", "answer": "○", "law": "寝込み状態で圧縮機が起動すると減圧により油中の冷媒が一気に突沸して泡立ち、油ポンプの油圧低下やシリンダへの油吸い込みによる液圧縮を引き起こす。よって記述は正しい。", "explanation": "寝込み状態で圧縮機が起動すると減圧により油中の冷媒が一気に突沸して泡立ち、油ポンプの油圧低下やシリンダへの油吸い込みによる液圧縮を引き起こす。よって記述は正しい。"}, {"id": 2552, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "密閉形圧縮機において、吸込み蒸気の過熱度が多少大きくなっても、電動機巻線は冷媒ガスによって十分に冷却されるため、吐出しガス温度や巻線温度が上昇することはない。", "answer": "×", "law": "密閉形圧縮機の電動機は吸込み冷媒ガスで冷却されているため、吸込みガス温度（過熱度）が高くなるとモータ巻線の冷却が不十分になり、巻線焼損や過熱運転を招く。誤り。", "explanation": "密閉形圧縮機の電動機は吸込み冷媒ガスで冷却されているため、吸込みガス温度（過熱度）が高くなるとモータ巻線の冷却が不十分になり、巻線焼損や過熱運転を招く。誤り。"}, {"id": 2553, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "水冷シェルアンドチューブ凝縮器において、伝熱管内にスケールが付着すると水側の熱伝達抵抗が増大し、一定の凝縮負荷に対して凝縮温度と凝縮圧力が上昇する。", "answer": "○", "law": "スケール層の熱伝導率は金属管に比べて極めて小さいため熱通過率が低下し、所定の放熱を行うために水と冷媒の温度差が広がり凝縮圧力・温度が上昇する。よって記述は正しい。", "explanation": "スケール層の熱伝導率は金属管に比べて極めて小さいため熱通過率が低下し、所定の放熱を行うために水と冷媒の温度差が広がり凝縮圧力・温度が上昇する。よって記述は正しい。"}, {"id": 2554, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器において、冬期に外気温が著しく低下して凝縮圧力が低下しすぎると、温度自動膨張弁前後の圧力差が不足し、蒸発器への冷媒供給不足を引き起こす。", "answer": "○", "law": "膨張弁は高低圧の圧力差によって冷媒を流すため、冬場の過冷却・低凝縮圧力は差圧不足となって流量低下、蒸発圧力異常低下、冷却能力不足を招く。よって記述は正しい。", "explanation": "膨張弁は高低圧の圧力差によって冷媒を流すため、冬場の過冷却・低凝縮圧力は差圧不足となって流量低下、蒸発圧力異常低下、冷却能力不足を招く。よって記述は正しい。"}, {"id": 2555, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "冷媒系統内に混入した空気などの不凝縮ガスは、凝縮温度を低下させる効果があるため、高圧部の圧力計指示値を下げる働きをする。", "answer": "×", "law": "不凝縮ガスは冷媒蒸気の凝縮熱伝達を妨げて凝縮温度を上昇させ、さらに自身の分圧が加わるため、凝縮圧力（全圧）は著しく上昇する。「指示値を下げる」は誤り。", "explanation": "不凝縮ガスは冷媒蒸気の凝縮熱伝達を妨げて凝縮温度を上昇させ、さらに自身の分圧が加わるため、凝縮圧力（全圧）は著しく上昇する。「指示値を下げる」は誤り。"}, {"id": 2556, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "受液器兼用の水冷シェルアンドチューブ凝縮器に冷媒を過充てんすると、余分な冷媒液が凝縮器下部に溜まって多数の冷却管を液没させ、凝縮に有効な伝熱面積を減少させる。", "answer": "○", "law": "過充てんにより凝縮器内の液位が上がると、冷媒蒸気の凝縮に使える冷却管の露出面積（有効伝熱面積）が減り、凝縮温度・圧力の上昇を招く。よって記述は正しい。", "explanation": "過充てんにより凝縮器内の液位が上がると、冷媒蒸気の凝縮に使える冷却管の露出面積（有効伝熱面積）が減り、凝縮温度・圧力の上昇を招く。よって記述は正しい。"}, {"id": 2557, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "乾式蒸発器において、冷媒充てん量が不足すると、伝熱管内の冷媒液が早期に蒸発完了して管内の乾き領域（過熱蒸気域）が拡大し、蒸発圧力が低下して能力不足となる。", "answer": "○", "law": "冷媒不足時は伝熱管後半の気体接触部が広がり、気体の低い熱伝達率により熱通過率が低下し、蒸発温度・圧力が低下して吸込み過熱度が異常に大きくなる。よって記述は正しい。", "explanation": "冷媒不足時は伝熱管後半の気体接触部が広がり、気体の低い熱伝達率により熱通過率が低下し、蒸発温度・圧力が低下して吸込み過熱度が異常に大きくなる。よって記述は正しい。"}, {"id": 2558, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "満液式シェルアンドチューブ水冷却器において、管内の水流速が過度に遅い場合、層流化して熱伝達率が低下するだけでなく、水の一部が氷結して伝熱管を破損する危険が増大する。", "answer": "○", "law": "満液式では水流が滞留・層流化すると管壁近傍で局所的な氷結が起きやすく、管内凍結破裂に至るため、所定の流速維持と断水・低流量検知器（フロースイッチ）が必須である。よって記述は正しい。", "explanation": "満液式では水流が滞留・層流化すると管壁近傍で局所的な氷結が起きやすく、管内凍結破裂に至るため、所定の流速維持と断水・低流量検知器（フロースイッチ）が必須である。よって記述は正しい。"}, {"id": 2559, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "空気冷却用フィンコイル蒸発器において、霜が厚く付着すると熱伝導抵抗が増大するが、フィン間の空気流動抵抗は変化しないため、送風機の風量は一定に保たれる。", "answer": "×", "law": "着霜が進行するとフィン間の流路断面積が狭まって空気抵抗が著しく増大し、送風機の送風量は大きく減少する。「空気流動抵抗は変化しない」は誤り。", "explanation": "着霜が進行するとフィン間の流路断面積が狭まって空気抵抗が著しく増大し、送風機の送風量は大きく減少する。「空気流動抵抗は変化しない」は誤り。"}, {"id": 2560, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "冷媒液強制循環式冷凍装置では、低圧受液器（液セパレータ）からポンプで過剰な液冷媒を蒸発器に循環させるため、蒸発器内の全伝熱面が常に冷媒液で濡れた状態となり熱伝達率が高い。", "answer": "○", "law": "蒸発量の3〜5倍の液を循環させる液強制循環式は、伝熱管全域を濡れ壁蒸発（環状流・波状流）に保つことができ、乾き領域が生じないため極めて高い熱伝達率が得られる。よって記述は正しい。", "explanation": "蒸発量の3〜5倍の液を循環させる液強制循環式は、伝熱管全域を濡れ壁蒸発（環状流・波状流）に保つことができ、乾き領域が生じないため極めて高い熱伝達率が得られる。よって記述は正しい。"}, {"id": 2561, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器の伝熱特性", "question": "シェルアンドチューブ熱交換器において、邪魔板（バッフルプレート）を胴側に配置することにより、胴側流体の流速を高めるとともに直交流（クロスフロー）を形成して熱伝達率を向上させる。", "answer": "○", "law": "セグメントバッフル等を設けることで胴側流体の流路をジグザグにし、流速増加と管群に対する直角交差流によって乱流を促進し、熱伝達性能を飛躍的に高める。よって記述は正しい。", "explanation": "セグメントバッフル等を設けることで胴側流体の流路をジグザグにし、流速増加と管群に対する直角交差流によって乱流を促進し、熱伝達性能を飛躍的に高める。よって記述は正しい。"}, {"id": 2562, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器の伝熱特性", "question": "二重管熱交換器において、同一の伝熱面積および流体条件であれば、高温流体と低温流体が同じ向きに流れる並流のほうが、対向して流れる向流よりも熱通過率が大きくなる。", "answer": "×", "law": "対向流（向流）のほうが熱交換器全域にわたって温度差を大きく保てるため、対数平均温度差が大きくなり、並流よりも効率よく伝熱できる。「並流のほうが大きくなる」は誤り。", "explanation": "対向流（向流）のほうが熱交換器全域にわたって温度差を大きく保てるため、対数平均温度差が大きくなり、並流よりも効率よく伝熱できる。「並流のほうが大きくなる」は誤り。"}, {"id": 2563, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器の伝熱特性", "question": "空気冷却用フィン付き熱交換器では、空気側の熱伝達率が冷媒の沸騰熱伝達率に比べて著しく小さいため、伝熱面積を拡大したフィンを取り付けることで空気側の熱抵抗を低減させている。", "answer": "○", "law": "熱通過率向上の基本原則として、熱抵抗の支配的要因である気体（空気）側にプレートフィンやコルゲートフィンを設けて伝熱面積を稼ぎ、全体の熱通過性能を改善する。よって記述は正しい。", "explanation": "熱通過率向上の基本原則として、熱抵抗の支配的要因である気体（空気）側にプレートフィンやコルゲートフィンを設けて伝熱面積を稼ぎ、全体の熱通過性能を改善する。よって記述は正しい。"}, {"id": 2564, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器の伝熱特性", "question": "流体の乱流熱伝達率は、流体の熱伝導率、比熱、密度、粘度および流速によって定まり、一般にレイノルズ数（Re）やプラントル数（Pr）が大きいほど熱伝達率は高くなる。", "answer": "○", "law": "無次元数であるヌセルト数（Nu）はRe数とPr数の関数として表され、流速や密度が高く熱伝導率が大きいほど熱伝達率は高くなる。よって記述は正しい。", "explanation": "無次元数であるヌセルト数（Nu）はRe数とPr数の関数として表され、流速や密度が高く熱伝導率が大きいほど熱伝達率は高くなる。よって記述は正しい。"}, {"id": 2565, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "温度自動膨張弁の機能は、高圧の冷媒液を減圧膨張させて低温低圧の気液混合冷媒にするとともに、蒸発器出口の過熱度に応じて蒸発器への冷媒供給量を自動調節することである。", "answer": "○", "law": "膨張弁は絞り作用による圧力・温度降下と、蒸発負荷の変動に対応して適正な過熱度を維持しながら液冷媒を給液する二大機能を果たす。よって記述は正しい。", "explanation": "膨張弁は絞り作用による圧力・温度降下と、蒸発負荷の変動に対応して適正な過熱度を維持しながら液冷媒を給液する二大機能を果たす。よって記述は正しい。"}, {"id": 2566, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "蒸発器内の圧力損失が無視できるほど小さい小型冷凍装置では内部均圧形温度自動膨張弁が用いられるが、圧力損失が大きい装置では外部均圧形温度自動膨張弁を使用しなければならない。", "answer": "○", "law": "蒸発器の圧力降下が大きいと内部均圧形では弁が閉じ気味になり過熱度が過大となるため、蒸発器出口圧力を検出する外部均圧形を用いて適正過熱度制御を行う。よって記述は正しい。", "explanation": "蒸発器の圧力降下が大きいと内部均圧形では弁が閉じ気味になり過熱度が過大となるため、蒸発器出口圧力を検出する外部均圧形を用いて適正過熱度制御を行う。よって記述は正しい。"}, {"id": 2567, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "温度自動膨張弁の感温筒は、周囲空気温度や風の影響を受けないよう配管外面に密着させて固定し、防湿防熱材で確実に断熱施工する。", "answer": "○", "law": "感温筒が庫内空気や周囲ドラフトにさらされると正確な冷媒蒸気過熱度を検知できず誤動作するため、金属バンドで配管に密着固定し外部からの入熱を断熱材で遮断する。よって記述は正しい。", "explanation": "感温筒が庫内空気や周囲ドラフトにさらされると正確な冷媒蒸気過熱度を検知できず誤動作するため、金属バンドで配管に密着固定し外部からの入熱を断熱材で遮断する。よって記述は正しい。"}, {"id": 2568, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "定圧自動膨張弁は、蒸発器出口の過熱度を一定に保つように作動する調整弁であり、熱負荷の変動が激しい大容量冷凍装置に広く用いられる。", "answer": "×", "law": "定圧自動膨張弁は蒸発圧力（弁出口圧力）を一定に保つ弁であり過熱度制御は行えない。負荷変動時に液戻りや過熱を起こしやすいため負荷変動の激しい大容量装置には適さない。誤り。", "explanation": "定圧自動膨張弁は蒸発圧力（弁出口圧力）を一定に保つ弁であり過熱度制御は行えない。負荷変動時に液戻りや過熱を起こしやすいため負荷変動の激しい大容量装置には適さない。誤り。"}, {"id": 2569, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "蒸発圧力調整弁（EPR）は、蒸発器出口と圧縮機吸込み側の間に設置され、入口側の蒸発圧力が設定圧力以下に低下しないように絞り動作を行う自力式調整弁である。", "answer": "○", "law": "EPRは入口側圧力を感知し、設定圧力以下への低下を防止して水クーラの凍結や野菜・果物の過冷却（乾燥・凍結障害）を防止する。よって記述は正しい。", "explanation": "EPRは入口側圧力を感知し、設定圧力以下への低下を防止して水クーラの凍結や野菜・果物の過冷却（乾燥・凍結障害）を防止する。よって記述は正しい。"}, {"id": 2570, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "吸入圧力調整弁（SPR）は、デフロスト終了直後などに圧縮機吸込み圧力が急激に上昇して電動機が過負荷になるのを防ぐため、圧縮機吸込み圧力を設定値以下に制限する。", "answer": "○", "law": "SPR（クランクケース圧力調整弁）は出口側圧力を検知し、設定値以上の高圧ガスが圧縮機シリンダへ流入するのを遮断・制限してモータの過電流トリップを防止する。よって記述は正しい。", "explanation": "SPR（クランクケース圧力調整弁）は出口側圧力を検知し、設定値以上の高圧ガスが圧縮機シリンダへ流入するのを遮断・制限してモータの過電流トリップを防止する。よって記述は正しい。"}, {"id": 2571, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "凝縮圧力調整弁は、冬期の外気温度低下時に空冷凝縮器内に冷媒液を滞留させて伝熱面積を減少させることで、凝縮圧力を安定化させて膨張弁の作動差圧を確保する。", "answer": "○", "law": "冬場の過冷防止のため凝縮器出口を絞って液を溜め込み、有効気相凝縮面積を狭めることで高圧圧力を一定値以上に保持する。よって記述は正しい。", "explanation": "冬場の過冷防止のため凝縮器出口を絞って液を溜め込み、有効気相凝縮面積を狭めることで高圧圧力を一定値以上に保持する。よって記述は正しい。"}, {"id": 2572, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "水冷凝縮器の制水弁（冷却水調整弁）は、凝縮器の負荷が減少して凝縮圧力が低下した際、弁を全開にして大量の冷却水を流すことで凝縮器の過熱を防止する。", "answer": "×", "law": "制水弁は凝縮圧力が低下したときには弁開度を「絞って（減少させて）」冷却水量を減らし、凝縮圧力の下がりすぎを防止するとともに節水を図る。記述は逆であり誤り。", "explanation": "制水弁は凝縮圧力が低下したときには弁開度を「絞って（減少させて）」冷却水量を減らし、凝縮圧力の下がりすぎを防止するとともに節水を図る。記述は逆であり誤り。"}, {"id": 2573, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "イ", "theme": "制御機器・保護装置", "question": "高圧遮断圧力スイッチ（HPS）は、凝縮器の冷却水断水や送風機停止などの異常高圧時に圧縮機を緊急停止させる保安装置であり、安全弁が作動する前に確実に作動する設定値とする。", "answer": "○", "law": "高圧遮断装置の設定圧力は、高圧部安全弁の吹始め圧力より低く設定し、冷媒の外部大気放出に至る前に圧縮機を自動停止させなければならない。よって記述は正しい。", "explanation": "高圧遮断装置の設定圧力は、高圧部安全弁の吹始め圧力より低く設定し、冷媒の外部大気放出に至る前に圧縮機を自動停止させなければならない。よって記述は正しい。"}, {"id": 2574, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器・保護装置", "question": "差圧式油圧保護圧力スイッチ（OPS）は、給油ポンプ吐出し圧力からクランクケース内圧力を差し引いた有効油圧を検出し、油圧低下時に遅延タイマを経て接点を開放する。", "answer": "○", "law": "実質給油圧力（差圧）を感知し、始動時の油圧立ち上がり待ちや運転中の瞬間的油圧変動による誤トリップを防ぐため、約60〜90秒の時限遅延後に停止動作を行う。よって記述は正しい。", "explanation": "実質給油圧力（差圧）を感知し、始動時の油圧立ち上がり待ちや運転中の瞬間的油圧変動による誤トリップを防ぐため、約60〜90秒の時限遅延後に停止動作を行う。よって記述は正しい。"}, {"id": 2575, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器・保護装置", "question": "水冷式冷凍装置に設けられる断水リレー（フロースイッチ）は、冷却水管内の水流が停止した際に電気接点を開き、圧縮機をインターロック停止させて過圧事故を未然に防ぐ。", "answer": "○", "law": "水流低下や断水時に即座に圧縮機回路を遮断して凝縮器の異常高圧や水冷却器の管内凍結を防止する保護装置である。よって記述は正しい。", "explanation": "水流低下や断水時に即座に圧縮機回路を遮断して凝縮器の異常高圧や水冷却器の管内凍結を防止する保護装置である。よって記述は正しい。"}, {"id": 2576, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器・保護装置", "question": "低圧遮断圧力スイッチ（LPS）は、異常な吸込み圧力低下時に圧縮機を停止させる保護装置であるが、庫内温度調節器（サーモスタット）と連動したポンプダウン運転の停止用スイッチとしても機能する。", "answer": "○", "law": "サーモOFFで電磁弁が閉じた後、蒸発器内の冷媒を受液器へ回収し、吸込み圧力が設定停止圧力まで低下した時点でLPSが圧縮機を自動停止させるポンプダウン回路に汎用される。よって記述は正しい。", "explanation": "サーモOFFで電磁弁が閉じた後、蒸発器内の冷媒を受液器へ回収し、吸込み圧力が設定停止圧力まで低下した時点でLPSが圧縮機を自動停止させるポンプダウン回路に汎用される。よって記述は正しい。"}, {"id": 2577, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "油分離器は、圧縮機から吐き出された冷媒ガスから潤滑油を分離する機器であり、回収された油は油戻し管およびフロート弁等を介して自動的に圧縮機クランクケースに戻される。", "answer": "○", "law": "油分離器底部に溜まった油は液面フロート弁が開くことでクランクケースへ自動返油され、圧縮機の油枯渇と熱交換器への油持ち出しを同時に防止する。よって記述は正しい。", "explanation": "油分離器底部に溜まった油は液面フロート弁が開くことでクランクケースへ自動返油され、圧縮機の油枯渇と熱交換器への油持ち出しを同時に防止する。よって記述は正しい。"}, {"id": 2578, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器（液レシーバ）は、凝縮器と膨張弁の間の液配管に設置され、液封入による破壊事故を防ぐため、受液器容量の80%以内で全冷媒を回収できる容積設計とする。", "answer": "○", "law": "高圧受液器は液封防止のため常時20%以上の気相蒸気空間を残す基準（最大回収量80%以下）とされ、冷媒循環量の変動吸収と保守時の冷媒退避容器を兼ねる。よって記述は正しい。", "explanation": "高圧受液器は液封防止のため常時20%以上の気相蒸気空間を残す基準（最大回収量80%以下）とされ、冷媒循環量の変動吸収と保守時の冷媒退避容器を兼ねる。よって記述は正しい。"}, {"id": 2579, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "フィルタドライヤは、冷媒配管内の溶接かすや金属摩耗粉を除去するストレーナ機能と、冷媒中の遊離水分を物理吸着する乾燥剤コア（モレキュラーシーブ等）を一体化した機器である。", "answer": "○", "law": "フィルタドライヤは冷媒中の固形異物の捕捉と水分の吸着を同時に行い、膨張弁オリフィスでのアイスプラグや加水分解による酸・スラッジの発生を防止する。よって記述は正しい。", "explanation": "フィルタドライヤは冷媒中の固形異物の捕捉と水分の吸着を同時に行い、膨張弁オリフィスでのアイスプラグや加水分解による酸・スラッジの発生を防止する。よって記述は正しい。"}, {"id": 2580, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "低圧吸込み管に設けられるアキュムレータ（液分離器）は、内部のU字管頂部に大きな油戻し孔が設けられており、底部に溜まった大量の冷媒液を一気に圧縮機へ吸込ませる構造である。", "answer": "×", "law": "アキュムレータのU字管底部に設けられるのは「微小なオリフィス孔（メータリングホール）」であり、冷媒液を一気に吸い込ませると液圧縮を起こすため誤り。少量の油と液を霧状に徐々に吸入させる。", "explanation": "アキュムレータのU字管底部に設けられるのは「微小なオリフィス孔（メータリングホール）」であり、冷媒液を一気に吸い込ませると液圧縮を起こすため誤り。少量の油と液を霧状に徐々に吸入させる。"}, {"id": 2581, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "イ", "theme": "附属機器・冷凍サイクル", "question": "液ガス熱交換器は、凝縮器からの高温冷媒液と蒸発器からの低温冷媒蒸気の間で熱交換を行わせ、冷媒液を過冷却してフラッシュガスを防ぎ、吸込み蒸気を過熱して湿り圧縮を防止する。", "answer": "○", "law": "フルオロカーボン装置において、液ガス熱交は液管内での気泡発生防止と圧縮機への液戻り防止を同時に達成する有効な附属機器である。よって記述は正しい。", "explanation": "フルオロカーボン装置において、液ガス熱交は液管内での気泡発生防止と圧縮機への液戻り防止を同時に達成する有効な附属機器である。よって記述は正しい。"}, {"id": 2582, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器・冷凍サイクル", "question": "二段圧縮冷凍サイクルにおいて、中間冷却器（インタークーラ）で低段吐出しガスを冷却することにより、高段圧縮機の吐出しガス温度が低下し、圧縮機駆動動力の合計を低減できる。", "answer": "○", "law": "中間冷却により高段吸込み蒸気の比体積が縮小して高段圧縮動力が減り、吐出しガス温度も大幅に抑えられて圧縮機油の劣化を防ぐことができる。よって記述は正しい。", "explanation": "中間冷却により高段吸込み蒸気の比体積が縮小して高段圧縮動力が減り、吐出しガス温度も大幅に抑えられて圧縮機油の劣化を防ぐことができる。よって記述は正しい。"}, {"id": 2583, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器・冷凍サイクル", "question": "二元冷凍サイクルは、超低温（約-50℃〜-80℃以下）を得るために、高温側サイクルと低温側サイクルで異なる冷媒を使用し、両者をカスケード熱交換器（凝縮蒸発器）で熱結合させた方式である。", "answer": "○", "law": "単一冷媒では低圧が真空になりすぎたり高圧が高くなりすぎる超低温用途において、高温側（凝縮器）と低温側（蒸発器）を熱交換器で結合する二元サイクルが用いられる。よって記述は正しい。", "explanation": "単一冷媒では低圧が真空になりすぎたり高圧が高くなりすぎる超低温用途において、高温側（凝縮器）と低温側（蒸発器）を熱交換器で結合する二元サイクルが用いられる。よって記述は正しい。"}, {"id": 2584, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器・冷凍サイクル", "question": "大形アンモニア冷凍装置に設置される自動不凝縮ガスパージャは、系内の不凝縮ガスを一切冷却することなく、高圧受液器からそのまま全量大気中へ直放出して処理する。", "answer": "×", "law": "不凝縮ガス分離器は本体内で冷媒蒸気を冷却液化させて回収し、凝縮しない空気等のみを安全に排気する。アンモニアをそのまま大気直放出することは極めて危険であり除害処理を要する。誤り。", "explanation": "不凝縮ガス分離器は本体内で冷媒蒸気を冷却液化させて回収し、凝縮しない空気等のみを安全に排気する。アンモニアをそのまま大気直放出することは極めて危険であり除害処理を要する。誤り。"}, {"id": 2585, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管の施工と保守", "question": "圧縮機吐出しガス配管は、圧縮機停止中に配管内で凝縮した液冷媒や冷凍機油が圧縮機シリンダヘッドへ逆流して始動時液圧縮を起こさないよう、凝縮器に向かって下がり勾配で施工する。", "answer": "○", "law": "吐出し配管は立ち上がり後に凝縮器側へ下がり勾配（1/100〜1/200）をつけ、停止時の凝縮液や同伴油が圧縮機側へ流下逆流するのを防止する。よって記述は正しい。", "explanation": "吐出し配管は立ち上がり後に凝縮器側へ下がり勾配（1/100〜1/200）をつけ、停止時の凝縮液や同伴油が圧縮機側へ流下逆流するのを防止する。よって記述は正しい。"}, {"id": 2586, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管の施工と保守", "question": "立上がり吸込み配管（サクションライザー）では、最小負荷運転時においても油を冷媒蒸気の流れによって上方に確実に同伴できるよう、適正な管径を選定して必要最小ガス流速を確保する。", "answer": "○", "law": "ガス流速が遅すぎると油が管壁を流下・滞留して油戻り不良となるため、最小負荷時でも約5m/s以上のガス流速を維持するか、ダブルライザー等の施工を行う。よって記述は正しい。", "explanation": "ガス流速が遅すぎると油が管壁を流下・滞留して油戻り不良となるため、最小負荷時でも約5m/s以上のガス流速を維持するか、ダブルライザー等の施工を行う。よって記述は正しい。"}, {"id": 2587, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管の施工と保守", "question": "銅管配管のろう付け作業において、管内酸化スケールの発生を防ぐため、微圧の乾燥窒素ガス（0.02MPa程度）を通気しながら加熱接合する窒素置換工法が必須である。", "answer": "○", "law": "窒素ブローを行わずにろう付けすると管内面に黒色酸化銅スケールが生成し、運転開始後に剥離して電磁弁や膨張弁、キャピラリを閉塞させる大事故となる。よって記述は正しい。", "explanation": "窒素ブローを行わずにろう付けすると管内面に黒色酸化銅スケールが生成し、運転開始後に剥離して電磁弁や膨張弁、キャピラリを閉塞させる大事故となる。よって記述は正しい。"}, {"id": 2588, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管の施工と保守", "question": "電磁弁や逆止め弁などで両端が閉止される可能性のある液冷媒配管区間では、外気温上昇等による液の熱膨張によって異常な高圧が発生し配管が破壊する液封事故の危険がある。", "answer": "○", "law": "非圧縮性である液冷媒が密閉区間に閉じ込められると温度上昇に伴う体積膨張圧で数百気圧に達し弁や管が破裂するため、所定の圧力逃がし装置を設ける。よって記述は正しい。", "explanation": "非圧縮性である液冷媒が密閉区間に閉じ込められると温度上昇に伴う体積膨張圧で数百気圧に達し弁や管が破裂するため、所定の圧力逃がし装置を設ける。よって記述は正しい。"}, {"id": 2589, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "スプリング式安全弁は、弁体にかかる冷媒圧力がばねの設定力に打ち勝ったときに瞬時に開口して圧力を放出し、圧力が許容圧力以下に降下するとばね力によって自動的に再閉止する復帰型安全装置である。", "answer": "○", "law": "安全弁はあらかじめ設定された吹出し圧力で自動開口して設備内圧力を逃がし、圧力が規定値まで回復すると弁が着座して冷媒の過度な放出を止める。よって記述は正しい。", "explanation": "安全弁はあらかじめ設定された吹出し圧力で自動開口して設備内圧力を逃がし、圧力が規定値まで回復すると弁が着座して冷媒の過度な放出を止める。よって記述は正しい。"}, {"id": 2590, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "圧力容器用安全弁の必要最小口径は、冷媒ガスの種類に応じた定数C3、圧力容器の外径D、および全長Lを用いて計算式により求められる。", "answer": "○", "law": "圧力容器安全弁の最小口径 d3 = C3 * sqrt(D * L) は外部火災時の受熱面積と冷媒気化量に基づいて設計口径が規定されている。よって記述は正しい。", "explanation": "圧力容器安全弁の最小口径 d3 = C3 * sqrt(D * L) は外部火災時の受熱面積と冷媒気化量に基づいて設計口径が規定されている。よって記述は正しい。"}, {"id": 2591, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "アンモニアを冷媒とする設備の安全弁放出管は、吹き出した有毒・可燃性のアンモニアガスを安全に無害化するため、大気に開放せず水散水式除害設備や吸収水槽へ導く構造とする。", "answer": "○", "law": "アンモニアは毒性と可燃性をもつため、大気中にそのまま放散させることは禁じられており、水への高溶解性を利用した水槽や除害洗浄塔に接続して安全に吸収処理する。よって記述は正しい。", "explanation": "アンモニアは毒性と可燃性をもつため、大気中にそのまま放散させることは禁じられており、水への高溶解性を利用した水槽や除害洗浄塔に接続して安全に吸収処理する。よって記述は正しい。"}, {"id": 2592, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "可溶栓（溶栓）は、所定の温度で低融点合金が溶融して圧力を逃がす安全装置であり、一度作動すると全開状態が保持されるため、アンモニア冷凍装置の主安全弁として最も推奨される。", "answer": "×", "law": "溶栓は非復帰型であり全量大気放出に至るため、毒性ガスや可燃性ガスであるアンモニア設備への使用は法令上禁止されている。誤り。", "explanation": "溶栓は非復帰型であり全量大気放出に至るため、毒性ガスや可燃性ガスであるアンモニア設備への使用は法令上禁止されている。誤り。"}, {"id": 2593, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験および材料・非破壊試験", "question": "配管以外の冷媒設備本体に行う耐圧試験圧力は、水等の安全な液体を使用する場合は許容圧力の1.5倍以上、空気や窒素等の気体を使用する場合は許容圧力の1.25倍以上である。", "answer": "○", "law": "高圧ガス保安法および冷凍保安規則により、液体耐圧試験は許容圧力の1.5倍以上、気体耐圧試験（液体使用困難時）は許容圧力の1.25倍以上と規定されている。よって記述は正しい。", "explanation": "高圧ガス保安法および冷凍保安規則により、液体耐圧試験は許容圧力の1.5倍以上、気体耐圧試験（液体使用困難時）は許容圧力の1.25倍以上と規定されている。よって記述は正しい。"}, {"id": 2594, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験および材料・非破壊試験", "question": "気密試験は、耐圧試験合格後の冷媒設備全体について、許容圧力以上の試験圧力で窒素ガス等の乾燥気体を用いて加圧し、接合部からの漏えいがないことを確認する。", "answer": "○", "law": "気密試験は設備の漏れを検査するため、許容圧力以上の不活性ガス圧を加えて発泡液塗布や検知器等により漏洩のないことを確かめる。よって記述は正しい。", "explanation": "気密試験は設備の漏れを検査するため、許容圧力以上の不活性ガス圧を加えて発泡液塗布や検知器等により漏洩のないことを確かめる。よって記述は正しい。"}, {"id": 2595, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験および材料・非破壊試験", "question": "気密試験用ガスとして酸素を使用することは、配管内の微量な潤滑油と高圧下で急激に反応して自然発火・ディーゼル爆発を引き起こすため、固く禁止されている。", "answer": "○", "law": "酸素は強い支燃性をもち、油分と接触加圧されると爆発事故を誘発するため、試験ガスには必ず高純度乾燥窒素等の不活性ガスを使用する。よって記述は正しい。", "explanation": "酸素は強い支燃性をもち、油分と接触加圧されると爆発事故を誘発するため、試験ガスには必ず高純度乾燥窒素等の不活性ガスを使用する。よって記述は正しい。"}, {"id": 2596, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験および材料・非破壊試験", "question": "真空乾燥（真空引き）作業において、真空ポンプ停止後に真空放置試験を行い、圧力計の指示値が周囲温度の上昇に伴って著しく低下した場合は、系内に外気が漏入している証拠である。", "answer": "×", "law": "外気が漏入（リーク）している場合は圧力計の指示値は「上昇」する。温度上昇で圧力が低下するという記述自体が物理法則（気体の状態方程式）にも矛盾しており誤り。", "explanation": "外気が漏入（リーク）している場合は圧力計の指示値は「上昇」する。温度上昇で圧力が低下するという記述自体が物理法則（気体の状態方程式）にも矛盾しており誤り。"}, {"id": 2597, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "イ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "圧縮機を据え付けるコンクリート基礎は、十分な強度と質量をもたせ、通常は機器本体質量の1〜3倍程度の質量を確保して運転時の振動や共振を抑制する。", "answer": "○", "law": "往復動機械等の不平衡慣性力による加振力を減衰させるため、十分な質量と剛性をもつ慣性ブロック基礎にアンカーボルトで強固に固定する。よって記述は正しい。", "explanation": "往復動機械等の不平衡慣性力による加振力を減衰させるため、十分な質量と剛性をもつ慣性ブロック基礎にアンカーボルトで強固に固定する。よって記述は正しい。"}, {"id": 2598, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "ロ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "試運転前の確認項目として、電源電圧の不平衡、電動機の回転方向（三相結線の相順）、各止め弁の開閉状態、クランクケースの油面レベル、および保護継電器の作動設定値などを点検する。", "answer": "○", "law": "逆回転による圧縮機破損防止のための相順確認、閉塞運転防止のための弁開閉確認、過電流・油圧保護設定値の確認等は試運転前の極めて重要な保安点検項目である。よって記述は正しい。", "explanation": "逆回転による圧縮機破損防止のための相順確認、閉塞運転防止のための弁開閉確認、過電流・油圧保護設定値の確認等は試運転前の極めて重要な保安点検項目である。よって記述は正しい。"}, {"id": 2599, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "ハ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "HFC系冷媒であるR410Aは、ジフルオロメタン（R32）とペンタフルオロエタン（R125）の等質量混合冷媒であり、疑似共沸混合冷媒であるため温度勾配（温度グライド）は実質的にほとんど無視できる。", "answer": "○", "law": "R410Aは擬似共沸（疑似共沸）混合冷媒であり、気液平衡時の温度グライドが約0.1K程度と極めて小さいため、ほぼ単一冷媒と同様の挙動を示す。よって記述は正しい。", "explanation": "R410Aは擬似共沸（疑似共沸）混合冷媒であり、気液平衡時の温度グライドが約0.1K程度と極めて小さいため、ほぼ単一冷媒と同様の挙動を示す。よって記述は正しい。"}, {"id": 2600, "subject": "保安管理", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "ニ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "アンモニア冷凍装置の運転において、冷媒系統内に混入した冷凍機油はアンモニア冷媒液よりも密度が小さいため、低圧受液器や油溜め器の液面上部に浮上し、上部液面から油抜き弁を介して回収される。", "answer": "×", "law": "鉱油系冷凍機油の密度（比重約0.9）は液化アンモニアの密度（比重約0.6〜0.68）よりも「重い（大きい）」ため、容器の「底部」に沈降する。底部から油抜きを行うため「上部に浮上し上部から回収」は誤り。", "explanation": "鉱油系冷凍機油の密度（比重約0.9）は液化アンモニアの密度（比重約0.6〜0.68）よりも「重い（大きい）」ため、容器の「底部」に沈降する。底部から油抜きを行うため「上部に浮上し上部から回収」は誤り。"}];

  if (isCorrect) { themeStats[theme].correct += 1; }
  saveState();
}

    list = list.filter(q => bookmarkedIds.has(q.id));
    if (list.length === 0) {
      alert('現在ブックマークされた問題はありません。\n気になる問題の「★ 保存」ボタンを押して登録してください。');
      document.getElementById('orderFilter').value = 'sequential';
      return applyFilters();
    }
  } else if (selectedOrder === 'random') {
    list.sort(() => Math.random() - 0.5);
  }
  currentList = list;
  currentIndex = 0;
  correctCount = 0;
  incorrectCount = 0;
  renderQuestion();
}

function renderQuestion() {
  const qText = document.getElementById('questionText');
  const expBox = document.getElementById('explanationBox');
  const btnBmk = document.getElementById('btnBookmark');
  
  if (currentList.length === 0) {
    qText.textContent = '該当する問題がありません（検索・フィルター条件を確認してください）。';
    document.getElementById('btnMaru').disabled = true;
    document.getElementById('btnBatsu').disabled = true;
    expBox.style.display = 'none';
    btnBmk.style.display = 'none';
    updateStats();
    return;
  }
  btnBmk.style.display = 'inline-flex';
  const q = currentList[currentIndex];
  document.getElementById('badgeSub').textContent = q.subject;
  document.getElementById('badgeYear').textContent = q.year;
  document.getElementById('badgeNum').textContent = q.q_num + ' 肢' + q.branch;
  document.getElementById('badgeTheme').textContent = q.theme;
  qText.textContent = q.question;
  
  if (bookmarkedIds.has(q.id)) {
    btnBmk.className = 'btn-bookmark active';
    btnBmk.innerHTML = '★ 保存済';
  } else {
    btnBmk.className = 'btn-bookmark';
    btnBmk.innerHTML = '☆ 保存';
  }
  
  document.getElementById('btnMaru').disabled = false;
  document.getElementById('btnBatsu').disabled = false;
  document.getElementById('actionButtons').style.display = 'grid';
  expBox.style.display = 'none';
  updateStats();
}

function toggleBookmark() {
  if (currentList.length === 0) return;
  const q = currentList[currentIndex];
  if (bookmarkedIds.has(q.id)) {
    bookmarkedIds.delete(q.id);
  } else {
    bookmarkedIds.add(q.id);
  }
  saveState();
  renderQuestion();
}

function checkAnswer(userChoice) {
  if (currentList.length === 0) return;
  const q = currentList[currentIndex];
  const isCorrect = (userChoice === q.answer);
  
  recordAnswerToTheme(q.theme, isCorrect);

  document.getElementById('btnMaru').disabled = true;
  document.getElementById('btnBatsu').disabled = true;
  const expBox = document.getElementById('explanationBox');
  const resultTitle = document.getElementById('resultTitle');
  const lawTag = document.getElementById('lawTag');
  const expText = document.getElementById('expText');
  expBox.className = 'explanation-box ' + (isCorrect ? 'correct' : 'incorrect');
  resultTitle.className = 'result-title ' + (isCorrect ? 'correct' : 'incorrect');
  if (isCorrect) {
    correctCount++;
    resultTitle.innerHTML = '⭕ 正解！（正答：' + q.answer + '）';
    if (wrongIds.has(q.id)) { wrongIds.delete(q.id); saveState(); }
  } else {
    incorrectCount++;
    resultTitle.innerHTML = '❌ 不正解...（正答：' + q.answer + '）';
    wrongIds.add(q.id);
    saveState();
  }
  lawTag.textContent = q.law || '保安管理技術';
  expText.textContent = q.explanation;
  expBox.style.display = 'block';
  expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  updateStats();
}

function nextQuestion() {
  if (currentList.length === 0) return;
  if (currentIndex + 1 < currentList.length) {
    currentIndex++;
    renderQuestion();
  } else {
    alert('全問終了しました！\n正解数: ' + correctCount + ' / ' + currentList.length + ' 問\n正解率: ' + Math.round((correctCount / currentList.length) * 100) + '%');
    currentIndex = 0;
    renderQuestion();
  }
}

function prevQuestion() {
  if (currentList.length === 0) return;
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  } else {
    alert('最初の問題です。');
  }
}

function skipQuestion() {
  if (currentList.length === 0) return;
  if (currentIndex + 1 < currentList.length) {
    currentIndex++;
    renderQuestion();
  } else {
    alert('最後の問題です。');
  }
}

function updateStats() {
  const total = currentList.length;
  const currentNum = total > 0 ? currentIndex + 1 : 0;
  document.getElementById('currentIdxText').textContent = `${currentNum} / ${total} 問 (誤答: ${wrongIds.size}問 / ★${bookmarkedIds.size}問)`;
  const answered = correctCount + incorrectCount;
  const rate = answered > 0 ? Math.round((correctCount / answered) * 100) : 0;
  document.getElementById('scoreText').textContent = `正解率: ${rate}% (正: ${correctCount} / 誤: ${incorrectCount})`;
  const progress = total > 0 ? ((currentIndex) / total) * 100 : 0;
  document.getElementById('progressFill').style.width = progress + '%';
}

function openStatsModal() {
  const body = document.getElementById('statsModalBody');
  body.innerHTML = '';
  
  const themes = [...new Set(allQuestions.map(q => q.theme))].filter(t => t && t !== 'nan').sort();
  
  if (themes.length === 0) {
    body.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">まだ回答データがありません。</p>';
  } else {
    let totalC = 0, totalA = 0;
    themes.forEach(t => {
      const stat = themeStats[t] || { correct: 0, total: 0 };
      totalC += stat.correct;
      totalA += stat.total;
      const rate = stat.total > 0 ? Math.round((stat.correct / stat.total) * 100) : 0;
      
      const item = document.createElement('div');
      item.className = 'stat-item';
      item.innerHTML = `
        <div class="stat-theme-name">${t}</div>
        <div class="stat-detail">${stat.correct}/${stat.total}問</div>
        <div class="stat-rate">${stat.total > 0 ? rate + '%' : '-'}</div>
      `;
      body.appendChild(item);
    });
  }
  document.getElementById('statsModal').style.display = 'flex';
}

function closeStatsModal() {
  document.getElementById('statsModal').style.display = 'none';
}

function resetStats() {
  if (confirm('間違えた問題の履歴、ブックマーク、分類別の正答率データをすべてリセットしますか？')) {
    wrongIds.clear();
    bookmarkedIds.clear();
    themeStats = {};
    try {
      localStorage.removeItem('1cold_wrong_hoan');
      localStorage.removeItem('1cold_theme_stats_hoan');
      localStorage.removeItem('1cold_bookmarks_hoan');
    } catch (e) {}
    correctCount = 0;
    incorrectCount = 0;
    currentIndex = 0;
    renderQuestion();
    alert('データをリセットしました。');
  }
}

// キーボードショートカット
window.addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.id === 'searchBox') return;

  const isExpVisible = document.getElementById('explanationBox').style.display === 'block';
  
  if (!isExpVisible) {
    if (e.key === '1' || e.key === 'o' || e.key === 'O' || e.key === 'ArrowLeft') {
      checkAnswer('○');
    } else if (e.key === '2' || e.key === 'x' || e.key === 'X' || e.key === 'ArrowRight') {
      checkAnswer('×');
    }
  } else {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault();
      nextQuestion();
    }
  }
});

document.addEventListener('DOMContentLoaded', () => {
  initYears();
  initThemes();
  applyFilters();
});
</script>
</body>
</html>
