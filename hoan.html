体積が縮小して高段圧縮動力が減り、吐出しガス温度も大幅に抑えられて圧縮機油の劣化を防ぐことができる。よって記述は正しい。"}, {"id": 2343, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器・冷凍サイクル", "question": "二元冷凍サイクルは、超低温（約-50℃〜-80℃以下）を得るために、高温側サイクルと低温側サイクルで異なる冷媒を使用し、両者をカスケード熱交換器（凝縮蒸発器）で熱結合させた方式である。", "answer": "○", "law": "単一冷媒では低圧が真空になりすぎたり高圧が高くなりすぎる超低温用途において、高温側（凝縮器）と低温側（蒸発器）を熱交換器で結合する二元サイクルが用いられる。よって記述は正しい。", "explanation": "単一冷媒では低圧が真空になりすぎたり高圧が高くなりすぎる超低温用途において、高温側（凝縮器）と低温側（蒸発器）を熱交換器で結合する二元サイクルが用いられる。よって記述は正しい。"}, {"id": 2344, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器・冷凍サイクル", "question": "大形アンモニア冷凍装置に設置される自動不凝縮ガスパージャは、系内の不凝縮ガスを一切冷却することなく、高圧受液器からそのまま全量大気中へ直放出して処理する。", "answer": "×", "law": "不凝縮ガス分離器は本体内で冷媒蒸気を冷却液化させて回収し、凝縮しない空気等のみを安全に排気する。アンモニアをそのまま大気直放出することは極めて危険であり除害処理を要する。誤り。", "explanation": "不凝縮ガス分離器は本体内で冷媒蒸気を冷却液化させて回収し、凝縮しない空気等のみを安全に排気する。アンモニアをそのまま大気直放出することは極めて危険であり除害処理を要する。誤り。"}, {"id": 2345, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管の施工と保守", "question": "圧縮機吐出しガス配管は、圧縮機停止中に配管内で凝縮した液冷媒や冷凍機油が圧縮機シリンダヘッドへ逆流して始動時液圧縮を起こさないよう、凝縮器に向かって下がり勾配で施工する。", "answer": "○", "law": "吐出し配管は立ち上がり後に凝縮器側へ下がり勾配（1/100〜1/200）をつけ、停止時の凝縮液や同伴油が圧縮機側へ流下逆流するのを防止する。よって記述は正しい。", "explanation": "吐出し配管は立ち上がり後に凝縮器側へ下がり勾配（1/100〜1/200）をつけ、停止時の凝縮液や同伴油が圧縮機側へ流下逆流するのを防止する。よって記述は正しい。"}, {"id": 2346, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管の施工と保守", "question": "立上がり吸込み配管（サクションライザー）では、最小負荷運転時においても油を冷媒蒸気の流れによって上方に確実に同伴できるよう、適正な管径を選定して必要最小ガス流速を確保する。", "answer": "○", "law": "ガス流速が遅すぎると油が管壁を流下・滞留して油戻り不良となるため、最小負荷時でも約5m/s以上のガス流速を維持するか、ダブルライザー等の施工を行う。よって記述は正しい。", "explanation": "ガス流速が遅すぎると油が管壁を流下・滞留して油戻り不良となるため、最小負荷時でも約5m/s以上のガス流速を維持するか、ダブルライザー等の施工を行う。よって記述は正しい。"}, {"id": 2347, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管の施工と保守", "question": "銅管配管のろう付け作業において、管内酸化スケールの発生を防ぐため、微圧の乾燥窒素ガス（0.02MPa程度）を通気しながら加熱接合する窒素置換工法が必須である。", "answer": "○", "law": "窒素ブローを行わずにろう付けすると管内面に黒色酸化銅スケールが生成し、運転開始後に剥離して電磁弁や膨張弁、キャピラリを閉塞させる大事故となる。よって記述は正しい。", "explanation": "窒素ブローを行わずにろう付けすると管内面に黒色酸化銅スケールが生成し、運転開始後に剥離して電磁弁や膨張弁、キャピラリを閉塞させる大事故となる。よって記述は正しい。"}, {"id": 2348, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管の施工と保守", "question": "電磁弁や逆止め弁などで両端が閉止される可能性のある液冷媒配管区間では、外気温上昇等による液の熱膨張によって異常な高圧が発生し配管が破壊する液封事故の危険がある。", "answer": "○", "law": "非圧縮性である液冷媒が密閉区間に閉じ込められると温度上昇に伴う体積膨張圧で数百気圧に達し弁や管が破裂するため、所定の圧力逃がし装置を設ける。よって記述は正しい。", "explanation": "非圧縮性である液冷媒が密閉区間に閉じ込められると温度上昇に伴う体積膨張圧で数百気圧に達し弁や管が破裂するため、所定の圧力逃がし装置を設ける。よって記述は正しい。"}, {"id": 2349, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "スプリング式安全弁は、弁体にかかる冷媒圧力がばねの設定力に打ち勝ったときに瞬時に開口して圧力を放出し、圧力が許容圧力以下に降下するとばね力によって自動的に再閉止する復帰型安全装置である。", "answer": "○", "law": "安全弁はあらかじめ設定された吹出し圧力で自動開口して設備内圧力を逃がし、圧力が規定値まで回復すると弁が着座して冷媒の過度な放出を止める。よって記述は正しい。", "explanation": "安全弁はあらかじめ設定された吹出し圧力で自動開口して設備内圧力を逃がし、圧力が規定値まで回復すると弁が着座して冷媒の過度な放出を止める。よって記述は正しい。"}, {"id": 2350, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "圧力容器用安全弁の必要最小口径は、冷媒ガスの種類に応じた定数C3、圧力容器の外径D、および全長Lを用いて計算式により求められる。", "answer": "○", "law": "圧力容器安全弁の最小口径 d3 = C3 * sqrt(D * L) は外部火災時の受熱面積と冷媒気化量に基づいて設計口径が規定されている。よって記述は正しい。", "explanation": "圧力容器安全弁の最小口径 d3 = C3 * sqrt(D * L) は外部火災時の受熱面積と冷媒気化量に基づいて設計口径が規定されている。よって記述は正しい。"}, {"id": 2351, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "アンモニアを冷媒とする設備の安全弁放出管は、吹き出した有毒・可燃性のアンモニアガスを安全に無害化するため、大気に開放せず水散水式除害設備や吸収水槽へ導く構造とする。", "answer": "○", "law": "アンモニアは毒性と可燃性をもつため、大気中にそのまま放散させることは禁じられており、水への高溶解性を利用した水槽や除害洗浄塔に接続して安全に吸収処理する。よって記述は正しい。", "explanation": "アンモニアは毒性と可燃性をもつため、大気中にそのまま放散させることは禁じられており、水への高溶解性を利用した水槽や除害洗浄塔に接続して安全に吸収処理する。よって記述は正しい。"}, {"id": 2352, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "可溶栓（溶栓）は、所定の温度で低融点合金が溶融して圧力を逃がす安全装置であり、一度作動すると全開状態が保持されるため、アンモニア冷凍装置の主安全弁として最も推奨される。", "answer": "×", "law": "溶栓は非復帰型であり全量大気放出に至るため、毒性ガスや可燃性ガスであるアンモニア設備への使用は法令上禁止されている。誤り。", "explanation": "溶栓は非復帰型であり全量大気放出に至るため、毒性ガスや可燃性ガスであるアンモニア設備への使用は法令上禁止されている。誤り。"}, {"id": 2353, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験および材料・非破壊試験", "question": "配管以外の冷媒設備本体に行う耐圧試験圧力は、水等の安全な液体を使用する場合は許容圧力の1.5倍以上、空気や窒素等の気体を使用する場合は許容圧力の1.25倍以上である。", "answer": "○", "law": "高圧ガス保安法および冷凍保安規則により、液体耐圧試験は許容圧力の1.5倍以上、気体耐圧試験（液体使用困難時）は許容圧力の1.25倍以上と規定されている。よって記述は正しい。", "explanation": "高圧ガス保安法および冷凍保安規則により、液体耐圧試験は許容圧力の1.5倍以上、気体耐圧試験（液体使用困難時）は許容圧力の1.25倍以上と規定されている。よって記述は正しい。"}, {"id": 2354, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験および材料・非破壊試験", "question": "気密試験は、耐圧試験合格後の冷媒設備全体について、許容圧力以上の試験圧力で窒素ガス等の乾燥気体を用いて加圧し、接合部からの漏えいがないことを確認する。", "answer": "○", "law": "気密試験は設備の漏れを検査するため、許容圧力以上の不活性ガス圧を加えて発泡液塗布や検知器等により漏洩のないことを確かめる。よって記述は正しい。", "explanation": "気密試験は設備の漏れを検査するため、許容圧力以上の不活性ガス圧を加えて発泡液塗布や検知器等により漏洩のないことを確かめる。よって記述は正しい。"}, {"id": 2355, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験および材料・非破壊試験", "question": "気密試験用ガスとして酸素を使用することは、配管内の微量な潤滑油と高圧下で急激に反応して自然発火・ディーゼル爆発を引き起こすため、固く禁止されている。", "answer": "○", "law": "酸素は強い支燃性をもち、油分と接触加圧されると爆発事故を誘発するため、試験ガスには必ず高純度乾燥窒素等の不活性ガスを使用する。よって記述は正しい。", "explanation": "酸素は強い支燃性をもち、油分と接触加圧されると爆発事故を誘発するため、試験ガスには必ず高純度乾燥窒素等の不活性ガスを使用する。よって記述は正しい。"}, {"id": 2356, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験および材料・非破壊試験", "question": "真空乾燥（真空引き）作業において、真空ポンプ停止後に真空放置試験を行い、圧力計の指示値が周囲温度の上昇に伴って著しく低下した場合は、系内に外気が漏入している証拠である。", "answer": "×", "law": "外気が漏入（リーク）している場合は圧力計の指示値は「上昇」する。温度上昇で圧力が低下するという記述自体が物理法則（気体の状態方程式）にも矛盾しており誤り。", "explanation": "外気が漏入（リーク）している場合は圧力計の指示値は「上昇」する。温度上昇で圧力が低下するという記述自体が物理法則（気体の状態方程式）にも矛盾しており誤り。"}, {"id": 2357, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "イ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "圧縮機を据え付けるコンクリート基礎は、十分な強度と質量をもたせ、通常は機器本体質量の1〜3倍程度の質量を確保して運転時の振動や共振を抑制する。", "answer": "○", "law": "往復動機械等の不平衡慣性力による加振力を減衰させるため、十分な質量と剛性をもつ慣性ブロック基礎にアンカーボルトで強固に固定する。よって記述は正しい。", "explanation": "往復動機械等の不平衡慣性力による加振力を減衰させるため、十分な質量と剛性をもつ慣性ブロック基礎にアンカーボルトで強固に固定する。よって記述は正しい。"}, {"id": 2358, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ロ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "試運転前の確認項目として、電源電圧の不平衡、電動機の回転方向（三相結線の相順）、各止め弁の開閉状態、クランクケースの油面レベル、および保護継電器の作動設定値などを点検する。", "answer": "○", "law": "逆回転による圧縮機破損防止のための相順確認、閉塞運転防止のための弁開閉確認、過電流・油圧保護設定値の確認等は試運転前の極めて重要な保安点検項目である。よって記述は正しい。", "explanation": "逆回転による圧縮機破損防止のための相順確認、閉塞運転防止のための弁開閉確認、過電流・油圧保護設定値の確認等は試運転前の極めて重要な保安点検項目である。よって記述は正しい。"}, {"id": 2359, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ハ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "HFC系冷媒であるR410Aは、ジフルオロメタン（R32）とペンタフルオロエタン（R125）の等質量混合冷媒であり、疑似共沸混合冷媒であるため温度勾配（温度グライド）は実質的にほとんど無視できる。", "answer": "○", "law": "R410Aは擬似共沸（疑似共沸）混合冷媒であり、気液平衡時の温度グライドが約0.1K程度と極めて小さいため、ほぼ単一冷媒と同様の挙動を示す。よって記述は正しい。", "explanation": "R410Aは擬似共沸（疑似共沸）混合冷媒であり、気液平衡時の温度グライドが約0.1K程度と極めて小さいため、ほぼ単一冷媒と同様の挙動を示す。よって記述は正しい。"}, {"id": 2360, "subject": "保安管理", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ニ", "theme": "据付け・試運転・冷媒・潤滑油", "question": "アンモニア冷凍装置の運転において、冷媒系統内に混入した冷凍機油はアンモニア冷媒液よりも密度が小さいため、低圧受液器や油溜め器の液面上部に浮上し、上部液面から油抜き弁を介して回収される。", "answer": "×", "law": "鉱油系冷凍機油の密度（比重約0.9）は液化アンモニアの密度（比重約0.6〜0.68）よりも「重い（大きい）」ため、容器の「底部」に沈降する。底部から油抜きを行うため「上部に浮上し上部から回収」は誤り。", "explanation": "鉱油系冷凍機油の密度（比重約0.9）は液化アンモニアの密度（比重約0.6〜0.68）よりも「重い（大きい）」ため、容器の「底部」に沈降する。底部から油抜きを行うため「上部に浮上し上部から回収」は誤り。"}, {"id": 2361, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "多気筒往復圧縮機において、ピストンがシリンダ内で往復運動を行うとき、吸込み弁および吐出し弁の開閉はシリンダ内の圧力と吸込み・吐出し側圧力との差圧によって自動的に行われる。", "answer": "○", "law": "往復動圧縮機の吸込み弁・吐出し弁は、特殊な外部駆動機構をもたず、シリンダ内圧力と外側（吸込・吐出）圧力との差圧によって自動的に開閉する自動弁である。よって記述は正しい。", "explanation": "往復動圧縮機の吸込み弁・吐出し弁は、特殊な外部駆動機構をもたず、シリンダ内圧力と外側（吸込・吐出）圧力との差圧によって自動的に開閉する自動弁である。よって記述は正しい。"}, {"id": 2362, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "スクリュー圧縮機は、ロータの回転により歯溝容積が吸込み側から吐出し側へ移動しながら連続的に縮小する容積式圧縮機であり、往復圧縮機に比べて吐出し気体の脈動が非常に少ない。", "answer": "○", "law": "スクリュー圧縮機は連続的に溝容積を縮小して圧縮するため、往復動機のような断続的な吸排気による脈動が極めて少なく、滑らかな吐出しガスが得られる。よって記述は正しい。", "explanation": "スクリュー圧縮機は連続的に溝容積を縮小して圧縮するため、往復動機のような断続的な吸排気による脈動が極めて少なく、滑らかな吐出しガスが得られる。よって記述は正しい。"}, {"id": 2363, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は、固定スクロールと旋回スクロールの間に形成される三日月形の圧縮室容積が、旋回運動に伴って中心部に向かって増大しながら吸込みガスを圧縮する機構である。", "answer": "×", "law": "スクロール圧縮機の圧縮室容積は、外周から中心部へ移動するにつれて「減少（縮小）」しながら圧縮する。「増大しながら」との記述は誤り。", "explanation": "スクロール圧縮機の圧縮室容積は、外周から中心部へ移動するにつれて「減少（縮小）」しながら圧縮する。「増大しながら」との記述は誤り。"}, {"id": 2364, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、羽根車（インペラ）の高速回転による遠心力と速度エネルギーを利用して冷媒蒸気を圧縮するターボ型圧縮機であり、大容量の空調設備や大規模な冷凍装置に広く採用されている。", "answer": "○", "law": "遠心（ターボ）圧縮機は大風量を連続的に処理できるため、大容量のビル用空調や大型冷凍プラントに最適であり広く用いられている。よって記述は正しい。", "explanation": "遠心（ターボ）圧縮機は大風量を連続的に処理できるため、大容量のビル用空調や大型冷凍プラントに最適であり広く用いられている。よって記述は正しい。"}, {"id": 2365, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "インバータを用いて圧縮機駆動電動機の電源周波数を変化させる容量制御では、回転速度の増減に伴って冷媒循環量を連続的に変化させることができるが、極低速域では潤滑油ポンプの油圧確保に注意が必要である。", "answer": "○", "law": "インバータによる連続容量制御は広範囲で効率的だが、軸直結の油ポンプを採用している場合、回転数を下げすぎると適正な油圧が維持できなくなるため下限回転速度の制限が必要。よって記述は正しい。", "explanation": "インバータによる連続容量制御は広範囲で効率的だが、軸直結の油ポンプを採用している場合、回転数を下げすぎると適正な油圧が維持できなくなるため下限回転速度の制限が必要。よって記述は正しい。"}, {"id": 2366, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "多気筒往復圧縮機のアンローダ機構は、吸込み弁板を強制的に閉鎖保持することによって、その気筒の圧縮仕事を完全に停止させ、段階的な容量制御を行う。", "answer": "×", "law": "アンローダ機構は吸込み弁板を「強制開放（押し上げ）」してガスを吸込み側へ戻すことで圧縮仕事をなくす機構である。「閉鎖保持する」は誤り。", "explanation": "アンローダ機構は吸込み弁板を「強制開放（押し上げ）」してガスを吸込み側へ戻すことで圧縮仕事をなくす機構である。「閉鎖保持する」は誤り。"}, {"id": 2367, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "ツインスクリュー圧縮機の容量制御に用いられるスライド弁は、軸方向に移動させることで吸込みの閉込み位置を変え、有効な圧縮長さを変化させて無段容量制御を行う。", "answer": "○", "law": "スライド弁を軸方向へスライドさせると、吸入された冷媒の一部が圧縮されずに吸込み側へ逃げるため、圧縮行程の有効長さが変わり無段容量制御ができる。よって記述は正しい。", "explanation": "スライド弁を軸方向へスライドさせると、吸入された冷媒の一部が圧縮されずに吸込み側へ逃げるため、圧縮行程の有効長さが変わり無段容量制御ができる。よって記述は正しい。"}, {"id": 2368, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパスによる容量制御を行う際、バイパス量が多すぎると蒸発器での冷却作用がほとんど失われ、圧縮機の吸込み温度の異常上昇や過熱運転を引き起こすおそれがある。", "answer": "○", "law": "過大なホットガスバイパスは冷房（冷却）作用を伴わない高温ガスが直接低圧側へ流入することを意味し、圧縮機の吸込み過熱度が跳ね上がり過熱運転を招く。よって記述は正しい。", "explanation": "過大なホットガスバイパスは冷房（冷却）作用を伴わない高温ガスが直接低圧側へ流入することを意味し、圧縮機の吸込み過熱度が跳ね上がり過熱運転を招く。よって記述は正しい。"}, {"id": 2369, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の吸込み弁や吐出し弁に弁板の割れや変形が生じると、シリンダ内の高圧ガスの逆流や再膨張ロスが発生し、圧縮機の体積効率が著しく低下する。", "answer": "○", "law": "弁の密閉不良は高圧ガスの逆流や再膨張をもたらし、有効な吸入ガス量を激減させて体積効率（実効吐出し量）を大きく低下させる。よって記述は正しい。", "explanation": "弁の密閉不良は高圧ガスの逆流や再膨張をもたらし、有効な吸入ガス量を激減させて体積効率（実効吐出し量）を大きく低下させる。よって記述は正しい。"}, {"id": 2370, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "圧縮機の吸込み過熱度が適正値より著しく大きくなると、冷媒ガスの比体積が増加して循環質量流量が減少し、冷凍能力の低下と吐出しガス温度の異常上昇を招く。", "answer": "○", "law": "吸込み過熱度が大きすぎるとガスが膨張して密度が下がり、質量流量が減るため能力が落ちる。さらに高温度から圧縮を開始するため吐出ガス温度が過昇する。よって記述は正しい。", "explanation": "吸込み過熱度が大きすぎるとガスが膨張して密度が下がり、質量流量が減るため能力が落ちる。さらに高温度から圧縮を開始するため吐出ガス温度が過昇する。よって記述は正しい。"}, {"id": 2371, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "クランクケース内の冷凍機油に過剰な冷媒が溶解した状態で急激に圧縮機を起動すると、圧力急低下による突沸（オイルフォーミング）が起き、潤滑油がシリンダへ多量に吸い上げられて液圧縮を誘発する。", "answer": "○", "law": "寝込み（冷媒の油への過剰溶解）がある状態で起動すると、急激なクランクケース減圧でオイルが激しく発泡・突沸し、液状の油と冷媒がシリンダに吸引されて重大な液圧縮を引き起こす。よって記述は正しい。", "explanation": "寝込み（冷媒の油への過剰溶解）がある状態で起動すると、急激なクランクケース減圧でオイルが激しく発泡・突沸し、液状の油と冷媒がシリンダに吸引されて重大な液圧縮を引き起こす。よって記述は正しい。"}, {"id": 2372, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の運転中、シリンダヘッドから「カンカン」という規則的な金属打撃音が発生した場合、直ちに原因を調査するため運転を継続しながら各部の温度を測定する。", "answer": "×", "law": "シリンダヘッドからの金属打撃音（ノッキング）は液圧縮や弁の折損脱落など致命的故障の兆候であり、「運転を継続しながら」ではなく「直ちに運転を停止」して点検しなければならない。誤り。", "explanation": "シリンダヘッドからの金属打撃音（ノッキング）は液圧縮や弁の折損脱落など致命的故障の兆候であり、「運転を継続しながら」ではなく「直ちに運転を停止」して点検しなければならない。誤り。"}, {"id": 2373, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "水冷シェルアンドチューブ凝縮器において、冷却水管の内面に水あか（スケール）やスライムが付着すると、熱通過率が低下し、同一の凝縮負荷に対する凝縮温度および凝縮圧力が上昇する。", "answer": "○", "law": "スケールやスライムは熱伝導率の低い熱抵抗層を形成するため、水と冷媒間の熱通過率が下がり、放熱のために高い凝縮温度と圧力が必要となる。よって記述は正しい。", "explanation": "スケールやスライムは熱伝導率の低い熱抵抗層を形成するため、水と冷媒間の熱通過率が下がり、放熱のために高い凝縮温度と圧力が必要となる。よって記述は正しい。"}, {"id": 2374, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器の表面（フィンやチューブ）に塵埃や油分が多量に付着している場合、空気側の熱伝達率が低下して凝縮圧力が異常上昇し、高圧カットアウトが頻繁に作動する原因となる。", "answer": "○", "law": "フィンの目詰まりは空気の流れを阻害し熱伝達を悪化させるため、凝縮能力が落ちて高圧圧力が急上昇し、高圧保安スイッチによるトリップを引き起こす。よって記述は正しい。", "explanation": "フィンの目詰まりは空気の流れを阻害し熱伝達を悪化させるため、凝縮能力が落ちて高圧圧力が急上昇し、高圧保安スイッチによるトリップを引き起こす。よって記述は正しい。"}, {"id": 2375, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "凝縮器内に空気などの不凝縮ガスが混入すると、ドルトンの分圧の法則により全圧が上昇するとともに、伝熱面上にガス膜が形成されて凝縮伝熱が阻害され、圧縮機の所要動力が増加する。", "answer": "○", "law": "不凝縮ガスの分圧加算と伝熱管表面の気体膜形成により、凝縮圧力・温度が不当に高くなり、圧縮機の仕事量（消費電力）が増大する。よって記述は正しい。", "explanation": "不凝縮ガスの分圧加算と伝熱管表面の気体膜形成により、凝縮圧力・温度が不当に高くなり、圧縮機の仕事量（消費電力）が増大する。よって記述は正しい。"}, {"id": 2376, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "受液器兼用の水冷シェルアンドチューブ凝縮器（コンデンサレシーバ）に冷媒を過充てんすると、余分な冷媒液が凝縮器下部に溜まって多数の冷却管を液没させ、凝縮に有効な伝熱面積を減少させる。", "answer": "○", "law": "過充てんにより凝縮器内の液位が上がると、冷媒蒸気の凝縮に使える冷却管の露出面積（有効伝熱面積）が減り、凝縮温度・圧力の上昇を招く。よって記述は正しい。", "explanation": "過充てんにより凝縮器内の液位が上がると、冷媒蒸気の凝縮に使える冷却管の露出面積（有効伝熱面積）が減り、凝縮温度・圧力の上昇を招く。よって記述は正しい。"}, {"id": 2377, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "乾式蒸発器において、冷媒充てん量が不足すると、蒸発器内の濡れ面積が減少して有効伝熱面積が狭くなり、蒸発圧力の低下と吸込み過熱度の異常増大を招く。", "answer": "○", "law": "冷媒不足により膨張弁からの給液量が減ると、蒸発器後半が過熱蒸気域となり伝熱効率が落ちて蒸発圧力下落と過熱度過大を引き起こす。よって記述は正しい。", "explanation": "冷媒不足により膨張弁からの給液量が減ると、蒸発器後半が過熱蒸気域となり伝熱効率が落ちて蒸発圧力下落と過熱度過大を引き起こす。よって記述は正しい。"}, {"id": 2378, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "満液式シェルアンドチューブ水冷却器において、運転中にブラインや水の温度が氷点下以下に低下して管内水が凍結した場合、乾式蒸発器に比べて冷却管が破裂破損する危険性が非常に高い。", "answer": "○", "law": "満液式は伝熱管の「内側」を水・ブラインが流れるため、凍結時の体積膨張逃げ場がなく管を容易に破裂させる。管外を流れる乾式に比べて破損危険性が極めて高い。よって記述は正しい。", "explanation": "満液式は伝熱管の「内側」を水・ブラインが流れるため、凍結時の体積膨張逃げ場がなく管を容易に破裂させる。管外を流れる乾式に比べて破損危険性が極めて高い。よって記述は正しい。"}, {"id": 2379, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "空気冷却用フィンコイル蒸発器に過度な着霜が生じると、空気側通路の断面積が狭くなって風量が増加し、冷媒の蒸発温度が上昇して冷却能力が向上する。", "answer": "×", "law": "着霜が起きると空気流路抵抗の増大により風量は「減少」し、熱通過率悪化で蒸発温度・圧力も低下するため、冷却能力は著しく低下する。誤り。", "explanation": "着霜が起きると空気流路抵抗の増大により風量は「減少」し、熱通過率悪化で蒸発温度・圧力も低下するため、冷却能力は著しく低下する。誤り。"}, {"id": 2380, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ニ", "theme": "低圧部の保守管理", "question": "ブライン冷却用蒸発器において、ブラインの濃度（比重）が規定値より低下すると凍結温度が上昇するため、冬季や低負荷運転時に蒸発器内でブラインが凍結して事故を起こすおそれがある。", "answer": "○", "law": "ブライン濃度管理の不備で濃度が下がると氷点（凍結温度）が高くなり、通常の蒸発温度でもブラインが凍結して水冷却器等を破損させる原因となる。よって記述は正しい。", "explanation": "ブライン濃度管理の不備で濃度が下がると氷点（凍結温度）が高くなり、通常の蒸発温度でもブラインが凍結して水冷却器等を破損させる原因となる。よって記述は正しい。"}, {"id": 2381, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "イ", "theme": "熱交換器の伝熱特性", "question": "熱交換器における総括熱伝達率（熱通過率K）の逆数（総括熱抵抗）は、管内側の熱伝達抵抗、管壁の熱伝導抵抗、管外側の熱伝達抵抗、および両面の汚れ係数の総和で表される。", "answer": "○", "law": "直列に配置された各熱抵抗（管内側境膜、管内汚れ、管壁、管外汚れ、管外側境膜）の和が全体の熱通過抵抗（1/K）となる。よって記述は正しい。", "explanation": "直列に配置された各熱抵抗（管内側境膜、管内汚れ、管壁、管外汚れ、管外側境膜）の和が全体の熱通過抵抗（1/K）となる。よって記述は正しい。"}, {"id": 2382, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ロ", "theme": "熱交換器の伝熱特性", "question": "空気冷却用フィンチューブ熱交換器では、気体である空気側の熱伝達率が沸騰・凝縮する冷媒側に比べて著しく小さいため、空気側にフィンを設けて伝熱面積を拡大し熱抵抗を補っている。", "answer": "○", "law": "空気側の熱伝達率は冷媒側に比べて1桁以上小さいため、空気側表面にフィンを取り付けて外表面積を大きく広げ、全体の熱通過性能を確保している。よって記述は正しい。", "explanation": "空気側の熱伝達率は冷媒側に比べて1桁以上小さいため、空気側表面にフィンを取り付けて外表面積を大きく広げ、全体の熱通過性能を確保している。よって記述は正しい。"}, {"id": 2383, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ハ", "theme": "熱交換器の伝熱特性", "question": "二重管式熱交換器において、冷媒と冷却水の流れ方向を向流（対向流）にするよりも並流（並行流）にするほうが、出入口の温度差を有効に活用でき、熱通過率が大きくなる。", "answer": "×", "law": "向流（対向流）のほうが熱交換器全体にわたって温度差を大きく均一に保持できるため、対数平均温度差が大きくなり伝熱上有利である。「並流のほうが大きくなる」は誤り。", "explanation": "向流（対向流）のほうが熱交換器全体にわたって温度差を大きく均一に保持できるため、対数平均温度差が大きくなり伝熱上有利である。「並流のほうが大きくなる」は誤り。"}, {"id": 2384, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ニ", "theme": "熱交換器の伝熱特性", "question": "水冷凝縮器などの伝熱管に用いられるローフィンチューブ（低フィン管）は、裸管に比べて外表面積が拡大されており、冷媒の凝縮伝熱を促進する効果がある。", "answer": "○", "law": "ローフィン加工された管は平滑管（裸管）に比べて外表面積が約2.5〜3倍に拡大され、管外の冷媒凝縮や沸騰熱伝達を効率よく促進する。よって記述は正しい。", "explanation": "ローフィン加工された管は平滑管（裸管）に比べて外表面積が約2.5〜3倍に拡大され、管外の冷媒凝縮や沸騰熱伝達を効率よく促進する。よって記述は正しい。"}, {"id": 2385, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "イ", "theme": "膨張弁", "question": "温度自動膨張弁は、蒸発器出口の冷媒蒸気の過熱度を感温筒で検知し、ダイヤフラム上の感温筒圧力と下の蒸発圧力・ばね力のバランスによって弁開度を自動調節する。", "answer": "○", "law": "温度自動膨張弁は設定された過熱度を維持するため、感温筒の飽和圧力信号と蒸発圧力・調整ばね力の力学釣り合いで弁開度を常時調節する。よって記述は正しい。", "explanation": "温度自動膨張弁は設定された過熱度を維持するため、感温筒の飽和圧力信号と蒸発圧力・調整ばね力の力学釣り合いで弁開度を常時調節する。よって記述は正しい。"}, {"id": 2386, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ロ", "theme": "膨張弁", "question": "蒸発器内の冷媒圧力降下（圧力損失）が比較的大きい蒸発器に対して内部均圧形温度自動膨張弁を使用すると、圧力損失分だけ見かけの過熱度が大きくなりすぎ、蒸発器が有効に利用されない。", "answer": "○", "law": "内部均圧形では弁出口の圧力がダイヤフラム下面に作用するため、蒸発器出口で圧力降下があると弁が閉じ気味になり過熱度が過大（給液不足）になる。よって記述は正しい。", "explanation": "内部均圧形では弁出口の圧力がダイヤフラム下面に作用するため、蒸発器出口で圧力降下があると弁が閉じ気味になり過熱度が過大（給液不足）になる。よって記述は正しい。"}, {"id": 2387, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ハ", "theme": "膨張弁", "question": "温度自動膨張弁の感温筒を水平吸込み管に取り付ける場合、配管下部（6時方向）の油や液だまりの影響を避けるため、配管上部（1時〜4時または8時〜11時の位置）に密着させて取り付ける。", "answer": "○", "law": "感温筒を水平管に付けるときは真下（6時：油や液溜まり）や真上（12時：ガス過熱を拾いやすい）を避け、1〜4時または8〜11時の位置にバンドで密着固定する。よって記述は正しい。", "explanation": "感温筒を水平管に付けるときは真下（6時：油や液溜まり）や真上（12時：ガス過熱を拾いやすい）を避け、1〜4時または8〜11時の位置にバンドで密着固定する。よって記述は正しい。"}, {"id": 2388, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ニ", "theme": "膨張弁", "question": "定圧自動膨張弁は、蒸発器出口の過熱度を常に一定に保つ優れた過熱度制御機能をもつため、熱負荷の変動が激しい大容量の冷凍装置に最適である。", "answer": "×", "law": "定圧自動膨張弁は蒸発圧力を一定に保つ弁であり過熱度制御機能はなく負荷変動の激しい装置では液戻りや過熱を起こすため不適当である。誤り。", "explanation": "定圧自動膨張弁は蒸発圧力を一定に保つ弁であり過熱度制御機能はなく負荷変動の激しい装置では液戻りや過熱を起こすため不適当である。誤り。"}, {"id": 2389, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "イ", "theme": "調整弁", "question": "蒸発圧力調整弁（EPR）は、蒸発器の出口側に設置され、蒸発器内の圧力が設定値以下に低下しないように絞り動作を行うことで、水冷却器の凍結などを防止する。", "answer": "○", "law": "EPRは入口側圧力を感知し、設定値より下がりそうになると弁を閉じる方向へ制御して蒸発温度・圧力の下限を保持する。よって記述は正しい。", "explanation": "EPRは入口側圧力を感知し、設定値より下がりそうになると弁を閉じる方向へ制御して蒸発温度・圧力の下限を保持する。よって記述は正しい。"}, {"id": 2390, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ロ", "theme": "調整弁", "question": "吸入圧力調整弁（SPR）は、圧縮機の吸込み配管に設置され、圧縮機起動時やデフロスト復帰時などの高負荷時に吸込み圧力が過度に上昇して電動機が過負荷になるのを防止する。", "answer": "○", "law": "SPRは出口側（圧縮機側）圧力を感知し、設定上限値を超える高圧ガスが圧縮機に流入するのを制限してモータの過電流（オーバーロード）を保護する。よって記述は正しい。", "explanation": "SPRは出口側（圧縮機側）圧力を感知し、設定上限値を超える高圧ガスが圧縮機に流入するのを制限してモータの過電流（オーバーロード）を保護する。よって記述は正しい。"}, {"id": 2391, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ハ", "theme": "調整弁", "question": "空冷凝縮器用などの凝縮圧力調整弁は、冬期の外気温低下時に凝縮器内に冷媒液を滞留させて有効伝熱面積を縮小させ、凝縮圧力が下がりすぎるのを防止する。", "answer": "○", "law": "冬季の低凝縮圧力による膨張弁前後の差圧不足を防ぐため、凝縮器出口を絞って液を凝縮器内に溜め込み、有効伝熱面積を小さくして圧力を維持する。よって記述は正しい。", "explanation": "冬季の低凝縮圧力による膨張弁前後の差圧不足を防ぐため、凝縮器出口を絞って液を凝縮器内に溜め込み、有効伝熱面積を小さくして圧力を維持する。よって記述は正しい。"}, {"id": 2392, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ニ", "theme": "調整弁", "question": "水冷凝縮器に用いられる直動式冷却水調整弁（制水弁）は、凝縮圧力が上昇した際に弁を開いて冷却水量を増加させ、凝縮温度および圧力を適正範囲に保持するように動作する。", "answer": "○", "law": "制水弁は高圧側の凝縮圧力を感知し、圧力が上がると弁を開いて冷却水流量を増やし、放熱を促進して圧力を引き下げる。よって記述は正しい。", "explanation": "制水弁は高圧側の凝縮圧力を感知し、圧力が上がると弁を開いて冷却水流量を増やし、放熱を促進して圧力を引き下げる。よって記述は正しい。"}, {"id": 2393, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "イ", "theme": "制御機器・保護装置", "question": "高圧遮断圧力スイッチ（高圧カットアウト）は、凝縮圧力の異常上昇時に安全弁の作動前に圧縮機を停止させる重要保安装置であり、再起動時の安全確認のため手動復帰形とするのが原則である。", "answer": "○", "law": "高圧カットアウトは異常高圧から設備を守るため安全弁吹始め前に働き、原因究明なしに自動再起動するのを防ぐため手動復帰形（マニュアルリセット）とする。よって記述は正しい。", "explanation": "高圧カットアウトは異常高圧から設備を守るため安全弁吹始め前に働き、原因究明なしに自動再起動するのを防ぐため手動復帰形（マニュアルリセット）とする。よって記述は正しい。"}, {"id": 2394, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ロ", "theme": "制御機器・保護装置", "question": "低圧遮断圧力スイッチ（低圧カットアウト）は、冷媒漏洩や配管閉塞による吸込み圧力の異常低下を検知して圧縮機を停止させるほか、サーモスタット連動のポンプダウン制御にも利用される。", "answer": "○", "law": "低圧スイッチは低圧異常からの保護とともに、電磁弁閉止後に低圧ガスを回収して自動停止させるポンプダウン運転の主制御器として広く用いられる。よって記述は正しい。", "explanation": "低圧スイッチは低圧異常からの保護とともに、電磁弁閉止後に低圧ガスを回収して自動停止させるポンプダウン運転の主制御器として広く用いられる。よって記述は正しい。"}, {"id": 2395, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ハ", "theme": "制御機器・保護装置", "question": "油圧保護圧力スイッチ（OPS）に内蔵されているタイムディレイ（遅延タイマ）は、圧縮機始動時の一時的な油圧立ち上がり待ちや、運転中の瞬間的な油圧変動による不必要な停止を防ぐためである。", "answer": "○", "law": "起動直後や負荷変動時の数秒程度の油圧低下で毎回トリップしないよう、60〜90秒のディレイ時間を設けて軸受の焼付き防止と安定運転を両立させる。よって記述は正しい。", "explanation": "起動直後や負荷変動時の数秒程度の油圧低下で毎回トリップしないよう、60〜90秒のディレイ時間を設けて軸受の焼付き防止と安定運転を両立させる。よって記述は正しい。"}, {"id": 2396, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ニ", "theme": "制御機器・保護装置", "question": "水冷式冷凍装置の冷却水系統に設置されるフロースイッチは、冷却水温度の異常上昇を検知して警報を発する温度検知器であり、水流の有無を検知する機能はない。", "answer": "×", "law": "フロースイッチ（水流スイッチ）は管内の水が流れているかどうか（流量・流速）を機械的・電気的に検知するものであり、温度センサではない。誤り。", "explanation": "フロースイッチ（水流スイッチ）は管内の水が流れているかどうか（流量・流速）を機械的・電気的に検知するものであり、温度センサではない。誤り。"}, {"id": 2397, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "イ", "theme": "附属機器", "question": "油分離器は、圧縮機から吐き出されたガス中の冷凍機油を分離してクランクケースへ戻す機器であり、アンモニアと鉱油のように非相溶の冷媒・油を使用する装置では特に重要である。", "answer": "○", "law": "アンモニアと鉱油は混ざり合わないため、吐き出された油が凝縮器や蒸発器に残留して伝熱を悪化させるのを防ぐため、油分離器の設置が不可欠である。よって記述は正しい。", "explanation": "アンモニアと鉱油は混ざり合わないため、吐き出された油が凝縮器や蒸発器に残留して伝熱を悪化させるのを防ぐため、油分離器の設置が不可欠である。よって記述は正しい。"}, {"id": 2398, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ロ", "theme": "附属機器", "question": "高圧受液器の容量は、運転中の冷媒量変動を吸収するとともに、点検・修理時に装置内の冷媒全量を回収（ポンプダウン）する際、液封防止のため容器内容積の80%以下の保有量とする。", "answer": "○", "law": "受液器は回収時にも20%以上の気相部（安全余裕スペース）を残すため、最大充填回収量は容器内容積の80%以下に設計・制限される。よって記述は正しい。", "explanation": "受液器は回収時にも20%以上の気相部（安全余裕スペース）を残すため、最大充填回収量は容器内容積の80%以下に設計・制限される。よって記述は正しい。"}, {"id": 2399, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ハ", "theme": "附属機器", "question": "フィルタドライヤは、冷媒配管内の固形異物を除くストレーナと、水分を吸着除去する乾燥剤を一体化したものであり、フルオロカーボン冷媒装置の液管に通常設置される。", "answer": "○", "law": "フルオロカーボン装置では水分によるアイスプラグや酸生成を防ぐため、合成ゼオライト等の乾燥剤とゴミ濾過フィルタを内蔵したドライヤを液管に配置する。よって記述は正しい。", "explanation": "フルオロカーボン装置では水分によるアイスプラグや酸生成を防ぐため、合成ゼオライト等の乾燥剤とゴミ濾過フィルタを内蔵したドライヤを液管に配置する。よって記述は正しい。"}, {"id": 2400, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ニ", "theme": "附属機器", "question": "低圧吸込み管に設けられるアキュムレータ（液分離器）は、蒸発器から戻る未蒸発の液冷媒を重力分離し、蓄えられた液冷媒を装置の負荷に関わらず一気に圧縮機へ送り込んで冷媒循環を促進する。", "answer": "×", "law": "アキュムレータは液冷媒を分離して圧縮機への液バック（液圧縮）を防ぐための安全機器であり、「一気に送り込む」と液圧縮で圧縮機が破損する。誤り。", "explanation": "アキュムレータは液冷媒を分離して圧縮機への液バック（液圧縮）を防ぐための安全機器であり、「一気に送り込む」と液圧縮で圧縮機が破損する。誤り。"}, {"id": 2401, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "イ", "theme": "附属機器・冷凍サイクル", "question": "フルオロカーボン冷凍装置に用いられる液ガス熱交換器は、凝縮器からの高圧液冷媒を過冷却して液管内でのフラッシュガス発生を防ぎ、同時に吸込み蒸気を過熱して湿り運転を防止する。", "answer": "○", "law": "液ガス熱交により液側は過冷却されて気泡発生を防ぎ、ガス側は過熱度を得てコンプレッサの液圧縮を防止するという二つの大きなメリットを持つ。よって記述は正しい。", "explanation": "液ガス熱交により液側は過冷却されて気泡発生を防ぎ、ガス側は過熱度を得てコンプレッサの液圧縮を防止するという二つの大きなメリットを持つ。よって記述は正しい。"}, {"id": 2402, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ロ", "theme": "附属機器・冷凍サイクル", "question": "大形アンモニア冷凍装置に設置される不凝縮ガス分離器（ガスパージャ）では、不凝縮ガスを冷却して冷媒成分のみを凝縮液化して系統に戻し、不凝縮ガスを安全に分離排出する。", "answer": "○", "law": "パージャは冷却管でアンモニア蒸気を凝縮回収し、残存した空気などの不凝縮ガスを水洗・除害装置等を通じて安全に大気放散させる。よって記述は正しい。", "explanation": "パージャは冷却管でアンモニア蒸気を凝縮回収し、残存した空気などの不凝縮ガスを水洗・除害装置等を通じて安全に大気放散させる。よって記述は正しい。"}, {"id": 2403, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ハ", "theme": "附属機器・冷凍サイクル", "question": "フルオロカーボン冷媒の満液式蒸発器や低圧受液器において、冷凍機油が冷媒液に溶解して高濃度に濃縮された場合、油回収器（オイルリクレーマ）等を用いて油を分離し圧縮機に戻す。", "answer": "○", "law": "満液式等では油が冷媒液に溶け込んで濃縮されるため、一部を抜き出して油回収器で加熱・蒸発させ、油分を圧縮機へ、冷媒蒸気を吸込み管へ戻す処理を行う。よって記述は正しい。", "explanation": "満液式等では油が冷媒液に溶け込んで濃縮されるため、一部を抜き出して油回収器で加熱・蒸発させ、油分を圧縮機へ、冷媒蒸気を吸込み管へ戻す処理を行う。よって記述は正しい。"}, {"id": 2404, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ニ", "theme": "附属機器・冷凍サイクル", "question": "冷媒液強制循環式冷凍装置では、低圧受液器で気液分離が行われるため、循環用液ポンプとは別に、圧縮機への吸込み過熱度を確保するための専用液分離器を必ず直列に追加しなければならない。", "answer": "×", "law": "低圧受液器自身が液分離器（アキュムレータ）としての機能を完全に兼ねているため、別に専用の液分離器を追加する必要はない。「必ず追加しなければならない」は誤り。", "explanation": "低圧受液器自身が液分離器（アキュムレータ）としての機能を完全に兼ねているため、別に専用の液分離器を追加する必要はない。「必ず追加しなければならない」は誤り。"}, {"id": 2405, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "イ", "theme": "冷媒配管の施工と保守", "question": "配管用炭素鋼鋼管（SGP）は、毒性ガス冷媒、フルオロカーボン冷媒の設計圧力が1MPaを超える耐圧部分、温度が100℃を超える部分、および-25℃より低温の部分には使用してはならない。", "answer": "○", "law": "SGP（白管・黒管）は高圧、高温（100℃超）、あるいは低温（-25℃未満）や毒性ガス配管としての使用が法規および規格で制限されている。よって記述は正しい。", "explanation": "SGP（白管・黒管）は高圧、高温（100℃超）、あるいは低温（-25℃未満）や毒性ガス配管としての使用が法規および規格で制限されている。よって記述は正しい。"}, {"id": 2406, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ロ", "theme": "冷媒配管の施工と保守", "question": "年間を通じて運転する冷凍装置の吐出しガス配管では、冬季停止中に屋外の凝縮器側で冷媒が凝縮・再蒸発し、温度の低い圧縮機頭部や吐出し配管に液体として溜まる寝込み現象を防ぐため、逆止め弁を設けることがある。", "answer": "○", "law": "屋外凝縮器と室内圧縮機間の温度差による冷媒の移動（寝込み）を防ぎ、再起動時の液圧縮を避けるため、吐出配管上部に逆止め弁（チェックバルブ）を配置する。よって記述は正しい。", "explanation": "屋外凝縮器と室内圧縮機間の温度差による冷媒の移動（寝込み）を防ぎ、再起動時の液圧縮を避けるため、吐出配管上部に逆止め弁（チェックバルブ）を配置する。よって記述は正しい。"}, {"id": 2407, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ハ", "theme": "冷媒配管の施工と保守", "question": "2台以上の圧縮機を並列運転する場合の吐出しガス配管を共通の主管に接続するときは、油や液冷媒の逆流を防ぐため、主管の下側（下面）から合流させるように接続する。", "answer": "×", "law": "停止中の圧縮機への油や液の逆流・流入を防ぐため、吐出し枝管は共通主管の「上側（上面）」から接続する。「下側から接続する」は誤り。", "explanation": "停止中の圧縮機への油や液の逆流・流入を防ぐため、吐出し枝管は共通主管の「上側（上面）」から接続する。「下側から接続する」は誤り。"}, {"id": 2408, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ニ", "theme": "冷媒配管の施工と保守", "question": "装置の運転中に冷媒温度よりも周囲温度の方が低い液管では、電磁弁と止め弁で密閉される液管区間では、外気温による液の熱膨張で異常高圧を招き配管が破裂する液封事故に注意する。", "answer": "○", "law": "周囲温度より低温の液冷媒が満液のまま両端を弁で封鎖されると、外気からの吸熱で液体が膨張し凄まじい高圧を生じて破裂するため、液封対策（逃がし管等）が必須。よって記述は正しい。", "explanation": "周囲温度より低温の液冷媒が満液のまま両端を弁で封鎖されると、外気からの吸熱で液体が膨張し凄まじい高圧を生じて破裂するため、液封対策（逃がし管等）が必須。よって記述は正しい。"}, {"id": 2409, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "イ", "theme": "安全装置", "question": "高圧遮断装置（高圧カットアウト）は、凝縮圧力等の異常上昇時に、安全弁の作動よりも低い圧力で圧縮機を自動停止させ、冷媒の外部大気放出を未然に防止する役割をもつ。", "answer": "○", "law": "高圧カットアウトは安全弁吹始め圧力の前に動作して圧縮機を止め、冷媒ガスが安全弁から環境へ放出されるのを防ぐ第一の防壁である。よって記述は正しい。", "explanation": "高圧カットアウトは安全弁吹始め圧力の前に動作して圧縮機を止め、冷媒ガスが安全弁から環境へ放出されるのを防ぐ第一の防壁である。よって記述は正しい。"}, {"id": 2410, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ロ", "theme": "安全装置", "question": "圧力容器に設置するスプリング式安全弁の必要最小口径は、冷媒ガスの種類、容器の外径、および全長に基づいて算出される計算式により決定される。", "answer": "○", "law": "圧力容器用安全弁の最小口径計算式 d3 = C3 * sqrt(D * L) に従い、容器寸法と冷媒係数から必要吹出し量が確保できるよう決定される。よって記述は正しい。", "explanation": "圧力容器用安全弁の最小口径計算式 d3 = C3 * sqrt(D * L) に従い、容器寸法と冷媒係数から必要吹出し量が確保できるよう決定される。よって記述は正しい。"}, {"id": 2411, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ハ", "theme": "安全装置", "question": "溶栓（可溶栓）は所定温度で合金が溶融して圧力を逃がす安全装置であり、水冷横形シェルアンドチューブ凝縮器において圧縮機の高温な吐出しガスが直接当たる場所や管板部に取り付けてよい。", "answer": "×", "law": "溶栓は高温の吐出しガスに直接さらされる場所や冷却水ですぐ冷却される管板部に取り付けると、温度分布の不均一や誤作動・早期溶融を招くため取り付けてはならない。誤り。", "explanation": "溶栓は高温の吐出しガスに直接さらされる場所や冷却水ですぐ冷却される管板部に取り付けると、温度分布の不均一や誤作動・早期溶融を招くため取り付けてはならない。誤り。"}, {"id": 2412, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ニ", "theme": "安全装置", "question": "アンモニア冷媒設備において、液封による異常昇圧のおそれがある部分には安全弁または圧力逃がし装置を取り付けるが、放出管を設けて水槽式などの除害装置へ接続しなければならない。", "answer": "○", "law": "アンモニアは毒性・可燃性ガスであるため、液封や安全弁から放出されたガスは大気直放散とせず、除害施設（水スクラバー等）へ導いて安全処理することが義務付けられる。よって記述は正しい。", "explanation": "アンモニアは毒性・可燃性ガスであるため、液封や安全弁から放出されたガスは大気直放散とせず、除害施設（水スクラバー等）へ導いて安全処理することが義務付けられる。よって記述は正しい。"}, {"id": 2413, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "イ", "theme": "圧力試験・溶接部試験", "question": "耐圧試験は、圧縮機や圧力容器などの構成機器（配管を除く）について、製造時や据付改造時に所定の試験圧力（液体1.5倍以上）で行う全数試験であるが、部品ごとに合格していれば組立て後の再試験は省略できる。", "answer": "○", "law": "個々の構成部品や機器単体で所定の耐圧試験に合格している場合、それらを組み立てた完成機器についての再耐圧試験は省略することが認められている。よって記述は正しい。", "explanation": "個々の構成部品や機器単体で所定の耐圧試験に合格している場合、それらを組み立てた完成機器についての再耐圧試験は省略することが認められている。よって記述は正しい。"}, {"id": 2414, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ロ", "theme": "圧力試験・溶接部試験", "question": "気密試験は、冷媒設備の配管部分を除く構成機器の個々について、耐圧試験を実施する前にあらかじめ気密性能を確かめる目的で実施される。", "answer": "×", "law": "気密試験は耐圧強度が十分に確認された機器・設備に対して、耐圧試験の「後」に引き続いて（または完了後に）漏れの有無を確認するために行う。「耐圧試験の前に」は誤り。", "explanation": "気密試験は耐圧強度が十分に確認された機器・設備に対して、耐圧試験の「後」に引き続いて（または完了後に）漏れの有無を確認するために行う。「耐圧試験の前に」は誤り。"}, {"id": 2415, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ハ", "theme": "圧力試験・溶接部試験", "question": "真空試験は冷媒設備の気密最終確認として行われ、系内を水蒸気飽和圧力以下に減圧して十分長時間放置し、温度変化に対する圧力変動が規定内（例：5K変化で0.7kPa以内等）であることを確認する。", "answer": "○", "law": "真空放置試験は微小リークや水分残存を確認するための最終確認であり、規定時間後の温度・圧力変化量が許容値内か厳密に評価する。よって記述は正しい。", "explanation": "真空放置試験は微小リークや水分残存を確認するための最終確認であり、規定時間後の温度・圧力変化量が許容値内か厳密に評価する。よって記述は正しい。"}, {"id": 2416, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ニ", "theme": "圧力試験・溶接部試験", "question": "法定冷凍能力20トン以上の冷媒設備の圧力容器における突合せ溶接部には、機械試験（引張・各種曲げ・衝撃試験）および非破壊試験（放射線・超音波探傷等）の実施が規定されている。", "answer": "○", "law": "高圧ガス保安法の例示基準により、法定能力20トン以上の第一種圧力容器の主溶接部には厳格な溶接継手機械試験および非破壊検査が義務付けられている。よって記述は正しい。", "explanation": "高圧ガス保安法の例示基準により、法定能力20トン以上の第一種圧力容器の主溶接部には厳格な溶接継手機械試験および非破壊検査が義務付けられている。よって記述は正しい。"}, {"id": 2417, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "イ", "theme": "据付け・試運転・冷媒性状", "question": "コンクリート基礎の質量は、その上に据え付ける冷凍機や多気筒圧縮機の質量よりも大きく設計され、通常は機器質量の2〜3倍程度の質量をもたせて起振力を受け止める。", "answer": "○", "law": "多気筒圧縮機等の往復機械の振動を安定して吸収するため、コンクリート基礎ブロック質量は機器質量の2〜3倍（あるいはそれ以上）を確保して据え付ける。よって記述は正しい。", "explanation": "多気筒圧縮機等の往復機械の振動を安定して吸収するため、コンクリート基礎ブロック質量は機器質量の2〜3倍（あるいはそれ以上）を確保して据え付ける。よって記述は正しい。"}, {"id": 2418, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ロ", "theme": "据付け・試運転・冷媒性状", "question": "冷凍機油を選定する際、常用蒸発温度で凝固しないこと、油中のろう分（ワックス）が低温で析出して膨張弁等を閉塞させないよう、流動点（凝固点）が十分低いものを選ぶ。", "answer": "○", "law": "低温部でのワックス析出は冷媒の流れや熱交換を阻害するため、使用蒸発温度に対して流動点やフロック点が十分に低い専用油を選定する。よって記述は正しい。", "explanation": "低温部でのワックス析出は冷媒の流れや熱交換を阻害するため、使用蒸発温度に対して流動点やフロック点が十分に低い専用油を選定する。よって記述は正しい。"}, {"id": 2419, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ハ", "theme": "据付け・試運転・冷媒性状", "question": "冷媒量が不足すると蒸発圧力が低下し、圧縮機の吸込み過熱度が大きくなって吐出しガス温度が上昇し、結果として冷凍能力が低下する。一方、過充てんでは有効伝熱面積が減少し高圧が上昇して動力が大きくなる。", "answer": "○", "law": "冷媒不足は過熱度増大・吐出温度上昇を招き、過充てん（液没）は凝縮有効面積を狭めて高圧を跳ね上げ消費電力を増大させる。双方とも悪影響をもたらす。よって記述は正しい。", "explanation": "冷媒不足は過熱度増大・吐出温度上昇を招き、過充てん（液没）は凝縮有効面積を狭めて高圧を跳ね上げ消費電力を増大させる。双方とも悪影響をもたらす。よって記述は正しい。"}, {"id": 2420, "subject": "保安管理", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ニ", "theme": "据付け・試運転・冷媒性状", "question": "フルオロカーボン冷媒は一般に毒性や可燃性が低い安定した物質であるが、高温の物体や裸火に触れると熱分解して、毒性のない可燃性ガス（フッ化水素やホスゲン等）を生成する。", "answer": "×", "law": "フルオロカーボンが熱分解して生じるフッ化水素やホスゲンは、可燃性ではなく「極めて強い毒性をもつ有害ガス」である。「毒性はない」との記述は誤り。", "explanation": "フルオロカーボンが熱分解して生じるフッ化水素やホスゲンは、可燃性ではなく「極めて強い毒性をもつ有害ガス」である。「毒性はない」との記述は誤り。"}, {"id": 2421, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "イ", "theme": "圧縮機の種類と構造、特徴", "question": "往復動圧縮機において、ピストンがシリンダ内で往復運動を行うとき、吸込み弁および吐出し弁の開閉はシリンダ内の圧力と吸込み・吐出し側圧力との差圧によって自動的に行われる。", "answer": "○", "law": "往復動圧縮機の吸込み弁・吐出し弁は、特殊な外部駆動機構をもたず、シリンダ内圧力と外側（吸込・吐出）圧力との差圧によって自動的に開閉する自動弁である。よって記述は正しい。", "explanation": "往復動圧縮機の吸込み弁・吐出し弁は、特殊な外部駆動機構をもたず、シリンダ内圧力と外側（吸込・吐出）圧力との差圧によって自動的に開閉する自動弁である。よって記述は正しい。"}, {"id": 2422, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "ロ", "theme": "圧縮機の種類と構造、特徴", "question": "ツインスクリュー圧縮機は、雄ロータと雌ロータの歯溝容積が吐出し側へ移動するにつれて縮小することで冷媒を圧縮する容積圧縮機である。", "answer": "○", "law": "ツインスクリュー圧縮機は、互いに噛み合う雌雄ロータとケーシングとの間に形成される空間が回転に伴って吸込み側から吐出し側へ移動しながら連続的に縮小して圧縮を行う。よって記述は正しい。", "explanation": "ツインスクリュー圧縮機は、互いに噛み合う雌雄ロータとケーシングとの間に形成される空間が回転に伴って吸込み側から吐出し側へ移動しながら連続的に縮小して圧縮を行う。よって記述は正しい。"}, {"id": 2423, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "ハ", "theme": "圧縮機の種類と構造、特徴", "question": "スクロール圧縮機は吸込み弁と吐出し弁を必要としないが、停止時に高低圧の差圧で旋回スクロールが逆回転するため逆転防止機能が必要である。", "answer": "○", "law": "スクロール圧縮機は停止時の差圧逆転を防ぐ逆転防止機構が必要であり、吸込み弁は不要だが吐出し側には逆止め機構等が設けられる。よって記述は正しい。", "explanation": "スクロール圧縮機は停止時の差圧逆転を防ぐ逆転防止機構が必要であり、吸込み弁は不要だが吐出し側には逆止め機構等が設けられる。よって記述は正しい。"}, {"id": 2424, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "ニ", "theme": "圧縮機の種類と構造、特徴", "question": "遠心圧縮機は、高速回転する羽根車（インペラ）によって冷媒蒸気に与えられた遠心力と速度エネルギーを、固定流路であるディフューザ等で圧力エネルギーに変換するターボ型圧縮機であり、小容量の空調用冷凍装置に広く用いられる。", "answer": "×", "law": "遠心圧縮機は多量の蒸気を取り扱う大容量用途に適しており、小容量の冷凍装置には適さない。「小容量に広く用いられる」は誤り。", "explanation": "遠心圧縮機は多量の蒸気を取り扱う大容量用途に適しており、小容量の冷凍装置には適さない。「小容量に広く用いられる」は誤り。"}, {"id": 2425, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "イ", "theme": "冷凍装置の容量制御", "question": "多気筒往復圧縮機のアンローダ機構は、吸込み弁を強制開放して作動気筒数を減らすことにより、容量を段階的に変えることができる。", "answer": "○", "law": "アンローダ機構は吸込み弁を開放して段階的な容量制御を行う。よって正しい。", "explanation": "アンローダ機構は吸込み弁を開放して段階的な容量制御を行う。よって正しい。"}, {"id": 2426, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "ロ", "theme": "冷凍装置の容量制御", "question": "インバータによる回転速度制御では、圧縮機の回転速度と容量は全範囲にわたってつねに完全な正比例を維持し、極低速域でも体積効率は低下しない。", "answer": "×", "law": "極低速域では体積効率が低下し油圧も不足する。「全範囲でつねに完全な正比例」は誤り。", "explanation": "極低速域では体積効率が低下し油圧も不足する。「全範囲でつねに完全な正比例」は誤り。"}, {"id": 2427, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "ハ", "theme": "冷凍装置の容量制御", "question": "圧縮機の吸込み配管に蒸発圧力調整弁（EPR）を取り付けると、弁作動時に吸込み圧力が低下して圧縮機の容量制御ができる。", "answer": "○", "law": "EPRの絞り作動により圧縮機吸込み圧力が低下し容量制御が行われる。よって正しい。", "explanation": "EPRの絞り作動により圧縮機吸込み圧力が低下し容量制御が行われる。よって正しい。"}, {"id": 2428, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "ニ", "theme": "冷凍装置の容量制御", "question": "ホットガスバイパスによる容量制御では、バイパス量が多くなると凝縮器の熱負荷が減少しすぎて凝縮圧力が低くなりすぎる場合がある。", "answer": "○", "law": "過剰なホットガスバイパスは凝縮負荷を低下させ凝縮圧力を異常低下させる。よって正しい。", "explanation": "過剰なホットガスバイパスは凝縮負荷を低下させ凝縮圧力を異常低下させる。よって正しい。"}, {"id": 2429, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "イ", "theme": "圧縮機の運転と保守管理", "question": "往復圧縮機の吸込み弁板に割れが生じると、シリンダ内の高圧ガスが吸込み側に逆流して体積効率が低下する。", "answer": "○", "law": "吸込み弁の破損・漏れは体積効率の著しい低下を招く。よって正しい。", "explanation": "吸込み弁の破損・漏れは体積効率の著しい低下を招く。よって正しい。"}, {"id": 2430, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "ロ", "theme": "圧縮機の運転と保守管理", "question": "中形・大形の往復圧縮機では油ポンプによる強制給油潤滑式が採用され、油圧が低くなりすぎると油圧保護圧力スイッチが作動して圧縮機が停止する。", "answer": "○", "law": "油圧保護スイッチは油圧不足時に作動して圧縮機を停止させる。よって正しい。", "explanation": "油圧保護スイッチは油圧不足時に作動して圧縮機を停止させる。よって正しい。"}, {"id": 2431, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "ハ", "theme": "圧縮機の運転と保守管理", "question": "スクリュー圧縮機の吐出しガス温度が異常に高い場合、油量不足や油温上昇、吸込み過熱度の過大などが原因として考えられる。", "answer": "○", "law": "給油冷却が不足したり吸込み過熱度が大きいと吐出温度が異常上昇する。よって正しい。", "explanation": "給油冷却が不足したり吸込み過熱度が大きいと吐出温度が異常上昇する。よって正しい。"}, {"id": 2432, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "ニ", "theme": "圧縮機の運転と保守管理", "question": "冷媒の過充てんにより膨張弁手前のサイトグラスに気泡が発生するため、過充てん運転には十分注意しなければならない。", "answer": "×", "law": "サイトグラスの気泡は冷媒不足を示すものであり、過充てんでは気泡は発生しない。誤り。", "explanation": "サイトグラスの気泡は冷媒不足を示すものであり、過充てんでは気泡は発生しない。誤り。"}, {"id": 2433, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "イ", "theme": "凝縮器の保守管理", "question": "水冷シェルアンドチューブ凝縮器の冷却管にスケールが付着すると、熱通過率が低下し凝縮温度および圧力が上昇する。", "answer": "○", "law": "スケールの付着は熱通過率を低下させ凝縮圧力を上昇させる。よって正しい。", "explanation": "スケールの付着は熱通過率を低下させ凝縮圧力を上昇させる。よって正しい。"}, {"id": 2434, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "ロ", "theme": "凝縮器の保守管理", "question": "凝縮器内に不凝縮ガスが混入すると、分圧の上昇や伝熱阻害により凝縮温度が上昇し、圧縮機の所要電力が増加する。", "answer": "○", "law": "不凝縮ガスの混入は全圧上昇と伝熱阻害を招き所要電力が増加する。よって正しい。", "explanation": "不凝縮ガスの混入は全圧上昇と伝熱阻害を招き所要電力が増加する。よって正しい。"}, {"id": 2435, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "ハ", "theme": "凝縮器の保守管理", "question": "空冷凝縮器において冬季に外気温度が低下して凝縮圧力が低下したとき、送風機の風量を増加させることが根本的な昇圧対策となる。", "answer": "×", "law": "冬季の低圧対策として送風機風量を「減少・停止」させるか圧力調整弁を用いる。「風量を増加させる」は誤り。", "explanation": "冬季の低圧対策として送風機風量を「減少・停止」させるか圧力調整弁を用いる。「風量を増加させる」は誤り。"}, {"id": 2436, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "ニ", "theme": "凝縮器の保守管理", "question": "受液器兼用の水冷凝縮器に冷媒を過充てんすると、冷却管が液没して有効伝熱面積が減少し、凝縮温度が上昇する。", "answer": "○", "law": "過充てんによる液没は有効伝熱面積を減らし凝縮温度を上昇させる。よって正しい。", "explanation": "過充てんによる液没は有効伝熱面積を減らし凝縮温度を上昇させる。よって正しい。"}, {"id": 2437, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "イ", "theme": "低圧部の保守管理", "question": "圧縮機が液圧縮を起こしていると判断したときは、直ちに吸込み止め弁を絞るなどの緊急措置を講じる必要がある。", "answer": "○", "law": "液圧縮時は直ちに吸込み弁を絞るか閉じて液流入を遮断する。よって正しい。", "explanation": "液圧縮時は直ちに吸込み弁を絞るか閉じて液流入を遮断する。よって正しい。"}, {"id": 2438, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "ロ", "theme": "低圧部の保守管理", "question": "満液式シェルアンドチューブ水冷却器は管内を水が流れるため、運転中に蒸発温度が氷点下以下になって水が凍結した場合、冷却管破損の危険性が高い。", "answer": "○", "law": "満液式は管内水凍結により冷却管が容易に破裂する。よって正しい。", "explanation": "満液式は管内水凍結により冷却管が容易に破裂する。よって正しい。"}, {"id": 2439, "subject": "保安管理", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "ハ", "theme": "低圧部の保守管理", "question": "フィンコイル乾式蒸発器に厚く着霜すると、空気抵抗の増大に
