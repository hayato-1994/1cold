よる除害免除", "question": "（アンモニア250t）この製造施設から漏えいするガスが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設ければ、この製造設備には、その設備の冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じる必要はない。", "answer": "×", "law": "冷規第7条第1項第15号・第16号", "explanation": "毒性ガスの除害措置義務は、漏えい検知警報設備を設置しても免除されない（両方の設置が必要なため誤り）。"}, {"id": 220, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "イ", "theme": "保安責任者の資格要件", "question": "（R134a 600t）この事業所の冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が100トン以上である製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有している者のうちから選任しなければならない。", "answer": "○", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "認定指定設備Bを除く設備A（300t）で判定する。300t以上の設備は「1冷免状」＋「100t以上で1年の製造経験」が必要。"}, {"id": 221, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の解任・選任届", "question": "（R134a 600t）この事業所に選任している冷凍保安責任者を解任し、新たな者を選任したときは、遅滞なく、その解任及び選任の旨を都道府県知事に届け出なければならないが、冷凍保安責任者の代理者を解任及び選任したときには、その必要はない。", "answer": "×", "law": "法第33条第3項、法第27条の2第5項", "explanation": "代理者についても、冷凍保安責任者と同様に選任・解任の旨を遅滞なく知事に届け出なければならない（必要はないは誤り）。"}, {"id": 222, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問14", "branch": "ハ", "theme": "代理者の資格要件", "question": "（R134a 600t）この事業所の冷凍保安責任者の代理者には、高圧ガスの製造に関する所定の知識経験を有する者であれば、所定の製造保安責任者免状の交付を受けていない者を選任することができる。", "answer": "×", "law": "法第33条第1項、冷規第36条第1項", "explanation": "代理者にも冷凍保安責任者と同等の免状交付及び実務経験が必須である（免状未取得者を選任できるは誤り）。"}, {"id": 223, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "イ", "theme": "指定設備の保安検査除外", "question": "（R134a 600t）認定指定設備である製造設備Bの部分を除く製造施設について、保安検査を定期に受けなければならない。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備の部分は「特定施設」から除外されるため、保安検査はこれを除く設備Aについて定期に受ける。"}, {"id": 224, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ロ", "theme": "保安検査の対象", "question": "（R134a 600t）保安検査は、特定施設が製造施設の位置、構造及び設備に係る技術上の基準に適合しているかどうかについて行われる。", "answer": "○", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査は特定施設の位置・構造・設備（ハード基準）が基準に適合しているかどうかについて行われる。"}, {"id": 225, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問15", "branch": "ハ", "theme": "保安検査の実施主体", "question": "（R134a 600t）この事業者は、この製造施設の保安検査を冷凍保安責任者に行わせなければならない。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事（または協会・指定機関）が行う行政検査であり、自社の冷凍保安責任者が行うものではない（誤り）。"}, {"id": 226, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問16", "branch": "イ", "theme": "圧縮機取替の軽微変更", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものは、軽微な変更の工事として、その完成後遅滞なく、都道府県知事に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で、切断溶接なし・能力変更なしの設備取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 227, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問16", "branch": "ロ", "theme": "通常設備C増設の許可必要", "question": "（R134a 600t）この製造施設に製造設備Aと同じ製造設備Cを増設し、製造設備A及びBとブラインを共通にするときは、軽微な変更の工事として、都道府県知事に届け出ればよい。", "answer": "×", "law": "法第14条第1項、冷規第17条第1項第4号", "explanation": "認定指定設備の増設は軽微工事だが、設備Aと同じ通常設備Cの増設は軽微工事にならず、都道府県知事の変更許可が必要（誤り）。"}, {"id": 228, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問16", "branch": "ハ", "theme": "完成検査不要の変更工事", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更が所定の範囲であるものは、都道府県知事の許可を受けなければならないが、その変更の工事の完成後、その製造施設の完成検査を受けることなく使用することができる。", "answer": "○", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "不活性フルオロカーボン設備で切断溶接なし・能力変更が所定範囲内（20%以内）の取替えは、許可は必要だが完成検査なしで使用できる。"}, {"id": 229, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問17", "branch": "イ", "theme": "安全弁止め弁の全開義務", "question": "（R134a 600t）冷媒設備の安全弁に付帯して設けた止め弁は、常に全開しておかなければならないが、その安全弁の修理又は清掃のため特に必要な場合に限り閉止してよい。", "answer": "○", "law": "冷規第9条第1号", "explanation": "安全弁に付帯する止め弁は常に全開が原則であり、修理・清掃のため特に必要な場合に限り閉止が認められる。"}, {"id": 230, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問17", "branch": "ロ", "theme": "日常点検の頻度", "question": "（R134a 600t）高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日に1回以上その製造設備の属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "○", "law": "冷規第9条第2号", "explanation": "日常の製造保安管理として、1日に1回以上製造施設全体の異常の有無を点検することが義務付けられている。"}, {"id": 231, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問17", "branch": "ハ", "theme": "修理清掃の作業計画", "question": "（R134a 600t）冷媒設備の修理又は清掃は、あらかじめ、その作業計画及びその作業の責任者を定めて行わなければならない。", "answer": "○", "law": "冷規第9条第3号イ", "explanation": "冷媒設備の修理又は清掃を行う際は、あらかじめ作業計画及び作業責任者を定めて行わなければならない。"}, {"id": 232, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問18", "branch": "イ", "theme": "警戒標の掲示義務", "question": "（R134a 600t）製造施設には、その製造施設の外部から見やすいように警戒標を掲げなければならない。", "answer": "○", "law": "冷規第7条第1項第2号", "explanation": "製造施設の外部から見やすい箇所への警戒標掲示は、第一種製造施設全般に義務付けられている。"}, {"id": 233, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問18", "branch": "ロ", "theme": "油圧系統の圧力計免除", "question": "（R134a 600t）この製造施設の冷媒設備には圧力計を設けなければならないが、その冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その圧縮機の油圧系統には圧力計を設けなくてよい。", "answer": "○", "law": "冷規第7条第1項第7号", "explanation": "強制潤滑方式で油圧保護装置（OPS）を有している場合、当該圧縮機の油圧系統への圧力計の取り付けは免除される。"}, {"id": 234, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問18", "branch": "ハ", "theme": "気体耐圧試験の圧力基準", "question": "（R134a 600t）この製造施設の配管以外の冷媒設備について行う耐圧試験は、「水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力以上の圧力で行うことができる。」と定められている。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "気体を使用して耐圧試験を行う場合の圧力は「許容圧力の1.25倍以上」である（「許容圧力以上」は誤り）。"}, {"id": 235, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問19", "branch": "イ", "theme": "バルブ適切操作措置", "question": "（R134a 600t）この製造設備Aに設けたバルブ又はコックであって、操作ボタン等を使用することなく自動制御で開閉されるバルブ又はコック以外のものには、作業員が適切にそのバルブ又はコックを操作することができるような措置を講じなければならない。", "answer": "○", "law": "冷規第7条第1項第17号", "explanation": "完全自動制御以外のバルブ・コックには、作業員が適切に操作できる措置（識別表示・誤操作防止等）を講じる必要がある。"}, {"id": 236, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問19", "branch": "ロ", "theme": "配管工事の気密試験圧力", "question": "（R134a 600t）この製造設備Aの冷媒設備の配管の変更の工事の完成検査において行う気密試験の圧力は、許容圧力以上の圧力としなければならない。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "完成検査における気密試験は「許容圧力以上の圧力」で行わなければならない。"}, {"id": 237, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問19", "branch": "ハ", "theme": "安全装置の設置", "question": "（R134a 600t）この冷媒設備には、その設備内の冷媒ガスの圧力が許容圧力を超えた場合に直ちにその圧力を許容圧力以下に戻すことができる安全装置を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第8号", "explanation": "冷媒設備内の圧力が許容圧力を超えた場合に直ちに許容圧力以下に戻す安全装置（安全弁等）の設置が義務付けられている。"}, {"id": 238, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の組立場所", "question": "（R134a 600t・設備B）この設備の冷媒設備は、使用場所であるこの事業所において脚上又は1つの架台上に組み立てられたものでなければならない。", "answer": "×", "law": "冷規第57条第3号", "explanation": "指定設備は「製造業者の事業所において」脚上又は一つの架台上に組み立てられたものでなければならない（使用場所において組み立ては誤り）。"}, {"id": 239, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の止め弁", "question": "（R134a 600t・設備B）この設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用することができる。", "answer": "×", "law": "冷規第57条第12号", "explanation": "日常の運転操作に必要となる冷媒ガスの止め弁には「手動式のものを使用しないこと」と定められている（使用できるは誤り）。"}, {"id": 240, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備改造時の失効", "question": "（R134a 600t・設備B）この設備に変更の工事を施すと、指定設備認定証が無効になる場合がある。", "answer": "○", "law": "冷規第62条第1項第1号", "explanation": "同等部品交換以外の変更工事を施したときは、指定設備認定証が無効となるため正。"}, {"id": 241, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "イ", "theme": "法の目的", "question": "高圧ガス保安法は、公共の安全を確保することを目的としており、高圧ガスによる災害を防止するため、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱を規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することが定められている。", "answer": "○", "law": "法第1条", "explanation": "法第1条に定められた法の目的に完全に合致する。行政による規制と民間・協会の自主的保安活動の促進が2大支柱である。"}, {"id": 242, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガス定義", "question": "現在の圧力が0.1メガパスカルの圧縮ガス（圧縮アセチレンガスを除く。）であって、温度35度において圧力が0.2メガパスカルとなるものは、高圧ガスである。", "answer": "×", "law": "法第2条第1号", "explanation": "圧縮ガスが高圧ガスとなるのは常用温度で現に1 MPa以上、または温度35度において1 MPa以上となるものである。35度で0.2 MPaは要件を満たさない（高圧ガスではない）。"}, {"id": 243, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問1", "branch": "ハ", "theme": "高圧ガス定義", "question": "現在の圧力が0.1メガパスカルの液化ガスであって、温度35度において圧力が1メガパスカルとなるものは、高圧ガスである。", "answer": "○", "law": "法第2条第3号", "explanation": "液化ガスは圧力が0.2 MPa以上となる場合の温度が35度以下であれば高圧ガスとなる。35度で1 MPa（0.2 MPa超）となるため高圧ガスに該当する。"}, {"id": 244, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "イ", "theme": "適用除外", "question": "1日の冷凍能力が5トン未満の冷凍設備内における冷媒ガスである全てのフルオロカーボンは、高圧ガス保安法の適用を受けない。", "answer": "×", "law": "令第2条第3項第3号・第4号", "explanation": "全冷媒一律で適用除外となるのは3トン未満。3トン以上5トン未満で適用除外となるのは「不活性のフルオロカーボン及び二酸化炭素」に限られ、全てのフルオロカーボンではない（誤り）。"}, {"id": 245, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ロ", "theme": "認定指定設備の届出", "question": "1日の冷凍能力が250トンの認定指定設備のみを使用して冷凍のため高圧ガスの製造をしようとする者は、製造開始の日の20日前までに、その旨を都道府県知事に届け出なければならない。", "answer": "○", "law": "法第5条第2項第2号、令第4条、法第56条の7", "explanation": "認定指定設備のみを用いる製造者は第一種（許可）から除外され、第二種製造者として製造開始の20日前までに知事へ届け出ればよい。"}, {"id": 246, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問2", "branch": "ハ", "theme": "機器製造業者の定義", "question": "「機器製造業者」とは、もっぱら冷凍設備に用いる機器であって、所定の機器の製造の事業を行う者である。", "answer": "○", "law": "法第57条、冷規第63条", "explanation": "専ら冷凍設備に用いる機器（冷凍機等）であって政令・省令で定めるものの製造事業を行う者を「機器製造業者」と定義している。"}, {"id": 247, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "イ", "theme": "製造開始・廃止の届出", "question": "第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事に届け出なければならない。", "answer": "○", "law": "法第21条第1項", "explanation": "第一種製造者は、高圧ガスの製造を開始したとき又は廃止したときは、遅滞なく知事へ届け出なければならない。"}, {"id": 248, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ロ", "theme": "地位の承継", "question": "第一種製造者がその高圧ガスの製造事業の全部を譲り渡したときは、その事業の全部を譲り受けた者はその第一種製造者の地位を承継する。", "answer": "×", "law": "法第10条、法第20条第2項", "explanation": "事業譲渡による地位承継の規定はない。譲受人は新規に製造許可を取得する必要がある（誤り）。"}, {"id": 249, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問3", "branch": "ハ", "theme": "ガス種・製造方法変更の許可", "question": "第一種製造者は、製造をする高圧ガスの種類又は製造の方法を変更しようとするときは、あらかじめ、その旨を都道府県知事に届け出なければならない。", "answer": "×", "law": "法第14条第1項", "explanation": "第一種製造者がガス種や製造方法を変更しようとするときは、届出ではなく事前に都道府県知事の「許可」を受けなければならない（誤り）。"}, {"id": 250, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者区分", "question": "アンモニアを冷媒ガスとする冷凍設備であって、1日の冷凍能力が10トンのもののみを使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条第2項第2号、令第4条", "explanation": "アンモニアは1日の冷凍能力が5トン以上50トン未満が第二種製造者に該当するため、10トンの設備は第二種製造者となる。"}, {"id": 251, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ロ", "theme": "日常点検", "question": "高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日1回以上その製造設備の属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "○", "law": "冷規第9条第2号、法第12条第2項", "explanation": "第二種製造者にも準用される製造方法の基準として、1日1回以上の異常点検および補修等の危険防止措置が義務付けられている。"}, {"id": 252, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問4", "branch": "ハ", "theme": "定期自主検査記録の記載事項", "question": "定期自主検査を実施しなければならない冷凍設備において、定期自主検査の検査記録に記載すべき事項の一つに「検査をした製造施設の設備ごとの検査方法及び結果」がある。", "answer": "○", "law": "法第35条の2、冷規第44条第5項第2号", "explanation": "定期自主検査記録の法定記載事項に「設備ごとの検査方法及び結果」が明記されている。"}, {"id": 253, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "イ", "theme": "車両移動", "question": "アンモニアを移動する場合は、その高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。", "answer": "○", "law": "一般則第49条第1項第21号、同第50条第13号", "explanation": "毒性・可燃性であるアンモニアの移動時には、イエローカード（注意事項記載書面）の交付・携帯・遵守義務がある。"}, {"id": 254, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ロ", "theme": "車両移動", "question": "アンモニアを移動する場合は、その充てん容器及び残ガス容器には木枠又はパッキンを施さなければならない。", "answer": "○", "law": "一般則第50条第8号", "explanation": "毒性ガス（アンモニア等）の充填容器等（充填容器及び残ガス容器）には木枠又はパッキンを施さなければならない。"}, {"id": 255, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問5", "branch": "ハ", "theme": "車両移動", "question": "アンモニアを移動する場合は、その車両の見やすい箇所に警戒標を掲げなければならないが、フルオロカーボン（不活性のものに限る。）を移動する場合は、その車両に警戒標を掲げるべき定めはない。", "answer": "×", "law": "法第23条第2項、一般則第50条第1号", "explanation": "警戒標の掲示義務は、不活性ガスを含むすべての高圧ガス充てん容器等の移動に適用される（定めがないは誤り）。"}, {"id": 256, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "イ", "theme": "容器の刻印事項", "question": "液化ガスを充てんする容器には、その容器に充てんすることができる最大充てん質量の数値の刻印がされている。", "answer": "×", "law": "法第48条第4項第1号、容規第8条第1項第6号", "explanation": "容器に刻印されるのは「内容積（V）」等であり、最大充てん質量の数値自体が刻印されるわけではない（計算式 G=V/C により算出するため誤り）。"}, {"id": 257, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ロ", "theme": "アンモニア容器の性質明示", "question": "液化アンモニアを充てんする容器の外面には、その高圧ガスの名称並びに性質を示す文字「燃」及び「毒」を明示しなければならない。", "answer": "○", "law": "容規第10条第1項第2号ロ", "explanation": "可燃性かつ毒性ガスであるアンモニア容器の外面には、名称とともに「燃」及び「毒」の文字を明示しなければならない。"}, {"id": 258, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問6", "branch": "ハ", "theme": "不合格容器のくず化処分", "question": "容器の所有者は、容器再検査に合格しなかった容器について所定の期間内に所定の刻印等がされなかったときは、遅滞なく、これをくず化し、その他容器として使用することができないように処分しなければならない。", "answer": "○", "law": "法第56条第3項", "explanation": "容器再検査に不合格となった容器について3月以内に刻印等されないときは、遅滞なくくず化等の処分を行わなければならない。"}, {"id": 259, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "イ", "theme": "貯蔵基準適用の質量区分", "question": "貯蔵の方法に係る技術上の基準に従って貯蔵しなければならない液化ガスは、毒性ガスにあってはその質量が1.5キログラムを超えるもの、不活性ガスにあってはその質量が5キログラムを超えるものと定められている。", "answer": "×", "law": "法第15条第1項、一般則第19条第1項・第2項", "explanation": "貯蔵技術基準が適用される液化ガスの限度（1.5 kg超）は全ガス種共通であり、不活性ガスを5 kg超とする区分はないため誤り。"}, {"id": 260, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ロ", "theme": "アンモニア容器貯蔵の通風", "question": "液化アンモニアの充てん容器及び残ガス容器は、通風の良い場所で貯蔵しなければならない。", "answer": "○", "law": "一般則第18条第2号イ、同第6条第1項第42号", "explanation": "可燃性ガス又は毒性ガス（アンモニア）の充てん容器等は、通風の良い場所で貯蔵しなければならない。"}, {"id": 261, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問7", "branch": "ハ", "theme": "可燃性ガス置場の燈火制限", "question": "液化アンモニアの容器置場には携帯電燈以外の燈火を携えて立ち入ってはならない。", "answer": "○", "law": "一般則第6条第2項第8号チ", "explanation": "可燃性ガス（アンモニアを含む）の容器置場には、携帯電燈以外の火気・燈火を携えて立ち入ることは禁止されている。"}, {"id": 262, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定", "question": "遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つに、圧縮機の標準回転速度における1時間当たりの吐出し量の数値がある。", "answer": "×", "law": "冷規第5条第1号・第4号", "explanation": "吐出し量（V）を用いるのは容積圧縮式等（第4号設備）。遠心式（第1号設備）は原動機定格出力（W）を用いるため誤り。"}, {"id": 263, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍能力算定", "question": "吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つに、発生器を加熱する1時間の入熱量の数値がある。", "answer": "○", "law": "冷規第5条第2号", "explanation": "吸収式冷凍設備（第2号設備）の冷凍能力算定には、発生器を加熱する入熱量（Q）が用いられる。"}, {"id": 264, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍能力算定", "question": "多段圧縮方式による製造設備の1日の冷凍能力の算定に必要な数値の一つに、蒸発器の冷媒ガスに接する側の表面積の数値がある。", "answer": "×", "law": "冷規第5条第3号・第4号", "explanation": "蒸発器表面積（A）を用いるのは自然循環式・自然還流式（第3号）。多段圧縮方式等の容積圧縮式は気筒寸法や回転速度等による押しのけ量を用いるため誤り。"}, {"id": 265, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の認可不要", "question": "（アンモニア250t）危害予防規程を定め、都道府県知事の許可を受けなければならない。また、これを変更したときも同様である。", "answer": "×", "law": "法第26条第1項", "explanation": "危害予防規程は知事等に「届出」を行うものであり、「許可（認可）」を受ける必要はない（誤り）。"}, {"id": 266, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ロ", "theme": "保安教育計画の実行届", "question": "（アンモニア250t）従業者に対する保安教育計画を定め、これを忠実に実行しなければならない。また、その実行結果を都道府県知事に届け出なければならない。", "answer": "×", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務だが、実行結果を都道府県知事に届け出る義務は課されていない（誤り）。"}, {"id": 267, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問9", "branch": "ハ", "theme": "危険時の通報義務", "question": "（アンモニア250t）高圧ガスの製造施設が危険な状態になったときは、直ちに、応急の措置を講じなければならない。また、この事業者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。", "answer": "○", "law": "法第36条第1項・第2項", "explanation": "危険事態の発生時は直ちに応急措置を講じる義務があり、事態を発見した者は誰であっても直ちに知事・警察・消防等へ通報・届出を行う義務がある。"}, {"id": 268, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "イ", "theme": "指定場所の火気厳禁", "question": "（アンモニア250t）この事業者が事業所内において指定した場所では、この事業所の従業者といえども、何人も火気を取り扱ってはならない。", "answer": "○", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、自社の従業者であっても例外なく禁止される。"}, {"id": 269, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録の保存期間", "question": "（アンモニア250t）事業所ごとに帳簿を備え、その製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載し、記載の日から5年間保存しなければならない。", "answer": "×", "law": "法第60条第1項、冷規第65条", "explanation": "製造施設の異常時記録帳簿の保存期間は記載の日から「10年間」である（5年間は誤り）。"}, {"id": 270, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問10", "branch": "ハ", "theme": "容器喪失時の届出義務", "question": "（アンモニア250t）この事業者が所有し、又は占有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事又は警察官に届け出なければならないが、その所有し、又は占有する容器を喪失したときは届け出る必要はない。", "answer": "×", "law": "法第63条第1項第1号・第2号", "explanation": "高圧ガスの災害発生時だけでなく、所有・占有する容器を喪失又は盗難されたときも遅滞なく届出が必要（必要はないは誤り）。"}, {"id": 271, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "イ", "theme": "軽微な変更工事の事後届出", "question": "（アンモニア250t）この製造施設の位置、構造又は設備について定められた軽微な変更の工事をしたときは、その完成後遅滞なく、その旨を都道府県知事に届け出なければならない。", "answer": "○", "law": "法第14条第2項", "explanation": "第一種製造者が定められた軽微な変更工事を行ったときは、工事完成後遅滞なく知事へ届け出なければならない。"}, {"id": 272, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ロ", "theme": "特定変更工事の完成検査機関", "question": "（アンモニア250t）この製造施設の特定変更工事を完成したときに受ける完成検査は、都道府県知事又は高圧ガス保安協会若しくは指定完成検査機関のいずれかが行う。", "answer": "○", "law": "法第20条第3項", "explanation": "完成検査は都道府県知事が行うほか、高圧ガス保安協会又は指定完成検査機関で受検することができる。"}, {"id": 273, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問11", "branch": "ハ", "theme": "完成検査不要工事の適用除外", "question": "（アンモニア250t）製造施設の位置、構造又は設備の変更の工事について、都道府県知事の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事があるが、この事業所の製造施設には適用されない。", "answer": "○", "law": "法第20条第3項、冷規第23条", "explanation": "完成検査不要の変更工事規定は可燃性・毒性ガス設備が除外されているため、アンモニア設備である本施設には適用されない。"}, {"id": 274, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "イ", "theme": "機械室のガス滞留防止構造", "question": "（アンモニア250t）この製造施設の圧縮機、凝縮器若しくは受液器又はこれらの間の配管を設置する室は、冷媒ガスであるアンモニアが漏えいしたとき滞留しないような構造としなければならない。", "answer": "○", "law": "冷規第7条第1項第3号", "explanation": "毒性・可燃性のアンモニア設備を設置する機械室は、漏えい時にガスが滞留しない換気・開口部構造とする必要がある。"}, {"id": 275, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ロ", "theme": "換気設備による放出管免除", "question": "（アンモニア250t）この専用機械室に常時強制換気できる装置を設けた場合は、冷媒設備の安全弁に設けた放出管の開口部の位置に係る定めは適用されない。", "answer": "×", "law": "冷規第7条第1項第9号", "explanation": "強制換気装置を設けていても、安全弁放出管の開口部位置に係る基準は免除されない（適用されないは誤り）。"}, {"id": 276, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問12", "branch": "ハ", "theme": "流出防止措置の対象容量", "question": "（アンモニア250t）この受液器は、その周囲に液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第13号", "explanation": "毒性ガス受液器で流出防止措置（防液堤等）が必要なのは内容積「1万リットル以上」。本受液器は4,000 Lのため対象外（誤り）。"}, {"id": 277, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "イ", "theme": "凝縮器の耐震設計該当性", "question": "（アンモニア250t）この凝縮器は、所定の耐震設計の基準により、地震の影響に対して安全な構造としなければならないものに該当する。", "answer": "○", "law": "冷規第7条第1項第5号", "explanation": "凝縮器で耐震設計が必要なのは「縦置円筒形で胴長5m以上」。本問の凝縮器は縦置・胴長6mのため該当する。"}, {"id": 278, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ロ", "theme": "毒性ガスの除害措置義務", "question": "（アンモニア250t）この製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。", "answer": "○", "law": "冷規第7条第1項第16号", "explanation": "アンモニアは毒性ガスであるため、漏えい時に安全・速やかに除害する措置（除害設備・散水設備等）を講じる義務がある。"}, {"id": 279, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問13", "branch": "ハ", "theme": "機械室設置による警報器免除", "question": "（アンモニア250t）この製造設備は専用機械室に設置されているので、製造施設から漏えいしたアンモニアが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなくてよい。", "answer": "×", "law": "冷規第7条第1項第15号", "explanation": "漏えい検知警報設備の設置義務は、専用機械室内に設置されていても免除されない（設けなくてよいは誤り）。"}, {"id": 280, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "イ", "theme": "冷凍保安責任者の選任要件", "question": "（R134a 850t・設備A/B各300t+指定C250t）冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が100トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者のうちから選任しなければならない。", "answer": "○", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "一体管理される設備群では認定指定設備Cを除き、最大設備（または合算設備）の能力300t以上で判定。「1冷免状」＋「100t以上で1年の実務経験」が必要。"}, {"id": 281, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の事前選任・職務代行", "question": "（R134a 850t）この事業所の冷凍保安責任者が旅行などのためその職務を行うことができない場合、あらかじめ選任した冷凍保安責任者の代理者にその職務を代行させなければならない。", "answer": "○", "law": "法第33条第1項", "explanation": "冷凍保安責任者が旅行・疾病等で職務を行えない場合に備え、あらかじめ選任した代理者に職務を代行させなければならない。"}, {"id": 282, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者・代理者の解任届", "question": "（R134a 850t）冷凍保安責任者又はその代理者を解任し、新たに選任したときは、遅滞なく、新たに選任した者についてその旨を都道府県知事に届け出なければならないが、解任した者についてはその旨を都道府県知事に届け出る必要はない。", "answer": "×", "law": "法第27条の2第5項、法第27条の4第2項、法第33条第3項", "explanation": "責任者及び代理者を選任したときだけでなく「解任したとき」も遅滞なく知事に届け出なければならない（必要はないは誤り）。"}, {"id": 283, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "イ", "theme": "協会の保安検査受検届", "question": "（R134a 850t）特定施設について、高圧ガス保安協会が行う保安検査を受けた場合、高圧ガス保安協会がその検査結果を都道府県知事に報告することとなっているので、その保安検査を受けた旨を都道府県知事に届け出る必要はない。", "answer": "×", "law": "冷規第41条第3項", "explanation": "協会等の保安検査を受けた第一種製造者は、自ら受検届書を知事に提出しなければならない（届出不要は誤り）。"}, {"id": 284, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ロ", "theme": "保安検査の対象", "question": "（R134a 850t）保安検査は、製造施設の位置、構造及び設備並びに高圧ガスの製造の方法が所定の技術上の基準に適合しているかどうかについて行われる。", "answer": "×", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、「製造の方法（ソフト基準）」は含まれない（誤り）。"}, {"id": 285, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問15", "branch": "ハ", "theme": "特定施設からの指定設備除外", "question": "（R134a 850t）保安検査を受けなければならない特定施設は、製造施設のうち、認定指定設備である製造設備Cの部分を除いたものである。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備である製造設備Cの部分は特定施設から除外されるため、保安検査の対象外となる。"}, {"id": 286, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問16", "branch": "イ", "theme": "指定設備の定期自主検査義務", "question": "（R134a 850t）定期自主検査は、認定指定設備である製造設備Cの部分を含む製造施設について、1年に1回以上行わなければならない。", "answer": "○", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "第一種製造施設の定期自主検査は、認定指定設備（設備C）の部分も含めて1年に1回以上実施しなければならない。"}, {"id": 287, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問16", "branch": "ロ", "theme": "自主検査の監督", "question": "（R134a 850t）この事業者は、選任している冷凍保安責任者が疾病などのために定期自主検査の実施について監督を行わせることができない場合、選任している冷凍保安責任者の代理者に、その実施について監督を行わせなければならない。", "answer": "○", "law": "法第33条第1項、冷規第44条第4項", "explanation": "責任者が職務を行えないときは、あらかじめ選任された代理者が自主検査の実施監督を代行しなければならない。"}, {"id": 288, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問16", "branch": "ハ", "theme": "自主検査記録の法定記載事項", "question": "（R134a 850t）定期自主検査の検査記録は、その記載すべき事項の定めはなく、事業者自らが製造施設の態様に応じ、検査記録の記載事項を定めればよい。", "answer": "×", "law": "冷規第44条第5項", "explanation": "定期自主検査記録には「設備ごとの検査方法及び結果」など法定記載事項が定められており、事業者が任意に定めればよいわけではない（誤り）。"}, {"id": 289, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問17", "branch": "イ", "theme": "指定設備の架台組立場所", "question": "（R134a 850t・設備C）この製造設備の冷媒設備は、この設備の製造業者の事業所において脚上又は1つの架台上に組み立てられたものである。", "answer": "○", "law": "冷規第57条第3号", "explanation": "指定設備は、製造業者の事業所において脚上又は一つの架台上に組み立てられていることが構造条件である。"}, {"id": 290, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問17", "branch": "ロ", "theme": "指定設備の試運転・一体搬入", "question": "（R134a 850t・設備C）この製造設備の冷媒設備は、この設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されたものである。", "answer": "○", "law": "冷規第57条第5号", "explanation": "製造業者の事業所で試運転を行い、現場に使用場所に分割されずに搬入されることが構造条件である。"}, {"id": 291, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問17", "branch": "ハ", "theme": "指定設備の手動止め弁禁止", "question": "（R134a 850t・設備C）この製造設備が認定指定設備である条件の一つに、「日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用しないこと。」がある。", "answer": "○", "law": "冷規第57条第12号", "explanation": "日常の運転操作に必要となる冷媒ガスの止め弁に手動式のものを使用しないことが構造基準として定められている。"}, {"id": 292, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問18", "branch": "イ", "theme": "安全弁止め弁の全開義務", "question": "（R134a 850t）冷媒設備の安全弁の修理又は清掃のため特に必要な場合を除き、その安全弁に付帯して設けた止め弁は、常に全開しておかなければならない。", "answer": "○", "law": "冷規第9条第1号", "explanation": "安全弁に付帯する止め弁は、修理・清掃時を除き「常に全開」にしておくことが義務付けられている。"}, {"id": 293, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問18", "branch": "ロ", "theme": "指定設備の日常点検除外", "question": "（R134a 850t）高圧ガスの製造は、認定指定設備である製造設備Cの部分を除き、1日に1回以上製造施設の異常の有無を点検して行えばよい。", "answer": "×", "law": "冷規第9条第2号", "explanation": "日常点検（1日1回以上）は製造施設全般が対象であり、認定指定設備であっても点検対象から除外されない（誤り）。"}, {"id": 294, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問18", "branch": "ハ", "theme": "冷媒設備開放修理時の漏洩防止", "question": "（R134a 850t）この製造設備の冷媒設備を開放して修理を行うときは、その開放する部分に他の部分からガスが漏えいすることを防止するための措置を講じて行わなければならない。", "answer": "○", "law": "冷規第9条第3号ハ", "explanation": "冷媒設備を開放して修理等を行うときは、開放部分に他の部分からガスが流入・漏えいすることを防止する措置を講じなければならない。"}, {"id": 295, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問19", "branch": "イ", "theme": "火気隔離基準", "question": "（R134a 850t）凝縮器は、火気（その製造設備内のものを除く。）の付近に設置してはならないが、その火気に対して安全な措置を講じた場合はこの限りでない。", "answer": "○", "law": "冷規第7条第1項第1号", "explanation": "凝縮器等の主要設備は火気の付近にあってはならないが、火気に対して安全な措置を講じた場合は設置が認められる。"}, {"id": 296, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問19", "branch": "ロ", "theme": "警戒標の掲示免除", "question": "（R134a 850t）この製造施設の製造設備は専用機械室に設置されているので、製造施設に警戒標を掲げる必要はない。", "answer": "×", "law": "冷規第7条第1項第2号", "explanation": "警戒標の掲示義務は専用機械室内に設置されている場合であっても免除されない（必要はないは誤り）。"}, {"id": 297, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問19", "branch": "ハ", "theme": "配管気密試験の基準定め", "question": "（R134a 850t）冷媒設備の配管は、許容圧力以上の圧力で行う気密試験又は経済産業大臣がこれと同等以上のものと認めた高圧ガス保安協会が行う試験に合格するものである旨の定めはない。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "冷媒設備（配管を含む全体）は許容圧力以上の気密試験または同等試験に合格することが明確に規定されている（定めがないは誤り）。"}, {"id": 298, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問20", "branch": "イ", "theme": "安全装置の作動圧力基準", "question": "（R134a 850t）冷媒設備には、その設備内の冷媒ガスの圧力が許容圧力の1.5倍を超えた場合に直ちに許容圧力以下に戻すことができる安全装置を設けなければならない。", "answer": "×", "law": "冷規第7条第1項第8号", "explanation": "安全装置が作動すべき圧力基準は「許容圧力を超えた場合」であり、「許容圧力の1.5倍」ではない（誤り）。"}, {"id": 299, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問20", "branch": "ロ", "theme": "油圧系統圧力計の免除", "question": "（R134a 850t）冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その圧縮機の油圧系統には圧力計を設けなくてもよいが、その油圧系統を除く冷媒設備には圧力計を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第7号", "explanation": "油圧保護装置（OPS）がある場合に圧力計が免除されるのは「当該油圧系統」のみであり、それ以外の冷媒設備には圧力計の設置が必要である。"}, {"id": 300, "subject": "法令", "year": "2016年度(平成28年)", "q_num": "問20", "branch": "ハ", "theme": "バルブ適切操作措置", "question": "（R134a 850t）製造設備に設けたバルブ又はコック（自動制御で開閉されるものを除く。）のうち、通常は常に閉止しているものについては、作業員が当該バルブ又はコックを適切に操作することができるような措置を講じる必要はない。", "answer": "×", "law": "冷規第7条第1項第17号", "explanation": "通常常時閉止しているバルブ・コックであっても、適切に操作できる措置（開閉方向明示、誤操作防止等）を講じる義務は免除されない（必要はないは誤り）。"}, {"id": 301, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "イ", "theme": "高圧ガス保安法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費について規制するほか、容器の製造及び取扱について規制することも定めている。", "answer": "○", "law": "法第1条", "explanation": "法第1条（目的）に合致する。高圧ガスの製造、貯蔵、販売、移動、消費並びに容器の製造及び取扱を規制し、自主保安活動を促進して公共の安全を確保することを目的としている。"}, {"id": 302, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義", "question": "現在の圧力が0.1メガパスカルの圧縮ガス（圧縮アセチレンガスを除く。）であって、温度35度において圧力が0.2メガパスカルとなるものは、高圧ガスである。", "answer": "×", "law": "法第2条第1号", "explanation": "圧縮ガス（アセチレン除く）が高圧ガスとなるのは、常用温度で現に1 MPa以上、または温度35℃において1 MPa以上となるものである。現在の圧力0.1 MPa、35℃で0.2 MPaのものは高圧ガスではない。"}, {"id": 303, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問1", "branch": "ハ", "theme": "高圧ガスの定義", "question": "現在の圧力が0.1メガパスカルの液化ガスであって、温度35度において圧力が1メガパスカルとなるものは、高圧ガスである。", "answer": "○", "law": "法第2条第3号", "explanation": "液化ガスは常用温度で現に0.2 MPa以上、または圧力が0.2 MPaとなる場合の温度が35℃以下のものであれば高圧ガスとなる。温度35℃で1 MPa（0.2 MPa超）となるため高圧ガスに該当する。"}, {"id": 304, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "イ", "theme": "適用除外", "question": "1日の冷凍能力が5トン未満の冷凍設備内におけるフルオロカーボン（第一種ガスであるもの）は、高圧ガス保安法の適用を受けない。", "answer": "○", "law": "政令第2条第5項第4号", "explanation": "第一種ガス（不活性・難燃性フルオロカーボン等）は、冷凍能力が3トン以上5トン未満の設備内にある場合も適用除外とされるため、5トン未満であれば高圧ガス保安法の適用を受けない。"}, {"id": 305, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "ロ", "theme": "製造廃止の届出", "question": "第一種製造者は、高圧ガスの製造を廃止したときは、遅滞なく、その旨を都道府県知事等に届け出なければならないが、第二種製造者の場合はその旨を届け出る必要はない。", "answer": "×", "law": "法第21条第1項・第2項", "explanation": "第一種製造者だけでなく、第二種製造者も高圧ガスの製造を廃止したときは遅滞なく都道府県知事等に届け出なければならない（届け出る必要はないは誤り）。"}, {"id": 306, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問2", "branch": "ハ", "theme": "地位の承継", "question": "第一種製造者がその事業の全部を譲り渡したときは、その事業の全部を譲り受けた者は第一種製造者の地位を承継する。", "answer": "×", "law": "法第10条第1項", "explanation": "法第10条に規定される地位承継の事由は「相続、合併又は分割」に限られ、事業の譲渡・譲受による承継規定はない。譲り受けた者は新規に知事等の許可を受けなければならない。"}, {"id": 307, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "イ", "theme": "製造許可の能力基準", "question": "冷凍のための設備を使用して高圧ガスの製造をしようとする者が、その製造について都道府県知事等の許可を受けなければならない場合の1日の冷凍能力の最小の値は、その冷媒ガスの種類がフルオロカーボンである場合とアンモニアである場合とで同じ値である。", "answer": "○", "law": "法第5条第1項第2号、政令第4条", "explanation": "第一種製造者の許可が必要となる1日の冷凍能力の最小値は、第一種ガスのフルオロカーボン、第一種ガス以外のフルオロカーボン、アンモニアのいずれも「50トン以上」で同じ値である。"}, {"id": 308, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "ロ", "theme": "廃棄の技術上の基準の対象ガス", "question": "特定不活性ガスを除く不活性ガスは、冷凍保安規則に定められている高圧ガスの廃棄に係る技術上の基準に従って廃棄しなければならない高圧ガスとして定められていない。", "answer": "○", "law": "法第25条、冷規第33条", "explanation": "冷規第33条で廃棄基準の対象として定められている高圧ガスは「可燃性ガス、毒性ガス及び特定不活性ガス」であり、特定不活性ガスを除く不活性ガスは対象として定められていない。"}, {"id": 309, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問3", "branch": "ハ", "theme": "機器製造業者の定義", "question": "「機器製造業者」とは、専ら冷凍設備に用いる機器であって、所定のものの製造の事業を行う者である。", "answer": "○", "law": "法第57条", "explanation": "法第57条の規定通り、専ら冷凍設備に用いる機器であって省令で定めるものの製造事業を行う者を「機器製造業者」という。"}, {"id": 310, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の区分", "question": "フルオロカーボン（定められた燃焼性の基準に適合しないものに限る。）を冷媒ガスとする冷凍設備であって、その1日の冷凍能力が15トンである設備のみを使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条第2項第2号、政令第4条", "explanation": "燃焼性基準に適合しない（＝第一種ガスに含まれない）フルオロカーボンは、冷凍能力が5トン以上50トン未満が第二種製造者に該当するため、15トンの設備は第二種製造者となる。"}, {"id": 311, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "ロ", "theme": "気密試験における空気使用条件", "question": "製造設備の設置又は変更の工事を完成したときに行う気密試験に空気を使用するときは、あらかじめ、冷媒設備中にある可燃性ガスを排除した後に気密試験を行わなければならない。", "answer": "○", "law": "冷規第14条第1号", "explanation": "可燃性冷媒設備で気密試験に空気を使用する場合、引火・爆発を防ぐため、あらかじめ設備内の可燃性ガスを十分に排除してから行わなければならない。"}, {"id": 312, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問4", "branch": "ハ", "theme": "第二種製造者の冷凍保安責任者選任除外", "question": "アンモニアを冷媒ガスとする冷凍設備であって、その1日の冷凍能力が20トン未満である設備のみを使用して高圧ガスを製造する者は、冷凍保安責任者を選任しなくてよい。", "answer": "○", "law": "冷規第36条第3項第1号", "explanation": "アンモニア又は可燃性フルオロカーボンを冷媒とする設備で、1日の冷凍能力が5トン以上20トン未満の第二種製造者は、冷凍保安責任者の選任が免除されている。"}, {"id": 313, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "イ", "theme": "警戒標掲示の除外規定", "question": "車両に積載した容器の内容積が50リットル以下のため、この車両に警戒標を掲げる必要はない。", "answer": "×", "law": "一般則第50条第1号", "explanation": "警戒標の適用除外となるのは「容器の内容積が25 L以下のみを積載し、かつ合計内容積が50 L以下の場合」である。本問の容器は内容積48 L（25 L超）であるため警戒標の掲示が必要（誤り）。"}, {"id": 314, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "ロ", "theme": "積載残ガス容器の温度管理", "question": "車両に積載した残ガス容器（特に定められたものを除く。）は、その温度（ガスの温度を計測できる容器にあっては、ガスの温度）を常に40度以下に保たなければならない。", "answer": "○", "law": "一般則第50条第2号、同第6条第1項第42号", "explanation": "充填容器等（充填容器及び残ガス容器）は、直射日光を遮るなどしてその温度を常に40℃以下に保たなければならない。"}, {"id": 315, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問5", "branch": "ハ", "theme": "特定不活性ガスの携行品除外規定", "question": "車両に積載した容器の内容積が50リットル以下のため、特定不活性ガスを移動するときは、消火設備並びに災害発生防止のための応急措置に必要な資材及び工具等を携行する必要はない。", "answer": "×", "law": "一般則第50条第9号", "explanation": "消火設備・資材等の携行免除は「25 L以下の容器のみを積載し合計50 L以下」の場合に限られる。内容積48 Lの容器を積載する場合は携行義務がある（必要はないは誤り）。"}, {"id": 316, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "イ", "theme": "容器刻印事項", "question": "容器に充填する液化ガスは、刻印等又は自主検査刻印等において示された種類の高圧ガスであり、かつ、容器に刻印等又は自主検査刻印等において示された最大充填質量の数値以下のものでなければならない。", "answer": "×", "law": "法第48条第4項第1号、容規第8条第1項第6号", "explanation": "容器に刻印されるのは「内容積（V）」等であり、最大充填質量の数値自体が刻印されるわけではない。充填量は示された内容積から算式（G=V/C）により計算した質量以下とする（誤り）。"}, {"id": 317, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "ロ", "theme": "溶接容器の再検査期間", "question": "液化フルオロカーボンを充填する溶接容器の容器再検査の期間は、その容器の製造後の経過年数にかかわらず、5年である。", "answer": "×", "law": "容規第24条第1項第1号", "explanation": "溶接容器の再検査期間は、製造後の経過年数20年未満は5年、20年以上は2年と経過年数に応じて定められている（かかわらず5年は誤り）。"}, {"id": 318, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問6", "branch": "ハ", "theme": "バルブの刻印事項", "question": "容器に装置されるバルブであって、附属品検査に合格したものに刻印をすべき事項の一つに、「そのバルブが装置されるべき容器の種類」がある。", "answer": "○", "law": "法第49条の3、容規第18条第1項第7号", "explanation": "附属品検査に合格したバルブの刻印事項の一つに「装置されるべき容器の種類」が明定されている。"}, {"id": 319, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "イ", "theme": "車両上の容器貯蔵", "question": "車両に積載した容器により高圧ガスを貯蔵することは禁じられているが、第一種貯蔵所又は第二種貯蔵所において貯蔵するときは、この限りでない。", "answer": "○", "law": "一般則第18条第2号ホ", "explanation": "原則として車両に積載した容器による貯蔵は禁止されているが、第一種貯蔵所又は第二種貯蔵所の許可・届出に従って貯蔵する場合は例外として認められる。"}, {"id": 320, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "ロ", "theme": "アンモニア容器置場の周囲火気制限", "question": "液化アンモニアの容器置場の周囲2メートル以内においては、所定の措置を講じた場合を除き、火気の使用を禁じ、かつ、引火性又は発火性の物を置いてはならない。", "answer": "○", "law": "一般則第6条第2項第8号ニ", "explanation": "容器置場（不活性ガス及び空気のものを除く）の周囲2m以内は、有効な遮へい措置がある場合を除き火気使用および引火性・発火性物質の設置が禁じられている。"}, {"id": 321, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問7", "branch": "ハ", "theme": "貯蔵基準の対象ガス種", "question": "貯蔵の方法に係る技術上の基準に従うべき高圧ガスには、可燃性ガス及び毒性ガスのほか、不活性ガスも含まれている。", "answer": "○", "law": "法第15条第1項、一般則第19条第1項・第2項", "explanation": "貯蔵技術基準の対象（容積0.15 m3超、液化ガス1.5 kg超）は、可燃性・毒性だけでなく酸素や不活性ガスを含むすべての高圧ガスに適用される。"}, {"id": 322, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定式", "question": "圧縮機の標準回転速度における1時間のピストン押しのけ量の数値（V）は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第1号・第4号", "explanation": "ピストン押しのけ量（V）を用いるのは容積圧縮式（往復動式等）である。遠心式圧縮機は「原動機の定格出力（W）」を用いて算定する（誤り）。"}, {"id": 323, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍能力算定式", "question": "冷媒設備内の冷媒ガスの充填量の数値は、アンモニアを冷媒ガスとする吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第2号", "explanation": "吸収式冷凍設備の冷凍能力算定に必要なのは「発生器を加熱する1時間の入熱量（Q）」であり、冷媒充填量の数値は不要である（誤り）。"}, {"id": 324, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍能力算定式", "question": "冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値（C）は、容積圧縮式（往復動式）圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第4号", "explanation": "容積圧縮式圧縮機の冷凍能力算定式は R = V / C であり、冷媒ガスの種類に応じた数値Cが必要である。"}, {"id": 325, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の届出と遵守", "question": "（アンモニア250t）この事業者は、所定の事項を記載した危害予防規程を定め、これを都道府県知事等に届け出なければならない。また、この事業者及びその従業者は、この危害予防規程を守らなければならない。", "answer": "○", "law": "法第26条第1項・第3項", "explanation": "アンモニア250tの第一種製造者は危害予防規程の作成・届出義務があり、事業者及び全従業員に遵守義務がある。"}, {"id": 326, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "ロ", "theme": "指定場所の火気制限", "question": "（アンモニア250t）この事業者がこの事業所において指定した場所では、その事業所に選任された冷凍保安責任者を除き、何人も火気を取り扱ってはならない。", "answer": "×", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、冷凍保安責任者であっても例外なく禁止される（誤り）。"}, {"id": 327, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問9", "branch": "ハ", "theme": "危険状態の通報義務", "question": "（アンモニア250t）この製造施設が危険な状態となったとき、その事態を発見した者は、この事業者に限らず、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。", "answer": "○", "law": "法第36条第2項", "explanation": "危険事態の届出義務は事業者だけでなく、その事態を発見した「何人（すべての者）」にも直ちに通報・届出義務がある。"}, {"id": 328, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "イ", "theme": "災害発生時の届出義務", "question": "（アンモニア250t）この製造施設の高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。", "answer": "○", "law": "法第63条第1項第1号", "explanation": "所有又は占有する高圧ガスについて災害が発生したときは、遅滞なく知事等又は警察官に届け出る義務がある。"}, {"id": 329, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録帳簿の保存期間", "question": "（アンモニア250t）この製造施設に異常があった場合は、その年月日及びそれに対してとった措置を記載した帳簿をこの事業所に備え、これを記載の日から10年間保存しなければならない。", "answer": "○", "law": "法第60条第1項、冷規第65条", "explanation": "製造施設の異常時記録帳簿は事業所ごとに備え、記載の日から「10年間」保存しなければならない。"}, {"id": 330, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問10", "branch": "ハ", "theme": "保安教育計画の届出不要", "question": "（アンモニア250t）従業者に対する保安教育計画を定め、これを都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務付けられているが、都道府県知事等へ届け出る義務は定められていない（誤り）。"}, {"id": 331, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア設備の変更許可", "question": "（アンモニア250t）この凝縮器の取替えの工事をしようとするときは、あらかじめ、都道府県知事等の許可を受けなければならない。", "answer": "○", "law": "法第14条第1項、冷規第17条第1項第2号", "explanation": "毒性・可燃性のアンモニア設備は軽微な変更工事から除外されているため、取替えにあたっては事前に知事等の変更許可が必要である。"}, {"id": 332, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "ロ", "theme": "特定変更工事と完成検査", "question": "（アンモニア250t）この凝縮器の取替えの工事において、冷媒設備に係る切断、溶接を伴わない取替えの工事は、完成検査を要しない変更の工事に該当する。", "answer": "×", "law": "法第20条第3項、冷規第23条", "explanation": "アンモニア設備は完成検査不要工事（冷規第23条）から除外されているため、切断・溶接がなくても特定変更工事となり完成検査が必要（誤り）。"}, {"id": 333, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問11", "branch": "ハ", "theme": "配管取替えの軽微変更除外", "question": "（アンモニア250t）この凝縮器と受液器とをつなぐ配管の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものは、軽微な変更の工事に該当する。", "answer": "×", "law": "冷規第17条第1項第2号", "explanation": "アンモニア（毒性・可燃性）設備は軽微な変更から除外されているため、切断溶接や能力変更がなくても配管取替えは軽微な変更工事に該当しない（誤り）。"}, {"id": 334, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "イ", "theme": "安全弁放出管の開口部", "question": "（アンモニア250t）この冷媒設備の安全弁（大気に冷媒ガスを放出することのないものを除く。）には、放出管を設けなければならない。また、放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。", "answer": "○", "law": "冷規第7条第1項第9号", "explanation": "大気放出型の安全弁には放出管を設け、アンモニアの毒性・可燃性に応じた安全な位置に開口部を配置しなければならない。"}, {"id": 335, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "ロ", "theme": "機械室の滞留防止構造対象", "question": "（アンモニア250t）この製造設備を設置する室のうち、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない室は、圧縮機、油分離器又は凝縮器を設置する室に限られる。", "answer": "×", "law": "冷規第7条第1項第3号", "explanation": "滞留防止構造とすべき室は、圧縮機、油分離器、凝縮器、受液器のほか「これらの間の配管」を設置する室も含まれるため、「限られる」は誤り。"}, {"id": 336, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問12", "branch": "ハ", "theme": "耐震設計の該当性", "question": "（アンモニア250t）この凝縮器及び受液器のいずれも、所定の耐震に関する性能を有すべきものに該当する。", "answer": "×", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上で該当するが、凝縮器で該当するのは「縦置円筒形で胴長5m以上」であり、本問は「横置円筒形」のため該当しない（「いずれも」は誤り）。"}, {"id": 337, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "イ", "theme": "毒性ガスの除害措置", "question": "（アンモニア250t）この製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。", "answer": "○", "law": "冷規第7条第1項第16号", "explanation": "毒性ガス（アンモニア）の製造設備には、漏えい時に安全・速やかに除害する措置（除害設備・散水設備等）を講じる義務がある。"}, {"id": 338, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "ロ", "theme": "電気設備の防爆構造除外", "question": "（アンモニア250t）この製造施設の冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものとすべきものに該当しない。", "answer": "○", "law": "冷規第7条第1項第14号", "explanation": "電気設備の防爆構造義務は「可燃性ガス（アンモニアを除く。）」と明記されており、アンモニア設備は防爆構造義務から除外されているため正。"}, {"id": 339, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問13", "branch": "ハ", "theme": "流出防止措置の容量基準", "question": "（アンモニア250t）この凝縮器及び受液器は、その周囲に液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じるべきものに該当する。", "answer": "×", "law": "冷規第7条第1項第13号", "explanation": "毒性冷媒の流出防止措置（防液堤等）が必要な受液器は内容積「10,000 L以上」である。本問の受液器は6,000 Lのため対象外（誤り）。"}, {"id": 340, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "イ", "theme": "冷凍保安責任者の選任要件", "question": "（R134a 600t）この事業所の冷凍保安責任者には、第一種冷凍機械責任者免状又は第二種冷凍機械責任者免状の交付を受けている者であって、1日の冷凍能力が100トンである製造施設を使用して行う高圧ガスの製造に関する1年の経験を有している者を選任することができる。", "answer": "×", "law": "冷規第36条第1項", "explanation": "認定指定設備Bを除く設備A（300トン）で判定する。300トン以上の設備には「第一種冷凍機械責任者免状」が必要であり、第二種免状の者は選任できない（誤り）。"}, {"id": 341, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "ロ", "theme": "保安責任者代理者の選任時期", "question": "（R134a 600t）冷凍保安責任者が疾病その他の事故によって、その職務を行うことができないときは、直ちに、その代理者を選任しなければならない。", "answer": "×", "law": "法第33条第1項", "explanation": "代理者は事故発生時に直ちに選任するのではなく、「あらかじめ選任しておかなければならない」（誤り）。"}, {"id": 342, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者の解任・選任届", "question": "（R134a 600t）選任している冷凍保安責任者を解任し、新たな者を選任したときは、遅滞なく、その解任及び選任の旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第27条の2第5項、法第27条の4第2項", "explanation": "冷凍保安責任者を選任したとき、及び解任したときは、遅滞なく都道府県知事等に届け出なければならない。"}, {"id": 343, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "イ", "theme": "圧縮機取替えと完成検査不要工事", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更を伴うものは、冷凍能力の変更が所定の範囲であっても、その変更の工事の完成後、その製造施設の完成検査を受けなければならない。", "answer": "×", "law": "法第20条第3項、冷規第23条", "explanation": "不活性フルオロカーボン設備で、切断溶接を伴わず能力変更が所定範囲内（20%以内）の取替えは「完成検査を要しない変更工事」に該当するため完成検査は不要（誤り）。"}, {"id": 344, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "ロ", "theme": "凝縮器取替えの軽微変更", "question": "（R134a 600t）製造設備Aの凝縮器の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その取替えに係る凝縮器が耐震設計構造物の適用を受けないものである場合、その取替えの工事は、都道府県知事等の許可を受けることを要しない変更の工事である。", "answer": "○", "law": "法第14条第1項・第2項、冷規第17条第1項第2号", "explanation": "第1種ガスの不活性フルオロカーボン設備で、切断溶接なし・耐震対象外・能力変更なしの凝縮器取替えは軽微な変更工事となり、事前の許可は不要（事後届出）である。"}, {"id": 345, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問15", "branch": "ハ", "theme": "通常設備C増設の許可必要性", "question": "（R134a 600t）この製造施設に製造設備Aと同じ製造設備Cを増設し、製造設備A及び製造設備Bとブラインを共通にするときは、定められた軽微な変更の工事として、その完成後遅滞なく、その旨を都道府県知事等に届け出ればよい。", "answer": "×", "law": "法第14条第1項、冷規第17条第1項第4号", "explanation": "認定指定設備の増設は軽微工事だが、設備Aと同じ通常設備Cの増設は軽微工事にならず、あらかじめ知事等の変更許可が必要（誤り）。"}, {"id": 346, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問16", "branch": "イ", "theme": "保安検査の実施主体", "question": "（R134a 600t）保安検査を受けるときは、選任している冷凍保安責任者にその実施について監督を行わせなければならない。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事等（又は高圧ガス保安協会・指定保安検査機関）が行う行政検査であり、自社の冷凍保安責任者が監督を行う定期自主検査とは異なる（誤り）。"}, {"id": 347, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問16", "branch": "ロ", "theme": "認定指定設備の保安検査除外", "question": "（R134a 600t）製造施設のうち、認定指定設備である製造設備Bの部分については、特定施設から除かれているので保安検査を受ける必要はない。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備の部分は「特定施設」から除外されるため、保安検査を受検する義務はない。"}, {"id": 348, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問16", "branch": "ハ", "theme": "協会の保安検査受検届", "question": "（R134a 600t）特定施設について高圧ガス保安協会が行う保安検査を受けた場合、高圧ガス保安協会がその検査結果を都道府県知事等に報告することとなっているので、この事業者はその保安検査を受けた旨を都道府県知事等に届け出る必要はない。", "answer": "×", "law": "冷規第41条第3項", "explanation": "協会等の保安検査を受けた第一種製造者は、自ら受検届書を知事等に提出しなければならない（届出不要は誤り）。"}, {"id": 349, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問17", "branch": "イ", "theme": "定期自主検査の耐圧試験除外", "question": "（R134a 600t）定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行わなければならないが、その技術上の基準のうち耐圧試験に係るものについては行わなくてよい。", "answer": "○", "law": "法第35条の2、冷規第44条第3項", "explanation": "定期自主検査の対象基準から「耐圧試験に係るもの」は除外されているため、耐圧試験は行わなくてよい。"}, {"id": 350, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問17", "branch": "ロ", "theme": "自主検査記録の届出不要", "question": "（R134a 600t）定期自主検査を行ったときは、その検査記録を作成し、遅滞なく、これを都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第35条の2", "explanation": "定期自主検査記録は作成して事業所に保存する義務はあるが、都道府県知事等への提出・届出義務は定められていない（誤り）。"}, {"id": 351, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査の監督代行", "question": "（R134a 600t）冷凍保安責任者が旅行のためその職務を行うことができない場合は、この製造施設の定期自主検査の実施について冷凍保安責任者の代理者に監督を行わせなければならない。", "answer": "○", "law": "法第33条第1項、冷規第44条第4項", "explanation": "責任者が事故・旅行等で職務を行えないときは、あらかじめ選任された代理者が自主検査の実施監督を代行しなければならない。"}, {"id": 352, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問18", "branch": "イ", "theme": "液体耐圧試験の圧力倍率", "question": "（R134a 600t）完成検査において配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.25倍の圧力で行わなければならない。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "水その他の安全な液体を使用する耐圧試験圧力は「許容圧力の1.5倍以上」である（1.25倍は気体使用時の基準であり誤り）。"}, {"id": 353, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問18", "branch": "ロ", "theme": "油圧系統圧力計の免除", "question": "（R134a 600t）冷媒設備の圧縮機が強制潤滑方式であって、潤滑油圧力に対する保護装置を有している場合であっても、その圧縮機の油圧系統を除く冷媒設備には圧力計を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第7号", "explanation": "油圧保護装置（OPS）がある場合に圧力計が免除されるのは「当該油圧系統」のみであり、それ以外の冷媒設備本体には圧力計の設置が必須である。"}, {"id": 354, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問18", "branch": "ハ", "theme": "完全自動制御バルブの操作措置除外", "question": "（R134a 600t）製造設備Aに設けたバルブ（操作ボタン等により開閉するものにあっては、その操作ボタン等）には、作業員がそのバルブを適切に操作することができるような措置を講じるべき定めがあるが、操作ボタン等を使用することなく自動制御で開閉されるバルブには、その定めはない。", "answer": "○", "law": "冷規第7条第1項第17号", "explanation": "操作ボタン等を使用しない完全自動制御バルブは、作業員が操作する余地がないため適切操作措置の適用から除外されている。"}, {"id": 355, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問19", "branch": "イ", "theme": "火気隔離基準の例外措置", "question": "（R134a 600t）冷媒設備の圧縮機は、火気（その製造設備内のものを除く。）の付近にあってはならない。ただし、その火気に対して安全な措置を講じた場合は、この限りでない。", "answer": "○", "law": "冷規第7条第1項第1号", "explanation": "圧縮機等は火気の付近にあってはならないが、火気に対して安全な防護措置を講じた場合は設置が認められる。"}, {"id": 356, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問19", "branch": "ロ", "theme": "安全弁止め弁の全開義務", "question": "（R134a 600t）冷媒設備の安全弁に付帯して設けた止め弁は、その設備を長期に運転停止する場合には、安全弁の誤作動防止のため常に閉止しておかなければならない。", "answer": "×", "law": "冷規第9条第1号", "explanation": "安全弁に付帯する止め弁は、修理・清掃時を除き「常に全開」にしておく義務があり、運転停止時であっても閉止は禁止されている（誤り）。"}, {"id": 357, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問19", "branch": "ハ", "theme": "開放修理・清掃時の漏洩防止措置", "question": "（R134a 600t）冷媒設備を開放して修理又は清掃をするとき、冷媒ガスが不活性ガスであるので、その開放する部分に他の部分からガスが漏えいすることを防止するための措置を講じることなく行うことができる。", "answer": "×", "law": "冷規第9条第3号ハ", "explanation": "開放修理・清掃時の漏えい防止措置義務は、不活性ガスを含むすべての冷媒ガス設備に一律適用され、免除規定はない（誤り）。"}, {"id": 358, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問20", "branch": "イ", "theme": "認定指定設備のブライン共通基準", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つには、「ブラインを共通に使用する以外には、他の設備と共通に使用する部分がないこと。」がある。", "answer": "○", "law": "冷規第57条第2号", "explanation": "指定設備は独立した単一ユニットとして設計されるため、ブラインを共通使用する以外に他の設備と配管や機器を共用しないことが条件である。"}, {"id": 359, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の現場分割搬入禁止", "question": "（R134a 600t・設備B）この冷媒設備は、その設備の製造業者の事業所において試運転を行い、使用場所に分割して搬入されたものである。", "answer": "×", "law": "冷規第57条第5号", "explanation": "指定設備は製造業者の事業所で試運転を行い、現場へ「分割されずに（一体で）」搬入されることが構造条件である（「分割して搬入」は誤り）。"}, {"id": 360, "subject": "法令", "year": "2025年度(令和7年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の変更・移設と認定証返納", "question": "（R134a 600t・設備B）認定指定設備であるこの製造設備に変更の工事を施したとき、又はこの製造設備を移設したときは、指定設備認定証を返納しなければならない場合がある。", "answer": "○", "law": "冷規第62条第1項・第2項", "explanation": "同等部品交換を除く改造工事や、基準適合書のない移設を行った場合は認定証が無効となり、返納しなければならない。"}, {"id": 361, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "イ", "theme": "合併による地位承継", "question": "第一種製造者である法人について合併があった場合、その合併後存続する法人は、第一種製造者の地位を承継する。", "answer": "○", "law": "法第10条第1項", "explanation": "第一種製造者について合併があった場合、合併後存続する法人又は合併により設立された法人は、第一種製造者の地位を承継する。"}, {"id": 362, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義", "question": "常用の温度40度において圧力が1メガパスカルとなる圧縮ガス（圧縮アセチレンガスを除く。）であって、現在の圧力が0.9メガパスカルのものは高圧ガスではない。", "answer": "○", "law": "法第2条第1号", "explanation": "圧縮ガスが高圧ガスとなるのは常用温度で現に1 MPa以上、または温度35℃で1 MPa以上である。常用40℃で1 MPaであっても現在圧力が0.9 MPaで35℃要件も満たさなければ高圧ガスではない。"}, {"id": 363, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問1", "branch": "ハ", "theme": "高圧ガスの定義", "question": "圧力が0.2メガパスカルとなる場合の温度が30度である液化ガスであって、常用の温度において圧力が0.15メガパスカルであるものは高圧ガスではない。", "answer": "×", "law": "法第2条第3号", "explanation": "液化ガスは「圧力が0.2 MPaとなる温度が35℃以下」であれば高圧ガスとなる。30℃は35℃以下であるため高圧ガスに該当する（高圧ガスではないは誤り）。"}, {"id": 364, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "イ", "theme": "製造開始・廃止の届出", "question": "冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第21条第1項", "explanation": "第一種製造者は、高圧ガスの製造を開始したとき、又は廃止したときは、遅滞なく知事等へ届け出なければならない。"}, {"id": 365, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "ロ", "theme": "廃棄基準の対象冷凍能力", "question": "冷凍保安規則に定められている高圧ガスの廃棄に係る技術上の基準に従って冷媒ガス（定められた種類のものに限る。）を廃棄すべき冷凍設備は、1日の冷凍能力が50トン以上のものに限られる。", "answer": "×", "law": "法第25条、冷規第33条", "explanation": "廃棄基準の対象は可燃性ガス、毒性ガス及び特定不活性ガスであり、冷凍設備の冷凍能力による規模限定はない（50トン以上に限られるは誤り）。"}, {"id": 366, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問2", "branch": "ハ", "theme": "適用除外", "question": "1日の冷凍能力が3トン以上5トン未満の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず高圧ガス保安法の適用を受けない。", "answer": "×", "law": "政令第2条第5項第3号・第4号", "explanation": "全ガス種一律で適用除外となるのは3トン未満。3トン以上5トン未満で除外されるのは「第1種ガス」に限られる（ガスの種類にかかわらずは誤り）。"}, {"id": 367, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "イ", "theme": "製造許可の能力最小値比較", "question": "冷凍のため高圧ガスを製造する設備（認定指定設備を除く。）を使用して高圧ガスの製造をしようとする者が、都道府県知事等の許可を受けるべき1日の冷凍能力の最小の値は、その冷媒ガスの種類がフルオロカーボンとアンモニアとでは異なる。", "answer": "×", "law": "法第5条第1項第2号、政令第4条", "explanation": "第一種製造者の許可が必要となる最小冷凍能力は、フルオロカーボンもアンモニアもともに「50トン以上」であり同じ値である（異なるとする記述は誤り）。"}, {"id": 368, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "ロ", "theme": "販売事業の事前届出", "question": "容器に充填された冷媒ガス用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第20条の4第1項", "explanation": "高圧ガスの販売事業を営もうとする者は、販売所ごとに事業開始の日の20日前までに知事等に届け出なければならない。"}, {"id": 369, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問3", "branch": "ハ", "theme": "法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、民間事業者による高圧ガスの保安に関する自主的な活動を促進することを定めているが、高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することは定めていない。", "answer": "×", "law": "法第1条", "explanation": "法第1条には「民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進し」と明定されている（定めていないは誤り）。"}, {"id": 370, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の開始届出時期", "question": "第二種製造者は、事業所ごとに、製造を開始後遅滞なく、高圧ガスの製造をする旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第5条第2項第2号", "explanation": "第二種製造者の届出は事後遅滞なくではなく、「製造開始の日の20日前までに」行わなければならない（誤り）。"}, {"id": 371, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "ロ", "theme": "第二種製造者の区分", "question": "二酸化炭素を冷媒ガスとする1日の冷凍能力が15トンである設備を使用して、冷凍のため高圧ガスの製造をする者は、第二種製造者である。", "answer": "×", "law": "法第5条第2項第2号、政令第4条", "explanation": "第1種ガスである二酸化炭素で第二種製造者となるのは「20トン以上50トン未満」である。15トンの設備は届出不要の適用除外範囲である（誤り）。"}, {"id": 372, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問4", "branch": "ハ", "theme": "気密試験における空気使用条件", "question": "第二種製造者は、製造設備の設置又は変更の工事を完成したときは、酸素以外のガスを使用する試運転又は所定の気密試験を行った後でなければ、製造をしてはならない。", "answer": "○", "law": "法第12条第2項、冷規第14条第1号", "explanation": "工事完成時は、酸素以外のガスによる試運転又は許容圧力以上の気密試験（空気の場合は可燃性ガス排除後）を行わなければ製造してはならない。"}, {"id": 373, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "イ", "theme": "移動警戒標の適用ガス種", "question": "液化アンモニアを移動するときは、その車両の見やすい箇所に警戒標を掲げなければならないが、二酸化炭素を移動するときはその定めはない。", "answer": "×", "law": "一般則第50条第1号", "explanation": "車両積載移動時の警戒標掲示義務は、不活性ガス（二酸化炭素含む）を含むすべての高圧ガスに適用される（定めがないは誤り）。"}, {"id": 374, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "ロ", "theme": "保護具等の携行義務対象", "question": "液化アンモニアを移動するときは、その高圧ガスの種類に応じた防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等も携行しなければならないが、二酸化炭素を移動するときはその定めはない。", "answer": "○", "law": "一般則第50条第10号", "explanation": "毒性ガス（アンモニア等）移動時には保護具・資材等の携行が義務付けられているが、二酸化炭素には携行義務がないため正。"}, {"id": 375, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問5", "branch": "ハ", "theme": "イエローカード交付対象ガス", "question": "高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させるべき高圧ガスの種類は、可燃性ガス、毒性ガス、特定不活性ガス及び酸素に限られる。", "answer": "○", "law": "一般則第49条第1項第21号、同第50条第14号", "explanation": "イエローカードの交付・携帯・遵守義務の対象ガスは「可燃性ガス、毒性ガス、特定不活性ガス及び酸素」の4区分に限られる。"}, {"id": 376, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "イ", "theme": "容器の刻印事項", "question": "液化ガスを充填する容器には、その容器に充填することができる最大充填質量の数値の刻印がされている。", "answer": "×", "law": "容規第8条第1項第6号", "explanation": "容器に刻印されるのは「内容積（V）」であり、最大充填質量の数値自体は刻印されない（算式 G=V/C で算出するため誤り）。"}, {"id": 377, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "ロ", "theme": "一般継目なし容器の再検査周期", "question": "二酸化炭素（炭酸ガス）を充填する一般継目なし容器の容器再検査の期間は、その容器の製造後の経過年数に応じて定められている。", "answer": "×", "law": "容規第24条第1項第3号", "explanation": "一般継目なし容器の再検査期間は一律「5年」であり、経過年数による区分はない（経過年数区分があるのは溶接容器等であるため誤り）。"}, {"id": 378, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問6", "branch": "ハ", "theme": "バルブの刻印事項", "question": "容器に装置されるバルブであって附属品検査に合格したものに刻印をすべき事項の一つに、「耐圧試験における圧力（記号 TP、単位 メガパスカル）及びM」がある。", "answer": "○", "law": "法第49条の3、容規第18条第1項第6号", "explanation": "附属品検査合格バルブの刻印事項に「耐圧試験圧力（TP…M）」が規定されている。"}, {"id": 379, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "イ", "theme": "貯蔵基準の適用限度", "question": "貯蔵の方法に係る技術上の基準に従って貯蔵すべき液化ガスは、可燃性ガス又は毒性ガスにあってはその質量が1.5キログラムを超えるもの、特定不活性ガスにあってはその質量が5キログラムを超えるものと定められている。", "answer": "×", "law": "法第15条第1項、一般則第19条第1項・第2項", "explanation": "貯蔵技術基準が適用される液化ガスの質量（1.5 kg超）は全ガス種共通であり、特定不活性ガスを5 kg超とする区分はない（誤り）。"}, {"id": 380, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "ロ", "theme": "車両積載容器貯蔵の禁止", "question": "可燃性ガス又は毒性ガスを車両に積載した容器により貯蔵することは、特に定められた場合を除き禁じられているが、特定不活性ガスについては禁じられていない。", "answer": "×", "law": "一般則第18条第2号ホ", "explanation": "車両固定・積載容器による貯蔵禁止の原則は、特定不活性ガスを含むすべての高圧ガスに適用される（禁じられていないは誤り）。"}, {"id": 381, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問7", "branch": "ハ", "theme": "容器置場の区分配置", "question": "特定不活性ガスは、充填容器と残ガス容器にそれぞれ区分して容器置場に置くべき高圧ガスである。", "answer": "○", "law": "一般則第6条第2項第8号ロ", "explanation": "可燃性ガス、毒性ガス、特定不活性ガス及び酸素の充填容器等は、それぞれ充填容器と残ガス容器に区分して置かなければならない。"}, {"id": 382, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定式", "question": "冷媒設備内の冷媒循環量の数値は、自然環流式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第3号", "explanation": "自然環流式・自然循環式の算定式は R = Q * A であり、蒸発器表面積Aを用いる。冷媒循環量の数値は不要である（誤り）。"}, {"id": 383, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍能力算定式", "question": "圧縮機の原動機の定格出力の数値は、冷媒設備の圧縮機が容積圧縮式（往復動式）である製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第1号・第4号", "explanation": "原動機定格出力（W）を用いるのは「遠心式圧縮機」である。容積圧縮式はピストン押しのけ量（V）を用いるため誤り。"}, {"id": 384, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍能力算定式", "question": "蒸発部又は蒸発器の冷媒ガスに接する側の表面積の数値は、自然循環式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第3号", "explanation": "自然循環式冷凍設備の1日の冷凍能力算定には、蒸発部又は蒸発器の冷媒ガス接触側表面積（A）が用いられる。"}, {"id": 385, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の遵守対象", "question": "（アンモニア250t）この事業所の危害予防規程を守るべき者は、この事業者、その従業者及び協力会社の従業者であると定められている。", "answer": "×", "law": "法第26条第3項", "explanation": "危害予防規程の直接の遵守義務者は「第一種製造者及びその従業者」であり、協力会社の従業者は直接の対象として規定されていない（誤り）。"}, {"id": 386, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "ロ", "theme": "保安教育計画の策定義務", "question": "（アンモニア250t）この事業者は、その従業者に対する保安教育計画を定めなければならない。", "answer": "○", "law": "法第27条第1項", "explanation": "第一種製造者は従業者に対する保安教育計画を定め、これを忠実に実行しなければならない。"}, {"id": 387, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問9", "branch": "ハ", "theme": "危険時の通報届出義務", "question": "（アンモニア250t）この事業者は、高圧ガスの製造のための施設が危険な状態となっている事態を発見したときは、直ちに、応急の措置を講じれば、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出る必要はない。", "answer": "×", "law": "法第36条第1項・第2項", "explanation": "応急措置を講じるだけでなく、直ちに知事等・警察・消防等へ通報・届け出なければならない（届け出る必要はないは誤り）。"}, {"id": 388, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "イ", "theme": "発火物の携帯立入制限", "question": "（アンモニア250t）この事業者がこの事業所において指定した場所では、この事業所の従業者を除き、何人も、この事業者の承諾を得ないで、発火しやすい物を携帯してその場所に立ち入ってはならない。", "answer": "×", "law": "法第37条第2項", "explanation": "承諾のない発火物の携帯立入禁止は「何人も」対象であり、自社の従業者であっても例外ではない（除きは誤り）。"}, {"id": 389, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録帳簿の備付け義務", "question": "（アンモニア250t）この事業者は、製造施設に異常があった場合に所定の事項を記載する帳簿をこの事業所に備えなくてよい。", "answer": "×", "law": "法第60条第1項、冷規第65条", "explanation": "第一種製造者は事業所ごとに異常時記録帳簿を備え、記載の日から10年間保存しなければならない（備えなくてよいは誤り）。"}, {"id": 390, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問10", "branch": "ハ", "theme": "容器喪失・盗難の届出義務", "question": "（アンモニア250t）この事業者は、その所有し、又は占有する容器を喪失し、又は盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。", "answer": "○", "law": "法第63条第1項第2号", "explanation": "所有又は占有する高圧ガス若しくは容器を喪失し、又は盗まれたときは遅滞なく知事等又は警察官に届け出なければならない。"}, {"id": 391, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア設備の軽微変更除外", "question": "（アンモニア250t）この製造施設の冷媒設備の取替えの工事のうちには、その工事の完成後遅滞なく、その旨を都道府県知事等に届け出ればよい軽微な変更の工事がある。", "answer": "×", "law": "冷規第17条第1項第2号", "explanation": "アンモニア設備（可燃性・毒性）の取替えは軽微な変更工事から除外されているため、事後届出でよい工事はない（誤り）。"}, {"id": 392, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "ロ", "theme": "特定変更工事以外の完成検査不要", "question": "（アンモニア250t）この製造施設の特定変更工事以外の変更の工事を完成したときは、完成検査を受けることなく、その製造施設を使用することができる。", "answer": "○", "law": "法第20条第3項", "explanation": "完成検査が義務付けられているのは「特定変更工事」であり、特定変更工事以外の変更工事は完成検査を受けずに使用できる。"}, {"id": 393, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問11", "branch": "ハ", "theme": "アンモニア圧縮機取替えの完成検査", "question": "（アンモニア250t）この製造施設の冷凍能力の変更が所定の範囲である圧縮機の取替えの工事であって、冷媒設備に係る切断、溶接を伴わない工事は、完成検査を受けるべき工事である。", "answer": "○", "law": "法第20条第3項、冷規第23条", "explanation": "アンモニア設備は完成検査不要工事の特例（冷規第23条）から除外されているため、切断溶接がなくても特定変更工事として完成検査受検が必要。"}, {"id": 394, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "イ", "theme": "安全弁放出管の設置と開口部", "question": "（アンモニア250t）この冷媒設備の安全弁（大気に冷媒ガスを放出することのないものを除く。）には、放出管を設けなければならない。また、放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。", "answer": "○", "law": "冷規第7条第1項第9号", "explanation": "大気放出型安全弁には放出管を設け、アンモニアの毒性・可燃性に応じた適切な開口部位置としなければならない。"}, {"id": 395, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "ロ", "theme": "防爆構造電気設備の除外", "question": "（アンモニア250t）この事業所の冷媒ガスは、冷媒設備に係る電気設備をその設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものとしなければならない冷媒ガスである。", "answer": "×", "law": "冷規第7条第1項第14号", "explanation": "防爆構造が要求されるのは「可燃性ガス（アンモニアを除く。）」であり、アンモニアは適用除外とされている（誤り）。"}, {"id": 396, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問12", "branch": "ハ", "theme": "機械室の構造", "question": "（アンモニア250t）この製造設備の圧縮機、油分離器、凝縮器、受液器及びこれらの間の配管が設置してある室は、冷媒ガスが漏えいしたときに、室外に拡散しないような密閉構造としなければならない。", "answer": "×", "law": "冷規第7条第1項第3号", "explanation": "機械室に求められるのは漏えい時にガスが滞留しない「滞留防止構造（換気・開口部）」であり、「密閉構造」ではない（誤り）。"}, {"id": 397, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "イ", "theme": "受液器液面計の二重防護措置", "question": "（アンモニア250t）この受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計の破損を防止するための措置又は受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置のいずれか一方の措置を講じなければならない。", "answer": "×", "law": "冷規第7条第1項第10号・第11号", "explanation": "アンモニア受液器では、丸形以外の液面計とし「破損防止措置」と「自動閉止弁等の漏洩防止措置」の“両方”を講じなければならない（「いずれか一方」は誤り）。"}, {"id": 398, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "ロ", "theme": "漏えい検知警報設備の設置", "question": "（アンモニア250t）この製造施設には、その施設から漏えいするガスが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第15号", "explanation": "可燃性・毒性のアンモニア製造施設には、漏えい検知警報設備の設置が義務付けられている。"}, {"id": 399, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問13", "branch": "ハ", "theme": "耐震設計の該当性", "question": "（アンモニア250t）この受液器並びにその支持構造物及び基礎は、所定の耐震に関する性能を有すべきものに該当するが、この凝縮器は、それに該当しない。", "answer": "○", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上で耐震設計が必要。凝縮器は「縦置円筒形で胴長5m以上」が対象であり、本問は「横置円筒形」のため該当しない。"}, {"id": 400, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "イ", "theme": "冷凍保安責任者の選任要件", "question": "（R134a 600t）冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が50トンの製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者のうちから選任することができる。", "answer": "×", "law": "冷規第36条第1項", "explanation": "認定指定設備Bを除く設備A（300トン）で判定する。300トン以上の設備は「第一種冷凍機械責任者免状」＋「100トン以上の施設で1年以上の実務経験」が必要（50トン経験では不可のため誤り）。"}, {"id": 401, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "ロ", "theme": "保安責任者・代理者の選任解任手続", "question": "（R134a 600t）冷凍保安責任者又はその代理者を選任又は解任するときは、都道府県知事等の許可を受けなければならない。", "answer": "×", "law": "法第27条の2第5項、法第33条第3項", "explanation": "責任者及び代理者の選任・解任は「遅滞なく届出」を行えば足り、「許可」を受ける必要はない（誤り）。"}, {"id": 402, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問14", "branch": "ハ", "theme": "代理者の職務代行と法のみなし規定", "question": "（R134a 600t）冷凍保安責任者の代理者に冷凍保安責任者の職務を代行させる場合は、高圧ガス保安法の規定の適用については、この代理者が冷凍保安責任者とみなされる。", "answer": "○", "law": "法第33条第2項", "explanation": "代理者が職務を代行するときは、高圧ガス保安法の規定の適用について冷凍保安責任者とみなされる。"}, {"id": 403, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "イ", "theme": "軽微な変更工事の届出時期", "question": "（R134a 600t）製造施設の位置、構造又は設備について定められた軽微な変更の工事をしようとするときは、都道府県知事等の許可を受けなくてよいが、工事開始の日の20日前までにその旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第14条第1項・第2項", "explanation": "軽微な変更工事は許可不要だが、届出は事前（20日前）ではなく「工事完成後遅滞なく」行う（誤り）。"}, {"id": 404, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "ロ", "theme": "指定設備の同等部品交換", "question": "（R134a 600t）製造設備Bについて行う変更の工事が同等の部品への交換のみである場合、定められた軽微な変更の工事に該当する。", "answer": "○", "law": "冷規第17条第1項第5号、同第62条第1項第1号", "explanation": "認定指定設備の認定証が無効とならない変更工事（同等部品への交換のみ）は、軽微な変更工事に該当する。"}, {"id": 405, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問15", "branch": "ハ", "theme": "圧縮機取替の許可と完成検査不要", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなければならない。また、その変更の工事は、完成後、その製造施設の完成検査を受けることなく使用することができる工事である。", "answer": "○", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "不活性フルオロカーボン設備で切断溶接なし・能力変更が所定範囲内（20%以内）の取替えは、許可は必要だが完成検査を受けずに使用できる。"}, {"id": 406, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問16", "branch": "イ", "theme": "保安検査の対象範囲", "question": "（R134a 600t）保安検査は、特定施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われるものであって、製造の方法が所定の技術上の基準に適合しているかどうかについて行う旨の定めはない。", "answer": "○", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、製造の方法（ソフト基準）は対象に含まれない。"}, {"id": 407, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問16", "branch": "ロ", "theme": "保安検査の周期", "question": "（R134a 600t）保安検査は、製造設備Bを除く製造施設について、特に定められた事由がある場合を除き1年に1回受けなければならない。", "answer": "×", "law": "冷規第40条第2項", "explanation": "第一種製造施設の保安検査の周期は、定期自主検査（年1回）とは異なり原則「3年に1回」である（1年に1回は誤り）。"}, {"id": 408, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問16", "branch": "ハ", "theme": "協会の保安検査と知事検査の免除", "question": "（R134a 600t）特定施設について、高圧ガス保安協会が行う保安検査を受け、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う保安検査を受けなくてよい。", "answer": "○", "law": "法第35条第1項第1号", "explanation": "高圧ガス保安協会等の保安検査を受け、適合報告を受けて知事等に届け出た場合は、知事が行う保安検査を受ける必要はない。"}, {"id": 409, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問17", "branch": "イ", "theme": "定期自主検査の対象範囲", "question": "（R134a 600t）定期自主検査は、製造設備A及び製造設備Bを含む製造施設について、特に定められた事由がある場合を除き1年に1回以上行わなければならない。", "answer": "○", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "第一種製造施設の定期自主検査は、認定指定設備（設備B）も含めた製造施設全体について年1回以上行わなければならない。"}, {"id": 410, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問17", "branch": "ロ", "theme": "自主検査の対象", "question": "（R134a 600t）定期自主検査は、製造の方法が所定の技術上の基準に適合しているかどうかについて行わなければならない。", "answer": "×", "law": "法第35条の2、冷規第44条第3項", "explanation": "定期自主検査は製造施設の位置・構造・設備が基準に適合しているかについて行うものであり、「製造の方法」は対象ではない（誤り）。"}, {"id": 411, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査記録の法定事項", "question": "（R134a 600t）定期自主検査の検査記録は、その記載すべき事項の定めはなく、事業者自らが製造施設の態様に応じ、検査記録の記載事項を定めなければならない。", "answer": "×", "law": "冷規第44条第5項", "explanation": "検査記録には「設備ごとの検査方法及び結果」など法令で定められた記載事項があり、事業者が任意に定めるわけではない（誤り）。"}, {"id": 412, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問18", "branch": "イ", "theme": "修理作業の責任者監視・通報措置", "question": "（R134a 600t）冷媒設備の修理は、あらかじめ定めた修理の作業計画に従って行わなければならないが、あらかじめ定めた作業の責任者の監視の下で行うことができない場合は、異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行うことと定められている。", "answer": "○", "law": "冷規第9条第3号イ", "explanation": "修理等は作業計画に従い責任者の監視下で行うか、または直ちに通報できる措置を講じて行わなければならない。"}, {"id": 413, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問18", "branch": "ロ", "theme": "安全装置の設置義務", "question": "（R134a 600t）製造設備Aの冷媒設備は、認定指定設備ではないので許容圧力以下に戻す安全装置を設けるべき定めはない。", "answer": "×", "law": "冷規第7条第1項第8号", "explanation": "許容圧力以下に戻す安全装置の設置義務はすべての冷媒設備に適用され、製造設備Aにも設置義務がある（定めはないは誤り）。"}, {"id": 414, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問18", "branch": "ハ", "theme": "警戒標の掲示義務", "question": "（R134a 600t）この製造設備を設置した室に外部から容易に立ち入ることができない措置を講じた場合、製造施設に警戒標を掲げるべき定めはない。", "answer": "×", "law": "冷規第7条第1項第2号", "explanation": "外部から見やすい場所への警戒標掲示義務は、立入防止措置を講じていても免除されない（定めはないは誤り）。"}, {"id": 415, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問19", "branch": "イ", "theme": "耐圧試験", "question": "（R134a 600t）この製造施設の配管以外の冷媒設備について耐圧試験を行う場合、「水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力以上の圧力で行うことができる。」と定められている。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "気体を使用して耐圧試験を行う場合の圧力は「許容圧力の1.25倍以上」である（「許容圧力以上」は誤り）。"}, {"id": 416, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問19", "branch": "ロ", "theme": "安全弁止め弁の全開義務", "question": "（R134a 600t）冷媒設備の安全弁の修理又は清掃のため特に必要な場合を除き、その安全弁に付帯して設けた止め弁は、常に全開しておかなければならない。", "answer": "○", "law": "冷規第9条第1号", "explanation": "安全弁に付帯する止め弁は、修理・清掃時を除き「常に全開」にしておかなければならない。"}, {"id": 417, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問19", "branch": "ハ", "theme": "気密試験の圧力基準", "question": "（R134a 600t）製造設備Aの冷媒設備のうち凝縮器の気密試験は、許容圧力と同じ圧力で行ってよい。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "気密試験は「許容圧力以上の圧力」で行うこととされているため、許容圧力と同じ圧力で行ってよい。"}, {"id": 418, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の架台組立場所", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つに、「冷媒設備は使用場所であるこの事業所において、一つの架台上に組み立てられたものであること。」がある。", "answer": "×", "law": "冷規第57条第3号", "explanation": "指定設備は「製造業者の事業所において」脚上又は一つの架台上に組み立てられたものでなければならない（使用場所において組み立ては誤り）。"}, {"id": 419, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の試験実施場所", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つに、「冷媒設備が所定の気密試験及び耐圧試験に合格するものでなければならないこと。」があるが、その試験を行うべき場所についての定めはない。", "answer": "×", "law": "冷規第57条第4号", "explanation": "指定設備は「製造業者の事業所で行う」所定の気密試験及び耐圧試験に合格することが定められている（場所の定めがないは誤り）。"}, {"id": 420, "subject": "法令", "year": "2024年度(令和6年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の移設と認定証失効", "question": "（R134a 600t・設備B）この製造設備に変更の工事を施すことがない場合であっても、この設備を移設すると、その指定設備認定証が無効になる場合がある。", "answer": "○", "law": "冷規第62条第1項第2号", "explanation": "改造を行わなくても、調査・適合書交付を受けずに移設した場合は指定設備認定証が無効となるため正。"}, {"id": 421, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "イ", "theme": "高圧ガス保安法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。", "answer": "○", "law": "法第1条", "explanation": "法第1条（目的）に合致する。行政による規制と民間事業者・協会による自主的保安活動の促進が公共安全確保の2大支柱である。"}, {"id": 422, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義", "question": "液化ガスであって、その圧力が0.2メガパスカルとなる場合の温度が30度であるものは、現在の圧力が0.15メガパスカルであっても高圧ガスである。", "answer": "○", "law": "法第2条第3号", "explanation": "液化ガスは「圧力が0.2 MPaとなる温度が35℃以下」であれば高圧ガスとなる。30℃は35℃以下であるため現在の圧力に関わらず高圧ガスである。"}, {"id": 423, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問1", "branch": "ハ", "theme": "廃棄基準の対象ガス種", "question": "冷凍保安規則に定められている高圧ガスの廃棄に係る技術上の基準に従うべき高圧ガスは、可燃性ガス、毒性ガス及び特定不活性ガスに限られる。", "answer": "○", "law": "法第25条、冷規第33条", "explanation": "冷規第33条により、高圧ガスの廃棄基準が適用されるガスは「可燃性ガス、毒性ガス及び特定不活性ガス」の3種類に限られる。"}, {"id": 424, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "イ", "theme": "認定指定設備の許可不要", "question": "1日の冷凍能力が50トン以上である認定指定設備のみを使用して冷凍のため高圧ガスの製造をしようとする者は、都道府県知事等の許可を受けなくてよい。", "answer": "○", "law": "法第5条第1項第2号、政令第4条、法第35条の2", "explanation": "認定指定設備のみを用いる製造者は第一種製造者（許可）から除外され、第二種製造者（製造開始20日前までの届出）となるため許可は不要。"}, {"id": 425, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "ロ", "theme": "事業譲渡による承継除外", "question": "第一種製造者の事業を譲り渡した者及び譲り受けた者は、遅滞なく、それぞれその旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第10条第1項", "explanation": "事業の譲渡・譲受による第一種製造者の地位承継の規定はない。譲り受けた者は新規に知事等の製造許可を取得しなければならない（届出で済むわけではないため誤り）。"}, {"id": 426, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問2", "branch": "ハ", "theme": "製造方法の変更許可", "question": "冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造の方法のみを変更しようとするときは、都道府県知事等の許可を受ける必要はないが、軽微な変更として変更後遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第14条第1項", "explanation": "第一種製造者が「製造の方法」を変更しようとするときは、施設の変更を伴わなくても事前に都道府県知事等の「許可」を受けなければならない（事後届出ではない）。"}, {"id": 427, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "イ", "theme": "販売事業の事前届出", "question": "容器に充填された冷媒ガス用の高圧ガスの販売の事業を営もうとする者（定められた者を除く。）は、販売所ごとに、事業開始後遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第20条の4第1項", "explanation": "販売事業の届出は事後ではなく、「事業開始の日の20日前までに」行わなければならない（誤り）。"}, {"id": 428, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "ロ", "theme": "機器製造業者の対象冷凍能力", "question": "機器製造業者が所定の技術上の基準に従って製造すべき機器は、冷媒ガスの種類にかかわらず、1日の冷凍能力が5トン以上の冷凍機に用いられるものに限られる。", "answer": "×", "law": "冷規第63条", "explanation": "機器製造業者の技術基準対象は、第一種ガス（二酸化炭素、難燃性フルオロカーボン等）は「5トン以上」だが、それ以外のガス（アンモニア等）は「3トン以上」と冷媒種により異なる（「かかわらず5トン以上に限られる」は誤り）。"}, {"id": 429, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問3", "branch": "ハ", "theme": "適用除外", "question": "1日の冷凍能力が3トン未満の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず、高圧ガス保安法の適用を受けない。", "answer": "○", "law": "法第3条第1項第9号、政令第2条第5項第3号", "explanation": "冷凍能力3トン未満の冷凍設備内にある高圧ガスは、ガスの種類に関係なく一律で高圧ガス保安法の適用除外となる。"}, {"id": 430, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の区分", "question": "製造設備の1日の冷凍能力が15トンである場合、その製造をする高圧ガスの種類にかかわらず、製造開始の日の20日前までに、高圧ガスの製造をする旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第5条第2項第2号、政令第4条", "explanation": "第一種ガス（難燃性フルオロカーボン・CO2等）は20トン以上が届出対象（15トンは適用除外）であり、アンモニア等は5トン以上が届出対象となるため、「種類にかかわらず」は誤り。"}, {"id": 431, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "ロ", "theme": "気密試験・試運転のガス条件", "question": "第二種製造者は、製造設備の変更の工事が完成したとき、酸素以外のガスを使用する試運転又は所定の気密試験を行った後でなければ高圧ガスの製造をしてはならない。", "answer": "○", "law": "法第12条第2項、冷規第14条第1号", "explanation": "工事完成時は、酸素以外のガスによる試運転又は許容圧力以上の気密試験（空気の場合は可燃性ガス排除後）を行わなければ製造してはならない。"}, {"id": 432, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問4", "branch": "ハ", "theme": "第二種定期自主検査記録の届出不要", "question": "第二種製造者のうちには、定期自主検査実施後に検査記録を都道府県知事等に届け出るべき者がある。", "answer": "×", "law": "法第35条の2", "explanation": "定期自主検査の検査記録は作成して事業所に保存する義務はあるが、第二種製造者を含め都道府県知事等に届け出る義務は定められていない（誤り）。"}, {"id": 433, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "イ", "theme": "警戒標掲示の対象ガス種", "question": "車両の見やすい箇所に警戒標を掲げるべき高圧ガスは、可燃性ガス、毒性ガス及び特定不活性ガスに限られる。", "answer": "×", "law": "一般則第50条第1号", "explanation": "車両積載移動時の警戒標掲示義務は、不活性ガスや酸素を含むすべての高圧ガス（一定量以上）が対象である（限定する記述は誤り）。"}, {"id": 434, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "ロ", "theme": "アンモニア容器の木枠・パッキン", "question": "液化アンモニアを移動するときは、その充填容器及び残ガス容器には木枠又はパッキンを施さなければならない。", "answer": "○", "law": "一般則第50条第8号", "explanation": "毒性ガス（アンモニア等）の充填容器等（充填容器及び残ガス容器）には、木枠又はパッキンを施すことが義務付けられている。"}, {"id": 435, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問5", "branch": "ハ", "theme": "特定不活性ガスの書面携行義務", "question": "可燃性ガスを移動するときは、そのガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならないが、特定不活性ガスを移動するときはその定めはない。", "answer": "×", "law": "一般則第49条第1項第21号、同第50条第14号", "explanation": "イエローカードの交付・携帯・遵守義務は、可燃性ガス、毒性ガスだけでなく「特定不活性ガス」や酸素の移動時にも適用される（定めがないは誤り）。"}, {"id": 436, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問6", "branch": "イ", "theme": "耐圧試験圧力の刻印記号TP", "question": "容器検査に合格した液化アンモニアの容器に刻印されている「TP3.6M」は、その容器の耐圧試験における圧力が3.6メガパスカルであることを表している。", "answer": "○", "law": "容規第8条第1項第11号", "explanation": "記号「TP」は耐圧試験圧力（Test Pressure）を表し、「TP3.6M」は耐圧試験圧力が3.6 MPaであることを表す。"}, {"id": 437, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問6", "branch": "ロ", "theme": "アンモニア容器の塗色区分", "question": "液化アンモニアを充填する容器に表示をすべき事項のうちには、その容器の表面積の2分の1以上についてねずみ色の塗色及びアンモニアの性質を示す文字「燃」、「毒」の明示がある。", "answer": "×", "law": "容規第10条第1項第1号・第2号ロ", "explanation": "液化アンモニア容器の外面塗色は「白色」である（「ねずみ色」はその他のガスであり誤り）。「燃」「毒」の明示義務は正しい。"}, {"id": 438, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問6", "branch": "ハ", "theme": "溶接容器再検査期間の経過年数区分", "question": "液化フルオロカーボンを充填する溶接容器の容器再検査の期間は、その容器の製造後の経過年数にかかわらず、5年である。", "answer": "×", "law": "容規第24条第1項第1号", "explanation": "溶接容器の再検査周期は、製造後の経過年数20年未満は5年、20年以上は2年と経過年数に応じて定められている（かかわらず5年は誤り）。"}, {"id": 439, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問7", "branch": "イ", "theme": "容器の転倒・衝撃防止措置", "question": "液化アンモニアの充填容器（内容積が5リットル以下のものを除く。）には、転落、転倒等による衝撃を防止する措置を講じなければならないが、液化フルオロカーボンの充填容器（内容積が5リットル以下のものを除く。）には、その措置を講じる必要はない。", "answer": "×", "law": "一般則第6条第2項第8号ト", "explanation": "内容積5リットル超の充填容器等の転倒・衝撃防止措置は、すべての高圧ガスに一律義務付けられている（フルオロカーボンに必要ないは誤り）。"}, {"id": 440, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問7", "branch": "ロ", "theme": "容器置場の専用保管義務", "question": "液化アンモニアの容器置場には、計量器等作業に必要な物以外の物を置いてはならない。", "answer": "○", "law": "一般則第6条第2項第8号ハ", "explanation": "容器置場には、計量器等作業に必要な物以外の物を置いてはならない（すべての高圧ガス容器置場に共通の基準）。"}, {"id": 441, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問7", "branch": "ハ", "theme": "可燃性・毒性ガスの通風貯蔵", "question": "液化アンモニアの充填容器及び残ガス容器による貯蔵は、そのガスが漏えいしたとき拡散しないように通風の良い場所でしてはならない。", "answer": "×", "law": "一般則第18条第2号イ", "explanation": "可燃性ガス又は毒性ガス（アンモニア）の充填容器等は、「通風の良い場所」で貯蔵しなければならない（通風の良い場所でしてはならないは誤り）。"}, {"id": 442, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問8", "branch": "イ", "theme": "容積圧縮式の冷凍能力算定式", "question": "冷媒ガスの種類に応じて定められた数値（C）は、冷媒ガスの圧縮機（遠心式圧縮機以外のもの）を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第4号", "explanation": "遠心式以外の圧縮機（往復動式・スクリュー・回転ピストン等）の算定式は R = V / C であり、冷媒種ごとの数値Cが必要である。"}, {"id": 443, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問8", "branch": "ロ", "theme": "自然環流式の冷凍能力算定式", "question": "冷媒設備内の冷媒ガスの充填量の数値は、自然環流式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第3号", "explanation": "自然環流式の冷凍能力算定式は R = Q * A であり、蒸発器表面積Aを用いる。冷媒充填量の数値は不要（誤り）。"}, {"id": 444, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問8", "branch": "ハ", "theme": "遠心式圧縮機の算定基準", "question": "圧縮機の標準回転速度における1時間当たりの吐出し量の数値は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第1号", "explanation": "遠心式圧縮機を使用する設備の算定に必要なのは「原動機の定格出力（W）」であり、吐出し量の数値ではない（誤り）。"}, {"id": 445, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の作成・届出と遵守", "question": "（アンモニア250t）この事業者は、危害予防規程を定め、これを都道府県知事等に届け出なければならない。また、この危害予防規程を守るべき者は、この事業者及びその従業者であると定められている。", "answer": "○", "law": "法第26条第1項・第3項", "explanation": "アンモニア250tの第一種製造者は危害予防規程の策定・届出義務があり、事業者及び全従業員に遵守義務がある。"}, {"id": 446, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問9", "branch": "ロ", "theme": "保安教育未実行に対する改善勧告", "question": "（アンモニア250t）この事業者は、保安教育計画を忠実に実行しておらず、かつ、公共の安全の維持又は災害の発生の防止のため必要があると都道府県知事等が認める場合、都道府県知事等からその保安教育計画を忠実に実行し、又はその従業者に保安教育を施し、若しくはその内容若しくは方法を改善するよう勧告を受けることがある。", "answer": "○", "law": "法第27条第4項", "explanation": "知事等は保安教育計画が忠実に実行されていない場合、計画の忠実実行や教育内容・方法の改善を命じ、又は勧告することができる。"}, {"id": 447, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問9", "branch": "ハ", "theme": "指定場所の火気制限", "question": "（アンモニア250t）この事業者がこの事業所内において指定した場所では、その事業所に選任された冷凍保安責任者を除き、何人も火気を取り扱ってはならない。", "answer": "×", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、冷凍保安責任者であっても例外なく禁止される（除きは誤り）。"}, {"id": 448, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問10", "branch": "イ", "theme": "危険時の退避警告措置", "question": "（アンモニア250t）冷凍のための製造施設が危険な状態になったとき、応急の措置を講じることができなかったので、従業者に退避するよう警告するとともに、付近の住民の退避も必要と判断し、その住民に退避するよう警告した。", "answer": "○", "law": "冷規第45条第1号・第2号", "explanation": "応急措置を講ずることができないときは、従業者や必要に応じ付近の住民に退避するよう警告することが義務付けられている。"}, {"id": 449, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録帳簿の保存期間", "question": "（アンモニア250t）平成30年（2018年）11月1日に製造施設に異常があったので、その年月日及びそれに対してとった措置を帳簿に記載し、これを保存していたが、その後その製造施設に異常がなかったので、令和5年（2023年）11月1日にその帳簿を廃棄した。", "answer": "×", "law": "法第60条第1項、冷規第65条", "explanation": "異常時記録帳簿の保存期間は記載の日から「10年間」である。5年で廃棄することは法令違反（誤り）。"}, {"id": 450, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問10", "branch": "ハ", "theme": "容器盗難時の届出義務", "question": "（アンモニア250t）この製造施設の高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならないが、所有し、又は占有する容器を盗まれたときは、その旨を都道府県知事等又は警察官に届け出なくてよい。", "answer": "×", "law": "法第63条第1項第2号", "explanation": "所有又は占有する容器を喪失し、又は盗まれたときも遅滞なく知事等又は警察官に届け出る義務がある（届け出なくてよいは誤り）。"}, {"id": 451, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア圧縮機取替えの軽微変更除外", "question": "（アンモニア250t）この冷媒設備の圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものは、その工事の完成後、その旨を都道府県知事等に届け出ればよい。", "answer": "×", "law": "法第14条第1項、冷規第17条第1項第2号", "explanation": "アンモニア設備（毒性・可燃性）の取替えは軽微な変更から除外されているため、切断溶接や能力変更がなくても事前の変更許可が必要（事後届出は誤り）。"}, {"id": 452, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問11", "branch": "ロ", "theme": "完成検査不要工事の特例除外", "question": "（アンモニア250t）この冷媒設備の圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなければならないが、その変更の工事の完成後、その製造施設の完成検査を受けることなくこれを使用することができる。", "answer": "×", "law": "法第20条第3項、冷規第23条", "explanation": "アンモニア設備は完成検査不要工事の特例（冷規第23条）から除外されているため、完成検査に合格しなければ使用できない（誤り）。"}, {"id": 453, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問11", "branch": "ハ", "theme": "施設譲渡と完成検査免除", "question": "（アンモニア250t）既に完成検査を受け所定の技術上の基準に適合していると認められているこの製造施設の全部の引渡しがあった場合、その引渡しを受けた者は、都道府県知事等の高圧ガスの製造に係る許可を受けたのち、都道府県知事等、高圧ガス保安協会又は指定完成検査機関が行う完成検査を受けることなく、この製造施設を使用することができる。", "answer": "○", "law": "法第20条第2項", "explanation": "既に完成検査済みの施設の引渡しを受けて知事等の許可を受けた者は、改めて完成検査を受けることなく施設を使用できる。"}, {"id": 454, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問12", "branch": "イ", "theme": "専用機械室の滞留防止構造", "question": "（アンモニア250t）圧縮機、凝縮器及び受液器並びにこれらを接続する配管が設置してある専用機械室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。", "answer": "○", "law": "冷規第7条第1項第3号", "explanation": "毒性・可燃性のアンモニア設備及び配管を設置する専用機械室は、漏えい時にガスが滞留しない換気・開口部構造とする必要がある。"}, {"id": 455, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問12", "branch": "ロ", "theme": "受液器のガラス管液面計使用制限", "question": "（アンモニア250t）この受液器に液面計を設ける場合は、その液面計の破損を防止するための措置を講じ、かつ、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置を講じても、いかなるガラス管液面計も使用してはならない。", "answer": "×", "law": "冷規第7条第1項第10号・第11号", "explanation": "禁止されているのは「丸形ガラス管液面計」のみであり、平形ガラス管液面計等で二重防護措置を講じたものは使用可能である（いかなるガラス管も使用不可は誤り）。"}, {"id": 456, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問12", "branch": "ハ", "theme": "電気設備の防爆構造除外", "question": "（アンモニア250t）この製造施設の冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものとすべきものに該当しない。", "answer": "○", "law": "冷規第7条第1項第14号", "explanation": "防爆構造義務は「可燃性ガス（アンモニアを除く。）」と規定され、アンモニア設備は防爆構造義務から除外されているため正。"}, {"id": 457, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "イ", "theme": "消火設備の設置義務", "question": "（アンモニア250t）この製造施設は、その規模に応じて、適切な消火設備を適切な箇所に設けるべき施設に該当しない。", "answer": "×", "law": "冷規第7条第1項第12号", "explanation": "アンモニアは可燃性ガスであるため、規模に応じた適切な消火設備の設置が義務付けられている（該当しないは誤り）。"}, {"id": 458, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "ロ", "theme": "受液器の流出防止措置", "question": "（アンモニア250t）この受液器は、その周囲に冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じるべきものに該当しない。", "answer": "○", "law": "冷規第7条第1項第13号", "explanation": "毒性冷媒の流出防止措置（防液堤等）が必要な受液器は内容積「10,000 L以上」である。本問は6,000 Lのため義務付けられない（該当しないは正）。"}, {"id": 459, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問13", "branch": "ハ", "theme": "耐震設計の該当性", "question": "（アンモニア250t）この凝縮器及び受液器のいずれも、所定の耐震に関する性能を有すべきものに該当する。", "answer": "×", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上で該当するが、凝縮器は「縦置円筒形で胴長5m以上」が対象であり、横置円筒形の本凝縮器は対象外（いずれも該当するは誤り）。"}, {"id": 460, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "イ", "theme": "代理者による自主検査監督", "question": "（R134a 600t）冷凍保安責任者が病気で不在のため、この製造施設の定期自主検査を冷凍保安責任者の代理者の監督のもとに実施した。", "answer": "○", "law": "法第33条第1項、冷規第44条第4項", "explanation": "責任者が不在時は、あらかじめ選任された代理者が定期自主検査の実施監督を代行できるため正。"}, {"id": 461, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の選任・解任届", "question": "（R134a 600t）冷凍保安責任者の代理者を選任又は解任したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第27条の2第5項、法第33条第3項", "explanation": "代理者の選任・解任についても、責任者と同様に遅滞なく知事等へ届け出なければならない。"}, {"id": 462, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者の実務経験年数", "question": "（R134a 600t）冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が20トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者のうちから選任しなければならない。", "answer": "×", "law": "冷規第36条第1項", "explanation": "設備A（300トン）の選任基準は、第一種免状＋「100トン以上」の施設での製造経験1年以上が必要（20トン以上では不可のため誤り）。"}, {"id": 463, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "イ", "theme": "圧縮機取替の軽微変更届", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更がないものは、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で、切断溶接なし・能力変更なしの設備取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 464, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "ロ", "theme": "製造設備以外の設備取替え", "question": "（R134a 600t）製造設備以外の製造施設に係る設備の取替えの工事を行う場合、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等にその旨を届け出ればよい。", "answer": "○", "law": "冷規第17条第1項第3号", "explanation": "「製造設備以外の製造施設に係る設備の取替え工事」は軽微な変更工事
