に該当するため、完成後遅滞なく届け出ればよい。"}, {"id": 465, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問15", "branch": "ハ", "theme": "能力変更所定範囲の完成検査不要", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなければならないが、その変更の工事の完成後、その製造施設の完成検査を受けることなくこれを使用することができる。", "answer": "○", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "不活性フルオロカーボン設備で切断溶接なし・能力変更が告示範囲内（20%以内）の取替えは、許可は必要だが完成検査を受けずに使用できる。"}, {"id": 466, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問16", "branch": "イ", "theme": "認定指定設備の保安検査除外", "question": "（R134a 600t）この事業者は、認定指定設備である製造設備Bの部分を除く製造施設について、定期に保安検査を受けなければならない。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備は特定施設から除外されるため、保安検査は設備Bを除く設備Aについて受検する。"}, {"id": 467, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問16", "branch": "ロ", "theme": "保安検査の対象", "question": "（R134a 600t）保安検査は、特定施設が製造施設の位置、構造及び設備並びに高圧ガスの製造の方法に係る技術上の基準に適合しているかどうかについて行われる。", "answer": "×", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、「製造の方法（ソフト基準）」は対象に含まれない（誤り）。"}, {"id": 468, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問16", "branch": "ハ", "theme": "保安検査の実施主体", "question": "（R134a 600t）保安検査を実施することは、冷凍保安責任者の職務の一つとして定められている。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事等又は指定検査機関が行う行政検査であり、自社の冷凍保安責任者の職務ではない（誤り）。"}, {"id": 469, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問17", "branch": "イ", "theme": "指定設備の定期自主検査義務", "question": "（R134a 600t）定期自主検査は、認定指定設備である製造設備Bの部分を除く製造施設について実施しなければならない。", "answer": "×", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "認定指定設備（設備B）も定期自主検査の義務対象であり、これを除外してはならない（除くは誤り）。"}, {"id": 470, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問17", "branch": "ロ", "theme": "自主検査の対象", "question": "（R134a 600t）定期自主検査は、製造の方法が所定の技術上の基準に適合しているかどうかについて、1年に1回以上行わなければならない。", "answer": "×", "law": "法第35条の2、冷規第44条第3項", "explanation": "定期自主検査は施設の位置・構造・設備について行うものであり、「製造の方法」は対象に含まれない（誤り）。"}, {"id": 471, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査記録の監督者氏名", "question": "（R134a 600t）定期自主検査を行ったとき、検査の実施について監督を行った者の氏名は、その検査記録に記載すべき事項の一つである。", "answer": "○", "law": "冷規第44条第5項第4号", "explanation": "定期自主検査記録の法定記載事項として「検査の実施について監督を行った者の氏名」が明定されている。"}, {"id": 472, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問18", "branch": "イ", "theme": "火気隔離基準の適用", "question": "（R134a 600t）圧縮機及び受液器並びにこれらの間の配管が引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所及び火気（その製造設備内のものを除く。）の付近にあってはならない旨の定めは、この事業所には適用されない。", "answer": "×", "law": "冷規第7条第1項第1号", "explanation": "火気・可燃物からの隔離基準は冷媒種によらず全設備に適用されるため、「適用されない」は誤り。"}, {"id": 473, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問18", "branch": "ロ", "theme": "気体耐圧試験の圧力倍率", "question": "（R134a 600t）冷媒設備の配管以外の部分について行う耐圧試験は、水その他の安全な液体を使用して行うことが困難であると認められる場合、この試験を空気、窒素等の気体を使用して許容圧力の1.25倍以上の圧力で行うことができる。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "液体が困難な場合の気体耐圧試験圧力は「許容圧力の1.25倍以上」で行うことができる。"}, {"id": 474, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問18", "branch": "ハ", "theme": "自動制御バルブの操作措置除外", "question": "（R134a 600t）製造設備Aに設けたバルブ又はコック（操作ボタン等により開閉するものにあっては、その操作ボタン等）には、作業員が適切にそのバルブ又はコックを操作することができるような措置を講じるべき定めがあるが、操作ボタン等を使用することなく自動制御で開閉されるバルブ又はコックには、その定めはない。", "answer": "○", "law": "冷規第7条第1項第17号", "explanation": "ボタン等を使わず全自動制御されるバルブ・コックは、作業員の操作措置義務から除外されている。"}, {"id": 475, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問19", "branch": "イ", "theme": "日常点検の対象範囲", "question": "（R134a 600t）高圧ガスの製造は、1日に1回以上、その製造設備のうち冷媒設備のみについて異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "×", "law": "冷規第9条第2号", "explanation": "日常点検の対象は冷媒設備のみではなく「製造施設全体」である（冷媒設備のみとする記述は誤り）。"}, {"id": 476, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問19", "branch": "ロ", "theme": "開放修理・清掃時の漏洩防止", "question": "（R134a 600t）冷媒設備を開放して修理又は清掃をする場合、その開放する部分に他の部分からガスが漏えいすることを防止するための措置を講じないで行うことができる。", "answer": "×", "law": "冷規第9条第3号ハ", "explanation": "開放修理・清掃時の漏洩防止措置はすべての冷媒ガス設備に義務付けられており、講じないで行うことはできない（誤り）。"}, {"id": 477, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問19", "branch": "ハ", "theme": "修理時の作業計画・責任者", "question": "（R134a 600t）冷媒設備の修理を行うときは、製造設備A又は製造設備Bのいずれの修理の場合であっても、その作業計画及びその作業の責任者を定めなければならない。", "answer": "○", "law": "冷規第9条第3号イ", "explanation": "認定指定設備（設備B）であっても修理時にはあらかじめ作業計画及び作業責任者を定めて行う義務がある。"}, {"id": 478, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の試運転・一体搬入", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つに、「冷媒設備は、その設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されるものであること。」がある。", "answer": "○", "law": "冷規第57条第5号", "explanation": "製造業者の事業所で試運転を行い、現場へ分割されずに一体搬入されることが構造条件である。"}, {"id": 479, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の手動止め弁禁止", "question": "（R134a 600t・設備B）この製造設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用することができる。", "answer": "×", "law": "冷規第57条第12号", "explanation": "指定設備の日常運転操作用止め弁には「手動式のものを使用しないこと」と定められている（使用できるは誤り）。"}, {"id": 480, "subject": "法令", "year": "2023年度(令和5年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の同等部品交換", "question": "（R134a 600t・設備B）この製造設備に変更の工事を施したとき、その工事が同等の部品への交換のみである場合は、指定設備認定証は無効にならないと定められている。", "answer": "○", "law": "冷規第62条第1項第1号", "explanation": "同等部品への交換のみである変更工事の場合は、指定設備認定証は無効とならない。"}, {"id": 481, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "イ", "theme": "法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費の規制をすることのみを定めている。", "answer": "×", "law": "法第1条", "explanation": "法第1条では行政規制だけでなく「民間事業者及び高圧ガス保安協会による自主的な活動の促進」も目的に明定されている（「規制することのみ」は誤り）。"}, {"id": 482, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義", "question": "現在の圧力が0.1メガパスカルの圧縮ガス（圧縮アセチレンガスを除く。）であって、温度35度において圧力が0.2メガパスカルとなるものは、高圧ガスである。", "answer": "×", "law": "法第2条第1号", "explanation": "圧縮ガスは常用温度で現に1 MPa以上、または35℃で1 MPa以上が高圧ガスである。35℃で0.2 MPaのものは高圧ガスではない（誤り）。"}, {"id": 483, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問1", "branch": "ハ", "theme": "適用除外", "question": "1日の冷凍能力が3トン以上5トン未満の冷凍設備内における高圧ガスであっても、そのガスの種類によっては、高圧ガス保安法の適用を受けないものがある。", "answer": "○", "law": "政令第2条第5項第4号", "explanation": "3トン以上5トン未満の設備内では、第1種ガス（不活性・難燃性フルオロカーボンや二酸化炭素）が高圧ガス保安法の適用除外となるため正。"}, {"id": 484, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "イ", "theme": "認定指定設備の届出", "question": "認定指定設備のみを使用して冷凍のため高圧ガスの製造をしようとする者は、その設備の1日の冷凍能力が50トン以上である場合であっても、その製造について都道府県知事等の許可を受ける必要はないが、製造開始の日の20日前までにその旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第5条第2項第2号、政令第4条、法第35条の2", "explanation": "認定指定設備のみを用いる場合は第一種製造者（許可）から除外され、第二種製造者として製造開始20日前までに知事へ届け出ればよい。"}, {"id": 485, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ロ", "theme": "製造廃止の手続", "question": "冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造を廃止しようとするとき、都道府県知事等の許可を受けなければならない。", "answer": "×", "law": "法第21条第1項", "explanation": "製造を廃止したときは遅滞なく「届け出」れば足り、「許可」を受ける必要はない（誤り）。"}, {"id": 486, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問2", "branch": "ハ", "theme": "施設変更の許可原則", "question": "冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造施設の位置、構造又は設備の変更の工事をしようとするときは、その工事が定められた軽微なものである場合を除き、都道府県知事等の許可を受けなければならない。", "answer": "○", "law": "法第14条第1項", "explanation": "第一種製造者が位置・構造・設備の変更工事をしようとするときは、軽微な変更を除き事前に知事等の許可を受けなければならない。"}, {"id": 487, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "イ", "theme": "事業譲渡による承継除外", "question": "冷凍のため高圧ガスの製造をする第一種製造者がその高圧ガスの製造事業の全部を譲り渡したときは、その事業の全部を譲り受けた者はその第一種製造者の地位を承継する。", "answer": "×", "law": "法第10条第1項", "explanation": "事業の譲渡・譲受による承継規定はない。譲受人は新規に製造許可を取得する必要がある（誤り）。"}, {"id": 488, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ロ", "theme": "不活性ガスの廃棄基準除外", "question": "特定不活性ガスを除く不活性ガスは、冷凍保安規則に定められている高圧ガスの廃棄に係る技術上の基準に従って廃棄しなければならない高圧ガスとして定められていない。", "answer": "○", "law": "法第25条、冷規第33条", "explanation": "廃棄基準の対象は可燃性ガス、毒性ガス及び特定不活性ガスであり、特定不活性ガスを除く不活性ガスは対象外である。"}, {"id": 489, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問3", "branch": "ハ", "theme": "機器製造業者の対象", "question": "1日の冷凍能力が5トンの専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）は、所定の技術上の基準に従ってその機器の製造をしなければならない。", "answer": "○", "law": "法第57条、冷規第63条", "explanation": "冷媒種を問わず、冷凍能力5トンの機器はすべて機器製造業者の技術基準遵守対象となる（第一種ガスは5t以上、その他は3t以上）。"}, {"id": 490, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の区分", "question": "アンモニアを冷媒ガスとする冷凍設備であって、1日の冷凍能力が10トンのもののみを使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条第2項第2号、政令第4条", "explanation": "アンモニア設備は冷凍能力5トン以上50トン未満が第二種製造者に該当するため、10トンの設備は第二種製造者となる。"}, {"id": 491, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ロ", "theme": "第二種製造者の定期自主検査義務", "question": "第二種製造者のうちには、製造施設について定期自主検査を行わなければならない者がある。", "answer": "○", "law": "法第35条の2、冷規第44条第1項", "explanation": "認定指定設備使用者や、アンモニア・可燃性フルオロカーボンで20トン以上の第二種製造者には定期自主検査義務がある。"}, {"id": 492, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問4", "branch": "ハ", "theme": "気密試験・試運転のガス条件", "question": "製造設備の変更の工事を完成したときは、酸素以外のガスを使用する試運転又は所定の気密試験を行った後でなければ高圧ガスの製造をしてはならない。", "answer": "○", "law": "法第12条第2項、冷規第14条第1号", "explanation": "工事完成時は、酸素以外のガスによる試運転又は許容圧力以上の気密試験を行わなければ製造してはならない。"}, {"id": 493, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "イ", "theme": "特定不活性ガスの消火設備携行", "question": "特定不活性ガスである液化フルオロカーボン32を移動するときは、消火設備並びに災害発生防止のための応急措置に必要な資材及び工具等を携行しなければならない。", "answer": "○", "law": "一般則第50条第9号", "explanation": "特定不活性ガス（R32等）の容器（48L）積載移動時には、消火設備および応急資材・工具の携行が義務付けられている。"}, {"id": 494, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ロ", "theme": "毒性ガスの保護具携行義務", "question": "液化アンモニアを移動するときは、その高圧ガスの種類に応じた防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等も携行しなければならない。", "answer": "○", "law": "一般則第50条第10号", "explanation": "毒性ガス（アンモニア等）移動時には、防毒マスク・保護手袋・応急資材等の携行が義務付けられている。"}, {"id": 495, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問5", "branch": "ハ", "theme": "特定不活性ガスの書面交付・携帯", "question": "特定不活性ガスである液化フルオロカーボン32を移動するときは、その高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。", "answer": "○", "law": "一般則第49条第1項第21号、同第50条第14号", "explanation": "特定不活性ガスの移動時にも、イエローカード（注意事項書面）の交付・携帯・遵守義務が課されている。"}, {"id": 496, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "イ", "theme": "附属品再検査の期間決定要因", "question": "容器に装置されているバルブの附属品再検査の期間は、そのバルブの製造後の経過年数のみに応じて定められている。", "answer": "×", "law": "容規第27条第1項第1号", "explanation": "バルブの再検査期間は、バルブ自体の経過年数のみではなく「装置されている容器の容器再検査の期間」に連動して定められている（「経過年数のみに応じて」は誤り）。"}, {"id": 497, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ロ", "theme": "容器の譲渡・引渡制限", "question": "容器の製造又は輸入をした者は、特に定められた容器を除き、所定の容器検査を受け、これに合格したものとして所定の刻印等がされているものでなければ、容器を譲渡し、又は引き渡してはならない。", "answer": "○", "law": "法第44条第1項", "explanation": "容器製造・輸入者は、容器検査に合格し刻印等がされたものでなければ譲渡・引渡しが禁じられている。"}, {"id": 498, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問6", "branch": "ハ", "theme": "附属品検査合格時の刻印義務", "question": "容器の附属品が附属品検査に合格したときは、特に定める場合を除き、その附属品に所定の方法で刻印しなければならない。", "answer": "○", "law": "法第49条の3第1項、容規第18条第1項", "explanation": "附属品検査合格時は、附属品の厚肉部の見やすい箇所に所定事項を刻印しなければならない。"}, {"id": 499, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "イ", "theme": "可燃性ガス置場の燈火制限", "question": "液化アンモニアの容器置場には、携帯電燈以外の燈火を携えて立ち入ってはならない。", "answer": "○", "law": "一般則第6条第2項第8号チ", "explanation": "アンモニアは可燃性ガスに指定されているため、容器置場には携帯電燈以外の燈火を携えて立ち入ることは禁止されている。"}, {"id": 500, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ロ", "theme": "貯蔵所における車両積載容器貯蔵", "question": "車両に積載した容器により高圧ガスを貯蔵するときは、都道府県知事等の許可を受けて設置する第一種貯蔵所又は都道府県知事等に届出を行って設置する第二種貯蔵所において貯蔵することができる。", "answer": "○", "law": "一般則第18条第2号ホ", "explanation": "原則禁止される車両積載容器貯蔵も、第一種貯蔵所（許可）又は第二種貯蔵所（届出）においては適法に行うことができる。"}, {"id": 501, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問7", "branch": "ハ", "theme": "特定不活性ガスの通風貯蔵除外", "question": "アンモニアの充填容器及び残ガス容器を貯蔵する場合は、通風の良い場所で行わなければならないが、特定不活性ガスであるフルオロカーボン32については、その定めはない。", "answer": "○", "law": "一般則第18条第2号イ", "explanation": "通風の良い場所での貯蔵義務は「可燃性ガス又は毒性ガス」に限定されており、特定不活性ガス（R32）は対象から除外されている。"}, {"id": 502, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "イ", "theme": "多段圧縮方式の冷凍能力算定式", "question": "多段圧縮方式による製造設備の1日の冷凍能力の算定に必要な数値の一つに、蒸発器の冷媒ガスに接する側の表面積の数値がある。", "answer": "×", "law": "冷規第5条第4号", "explanation": "多段圧縮方式は高段気筒と低段気筒のピストン押しのけ量（VH + 0.08VL）を用いて算定する。蒸発器表面積は不要（誤り）。"}, {"id": 503, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ロ", "theme": "吸収式冷凍設備の算定定数", "question": "吸収式冷凍設備にあっては、発生器を加熱する1時間の入熱量2万7,800キロジュールをもって1日の冷凍能力1トンとする。", "answer": "○", "law": "冷規第5条第2号", "explanation": "吸収式冷凍設備は、発生器入熱量 27,800 kJ/h をもって1日の冷凍能力1トンとする。"}, {"id": 504, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問8", "branch": "ハ", "theme": "遠心式圧縮機の算定定数", "question": "遠心式圧縮機を使用する製造設備にあっては、その圧縮機の原動機の定格出力1.2キロワットをもって1日の冷凍能力1トンとする。", "answer": "○", "law": "冷規第5条第1号", "explanation": "遠心式圧縮機を使用する設備は、原動機定格出力 1.2 kW をもって1日の冷凍能力1トンとする。"}, {"id": 505, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "イ", "theme": "指定場所の火気制限", "question": "（アンモニア250t）この事業者がその事業所内において指定した場所では、その事業所の従業者を除き、何人も火気を取り扱ってはならない。", "answer": "×", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、自社の従業者であっても例外なく禁止される（除きは誤り）。"}, {"id": 506, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ロ", "theme": "危険時の通報義務", "question": "（アンモニア250t）高圧ガスの製造施設が危険な状態になったときは、直ちに、特に定める災害の発生の防止のための応急の措置を講じなければならない。また、この事業者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。", "answer": "○", "law": "法第36条第1項・第2項", "explanation": "直ちに応急措置を講じる義務とともに、事態を発見した者は事業者であるか否かを問わず直ちに通報届出を行う義務がある。"}, {"id": 507, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問9", "branch": "ハ", "theme": "危害予防規程の届出義務", "question": "（アンモニア250t）この事業者は、危害予防規程を定め、従業者とともに、これを忠実に守らなければならないが、その危害予防規程を都道府県知事等に届け出るべき定めはない。", "answer": "×", "law": "法第26条第1項", "explanation": "危害予防規程は作成して「都道府県知事等に届け出なければならない」（定めがないは誤り）。"}, {"id": 508, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "イ", "theme": "保安教育計画の届出不要", "question": "（アンモニア250t）この事業者は、従業者に対する保安教育計画を定め、その計画を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務だが、計画そのものを知事等へ届け出る義務はない（誤り）。"}, {"id": 509, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録帳簿の保存期間", "question": "（アンモニア250t）この事業者は、この事業所に所定の帳簿を備え、製造施設に異常があった場合、その年月日及びそれに対してとった措置を帳簿に記載し、記載の日から10年間保存しなければならない。", "answer": "○", "law": "法第60条第1項、冷規第65条", "explanation": "異常時記録帳簿は記載の日から10年間保存しなければならない。"}, {"id": 510, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問10", "branch": "ハ", "theme": "災害発生時の届出義務", "question": "（アンモニア250t）この事業者は、その所有し、又は占有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。", "answer": "○", "law": "法第63条第1項第1号", "explanation": "高圧ガスについて災害が発生したときは、遅滞なく都道府県知事等又は警察官に届け出なければならない。"}, {"id": 511, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "イ", "theme": "アンモニア設備の軽微変更除外", "question": "（アンモニア250t）この製造施設の製造設備の取替えの工事においては、定められた軽微な変更の工事に該当するものはない。", "answer": "○", "law": "冷規第17条第1項第2号", "explanation": "毒性・可燃性であるアンモニア冷媒設備は軽微な変更工事の対象から除外されているため、該当するものはない。"}, {"id": 512, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ロ", "theme": "施設譲渡と完成検査免除", "question": "（アンモニア250t）既に完成検査を受け所定の技術上の基準に適合していると認められているこの製造施設の全部の引渡しがあった場合、その引渡しを受けた者は、都道府県知事等の許可を受け、改めて都道府県知事等が行う完成検査を受けなければこの製造施設を使用することができない。", "answer": "×", "law": "法第20条第2項", "explanation": "既に完成検査済みの施設の引渡しを受けて許可を受けた者は、改めて完成検査を受けることなく使用できる（受けなければ使用できないは誤り）。"}, {"id": 513, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問11", "branch": "ハ", "theme": "完成検査不要工事の特例除外", "question": "（アンモニア250t）製造施設の変更の工事のうちには、都道府県知事等の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事があり、この製造施設のうち冷媒設備の取替えの工事に適用される。", "answer": "×", "law": "法第20条第3項、冷規第23条", "explanation": "アンモニア設備は完成検査不要工事の特例から除外されているため、本事業所の取替え工事には適用されない（誤り）。"}, {"id": 514, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "イ", "theme": "受液器液面計の二重防護措置", "question": "（アンモニア250t）この受液器にガラス管液面計を設ける場合には、その液面計の破損を防止するための措置又は受液器とガラス管液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置のいずれか一方の措置を講じなければならない。", "answer": "×", "law": "冷規第7条第1項第10号・第11号", "explanation": "アンモニア受液器では、丸形以外の液面計とし破損防止措置と漏洩防止措置の「両方」を講じなければならない（「いずれか一方」は誤り）。"}, {"id": 515, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ロ", "theme": "受液器の流出防止措置", "question": "（アンモニア250t）この受液器は、その周囲にその液状の冷媒ガスが漏えいした場合に、その流出を防止するための措置を講じなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第13号", "explanation": "毒性冷媒の流出防止措置（防液堤等）が必要な受液器は内容積「10,000 L以上」である。本問は6,000 Lのため該当しない（誤り）。"}, {"id": 516, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問12", "branch": "ハ", "theme": "安全弁放出管の開口部位置", "question": "（アンモニア250t）この冷媒設備の安全弁（大気に冷媒ガスを放出することのないものを除く。）には、放出管を設けなければならない。また、放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。", "answer": "○", "law": "冷規第7条第1項第9号", "explanation": "大気放出型安全弁には放出管を設け、アンモニアの毒性・可燃性に応じた安全な位置に開口部を配置しなければならない。"}, {"id": 517, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "イ", "theme": "消火設備の設置義務", "question": "（アンモニア250t）この製造施設は、その規模に応じて、適切な消火設備を適切な箇所に設けなければならない施設に該当する。", "answer": "○", "law": "冷規第7条第1項第12号", "explanation": "アンモニアは可燃性ガスであるため、規模に応じた消火設備の設置義務が適用される。"}, {"id": 518, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ロ", "theme": "放出管設置による除害措置免除不可", "question": "（アンモニア250t）冷媒設備の安全弁に放出管を設けた場合は、製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じる必要はない。", "answer": "×", "law": "冷規第7条第1項第16号", "explanation": "毒性ガスの除害措置義務は、安全弁に放出管を設けても免除されない（必要はないは誤り）。"}, {"id": 519, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問13", "branch": "ハ", "theme": "耐震設計の該当性", "question": "（アンモニア250t）この凝縮器及び受液器のいずれも、所定の耐震に関する性能を有しなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上で該当するが、横置円筒形凝縮器は対象外であるため「いずれも」は誤り。"}, {"id": 520, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "イ", "theme": "冷凍保安責任者の選任要件", "question": "（R134a 600t）この事業所の冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が100トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者を選任しなければならない。", "answer": "○", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "認定指定設備Bを除く設備A（300トン）で判定する。300トン以上の設備は「第一種冷凍機械責任者免状」＋「100トン以上で1年以上の実務経験」が必要。"}, {"id": 521, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の事前選任義務", "question": "（R134a 600t）冷凍保安責任者が疾病その他の事故によって、その職務を行うことができないときは、直ちに、その代理者を選任しなければならない。", "answer": "×", "law": "法第33条第1項", "explanation": "代理者は事故発生時に選任するのではなく、「あらかじめ」選任しておかなければならない（直ちに選任は誤り）。"}, {"id": 522, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者の解任届出義務", "question": "（R134a 600t）選任している冷凍保安責任者を解任し、新たな者を選任したときは、遅滞なく、選任した者についてその旨を都道府県知事等に届け出なければならないが、解任した者についてはその旨を都道府県知事等に届け出る必要はない。", "answer": "×", "law": "法第27条の2第5項、法第27条の4第2項", "explanation": "冷凍保安責任者を選任したときだけでなく、「解任したとき」も遅滞なく届け出なければならない（必要はないは誤り）。"}, {"id": 523, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "イ", "theme": "凝縮器取替の軽微変更届", "question": "（R134a 600t）製造設備Aの凝縮器の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その取替えに係る凝縮器が耐震設計構造物の適用を受けないものである場合、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で切断溶接なし・耐震対象外・能力変更なしの凝縮器取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 524, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ロ", "theme": "製造設備以外の設備取替", "question": "（R134a 600t）製造設備以外の製造施設に係る設備の取替え工事を行う場合、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "冷規第17条第1項第3号", "explanation": "製造設備以外の製造施設に係る設備の取替え工事は、軽微な変更工事に該当する。"}, {"id": 525, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問15", "branch": "ハ", "theme": "能力変更所定範囲の許可と完成検査", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなくてよいが、その変更の工事の完成後、所定の完成検査を受けなければこれを使用することはできない。", "answer": "×", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "能力変更を伴う工事は「事前に許可が必要」であり、完成検査不要工事に該当するため「完成検査は受けなくてよい」（記述が逆であり誤り）。"}, {"id": 526, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問16", "branch": "イ", "theme": "保安検査の実施主体", "question": "（R134a 600t）保安検査を実施することは、冷凍保安責任者の職務の一つとして定められている。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事等又は指定検査機関が行う行政検査であり、自社の冷凍保安責任者の職務ではない（誤り）。"}, {"id": 527, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問16", "branch": "ロ", "theme": "保安検査の対象", "question": "（R134a 600t）保安検査は、製造設備Bの部分を除き、製造施設の位置、構造及び設備並びに製造の方法が所定の技術上の基準に適合しているかどうかについて行われる。", "answer": "×", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、「製造の方法（ソフト基準）」は含まれない（誤り）。"}, {"id": 528, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問16", "branch": "ハ", "theme": "保安検査の実施機関", "question": "（R134a 600t）保安検査は、都道府県知事等、高圧ガス保安協会又は指定保安検査機関のいずれかが行う。", "answer": "○", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事等が行うほか、高圧ガス保安協会又は指定保安検査機関で行うことができる。"}, {"id": 529, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問17", "branch": "イ", "theme": "定期自主検査記録の法定記載事項", "question": "（R134a 600t）定期自主検査の検査記録に記載すべき事項の一つに、検査をした製造施設の設備ごとの検査方法及び結果がある。", "answer": "○", "law": "冷規第44条第5項第2号", "explanation": "定期自主検査記録の法定記載事項として「検査をした製造施設の設備ごとの検査方法及び結果」が明定されている。"}, {"id": 530, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問17", "branch": "ロ", "theme": "認定指定設備の定期自主検査義務", "question": "（R134a 600t）認定指定設備である製造設備Bについては、定期自主検査を行わなくてよい。", "answer": "×", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "認定指定設備（設備B）も定期自主検査の義務対象であり、点検を行わなくてよいとする記述は誤り。"}, {"id": 531, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査計画の届出不要", "question": "（R134a 600t）定期自主検査を行うときは、あらかじめ、その検査計画を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第35条の2", "explanation": "定期自主検査の計画をあらかじめ知事等に届け出る義務は定められていない（誤り）。"}, {"id": 532, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問18", "branch": "イ", "theme": "火気隔離基準の例外措置", "question": "（R134a 600t）冷媒設備の圧縮機は、その製造設備外の火気の付近にあってはならない。ただし、その火気に対して安全な措置を講じた場合は、この限りでない。", "answer": "○", "law": "冷規第7条第1項第1号", "explanation": "圧縮機等は火気の付近にあってはならないが、火気に対して安全な防護措置を講じた場合は設置が認められる。"}, {"id": 533, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問18", "branch": "ロ", "theme": "液体耐圧試験の圧力倍率", "question": "（R134a 600t）配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.25倍の圧力で行わなければならない。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "水その他の安全な液体を使用する耐圧試験圧力は「許容圧力の1.5倍以上」である（1.25倍は気体使用時の基準であり誤り）。"}, {"id": 534, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問18", "branch": "ハ", "theme": "ボタン操作バルブの操作措置", "question": "（R134a 600t）製造設備に設けたバルブ又はコックを操作ボタン等により開閉する場合には、作業員がその操作ボタン等を適切に操作することができるような措置を講じることと定められている。", "answer": "○", "law": "冷規第7条第1項第17号", "explanation": "操作ボタン等により開閉するバルブ・コックには、作業員がそのボタン等を適切に操作できる措置を講じなければならない。"}, {"id": 535, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問19", "branch": "イ", "theme": "油圧系統以外の圧力計義務", "question": "（R134a 600t）冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有するものであれば、その油圧系統を除く冷媒設備に圧力計を設ける必要はない。", "answer": "×", "law": "冷規第7条第1項第7号", "explanation": "油圧保護装置（OPS）がある場合に圧力計が免除されるのは「当該油圧系統」のみであり、油圧系統を除く冷媒設備本体には圧力計の設置が必要である（誤り）。"}, {"id": 536, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問19", "branch": "ロ", "theme": "凝縮器気密試験の圧力基準", "question": "（R134a 600t）認定指定設備である製造設備Bの冷媒設備のうち、凝縮器の気密試験は、許容圧力と同じ圧力で行ってよい。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "気密試験は「許容圧力以上の圧力」で行うこととされているため、許容圧力と同じ圧力で行ってよい。"}, {"id": 537, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問19", "branch": "ハ", "theme": "日常点検の対象範囲", "question": "（R134a 600t）高圧ガスの製造は、1日に1回以上、その製造設備のうち冷媒設備のみについて異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "×", "law": "冷規第9条第2号", "explanation": "日常点検の対象は冷媒設備のみではなく「製造施設全体」である（誤り）。"}, {"id": 538, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問20", "branch": "イ", "theme": "認定指定設備の変更・移設と認定証返納", "question": "（R134a 600t・設備B）この製造設備に変更の工事を施したとき、又はこの製造設備を移設したときは、指定設備認定証を返納しなければならない場合がある。", "answer": "○", "law": "冷規第62条第1項・第2項", "explanation": "同等部品交換を除く改造工事や、基準適合書のない移設を行った場合は認定証が無効となり、返納しなければならない。"}, {"id": 539, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の自動制御装置", "question": "（R134a 600t・設備B）この製造設備には、自動制御装置が設けられていなければならない。", "answer": "○", "law": "冷規第57条第13号", "explanation": "認定指定設備の構造基準として「自動制御装置を設けること」が義務付けられている。"}, {"id": 540, "subject": "法令", "year": "2022年度(令和4年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の組立場所", "question": "（R134a 600t・設備B）この製造設備の冷媒設備は、使用場所であるこの事業所において、一つの架台上に組み立てられたものである。", "answer": "×", "law": "冷規第57条第3号", "explanation": "指定設備は「製造業者の事業所において」脚上又は一つの架台上に組み立てられたものでなければならない（使用場所において組み立ては誤り）。"}, {"id": 541, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "イ", "theme": "法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、民間事業者による高圧ガスの保安に関する自主的な活動を促進することも定めている。", "answer": "○", "law": "法第1条", "explanation": "法第1条（目的）に明定されている通り、行政による規制と並んで民間事業者及び協会による自主的な保安活動の促進が目的の柱である。"}, {"id": 542, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義", "question": "常用の温度において圧力が0.1メガパスカルとなる液化ガスであって、圧力が0.2メガパスカルとなる温度が35度であるものは、高圧ガスである。", "answer": "○", "law": "法第2条第3号", "explanation": "液化ガスは「圧力が0.2 MPaとなる温度が35℃以下」であれば高圧ガスとなる。35℃で0.2 MPaとなるものは要件を満たすため高圧ガスである。"}, {"id": 543, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問1", "branch": "ハ", "theme": "適用除外", "question": "1日の冷凍能力が5トン未満の冷凍設備内における冷媒ガスである全てのフルオロカーボンは、高圧ガス保安法の適用を受けない。", "answer": "×", "law": "政令第2条第5項第3号・第4号", "explanation": "3トン以上5トン未満で除外されるのは「難燃性・不活性フルオロカーボン等」に限られ、可燃性フルオロカーボン等は除外されないため「全て」は誤り。"}, {"id": 544, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "イ", "theme": "製造許可の能力最小値比較", "question": "冷凍のための設備を使用して高圧ガスの製造をしようとする者が、その製造について都道府県知事等の許可を受けなければならない場合の1日の冷凍能力の最小の値は、冷媒ガスである高圧ガスの種類に関係なく同じである。", "answer": "×", "law": "法第5条第1項第2号、政令第4条", "explanation": "第一種製造者の許可が必要な最小値は、第一種ガス及びアンモニア等は「50トン以上」、上記以外の冷媒ガス（プロパン等）は「20トン以上」であり、冷媒種により異なるため誤り。"}, {"id": 545, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ロ", "theme": "合併による地位承継", "question": "第一種製造者について合併があり、その合併により新たに法人を設立した場合、その法人は第一種製造者の地位を承継する。", "answer": "○", "law": "法第10条第1項", "explanation": "第一種製造者について合併があった場合、合併後存続する法人又は合併により設立された法人は、第一種製造者の地位を承継する。"}, {"id": 546, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問2", "branch": "ハ", "theme": "製造ガス種変更の許可", "question": "第一種製造者は、その製造をする高圧ガスの種類を変更したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第14条第1項", "explanation": "製造する高圧ガスの種類を変更しようとするときは、事後届出ではなく事前に都道府県知事等の「許可」を受けなければならない（誤り）。"}, {"id": 547, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "イ", "theme": "販売事業の事前届出", "question": "容器に充填された冷媒ガス用の高圧ガスの販売の事業を営もうとする者（特に定められたものを除く。）は、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第20条の4第1項", "explanation": "販売事業を営もうとする者は、販売所ごとに事業開始の日の20日前までに知事等に届け出なければならない。"}, {"id": 548, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ロ", "theme": "製造開始・廃止の届出", "question": "第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第21条第1項", "explanation": "第一種製造者は、製造を開始したとき又は廃止したときは、遅滞なく知事等へ届け出なければならない。"}, {"id": 549, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問3", "branch": "ハ", "theme": "機器製造業者の対象冷凍能力", "question": "専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が所定の技術上の基準に従って製造しなければならない機器は、可燃性ガス以外のフルオロカーボンを冷媒ガスとする冷凍機のものにあっては、1日の冷凍能力が20トン以上のものに限られている。", "answer": "×", "law": "法第57条、冷規第63条", "explanation": "不活性フルオロカーボン等の冷凍機で技術基準に従うべきものは「5トン以上」である（「20トン以上」は誤り）。"}, {"id": 550, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の区分", "question": "アンモニアを冷媒ガスとする冷凍設備であって、その1日の冷凍能力が5トンである設備のみを使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条第2項第2号、政令第4条", "explanation": "アンモニアは1日の冷凍能力5トン以上50トン未満が第二種製造者となるため、5トンの設備は第二種製造者に該当する。"}, {"id": 551, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ロ", "theme": "工事完成時の気密試験・試運転", "question": "第二種製造者は、製造設備の設置又は変更の工事が完成したとき、酸素以外のガスを使用する試運転又は許容圧力以上の圧力で行う気密試験を行った後でなければ、製造をしてはならない。", "answer": "○", "law": "法第12条第2項、冷規第14条第1号", "explanation": "工事完成時は、酸素以外のガスによる試運転又は許容圧力以上の気密試験を行わなければ製造してはならない。"}, {"id": 552, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問4", "branch": "ハ", "theme": "第二種製造者の保安検査除外", "question": "アンモニアを冷媒ガスとする1日の冷凍能力が30トンの製造施設は、保安検査を受けなければならない。", "answer": "×", "law": "法第35条第1項", "explanation": "アンモニア30トンの設備は第二種製造者である。保安検査は「第一種製造者の特定施設」に対する検査であり、第二種製造者は受検義務がない（誤り）。"}, {"id": 553, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "イ", "theme": "特定不活性ガスの警戒標掲示", "question": "アンモニアを移動するときは、その車両の見やすい箇所に警戒標を掲げなければならないが、特定不活性ガスであるフルオロカーボン32を移動するときはその定めはない。", "answer": "×", "law": "一般則第50条第1号", "explanation": "警戒標の掲示義務は、特定不活性ガスを含むすべての高圧ガス（一定量以上）に適用される（定めがないは誤り）。"}, {"id": 554, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ロ", "theme": "特定不活性ガスの書面交付・携帯", "question": "アンモニアを移動するときは、そのガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならないが、特定不活性ガスであるフルオロカーボン32を移動するときはその定めはない。", "answer": "×", "law": "一般則第49条第1項第21号、同第50条第14号", "explanation": "イエローカードの交付・携帯・遵守義務は、特定不活性ガス（R32等）の移動時にも適用される（定めがないは誤り）。"}, {"id": 555, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問5", "branch": "ハ", "theme": "木枠・パッキンの適用", "question": "アンモニアを移動するときは、その容器に木枠又はパッキンを施す必要があるが、特定不活性ガスであるフルオロカーボン32を移動するときはその定めはない。", "answer": "○", "law": "一般則第50条第8号", "explanation": "木枠又はパッキンの施工義務は「毒性ガス」に限定されており、特定不活性ガス（R32）には適用されないため正。"}, {"id": 556, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "イ", "theme": "液化ガス充填質量算定式", "question": "容器に充填することができる液化ガスの質量は、その容器の内容積を容器保安規則で定められた数値で除して得られた質量以下と定められている。", "answer": "○", "law": "法第48条第4項第1号、容規第22条", "explanation": "液化ガスの充填質量は G = V / C （内容積Vを定数Cで除した値）以下と定められている。"}, {"id": 557, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ロ", "theme": "バルブ刻印事項", "question": "附属品検査に合格したバルブには、そのバルブが装置されるべき容器の内容積を示す記号の刻印がされている。", "answer": "×", "law": "法第49条の3、容規第18条第1項", "explanation": "バルブに刻印されるのは「装置されるべき容器の“種類”」等であり、「内容積を示す記号」は規定されていない（誤り）。"}, {"id": 558, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問6", "branch": "ハ", "theme": "不合格容器のくず化処分", "question": "容器の所有者は、容器再検査に合格しなかった容器について所定の期間内に所定の刻印等がされなかったときは、遅滞なく、これをくず化し、その他容器として使用することができないように処分しなければならない。", "answer": "○", "law": "法第56条第3項", "explanation": "容器再検査に不合格となった容器について3月以内に刻印等されないときは、遅滞なくくず化等の処分を行わなければならない。"}, {"id": 559, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "イ", "theme": "充填容器の温度管理", "question": "液化アンモニアを充填した容器を貯蔵する場合、その容器は常に温度40度以下に保たなければならないが、液化フルオロカーボンを充填した容器は、常に温度40度以下に保つべき定めはない。", "answer": "×", "law": "一般則第6条第2項第8号ホ", "explanation": "充填容器等を常に温度40℃以下に保つ義務は、すべての高圧ガスに適用される（フルオロカーボンが除外されるわけではないため誤り）。"}, {"id": 560, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ロ", "theme": "可燃性・毒性ガスの通風貯蔵", "question": "可燃性ガス又は毒性ガスの充填容器及び残ガス容器の貯蔵は、通風の良い場所でしなければならない。", "answer": "○", "law": "一般則第18条第2号イ", "explanation": "可燃性ガス又は毒性ガスの充填容器等は、漏えい時の滞留を防ぐため通風の良い場所で貯蔵しなければならない。"}, {"id": 561, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問7", "branch": "ハ", "theme": "車両積載容器貯蔵の原則禁止", "question": "車両に固定した容器により高圧ガスを貯蔵することは禁じられているが、車両に積載した容器により高圧ガスを貯蔵することはいかなる場合でも禁じられていない。", "answer": "×", "law": "一般則第18条第2号ホ", "explanation": "原則として、車両に「固定し、又は積載した容器」による貯蔵は禁じられている（禁じられていないは誤り）。"}, {"id": 562, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定式", "question": "蒸発器を通過する冷水の温度差の数値は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第1号", "explanation": "遠心式圧縮機の算定に必要なのは「原動機定格出力（W）」であり、冷水温度差の数値は不要である（誤り）。"}, {"id": 563, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ロ", "theme": "回転ピストン型の算定式", "question": "冷媒ガスの種類に応じて定められた数値（C）は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第4号", "explanation": "回転ピストン型圧縮機の算定式は R = V / C であり、冷媒種に応じた数値Cが必要である。"}, {"id": 564, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問8", "branch": "ハ", "theme": "回転ピストン型の算定式", "question": "圧縮機の気筒の内径の数値は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第4号", "explanation": "押しのけ量Vの算出式 V = 60 * 0.785 * t * n * (D^2 - d^2) において、気筒内径Dの数値が必要である。"}, {"id": 565, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の遵守対象", "question": "（アンモニア250t）この事業者は、危害予防規程を定め、これを都道府県知事等に届け出なければならない。また、この危害予防規程を守るべき者は、この事業所の冷凍保安責任者と従業者のみである。", "answer": "×", "law": "法第26条第3項", "explanation": "危害予防規程を守るべき者は「第一種製造者（事業者本人）及びその従業者」である（責任者と従業者のみとし事業者を外す記述は誤り）。"}, {"id": 566, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ロ", "theme": "保安教育計画の届出不要", "question": "（アンモニア250t）この事業者は、その従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その計画を都道府県知事等に届け出る必要はない。", "answer": "○", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務だが、計画そのものを知事等へ届け出る義務はないため正。"}, {"id": 567, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問9", "branch": "ハ", "theme": "容器盗難時の届出義務", "question": "（アンモニア250t）この事業者は、その占有する液化アンモニアの充填容器を盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。", "answer": "○", "law": "法第63条第1項第2号", "explanation": "占有する容器を喪失し、又は盗まれたときは遅滞なく知事等又は警察官に届け出なければならない。"}, {"id": 568, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "イ", "theme": "承諾なき発火物携帯立入の禁止", "question": "（アンモニア250t）この事業者がこの事業所において指定する場所では、何人も、その事業者の承諾を得ないで、発火しやすい物を携帯してその場所に立ち入ってはならない。", "answer": "○", "law": "法第37条第2項", "explanation": "指定場所には、事業者の承諾を得ないで発火しやすい物を携帯して立ち入ることは何人も禁止されている。"}, {"id": 569, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ロ", "theme": "指定場所の火気制限", "question": "（アンモニア250t）この事業者がこの事業所において指定する場所では、その事業所の従業者を除き、何人も火気を取り扱ってはならない。", "answer": "×", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、自社の従業者であっても例外なく禁止される（除きは誤り）。"}, {"id": 570, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問10", "branch": "ハ", "theme": "異常時記録の保存起算日", "question": "（アンモニア250t）この事業者は、事業所ごとに帳簿を備え、製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載しなければならない。また、その帳簿は製造開始の日から10年間保存しなければならない。", "answer": "×", "law": "法第60条第1項、冷規第65条", "explanation": "帳簿の保存期間10年の起算日は「製造開始の日」ではなく「記載の日」からである（誤り）。"}, {"id": 571, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "イ", "theme": "配管取替の軽微変更除外", "question": "（アンモニア250t）この冷媒設備の凝縮器と受液器とをつなぐ配管の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものは、軽微な変更の工事に該当する。", "answer": "×", "law": "冷規第17条第1項第2号", "explanation": "アンモニア設備は軽微な変更工事から除外されているため、切断溶接や能力変更がなくても軽微変更には該当しない（誤り）。"}, {"id": 572, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ロ", "theme": "圧縮機取替の完成検査不要除外", "question": "（アンモニア250t）この冷媒設備の圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなければならないが、その変更の工事の完成後、その製造施設の完成検査を受けることなく使用することができる。", "answer": "×", "law": "法第20条第3項、冷規第23条", "explanation": "アンモニア設備は完成検査不要工事の特例から除外されているため、完成検査合格前には使用できない（誤り）。"}, {"id": 573, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問11", "branch": "ハ", "theme": "特定変更工事としての完成検査義務", "question": "（アンモニア250t）この冷媒設備の受液器の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であっても、完成検査を受けなければならない特定変更工事である。", "answer": "○", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "アンモニア設備は軽微変更にも完成検査不要にも該当しないため、切断溶接がなくても特定変更工事として完成検査受検が必須である。"}, {"id": 574, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "イ", "theme": "機械室の滞留防止構造対象", "question": "（アンモニア250t）製造設備を設置する室のうち、冷媒ガスであるアンモニアが漏えいしたとき滞留しないような構造としなければならない室は、圧縮機、油分離器、凝縮器を設置する室に限られている。", "answer": "×", "law": "冷規第7条第1項第3号", "explanation": "受液器やこれらの間の配管を設置する室も対象に含まれるため、「限られている」は誤り。"}, {"id": 575, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ロ", "theme": "受液器流出防止措置の容量基準", "question": "（アンモニア250t）この受液器は、その周囲に冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならないものに該当しない。", "answer": "○", "law": "冷規第7条第1項第13号", "explanation": "流出防止措置（防液堤等）が必要な受液器は内容積10,000 L以上。本問は6,000 Lのため義務付けられない（該当しないは正）。"}, {"id": 576, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問12", "branch": "ハ", "theme": "耐震設計の該当性", "question": "（アンモニア250t）この凝縮器は、所定の耐震に関する性能を有するものとしなければならないものに該当しないが、この受液器は、それに該当する。", "answer": "○", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上で該当する。凝縮器は「縦置円筒形で胴長5m以上」が対象であり、横置円筒形の本凝縮器は該当しないため正。"}, {"id": 577, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "イ", "theme": "消火設備の設置義務", "question": "（アンモニア250t）この製造施設は、消火設備を設けなければならないものに該当する。", "answer": "○", "law": "冷規第7条第1項第12号", "explanation": "アンモニアは可燃性ガスであるため、規模に応じた消火設備の設置が義務付けられている。"}, {"id": 578, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ロ", "theme": "防爆構造電気設備の除外", "question": "（アンモニア250t）この製造施設の冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものでなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第14号", "explanation": "防爆構造義務は「可燃性ガス（アンモニアを除く。）」と規定されており、アンモニア設備は除外されている（誤り）。"}, {"id": 579, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問13", "branch": "ハ", "theme": "漏えい検知警報設備の設置義務", "question": "（アンモニア250t）この製造施設は、その施設から漏えいするガスが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならないものに該当する。", "answer": "○", "law": "冷規第7条第1項第15号", "explanation": "可燃性・毒性のアンモニア製造施設には、漏えい検知警報設備の設置が義務付けられている。"}, {"id": 580, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "イ", "theme": "全設備認定指定設備時の第二種移行", "question": "（R134a 600t）認定指定設備でない製造設備Aを認定指定設備に取り替えて、全ての製造設備が認定指定設備となった場合は、この事業者は第二種製造者となる。", "answer": "○", "law": "法第5条第1項第2号、法第35条の2", "explanation": "すべての設備が認定指定設備となった場合、冷凍能力に関わらず第一種製造者（許可）から除外され第二種製造者となる。"}, {"id": 581, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ロ", "theme": "代理者の事前選任義務", "question": "（R134a 600t）選任した冷凍保安責任者が旅行、疾病その他の事故によってその職務を行うことができなくなったときは、遅滞なく、高圧ガスの製造に関する所定の経験を有する者のうちから代理者を選任し、その職務を代行させなければならない。", "answer": "×", "law": "法第33条第1項", "explanation": "代理者は事故発生時に遅滞なく選任するのではなく、「あらかじめ」選任しておかなければならない（誤り）。"}, {"id": 582, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者の免状要件", "question": "（R134a 600t）この事業所の冷凍保安責任者に選任することができる者が交付を受けている製造保安責任者免状は、第一種冷凍機械責任者免状に限られている。", "answer": "○", "law": "冷規第36条第1項", "explanation": "設備A（300トン）で判定するため、300トン以上の設備は「第一種冷凍機械責任者免状」の所持者に限られる。"}, {"id": 583, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "イ", "theme": "圧縮機取替の軽微変更届", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものは、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で切断溶接なし・能力変更なしの取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 584, "subject": "法令", "year": "2021年度(令和3年)", "q_num": "問15", "branch": "ロ", "theme": "認定指定設備増設の軽微変更届", "question": "（R134a 600t）この製造施設に認定指定設備である製造設備Cを増設し、製造設備A及び製造設備Bとブラインを共通にするときは、軽微な変更の工事 function recordAnswerToTheme(theme, isCorrect) {
  if (!theme || theme === 'nan') return;
  if (!themeStats[theme]) {
    themeStats[theme] = { correct: 0, total: 0 };
  }
  themeStats[theme].total += 1;
  if (isCorrect) {
    themeStats[theme].correct += 1;
  }
  saveThemeStats();
}

      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      select.appendChild(opt);
    }
  });
}

  currentList = list;
  currentIndex = 0;
  correctCount = 0;
  incorrectCount = 0;
  renderQuestion();
}

function renderQuestion() {
  if (currentList.length === 0) {
    document.getElementById('questionText').textContent = '該当する問題がありません（フィルター条件を確認してください）。';
    document.getElementById('btnMaru').disabled = true;
    document.getElementById('btnBatsu').disabled = true;
    document.getElementById('explanationBox').style.display = 'none';
    updateStats();
    return;
  }
  const q = currentList[currentIndex];
  document.getElementById('badgeSub').textContent = q.subject;
  document.getElementById('badgeYear').textContent = q.year;
  document.getElementById('badgeNum').textContent = q.q_num + ' 肢' + q.branch;
  document.getElementById('badgeTheme').textContent = q.theme;
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('btnMaru').disabled = false;
  document.getElementById('btnBatsu').disabled = false;
  document.getElementById('actionButtons').style.display = 'grid';
  document.getElementById('explanationBox').style.display = 'none';
  updateStats();
}

function checkAnswer(userChoice) {
  const q = currentList[currentIndex];
  const isCorrect = (userChoice === q.answer);
  
  recordAnswerToTheme(q.theme, isCorrect);

  document.getElementById('btnMaru').disabled = true;
  document.getElementById('btnBatsu').disabled = true;
  const expBox = document.getElementById('explanationBox');
  const resultTitle = document.getElementById('resultTitle');
  const lawTag = document.getElementById('lawTag');
  const expText = document.getElementById('expText');
  expBox.className = 'explanation-box ' + (isCorrect ? 'correct' : 'incorrect');
  resultTitle.className = 'result-title ' + (isCorrect ? 'correct' : 'incorrect');
  if (isCorrect) {
    correctCount++;
    resultTitle.innerHTML = '⭕ 正解！（正答：' + q.answer + '）';
    if (wrongIds.has(q.id)) { wrongIds.delete(q.id); saveWrongIds(); }
  } else {
    incorrectCount++;
    resultTitle.innerHTML = '❌ 不正解...（正答：' + q.answer + '）';
    wrongIds.add(q.id);
    saveWrongIds();
  }
  lawTag.textContent = q.law;
  expText.textContent = q.explanation;
  expBox.style.display = 'block';
  expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  updateStats();
}

function nextQuestion() {
  if (currentIndex + 1 < currentList.length) {
    currentIndex++;
    renderQuestion();
  } else {
    alert('全問終了しました！\n正解数: ' + correctCount + ' / ' + currentList.length + ' 問\n正解率: ' + Math.round((correctCount / currentList.length) * 100) + '%');
    currentIndex = 0;
    renderQuestion();
  }
}

function updateStats() {
  const total = currentList.length;
  const currentNum = total > 0 ? currentIndex + 1 : 0;
  document.getElementById('currentIdxText').textContent = currentNum + ' / ' + total + ' 問 (要復習: ' + wrongIds.size + '問)';
  const answered = correctCount + incorrectCount;
  const rate = answered > 0 ? Math.round((correctCount / answered) * 100) : 0;
  document.getElementById('scoreText').textContent = '正解率: ' + rate + '% (正: ' + correctCount + ' / 誤: ' + incorrectCount + ')';
  const progress = total > 0 ? ((currentIndex) / total) * 100 : 0;
  document.getElementById('progressFill').style.width = progress + '%';
}

function openStatsModal() {
  const body = document.getElementById('statsModalBody');
  body.innerHTML = '';
  
  const themes = [...new Set(allQuestions.map(q => q.theme))].filter(t => t && t !== 'nan').sort();
  
  if (themes.length === 0) {
    body.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">まだ回答データがありません。</p>';
  } else {
    themes.forEach(t => {
      const stat = themeStats[t] || { correct: 0, total: 0 };
      const rate = stat.total > 0 ? Math.round((stat.correct / stat.total) * 100) : 0;
      
      const item = document.createElement('div');
      item.className = 'stat-item';
      item.innerHTML = `
        <div class="stat-theme-name">${t}</div>
        <div class="stat-detail">${stat.correct}/${stat.total}問</div>
        <div class="stat-rate">${stat.total > 0 ? rate + '%' : '-'}</div>
      `;
      body.appendChild(item);
    });
  }
  document.getElementById('statsModal').style.display = 'flex';
}

function closeStatsModal() {
  document.getElementById('statsModal').style.display = 'none';
}

function resetStats() {
  if (confirm('間違えた問題の履歴と分類別の正答率データをすべてリセットしますか？')) {
    wrongIds.clear();
    themeStats = {};
    try {
      localStorage.removeItem('1cold_wrong_horei');
      localStorage.removeItem('1cold_theme_stats_horei');
    } catch (e) {}
    correctCount = 0;
    incorrectCount = 0;
    currentIndex = 0;
    renderQuestion();
    alert('リセットしました。');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initThemes();
  applyFilters();
});
</script>
</body>
</html>
