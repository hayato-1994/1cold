<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>第1種冷凍：法令 一問一答 - 第1種冷凍機械責任者</title>
<style>
  :root {
    --primary: #1e3a8a; --primary-light: #2563eb; --bg: #f8fafc; --card-bg: #ffffff;
    --text: #0f172a; --text-muted: #64748b; --correct: #059669; --correct-bg: #ecfdf5;
    --correct-border: #6ee7b7; --incorrect: #dc2626; --incorrect-bg: #fef2f2;
    --incorrect-border: #fca5a5; --border: #e2e8f0; --maru-color: #1d4ed8; --batsu-color: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 16px) 12px; min-height: 100vh; display: flex; flex-direction: column; touch-action: manipulation; }
  .container { max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; flex: 1; }
  header { background: var(--card-bg); padding: 14px 16px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 12px; }
  .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  h1 { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
  .btn-group { display: flex; gap: 6px; }
  .btn-action-sm { font-size: 0.72rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .btn-reset { color: #dc2626; border: 1px solid #fecaca; background: #fff; }
  .btn-stats { color: var(--primary); border: 1px solid #bfdbfe; background: #eff6ff; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .filters-full { grid-column: span 2; margin-bottom: 8px; }
  select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.82rem; background: #fff; font-weight: 600; color: var(--text); }
  .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 100%; background: var(--primary-light); width: 0%; transition: width 0.2s ease; }
  .stats-row { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--text-muted); font-weight: 500; }
  .card { background: var(--card-bg); border-radius: 16px; padding: 18px 16px; box-shadow: 0 3px 12px rgba(0,0,0,0.05); flex: 1; display: flex; flex-direction: column; position: relative; }
  .badge-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .badge { font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
  .badge-sub { background: #e0e7ff; color: #3730a3; }
  .badge-year { background: #dbeafe; color: #1d4ed8; }
  .badge-num { background: #f1f5f9; color: #475569; }
  .badge-theme { background: #fef3c7; color: #92400e; }
  .question-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 16px; }
  .question-text { font-size: 1.02rem; line-height: 1.68; color: #1e293b; font-weight: 500; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; padding-bottom: 4px; }
  .btn-answer { min-height: 64px; font-size: 1.35rem; font-weight: 800; border-radius: 14px; border: 2px solid var(--border); background: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-answer.maru { color: var(--maru-color); border-color: #bfdbfe; }
  .btn-answer.batsu { color: var(--batsu-color); border-color: #fecaca; }
  .btn-answer:disabled { opacity: 0.45; cursor: default; }
  .explanation-box { margin-top: 14px; padding: 14px; border-radius: 12px; display: none; }
  .explanation-box.correct { background: var(--correct-bg); border: 1.5px solid var(--correct-border); }
  .explanation-box.incorrect { background: var(--incorrect-bg); border: 1.5px solid var(--incorrect-border); }
  .result-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
  .result-title.correct { color: var(--correct); }
  .result-title.incorrect { color: var(--incorrect); }
  .law-tag { display: inline-block; font-size: 0.75rem; font-weight: 700; background: #ffffff; padding: 2px 7px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); margin-bottom: 8px; color: #334155; }
  .exp-text { font-size: 0.9rem; line-height: 1.6; color: #1e293b; margin-bottom: 12px; }
  .btn-next { width: 100%; min-height: 48px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 0.98rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
  .modal-content { background: #fff; border-radius: 16px; width: 100%; max-width: 500px; max-height: 80vh; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .modal-header h2 { font-size: 1rem; color: var(--primary); font-weight: 700; }
  .btn-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }
  .modal-body { overflow-y: auto; flex: 1; }
  .stat-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }
  .stat-theme-name { font-weight: 600; color: #1e293b; flex: 1; padding-right: 8px; }
  .stat-rate { font-weight: 700; color: var(--primary); min-width: 50px; text-align: right; }
  .stat-detail { font-size: 0.75rem; color: var(--text-muted); min-width: 60px; text-align: right; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="title-row">
      <h1>第1種冷凍：法令 一問一答</h1>
      <div class="btn-group">
        <button class="btn-action-sm btn-stats" onclick="openStatsModal()">📊 テーマ別成績</button>
        <button class="btn-action-sm btn-reset" onclick="resetStats()">リセット</button>
      </div>
    </div>
    <div class="filters">
      <select id="yearFilter" onchange="applyFilters()">
        <option value="ALL">全年度</option>
        <option value="2025年度(令和7年)">2025年度</option>
        <option value="2024年度(令和6年)">2024年度</option>
        <option value="2023年度(令和5年)">2023年度</option>
        <option value="2022年度(令和4年)">2022年度</option>
        <option value="2021年度(令和3年)">2021年度</option>
        <option value="2020年度(令和2年)">2020年度</option>
        <option value="2019年度(令和元年)">2019年度</option>
        <option value="2018年度(平成30年)">2018年度</option>
        <option value="2017年度(平成29年)">2017年度</option>
        <option value="2016年度(平成28年)">2016年度</option>
      </select>
      <select id="orderFilter" onchange="applyFilters()">
        <option value="sequential">出題順</option>
        <option value="random">シャッフル</option>
        <option value="wrongOnly">要復習のみ</option>
      </select>
      <div class="filters-full">
        <select id="themeFilter" onchange="applyFilters()">
          <option value="ALL">すべての分類（大まかなテーマ）</option>
        </select>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats-row">
      <span id="currentIdxText">0 / 0 問</span>
      <span id="scoreText">正解率: 0%</span>
    </div>
  </header>
  <div class="card" id="quizCard">
    <div class="badge-row">
      <span class="badge badge-sub" id="badgeSub">科目</span>
      <span class="badge badge-year" id="badgeYear">年度</span>
      <span class="badge badge-num" id="badgeNum">問題番号</span>
      <span class="badge badge-theme" id="badgeTheme">出題テーマ</span>
    </div>
    <div class="question-scroll">
      <div class="question-text" id="questionText">読み込み中...</div>
    </div>
    <div class="actions" id="actionButtons">
      <button class="btn-answer maru" id="btnMaru" onclick="checkAnswer('○')">○ 正しい</button>
      <button class="btn-answer batsu" id="btnBatsu" onclick="checkAnswer('×')">× 誤り</button>
    </div>
    <div class="explanation-box" id="explanationBox">
      <div class="result-title" id="resultTitle"></div>
      <div class="law-tag" id="lawTag"></div>
      <div class="exp-text" id="expText"></div>
      <button class="btn-next" onclick="nextQuestion()">次の問題へ ▶</button>
    </div>
  </div>
</div>

<div class="modal" id="statsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📊 分類別正答率一覧</h2>
      <button class="btn-close" onclick="closeStatsModal()">✕</button>
    </div>
    <div class="modal-body" id="statsModalBody"></div>
  </div>
</div>

<script>
const allQuestions = [{"id": 1, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "イ", "theme": "高圧ガスの定義", "question": "常用の温度において圧力が1.1メガパスカルとなる圧縮ガス（圧縮アセチレンガスを除く）であって、現にその圧力が1.0メガパスカルであるものは、温度35度における圧力が0.8メガパスカルであっても、高圧ガスである。", "answer": "○", "law": "法第2条第1号", "explanation": "圧縮ガスは「常用で1 MPa以上かつ現に1 MPa以上」または「35度で1 MPa以上」のいずれかを満たせば高圧ガスとなる。常用1.1 MPa・現に1.0 MPaで条件を満たす。"}, {"id": 2, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義", "question": "圧力が0.2メガパスカルとなる場合の温度が30度である液化ガスであって、常用の温度において圧力が0.15メガパスカルであるものは、高圧ガスではない。", "answer": "×", "law": "法第2条第3号", "explanation": "液化ガスは「圧力が0.2 MPaとなる温度が35度以下」であれば高圧ガスとなる。30度は35度以下であるため高圧ガスに該当する（誤り）。"}, {"id": 3, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問1", "branch": "ハ", "theme": "法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のため、高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することも定めている。", "answer": "○", "law": "法第1条", "explanation": "行政による規制と並んで「民間事業者及び高圧ガス保安協会による自主的な保安活動の促進」が目的として明記されている。"}, {"id": 4, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "イ", "theme": "適用除外", "question": "1日の冷凍能力が3トン未満の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず、高圧ガス保安法の適用を受けない。", "answer": "○", "law": "法第3条第1項第8号、令第2条第3項第3号", "explanation": "冷凍能力が3トン未満の冷凍設備内の高圧ガスは、冷媒ガスの種類にかかわらずすべて適用除外となる。"}, {"id": 5, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ロ", "theme": "製造許可・指定設備", "question": "1日の冷凍能力が50トン以上である認定指定設備のみを使用して冷凍のため高圧ガスの製造をしようとする者は、都道府県知事等の許可を受けなくてよい。", "answer": "○", "law": "法第5条第1項第2号、令第4条", "explanation": "認定指定設備のみを用いる場合は第一種製造者（許可）から除外され、第二種製造者（開始20日前までの届出）となるため許可不要。"}, {"id": 6, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問2", "branch": "ハ", "theme": "軽微な変更の工事", "question": "第一種製造者は、製造施設の位置、構造又は設備について定められた軽微な変更の工事をしようとするときは、都道府県知事等の許可を受けなくてよいが、工事開始の日の20日前までにその旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第14条第1項・第2項", "explanation": "軽微な変更工事は許可不要だが、届出は事前（20日前）ではなく「工事完成後遅滞なく」行う（誤り）。"}, {"id": 7, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "イ", "theme": "製造者の区分", "question": "製造をする高圧ガスの種類がフルオロカーボン（不活性のものに限る。）である場合、1日の冷凍能力が20トン以上50トン未満である冷凍設備を使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条、法第10条の2、令第4条", "explanation": "不活性フルオロカーボンは50トン以上が第一種製造者、20トン以上50トン未満が第二種製造者となる。"}, {"id": 8, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ロ", "theme": "地位の承継", "question": "第一種製造者がその高圧ガスの製造事業の全部を譲り渡したときは、その事業の全部を譲り受けた者はその第一種製造者の地位を承継する。", "answer": "×", "law": "法第10条、法第20条第2項", "explanation": "事業譲渡による第一種製造者の地位承継規定はない。譲受人は新規に製造許可（法第5条第1項）を取得する必要がある（誤り）。"}, {"id": 9, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問3", "branch": "ハ", "theme": "機器製造業者", "question": "専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が所定の技術上の基準に従って製造しなければならない機器は、可燃性ガス以外のフルオロカーボンを冷媒ガスとする冷凍機のものにあっては、1日の冷凍能力が20トン以上のものに限られる。", "answer": "×", "law": "法第57条、冷規第63条", "explanation": "可燃性ガス以外のフルオロカーボン等を冷媒とする機器で技術基準に従うべきものは「5トン以上」である（「20トン以上」は誤り）。"}, {"id": 10, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の届出", "question": "冷凍設備（認定指定設備を除く。）を使用して高圧ガスの製造をしようとする者が、その旨を都道府県知事等に届け出なければならない場合の1日の冷凍能力の最小の値は、その冷媒ガスの種類がフルオロカーボン（不活性のものに限る。）とアンモニアとでは異なる。", "answer": "○", "law": "法第5条第2項第2号、令第4条", "explanation": "届出を要する冷凍能力の最小値は、不活性フルオロカーボンが20トン以上、アンモニアが5トン以上で異なる。"}, {"id": 11, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ロ", "theme": "定期自主検査記録", "question": "冷凍のため製造をする第二種製造者が定期自主検査を実施しなければならない冷凍設備において、定期自主検査の検査記録に記載すべき事項の一つに「検査をした製造施設の設備ごとの検査方法及び結果」がある。", "answer": "○", "law": "法第35条の2、冷規第44条第5項第2号", "explanation": "検査記録の法定記載事項に「設備ごとの検査方法及び結果」が明記されている。"}, {"id": 12, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問4", "branch": "ハ", "theme": "製造方法の基準", "question": "第二種製造者が従うべき製造の方法に係る技術上の基準は、定められていない。", "answer": "×", "law": "法第12条第2項、冷規第14条", "explanation": "第二種製造者にも製造方法に係る技術上の基準が明確に定められている（誤り）。"}, {"id": 13, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "イ", "theme": "車両移動", "question": "（車両積載48L容器）不活性ガスである液化フルオロカーボン134aを移動するときは、液化アンモニアを移動するときと同様に、その車両の見やすい箇所に警戒標を掲げなければならない。", "answer": "○", "law": "法第23条第2項、一般則第50条第1号", "explanation": "警戒標の掲示義務は、不活性ガスを含むすべての高圧ガス充填容器等の車両移動に適用される。"}, {"id": 14, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ロ", "theme": "車両移動", "question": "（車両積載48L容器）液化アンモニアを移動するときは、その充填容器及び残ガス容器には木枠又はパッキンを施さなければならない。", "answer": "○", "law": "一般則第50条第8号", "explanation": "毒性ガス（アンモニア等）の充填容器等（充填容器及び残ガス容器）には木枠又はパッキンを施さなければならない。"}, {"id": 15, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問5", "branch": "ハ", "theme": "車両移動", "question": "（車両積載48L容器）特定不活性ガスである液化フルオロカーボン32を移動するときは、消火設備並びに災害発生防止のための応急措置に必要な資材及び工具等を携行しなければならない。", "answer": "○", "law": "一般則第50条第9号", "explanation": "特定不活性ガス（R32等）や可燃性ガスの移動時は、消火設備および応急措置用資材・工具の携行が必要。"}, {"id": 16, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "イ", "theme": "容器の刻印記号", "question": "容器検査に合格した容器に刻印されている「TP2.9M」は、その容器の最高充填圧力が2.9メガパスカルであることを表している。", "answer": "×", "law": "容則第8条第1項第11号・第12号", "explanation": "「TP」は耐圧試験圧力（Test Pressure）。最高充填圧力（Filling Pressure）を表す記号は「FP」である（誤り）。"}, {"id": 17, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ロ", "theme": "容器の塗色面積", "question": "容器に充填する高圧ガスの種類に応じた塗色を行わなければならない場合、その容器の外面の見やすい箇所に、その表面積の2分の1以上について行わなければならない。", "answer": "○", "law": "法第46条第1項、容則第10条第1項第1号", "explanation": "外面塗色は、見やすい箇所に表面積の2分の1以上施さなければならない。"}, {"id": 18, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問6", "branch": "ハ", "theme": "容器再検査期間", "question": "液化フルオロカーボンを充填する溶接容器の容器再検査の期間は、その容器の製造後の経過年数に応じて定められている。", "answer": "○", "law": "法第48条第1項第5号、容則第24条第1項第1号", "explanation": "溶接容器は製造後20年未満は5年、20年以上は2年と、経過年数に応じて規定されている。"}, {"id": 19, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "イ", "theme": "貯蔵基準の適用", "question": "（補充用容器の貯蔵）貯蔵の方法に係る技術上の基準に従って貯蔵しなければならない液化ガスは、質量が1.5キログラムを超えるものである。", "answer": "○", "law": "法第15条第1項、一般則第19条第1項・第2項", "explanation": "適用除外は容積0.15 m3以下。液化ガスは10 kg＝1 m3換算のため0.15 m3＝1.5 kg。したがって1.5 kg超は基準に従う必要がある。"}, {"id": 20, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ロ", "theme": "貯蔵場所の通風", "question": "（補充用容器の貯蔵）通風の良い場所で貯蔵しなければならない充填容器（高圧ガスの質量が50キログラムのもの）は、可燃性ガスのものに限られる。", "answer": "×", "law": "一般則第18条第2号イ", "explanation": "通風の良い場所で貯蔵すべき充填容器は「可燃性ガス又は毒性ガス」である（「可燃性ガスに限られる」は誤り）。"}, {"id": 21, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問7", "branch": "ハ", "theme": "貯蔵温度制限", "question": "（補充用容器の貯蔵）液化アンモニア（質量が50キログラムのもの）の充填容器の貯蔵は、常に温度50度以下に保って行わなければならない。", "answer": "×", "law": "一般則第6条第2項第8号ホ", "explanation": "充填容器等は常に「温度40度以下」に保たなければならない（「50度以下」は誤り）。"}, {"id": 22, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定式", "question": "容積圧縮式（往復動式）圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値として、「冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値（C）」がある。", "answer": "○", "law": "冷規第5条第4号", "explanation": "容積圧縮式設備の算定式は R = V / C であり、冷媒ガスの種類に応じた数値Cが必要である。"}, {"id": 23, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍能力算定式", "question": "容積圧縮式（往復動式）圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値として、「圧縮機の原動機の定格出力の数値（W）」がある。", "answer": "×", "law": "冷規第5条第1号", "explanation": "定格出力Wを用いるのは「遠心式圧縮機」（第1号設備：R = W × C）である（誤り）。"}, {"id": 24, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍能力算定式", "question": "容積圧縮式（往復動式）圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値として、「蒸発器の冷媒ガスに接する側の表面積の数値（A）」がある。", "answer": "×", "law": "冷規第5条第3号", "explanation": "蒸発器表面積Aを用いるのは「自然還流式・自然循環式設備」（第3号設備：R = A / C）である（誤り）。"}, {"id": 25, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "イ", "theme": "火気取扱規制", "question": "（アンモニア250t）この事業者がこの事業所内において指定した場所では、その事業所に選任された冷凍保安責任者を除き、何人も火気を取り扱ってはならない。", "answer": "×", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」であり、冷凍保安責任者であっても例外なく禁止される（誤り）。"}, {"id": 26, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ロ", "theme": "危害予防規程", "question": "（アンモニア250t）この事業者は、危害予防規程を定め、これを都道府県知事等に届け出なければならない。また、この危害予防規程を守るべき者は、この事業者及びその従業者であると定められている。", "answer": "○", "law": "法第26条第1項・第3項", "explanation": "アンモニア・250トンの第一種製造者は危害予防規程の届出義務があり、事業者及び全従業者に遵守義務がある。"}, {"id": 27, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問9", "branch": "ハ", "theme": "危険時の応急措置", "question": "（アンモニア250t）この事業者は、この製造施設が危険な状態となったときは、直ちに、所定の応急の措置を講じなければならない。", "answer": "○", "law": "法第36条第1項", "explanation": "製造施設が危険な状態となったときは、所有者・占有者は直ちに応急措置を講じなければならない。"}, {"id": 28, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "イ", "theme": "帳簿の保存期間", "question": "（アンモニア250t）平成27年（2015年）11月1日に製造施設に異常があったので、その年月日及びそれに対してとった措置を帳簿に記載し、これを保存していたが、その後その製造施設に異常がなかったので、令和2年（2020年）11月1日にその帳簿を廃棄した。", "answer": "×", "law": "法第60条第1項、冷規第65条", "explanation": "異常時記録帳簿の保存期間は「10年間」。2015年記載なら2025年まで保存義務があり、5年での廃棄は違法（誤り）。"}, {"id": 29, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ロ", "theme": "事故届出義務", "question": "（アンモニア250t）この製造施設の高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。", "answer": "○", "law": "法第63条第1項第1号", "explanation": "災害事故発生時は、遅滞なく都道府県知事等又は警察官に届け出なければならない。"}, {"id": 30, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問10", "branch": "ハ", "theme": "保安教育計画", "question": "（アンモニア250t）その従業者に対する保安教育を随時実施していれば、保安教育計画は定めなくてよい。", "answer": "×", "law": "法第27条第1項・第3項", "explanation": "第一種製造者は「保安教育計画」を必ず策定し、忠実に実行する義務がある。策定省略は不可（誤り）。"}, {"id": 31, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "イ", "theme": "軽微な変更工事", "question": "（アンモニア250t）この製造施設の冷媒設備の圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであっても、定められた軽微な変更の工事には該当しない。", "answer": "○", "law": "法第14条第1項、冷規第17条第1項第2号", "explanation": "毒性・可燃性のアンモニア設備は軽微な変更の対象から除外されているため、切断・溶接や能力変更がなくても軽微な変更に該当しない。"}, {"id": 32, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ロ", "theme": "施設譲渡と完成検査", "question": "（アンモニア250t）既に完成検査を受け所定の技術上の基準に適合していると認められているこの製造施設の全部の引渡しがあった場合、その引渡しを受けた者は、都道府県知事等の許可を受けたのち、都道府県知事等又は高圧ガス保安協会若しくは指定完成検査機関が行う完成検査を受けることなく、この製造施設を使用することができる。", "answer": "○", "law": "法第20条第2項", "explanation": "すでに完成検査に合格している施設の引渡しを受けて製造許可を受けた者は、改めて完成検査を受けることなく使用できる。"}, {"id": 33, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問11", "branch": "ハ", "theme": "特定変更工事検査", "question": "（アンモニア250t）この製造施設の冷媒設備の凝縮器の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事をしようとするときは、都道府県知事等の許可をうけなければならないが、その変更の工事の完成検査は受ける必要はない。", "answer": "×", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "アンモニア設備の取替えは「特定変更工事」に該当するため、知事等の許可と工事後の完成検査合格が必須（誤り）。"}, {"id": 34, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "イ", "theme": "安全弁放出管", "question": "（アンモニア250t）この冷媒設備の安全弁（大気に冷媒ガスを放出することのないものを除く）には、放出管を設けなければならない。また、放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。", "answer": "○", "law": "冷規第7条第1項第9号", "explanation": "大気放出型の安全弁には放出管を設け、冷媒の性質（毒性等）に応じた適切な位置に開口部を配置しなければならない。"}, {"id": 35, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ロ", "theme": "受液器の液面計", "question": "（アンモニア250t）この受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計に破損を防止するための措置か、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置のいずれか一方の措置を講じることと定められている。", "answer": "×", "law": "冷規第7条第1項第10号・第11号", "explanation": "アンモニア受液器では、丸形以外の液面計とし、「破損防止措置」と「自動閉止弁等の漏洩防止措置」の“両方”を講じる必要がある（「いずれか一方」は誤り）。"}, {"id": 36, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問12", "branch": "ハ", "theme": "流出防止措置", "question": "（アンモニア250t）この凝縮器及び受液器は、その周囲に、その液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第13号", "explanation": "流出防止措置（防液堤等）が必要な毒性ガス受液器は「10,000 L以上」。本設備は6,000 Lのため対象外（誤り）。"}, {"id": 37, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "イ", "theme": "防爆電気設備", "question": "（アンモニア250t）この製造施設の冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものでなければならないものに該当しない。", "answer": "○", "law": "冷規第7条第1項第14号", "explanation": "電気設備の防爆構造義務は「可燃性ガス（アンモニアを除く。）」と規定され、アンモニアは明文で除外されている。"}, {"id": 38, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ロ", "theme": "除害措置", "question": "（アンモニア250t）この製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。", "answer": "○", "law": "冷規第7条第1項第16号", "explanation": "アンモニアは毒性ガスであるため、漏洩時に安全・速やかに除害する措置（除害設備・散水設備等）の設置が義務付けられている。"}, {"id": 39, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問13", "branch": "ハ", "theme": "耐震設計基準", "question": "（アンモニア250t）この受液器は、所定の耐震に関する性能を有するものとしなければならないものに該当する。", "answer": "○", "law": "冷規第7条第1項第5号", "explanation": "耐震設計性能が義務付けられる受液器は内容積「5,000 L以上」。本問の受液器は6,000 Lのため該当する。"}, {"id": 40, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "イ", "theme": "保安責任者の解任届", "question": "（R134a 600t）選任している冷凍保安責任者及びその代理者を解任し、新たにこれらの者を選任したときは、遅滞なく、新たに選任した者についてその旨を都道府県知事等に届け出なければならないが、解任したこれらの者についてはその旨を都道府県知事等に届け出る必要はない。", "answer": "×", "law": "法第27条の4第2項、法第33条第3項", "explanation": "選任したときだけでなく「解任したとき」も遅滞なく届け出なければならない（誤り）。"}, {"id": 41, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ロ", "theme": "保安責任者代理者", "question": "（R134a 600t）選任している冷凍保安責任者の代理者は、冷凍保安責任者が疾病等によりその職務を行うことができないときに、その職務を代行する場合は、高圧ガス保安法の規定の適用については冷凍保安責任者とみなされる。", "answer": "○", "law": "法第33条第1項・第2項", "explanation": "代理者が職務を代行する間は、法の適用について冷凍保安責任者とみなされる。"}, {"id": 42, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者の資格", "question": "（R134a 600t）冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が100トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者のうちから選任しなければならない。", "answer": "○", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "認定指定設備（B）は選任不要のため設備A（300トン）で判定。「300トン以上」は1冷免状＋100トン以上で1年以上の実務経験が必要。"}, {"id": 43, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "イ", "theme": "軽微工事", "question": "（R134a 600t）この製造施設にブラインを共通とする認定指定設備である定置式製造設備Cを増設する工事は、定められた軽微な変更の工事に該当する。", "answer": "○", "law": "冷規第17条第1項第4号", "explanation": "「認定指定設備の設置の工事」は軽微な変更工事に該当する。"}, {"id": 44, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ロ", "theme": "軽微工事", "question": "（R134a 600t）製造設備Bについて行う指定設備認定証が無効とならない認定指定設備に係る変更の工事は、定められた軽微な変更の工事に該当する。", "answer": "○", "law": "冷規第17条第1項第5号", "explanation": "認定証が無効とならない変更工事（同等部品への交換等）は軽微な変更工事に該当する。"}, {"id": 45, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問15", "branch": "ハ", "theme": "完成検査不要工事", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなければならないが、その変更の工事の完成後、その製造施設の完成検査を受けることなく使用することができる。", "answer": "○", "law": "法第14条第1項、冷規第23条", "explanation": "不活性フルオロカーボン設備で切断・溶接なし・能力変更が所定範囲内の取替えは、許可は必要だが完成検査は不要。"}, {"id": 46, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問16", "branch": "イ", "theme": "保安検査の範囲", "question": "（R134a 600t）保安検査は、特定施設の位置、構造及び設備並びに製造の方法が所定の技術上の基準に適合しているかどうかについて行われる。", "answer": "×", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は「位置・構造・設備」であり、「製造の方法」は含まれない（誤り）。"}, {"id": 47, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問16", "branch": "ロ", "theme": "保安検査受検届", "question": "（R134a 600t）特定施設について高圧ガス保安協会が行う保安検査を受けた場合、高圧ガス保安協会がその検査結果を都道府県知事等に報告することとなっているので、その保安検査を受けた旨を都道府県知事等に届け出る必要はない。", "answer": "×", "law": "冷規第41条第3項", "explanation": "協会の保安検査を受けた事業者は、受検後に「受検届書」を知事等に提出しなければならない（誤り）。"}, {"id": 48, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問16", "branch": "ハ", "theme": "特定施設の除外", "question": "（R134a 600t）製造施設のうち、認定指定設備である製造設備Bに係る部分については、保安検査を受けることを要しない。", "answer": "○", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "認定指定設備の部分は「特定施設」から除外されるため、保安検査の受検は不要。"}, {"id": 49, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問17", "branch": "イ", "theme": "定期自主検査の監督", "question": "（R134a 600t）選任している冷凍保安責任者又はその冷凍保安責任者の代理者以外の者であっても、所定の製造保安責任者免状の交付を受けている者に、定期自主検査の実施について監督を行わせることができる。", "answer": "×", "law": "冷規第44条第4項", "explanation": "自主検査の監督は「選任された冷凍保安責任者（または代理者）」が行わなければならず、免状保持者でも選任外の第三者は不可（誤り）。"}, {"id": 50, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問17", "branch": "ロ", "theme": "自主検査の耐圧除外", "question": "（R134a 600t）定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行わなければならないが、その技術上の基準のうち耐圧試験に係るものについては行わなくてよい。", "answer": "○", "law": "法第35条の2、冷規第44条第3項", "explanation": "定期自主検査の対象基準から「耐圧試験に係るもの」は除外されている。"}, {"id": 51, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査記録の提出", "question": "（R134a 600t）定期自主検査を行ったときは、遅滞なく、その検査記録を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第35条の2", "explanation": "記録の作成・保存義務はあるが、知事等への提出・届出義務はない（誤り）。"}, {"id": 52, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問18", "branch": "イ", "theme": "火気との距離", "question": "（R134a 600t）冷媒設備の圧縮機は、その製造設備外の火気の付近にあってはならない。ただし、その火気に対して安全な措置を講じた場合は、この限りでない。", "answer": "○", "law": "冷規第7条第1項第1号", "explanation": "圧縮機等は火気の付近にあってはならないが、火気に対して安全な措置を講じた場合は認められる。"}, {"id": 53, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問18", "branch": "ロ", "theme": "耐圧試験圧力基準", "question": "（R134a 600t）配管以外の冷媒設備は、許容圧力の1.5倍以上の圧力で水その他の安全な液体を使用して行う耐圧試験（液体を使用することが困難であると認められるときは、許容圧力の1.25倍以上の圧力で空気、窒素等の気体を使用して行う耐圧試験）又は経済産業大臣がこれと同等以上のものと認めた高圧ガス保安協会が行う試験に合格するものでなければならない。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "配管以外の耐圧試験圧力は液体で1.5倍以上、気体で1.25倍以上と規定されている。"}, {"id": 54, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問18", "branch": "ハ", "theme": "圧力計の設置免除", "question": "（R134a 600t）製造設備Bの冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、製造設備Bの圧縮機の油圧系統を含む冷媒設備には、圧力計を設けなくてよい。", "answer": "×", "law": "冷規第7条第1項第7号", "explanation": "保護装置がある場合に圧力計が免除されるのは「当該油圧系統」のみ。冷媒設備本体の圧力計は免除されない（誤り）。"}, {"id": 55, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問19", "branch": "イ", "theme": "安全装置の設置", "question": "（R134a 600t）この冷媒設備には、その設備内の冷媒ガスの圧力が許容圧力を超えた場合に直ちにその圧力を許容圧力以下に戻すことができる安全装置を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第8号", "explanation": "圧力が許容圧力を超えた場合に直ちに復帰させる安全装置（安全弁等）の設置が義務付けられている。"}, {"id": 56, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問19", "branch": "ロ", "theme": "安全弁付帯止め弁", "question": "（R134a 600t）冷媒設備の安全弁に付帯して設けた止め弁は、その設備を長期に運転停止する場合には、安全弁の誤作動防止のため、常に閉止しておかなければならない。", "answer": "×", "law": "冷規第9条第1号", "explanation": "安全弁付帯の止め弁は修理・清掃時を除き「常に全開」にしておく義務があり、運転停止時でも閉止は禁止（誤り）。"}, {"id": 57, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問19", "branch": "ハ", "theme": "日常点検の対象", "question": "（R134a 600t）高圧ガスの製造は、1日に1回以上、その製造設備のうち冷媒設備のみについて異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。", "answer": "×", "law": "冷規第9条第2号", "explanation": "1日1回以上の点検は「冷媒設備のみ」ではなく「製造施設全般」が対象である（誤り）。"}, {"id": 58, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の止め弁", "question": "（R134a 600t・設備B）この設備が認定指定設備である条件の一つには、「日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用しないこと。」がある。", "answer": "○", "law": "冷規第57条第12号", "explanation": "日常運転操作用の冷媒ガス止め弁に手動式を使用しないことが構造基準として明記されている。"}, {"id": 59, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備搬入形態", "question": "（R134a 600t・設備B）この設備が認定指定設備である条件の一つには、「冷媒設備は、使用場所である事業所に分割して搬入され、一つの架台上に組み立てられたものでなければならないこと。」がある。", "answer": "×", "law": "冷規第57条第1号・第3号・第5号", "explanation": "製造事業所であらかじめ架台上に組み立てられ、現場には「分割されずに」搬入されなければならない（誤り）。"}, {"id": 60, "subject": "法令", "year": "2020年度(令和2年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の移設", "question": "（R134a 600t・設備B）この設備に変更の工事を施すことがない場合であっても、この設備を移設すると、その指定設備認定証が無効になる場合がある。", "answer": "○", "law": "冷規第62条第1項・同項第2号", "explanation": "改造を行わなくても、移設した場合は原則として認定証が無効となる（調査を受け適合書交付を受けた場合を除く）。"}, {"id": 61, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "イ", "theme": "高圧ガス保安法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、冷凍のための高圧ガスの製造及び販売のみを規制している。", "answer": "×", "law": "法第1条", "explanation": "法第1条では製造・販売だけでなく、貯蔵、移動、消費、容器の製造・取扱等も規制対象であり、「民間事業者及び協会の自主的活動の促進」も目的の柱であるため誤り。"}, {"id": 62, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ロ", "theme": "高圧ガスの定義", "question": "常用の温度40度において圧力が1メガパスカルとなる圧縮ガス（圧縮アセチレンガスを除く。）であって、現在の圧力が0.9メガパスカルのものは高圧ガスではない。", "answer": "○", "law": "法第2条第1号", "explanation": "圧縮ガスは「常用温度で1 MPa以上かつ現に1 MPa以上」または「35度で1 MPa以上」が高圧ガス。常用40度で1 MPaであっても現在圧力が0.9 MPaで35度規定も満たさなければ高圧ガスではない。"}, {"id": 63, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問1", "branch": "ハ", "theme": "高圧ガスの定義", "question": "アンモニアは、そのときの状態が液化ガスであるか圧縮ガスであるかにかかわらず、常用の温度において、高圧ガスとなる場合の圧力の最小の値は0.2メガパスカルである。", "answer": "×", "law": "法第2条第1号・第3号", "explanation": "常用の温度において高圧ガスとなる圧力の下限は、液化ガスでは0.2 MPa以上だが、圧縮ガスでは1 MPa以上であるため誤り。"}, {"id": 64, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "イ", "theme": "適用除外", "question": "1日の冷凍能力が4トンの冷凍設備内における高圧ガスであるフルオロカーボン（不活性のもの）は、高圧ガス保安法の適用を受けない。", "answer": "○", "law": "法第3条第1項第8号、令第2条第3項第4号", "explanation": "不活性フルオロカーボン及び二酸化炭素は、冷凍能力3トン以上5トン未満の設備内の高圧ガスが適用除外とされるため正。"}, {"id": 65, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ロ", "theme": "製造許可の基準", "question": "1日の冷凍能力が60トンである冷凍設備（一つの設備であって、認定指定設備でないもの）を使用して高圧ガスの製造をしようとする者は、その製造をする高圧ガスの種類にかかわらず、事業所ごとに都道府県知事等の許可を受けなければならない。", "answer": "○", "law": "法第5条第1項第2号、令第4条", "explanation": "製造許可を要する冷凍能力は、不活性・不活性以外・アンモニア等いずれも50トン以上（その他のガスは20トン以上）であるため、60トンの設備はガスの種類によらず許可が必要。"}, {"id": 66, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問2", "branch": "ハ", "theme": "製造するガス種類の変更", "question": "第一種製造者は、製造のための施設の位置、構造又は設備を変更することなく、その製造をする高圧ガスの種類を変更したときは、その変更後遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第14条第1項", "explanation": "製造する高圧ガスの種類を変更しようとするときは、施設の変更を伴わなくても都道府県知事等の「許可」を受けなければならない（事後届出ではない）。"}, {"id": 67, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "イ", "theme": "第一種製造者の承継", "question": "第一種製造者について合併があり、その合併により法人を設立した場合、その法人は第一種製造者の地位を承継する。", "answer": "○", "law": "法第10条第1項", "explanation": "第一種製造者について合併があった場合、合併後存続する法人または合併により設立された法人は、その地位を承継する。"}, {"id": 68, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ロ", "theme": "販売事業の届出", "question": "高圧ガスの販売の事業を営む者は、販売所ごとに、事業の開始後遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第20条の4第1項", "explanation": "高圧ガスの販売事業を営もうとする者は、事業開始後ではなく「事業開始の日の20日前までに」都道府県知事等に届け出なければならない。"}, {"id": 69, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問3", "branch": "ハ", "theme": "機器製造業者の技術基準", "question": "専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が所定の技術上の基準に従って製造しなければならない機器は、フルオロカーボン（可燃性ガスを除く。）を冷媒ガスとする冷凍機のものにあっては、1日の冷凍能力が5トン以上のものである。", "answer": "○", "law": "法第57条、冷規第63条", "explanation": "可燃性ガス以外のフルオロカーボンまたは二酸化炭素を冷媒とする冷凍機は、1日の冷凍能力が5トン以上のものが基準遵守対象となる。"}, {"id": 70, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造者の区分", "question": "製造をする高圧ガスの種類がフルオロカーボン（不活性のもの）である場合、1日の冷凍能力が20トン以上50トン未満である一つの冷凍設備を使用して高圧ガスの製造をする者は、第二種製造者である。", "answer": "○", "law": "法第5条第2項第2号、法第10条の2、令第4条", "explanation": "不活性フルオロカーボンは20トン以上50トン未満の製造設備を使用する者が第二種製造者となる。"}, {"id": 71, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ロ", "theme": "気密試験に使用するガス", "question": "製造設備の設置又は変更の工事を完成したときに行う気密試験に酸素を使用するときは、あらかじめ、冷媒設備中にある可燃性ガスを排除した後に行わなければならない。", "answer": "×", "law": "法第12条第2項、冷規第14条第1号", "explanation": "気密試験に「酸素」を使用することは爆発・引火の危険があるため禁止されている。使用できるのは空気、窒素、ヘリウム、不活性フルオロカーボン等。"}, {"id": 72, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問4", "branch": "ハ", "theme": "第二種製造者の保安責任者", "question": "第二種製造者のうちには、冷凍保安責任者を選任しなければならない者がある。", "answer": "○", "law": "法第27条の4第1項第2号、冷規第35条", "explanation": "第二種製造者であっても、アンモニアや不活性以外のフルオロカーボンで冷凍能力20トン以上50トン未満の設備等を使用する場合は冷凍保安責任者の選任が必要。"}, {"id": 73, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "イ", "theme": "車両移動", "question": "高圧ガスを移動する場合、充填容器及び残ガス容器には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならない。", "answer": "○", "law": "一般則第50条第5号、同第6条第1項第42号", "explanation": "「充填容器等」には充填容器および残ガス容器の両方が含まれ、衝撃防止や粗暴な取扱いの禁止が義務付けられている。"}, {"id": 74, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ロ", "theme": "車両移動", "question": "液化フルオロカーボン（不活性ガスに限る。）を移動するとき、その車両の見やすい箇所に警戒標を掲げなければならない旨の定めはない。", "answer": "×", "law": "法第23条第2項、一般則第50条第1号", "explanation": "車両積載移動時の警戒標の掲示義務は、不活性ガスを含むすべての高圧ガスに適用される（定めがないは誤り）。"}, {"id": 75, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問5", "branch": "ハ", "theme": "車両移動", "question": "液化アンモニアを移動するときは、そのガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならないが、特定不活性ガスである液化フルオロカーボンを移動するときはその定めはない。", "answer": "×", "law": "一般則第49条第1項第21号、同第50条第13号", "explanation": "イエローカード等の書面交付・携帯義務は、可燃性ガス、毒性ガスだけでなく「特定不活性ガス（R32等）」や酸素にも適用されるため誤り。"}, {"id": 76, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "イ", "theme": "液化ガスの充填質量基準", "question": "容器に充填する液化ガスは、刻印等又は自主検査刻印等で示された種類の高圧ガスであり、かつ、容器に刻印等又は自主検査刻印等で示された最大充填質量の数値以下のものでなければならない。", "answer": "×", "law": "法第48条第4項第1号、容則第22条", "explanation": "充填すべき質量は容器に刻印された数値ではなく、「示された内容積に応じて省令で定める計算式（G=V/C）により計算した質量以下」と規定されている。"}, {"id": 77, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ロ", "theme": "容器外面の明示事項", "question": "液化ガスを充填する容器の外面には、その容器に充填することができる液化ガスの最大充填質量の数値を明示しなければならない。", "answer": "×", "law": "容則第10条第1項第2号", "explanation": "容器外面の明示事項（所有者、充填ガス名等）に「最大充填質量の数値」を明示すべき規定はないため誤り。"}, {"id": 78, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問6", "branch": "ハ", "theme": "附属品刻印事項", "question": "容器に装置されるバルブであって附属品検査に合格したものに刻印をすべき事項の一つに、「そのバルブが装置されるべき容器の種類」がある。", "answer": "○", "law": "法第49条の3、容則第18条第1項第7号", "explanation": "附属品検査合格バルブの刻印事項の一つに「附属品が装置されるべき容器の種類」が明記されている。"}, {"id": 79, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "イ", "theme": "貯蔵場所の通風", "question": "アンモニアの充填容器及び残ガス容器を貯蔵する場合は、通風の良い場所で行わなければならないが、不活性ガスのフルオロカーボンについては、その定めはない。", "answer": "○", "law": "法第15条第1項、一般則第18条第2号イ", "explanation": "通風の良い場所での貯蔵義務は「可燃性ガス又は毒性ガス」に限定されており、不活性フルオロカーボンには適用されない。"}, {"id": 80, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ロ", "theme": "車両上の容器貯蔵禁止", "question": "アンモニアの充填容器を車両に積載して貯蔵することは、特に定められた場合を除き禁じられているが、不活性ガスのフルオロカーボンの充填容器を車両に積載して貯蔵することは、いかなる場合であっても禁じられていない。", "answer": "×", "law": "法第15条第1項、一般則第18条第2号ホ", "explanation": "「車両等に固定し又は積載した容器により貯蔵しないこと」という原則禁止規定は、不活性ガスを含むすべての高圧ガスに適用される。"}, {"id": 81, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問7", "branch": "ハ", "theme": "容器転倒防止", "question": "アンモニアの充填容器及び残ガス容器であって、それぞれ内容積が5リットルを超えるものには、転落、転倒等による衝撃及びバルブの損傷を防止するための措置を講じ、かつ、粗暴な取扱いをしてはならない。", "answer": "○", "law": "一般則第6条第2項第8号ト", "explanation": "内容積5リットルを超える充填容器及び残ガス容器には、転倒転落防止措置および粗暴な取扱いの禁止が義務付けられている。"}, {"id": 82, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定式", "question": "圧縮機の標準回転速度における1時間当たりの吐出し量の数値は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第1号・第4号", "explanation": "「1時間当たりの吐出し量（V）」を用いるのは容積圧縮式等（第4号設備）である。遠心式圧縮機（第1号設備）は原動機定格出力（W）を用いる。"}, {"id": 83, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍能力算定式", "question": "圧縮機の気筒の内径の数値は、回転ピストン型圧縮機を使用する冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第4号", "explanation": "回転ピストン型圧縮機（第4号設備）の冷凍能力算定式 R=V/C において、容積Vの算出に気筒内径Dの数値が必要となる。"}, {"id": 84, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍能力算定式", "question": "冷媒設備内の冷媒ガスの充填量の数値は、アンモニアを冷媒ガスとする吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第2号", "explanation": "吸収式冷凍設備の冷凍能力算定基準に「冷媒ガス充填量の数値」による算定規定はない（発生器の加熱量等を用いる）。"}, {"id": 85, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の届出", "question": "（アンモニア250t）所定の事項を記載した危害予防規程を定め、これを都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第26条第1項", "explanation": "アンモニア設備で冷凍能力50トン以上の第一種製造者は、危害予防規程を定めて都道府県知事等に届け出る義務がある。"}, {"id": 86, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ロ", "theme": "保安教育計画", "question": "（アンモニア250t）従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、この計画を都道府県知事等に届け出ることの定めはない。", "answer": "○", "law": "法第27条第1項・第3項", "explanation": "第一種製造者は保安教育計画の策定・実行が義務付けられているが、計画そのものを都道府県知事等へ届け出る義務はない。"}, {"id": 87, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問9", "branch": "ハ", "theme": "危険時の通報義務", "question": "（アンモニア250t）この製造施設が危険な状態になったことを発見したときは、直ちに、応急の措置を講じなければならないが、その事態を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出ることの定めはない。", "answer": "×", "law": "法第36条第1項・第2項", "explanation": "危険な事態を発見した者は、直ちに応急措置を講ずるとともに、都道府県知事等、警察官、消防吏員等に通報・届出を行わなければならない（定めがないは誤り）。"}, {"id": 88, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "イ", "theme": "発火物の携帯立入制限", "question": "（アンモニア250t）この事業者がこの事業所において指定する場所では、何人も、その事業者の承諾を得ないで、発火しやすい物を携帯してその場所に立ち入ってはならない。", "answer": "○", "law": "法第37条第2項", "explanation": "事業者が指定した場所には、事業者の承諾を得ないで発火しやすい物を携帯して立ち入ることは何人（全従業員・外来者含む）も禁止されている。"}, {"id": 89, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録の保存期間", "question": "この製造施設に異常があった年月日及びそれに対してとった措置を記載した帳簿をこの事業所に備え、記載の日から10年間保存しなければならない。", "answer": "○", "law": "法第60条第1項、冷規第65条", "explanation": "第一種製造者の製造施設異常時の記録帳簿の保存期間は、記載の日から「10年間」と義務付けられている。"}, {"id": 90, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問10", "branch": "ハ", "theme": "容器喪失時の届出", "question": "（アンモニア250t）所有し、又は占有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならないが、その所有し、又は占有する容器を喪失したときは届け出る必要はない。", "answer": "×", "law": "法第63条第1項第1号・第2号", "explanation": "高圧ガスの災害発生時だけでなく、「所有又は占有する高圧ガス若しくは容器を喪失し、又は盗まれたとき」も遅滞なく知事等又は警察官に届け出なければならない。"}, {"id": 91, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "イ", "theme": "軽微な変更工事", "question": "（アンモニア250t）この製造施設の冷媒設備の圧縮機の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものである場合は、定められた軽微な変更の工事に該当する。", "answer": "×", "law": "法第14条第1項、冷規第17条第1項第2号", "explanation": "冷媒設備の取替え工事で軽微な変更に該当するのは「可燃性ガス及び毒性ガスを除く」とされているため、アンモニア設備は切断溶接や能力変更がなくても該当しない。"}, {"id": 92, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ロ", "theme": "施設引渡しと完成検査", "question": "（アンモニア250t）既に完成検査を受け所定の技術上の基準に適合していると認められているこの製造施設の全部の引渡しがあった場合、その引渡しを受けた者は、その旨を都道府県知事等に届け出た後、完成検査を受けることなく、この製造施設を使用することができる。", "answer": "×", "law": "法第5条第1項、法第20条第2項", "explanation": "引渡しを受けた者は「届出」ではなく、新規に都道府県知事等の「許可」を受けなければ、完成検査を受けることなく使用することはできない（届出後ではない）。"}, {"id": 93, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問11", "branch": "ハ", "theme": "完成検査不要の変更工事", "question": "（アンモニア250t）製造施設の位置、構造又は設備の変更の工事について、都道府県知事等の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事があるが、この事業所の製造施設には適用されない。", "answer": "○", "law": "法第20条第3項、冷規第23条", "explanation": "完成検査不要の変更工事規定（冷規第23条）は可燃性・毒性ガス設備が除外されているため、アンモニア設備である本事業所には適用されない。"}, {"id": 94, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "イ", "theme": "流出防止措置", "question": "（アンモニア250t）この受液器は、その周囲に液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第13号", "explanation": "液状冷媒の流出防止措置（防液堤等）が必要な毒性ガス受液器は内容積「1万リットル以上」。本事業所の受液器は6,000リットルのため該当しない。"}, {"id": 95, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ロ", "theme": "耐震設計構造物", "question": "（アンモニア250t）この凝縮器及び受液器のいずれも、所定の耐震に関する性能を有しなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第5号", "explanation": "受液器（6,000 L）は5,000 L以上のため該当するが、凝縮器は「縦置円筒形で胴長5m以上」が対象であり、本問は「横置円筒形」のため該当しない（「いずれも」は誤り）。"}, {"id": 96, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問12", "branch": "ハ", "theme": "漏えい検知警報設備", "question": "（アンモニア250t）この製造施設は、その施設から漏えいするガスが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならないものに該当する。", "answer": "○", "law": "冷規第7条第1項第15号", "explanation": "可燃性ガス、毒性ガス（アンモニア）又は特定不活性ガスの製造施設には、漏えい検知警報設備の設置が義務付けられている。"}, {"id": 97, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "イ", "theme": "消火設備の設置", "question": "（アンモニア250t）この製造施設は、その規模に応じて、適切な消火設備を適切な箇所に設けなければならない施設に該当する。", "answer": "○", "law": "冷規第7条第1項第12号", "explanation": "可燃性ガス（アンモニアを含む）の製造施設には、規模に応じた適切な消火設備の設置が義務付けられている。"}, {"id": 98, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ロ", "theme": "除害措置の免除", "question": "（アンモニア250t）この製造設備が設置してある専用機械室を、冷媒ガスが漏えいしたとき滞留しないような構造とすれば、この製造設備には冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じる必要はない。", "answer": "×", "law": "冷規第7条第1項第16号", "explanation": "毒性ガス（アンモニア）製造設備の除害措置義務は、専用機械室を滞留防止構造としても免除されない（除害設備等の設置が必須）。"}, {"id": 99, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問13", "branch": "ハ", "theme": "防爆構造電気設備", "question": "（アンモニア250t）この冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものでなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第14号", "explanation": "電気設備の防爆構造義務は「可燃性ガス（アンモニアを除く。）」と規定されており、アンモニア設備は適用除外されている。"}, {"id": 100, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "イ", "theme": "冷凍保安責任者の要件", "question": "（R134a 600t）冷凍保安責任者には、第一種冷凍機械責任者免状又は第二種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が20トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者のうちから選任しなければならない。", "answer": "×", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "製造設備A（300トン）の選任要件は「第一種冷凍機械責任者免状」かつ「100トン以上で1年以上の実務経験」が必要（2冷免状・20トン以上では不可）。"}, {"id": 101, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ロ", "theme": "保安責任者の解任・選任届", "question": "（R134a 600t）選任している冷凍保安責任者を解任し、新たに冷凍保安責任者を選任したときは、遅滞なく、その解任及び選任の旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第27条の2第5項、法第27条の4第2項", "explanation": "冷凍保安責任者を選任したとき、及び解任したときは、遅滞なく都道府県知事等に届け出なければならない。"}, {"id": 102, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問14", "branch": "ハ", "theme": "保安責任者代理者の選任時期", "question": "（R134a 600t）冷凍保安責任者が旅行、疾病その他の事故によってその職務を行うことができないときは、直ちに、高圧ガスの製造に関する知識経験を有する者のうちから代理者を選任し、都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第33条第1項", "explanation": "代理者は事故が発生してから選任するのではなく、「あらかじめ」選任しておかなければならない（「直ちに選任」は誤り）。"}, {"id": 103, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "イ", "theme": "凝縮器取替えの軽微変更", "question": "（R134a 600t）製造設備Aの冷媒設備に係る切断、溶接を伴わない凝縮器の取替えの工事であって、その取り替えに係る凝縮器が耐震設計構造物の適用を受けないものである場合、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で、切断溶接なし・耐震対象外・能力変更なしの凝縮器取替えは軽微な変更工事に該当し、完成後遅滞なく届出を行えばよい。"}, {"id": 104, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ロ", "theme": "認定指定設備の増設", "question": "（R134a 600t）この製造施設にブラインを共通に使用する認定指定設備である製造設備Cを増設する工事は、軽微な変更の工事に該当する。", "answer": "○", "law": "冷規第17条第1項第4号", "explanation": "「認定指定設備の設置の工事」は軽微な変更工事に該当する。"}, {"id": 105, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問15", "branch": "ハ", "theme": "完成検査不要の変更工事", "question": "（R134a 600t）製造設備Aの冷媒設備に係る切断、溶接を伴わない圧縮機の取替えの工事をしようとするとき、その冷凍能力の変更が所定の範囲であるものは、都道府県知事等の許可を受けなければならないが、その変更の工事の完成後、所定の完成検査を受けることなく使用することができる。", "answer": "○", "law": "法第14条第1項、冷規第23条", "explanation": "不活性フルオロカーボン設備で切断溶接を伴わず能力変更が所定範囲内の設備取替えは、許可は必要だが完成検査を受けずに使用できる。"}, {"id": 106, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問16", "branch": "イ", "theme": "指定設備の保安検査除外", "question": "（R134a 600t）製造施設のうち製造設備Bに係る部分についても、保安検査を受けなければならないと定められている。", "answer": "×", "law": "法第35条第1項、冷規第40条第1項第2号", "explanation": "製造設備Bは認定指定設備であり、特定施設から除外されているため保安検査を受ける必要はない。"}, {"id": 107, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問16", "branch": "ロ", "theme": "保安検査の実施主体", "question": "（R134a 600t）保安検査を実施することは、冷凍保安責任者の職務の一つとして定められている。", "answer": "×", "law": "法第35条第1項", "explanation": "保安検査は都道府県知事等（又は高圧ガス保安協会・指定保安検査機関）が行う行政検査であり、冷凍保安責任者の職務ではない。"}, {"id": 108, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問16", "branch": "ハ", "theme": "保安検査の周期", "question": "（R134a 600t）保安検査は、3年以内に少なくとも1回以上行われる。", "answer": "○", "law": "冷規第40条第2項", "explanation": "特定施設に対する保安検査の周期は「3年に1回」と規定されている。"}, {"id": 109, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問17", "branch": "イ", "theme": "定期自主検査の対象", "question": "（R134a 600t）定期自主検査は、製造の方法が所定の技術上の基準に適合しているかどうかについて、1年に1回以上行わなければならない。", "answer": "×", "law": "法第35条の2、冷規第44条第3項", "explanation": "定期自主検査は製造施設の位置・構造・設備について行うものであり、「製造の方法」は対象に含まれない（「製造の方法について行う」は誤り）。"}, {"id": 110, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問17", "branch": "ロ", "theme": "自主検査記録の届出", "question": "（R134a 600t）定期自主検査を行ったときは、その記録を作成し、これを遅滞なく都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第35条の2", "explanation": "定期自主検査記録は作成して事業所に保存する義務はあるが、都道府県知事等へ提出・届出する義務はない。"}, {"id": 111, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問17", "branch": "ハ", "theme": "自主検査記録の記載事項", "question": "（R134a 600t）定期自主検査を行ったときに作成する検査記録に記載すべき事項の一つに「検査をした製造施設の設備ごとの検査方法及び結果」がある。", "answer": "○", "law": "冷規第44条第5項第2号", "explanation": "定期自主検査記録の法定記載事項として「検査をした製造施設の設備ごとの検査方法及び結果」が明記されている。"}, {"id": 112, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問18", "branch": "イ", "theme": "耐圧試験の気体圧力基準", "question": "（R134a 600t）この製造施設の配管以外の冷媒設備について行う耐圧試験は、「水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力以上の圧力で行うことができる。」と定められている。", "answer": "×", "law": "冷規第7条第1項第6号", "explanation": "気体を使用して耐圧試験を行う場合の圧力は「許容圧力の1.25倍以上」である（「許容圧力以上の圧力」は誤り）。"}, {"id": 113, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問18", "branch": "ロ", "theme": "不活性ガスの安全弁放出管", "question": "（R134a 600t）この冷媒設備の安全弁には放出管を設けるべき定めはない。", "answer": "○", "law": "冷規第7条第1項第9号", "explanation": "安全弁への放出管設置義務は、不活性ガス（可燃性ガス以外のフルオロカーボン）を冷媒ガスとする冷媒設備については除外されている。"}, {"id": 114, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問18", "branch": "ハ", "theme": "油圧系統圧力計の免除", "question": "（R134a 600t）冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その圧縮機の油圧系統には、圧力計を設けなくてもよい。", "answer": "○", "law": "冷規第7条第1項第7号", "explanation": "圧縮機が強制潤滑方式かつ油圧保護装置（OPS）を有している場合、当該圧縮機の油圧系統への圧力計の取り付けは免除される。"}, {"id": 115, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問19", "branch": "イ", "theme": "指定設備の火気隔離", "question": "（R134a 600t）「圧縮機と凝縮器との間の配管が、引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所の付近にあってはならない。」旨の定めは、認定指定設備である製造設備Bには適用されない。", "answer": "×", "law": "冷規第7条第1項第1号、同条第2項", "explanation": "火気・可燃物からの隔離基準は、冷規第7条第2項により認定指定設備にも準用・適用されるため誤り。"}, {"id": 116, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問19", "branch": "ロ", "theme": "警戒標の掲示義務", "question": "（R134a 600t）製造設備を設置した室に外部から容易に立ち入ることができない措置を講じた場合であっても、製造施設に警戒標を掲げなければならない。", "answer": "○", "law": "冷規第7条第1項第2号", "explanation": "製造施設の外部から見やすい箇所への警戒標掲示義務は、立入防止措置を講じていても免除されない。"}, {"id": 117, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問19", "branch": "ハ", "theme": "修理作業の監視・通報措置", "question": "（R134a 600t）冷媒設備の修理は、あらかじめ定めた修理の作業計画に従って行わなければならないが、あらかじめ定めた作業の責任者の監視の下で行うことができない場合は、異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行うことと定められている。", "answer": "○", "law": "冷規第9条第3号イ", "explanation": "修理・清掃作業は作業計画に従い、責任者の監視下で行うか、または直ちに通報できる措置を講じて行うことが定められている。"}, {"id": 118, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の自動制御装置", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つに、自動制御装置が設けられていなければならないことがある。", "answer": "○", "law": "冷規第57条第13号", "explanation": "指定設備の基準として「自動制御装置を設けること」が義務付けられている。"}, {"id": 119, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の耐圧気密場所", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つに、冷媒設備が所定の気密試験及び耐圧試験に合格するものでなければならないことがあるが、その試験を行うべき場所についての定めはない。", "answer": "×", "law": "冷規第57条第4号", "explanation": "指定設備は「当該設備の製造業者の事業所で行う」所定の気密試験及び耐圧試験に合格することが定められている（場所の定めがないは誤り）。"}, {"id": 120, "subject": "法令", "year": "2019年度(令和元年)", "q_num": "問20", "branch": "ハ", "theme": "指定設備の部品交換", "question": "（R134a 600t・設備B）この製造設備に変更の工事を施したとき、その工事が同等の部品への交換のみである場合は、指定設備認定証は無効にならないと定められている。", "answer": "○", "law": "冷規第62条第1項第1号", "explanation": "認定指定設備の変更工事が「同等の部品への交換のみ」である場合は、指定設備認定証は無効とならない。"}, {"id": 121, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "イ", "theme": "法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、販売、貯蔵等について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。", "answer": "○", "law": "法第1条", "explanation": "法第1条に定められた法の目的に合致する。行政による規制と民間・協会による自主保安活動の促進が2大目標となっている。"}, {"id": 122, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ロ", "theme": "認定指定設備の許可不要", "question": "1日の冷凍能力が50トン以上である認定指定設備のみを使用して冷凍のため高圧ガスの製造をしようとする者は、都道府県知事等の許可を受けなくてよい。", "answer": "○", "law": "法第5条第1項第2号、令第4条、法第35条の2", "explanation": "認定指定設備のみを用いる製造者は第一種製造者（許可）から除外され、第二種製造者（届出）となるため許可は不要。"}, {"id": 123, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問1", "branch": "ハ", "theme": "製造開始・廃止の届出", "question": "第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。", "answer": "○", "law": "法第21条第1項", "explanation": "第一種製造者は、製造を開始したとき又は廃止したときは、遅滞なくその旨を知事等に届け出なければならない。"}, {"id": 124, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "イ", "theme": "適用除外の冷凍能力下限", "question": "1日の冷凍能力が5トン未満の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず高圧ガス保安法の適用を受けない。", "answer": "×", "law": "法第3条第1項第8号、令第2条第3項第3号", "explanation": "ガスの種類にかかわらず一律で適用除外となるのは「3トン未満」である（不活性フルオロカーボン等の5トン未満特例はあるが、全ガス種一律ではないため誤り）。"}, {"id": 125, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ロ", "theme": "変更許可の審査基準", "question": "第一種製造者が製造施設の位置、構造若しくは設備の変更の工事をし、又は製造をする高圧ガスの種類若しくは製造の方法を変更するとき適用される技術上の基準には、製造施設の設置の許可の場合と同じ基準が適用される。", "answer": "○", "law": "法第14条第3項、法第8条第1号", "explanation": "変更の許可にあたっては、新規の設置許可時と同様に法第8条第1号の位置・構造・設備の技術上の基準が準用・適用される。"}, {"id": 126, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問2", "branch": "ハ", "theme": "高圧ガスの廃棄基準", "question": "冷凍のための製造施設の冷媒設備内の高圧ガスであるアンモニアを廃棄するときには、高圧ガスの廃棄に係る技術上の基準は適用されない。", "answer": "×", "law": "法第25条、冷規第33条", "explanation": "可燃性ガス・毒性ガスであるアンモニアを廃棄する場合は、省令で定める廃棄の技術上の基準に従わなければならない（適用されないは誤り）。"}, {"id": 127, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "イ", "theme": "高圧ガスの定義", "question": "常用の温度35度において圧力が1メガパスカルとなる圧縮ガス（圧縮アセチレンガスを除く。）であって、現在の圧力が0.9メガパスカルのものは高圧ガスではない。", "answer": "×", "law": "法第2条第1号", "explanation": "「温度35度において圧力が1 MPa以上となる圧縮ガス」は、現在の圧力が0.9 MPaであっても高圧ガスに該当する（高圧ガスではないは誤り）。"}, {"id": 128, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ロ", "theme": "地位の承継", "question": "第一種製造者がその高圧ガスの製造の事業の全部を譲り渡したときは、その事業の全部を譲り受けた者はその第一種製造者の地位を承継する。", "answer": "×", "law": "法第10条、法第20条第2項", "explanation": "事業譲渡による地位承継の規定はない。譲受人は新規に都道府県知事等の製造許可を取得する必要がある。"}, {"id": 129, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問3", "branch": "ハ", "theme": "機器製造業者の対象冷凍能力", "question": "1日の冷凍能力が5トンの冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）は、所定の技術上の基準に従ってその機器の製造をしなければならない。", "answer": "○", "law": "法第57条、冷規第63条", "explanation": "機器製造業者が基準に従うべき機器は冷凍能力3トン以上（不活性フルオロカーボンは5トン以上）と規定されており、5トンの機器はいずれにも該当する。"}, {"id": 130, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "イ", "theme": "気密試験・試運転", "question": "第二種製造者は、製造設備の変更の工事を完成したときは、酸素以外のガスを使用する試運転又は所定の気密試験を行った後でなければ高圧ガスの製造をしてはならない。", "answer": "○", "law": "法第12条第2項、冷規第14条第1号", "explanation": "工事完成時は、酸素以外のガスによる試運転又は許容圧力以上での気密試験を行った後でなければ製造してはならない。"}, {"id": 131, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ロ", "theme": "施設の維持管理義務", "question": "第二種製造者には、製造のための施設を、その位置、構造及び設備が技術上の基準に適合するように維持すべき定めはない。", "answer": "×", "law": "法第12条第1項", "explanation": "第二種製造者であっても、製造施設を技術上の基準に適合するように「維持しなければならない」と明定されている。"}, {"id": 132, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問4", "branch": "ハ", "theme": "定期自主検査", "question": "第二種製造者のうちには、製造施設について定期自主検査を行わなければならない者がある。", "answer": "○", "law": "法第35条の2、冷規第44条第1項", "explanation": "認定指定設備を使用する者や、アンモニア等の冷凍能力20トン以上の第二種製造者には、定期自主検査の実施義務がある。"}, {"id": 133, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "イ", "theme": "移動基準の適用", "question": "不活性ガスである液化フルオロカーボンを移動するときは、移動に係る技術上の基準等の適用を受けない。", "answer": "×", "law": "法第23条第2項、一般則第48条〜第50条", "explanation": "一定量以上の高圧ガスの車両移動に関する基準は、不活性ガスを含むすべての高圧ガスに適用される（適用を受けないは誤り）。"}, {"id": 134, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ロ", "theme": "毒性ガスの木枠・パッキン", "question": "液化アンモニアを移動するときは、その容器に木枠又はパッキンを施さなければならない。", "answer": "○", "law": "一般則第50条第8号", "explanation": "毒性ガス（アンモニア等）の充填容器等を移動するときは、木枠又はパッキンを施すことが義務付けられている。"}, {"id": 135, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問5", "branch": "ハ", "theme": "書面交付・携帯義務", "question": "液化アンモニアを移動するときは、その高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない旨の定めはない。", "answer": "×", "law": "一般則第49条第1項第21号、同第50条第13号", "explanation": "毒性ガス・可燃性ガスであるアンモニアの移動時には、イエローカード（注意事項記載書面）の交付・携帯・遵守義務がある（定めがないは誤り）。"}, {"id": 136, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "イ", "theme": "バルブ刻印事項", "question": "附属品検査に合格したバルブに刻印をすべき事項の一つに、そのバルブが装置されるべき容器の種類がある。", "answer": "○", "law": "法第49条の3、容規第18条第1項第7号", "explanation": "附属品検査合格バルブへの刻印事項として「装置されるべき容器の種類」が規定されている。"}, {"id": 137, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ロ", "theme": "液化ガス充填質量計算式", "question": "容器に充填することができる液化ガスの質量は、G = V / C（G:質量kg, V:内容積L, C:定数）の式で表される。", "answer": "○", "law": "法第48条第4項第1号、容規第22条", "explanation": "液化ガスの充填質量算定式は規定通り G = V / C である。"}, {"id": 138, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問6", "branch": "ハ", "theme": "溶接容器の再検査周期", "question": "液化フルオロカーボンを充填する溶接容器の容器再検査の期間は、その容器の製造後の経過年数に応じて定められている。", "answer": "○", "law": "法第48条第1項第5号、容規第24条第1項第1号", "explanation": "溶接容器の再検査周期は、製造後20年未満は5年、20年以上は2年と経過年数に応じて定められている。"}, {"id": 139, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "イ", "theme": "アンモニア貯蔵の通風", "question": "液化アンモニアの充填容器及び残ガス容器の貯蔵は、そのガスが漏えいしたとき拡散しないように通風の良い場所でしてはならない。", "answer": "×", "law": "法第15条第1項、一般則第18条第2号イ", "explanation": "毒性・可燃性ガスであるアンモニア容器の貯蔵は、「通風の良い場所」で行わなければならない（通風の良い場所でしてはならないは誤り）。"}, {"id": 140, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ロ", "theme": "車両上の容器貯蔵禁止", "question": "液化アンモニアを車両に固定した容器又は積載した容器により貯蔵することは、特に定められた場合を除き禁じられている。", "answer": "○", "law": "法第15条第1項、一般則第18条第2号ホ", "explanation": "原則として、船・車両等に固定又は積載した容器による貯蔵は禁じられている。"}, {"id": 141, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問7", "branch": "ハ", "theme": "貯蔵基準適用の質量区分", "question": "貯蔵の方法に係る技術上の基準に従って貯蔵しなければならない液化ガスは、可燃性ガス又は毒性ガスにあってはその質量が1.5キログラムを超えるもの、酸素又は不活性ガスにあってはその質量が5キログラムを超えるものと定められている。", "answer": "×", "law": "法第15条第1項、一般則第19条第1項・第2項", "explanation": "貯蔵基準が適用される液化ガスの質量（1.5 kg超）は、ガスの種類による区別はなくすべての高圧ガスに一律適用される（ガス種別の区分は誤り）。"}, {"id": 142, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定", "question": "蒸発部又は蒸発器の冷媒ガスに接する側の表面積の数値は、吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第2号・第3号", "explanation": "蒸発器表面積（A）を用いるのは自然循環式・自然還流式設備（第3号）である。吸収式（第2号）ではない。"}, {"id": 143, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍能力算定", "question": "圧縮機の標準回転速度における1時間のピストン押しのけ量の数値は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第1号・第4号", "explanation": "ピストン押しのけ量（V）を用いるのは容積圧縮式等（第4号）である。遠心式（第1号）は原動機定格出力（W）を用いる。"}, {"id": 144, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍能力算定", "question": "発生器を加熱する1時間の入熱量の数値は、吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第2号", "explanation": "吸収式冷凍設備（第2号）の冷凍能力算定には、発生器を加熱する入熱量（Q）が用いられる。"}, {"id": 145, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の認可不要", "question": "（アンモニア250t）この事業者が定めた危害予防規程は、都道府県知事等の認可を受けなければならない。", "answer": "×", "law": "法第26条第1項", "explanation": "危害予防規程は都道府県知事等へ「届け出」れば足り、「認可」を受ける必要はない（誤り）。"}, {"id": 146, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ロ", "theme": "指定場所の火気厳禁", "question": "（アンモニア250t）この事業者が事業所において指定する場所では、その事業所に選任された冷凍保安責任者といえども、火気を取り扱ってはならない。", "answer": "○", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、冷凍保安責任者であっても例外なく禁止される。"}, {"id": 147, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問9", "branch": "ハ", "theme": "圧縮機取替の軽微変更除外", "question": "（アンモニア250t）この事業者は、冷媒設備の圧縮機の取替えの工事において、冷媒設備の切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものは、軽微な変更の工事としてその工事の完成後遅滞なく、都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第14条第1項、冷規第17条第1項第2号", "explanation": "毒性・可燃性のアンモニア設備は軽微な変更から除外されているため、切断溶接や能力変更がなくても軽微工事にはならず、事前の変更許可が必要（誤り）。"}, {"id": 148, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "イ", "theme": "保安教育計画の変更届", "question": "（アンモニア250t）この事業者は、従業者に対する保安教育計画を変更したときは、都道府県知事等に届け出なければならない。", "answer": "×", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務だが、計画策定や変更の知事等への届出義務はない（届出が必要は誤り）。"}, {"id": 149, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ロ", "theme": "異常時記録の起算点", "question": "（アンモニア250t）この事業者は、事業所ごとに帳簿を備え、製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載しなければならない。また、その帳簿は製造開始の日から10年間保存しなければならない。", "answer": "×", "law": "法第60条第1項、冷規第65条", "explanation": "帳簿の保存期間10年の起算日は「製造開始の日」ではなく「記載の日」からである（誤り）。"}, {"id": 150, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問10", "branch": "ハ", "theme": "施設譲渡と完成検査免除", "question": "（アンモニア250t）既に完成検査を受け技術上の基準に適合していると認められているこの製造施設の全部の引渡しがあった場合、その引渡しを受けた者は、高圧ガスの製造について都道府県知事等の許可を受けたのち、都道府県知事等又は高圧ガス保安協会若しくは指定完成検査機関が行う完成検査を受けることなく、この製造施設を使用することができる。", "answer": "○", "law": "法第20条第2項", "explanation": "既に完成検査済みの施設の引渡しを受けて知事等の許可を受けた者は、改めて完成検査を受けることなく使用できる。"}, {"id": 151, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "イ", "theme": "危険時の通報届出", "question": "（アンモニア250t）この事業所の製造施設が危険な状態となったとき、その事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。", "answer": "○", "law": "法第36条第2項", "explanation": "製造施設が危険な状態となったのを発見した者は、直ちに知事等、警察官、消防等に届け出る義務がある。"}, {"id": 152, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ロ", "theme": "残ガス容器の喪失届", "question": "（アンモニア250t）この事業者は、その占有する液化アンモニアの充填容器を盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならないが、残ガス容器を喪失したときは、その必要はない。", "answer": "×", "law": "法第63条第1項第2号", "explanation": "「容器を喪失し、又は盗まれたとき」の容器には充填容器だけでなく残ガス容器も含まれるため、残ガス容器喪失時も届出が必要（必要はないは誤り）。"}, {"id": 153, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問11", "branch": "ハ", "theme": "特定変更工事の完成検査", "question": "（アンモニア250t）この事業者が都道府県知事等の許可を受けた凝縮器の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であっても、完成検査を受けなければならない特定変更工事である。", "answer": "○", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "毒性・可燃性のアンモニア設備の取替えは完成検査不要工事（冷規第23条）から除外されているため、特定変更工事として完成検査合格が必須。"}, {"id": 154, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "イ", "theme": "機械室のガス滞留防止構造", "question": "（アンモニア250t）この製造設備の圧縮機、油分離器、凝縮器、受液器及びこれらの間の配管が設置してある室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。", "answer": "○", "law": "冷規第7条第1項第3号", "explanation": "毒性・可燃性冷媒設備の主要機器及び連絡配管を設置する専用機械室は、漏えい時に滞留しない換気・開口部構造とする必要がある。"}, {"id": 155, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ロ", "theme": "漏えい検知警報設備の設置", "question": "（アンモニア250t）この製造施設には、その施設から漏えいするガスが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第15号", "explanation": "毒性・可燃性のアンモニア製造施設には、漏えい検知警報設備の設置が義務付けられている。"}, {"id": 156, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問12", "branch": "ハ", "theme": "消火設備の設置免除", "question": "（アンモニア250t）この製造施設は、その規模に応じて、適切な消火設備を適切な箇所に設けなければならない施設に該当しない。", "answer": "×", "law": "冷規第7条第1項第12号", "explanation": "アンモニアは可燃性ガスであるため、規模に応じた消火設備の設置が義務付けられている（該当しないは誤り）。"}, {"id": 157, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "イ", "theme": "受液器の流出防止措置", "question": "（アンモニア250t）この受液器の周囲には、その液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならない。", "answer": "×", "law": "冷規第7条第1項第13号", "explanation": "毒性冷媒の流出防止措置（防液堤等）が必要な受液器は内容積「1万リットル以上」。本事業所は6,000 Lのため義務付けられない（誤り）。"}, {"id": 158, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ロ", "theme": "受液器の丸形ガラス管禁止", "question": "（アンモニア250t）この受液器に設ける液面計には、丸形ガラス管液面計を使用してはならない。", "answer": "○", "law": "冷規第7条第1項第10号", "explanation": "可燃性・毒性ガス（アンモニア）の受液器に設ける液面計は、破損リスク防止のため丸形ガラス管液面計以外のものを使用しなければならない。"}, {"id": 159, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問13", "branch": "ハ", "theme": "耐震設計構造物の該当性", "question": "（アンモニア250t）この受液器は、所定の耐震設計の基準により、地震の影響に対して安全な構造としなければならないものに該当するが、この凝縮器は、その構造としなければならないものに該当しない。", "answer": "○", "law": "冷規第7条第1項第5号", "explanation": "耐震設計が必要な受液器は5,000 L以上（本問6,000 Lで該当）。凝縮器は縦置胴長5m以上が対象であり、本問は横置胴長3mのため該当しない。"}, {"id": 160, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "イ", "theme": "保安責任者の資格要件", "question": "（R134a 600t）冷凍保安責任者には、第一種冷凍機械責任者免状の交付を受け、かつ、1日の冷凍能力が100トン以上の製造施設を使用して行う高圧ガスの製造に関する1年以上の経験を有する者のうちから選任しなければならない。", "answer": "○", "law": "法第27条の4第1項、冷規第36条第1項", "explanation": "認定指定設備Bを除いた設備A（300t）で判定する。300t以上の設備は「1冷免状」＋「100t以上で1年の製造経験」が必要。"}, {"id": 161, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ロ", "theme": "保安責任者代理者の選任時期", "question": "（R134a 600t）選任した冷凍保安責任者が旅行、疾病その他の事故によってその職務を行うことができなくなったときは、遅滞なく、高圧ガスの製造に関する所定の経験を有する者のうちから代理者を選任し、その職務を代行させなければならない。", "answer": "×", "law": "法第33条第1項", "explanation": "代理者は事故が発生してから選任するのではなく、「あらかじめ」選任しておかなければならない（「できなくなったときは遅滞なく選任」は誤り）。"}, {"id": 162, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問14", "branch": "ハ", "theme": "代理者の選任・解任届", "question": "（R134a 600t）冷凍保安責任者を解任し、新たな者を選任したときは、遅滞なく、その解任及び選任の旨を都道府県知事等に届け出なければならないが、冷凍保安責任者の代理者についてはその定めはない。", "answer": "×", "law": "法第33条第3項、法第27条の4第2項", "explanation": "代理者の選任および解任についても、冷凍保安責任者と同様に遅滞なく知事等へ届け出なければならない（定めがないは誤り）。"}, {"id": 163, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "イ", "theme": "保安検査の対象", "question": "（R134a 600t）保安検査は、特定施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われるものであって、製造の方法が所定の技術上の基準に適合しているかどうかについて行う旨の定めはない。", "answer": "○", "law": "法第35条第2項、法第8条第1号", "explanation": "保安検査の対象は特定施設の位置・構造・設備（ハード基準）であり、製造の方法（ソフト基準）は対象に含まれない。"}, {"id": 164, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ロ", "theme": "協会の保安検査受検届", "question": "（R134a 600t）特定施設について高圧ガス保安協会が行う保安検査を受けた場合、高圧ガス保安協会がその検査結果を都道府県知事等に報告することとなっているので、この事業者はその保安検査を受けた旨を都道府県知事等に届け出る必要はない。", "answer": "×", "law": "冷規第41条第3項", "explanation": "協会等の保安検査を受けた第一種製造者は、受検後に自ら「保安検査受検届書」を知事等に提出しなければならない（届出不要は誤り）。"}, {"id": 165, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問15", "branch": "ハ", "theme": "指定設備の定期自主検査", "question": "（R134a 600t）定期自主検査は、認定指定設備である製造設備Bの部分を除く製造施設について実施しなければならない。", "answer": "×", "law": "法第35条の2、冷規第44条第1項・第3項", "explanation": "認定指定設備を使用する者も定期自主検査の義務対象であり、設備Bの部分を除外してはならない（除く製造施設は誤り）。"}, {"id": 166, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問16", "branch": "イ", "theme": "圧縮機取替の軽微変更", "question": "（R134a 600t）製造設備Aの冷媒設備に係る切断、溶接を伴わない圧縮機の取替えの工事であって、その取り替える圧縮機の冷凍能力の変更がない場合は、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第2号", "explanation": "不活性フルオロカーボン設備で、切断溶接なし・能力変更なしの設備取替えは軽微な変更工事に該当し、事後遅滞なく届け出ればよい。"}, {"id": 167, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問16", "branch": "ロ", "theme": "指定設備増設の軽微変更", "question": "（R134a 600t）この製造施設に製造設備Bと同じ製造設備Cを増設し、製造設備A及び製造設備Bとブラインを共通にするときは、軽微な変更の工事として、その完成後遅滞なく、都道府県知事等に届け出ればよい。", "answer": "○", "law": "法第14条第2項、冷規第17条第1項第4号", "explanation": "認定指定設備の設置工事は軽微な変更の工事に該当するため、完成後遅滞なく知事等へ届け出ればよい。"}, {"id": 168, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問16", "branch": "ハ", "theme": "切断溶接伴う工事の完成検査", "question": "（R134a 600t）製造設備Aの圧縮機の取替えの工事において、冷媒設備の切断、溶接を伴う場合であって、その取り替える圧縮機の冷凍能力の変更がない場合は、都道府県知事等の許可を受けなければならないが、その変更の工事の完成検査は受けなくてよい。", "answer": "×", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "冷媒設備の切断・溶接を伴う取替え工事は特定変更工事となり、完成検査の受検・合格が必須である（完成検査は受けなくてよいは誤り）。"}, {"id": 169, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問17", "branch": "イ", "theme": "日常点検の頻度", "question": "（R134a 600t）製造設備Bは、自動制御装置が設けられた認定指定設備であるため、製造設備Bにおける高圧ガスの製造は、1か月に1回、異常の有無を点検して行えばよい。", "answer": "×", "law": "冷規第9条第2号", "explanation": "日常の異常点検は「1日に1回以上」行う必要があり、自動制御装置付き認定指定設備であっても月1回への猶予規定はない（誤り）。"}, {"id": 170, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問17", "branch": "ロ", "theme": "安全弁止め弁の全開義務", "question": "（R134a 600t）冷媒設備の安全弁の修理又は清掃のため特に必要な場合を除き、その安全弁に付帯して設けた止め弁は、常に全開しておかなければならない。", "answer": "○", "law": "冷規第9条第1号", "explanation": "安全弁に付帯する止め弁は、修理・清掃時を除き「常に全開」にしておかなければならない。"}, {"id": 171, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問17", "branch": "ハ", "theme": "清掃作業時の作業計画", "question": "（R134a 600t）冷媒設備の修理を行うときは、その作業計画及びその作業の責任者を定めなければならないが、冷媒設備を開放して清掃を行うときは、あらかじめその作業の責任者を定め、かつ、その責任者の監視の下に作業を行えば、その作業計画を定める必要はない。", "answer": "×", "law": "冷規第9条第3号イ", "explanation": "作業計画及び責任者の決定義務は「修理又は清掃」の両方に課されており、清掃時に作業計画を定めなくてよい規定はない（誤り）。"}, {"id": 172, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問18", "branch": "イ", "theme": "油圧系統の圧力計免除", "question": "（R134a 600t）冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その圧縮機の油圧系統には圧力計を設けなくてもよいが、その油圧系統を除く冷媒設備には圧力計を設けなければならない。", "answer": "○", "law": "冷規第7条第1項第7号", "explanation": "油圧保護装置（OPS）がある場合に圧力計が免除されるのは「当該油圧系統」のみであり、それ以外の冷媒設備には圧力計の設置が必須である。"}, {"id": 173, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問18", "branch": "ロ", "theme": "安全装置の作動圧力基準", "question": "（R134a 600t）冷媒設備には、その設備内の冷媒ガスの圧力が耐圧試験の圧力を超えた場合に直ちにその圧力以下に戻すことができる安全装置を設けなければならない。", "answer": "×", "law": "冷規第7条第1項第8号", "explanation": "安全装置が作動して復帰させるべき基準圧力は「許容圧力」である（「耐圧試験の圧力」は誤り）。"}, {"id": 174, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問18", "branch": "ハ", "theme": "バルブ適切操作措置", "question": "（R134a 600t）製造設備に設けたバルブ又はコック（自動制御で開閉されるものを除く）に作業員がそのバルブ又はコックを適切に操作することができるような措置を講じなければならない旨の定めは、遠心式圧縮機を用いるこの製造設備には適用されない。", "answer": "×", "law": "冷規第7条第1項第17号", "explanation": "バルブの適切操作措置（開閉方向表示、識別等）の義務は遠心式圧縮機を用いる設備にも適用される（適用されないは誤り）。"}, {"id": 175, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問19", "branch": "イ", "theme": "火気隔離基準の適用", "question": "（R134a 600t）製造設備Bは、不活性ガスであるフルオロカーボン134aを冷媒ガスに使用している認定指定設備であるので、その圧縮機には、「引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所及び火気（その製造設備内のものを除く。）の付近にないこと。」の定めは適用されない。", "answer": "×", "law": "冷規第7条第1項第1号、同条第2項", "explanation": "火気・可燃物集積場所からの隔離義務は冷媒ガスの種類によらず全設備に適用され、認定指定設備にも適用される（誤り）。"}, {"id": 176, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問19", "branch": "ロ", "theme": "警戒標の掲示免除", "question": "（R134a 600t）製造設備を設置した室に外部から容易に立ち入ることができない措置が講じてあれば、製造施設の外部から見やすい場所に警戒標を設ける必要はない。", "answer": "×", "law": "冷規第7条第1項第2号", "explanation": "警戒標の掲示義務は、室への立入防止措置を講じていても免除されない（設ける必要はないは誤り）。"}, {"id": 177, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問19", "branch": "ハ", "theme": "配管工事の気密試験圧力", "question": "（R134a 600t）製造設備Aの冷媒設備の配管の変更の工事の完成検査において気密試験を行うときは、その気密試験の圧力は許容圧力以上の圧力でなければならない。", "answer": "○", "law": "冷規第7条第1項第6号", "explanation": "完成検査における気密試験は「許容圧力以上の圧力」で行わなければならない。"}, {"id": 178, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問20", "branch": "イ", "theme": "指定設備の組立場所", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つに、「冷媒設備は使用場所であるこの事業所において、脚上又は1つの架台上に組み立てられたものであること。」がある。", "answer": "×", "law": "冷規第57条第3号", "explanation": "指定設備は「製造業者の事業所において」脚上又は一つの架台上に組み立てられたものでなければならない（「使用場所である事業所において」は誤り）。"}, {"id": 179, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問20", "branch": "ロ", "theme": "指定設備の試運転・搬入", "question": "（R134a 600t・設備B）この製造設備が認定指定設備である条件の一つに、「冷媒設備は、その設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されるものであること。」がある。", "answer": "○", "law": "冷規第57条第5号", "explanation": "製造業者の事業所で試運転を行い、現場へ分割されずに一体搬入されることが構造条件として規定されている。"}, {"id": 180, "subject": "法令", "year": "2018年度(平成30年)", "q_num": "問20", "branch": "ハ", "theme": "認定証の返納義務", "question": "（R134a 600t・設備B）この製造設備に変更の工事を施したとき又はこの製造設備を移設したときは、指定設備認定証を返納しなければならない場合がある。", "answer": "○", "law": "冷規第62条第1項・第2項", "explanation": "同等部品交換等を除く変更工事や、基準適合書の交付を受けない移設を行った場合は認定証が無効となり、返納しなければならない。"}, {"id": 181, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "イ", "theme": "法の目的", "question": "高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。", "answer": "○", "law": "法第1条", "explanation": "法第1条（目的）に合致する。行政による規制と民間事業者・協会による自主的保安活動の促進が公共安全確保の2大支柱である。"}, {"id": 182, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "ロ", "theme": "適用除外", "question": "1日の冷凍能力が4トンの冷凍設備内における高圧ガスであるフルオロカーボン（不活性のもの）は、高圧ガス保安法の適用を受けない。", "answer": "○", "law": "法第3条第1項第8号、令第2条第3項第4号", "explanation": "不活性フルオロカーボン及び二酸化炭素は、冷凍能力3トン以上5トン未満の設備内の高圧ガスが適用除外となるため正。"}, {"id": 183, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問1", "branch": "ハ", "theme": "施設譲渡と知事許可", "question": "第一種製造者から高圧ガスの製造施設の全部の引渡しを受けた者は、その施設が既に完成検査を受けている場合にあっては、都道府県知事の許可を受けることなくその施設を使用することができる。", "answer": "×", "law": "法第5条第1項、法第20条第2項", "explanation": "施設の全部の引渡しを受けた者は、新規に都道府県知事の許可を受けなければならない（許可を受けることなく使用できるは誤り）。"}, {"id": 184, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "イ", "theme": "高圧ガス定義", "question": "常用の温度において圧力が0.9メガパスカルの圧縮ガス（圧縮アセチレンガスを除く。）であっても、温度35度において圧力が1メガパスカル以上となるものは高圧ガスである。", "answer": "○", "law": "法第2条第1号", "explanation": "圧縮ガスは温度35度において圧力が1 MPa以上となるものであれば高圧ガスに該当する。"}, {"id": 185, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "ロ", "theme": "製造方法の変更許可", "question": "第一種製造者は、その製造の方法を変更しようとするときは、都道府県知事の許可を受ける必要はないが、軽微な変更として変更後遅滞なく、その旨を都道府県知事に届け出なければならない。", "answer": "×", "law": "法第14条第1項", "explanation": "第一種製造者が「製造の方法」を変更しようとするときは、事前に都道府県知事の「許可」を受けなければならない（事後届出ではない）。"}, {"id": 186, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問2", "branch": "ハ", "theme": "液化ガスの定義", "question": "液化ガスであって、その圧力が0.2メガパスカルとなる場合の温度が35度以下であるものは、常用の温度において圧力が0.2メガパスカル未満であっても高圧ガスである。", "answer": "○", "law": "法第2条第3号", "explanation": "液化ガスは「圧力が0.2 MPaとなる温度が35度以下」であれば、常用温度での圧力に関わらず高圧ガスに該当する。"}, {"id": 187, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "イ", "theme": "輸入検査の届出と移動", "question": "容器に充てんされた高圧ガスの輸入をした者は、輸入をした高圧ガス及びその容器について、指定輸入検査機関が行う輸入検査を受け、これらが輸入検査技術基準に適合していると認められ、その旨を都道府県知事に届け出た場合は、都道府県知事が行う輸入検査を受けることなく、その高圧ガスを移動することができる。", "answer": "○", "law": "法第22条第1項第1号", "explanation": "指定輸入検査機関等の検査に適合し知事へ届出を行った場合は、知事の輸入検査を受けることなく高圧ガスを移動できる。"}, {"id": 188, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "ロ", "theme": "地位承継", "question": "第一種製造者について合併があり、その合併により新たに法人を設立した場合、その法人は第一種製造者の地位を承継する。", "answer": "○", "law": "法第10条第1項", "explanation": "第一種製造者について合併があった場合、合併により設立した法人は第一種製造者の地位を承継する。"}, {"id": 189, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問3", "branch": "ハ", "theme": "販売事業の事前届出", "question": "高圧ガスの販売の事業を営む者は、販売所ごとに、事業の開始後遅滞なく、その旨を都道府県知事に届け出なければならない。", "answer": "×", "law": "法第20条の4第1項", "explanation": "販売事業の届出は事後ではなく「事業開始の日の20日前までに」行わなければならない（誤り）。"}, {"id": 190, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "イ", "theme": "第二種製造能力の最小値", "question": "冷凍設備（認定指定設備を除く。）を使用して高圧ガスの製造をしようとする者が、その旨を都道府県知事に届け出なければならない場合の1日の冷凍能力の最小の値は、その冷媒ガスの種類がフルオロカーボン（不活性のものに限る。）とアンモニアとでは異なる。", "answer": "○", "law": "法第5条第2項第2号、令第4条", "explanation": "届出が必要な最小能力は不活性フルオロカーボンが20トン以上、アンモニアが5トン以上であり異なるため正。"}, {"id": 191, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "ロ", "theme": "第二種ガス種変更の届出", "question": "第二種製造者が、製造をする高圧ガスの種類を変更しようとするとき、その旨を都道府県知事に届け出るべき定めはない。", "answer": "×", "law": "法第14条第4項", "explanation": "第二種製造者が製造する高圧ガスの種類を変更しようとするときは、「あらかじめ都道府県知事に届け出なければならない」（定めがないは誤り）。"}, {"id": 192, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問4", "branch": "ハ", "theme": "第二種保安責任者の選任", "question": "全ての第二種製造者は、冷凍保安責任者を選任する必要はない。", "answer": "×", "law": "法第27条の4第1項第2号、冷規第36条第3項", "explanation": "アンモニア等で冷凍能力20トン以上50トン未満（通常設備）の第二種製造者には選任義務がある（「全ての第二種が選任不要」は誤り）。"}, {"id": 193, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "イ", "theme": "車両移動", "question": "高圧ガスを移動する場合、充てん容器及び残ガス容器には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならない。", "answer": "○", "law": "一般則第50条第5号、同第6条第1項第42号", "explanation": "「充てん容器等（充てん容器及び残ガス容器）」には衝撃防止・転倒防止措置および粗暴な取扱いの禁止が義務付けられている。"}, {"id": 194, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "ロ", "theme": "車両警戒標の適用ガス", "question": "高圧ガスを移動する車両の見やすい箇所に警戒標を掲げなければならない高圧ガスは、可燃性ガス及び毒性ガスの2種類である。", "answer": "×", "law": "法第23条第2項、一般則第50条第1号", "explanation": "警戒標の掲示義務は不活性ガス等を含むすべての高圧ガスに適用される（2種類に限られないため誤り）。"}, {"id": 195, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問5", "branch": "ハ", "theme": "移動時携行品", "question": "液化アンモニアを移動するときは、防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等のほか、消火設備を携行しなければならないが、液化フルオロカーボン134aを移動するときはその定めはない。", "answer": "○", "law": "一般則第50条第9号・第10号", "explanation": "毒性・可燃性の液化アンモニア移動時には保護具・消火設備の携行が義務付けられるが、不活性のR134aには携行義務がない。"}, {"id": 196, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "イ", "theme": "刻印記号TPの意味", "question": "容器検査に合格した容器に刻印されている「TP2.9M」は、その容器の最高充てん圧力が2.9メガパスカルであることを表している。", "answer": "×", "law": "容規第8条第1項第11号・第12号", "explanation": "「TP」は耐圧試験圧力（Test Pressure）。最高充てん圧力は「FP」（Filling Pressure）であるため誤り。"}, {"id": 197, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "ロ", "theme": "溶接容器再検査周期", "question": "液化フルオロカーボンを充てんする溶接容器の容器再検査の期間は、その容器の製造後の経過年数にかかわらず、5年である。", "answer": "×", "law": "法第48条第1項第5号、容規第24条第1項第1号", "explanation": "溶接容器の再検査期間は製造後20年未満は5年、20年以上は2年と経過年数に応じて定められている（かかわらず5年は誤り）。"}, {"id": 198, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問6", "branch": "ハ", "theme": "アンモニア容器外面表示", "question": "液化アンモニアを充てんする容器に表示をすべき事項のうちには、その容器の表面積の2分の1以上についての白色の塗色及びその高圧ガスの性質を示す文字「燃」、「毒」の明示がある。", "answer": "○", "law": "容規第10条第1項第1号・第2号ロ", "explanation": "アンモニア容器の外面は表面積の1/2以上を白塗りとし、性質文字「燃」「毒」を明示しなければならない。"}, {"id": 199, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "イ", "theme": "車両上の容器貯蔵禁止", "question": "車両に固定した容器により高圧ガスを貯蔵することは禁じられているが、車両に積載した容器により高圧ガスを貯蔵することはいかなる場合でも禁じられていない。", "answer": "×", "law": "法第15条第1項、一般則第18条第2号ホ", "explanation": "原則として、船・車両等に「固定し、又は積載した容器」による貯蔵は禁じられている（積載容器は禁じられていないは誤り）。"}, {"id": 200, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "ロ", "theme": "容器置場の区分配置", "question": "液化フルオロカーボンの充てん容器は、残ガス容器と区分して容器置場に置く必要はない。", "answer": "×", "law": "一般則第6条第2項第8号イ", "explanation": "充てん容器等は、充てん容器及び残ガス容器にそれぞれ区分して置かなければならない（不活性フルオロカーボンも対象）。"}, {"id": 201, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問7", "branch": "ハ", "theme": "貯蔵容器転倒防止", "question": "充てん容器及び残ガス容器（それぞれ内容積が5リットルを超えるもの）には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならない。", "answer": "○", "law": "一般則第6条第2項第8号ト", "explanation": "内容積5リットルを超える充てん容器及び残ガス容器には、転倒防止措置および粗暴な取扱いの禁止が義務付けられている。"}, {"id": 202, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "イ", "theme": "冷凍能力算定式", "question": "圧縮機の原動機の定格出力の数値は、遠心式圧縮機を使用する冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第1号", "explanation": "遠心式圧縮機（第1号設備）の1日の冷凍能力は、原動機の定格出力（W）に所定数値を乗じて算定する。"}, {"id": 203, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "ロ", "theme": "冷凍能力算定式", "question": "圧縮機の標準回転速度における1時間のピストン押しのけ量の数値は、回転ピストン型圧縮機を使用する冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "○", "law": "冷規第5条第4号", "explanation": "回転ピストン型等の容積式圧縮機（第4号設備）は、ピストン押しのけ量（V）を用いて算定する。"}, {"id": 204, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問8", "branch": "ハ", "theme": "冷凍能力算定式", "question": "冷媒設備内の冷媒ガスの充てん量の数値は、自然環流式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。", "answer": "×", "law": "冷規第5条第3号", "explanation": "自然環流式（第3号設備）の冷凍能力は蒸発器表面積（A）により算定し、冷媒充てん量による算定規定はない。"}, {"id": 205, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "イ", "theme": "危害予防規程の遵守対象", "question": "（アンモニア250t）この事業者が定めた危害予防規程を守るべき者は、この事業者、その従業者及び協力会社の従業者であると定められている。", "answer": "×", "law": "法第26条第3項", "explanation": "法で直接遵守義務が課されているのは「第一種製造者及びその従業者」であり、協力会社の従業者は含まれない（誤り）。"}, {"id": 206, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "ロ", "theme": "保安教育計画の届出不要", "question": "（アンモニア250t）この事業者は、従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、都道府県知事へ届け出るべき定めはない。", "answer": "○", "law": "法第27条第1項・第3項", "explanation": "保安教育計画の策定・忠実実行は義務付けられているが、都道府県知事への届出義務は定められていない。"}, {"id": 207, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問9", "branch": "ハ", "theme": "危険時の通報届出", "question": "（アンモニア250t）この事業所の製造施設が危険な状態になったとき、その事態を発見した者は、直ちに、その旨を都道府県知事又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。", "answer": "○", "law": "法第36条第2項", "explanation": "製造施設が危険な状態となったのを発見した者は、直ちに知事、警察、消防等に届け出なければならない。"}, {"id": 208, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "イ", "theme": "災害発生時の届出義務", "question": "（アンモニア250t）この事業者は、この製造施設の高圧ガスについて災害が発生したとき、遅滞なく、その旨を都道府県知事又は警察官に届け出なければならない。", "answer": "○", "law": "法第63条第1項第1号", "explanation": "高圧ガスについて災害が発生したときは、遅滞なく都道府県知事又は警察官に届け出なければならない。"}, {"id": 209, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "ロ", "theme": "火気取扱制限", "question": "（アンモニア250t）この事業者がこの事業所内において指定した場所では、その事業所に選任された冷凍保安責任者を除き、何人も火気を取り扱ってはならない。", "answer": "×", "law": "法第37条第1項", "explanation": "指定場所での火気取扱禁止は「何人も」対象であり、冷凍保安責任者であっても例外なく禁止される（誤り）。"}, {"id": 210, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問10", "branch": "ハ", "theme": "異常時記録の保存期間", "question": "（アンモニア250t）この事業者は、この事業所に所定の帳簿を備え、製造施設に異常があった場合、その年月日及びそれに対してとった措置を帳簿に記載し、記載の日から10年間保存しなければならない。", "answer": "○", "law": "法第60条第1項、冷規第65条", "explanation": "第一種製造者の異常時記録帳簿は、記載の日から10年間の保存が義務付けられている。"}, {"id": 211, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "イ", "theme": "施設引渡時の完成検査", "question": "（アンモニア250t）既に完成検査を受け所定の技術上の基準に適合していると認められているこの製造施設の全部の引渡しがあった場合、その引渡しを受けた者は、その旨を都道府県知事に届け出た後、完成検査を受けることなく、この製造施設を使用することができる。", "answer": "×", "law": "法第5条第1項、法第20条第2項", "explanation": "引渡しを受けた者は「届出」ではなく新規に知事の「許可」を受けなければ、完成検査を受けずに使用することはできない（誤り）。"}, {"id": 212, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "ロ", "theme": "圧縮機取替の軽微変更除外", "question": "（アンモニア250t）この製造施設の冷媒設備の圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであっても、定められた軽微な変更の工事には該当しない。", "answer": "○", "law": "法第14条第1項、冷規第17条第1項第2号", "explanation": "アンモニア（毒性・可燃性）設備は軽微な変更から除外されているため、切断溶接や能力変更がなくても軽微工事には該当しない。"}, {"id": 213, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問11", "branch": "ハ", "theme": "特定変更工事の完成検査", "question": "（アンモニア250t）この製造施設の冷媒設備の凝縮器の取替えの工事において、冷媒設備に係る切断、溶接を伴わない工事をしようとするときは、都道府県知事の許可を受けなければならないが、その変更の工事の完成検査は受ける必要はない。", "answer": "×", "law": "法第14条第1項、法第20条第3項、冷規第23条", "explanation": "アンモニア設備は完成検査不要工事（冷規第23条）から除外されており、特定変更工事として完成検査合格が必要（誤り）。"}, {"id": 214, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "イ", "theme": "機械室の滞留防止構造", "question": "（アンモニア250t）この製造設備の圧縮機、油分離器、凝縮器、受液器及びこれらの間の配管が設置してある室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。", "answer": "○", "law": "冷規第7条第1項第3号", "explanation": "毒性・可燃性のアンモニア設備を設置する機械室は、漏えい時にガスが滞留しない構造（開口部・機械換気等）としなければならない。"}, {"id": 215, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "ロ", "theme": "耐震設計構造物の該当性", "question": "（アンモニア250t）この受液器及びその支持構造物は、所定の耐震設計の基準により、地震の影響に対して安全な構造としなければならないものに該当しない。", "answer": "×", "law": "冷規第7条第1項第5号", "explanation": "受液器は内容積5,000 L以上（本問6,000 L）で耐震設計義務がある（該当しないは誤り）。"}, {"id": 216, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問12", "branch": "ハ", "theme": "受液器液面計の二重措置", "question": "（アンモニア250t）この受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計に破損を防止するための措置か、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置のいずれか一方の措置を講じることと定められている。", "answer": "×", "law": "冷規第7条第1項第10号・第11号", "explanation": "アンモニア受液器では、丸形以外の液面計とし「破損防止措置」と「自動閉止弁等の漏えい防止措置」の両方を講じる必要がある（いずれか一方は誤り）。"}, {"id": 217, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "イ", "theme": "防爆構造電気設備の除外", "question": "（アンモニア250t）この冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものでなければならないものに該当する。", "answer": "×", "law": "冷規第7条第1項第14号", "explanation": "電気設備の防爆構造義務は「可燃性ガス（アンモニアを除く。）」と規定されており、アンモニア設備は除外されている（誤り）。"}, {"id": 218, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ロ", "theme": "安全弁放出管の設置", "question": "（アンモニア250t）この冷媒設備の安全弁（大気に冷媒ガスを放出することのないものを除く。）には、放出管を設けなければならない。また、放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。", "answer": "○", "law": "冷規第7条第1項第9号", "explanation": "アンモニア設備の安全弁には放出管を設け、開口部はガスの性質に応じた安全な位置としなければならない。"}, {"id": 219, "subject": "法令", "year": "2017年度(平成29年)", "q_num": "問13", "branch": "ハ", "theme": "警報器設置に
